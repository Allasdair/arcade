<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f2f1ee" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<title>Linefall</title>
<!--FONTS-->
<style>
:root{--bg:#f2f1ee;--panel:#fff;--ink:#1c1c1e;--sub:#8a8a90;--accent:#2b2f3a;--accentInk:#fff;--line:rgba(0,0,0,.08);--gold:#e8a913;--bez:#3b4250;--bezHi:#4d5566;--bezInk:#e9ecf2;--btn:#1f232b;--btnHi:#2c313b;--ab:#d2553f;--abInk:#fff}
.dark{--bg:#101114;--panel:#1b1c20;--ink:#f2f2f4;--sub:#8d8e96;--accent:#e9eaee;--accentInk:#15161a;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
textarea{width:100%;font:12px/1.4 'JetBrains Mono',monospace;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:none;-webkit-user-select:text;user-select:text}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;flex:1;padding:16px 16px 36px;max-width:560px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h2{font-size:24px;font-weight:800;letter-spacing:-.03em;flex:1;min-width:0}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 0 16px}
.brand h1{font-size:42px;font-weight:800;letter-spacing:-.045em;line-height:1}
.brand p{color:var(--sub);font-size:14px;margin-top:8px;line-height:1.35}
.acts{display:flex;gap:8px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.backbtn{height:36px;padding:0 12px 0 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-bottom:6px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:22px 4px 10px;display:flex;justify-content:space-between;gap:8px}
.label span{letter-spacing:.02em;text-transform:none;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 15px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:10px;transition:transform .12s;min-width:0}
button.card:active{transform:scale(.98)}
.card .t{font-weight:700;font-size:17px;letter-spacing:-.01em}
.card .s{color:var(--sub);font-size:13px;margin-top:2px;line-height:1.3;overflow-wrap:anywhere}
.card .grow{flex:1;min-width:0}
.card .r{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex:none;max-width:42%}
.card .r b{display:block;font-size:15px}
.card .r span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.card.dim{opacity:.55}
.ico{width:42px;height:42px;border-radius:12px;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.ico svg{width:26px;height:26px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row3 .card{flex-direction:column;align-items:flex-start;gap:8px;margin:0;padding:12px}
.row3 .card .t{font-size:14px}
.lvl .badge{width:50px;height:50px;border-radius:15px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.primary{background:var(--accent);color:var(--accentInk);border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;width:100%;transition:transform .12s}
.primary:active{transform:scale(.98)}
.ghost{background:var(--bg);border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;width:100%}
.btns{display:flex;gap:8px;margin-top:14px}
.btns>*{flex:1}
.seg{display:flex;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;padding:9px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);min-width:0}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.dark .seg button.on{background:#2a2b31}
.opt{margin:12px 0}
.opt>.h{font-size:12px;font-weight:700;color:var(--sub);margin:0 2px 6px;display:flex;justify-content:space-between;gap:8px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;width:100%;font-weight:600;font-size:15px;text-align:left}
.srow .d{font-size:12.5px;color:var(--sub);font-weight:500;margin-top:2px}
.srow>div{min-width:0}
.sw{width:46px;height:28px;border-radius:99px;background:var(--bg);position:relative;transition:background .2s;flex:none;border:1px solid var(--line)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--sub);transition:left .2s,background .2s}
.sw.on{background:var(--accent)}.sw.on::after{left:21px;background:var(--accentInk)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 14px;margin-bottom:10px}
.box .srow+.srow{border-top:1px solid var(--line)}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px;white-space:nowrap}
.stars .o{color:var(--sub);opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;max-width:100%}
.chip.on{background:var(--accent);color:var(--accentInk);border-color:transparent}
.chip.lock{opacity:.5}
.chip .sw2{width:16px;height:16px;border-radius:5px;flex:none}
.topseg{background:var(--panel);border:1px solid var(--line);margin:0 0 14px;flex-wrap:nowrap}
.topseg button{font-size:12px;padding:9px 3px;flex:1 1 auto;white-space:nowrap;letter-spacing:-.01em}
.topseg button.on{background:var(--accent);color:var(--accentInk)}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px;text-align:left;position:relative;transition:transform .12s}
.tcard:active{transform:scale(.98)}
.tcard canvas{width:100%;aspect-ratio:7/4;border-radius:12px;display:block}
.tcard .n{font-weight:700;font-size:14px;margin:9px 5px 2px}
.tcard .q{font-size:11.5px;color:var(--sub);margin:0 5px 5px;line-height:1.3;min-height:2.6em}
.tcard.sel{box-shadow:0 0 0 2.5px var(--accent)}
.tcard.locked canvas{filter:grayscale(.9);opacity:.45}
.tcard .big{aspect-ratio:7/4;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.tcard .big svg.i{width:38px;height:38px;stroke-width:1.6}
.tcard.locked .big{opacity:.45}
.tcard.playing .big{opacity:.4}.tcard.playing .big svg.i{animation:fxwait 1s ease-in-out infinite}
@keyframes fxwait{50%{transform:scale(.82)}}
.lock{position:absolute;top:13px;right:13px;width:28px;height:28px;border-radius:9px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.lock svg.i{width:15px;height:15px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 0;border-radius:10px;font-weight:700;font-size:13px;color:var(--sub);min-width:0}
.tabs button.on{background:var(--accent);color:var(--accentInk)}
.lvcard .num{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.lvcard.fin .num{background:var(--accent);color:var(--accentInk)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
.tbl th{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700;border:0}
.tbl td:first-child,.tbl th:first-child{text-align:left;font-weight:600}
.ach{display:flex;gap:12px;align-items:center;padding:10px 2px}
.ach+.ach{border-top:1px solid var(--line)}
.ach .m{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none;font-size:16px}
.ach.done .m{background:var(--gold);color:#3a2a00}
.ach .n{font-weight:700;font-size:14.5px}.ach .d{color:var(--sub);font-size:12.5px;margin-top:1px}
/* sheets */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:0 0 env(safe-area-inset-bottom)}
#ov.on{display:flex}
#sheet{background:var(--panel);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px 20px;max-height:92vh;overflow-y:auto;overflow-x:hidden;animation:up .22s ease-out}
@media (min-height:700px) and (min-width:600px){ #ov{align-items:center} #sheet{border-radius:24px} }
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
#sheet .sub{color:var(--sub);font-size:14px;line-height:1.4;margin-bottom:12px}
.goal{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px;font-weight:600}
.goal .st{font-size:18px;color:var(--sub);opacity:.4;width:22px;text-align:center;flex:none}
.goal.got .st{color:var(--gold);opacity:1}
.goal.new .st{animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--bg);border-radius:12px;padding:9px 6px;text-align:center;min-width:0}
.kv b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.kv span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.howto p{font-size:14px;line-height:1.5;margin:6px 0}
.howto p+p{margin-top:8px}
.howto h3{font-size:15px;margin:14px 0 4px}
#toast{position:fixed;left:50%;top:0;transform:translate(-50%,calc(-100% - env(safe-area-inset-top) - 20px));opacity:0;background:var(--accent);color:var(--accentInk);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:40;transition:transform .35s,opacity .35s;max-width:calc(100vw - 24px);text-align:center;pointer-events:none;margin-top:calc(env(safe-area-inset-top) + 10px)}
#toast.on{transform:translate(-50%,0);opacity:1}
#fxc{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
/* ===== console ===== */
#game{background:var(--bg)}
#game.on{display:flex}
.console{flex:1;display:flex;flex-direction:column;min-height:0;margin:6px 8px 8px;border-radius:26px 26px 44px 26px;background:linear-gradient(170deg,var(--bezHi),var(--bez) 45%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.18),0 8px 24px rgba(0,0,0,.18);padding:12px 12px 10px;transition:box-shadow .2s}
.console.pulse{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 0 3px var(--ab),0 0 30px var(--ab)}
.scrwrap{flex:0 0 57%;min-height:0;display:flex;flex-direction:column;background:#1b1d22;border-radius:14px 14px 30px 14px;padding:10px 12px 8px;box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.scrhead{display:flex;align-items:center;gap:8px;color:#8d93a0;font-size:9px;font-weight:700;letter-spacing:.14em;margin:0 2px 6px}
.led{width:7px;height:7px;border-radius:50%;background:#e5484d;box-shadow:0 0 6px #e5484d}
.led.off{background:#4a3a3a;box-shadow:none}
.scr{flex:1;min-height:0;position:relative;border-radius:6px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.logo{text-align:left;color:var(--bezInk);font-weight:800;font-size:15px;letter-spacing:.32em;margin:10px 6px 0;opacity:.85}
.logo i{font-style:normal;font-weight:500;letter-spacing:.12em;font-size:9px;opacity:.65;margin-left:6px}
#zone{flex:1;min-height:150px;position:relative;touch-action:none;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;align-items:center;padding:4px 4px 0;-webkit-user-select:none;user-select:none}
#zone.lefty .dpad{order:2}#zone.lefty .ab{order:1}
.dpad{justify-self:center;display:grid;grid-template:repeat(3,var(--b)) / repeat(3,var(--b));--b:52px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
#zone.lg .dpad,#zone.lg .ab{--b:62px}
.dpad button{background:var(--btn);color:#9aa1ad;display:grid;place-items:center;touch-action:none}
.dpad button svg{width:22px;height:22px;fill:currentColor;stroke:none}
.dpad .u{grid-area:1/2;border-radius:8px 8px 0 0}.dpad .l{grid-area:2/1;border-radius:8px 0 0 8px}.dpad .r{grid-area:2/3;border-radius:0 8px 8px 0}.dpad .d{grid-area:3/2;border-radius:0 0 8px 8px}
.dpad .c{grid-area:2/2;background:var(--btn)}
.dpad button.down,.ab button.down,.pills button.down{background:var(--btnHi);transform:translateY(2px)}
.ab{justify-self:center;display:flex;gap:16px;align-items:center;--b:52px}
.ab button{width:calc(var(--b)*1.18);height:calc(var(--b)*1.18);border-radius:50%;background:var(--ab);color:var(--abInk);font-weight:800;font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.28);touch-action:none;display:grid;place-items:center;line-height:1}
.ab button small{display:block;font-size:8.5px;font-weight:700;letter-spacing:.06em;opacity:.8;margin-top:2px}
.ab button.down{background:var(--ab);filter:brightness(.85);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.pills{grid-column:1/3;display:flex;justify-content:center;gap:22px;padding:8px 0 6px}
.pills button{min-width:64px;height:26px;border-radius:99px;background:var(--btn);color:#a8aebb;font-size:9.5px;font-weight:800;letter-spacing:.1em;touch-action:none;padding:0 12px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.pills label{display:block;text-align:center;font-size:9px;letter-spacing:.12em;color:var(--bezInk);opacity:.7;font-weight:700;margin-top:5px}
.swipehint{grid-column:1/3;align-self:stretch;display:none;place-items:center;text-align:center;color:var(--bezInk);opacity:.45;font-size:12px;font-weight:600;line-height:1.5;border:1.5px dashed rgba(255,255,255,.25);border-radius:18px;margin:6px 4px}
#zone.swipe .dpad,#zone.swipe .ab{display:none}
#zone.swipe .swipehint{display:grid}
#zone.donly .ab{visibility:hidden}
/* landscape / desktop: a wide console, screen in the middle, controls either side */
@media (min-aspect-ratio:5/4){
 .console{display:grid;grid-template-columns:minmax(170px,1fr) minmax(0,3.2fr) minmax(170px,1fr);grid-template-rows:minmax(0,1fr) auto;border-radius:40px;padding:14px 18px;max-width:1200px;margin:8px auto;width:calc(100% - 16px)}
 .scrwrap{grid-column:2;grid-row:1;min-height:0}
 .logo{display:none}
 #zone{display:contents}
 #zone .dpad{grid-column:1;grid-row:1;align-self:center;justify-self:center}
 #zone .ab{grid-column:3;grid-row:1;align-self:center;justify-self:center}
 #zone.lefty .dpad{grid-column:3}#zone.lefty .ab{grid-column:1}
 #zone .pills{grid-column:2;grid-row:2;padding:10px 0 0}
 #zone .swipehint{grid-column:1;grid-row:1;margin:0 12px;min-height:200px}
 #zone.lefty .swipehint{grid-column:3}
}
.scr .cd{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:800 64px/1 Inter,sans-serif;text-shadow:0 4px 20px rgba(0,0,0,.5);pointer-events:none}
</style>
</head>
<body>
<div id="toast"></div>
<canvas id="fxc"></canvas>

<!-- HOME -->
<section class="screen on" id="home"><div class="scroll">
  <button class="backbtn" id="arcadeBtn" hidden><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Arcade</button>
  <div class="brand"><div><h1 data-raw>Linefall</h1><p>Stack, clear, keep it falling.</p></div>
    <div class="acts"><button class="iconbtn" id="styleBtn" aria-label="Style"><svg class="i" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 000 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A5.6 5.6 0 0022 9.8C22 5.5 17.5 2 12 2z"/></svg></button>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button></div></div>
  <div id="homeBody"></div>
</div></section>

<section class="screen" id="camp"><div class="scroll" id="campBody"></div></section>
<section class="screen" id="records"><div class="scroll" id="recBody"></div></section>
<section class="screen" id="progress"><div class="scroll" id="progBody"></div></section>
<section class="screen" id="style"><div class="scroll"><div class="top"><button class="iconbtn" data-home aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><h2>Style</h2><span class="stars" style="color:var(--sub);font-weight:700" id="sCount"></span></div><div class="seg topseg" id="styleTabs"></div><div id="styleBody"></div></div></section>
<section class="screen" id="set"><div class="scroll" id="setBody"></div></section>

<!-- GAME: a handheld console. The screen shows the game only; the control zone is the only in-game touch area. -->
<section class="screen" id="game">
  <div class="console" id="console">
    <div class="scrwrap"><div class="scrhead" data-raw><span class="led" id="led"></span><span>POWER</span></div>
      <div class="scr" id="scr"><canvas id="cv"></canvas><div class="cd" id="cd"></div></div></div>
    <div class="logo" data-raw>LINEFALL<i>HANDHELD</i></div>

// ===================== NAVIGATION =====================
// Android back: in a game it pauses first; then it closes a sheet; then it returns home; then (home, in Arcade) goes to Arcade.
let cur='home', sheetOn=false, guarded=false;
function show(id){ $$('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); cur=id; guard(); }
const needGuard=()=>ARCADE||cur!=='home'||sheetOn;
function guard(){ if(needGuard()&&!guarded){ try{ history.pushState({lf:1},''); guarded=true; }catch(e){} } }
addEventListener('popstate',()=>{ guarded=false; back(); guard(); });
function backToPause(){ Object.assign(G.st.cfg,handling()); show('game'); applyLook(); resize(); G.state='count'; pauseGame(); }
function back(){
  if(G&&G.state==='pause'&&cur==='set'&&!sheetOn){ backToPause(); return; }
  if(cur==='game'&&G&&G.state!=='end'){ if(G.state!=='pause') pauseGame(); else if(sheetOn) resumeGame(); return; }
  if(sheetOn){ closeSheet(); return; }
  if(cur!=='home'){ goHome(); return; }
  if(ARCADE) leaveTo(ARCADE_HOME); }
function leaveTo(url){ if(G&&G.state!=='end') saveRun(); persist(); writeSummary(); location.replace(url); }
let sheetClose=null;
function openSheet(html,onClose){ $('#sheet').innerHTML=html; $('#ov').classList.add('on'); $('#sheet').scrollTop=0; sheetOn=true; sheetClose=onClose||null; guard(); }
function closeSheet(){ if(!sheetOn) return; $('#ov').classList.remove('on'); sheetOn=false; const f=sheetClose; sheetClose=null; if(f) f(); }
$('#ov').addEventListener('click',e=>{ if(e.target.id==='ov'&&!(G&&cur==='game'&&G.state!=='end')) closeSheet(); });
$('#sheet').addEventListener('click',e=>{ if(e.target.closest('[data-close]')) closeSheet(); });
function goHome(){ if(G&&G.state==='pause'&&cur==='set'&&!sheetOn){ backToPause(); return; } closeSheet(); Music.rate=1; Music.setDanger(false); renderHome(); show('home'); }
const backBtn=`<button class="iconbtn" data-home aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>`;
document.addEventListener('click',e=>{ if(e.target.closest('[data-home]')) goHome(); });

async function share(text){ try{ if(navigator.share){ await navigator.share({text}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast('Copied to the clipboard'); return; }catch(e){}
  openSheet(`<h2>Share</h2><div class="sub">Copy this text:</div><textarea rows="3" readonly>${esc(text)}</textarea><div class="btns"><button class="primary" data-close>Done</button></div>`); $('#sheet textarea').select(); }

const PV_SCENE=['....pp...','...pp....','#...gg..#','##.gg.###','####.####'];
function drawBoardPreview(cv,o){ const r=cv.getBoundingClientRect(), d=Math.min(devicePixelRatio||1,3); if(!r.width) return;

    if(m==='single') return pal[P.cb?0:5]; if(m==='random') return pal[(serial*5+3)%pal.length]; return pal[Math.round(row*(pal.length-1)/(H-1))]; };
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const ch=PV_SCENE[y][x], row=H-1-y, X=x0+x*s, Y=y0+y*s;
    if(ch==='#') drawCell(c,X,Y,s,colOf(row,x*3+y),o.style,1,th);
    else if(ch==='p') drawCell(c,X,Y,s,colOf(row,7),o.style,1,th);
    else if(ch==='g'){ c.strokeStyle=th.ghost; c.globalAlpha=.75; c.lineWidth=Math.max(1.5,s*.09); if(P.cb) c.setLineDash([s*.22,s*.14]); rr(c,X+s*.14,Y+s*.14,s*.72,s*.72,s*.14); c.stroke(); c.setLineDash([]); c.globalAlpha=1; } } }

function drawConsolePreview(cv,id){ const r=cv.getBoundingClientRect(), d=Math.min(devicePixelRatio||1,3); if(!r.width) return;

  const g=c.createLinearGradient(0,0,0,h); g.addColorStop(0,B.bezHi); g.addColorStop(.5,B.bez); g.addColorStop(1,B.bez);
  c.fillStyle=g; rr(c,w*.04,h*.08,w*.92,h*.84,h*.22); c.fill(); if(id==='clear'){ c.strokeStyle='rgba(120,130,150,.5)'; c.lineWidth=1.5; c.stroke(); }
  const sx=w*.27, sy=h*.15, sw=w*.46, sh=h*.6; c.fillStyle='#1b1d22'; rr(c,sx,sy,sw,sh,h*.06); c.fill();
  const th=THEMES[look('theme')], pal=P.cb?CB_PAL:PALETTES[look('palette')]; c.fillStyle=th.bg; rr(c,sx+sw*.06,sy+sh*.1,sw*.88,sh*.8,3); c.fill();
  const cell=sh*.8/6, bx=sx+sw/2-cell*2.5, by=sy+sh*.1; c.fillStyle=th.well; c.fillRect(bx,by,cell*5,cell*6);
  ['.pp..','..pp.','.....','#..##','##.##','#####'].forEach((row,y)=>[...row].forEach((ch,x)=>{ if(ch==='.') return; drawCell(c,bx+x*cell,by+y*cell,cell,th.mono?th.mono[0]:pal[Math.round((5-y)*7/5)],look('style'),1,th); }));

async function gz(text,inflate){ const CS=inflate?window.DecompressionStream:window.CompressionStream; if(!CS) return null;
  const s=new Blob([text]).stream().pipeThrough(new CS('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); }
async function backupCode(){ const o=Object.assign({},S); o.run=null; const json=JSON.stringify(o);
  try{ const z=await gz(new TextEncoder().encode(json)); if(z){ let b=''; for(let i=0;i<z.length;i++) b+=String.fromCharCode(z[i]); return 'LINEFALL1Z.'+btoa(b); } }catch(e){}
  return backupPlain(S); }
async function readBackup(text){ const m=/LINEFALL1Z\.([A-Za-z0-9+/=]+)/.exec(String(text||''));
  if(m){ try{ const bin=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0)); const out=await gz(bin,true); const o=JSON.parse(new TextDecoder().decode(out)); return o&&typeof o.xp==='number'?o:null; }catch(e){ return null; } }
  return parseBackup(text); }

let G=null; const PEND=[];
const handling=()=>({das:S.ctl.das,arr:S.ctl.arr,sdf:S.ctl.sdf,fast:S.fastFx||!P.motion});
function cfgFor(mode,o){ const h=handling();
  if(mode==='classic') return Object.assign({},S.setup,h,{goal:{type:'endless'},seed:''});
  if(mode==='campaign') return levelCfg(LEVELS[o.lid-1],h);
  return dailyCfg(o.date,Object.assign({},h,mode==='practice'?{seed:'LFD1|'+o.date+'|practice'+Date.now()}:{})); }
function startGame(mode,o){ const st=newGame(cfgFor(mode,o));
  if(mode==='practice'){ const real=dailyCfg(o.date); st.rng=rngFrom(real.seed+'|p'); st.grng=rngFrom(real.seed+'|g'); st.queue=[]; st.sub={p3:[],p5:[]}; fillQueue(st); st.cfg.seed=real.seed; }
  G={mode,lid:o.lid,date:o.date,st,state:'count',cd:0,fx:newFx()}; enterGame(); }
function resumeRun(run){ const st=run.st; Object.assign(st.cfg,handling()); st.ev=[];
  G={mode:run.mode,lid:run.lid,date:run.date,st,state:'count',cd:0,fx:newFx()}; enterGame(); }
function saveRun(){ if(!G||G.state==='end') return; const run={mode:G.mode,lid:G.lid,date:G.date,st:snapshot(G.st)};
  if(G.mode==='daily'){ const d=dailyFor(S,G.date); if(!d.scored) d.run=run; } else S.run=run; persist(); }

  G.cdI=setInterval(()=>{ n--; if(n>0){ el.textContent=n; sfx('tick'); } else { clearInterval(G.cdI); el.textContent=''; sfx('go'); G.state='play'; G.last=performance.now(); G.acc=0; } },650); }
function releaseAll(){ HELD.clear(); $$('#zone .down').forEach(b=>b.classList.remove('down')); if(G&&G.st){ for(const k of ['left','right','soft']) input(G.st,'r',k); } PEND.length=0; }

function resumeGame(fromClose){ if(!G||G.state!=='pause') return; G.state='count'; if(!fromClose){ sheetClose=null; closeSheet(); } if(cur!=='game'){ Object.assign(G.st.cfg,handling()); show('game'); applyLook(); resize(); } G.state='count'; countdown(); }

// ---------- input: buttons (multi-touch: each pointer tracks its own button) ----------
const HELD=new Set();
function send(ty,k){ if(G&&G.state==='play') PEND.push([ty,k]); }
let lastDown=0;
function btnPress(b){ const L=S.ctl.layout; buzz(8);
  switch(b){ case 'left': case 'right': HELD.add(b); send('p',b); break;
    case 'down': HELD.add('soft'); send('p','soft'); if(L==='donly'){ const n=performance.now(); if(n-lastDown<280){ send('r','soft'); send('p','hard'); } lastDown=n; } break;
    case 'up': send('p',L==='donly'?'cw':'hard'); break;
    case 'A': send('p','cw'); break; case 'B': send('p','ccw'); break;
    case 'select': send('p','hold'); break;
    case 'start': if(G&&(G.state==='play'||G.state==='count')) pauseGame(); else if(G&&G.state==='pause') resumeGame(); break; } }
function btnRelease(b){ if(b==='left'||b==='right'){ HELD.delete(b); send('r',b); } if(b==='down'){ HELD.delete('soft'); send('r','soft'); } }
const PTR=new Map(); const zone=$('#zone');
const btnAt=(x,y)=>{ const el=document.elementFromPoint(x,y); const b=el&&el.closest&&el.closest('#zone [data-b]'); return b&&b.offsetParent!==null&&getComputedStyle(b).visibility!=='hidden'?b:null; };
zone.addEventListener('pointerdown',e=>{ e.preventDefault(); if(S.ctl.layout==='swipe'&&!e.target.closest('.pills')){ swipeDown(e); return; }
  const b=btnAt(e.clientX,e.clientY); if(!b) return; PTR.set(e.pointerId,b); b.classList.add('down'); btnPress(b.dataset.b); try{ zone.setPointerCapture(e.pointerId); }catch(_){} });
zone.addEventListener('pointermove',e=>{ if(SW.has(e.pointerId)){ swipeMove(e); return; } const was=PTR.get(e.pointerId); if(!was) return;
  const b=btnAt(e.clientX,e.clientY); if(!b||b===was) return; if(!was.closest('.dpad')||!b.closest('.dpad')) return; // slide between D-pad arms
  was.classList.remove('down'); btnRelease(was.dataset.b); PTR.set(e.pointerId,b); b.classList.add('down'); btnPress(b.dataset.b); });
const ptrUp=e=>{ if(SW.has(e.pointerId)){ swipeUp(e); return; } const b=PTR.get(e.pointerId); if(!b) return; PTR.delete(e.pointerId); b.classList.remove('down'); btnRelease(b.dataset.b); };
zone.addEventListener('pointerup',ptrUp); zone.addEventListener('pointercancel',ptrUp); zone.addEventListener('lostpointercapture',ptrUp);
['contextmenu','dblclick','gesturestart'].forEach(ev=>document.getElementById('game').addEventListener(ev,e=>e.preventDefault()));
// ---------- swipe pad ----------
const SW=new Map(); let swMulti=0;
function swipeDown(e){ const now=performance.now(); SW.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t:now,moved:false,soft:false,lastY:e.clientY,lastT:now});
  if(SW.size===2) swMulti=now; try{ zone.setPointerCapture(e.pointerId); }catch(_){} }
function swipeMove(e){ const s=SW.get(e.pointerId), now=performance.now(), STEP=28;
  while(e.clientX-s.x>=STEP){ s.x+=STEP; send('p','r1'); s.moved=true; }
  while(s.x-e.clientX>=STEP){ s.x-=STEP; send('p','l1'); s.moved=true; }
  const dy=e.clientY-s.y0, vy=(e.clientY-s.lastY)/Math.max(1,now-s.lastT); s.lastY=e.clientY; s.lastT=now;
  if(dy>24&&vy<0.6&&Math.abs(e.clientX-s.x0)<40&&!s.soft){ s.soft=true; s.moved=true; send('p','soft'); }
  if(Math.abs(dy)>12) s.moved=true; }
function swipeUp(e){ const s=SW.get(e.pointerId); SW.delete(e.pointerId); const now=performance.now(), dt=now-s.t, dy=e.clientY-s.y0, dx=e.clientX-s.x0;
  if(s.soft) send('r','soft');
  const vy=dy/Math.max(1,dt);
  if(!s.soft&&dy>40&&vy>0.5&&Math.abs(dx)<Math.abs(dy)) send('p','hard');
  else if(dy<-40&&vy<-0.5&&Math.abs(dx)<Math.abs(dy)) send('p','hold');
  else if(!s.moved&&dt<300){ if(swMulti&&now-swMulti<400){ if(SW.size===0){ send('p','ccw'); swMulti=0; } } else send('p','cw'); } }
// ---------- keyboard ----------
const KEYS={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'soft',' ':'hard',ArrowUp:'cw',x:'cw',X:'cw',z:'ccw',Z:'ccw',c:'hold',C:'hold',Shift:'hold'};
addEventListener('keydown',e=>{ if(cur!=='game'||!G){ if(e.key==='Escape'&&(sheetOn||cur!=='home')){ e.preventDefault(); back(); } return; }
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){ e.preventDefault(); if(G.state==='pause') resumeGame(); else pauseGame(); return; }
  const k=KEYS[e.key]; if(!k) return; e.preventDefault(); if(e.repeat) return;
  if(k==='left'||k==='right'||k==='soft'){ HELD.add(k); send('p',k); } else send('p',k); });
addEventListener('keyup',e=>{ const k=KEYS[e.key]; if(!k||!G) return; if(k==='left'||k==='right'||k==='soft'){ HELD.delete(k); send('r',k); } });

// ---------- loop: fixed 60 Hz logic ticks, at most 4 catch-up ticks per frame ----------
const TICK=1000/60;
function frame(now){ requestAnimationFrame(frame); if(cur!=='game'||!G) return;
  if(G.state==='play'){ G.acc+=Math.min(250,now-(G.last||now)); G.last=now; let n=0;
    while(G.acc>=TICK&&n<4){ const ins=PEND.splice(0); step(G.st,ins); handleEvents(G.st.ev); G.acc-=TICK; n++;
      if(G.st.phase==='over'||G.st.phase==='done'){ G.state='end'; G.endAt=now; setTimeout(finishGame,G.st.phase==='over'?1100:700); break; } }
    if(n===4) G.acc=0; }
  draw(now); }
requestAnimationFrame(frame);

// ---------- events → sound, haptics, effects ----------
let heartT=0;
function handleEvents(ev){ const st=G.st, fx=G.fx, mo=P.motion;
  for(const e of ev){ switch(e.e){
    case 'move': sfx('move'); break;
    case 'rot': sfx('rot'); break;
    case 'hold': sfx('hold'); break;
    case 'hard': if(mo) fx.trails.push({t:e.t,r:e.r,x:e.x,from:e.from,to:e.to,life:1}); break;
    case 'lock': sfx('lock'); buzz(6); fx.locks.push({cells:e.cells,life:1}); if(mo&&THEMES[look('theme')].lock==='dust') for(const [x,y] of e.cells) for(let i=0;i<2;i++) fx.parts.push({gx:x+Math.random(),gy:y+1,vx:(Math.random()-.5)*2,vy:-Math.random()*2,life:1,col:'dust'}); break;
    case 'clear': { const n=e.n; let label=n>=5?'QUINT':n===4?'QUAD':['','SINGLE','DOUBLE','TRIPLE'][n];
      if(e.twist) label='TWIST '+(['','SINGLE','DOUBLE','TRIPLE'][n]||''); else if(e.mini) label='MINI TWIST '+(['','SINGLE','DOUBLE'][n]||'');
      const pops=[label.trim()]; if(e.b2b) pops.push('BACK-TO-BACK'); if(e.combo>0) pops.push('COMBO '+e.combo); if(e.sweep) pops.push('CLEAN SWEEP'); pops.push('+'+fmtNum(e.pts));
      fx.pops.push({lines:pops,life:1,big:n>=4||e.twist||e.sweep});
      if(e.twist||e.mini) sfx('twist'); if(n>=4){ sfx('quad'); buzz([20,30,40]); if(mo){ fx.shake=1; const c=$('#console'); c.classList.add('pulse'); setTimeout(()=>c.classList.remove('pulse'),450); } }
      else if(!e.twist) sfx('clear',n); if(e.combo>0) sfx('combo',e.combo); if(e.sweep){ sfx('sweep'); buzz([30,40,60]); }
      if(mo&&THEMES[look('theme')].clear==='shatter') for(const y of e.rows) for(let x=0;x<st.W;x++) fx.parts.push({gx:x+.5,gy:y+.5,vx:(Math.random()-.5)*8,vy:-Math.random()*6-1,life:1,col:cellColorAt(st,x,y)});
      break; }
    case 'twist0': fx.pops.push({lines:[e.mini?'MINI TWIST':'TWIST','+'+fmtNum(e.pts)],life:1}); sfx('twist'); break;
    case 'level': sfx('level'); fx.pops.push({lines:['LEVEL '+e.level],life:1}); Music.rate=1+Math.min(.12,(e.level-1)*.008); break;
    case 'garbage': sfx('garbage'); break;
    case 'over': sfx('over'); buzz([40,60,80]); Music.setDanger(false); break;
    case 'done': sfx(e.ok?'win':'over'); Music.setDanger(false); break; } } }

// ===================== DRAWING =====================
const cv=$('#cv'), ctx=cv.getContext('2d'); let LY=null;
function resize(){ const r=$('#scr').getBoundingClientRect(), dpr=Math.min(3,devicePixelRatio||1); cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0); if(!G) return; const W=G.st.W, H=G.st.H, pw=4.6, pad=.5;
  const cs=Math.max(4,Math.floor(Math.min(r.width/(W+pw+pad*2+.4),r.height/(H+pad*2))));
  const bw=W*cs, bh=H*cs, tot=bw+cs*.4+pw*cs, x0=Math.floor((r.width-tot)/2), y0=Math.floor((r.height-bh)/2);
  LY={w:r.width,h:r.height,cs,bx:x0,by:y0,bw,bh,px:x0+bw+cs*.4,pw:pw*cs}; }
addEventListener('resize',()=>{ if(cur==='game') resize(); if(cur==='style') drawStyleCards(); });
const shade=(hex,a)=>{ if(hex[0]!=='#') return hex; const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  if(a>0){ r+=(255-r)*a; g+=(255-g)*a; b+=(255-b)*a; } else { r*=1+a; g*=1+a; b*=1+a; } return `rgb(${r|0},${g|0},${b|0})`; };
function palette(){ return P.cb?CB_PAL:PALETTES[look('palette')]; }
// row: 0 = bottom row of the visible board
function cellColor(row,H,serial,garbage){ const th=THEMES[look('theme')];
  if(garbage) return th.garbage; if(th.mono) return th.mono[serial%th.mono.length];
  const pal=palette(), mode=S.look.color;
  if(mode==='single') return pal[P.cb?0:5];
  if(mode==='random') return pal[(serial*5+3)%pal.length];
  const band=Math.max(1,Math.ceil(H/pal.length)); return pal[Math.min(pal.length-1,Math.floor(Math.max(0,row)/band))]; }
const cellColorAt=(st,x,y)=>{ const v=st.b[y*st.W+x]; return cellColor(st.R-1-y,st.H,v,v===255); };
function rr(c,x,y,w,h,r){ r=Math.min(r,w/2,h/2); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function drawCell(c,x,y,s,col,style,alpha,th){ if(alpha<=0) return; c.globalAlpha=alpha; const i=Math.max(1,s*.06), w=s-i*2;
  if(style==='glass'){ const g=c.createLinearGradient(x,y,x,y+s); g.addColorStop(0,shade(col,.35)); g.addColorStop(.5,col); g.addColorStop(1,shade(col,-.25));
    c.fillStyle=g; rr(c,x+i,y+i,w,w,s*.2); c.fill(); c.fillStyle='rgba(255,255,255,.35)'; rr(c,x+i+s*.12,y+i+s*.08,w-s*.24,s*.22,s*.1); c.fill(); }
  else if(style==='pixel'){ const p=Math.max(1,Math.round(s/8)); c.fillStyle=col; c.fillRect(x+i,y+i,w,w); c.fillStyle=shade(col,.3); c.fillRect(x+i,y+i,w,p); c.fillRect(x+i,y+i,p,w);
    c.fillStyle=shade(col,-.3); c.fillRect(x+i,y+s-i-p,w,p); c.fillRect(x+s-i-p,y+i,p,w); c.fillStyle=shade(col,.18); c.fillRect(x+s*.38,y+s*.38,s*.24,s*.24); }
  else if(style==='outline'){ c.fillStyle=col; c.globalAlpha=alpha*.2; rr(c,x+i,y+i,w,w,s*.22); c.fill(); c.globalAlpha=alpha; c.strokeStyle=col; c.lineWidth=Math.max(1.5,s*.12); rr(c,x+i+s*.06,y+i+s*.06,w-s*.12,w-s*.12,s*.18); c.stroke(); }
  else { c.fillStyle=col; rr(c,x+i,y+i,w,w,s*.18); c.fill(); }
  c.globalAlpha=1; }
function drawMini(c,t,cx,cy,s,maxH,maxW){ const p=PIECES[t], bb=p.bb[0], nw=bb.x1-bb.x0+1, nh=bb.y1-bb.y0+1; if(maxH) s=Math.min(s,maxH/nh); if(maxW) s=Math.min(s,maxW/nw); const w=nw*s, h=nh*s, col=palette()[(t.charCodeAt(0)*3+t.length)%8];
  const th=THEMES[look('theme')]; for(const [x,y] of p.st[0]) drawCell(c,cx-w/2+(x-bb.x0)*s,cy-h/2+(y-bb.y0)*s,s,th.mono?th.mono[0]:col,look('style'),1,th); }
function draw(now){ if(!LY) resize(); const st=G.st, c=ctx, L=LY, th=THEMES[look('theme')], cs=L.cs, fx=G.fx, style=look('style'), W=st.W, H=st.H, HID=LF_HIDDEN;
  const dt=Math.min(.1,(now-(fx.last||now))/1000); fx.last=now;
  c.save(); c.fillStyle=th.bg; c.fillRect(0,0,L.w,L.h);
  if(fx.shake>0&&P.motion){ c.translate((Math.random()-.5)*6*fx.shake,(Math.random()-.5)*6*fx.shake); fx.shake=Math.max(0,fx.shake-dt*3.5); }
  // well
  c.fillStyle=th.well; rr(c,L.bx-2,L.by-2,L.bw+4,L.bh+4,6); c.fill();
  c.strokeStyle=th.grid; c.lineWidth=1; c.beginPath(); for(let x=1;x<W;x++){ c.moveTo(L.bx+x*cs+.5,L.by); c.lineTo(L.bx+x*cs+.5,L.by+L.bh); } for(let y=1;y<H;y++){ c.moveTo(L.bx,L.by+y*cs+.5); c.lineTo(L.bx+L.bw,L.by+y*cs+.5); } c.stroke();
  if(th.traces){ c.strokeStyle='rgba(80,255,170,.06)'; c.lineWidth=2; c.beginPath(); for(let i=0;i<6;i++){ const x=L.bx+((i*37)%W)*cs+cs/2; c.moveTo(x,L.by); c.lineTo(x,L.by+L.bh*(.3+.1*i)); c.lineTo(x+cs,L.by+L.bh*(.3+.1*i)+cs); } c.stroke(); }
  // locked cells (with the line-clear animation on clearing rows)
  const clearing=st.phase==='clear'?st.clearRows:[], cp=st.phase==='clear'?1-st.timer/(st.cfg.fast?CLEAR_FAST:CLEAR_T):0, eff=P.motion?th.clear:'fade';
  const overP=st.phase==='over'&&G.endAt?Math.min(1,(now-G.endAt)/800):0;
  for(let y=HID;y<st.R;y++){ const vy=y-HID, row=st.R-1-y, isC=clearing.includes(y);
    for(let x=0;x<W;x++){ const v=st.b[y*W+x]; if(!v) continue; let a=cellVisible(st,y*W+x)?1:0; let col=cellColor(row,H,v,v===255);
      if(isC){ if(eff==='wipe'){ if(Math.abs(x-(W-1)/2)/(W/2)<cp) continue; } else if(eff==='flash'){ col=cp<.5&&Math.floor(cp*8)%2===0?'#ffffff':col; a=cp<.5?1:2-cp*2; }
        else if(eff==='dissolve'){ a=Math.max(0,1-cp*1.6+((x*7+y*3)%5)/10); } else if(eff==='shatter'){ continue; } else a=1-cp; a=Math.max(0,a); }
      if(overP&&row<overP*H) col=th.dark?'#3a3d45':'#9a9ca3';

  for(const t of fx.trails){ const cells=cellsOf(t.t,t.r,t.x,t.to), cols=new Map(); for(const [x,y] of cells) cols.set(x,Math.min(cols.has(x)?cols.get(x):99,y));
    for(const [x,y] of cols){ const top=Math.max(HID,t.from+(y-t.to)), y1=L.by+(top-HID)*cs, y2=L.by+(y-HID)*cs; if(y2<=y1) continue;
      const g=c.createLinearGradient(0,y1,0,y2); g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(1,th.dark?`rgba(255,255,255,${.25*t.life})`:`rgba(40,50,80,${.18*t.life})`); c.fillStyle=g; c.fillRect(L.bx+x*cs+cs*.15,y1,cs*.7,y2-y1); }
    t.life-=dt*6; } fx.trails=fx.trails.filter(t=>t.life>0);
  // ghost and active piece
  if(st.cur&&st.phase==='play'){ const cu=st.cur;
    if(st.cfg.ghost){ const gy=ghostY(st); c.strokeStyle=th.ghost; c.lineWidth=Math.max(1.5,cs*.09); if(P.cb) c.setLineDash([cs*.22,cs*.14]); c.globalAlpha=.75;
      for(const [x,y] of cellsOf(cu.t,cu.r,cu.x,gy)) if(y>=HID){ rr(c,L.bx+x*cs+cs*.14,L.by+(y-HID)*cs+cs*.14,cs*.72,cs*.72,cs*.14); c.stroke(); }
      c.setLineDash([]); c.globalAlpha=1; }
    const lockA=st.lockT>0?.75+.25*Math.cos(st.lockT/30*Math.PI*4):1;
    for(const [x,y] of cellsOf(cu.t,cu.r,cu.x,cu.y)) if(y>=HID) drawCell(c,L.bx+x*cs,L.by+(y-HID)*cs,cs,cellColor(st.R-1-y,H,st.serial%250+1,false),style,lockA,th); }
  // lock effects
  for(const l of fx.locks){ const kind=P.motion?th.lock:'flash';
    if(kind==='flash'){ c.fillStyle=`rgba(255,255,255,${.45*l.life})`; for(const [x,y] of l.cells) if(y>=HID){ rr(c,L.bx+x*cs+1,L.by+(y-HID)*cs+1,cs-2,cs-2,cs*.18); c.fill(); } }
    else if(kind==='ripple'){ let sx=0,sy=0; for(const [x,y] of l.cells){ sx+=x; sy+=y; } sx=sx/l.cells.length+.5; sy=sy/l.cells.length+.5-HID;
      c.strokeStyle=th.ghost; c.globalAlpha=.5*l.life; c.lineWidth=2; c.beginPath(); c.arc(L.bx+sx*cs,L.by+sy*cs,cs*(1+(1-l.life)*2.2),0,7); c.stroke(); c.globalAlpha=1; }

    c.globalAlpha=Math.max(0,p.life); c.fillStyle=p.col==='dust'?th.sub:p.col; const s=p.col==='dust'?cs*.12:cs*.32; c.fillRect(L.bx+p.gx*cs-s/2,L.by+(p.gy-HID)*cs-s/2,s,s); }
  c.globalAlpha=1; fx.parts=fx.parts.filter(p=>p.life>0); if(fx.parts.length>800) fx.parts.splice(0,fx.parts.length-800);

  if(danger&&S.danger){ const pulse=.5+.5*Math.sin(now/140); const g=c.createLinearGradient(0,0,0,L.h*.5); g.addColorStop(0,`rgba(230,60,60,${.28+.2*pulse})`); g.addColorStop(1,'rgba(230,60,60,0)');
    c.fillStyle=g; c.fillRect(0,0,L.w,L.h*.5); c.strokeStyle=`rgba(230,60,60,${.35+.3*pulse})`; c.lineWidth=4; c.strokeRect(2,2,L.w-4,L.h-4); }

    p.life-=dt*.7; } c.globalAlpha=1; fx.pops=fx.pops.filter(p=>p.life>0); if(fx.pops.length>3) fx.pops.splice(0,fx.pops.length-3);
  drawPanel(c,st,L,th,now); c.restore(); }
function drawPanel(c,st,L,th,now){ const cs=L.cs, x=L.px, w=L.pw; let y=L.by; const lab=t=>{ c.fillStyle=th.sub; c.font=`700 ${Math.max(8,Math.round(cs*.5))}px Inter,sans-serif`; c.textAlign='left'; c.fillText(T(t),x+2,y+cs*.5); y+=cs*.72; };
  const tight=st.H<=16, ms=cs*(tight?.55:.62);
  if(st.cfg.hold){ lab('HOLD'); c.fillStyle=th.well; rr(c,x,y,w,cs*2.3,6); c.fill(); if(st.hold){ c.globalAlpha=st.held?.35:1; drawMini(c,st.hold,x+w/2,y+cs*1.15,ms,cs*1.9,w*.85); c.globalAlpha=1; } y+=cs*2.7; }
  const q=previews(st); if(q.length){ lab('NEXT'); const s0=tight?2.1:2.4, s1=tight?1.35:1.6, boxH=cs*(s0+(q.length-1)*s1+.2); c.fillStyle=th.well; rr(c,x,y,w,boxH,6); c.fill();
    q.forEach((t,i)=>{ const slot=i===0?s0:s1, yy=y+cs*(.1+(i===0?s0/2:s0+(i-1)*s1+s1/2)); drawMini(c,t,x+w/2,yy,i===0?ms:ms*.78,cs*slot*.78,w*.85); }); y+=boxH+cs*.5; }
  const g=st.cfg.goal, rows=[['SCORE',fmtNum(st.score)],['LEVEL',String(st.level)],['LINES',g.type==='sprint'?`${st.lines}/${g.lines}`:String(st.lines)]];
  if(g.ticks) rows.push(['TIME',fmtTime(Math.ceil((g.ticks-st.tick)/60))]); else if(g.type!=='puzzle') rows.push(['TIME',fmtTime(st.tick/60)]);
  if(g.type==='dig') rows[2]=['GREY',String(st.stats.garbage)]; if(g.type==='puzzle') rows[2]=['PIECES',String(st.queue.length+(st.cur?1:0))];
  const lh=Math.min(cs*1.55,(L.by+L.bh-y)/Math.max(1,rows.length));
  for(const [k,v] of rows){ c.fillStyle=th.sub; c.font=`700 ${Math.max(8,Math.round(Math.min(cs*.48,lh*.32)))}px Inter,sans-serif`; c.textAlign='left'; c.fillText(T(k),x+2,y+lh*.36);
    c.fillStyle=k==='TIME'&&g.ticks&&g.ticks-st.tick<600?'#e5484d':th.text; c.font=`700 ${Math.max(9,Math.round(Math.min(cs*.82,lh*.5,w/Math.max(4,v.length)*1.55)))}px "JetBrains Mono",monospace`; c.fillText(v,x+2,y+lh*.84); y+=lh; } }
function newFx(){ return {trails:[],locks:[],parts:[],pops:[],shake:0,last:0}; }

// ===================== RESULTS =====================
function finishGame(){ if(!G) return; const g=G, st=g.st, res=st.result, today=todayStr(); let xp=0, rx=null, extra='', title='', newBest=false;
  const ctx2={mode:g.mode==='practice'?'daily':g.mode,cfg:st.cfg,res,practice:g.mode==='practice'};
  if(g.mode!=='practice') addStats(S,res);
  if(g.mode==='classic'){ S.run=null; newBest=addRecord(S,st.cfg,res,today); xp=classicXP(st.cfg,res.lines); title=newBest?'New best!':'Game over'; }
  if(g.mode==='campaign'){ S.run=null; const L=LEVELS[g.lid-1]; rx=campaignResult(S,L,res); xp=rx.xp; title=res.ok?'Level cleared':'Not this time'; newBest=rx.fresh.length>0; }
  if(g.mode==='daily'){ const d=dailyFor(S,g.date); d.run=null; const r=dailyResult(S,g.date,res,today); xp=r?r.xp:0; title='Daily Blitz'; newBest=r&&r.stars>=3; }
  if(g.mode==='practice'){ S.run=null; title='Practice'; }
  const up=xp?addXP(S,xp):null; const ach=checkAch(S,ctx2);
  persist(); G=null; showResults(g,st,res,{xp,up,ach,rx,title,newBest}); }
function showResults(g,st,res,o){ const secs=res.ticks/60; let h=`<div class="sub" style="margin:0">${g.mode==='campaign'?`Level ${g.lid} · ${esc(LEVELS[g.lid-1].name)}`:g.mode==='classic'?esc(setupLabel(st.cfg)):esc(comboLabel(dailyCombo(g.date)))}</div><h2>${esc(o.title)}</h2>
   <div class="big">${fmtNum(res.score)}</div><div class="kv"><div><b>${res.lines}</b><span>Lines</span></div><div><b>${res.level}</b><span>Level</span></div><div><b>${fmtTime(secs)}</b><span>Time</span></div><div><b>${res.stats.quads+res.stats.quints}</b><span>Quads</span></div></div>`;
  if(g.mode==='campaign'){ const L=LEVELS[g.lid-1], c=campOf(S,L.id); h+=L.stars.map((s,i)=>`<div class="goal${c.s[i]?' got':''}${o.rx.fresh.includes(i)?' new':''}"><span class="st">★</span><span>${esc(starText(L,s))}</span></div>`).join(''); }
  if(g.mode==='daily'||g.mode==='practice'){ const t=dailyCombo(g.date).stars, n=dailyStars(g.date,res.score); h+=`<div style="text-align:center;font-size:26px;margin:4px 0">${starsHtml(n,3)}</div><div class="sub" style="text-align:center">${t.map(v=>fmtNum(v)).join(' · ')}${g.mode==='practice'?' · practice doesn\'t score':''}</div>`; }
  if(g.mode==='classic'){ const b=S.rec[recKey(st.cfg)]; h+=`<div class="sub">Best for this setup: ${b?fmtNum(b.score):'—'}</div>`; }
  if(o.xp) h+=`<div class="sub" style="font-weight:700;color:var(--ink)">+${o.xp} XP${o.up&&o.up.after>o.up.before?` · Level ${o.up.after}!${o.up.rewards.length?' · '+esc(o.up.rewards.join(' · ')):''}`:''}</div>`;
  for(const id of o.ach){ const a=ACH.find(a=>a.id===id); h+=`<div class="sub" style="font-weight:700;color:var(--ink)">🏆 ${esc(a.name)}${a.reward?` · ${esc(a.reward)}`:''}</div>`; }
  const L=g.mode==='campaign'?LEVELS[g.lid-1]:null, canNext=L&&L.id<30&&unlocked(S,L.id+1);
  h+=`<div class="btns">${g.mode==='daily'?'<button class="ghost" id="rShare">Share</button>':''}<button class="ghost" id="rHome">Menu</button>
   ${g.mode==='daily'?'<button class="primary" id="rPrac">Practice</button>':canNext?'<button class="ghost" id="rAgain">Retry</button><button class="primary" id="rNext">Next level</button>':'<button class="primary" id="rAgain">Play again</button>'}</div>`;
  openSheet(h,()=>{ if(cur==='game') goHome(); });
  if(o.up&&o.up.after>o.up.before){ sfx('level'); playFx(look('fx')==='none'?'confetti':look('fx')); } else if(o.newBest) playFx(look('fx'));
  if(g.mode==='campaign') o.rx.fresh.forEach((i,k)=>setTimeout(()=>sfx('star',i),300+k*180));
  $('#rHome').onclick=()=>goHome();
  if($('#rAgain')) $('#rAgain').onclick=()=>{ sheetClose=null; closeSheet(); startGame(g.mode,{lid:g.lid,date:g.date}); };
  if($('#rNext')) $('#rNext').onclick=()=>{ sheetClose=null; closeSheet(); campCh=LEVELS[g.lid].ch; renderCamp(); show('camp'); openLevel(LEVELS[g.lid]); };
  if($('#rPrac')) $('#rPrac').onclick=()=>{ sheetClose=null; closeSheet(); startGame('practice',{date:g.date}); };
  if($('#rShare')) $('#rShare').onclick=()=>{ const d=dailyFor(S,g.date); share(shareLine(g.date,d.score,d.lines,d.stars)); }; }

// ===================== WIN / NEW-BEST EFFECTS (full-screen layer) =====================
const fxc=$('#fxc'), fctx=fxc.getContext('2d'); let FX=[], fxRun=false;
function playFx(kind){ if(!P.motion||!kind||kind==='none') return; const w=innerWidth, h=innerHeight, pal=palette();
  if(FX.length>1200) return;
  if(kind==='confetti') for(let i=0;i<140;i++) FX.push({x:Math.random()*w,y:-20-Math.random()*h*.3,vx:(Math.random()-.5)*120,vy:100+Math.random()*160,r:Math.random()*6,vr:(Math.random()-.5)*10,s:5+Math.random()*5,col:pal[i%8],life:3,k:'c'});
  if(kind==='fireworks') for(let b=0;b<5;b++){ const cx=w*(.2+.6*Math.random()), cy=h*(.15+.35*Math.random()), col=pal[(b*3)%8], t0=b*.35; for(let i=0;i<46;i++){ const a=i/46*Math.PI*2, sp=90+Math.random()*120; FX.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,s:3,col,life:1.6,delay:t0,k:'f'}); } }
  if(kind==='aurora') FX.push({k:'a',life:3.2,t:0});
  if(!fxRun){ fxRun=true; let last=performance.now(); const run=now=>{ const dt=Math.min(.05,(now-last)/1000); last=now; const dpr=devicePixelRatio||1;
    if(fxc.width!==innerWidth*dpr){ fxc.width=innerWidth*dpr; fxc.height=innerHeight*dpr; } fctx.setTransform(dpr,0,0,dpr,0,0); fctx.clearRect(0,0,innerWidth,innerHeight);
    for(const p of FX){ if(p.delay>0){ p.delay-=dt; continue; } p.life-=dt;
      if(p.k==='a'){ p.t+=dt; const a=Math.min(1,p.life,p.t)*.55; for(let i=0;i<3;i++){ const g=fctx.createLinearGradient(0,0,innerWidth,0); g.addColorStop(0,'transparent'); g.addColorStop(.5,pal[(i*3+2)%8]); g.addColorStop(1,'transparent');
          fctx.globalAlpha=a*.6; fctx.fillStyle=g; fctx.beginPath(); fctx.moveTo(0,innerHeight*(.1+i*.08)); for(let x=0;x<=innerWidth;x+=20) fctx.lineTo(x,innerHeight*(.1+i*.08)+Math.sin(x/90+p.t*2+i)*30); fctx.lineTo(innerWidth,0); fctx.lineTo(0,0); fctx.fill(); } continue; }
      p.vy+=(p.k==='f'?60:30)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; fctx.globalAlpha=Math.max(0,Math.min(1,p.life)); fctx.fillStyle=p.col;
      if(p.k==='c'){ p.r+=p.vr*dt; fctx.save(); fctx.translate(p.x,p.y); fctx.rotate(p.r); fctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); fctx.restore(); } else fctx.fillRect(p.x-1.5,p.y-1.5,3,3); }
    fctx.globalAlpha=1; FX=FX.filter(p=>p.life>0); if(FX.length) requestAnimationFrame(run); else { fxRun=false; fctx.clearRect(0,0,innerWidth,innerHeight); } };
    requestAnimationFrame(run); } }

// ===================== START =====================
function init(){ applyLook(); startI18n(); renderHome();
  // Arcade → Settings → Linefall opens straight to the game's settings
  if(location.hash==='#game-settings'){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} openSettings(); }
  else if(location.hash){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
  if(S.seenVer&&S.seenVer!==VERSION) setTimeout(openNews,400); S.seenVer=VERSION; persist(); guard();
  if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyLook);
  try{ store.set('linefall.probe','1'); localStorage.removeItem('linefall.probe'); }catch(e){} }
init();
</script>
