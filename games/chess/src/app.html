<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3f2ef" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<title>Chess</title>
<!--FONTS-->
<style>
:root{--bg:#f3f2ef;--panel:#fff;--ink:#1c1c1e;--sub:#8a8a90;--accent:#2f5fb3;--accentInk:#fff;--line:rgba(0,0,0,.08);--gold:#e8a913;--good:#2f9e6a;--bad:#d9534f}
.dark{--bg:#101114;--panel:#1b1c20;--ink:#f2f2f4;--sub:#8d8e96;--accent:#e9eaee;--accentInk:#15161a;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
textarea{width:100%;font:12px/1.4 'JetBrains Mono',monospace;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:none;-webkit-user-select:text;user-select:text}
input[type=text]{width:100%;font:15px Inter,sans-serif;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;flex:1;padding:16px 16px 36px;max-width:560px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h2{font-size:24px;font-weight:800;letter-spacing:-.03em;flex:1;min-width:0}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 0 16px}
.brand h1{font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1}
.brand p{color:var(--sub);font-size:14px;margin-top:8px;line-height:1.35}
.acts{display:flex;gap:8px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.backbtn{height:36px;padding:0 12px 0 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-bottom:6px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:22px 4px 10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.label span{letter-spacing:.02em;text-transform:none;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 15px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:10px;transition:transform .12s;min-width:0}
button.card:active{transform:scale(.98)}
.card .t{font-weight:700;font-size:17px;letter-spacing:-.01em;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.row2 .card .t{font-size:15.5px}
.card .s{color:var(--sub);font-size:13px;margin-top:2px;line-height:1.3;overflow-wrap:anywhere}
.card .grow{flex:1;min-width:0}
.card .r{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex:none;max-width:42%}
.card .r b{display:block;font-size:15px}
.card .r span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.card.dim{opacity:.55}
.ico{width:42px;height:42px;border-radius:12px;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.ico svg{width:26px;height:26px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .card{margin:0;padding:12px;gap:10px}
.row2 .ico{width:36px;height:36px}.row2 .card .s{overflow-wrap:normal}
.lvl .badge{width:50px;height:50px;border-radius:15px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.primary{background:var(--accent);color:var(--accentInk);border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;width:100%;transition:transform .12s}
.primary:active{transform:scale(.98)}
.ghost{background:var(--bg);border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;width:100%}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns>*{flex:1 1 0;min-width:0}
.seg{display:flex;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;padding:9px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);min-width:0}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.dark .seg button.on{background:#2a2b31}
.opt{margin:12px 0}
.opt>.h{font-size:12px;font-weight:700;color:var(--sub);margin:0 2px 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;width:100%;font-weight:600;font-size:15px;text-align:left}
.srow .d{font-size:12.5px;color:var(--sub);font-weight:500;margin-top:2px}
.srow>div{min-width:0}
.sw{width:46px;height:28px;border-radius:99px;background:var(--bg);position:relative;transition:background .2s;flex:none;border:1px solid var(--line)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--sub);transition:left .2s,background .2s}
.sw.on{background:var(--accent)}.sw.on::after{left:21px;background:var(--accentInk)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 14px;margin-bottom:10px}
.box .srow+.srow{border-top:1px solid var(--line)}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px;white-space:nowrap}
.stars .o{color:var(--sub);opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;max-width:100%;min-width:0;overflow-wrap:anywhere}
.chip.on{background:var(--accent);color:var(--accentInk);border-color:transparent}
.topseg{background:var(--panel);border:1px solid var(--line);margin:0 0 14px}
.topseg button{font-size:12px;padding:9px 3px;white-space:nowrap;letter-spacing:-.01em}
.topseg button.on{background:var(--accent);color:var(--accentInk)}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px;text-align:left;position:relative;transition:transform .12s;min-width:0}
.tcard:active{transform:scale(.98)}
.tcard .pv{aspect-ratio:7/4;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:4px;overflow:hidden;position:relative}
.tcard .n{font-weight:700;font-size:14px;margin:9px 5px 2px;overflow-wrap:anywhere}
.tcard .q{font-size:11.5px;color:var(--sub);margin:0 5px 5px;line-height:1.3;min-height:2.6em;overflow-wrap:anywhere}
.tcard.sel{box-shadow:0 0 0 2.5px var(--accent)}
.tcard.locked .pv{filter:grayscale(.9);opacity:.45}
.tcard .pv svg.i{width:38px;height:38px;stroke-width:1.6;color:var(--accent)}
.tcard.playing .pv{opacity:.4}
.lock{position:absolute;top:13px;right:13px;width:28px;height:28px;border-radius:9px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.lock svg.i{width:15px;height:15px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 2px;border-radius:10px;font-weight:700;font-size:13px;color:var(--sub);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--accentInk)}
.lvcard .num{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.lvcard.fin .num{background:var(--accent);color:var(--accentInk)}
.lvpath .lvcard:nth-child(4n+2),.lvpath .lvcard:nth-child(4n+3){margin-left:18px;width:calc(100% - 18px)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
.tbl th{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700;border:0}
.tbl td:first-child,.tbl th:first-child{text-align:left;font-weight:600}
.ach{display:flex;gap:12px;align-items:center;padding:10px 2px}
.ach+.ach{border-top:1px solid var(--line)}
.ach .m{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none;font-size:15px;font-weight:800}
.ach.done .m{background:var(--gold);color:#3a2a00}
.ach .n{font-weight:700;font-size:14.5px}.ach .d{color:var(--sub);font-size:12.5px;margin-top:1px;overflow-wrap:anywhere}
.ach>div:last-child{min-width:0}
.week{display:flex;gap:6px;justify-content:space-between;margin:6px 0}
.week div{flex:1;min-width:0;text-align:center;font-size:11px;font-weight:700;color:var(--sub);background:var(--bg);border-radius:10px;padding:7px 0}
.week div.on{background:var(--gold);color:#3a2a00}
.avpick{display:flex;flex-wrap:wrap;gap:6px}.avpick button{border:2px solid transparent;border-radius:12px;padding:2px;line-height:0}.avpick button.on{border-color:var(--accent)}
.av{flex:none}
/* sheets */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:2000;padding:0 0 env(safe-area-inset-bottom)}
#ov.on{display:flex}
#sheet{background:var(--panel);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px 20px;max-height:92vh;overflow-y:auto;overflow-x:hidden;animation:up .22s ease-out}
@media (min-height:700px) and (min-width:600px){ #ov{align-items:center} #sheet{border-radius:24px} }
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;overflow-wrap:anywhere}
#sheet .sub{color:var(--sub);font-size:14px;line-height:1.4;margin-bottom:12px}
.goal{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px;font-weight:600}
.goal .st{font-size:18px;color:var(--sub);opacity:.4;width:22px;text-align:center;flex:none}
.goal.got .st{color:var(--gold);opacity:1}
.goal.new .st{animation:pop .5s}
.goal.wait .st{opacity:.7;color:var(--sub);animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.25}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--bg);border-radius:12px;padding:9px 6px;text-align:center;min-width:0;overflow-wrap:anywhere}
.kv b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.kv span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.howto p{font-size:14px;line-height:1.5;margin:6px 0}
.howto h3{font-size:15px;margin:14px 0 4px}
.howto .dia{display:flex;justify-content:center;margin:8px 0 4px}
.prom{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.prom button{aspect-ratio:1;border-radius:14px;background:var(--bg);display:grid;place-items:center}
.prom button svg{width:80%;height:80%}
#toast{position:fixed;left:50%;top:0;transform:translate(-50%,calc(-100% - env(safe-area-inset-top) - 20px));opacity:0;background:var(--accent);color:var(--accentInk);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:3000;transition:transform .35s,opacity .35s;max-width:calc(100vw - 24px);text-align:center;pointer-events:none;margin-top:calc(env(safe-area-inset-top) + 10px)}
#toast.on{transform:translate(-50%,0);opacity:1}
#fxc{position:fixed;inset:0;pointer-events:none;z-index:1500;width:100%;height:100%}
#pdefs{position:absolute;width:0;height:0;overflow:hidden}

/* ===== the game screen ===== */
#game{background:var(--gbg);color:var(--gInk)}
.gcol{width:100%;height:100%;display:flex;flex-direction:column;padding:6px 0 8px;gap:6px;margin:0 auto}
.gtop,.pbar,#side{padding-left:8px;padding-right:8px}
.gtop{display:flex;gap:6px;align-items:center;flex:none;max-width:640px;width:100%;margin:0 auto}
.gtag{flex:1;min-width:0;font-size:12px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
.gbtn{width:44px;height:40px;flex:none;border-radius:12px;background:var(--chip);display:grid;place-items:center;color:var(--gInk)}
#main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
#main.land{flex-direction:row;justify-content:center;align-items:stretch}
#bcol{display:flex;flex-direction:column;gap:5px;flex:none;align-items:stretch}
.pbar{display:flex;align-items:center;gap:8px;min-height:40px;padding:3px 4px;min-width:0}
.pbar .who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.pbar .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.pbar .nm small{font-weight:600;opacity:.65;font-size:11.5px}
.pbar .cap{display:flex;align-items:center;min-height:18px;font-size:11.5px;font-weight:700;opacity:.85;overflow:hidden}
.pbar .cap svg{width:17px;height:17px;margin-right:-5px}
.pbar .cap b{margin-left:8px}
.pbar .badge2{width:34px;height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.pbar .clk{font:700 19px 'JetBrains Mono',ui-monospace,monospace;padding:4px 9px;border-radius:10px;background:var(--chip);min-width:74px;text-align:center;flex:none;font-variant-numeric:tabular-nums}
.pbar .clk.on{background:var(--gInk);color:var(--gbg)}
.pbar .clk.low{background:var(--bad);color:#fff}
.pbar .think{font-size:11px;font-weight:700;opacity:.7;animation:breathe 1.2s infinite}
.pbar.turn .nm::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
#boardWrap{position:relative;flex:none;border-radius:6px;box-shadow:0 0 0 3px var(--frame),0 6px 22px rgba(0,0,0,.18);touch-action:none}
#board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;height:100%;border-radius:4px;overflow:hidden}
.sq{position:relative;background:var(--sqL)}
.sq.d{background:var(--sqD)}
.sq::before{content:'';position:absolute;inset:0;pointer-events:none}
.sq.lm::before{background:var(--hlLast)}
.sq.sel::before{background:var(--hlSel)}
.sq.hint::before{background:var(--hlHint);box-shadow:inset 0 0 0 3px var(--gold)}
.sq.chk::before{background:radial-gradient(circle,rgba(255,40,40,.85) 0%,rgba(255,40,40,.45) 45%,rgba(255,40,40,0) 72%)}
.sq.tgt::after{content:'';position:absolute;left:50%;top:50%;width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;background:var(--hlDot);pointer-events:none;z-index:3}
.sq.cap::after{content:'';position:absolute;inset:4%;border-radius:50%;box-shadow:inset 0 0 0 calc(var(--cs)*.075) var(--hlDot);pointer-events:none;z-index:3}
.sq.hov{box-shadow:inset 0 0 0 3px var(--hlDot)}
.sq.bad::before{background:rgba(217,83,79,.55)}
.sq.good::before{background:rgba(47,158,106,.5)}
.sq .cf,.sq .cr{position:absolute;font-size:calc(var(--cs)*.2);font-weight:800;line-height:1;opacity:.85;pointer-events:none;z-index:1}
.big .sq .cf,.big .sq .cr{font-size:calc(var(--cs)*.3)}
.sq .cf{right:4%;bottom:3%}.sq .cr{left:5%;top:4%}
.sq .cf,.sq .cr{color:var(--cD)}.sq.d .cf,.sq.d .cr{color:var(--cL)}
#pcs{position:absolute;inset:0;pointer-events:none;z-index:2}
.pc{position:absolute;left:0;top:0;width:var(--cs);height:var(--cs);will-change:transform}
.pc svg{width:100%;height:100%;display:block}
.pc.drag{z-index:10;transition:none!important;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.pc.slide{transition:transform var(--slide,160ms) cubic-bezier(.3,.7,.3,1)}
.pc.gone{transition:opacity .2s;opacity:0}
.pc.topple svg{transition:transform .9s cubic-bezier(.5,0,.7,1);transform-origin:50% 88%;transform:rotate(80deg)}
#arrows{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:visible}
.mark{position:absolute;width:calc(var(--cs)*.36);height:calc(var(--cs)*.36);border-radius:50%;display:grid;place-items:center;font:800 calc(var(--cs)*.22) Inter,sans-serif;color:#fff;z-index:6;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.4)}
#side{display:flex;flex-direction:column;gap:6px;width:100%;flex:1;min-height:0;max-width:640px;position:relative}
#main.land #side{width:min(320px,38vw);flex:none}
#mlist{display:flex;gap:2px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none;padding:4px 2px;flex:none;min-height:34px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
#mlist::-webkit-scrollbar{display:none}
#main.land #mlist{flex-wrap:wrap;overflow-y:auto;align-content:flex-start;flex:1;white-space:normal}
#mlist .mn{opacity:.55;font-size:12px;padding:0 2px 0 6px;font-weight:700}
#mlist button{padding:4px 6px;border-radius:8px;font-weight:600;font-size:14px;color:var(--gInk)}
#mlist button.on{background:var(--gInk);color:var(--gbg)}
#mlist button .c{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:3px;vertical-align:middle}
#mlist .res{font-weight:800;padding:0 8px}
#tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:none;margin-top:auto}
#tools button{height:50px;border-radius:13px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;min-width:0;gap:1px;position:relative;color:var(--gInk)}
#tools button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
#tools button svg.i{width:19px;height:19px}
#tools button.on{background:var(--accent);color:var(--accentInk)}
#tools .cnt{position:absolute;top:-6px;right:2px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--gold);color:#3a2a00;font-size:11px;font-weight:800;display:grid;place-items:center;font-style:normal}
.banner{background:rgba(22,24,30,.94);color:#fff;border-radius:13px;padding:8px 10px;font-size:13px;line-height:1.35;display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none}
.banner b{flex:1 1 170px;min-width:0;font-weight:600}
.banner button{background:rgba(255,255,255,.92);color:#1c1c1e;border-radius:10px;padding:7px 11px;font-weight:700;font-size:13px}
.banner button.ok2{background:rgba(255,255,255,.16);color:#fff}
#review{display:flex;flex-direction:column;gap:6px;flex:none}
.accrow{display:flex;gap:8px}
.accrow div{flex:1;background:var(--chip);border-radius:12px;padding:6px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.95;min-width:0;overflow-wrap:anywhere}
.accrow b{display:block;font-size:18px;text-transform:none;letter-spacing:0}
#graph{width:100%;height:64px;border-radius:10px;background:var(--chip);display:block;cursor:pointer}
.prog{height:6px;border-radius:99px;background:var(--chip);overflow:hidden}.prog i{display:block;height:100%;background:var(--gold)}
#cover{position:fixed;inset:0;z-index:1000;background:var(--gbg);color:var(--gInk);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#cover.on{display:flex}

<script>
// ===================== SHELL =====================
const ARCADE=!!window.__ARCADE__, ARCADE_HOME='../index.html', ARCADE_PREFS='../index.html#prefs';
const REDUCED=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const store={get:k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } },set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} }};
let S=loadSave(store.get(KEY),REDUCED);
// P = settings in effect. Standalone it IS the save; inside Arcade the shared settings come from arcade.v1, in memory only.
let P=S;
function refreshShared(){ P=ARCADE?applyShared(S,readArcade(store)):S; }
refreshShared();
let sumT=0;
const writeSummary=()=>{ if(ARCADE) store.set(SUMKEY,JSON.stringify(summary(S))); };
const persist=()=>{ store.set(KEY,JSON.stringify(S)); if(ARCADE){ clearTimeout(sumT); sumT=setTimeout(writeSummary,300); } };
const CHANGES=[{v:'0.1.0',d:'2026-11-26',n:['First playable demo: play the computer at 8 strengths, with a colour choice, an optional clock and Chess960.','Puzzles from the Lichess puzzle database, by difficulty or theme, plus a Puzzle Streak that gets harder as you go.','Three campaigns of 15 levels: puzzle sets, endgame drills, position games and games against rising strengths.','A Daily puzzle, the same for everyone, easier on Monday and harder on Sunday.','2-Player: pass-and-play, or share codes that carry the whole game (and your Arcade avatar).','Post-game analysis: every move classified, an evaluation graph and your accuracy.','Our own engine, our own pieces and boards, and original music: Study and Gambit, plus Sweep\'s Daylight.']}];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const buzz=p=>{ if(!P.haptics) return; try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} };
const starsHtml=(n,of)=>`<span class="stars">${'★'.repeat(n)}<span class="o">${'★'.repeat(Math.max(0,(of||3)-n))}</span></span>`;
const sw=on=>`<span class="sw${on?' on':''}"></span>`;
const tq=[]; let tBusy=false, tTimer=0, tCur='';
function toast(m){ if((tBusy&&m===tCur)||tq.includes(m)) return; tq.push(m); if(!tBusy) nextToast(); }
function nextToast(){ const m=tq.shift(); if(!m){ tBusy=false; tCur=''; return; } const el=$('#toast'); tBusy=true; tCur=m; el.textContent=m; el.classList.add('on'); clearTimeout(tTimer);
  tTimer=setTimeout(()=>{ el.classList.remove('on'); tTimer=setTimeout(nextToast,420); },2400); }
const TF=(t,...a)=>T(t).replace(/\{(\d)\}/g,(_,n)=>a[n]);
// avatars (Arcade 0.12): only inside the Arcade, where ../avatars.js defines ArcadeAvatars
const avOn=()=>ARCADE&&!!window.ArcadeAvatars, myAv=()=>avOn()?ArcadeAvatars.mine():0;
const avH=(n,name,size)=>avOn()?ArcadeAvatars.html(n,name,size||20):'';

// ---------- translations (Sweep's watcher: every visible text node is translated as it appears) ----------
const LANGS=[['auto','Automatic'],['en','English'],['es','Español'],['fr','Français'],['de','Deutsch'],['pt','Português']];
let LANG='en', DICT=null, PATS=[];
const escRe=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function setLang(){ const pref=P.lang||'auto'; let l=pref==='auto'?String(navigator.language||'en').slice(0,2).toLowerCase():pref;
  const col=(typeof I18N_LANGS!=='undefined')?I18N_LANGS.indexOf(l):-1; if(col<1) l='en'; LANG=l; DICT=null; PATS=[]; document.documentElement.lang=l;
  if(l==='en') return; DICT=new Map();
  for(const row of I18N_ROWS){ const v=row[col]; if(!v) continue; DICT.set(row[0],v);
    if(row[0].includes('{')){ const parts=row[0].split(/(\{\d\})/), idx=[]; let re='^';
      for(const pt of parts){ const m=pt.match(/^\{(\d)\}$/); if(m){ re+='(.+?)'; idx.push(+m[1]); } else re+=escRe(pt); }
      PATS.push({re:new RegExp(re+'$','s'),idx,out:v,lit:parts[0],len:row[0].replace(/\{\d\}/g,'').length}); } }
  PATS.sort((a,b)=>b.len-a.len);
  // (tests only) recognise text that is already translated, including filled-in {0} patterns
  if(window.__i18nMiss){ DICTV=new Set(DICT.values()); DICTVP=I18N_ROWS.filter(r=>r[col]&&r[col].includes('{')).map(r=>new RegExp('^'+r[col].split(/\{\d\}/).map(escRe).join('.+?')+'$','s')); } }
let DICTV=null, DICTVP=[];
const known=v=>{ const t=v.trim().replace(/\s+/g,' ').replace(/^[·\s]+|[·\s]+$/g,''); return DICTV&&(DICTV.has(t)||DICTVP.some(re=>re.test(t))||t.split(' · ').every(x=>!/[A-Za-z]{2}/.test(x)||DICTV.has(x)||DICTVP.some(re=>re.test(x)))); };
function tr(text){ if(!DICT||text==null) return null; const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(text), core=m[2].replace(/\s+/g,' ');
  if(!core||!/[A-Za-z]/.test(core)) return null; let o=DICT.get(core);
  if(o==null) for(const Q of PATS){ if(Q.lit&&!core.startsWith(Q.lit)) continue; const mm=Q.re.exec(core); if(!mm) continue;
    const args=[]; Q.idx.forEach((n,i)=>args[n]=mm[i+1]); o=Q.out.replace(/\{(\d)\}/g,(_,n)=>{ const a=args[n]||''; const t=tr(a); return t!=null?t.trim():a; }); break; }
  if(o==null&&core.includes(' · ')){ let any=false; const parts=core.split(' · ').map(x=>{ const t=tr(x); if(t!=null){ any=true; return t; } return x; }); if(any) o=parts.join(' · '); }
  return o==null?null:m[1]+o+m[3]; }
const T=t=>{ const o=tr(t); return o==null?t:o; };
const SKIP=new Set(['SCRIPT','STYLE','TEXTAREA','INPUT']); const done=new WeakMap();
// the board, the move list and notation are never translated (move notation stays standard)
const NOTR='#board,#pcs,#mlist,[data-raw]';
function trNode(n){ const v=n.nodeValue; if(done.get(n)===v||!n.isConnected) return; const p=n.parentNode; if(p&&(SKIP.has(p.nodeName)||p.closest&&p.closest(NOTR))){ done.set(n,v); return; }
  const t=tr(v); if(t!=null&&t!==v) n.nodeValue=t; else if(t==null&&window.__i18nMiss&&/[A-Za-z]{2}/.test(v)&&!known(v)) window.__i18nMiss.add(v.trim()); done.set(n,n.nodeValue); }
function trAttrs(el){ for(const a of ['placeholder','aria-label','title']){ const v=el.getAttribute&&el.getAttribute(a); if(v){ const t=tr(v); if(t!=null) el.setAttribute(a,t); } } }
function trTree(root){ if(!DICT) return; if(root.nodeType===3){ trNode(root); return; } if(root.nodeType!==1) return;
  if(root.closest&&root.closest('#board,#pcs,#mlist')) return;
  trAttrs(root); if(SKIP.has(root.nodeName)) return; root.querySelectorAll&&root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(trAttrs);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentNode&&n.parentNode.closest&&n.parentNode.closest('#board,#pcs,#mlist')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}); let n; while((n=w.nextNode())) trNode(n); }
function startI18n(){ setLang(); if(!DICT) return; trTree(document.body);
  new MutationObserver(ms=>{ for(const m of ms){ if(m.type==='characterData') trNode(m.target); else m.addedNodes.forEach(trTree); } }).observe(document.body,{subtree:true,childList:true,characterData:true}); }

// ===================== AUDIO (Web Audio, synthesized live) =====================
const AU={};
function buildAudio(c){
  AU.ctx=c; AU.master=c.createGain(); AU.master.gain.value=.9; AU.master.connect(c.destination);
  AU.sfx=c.createGain(); AU.sfx.gain.value=1; AU.sfx.connect(AU.master);
  AU.mus=c.createGain(); AU.mus.gain.value=0;
  AU.musLP=c.createBiquadFilter(); AU.musLP.type='lowpass'; AU.musLP.frequency.value=3200;
  AU.mus.connect(AU.musLP); AU.musLP.connect(AU.master);
  AU.amb=c.createGain(); AU.amb.gain.value=0; AU.amb.connect(AU.master);
  AU.dly=c.createDelay(1); AU.dly.delayTime.value=.375;
  AU.fb=c.createGain(); AU.fb.gain.value=.3; const dl=c.createBiquadFilter(); dl.type='lowpass'; dl.frequency.value=2000;
  AU.dly.connect(dl); dl.connect(AU.fb); AU.fb.connect(AU.dly); dl.connect(AU.mus);
  AU.send=c.createGain(); AU.send.gain.value=.45; AU.send.connect(AU.dly);
  const len=c.sampleRate*2, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; AU.noise=b;
  const bb=c.createBuffer(1,len,c.sampleRate), bd=bb.getChannelData(0); let last=0; for(let i=0;i<len;i++){ last=(last+.02*(Math.random()*2-1))/1.02; bd[i]=last*3.5; } AU.brown=bb; }
function audio(){ if(!AU.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; try{ buildAudio(new C()); }catch(e){ return null; } }
  if(AU.ctx.state==='suspended'&&!document.hidden) AU.ctx.resume().catch(()=>{}); return AU.ctx; }
const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(o){ const c=AU.ctx, t=(o.at!=null?o.at:c.currentTime)+(o.t||0), d=o.d||.12, v=o.v||.2, a=o.a||.005, h=o.hold||0;
  const osc=c.createOscillator(), g=c.createGain(); osc.type=o.type||'sine'; osc.frequency.setValueAtTime(o.f,t);
  if(o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2,t+(o.glide||d)); if(o.det) osc.detune.value=o.det;
  g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(v,t+a); if(h) g.gain.setValueAtTime(v,t+a+h); g.gain.exponentialRampToValueAtTime(.0001,t+a+h+d);
  let n=osc; if(o.lp){ const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.lp; osc.connect(f); n=f; }
  n.connect(g); g.connect(o.dest||AU.sfx); if(o.send) g.connect(o.send); osc.start(t); osc.stop(t+a+h+d+.05); }
function noise(o){ const c=AU.ctx, t=(o.at!=null?o.at:c.currentTime)+(o.t||0), d=o.d||.1;
  const s=c.createBufferSource(); s.buffer=o.brown?AU.brown:AU.noise; const f=c.createBiquadFilter(); f.type=o.ft||'lowpass';
  f.frequency.setValueAtTime(o.f||1000,t); if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2,t+d); f.Q.value=o.q||.7;
  const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(o.v||.2,t+(o.a||.002)); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.loop=true; s.connect(f); f.connect(g); g.connect(o.dest||AU.sfx); s.start(t,Math.random()*1.5); s.stop(t+d+.05); }
// Sound packs: Wood (default; a piece set down on a wooden board), Felt (soft, muffled), Chiptune (square waves).
function sfx(name,arg,pack){ if(!P.sfx&&!pack) return; const c=audio(); if(!c) return; const pk=pack||look('sound'), chip=pk==='chip', felt=pk==='felt', sq=chip?'square':'triangle', vv=chip?.4:1;
  const knock=(t,v,hi)=>{ if(chip){ tone({t,f:hi?520:330,f2:hi?260:180,d:.06,v:.12*v,type:'square'}); return; }
    if(felt){ noise({t,d:.07,v:.16*v,ft:'lowpass',f:520,q:.5}); tone({t,f:hi?140:110,d:.06,v:.12*v,type:'sine'}); return; }
    noise({t,d:.05,v:.22*v,ft:'bandpass',f:hi?2100:1500,q:1.4}); tone({t,f:hi?250:190,f2:hi?160:130,d:.07,v:.16*v,type:'sine'}); };
  switch(name){
  case 'click': tone({f:chip?1760:1500,d:.025,v:.05*vv,type:chip?'square':'sine'}); return;
  case 'tap': tone({f:chip?1320:1150,d:.02,v:.025*vv,type:chip?'square':'sine'}); return;
  case 'move': knock(0,1,false); return;
  case 'capture': knock(0,1.3,true); knock(.045,.8,false); return;
  case 'castle': knock(0,.9,false); knock(.11,.9,false); return;
  case 'check': knock(0,1,true); [76,83].forEach((m,i)=>tone({f:hz(m),t:.03+i*.06,d:.14,v:.05*vv,type:chip?'square':'sine'})); return;
  case 'promote': knock(0,1,false); [72,76,79,84].forEach((m,i)=>tone({f:hz(m),t:.05+i*.05,d:.2,v:.05*vv,type:chip?'square':'sine',send:AU.send})); return;
  case 'mate': knock(0,1.4,true); [60,55,48].forEach((m,i)=>tone({f:hz(m),t:.08+i*.11,d:.45,v:.09*vv,type:sq})); return;
  case 'tick': tone({f:chip?1400:1900,d:.02,v:.03*vv,type:chip?'square':'sine'}); return;
  case 'hint': [84,88,91].forEach((m,i)=>tone({f:hz(m),t:i*.05,d:.3,v:.05,type:'sine',send:AU.send})); return;
  case 'right': [76,83].forEach((m,i)=>tone({f:hz(m),t:i*.07,d:.22,v:.06*vv,type:chip?'square':'sine'})); return;
  case 'bad': tone({f:220,f2:170,d:.16,v:.08*vv,type:sq}); return;
  case 'lose': [67,63,60].forEach((m,i)=>tone({f:hz(m),t:i*.14,d:.3,v:.07*vv,type:sq})); return;
  case 'draw': [67,67].forEach((m,i)=>tone({f:hz(m),t:i*.16,d:.25,v:.06*vv,type:sq})); return;
  case 'level': [79,84,88,91].forEach((m,i)=>tone({f:hz(m),t:i*.08,d:.3,v:.09*vv,type:sq})); return;
  case 'win': [72,76,79,84,88,91].forEach((m,i)=>tone({f:hz(m),t:i*.08,d:i===5?.8:.25,v:.09*vv,type:sq,send:AU.send})); tone({f:hz(48),d:.9,v:.15}); return;
  case 'star': tone({f:hz(84+(arg||0)*2),d:.3,v:.08,type:'sine',send:AU.send}); return;
  case 'topple': noise({t:.75,d:.18,v:.2,ft:'bandpass',f:900,q:1}); tone({t:.75,f:150,f2:80,d:.2,v:.18}); return; } }

// ---------- music: generative 8-bar loops ----------
// Study (default, original): ~70 BPM, G major. Soft bell chords and a slow arpeggio: calm, for thinking.
const STUDY={id:'study',bpm:70,style:'ink',
 chords:[[55,59,62,66],[52,55,59,62],[48,52,55,59],[50,54,57,60],[55,59,62,66],[47,50,55,59],[48,52,57,60],[50,54,57,62]],
 bass:[43,40,36,38,43,35,36,38],
 mel:[[[0,74,6],[8,71,6]],[[0,76,4],[6,74,2],[8,71,8]],[[2,72,4],[8,76,6]],[[0,74,12]],
      [[0,79,4],[4,78,4],[8,74,8]],[[0,71,6],[8,74,4],[12,76,4]],[[0,76,8],[8,74,4],[12,72,4]],[[0,74,8],[10,69,6]]]};
// Gambit (level 10, original): 84 BPM, A minor. A soft lo-fi groove with plucked chords.
const GAMBIT={id:'gambit',bpm:84,style:'lofi',
 chords:[[57,60,64,67],[53,57,60,64],[55,59,62,65],[52,55,59,62],[57,60,64,67],[50,53,57,60],[53,57,60,64],[52,56,59,62]],
 bass:[45,41,43,40,45,38,41,40],
 mel:[[[0,76,4],[4,79,2],[6,81,6]],[[0,77,4],[6,76,2],[8,72,6]],[[0,74,3],[4,77,3],[8,79,8]],[[2,76,2],[4,74,4],[10,71,6]],
      [[0,76,4],[4,81,4],[8,84,4],[12,83,4]],[[0,81,8],[10,77,6]],[[0,76,4],[6,77,4],[10,79,4]],[[0,80,8],[8,76,8]]]};
// Daylight: Sweep's default track, shared across the Arcade.
const DAYLIGHT={id:'daylight',bpm:100,style:'day',
 chords:[[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,64],[60,64,67,71],[52,55,59,62],[53,57,60,64],[55,60,62,67]],
 bass:[48,45,41,43,48,40,41,43],
 mel:[[[0,76,2],[3,79,2],[6,81,3],[10,79,2],[12,76,3]],[[2,72,2],[6,76,2],[8,74,3],[12,72,3]],[[0,69,2],[3,72,2],[6,76,4],[12,74,2],[14,72,2]],[[0,74,3],[4,76,2],[8,79,4],[14,74,2]],
      [[0,76,2],[3,79,2],[6,81,2],[8,84,4],[12,81,3]],[[2,79,2],[6,76,2],[8,74,2],[12,71,3]],[[0,69,2],[3,72,2],[6,76,2],[10,79,3],[14,76,2]],[[0,74,4],[6,76,2],[8,74,2],[10,72,6]]]};
const SONGS={study:STUDY,gambit:GAMBIT,daylight:DAYLIGHT}; let SG=STUDY;
const MUSVOL=.32;
const bell=(t,m,v,len,D)=>{ tone({at:t,f:hz(m),a:.006,d:Math.max(.5,len),v,type:'sine',dest:D,send:AU.send}); tone({at:t,f:hz(m+12),a:.004,d:.25,v:v*.22,type:'sine',dest:D}); tone({at:t,f:hz(m)*2.76,d:.12,v:v*.06,type:'sine',dest:D}); };
function musicStep(step,t,sd){ const bar=step>>4, s=step&15, D=AU.mus;
  if(SG.style==='day'){ const BP={0:0,6:0,8:7,11:0,14:12}; if(s&1) t+=sd*.14;
    if(s===0||s===8||(s===10&&bar%2===1)) tone({at:t,f:110,f2:42,glide:.12,d:.22,v:.5,dest:D});
    if(s===4||s===12) noise({at:t,d:.07,v:.08,ft:'bandpass',f:1900,q:1.2,dest:D});
    if(s%4===2) noise({at:t,d:.035,v:.055,ft:'highpass',f:7500,dest:D});
    if(s in BP) tone({at:t,f:hz(SG.bass[bar]+BP[s]),d:.26,v:.2,type:'triangle',lp:900,dest:D});
    if(s===0) for(const m of SG.chords[bar]) for(const det of [-7,7]) tone({at:t,f:hz(m),det,a:.35,hold:sd*16-.6,d:.6,v:.02,type:'triangle',lp:1400,dest:D});
    for(const [st,m,len] of SG.mel[bar]) if(st===s){ tone({at:t,f:hz(m),d:Math.max(.18,len*sd*1.2),v:.07,dest:D,send:AU.send}); tone({at:t,f:hz(m+12),d:.06,v:.014,type:'triangle',dest:D}); }
    return; }
  if(SG.style==='lofi'){ if(s&1) t+=sd*.18;
    if(s===0||s===10) tone({at:t,f:95,f2:45,glide:.1,d:.25,v:.38,dest:D});
    if(s===4||s===12) noise({at:t,d:.05,v:.05,ft:'bandpass',f:1500,q:2,dest:D});
    if(s%4===2) noise({at:t,d:.03,v:.03,ft:'highpass',f:7000,dest:D});
    if(s===0||s===7) tone({at:t,f:hz(SG.bass[bar]),d:.6,v:.2,type:'sine',lp:400,dest:D});
    if(s===2||s===6||s===11) SG.chords[bar].forEach((m,i)=>tone({at:t+i*.012,f:hz(m+12),a:.003,d:.3,v:.011,type:'triangle',lp:2000,dest:D}));
    if(s===0) for(const m of SG.chords[bar]) tone({at:t,f:hz(m),a:.4,hold:sd*12,d:.8,v:.009,type:'sine',dest:D});
    for(const [st,m,len] of SG.mel[bar]) if(st===s) tone({at:t,f:hz(m),a:.01,d:Math.max(.3,len*sd),v:.045,type:'triangle',lp:2200,dest:D,send:AU.send});
    return; }
  // Study: a soft bell pad on the bar, a slow arpeggio on the beats, bass on 1 and the "and" of 3
  if(s===0||s===10) tone({at:t,f:hz(SG.bass[bar]),d:1.1,v:.18,type:'sine',lp:360,dest:D});
  if(s===0) for(const m of SG.chords[bar]) for(const det of [-5,5]) tone({at:t,f:hz(m),det,a:.6,hold:sd*12,d:1,v:.011,type:'triangle',lp:1200,dest:D});
  if(s%4===0) bell(t,SG.chords[bar][(s/4)%4]+12,.012,sd*4,D);
  for(const [st,m,len] of SG.mel[bar]) if(st===s) bell(t,m,.04,len*sd*1.2,D); }
const Music={on:false,step:0,next:0,iv:0,
  start(){ const c=audio(); if(!c||this.on) return; this.on=true; this.step=0; this.next=c.currentTime+.08;
    SG=SONGS[look('track')]||STUDY;
    AU.dly.delayTime.setValueAtTime(3*60/SG.bpm/4,c.currentTime);
    const g=AU.mus.gain; g.cancelScheduledValues(c.currentTime); g.setValueAtTime(g.value,c.currentTime); g.linearRampToValueAtTime(MUSVOL,c.currentTime+2);
    clearInterval(this.iv); this.iv=setInterval(()=>this.tick(),30); Amb.start(); },
  stop(){ if(!this.on) return; this.on=false; clearInterval(this.iv); const c=AU.ctx, g=AU.mus.gain; g.cancelScheduledValues(c.currentTime); g.setTargetAtTime(0,c.currentTime,.25); Amb.stop(); },
  restart(){ if(!this.on) return; this.stop(); setTimeout(()=>{ if(P.music) this.start(); },450); },
  tick(){ const c=AU.ctx, sd=60/SG.bpm/4; if(c.state!=='running'){ this.next=c.currentTime+.05; return; }
    if(this.next<c.currentTime) this.next=c.currentTime+.02;
    while(this.next<c.currentTime+.2){ musicStep(this.step,this.next,sd); this.next+=sd; this.step=(this.step+1)%128; }
    Amb.tick(); } };
// Ambience (optional background, follows the Music switch): Library, Rain or Park.
const Amb={src:null,id:'none',next:0,
  start(){ const c=audio(); if(!c) return; this.stop(true); this.id=look('amb'); if(this.id==='none') return;
    const s=c.createBufferSource(); s.buffer=this.id==='library'?AU.brown:AU.noise; s.loop=true; const f=c.createBiquadFilter();
    if(this.id==='rain'){ f.type='bandpass'; f.frequency.value=1800; f.Q.value=.4; } else if(this.id==='park'){ f.type='lowpass'; f.frequency.value=500; } else { f.type='lowpass'; f.frequency.value=320; }
    const g=c.createGain(); g.gain.value=this.id==='rain'?.06:this.id==='park'?.035:.09; s.connect(f); f.connect(g); g.connect(AU.amb); s.start(); this.src=s;
    const a=AU.amb.gain; a.cancelScheduledValues(c.currentTime); a.setTargetAtTime(.9,c.currentTime,.8); this.next=c.currentTime+.5; },
  stop(now){ if(this.src){ try{ this.src.stop(); }catch(e){} this.src=null; } if(AU.ctx&&!now) AU.amb.gain.setTargetAtTime(0,AU.ctx.currentTime,.2); },
  tick(){ if(!this.src) return; const c=AU.ctx; if(c.currentTime<this.next) return;
    if(this.id==='rain'){ noise({d:.02,v:.04,ft:'highpass',f:4000+Math.random()*3000,dest:AU.amb}); this.next=c.currentTime+.05+Math.random()*.25; }
    else if(this.id==='park'){ // now and then a bird: two or three quick rising chirps
      if(Math.random()<.55){ const b=2600+Math.random()*1400, n=2+Math.floor(Math.random()*2); for(let i=0;i<n;i++) tone({t:i*.11,f:b,f2:b*1.35,glide:.06,d:.07,v:.012,type:'sine',dest:AU.amb}); }
      this.next=c.currentTime+2+Math.random()*5; }
    else { if(Math.random()<.6) noise({d:.38,v:.035,ft:'bandpass',f:2600,f2:700,q:.9,dest:AU.amb}); this.next=c.currentTime+5+Math.random()*9; } } };
const unlockAudio=()=>{ if(!P.sfx&&!P.music) return; audio(); if(P.music) Music.start(); };

 paper:{sqL:'#fbf8f1',sqD:'repeating-linear-gradient(45deg,#d8cfbd 0 2px,#e3dbca 2px 5px)',cL:'#fbf8f1',cD:'#8a7d66',frame:'#3a342a',gbg:'#f4f1ea',gInk:'#2a2620',chip:'rgba(60,45,20,.08)',dark:0},

<script>
// ===================== NAVIGATION =====================
// Android back: in a game it opens the pause menu first; then it closes a sheet; then it returns home; then (home, in Arcade) goes to Arcade.
let cur='home', sheetOn=false, guarded=false, G=null, setReturn=false;
function show(id){ $$('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); cur=id; guard(); if(id!=='game') stopClock(); }
const needGuard=()=>ARCADE||cur!=='home'||sheetOn;
function guard(){ if(needGuard()&&!guarded){ try{ history.pushState({chess:1},''); guarded=true; }catch(e){} } }
addEventListener('popstate',()=>{ guarded=false; back(); guard(); });
const coverOn=()=>$('#cover').classList.contains('on');
function back(){
  if(cur==='game'&&G&&!G.over&&!G.review&&!sheetOn&&!coverOn()){ openPause(); return; }
  if(sheetOn){ closeSheet(); return; }
  if(coverOn()){ resume(); return; }
  if(cur==='game'&&G){ leaveGame(); return; }
  if(cur==='set'&&setReturn){ backFromSettings(); return; }
  if(cur!=='home'){ goHome(); return; }
  if(ARCADE) leaveTo(ARCADE_HOME); }
function leaveTo(url){ if(G) saveGame(); persist(); writeSummary(); location.replace(url); }
let sheetClose=null;
function openSheet(html,onClose){ $('#sheet').innerHTML=html; $('#ov').classList.add('on'); $('#sheet').scrollTop=0; sheetOn=true; sheetClose=onClose||null; guard(); stopClock(); }
function closeSheet(){ if(!sheetOn) return; $('#ov').classList.remove('on'); sheetOn=false; const f=sheetClose; sheetClose=null; if(f) f(); if(cur==='game') startClock(); }
$('#ov').addEventListener('click',e=>{ if(e.target.id==='ov'&&!$('#sheet').dataset.modal) closeSheet(); });
$('#sheet').addEventListener('click',e=>{ if(e.target.closest('[data-close]')) closeSheet(); });
function goHome(){ closeSheet(); renderHome(); show('home'); }
const backBtn=`<button class="iconbtn" data-home aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>`;
document.addEventListener('click',e=>{ if(e.target.closest('[data-home]')) goHome(); });
function segHtml(key,opts,val){ return `<div class="seg" data-seg="${key}">${opts.map(([v,n])=>`<button data-v="${v}" class="${String(v)===String(val)?'on':''}">${n}</button>`).join('')}</div>`; }
async function share(text,okMsg){ try{ if(navigator.share){ await navigator.share({text}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast(okMsg||'Copied to the clipboard'); return; }catch(e){}
  openSheet(`<h2>Share</h2><div class="sub">Copy this text:</div><textarea rows="4" readonly>${esc(text)}</textarea><div class="btns"><button class="primary" data-close>Done</button></div>`); $('#sheet textarea').select(); }

const ICONS={play:'<svg class="i" viewBox="0 0 24 24"><path d="M8 20h8M9 20l1-6h4l1 6M12 4a2.5 2.5 0 110 5 2.5 2.5 0 010-5zM9.5 9h5l-1 5h-3z"/></svg>',
 puz:'<svg class="i" viewBox="0 0 24 24"><path d="M10 3h4v3a2 2 0 104 0V3h3v7h-3a2 2 0 100 4h3v7h-7v-3a2 2 0 10-4 0v3H3v-7h3a2 2 0 100-4H3V3z"/></svg>',
 camp:'<svg class="i" viewBox="0 0 24 24"><path d="M4 21V4l8 3 8-3v17l-8 3z"/><path d="M12 7v17"/></svg>',
 daily:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',

 prog:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/></svg>',

 cont:'<svg class="i" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>'};
function nextLevel(){ for(const L of LEVELS) if(unlocked(S,L)&&!campCleared(S,L.id)) return L; return null; }
const campName=L=>T(CAMPS[L.camp].name)+' '+L.n+' · '+L.name;

  return TF('vs {0} · {1}',strengthName(r.level),T(colourName(r.me))); }
function renderHome(){ const today=todayStr(); refreshHints(S,today); streakNow(S,today); const l=levelOf(S.xp), nx=xpNext(S), base=LVXP[l-1], pct=nx?Math.round((S.xp-base)/(nx-base)*100):100;
  const dd=dailyFor(S,today), nl=nextLevel(), run=S.run, dp=dailyPuzzle(today), yourTurn=S.tp.games.filter(g=>g.mode==='code'&&!g.over&&g.turn===g.me).length;
  let h=`<button class="card lvl" id="hLevel"><div class="badge">${l}</div><div class="grow"><div class="t">Level ${l}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="s">${nx?`${S.xp} / ${nx} XP`:`${S.xp} XP · max level`}</div></div><div class="r"><b>${S.hints}/${HINT_CAP}</b><span>Hints</span></div></button>`;

   <button class="card" id="hDaily"><div class="ico">${ICONS.daily}</div><div class="grow"><div class="t">Daily</div><div class="s">${esc(T(WDN[weekdayOf(today)]))}${dp?' · '+esc(TF('rated about {0}',DAILY_BANDS[weekdayOf(today)][0])):''}</div></div><div class="r">${dd.scored?`<b>${dd.cleared?fmtTime(dd.time):'—'}</b>${starsHtml(dd.stars)}`:dd.run?`<b>Resume</b><span>Today</span>`:`<b>Play</b><span>Today</span>`}</div></button>

   <div class="row2"><button class="card" id="hProg"><div class="ico">${ICONS.prog}</div><div class="grow"><div class="t">Progress</div><div class="s">${Object.keys(S.ach).length}/${ACH.length} achievements</div></div></button>
   <button class="card" id="hHelp"><div class="ico">${ICONS.help}</div><div class="grow"><div class="t">How to play</div></div></button></div>`;
  $('#homeBody').innerHTML=h; $('#arcadeBtn').hidden=!ARCADE;

  $('#hProg').onclick=()=>openProgress('levels'); $('#hHelp').onclick=openHowto;
  if($('#hCont')) $('#hCont').onclick=()=>resumeRun(S.run); }

// starting something new replaces the game in progress (an abandoned Classic game is a loss)

async function gz(bytes,inflate){ const CS=inflate?window.DecompressionStream:window.CompressionStream; if(!CS) return null;
  const s=new Blob([bytes]).stream().pipeThrough(new CS('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); }
async function backupCode(){ const json=JSON.stringify(S);

  return backupPlain(S); }
async function readBackup(text){ const m=/CHESS1Z\.([A-Za-z0-9+/=]+)/.exec(String(text||''));
  if(m){ try{ const bin=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0)); const out=await gz(bin,true); const o=JSON.parse(new TextDecoder().decode(out)); return o&&typeof o.xp==='number'?o:null; }catch(e){ return null; } }
  return parseBackup(text); }

<script>
// ===================== ENGINE JOBS =====================
// One search at a time, in ~8 ms slices per frame: the foreground job (the computer's move, a hint) first, then the
// background analysis. Each job keeps its own search state between slices.
const JOBS=[]; let jobRAF=0;
function runJob(gen,o){ const j={gen,fg:!!o.fg,done:o.done,tick:o.tick,sr:null,last:0}; JOBS.push(j); schedule(); return j; }

function cancelFg(){ for(const j of JOBS.filter(j=>j.fg)) cancelJob(j); }

    $$('#sheet [data-pr]').forEach(b=>b.onclick=()=>{ closeSheet(); preMove(promo.find(m=>mPromo(m)===+b.dataset.pr),true); }); return; }

// Confirm move (setting): show the move and ask before it's played
function preMove(m,dragged){ if(!S.prefs.confirm){ humanMove(m,dragged); return; } const san=toSan(G.pos,m);

  showBanner(`<b data-raw>${esc(TF('Play {0}?',sanShow(san)))}</b><button id="cfYes">${esc(T('Play'))}</button><button class="ok2" id="cfNo">${esc(T('Cancel'))}</button>`);
  $('#cfYes').onclick=()=>{ hideBanner(); G.hint=null; humanMove(m,true); }; $('#cfNo').onclick=()=>{ hideBanner(); G.hint=null; render(); }; }
function humanMove(m,dragged){ if(isPuzzle()){ puzzleMove(m,dragged); return; } playMove(m,{anim:!dragged}); }
// a move on the board: notation, clocks, sounds and the slide
function playMove(m,o){ o=o||{}; const p=G.pos, ms=legalMoves(p), san=toSan(p,m,ms), uci=toUci(p,m), fl=mFlags(m), mover=p.side, from=mFrom(m), to=mTo(m);

  makeMove(p,m); G.g.moves.push(uci); G.sans.push(san); G.hint=null; G.badSq=0; hideBanner();
  if(G.left&&G.clock) G.left[mover]+=CLOCKS[G.clock].inc;
  const anim=[]; if(o.anim!==false){ if(fl&F_CASTLE){ const r=from&0x70, sd=castleSide(m); anim.push([from,r+(sd?2:6)],[to,r+(sd?3:5)]); } else anim.push([from,to]); }
  const chk=inCheck(p), mate=chk&&!legalMoves(p).length;
  sfx(mate?'mate':chk?'check':fl&F_CASTLE?'castle':mPromo(m)?'promote':fl&F_CAP?'capture':'move'); buzz(fl&F_CAP?18:10);
  if(G.mode==='pp'&&S.prefs.autoFlip&&!o.noflip){ flip=p.side===BLACK; buildBoard(); render(); } else render(anim.length?anim:null);
  if(chk) setTimeout(()=>checkFx(p.k[p.side],mate),anim.length?180:0);

function afterMove(){ const st=gameStatus(G.pos);
  if(st.over&&!isPuzzle()){ if(G.mode==='tp') G.sendEnd=true; endGame(st); return; }
  if(G.mode==='campaign'&&!G.pz){ const L=levelById(G.lid); if(L.type==='hold'&&myMoveCount()>=L.hold){ endGame({over:true,result:'held',reason:'held'}); return; } }

const myMoveCount=()=>{ const first=fromFEN(G.g.start).side; let n=0; for(let i=0;i<G.g.moves.length;i++) if(((first+i)&1)===G.me) n++; return n; };

// the computer's move, in slices; strengths 1–6 pause 0.4–1.0 s first (setting) so moves don't feel instant
function aiTurn(){ if(G.thinking) return; const game=G, n=G.g.moves.length, lv=G.level, rnd=rngFor(G.id+'|'+n), q=clonePos(G.pos); q.undo=[]; q.hist=G.pos.hist.slice();

// ---------- check and mate effects: Pulse, Ripple, Crack ----------
function checkFx(s,mate,box,id){ if(!P.motion) return; id=id||look('check'); const el=box||EL.sq[s]; if(!el) return;
  if(id==='pulse'){ el.animate([{filter:'brightness(1)'},{filter:'brightness(1.5)'},{filter:'brightness(1)'}],{duration:mate?900:600,iterations:mate?2:1}); return; }
  const host=box||$('#boardWrap'), [x,y]=box?[0,0]:sqXY(s), c=box?box.clientWidth:LY.cs;
  if(id==='ripple'){ for(let k=0;k<(mate?3:2);k++){ const d=document.createElement('div'); d.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:${c}px;height:${c}px;border-radius:50%;border:3px solid rgba(255,60,60,.9);pointer-events:none;z-index:7`;
      host.appendChild(d); d.animate([{transform:'scale(.4)',opacity:1},{transform:'scale(2.4)',opacity:0}],{duration:800,delay:k*220,easing:'ease-out'}).onfinish=()=>d.remove(); } return; }

    d.innerHTML=`<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M50 50L20 8M50 50L88 18M50 50L92 70M50 50L30 95M50 50L6 60M35 30L22 34M70 34L78 42M68 62L80 58" stroke="#1a1a1a" stroke-width="${mate?4:2.5}" fill="none" stroke-linecap="round"/><path d="M50 50L20 8M50 50L88 18M50 50L92 70M50 50L30 95M50 50L6 60" stroke="#fff" stroke-width="1" fill="none" opacity=".6"/></svg>`;
    host.appendChild(d); d.animate([{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1)',offset:.2},{opacity:1},{opacity:0}],{duration:mate?1800:900}).onfinish=()=>d.remove(); } }

  do{ G.g.moves.pop(); } while(G.g.moves.length&&((first+G.g.moves.length)&1)!==G.me);
  G.pos=posAt(G.g); G.sans=gameSans(G.g); G.takebacks++; G.assisted=true; G.hint=null; selSq=-1; sfx('move'); saveGame(); render(); toast('Move taken back (an assist)'); }
$('#bHint').onclick=doHint;
function doHint(){ if(!G||G.over||G.review||viewPly!=null||G.noassist) return; if(isPuzzle()){ puzzleHint(); return; } if(!vsComputer()||G.pos.side!==G.me||G.thinking) return;
  if(G.hint&&G.hint.arrow){ return; } if(S.hints<=0){ toast('No hints left today. You get +1 for every level-up.'); return; }
  useHint(S); G.hints++; G.assisted=true; persist(); drawTools(); const game=G, n=G.g.moves.length, q=clonePos(G.pos); q.undo=[]; q.hist=G.pos.hist.slice();
  showBanner(`<b>${esc(T('Thinking about a hint…'))}</b>`);
  runJob(hintGen(q),{fg:true,done:r=>{ if(G!==game||G.g.moves.length!==n||!r.move) return; const m=r.move, f=mFrom(m), t=mFlags(m)&F_CASTLE&&!G.pos.c960?(f&0x70)+(castleSide(m)?2:6):mTo(m);
    G.hint={sq:-1,arrow:[f,t]}; sfx('hint'); render(); showBanner(`<b data-raw>${esc(TF('Best move: {0}',sanShow(toSan(G.pos,m))))}</b><button class="ok2" id="hOk">OK</button>`); $('#hOk').onclick=()=>{ hideBanner(); G.hint=null; render(); }; }}); }
function offerDraw(){ if(!vsComputer()||G.over) return; const q=clonePos(G.pos); q.undo=[]; q.hist=G.pos.hist.slice(); const game=G;

  if(G.mode==='pp'){ const c=G.pos.side; const g=tpFind(S,G.gid); g.end=c===WHITE?1:2; endGame({over:true,result:c===WHITE?'0-1':'1-0',reason:'resign'}); return; }

// ---------- puzzles: the computer plays the replies; any move that also mates counts ----------
function puzzleMove(m,dragged){ const pz=G.pz, step=G.g.moves.length, exp=pz.sol[step];

  setTimeout(()=>{ if(G!==game) return; unmakeMove(p); G.badSq=0; G.busy=false; render(); saveGame();
    if(G.streak!=null){ puzzleDone(false); return; } toast('Not the best move: try again'); },650); }
function puzzleHint(){ if(G.busy||G.pos.side!==G.me) return; const exp=G.pz.sol[G.g.moves.length]; if(!exp) return; const m=fromUci(G.pos,exp); if(!m) return;

function puzzleDone(solved){ stopClock(); G.over=true; const pz=G.pz, today=todayStr(); let res={kind:'puzzle',solved,stars:null,xp:null,ach:[],fresh:[]};

  if($('#rRetry')) $('#rRetry').onclick=()=>{ closeSheet(); end(); startLevel(L); };

// ---------- the end of a game ----------
const RESULT_TEXT={checkmate:'Checkmate',stalemate:'Stalemate',repetition:'Draw by threefold repetition',fifty:'Draw by the fifty-move rule',material:'Draw: not enough material to mate',agreed:'Draw agreed',resign:'Resigned',time:'Lost on time','timeout-draw':'Time out, but no material to mate: draw',held:'You held the position'};
function endGame(st){ if(!G||G.over) return; stopClock(); cancelFg(); G.thinking=false; G.over=true; G.result=st.result==='held'?'½':st.result; G.reason=st.reason; selSq=-1; const today=todayStr();
  const me=G.me, won=me!=null&&((st.result==='1-0'&&me===WHITE)||(st.result==='0-1'&&me===BLACK)), draw=st.result==='1/2-1/2', outcome=won?'win':draw?'draw':'loss';
  const res={won,draw,outcome,reason:st.reason,stars:null,xp:null,ach:[],fresh:[],recs:[],pendingAcc:false};
  const g={start:G.g.start,moves:G.g.moves.slice(),c960:G.g.c960};
  if(G.mode==='classic'){ res.recs=recordGame(S,{level:G.level,colour:me,result:outcome,c960:g.c960>=0}); res.xp=addXP(S,classicXP(G.level,outcome,assistedNow()))||null; if(res.xp&&!res.xp.xp) res.xp=null;
    res.stars=gameStars(won,assistedNow(),null); res.pendingAcc=won; res.ach=checkAch(S,{mode:'classic',won,level:G.level,colour:me,g,clock:G.clock}); }
  else if(G.mode==='campaign'){ const L=levelById(G.lid), mine=myMoveCount();
    let o; if(L.type==='drill') o={cleared:won&&st.reason==='checkmate',s2:mine<=L.par,s3:!assistedNow()};
    else if(L.type==='hold'){ const ok=st.result==='held'||draw; o={cleared:ok,s2:ok&&G.pos.cnt[ROOK|me<<3]>0,s3:!assistedNow()}; res.won=ok; }
    else if(L.type==='pos') o={cleared:won,s2:!assistedNow(),s3:mine<=L.par};
    else { o={cleared:won,s2:!assistedNow(),s3:false}; res.pendingAcc=won; }
    const cr=campaignResult(S,L,o); res.stars=cr.earned; res.fresh=cr.fresh; res.camp=cr; if(cr.xp) res.xp=addXP(S,cr.xp);
    if(L.strength&&L.type!=='drill'&&L.type!=='hold') recordGame(S,{level:L.strength,colour:me,result:outcome,c960:g.c960>=0});
    res.ach=checkAch(S,{mode:'campaign',won,level:L.strength,colour:me,g,clock:G.clock}); }
  else if(G.mode==='tp'){ const tg=tpFind(S,G.gid); if(tg){ const cs=codeStatus(tg); tg.over=true; if(tpCount(S,tg,Object.assign({},cs,{over:true,winner:st.result==='1-0'?WHITE:st.result==='0-1'?BLACK:null}))) res.ach=checkAch(S,{mode:'tp'}); } }
  else if(G.mode==='pp'){ const k=st.result==='1-0'?'w':st.result==='0-1'?'b':'d'; S.rec.pp[k]++; }
  // the analysis (accuracy star, move classes) runs in the background and resumes after leaving
  if((G.mode==='classic'||G.mode==='campaign')&&g.moves.length>=2){ const e={id:G.id,mode:G.mode,lid:G.lid,level:G.level,colour:me,g,won:res.won,assisted:assistedNow(),evals:[],done:false,auto:S.prefs.analyse};
    e.paused=!S.prefs.analyse; queueAnalysis(S,e); G.anId=e.id; pumpAnalysis(); }
  saveGame(); persist(); writeSummary(); render();
  const wfx=P.motion&&won&&look('win')!=='none';
  if(won){ sfx('win'); buzz([20,40,20]); if(wfx) setTimeout(()=>winFx(),400); } else if(draw||st.result==='held') sfx('draw'); else sfx('lose');
  setTimeout(()=>showResults(res),won&&wfx?2200:st.reason==='checkmate'?1100:600); }
function winFx(){ const id=look('win'); if(id==='topple'){ const k=G.pos.k[G.pos.side], el=$(`#pcs .pc[data-s="${k}"]`); if(el){ el.classList.add('topple'); sfx('topple'); } return; } playWin(id); }
function showResults(res){ if(!G) return; const m=G.mode, L=G.lid?levelById(G.lid):null, an=S.anq.find(e=>e.id===G.anId);
  const me=G.me, title=m==='pp'?(res.draw?T('Draw'):TF('{0} wins',T(colourName(G.result==='1-0'?WHITE:BLACK)))):m==='tp'&&!res.won&&!res.draw?T('Your friend won'):res.won?(L&&L.type==='hold'?T('Held!'):T('You won!')):res.draw?T('Draw'):T('You lost');
  const labels=m==='campaign'?levelStarText(L):['Win','No assists (hints or takebacks)',TF('Accuracy {0}% or more',ACC_STAR)];
  let h=`<h2>${esc(title)}</h2><div class="sub">${esc(T(RESULT_TEXT[res.reason]||''))}${m==='campaign'?` · <span data-raw>${esc(campName(L))}</span>`:m==='classic'?' · '+esc(TF('vs {0}',strengthName(G.level))):''}</div>
   <div class="kv"><div><b>${Math.ceil(G.g.moves.length/2)}</b><span>Moves</span></div><div><b id="accV">${an&&an.done&&an.acc!=null?an.acc+'%':'—'}</b><span>Accuracy</span></div><div><b>${G.hints+G.takebacks}</b><span>Assists</span></div></div>`;
  if(res.stars) h+=labels.map((lb,i)=>{ const pend=i===2&&res.pendingAcc&&!(an&&an.done); return `<div class="goal${res.stars[i]?' got':''}${res.fresh.includes(i)?' new':''}${pend?' wait':''}" ${i===2?'id="accStar"':''}><span class="st">★</span><span>${esc(T(lb))}${pend?' · '+esc(T(an&&!an.paused?'analysing…':'tap Analysis')):''}</span></div>`; }).join('');
  if(m==='campaign'&&!res.won) h+=`<div class="sub" style="margin-top:6px">Clear the level to earn its stars.</div>`;
  if(m==='tp'||m==='pp') h+=`<div class="sub">${esc(T(m==='pp'?'Pass-and-play counts nothing.':'Share-code wins count toward the Rivals achievements.'))}</div>`;
  h+=xpHtml(res); if(res.camp&&res.camp.finished) h+=`<div class="sub"><b>${esc(TF('{0} complete!',T(CAMPS[L.camp].name)))}</b></div>`;
  if(res.recs&&res.recs.length) h+=`<div class="sub">${esc(TF('New record: {0}',res.recs.map(T).join(', ')))}</div>`;
  h+=achHtml(res.ach);
  const next=m==='campaign'?LEVELS[LEVELS.indexOf(L)+1]:null;
  h+=`<div class="btns">${G.g.moves.length>=2?'<button class="ghost" id="rAn">Analysis</button>':''}<button class="ghost" id="rHome">Home</button>
   ${m==='classic'?'<button class="primary" id="rNew">New game</button>':''}
   ${m==='campaign'?`<button class="ghost" id="rRetry">${res.won?'Retry for stars':'Retry'}</button>${res.won&&next&&unlocked(S,next)?'<button class="primary" id="rLv">Next level</button>':'<button class="primary" id="rMap">Campaign</button>'}`:''}
   ${m==='tp'||m==='pp'?'<button class="primary" id="rTp">2-Player</button>':''}</div>${m==='tp'&&G.sendEnd?'<div class="btns"><button class="primary" id="rSend">Send the result to your friend</button></div>':''}`;
  starSounds(res); openSheet(h,()=>{}); G.resOpen=true;
  const end=()=>{ const g=G; G=null; return g; };
  if($('#rAn')) $('#rAn').onclick=()=>{ closeSheet(); openAnalysis(G.anId||null); };
  $('#rHome').onclick=()=>{ end(); goHome(); };
  if($('#rNew')) $('#rNew').onclick=()=>{ closeSheet(); end(); startClassic(); };
  if($('#rRetry')) $('#rRetry').onclick=()=>{ closeSheet(); end(); startLevel(L); };
  if($('#rLv')) $('#rLv').onclick=()=>{ closeSheet(); end(); openCamp(next.camp); openLevel(next); };
  if($('#rMap')) $('#rMap').onclick=()=>{ closeSheet(); end(); openCamp(L.camp); };
  if($('#rTp')) $('#rTp').onclick=()=>{ closeSheet(); end(); openTp(); };
  if($('#rSend')) $('#rSend').onclick=()=>{ closeSheet(); tpShareSheet(); }; }

// ---------- analysis: background queue and the review screen ----------
let anJob=null, anSaved=0;
function pumpAnalysis(){ if(anJob) return; const e=S.anq.find(x=>!x.done&&!x.paused); if(!e) return;
  anJob=runJob(analyseGen(e.g,e),{fg:false,tick:pr=>{ if(performance.now()-anSaved>3000){ anSaved=performance.now(); persist(); }
      const ln=$('#anLine'); if(ln) ln.textContent=TF('Analysing your last game… {0}%',Math.round(e.evals.length/(e.g.moves.length+1)*100));
      if(G&&G.review&&G.anId===e.id) drawReview(); },
    done:sum=>{ anJob=null; e.done=true; e.sum=sum; const r=analysisDone(S,e,sum); if(r.xp) addXP(S,r.xp); persist(); writeSummary();
      if(r.acc!=null&&!(G&&G.review)) toast(TF('Analysis ready: {0}% accuracy',r.acc)+(r.star?' · ★':''));
      if(r.star){ sfx('star',2); } for(const id of r.ach) toast('★ '+ACH.find(a=>a.id===id).name);
      if(G&&G.anId===e.id&&sheetOn){ const v=$('#accV'), s=$('#accStar'); if(v) v.textContent=r.acc!=null?r.acc+'%':'—'; if(s){ s.classList.remove('wait'); if(r.star) s.classList.add('got','new'); s.lastChild.textContent=TF('Accuracy {0}% or more',ACC_STAR); } }
      if(G&&G.review&&G.anId===e.id){ G.ann=sum; render(); drawReview(); }
      pumpAnalysis(); }}); }
function openAnalysis(id){ let e=id?S.anq.find(x=>x.id===id):null; const src=G;
  if(!e){ e={id:src.id,mode:src.mode,lid:src.lid,level:src.level,colour:src.me==null?WHITE:src.me,g:{start:src.g.start,moves:src.g.moves.slice(),c960:src.g.c960},won:false,evals:[],done:false}; queueAnalysis(S,e); }
  if(e.paused){ e.paused=false; } persist(); pumpAnalysis();
  cancelFg(); G={review:true,anId:e.id,g:e.g,me:e.colour,mode:'review',pos:posAt(e.g),sans:gameSans(e.g),ann:e.done?e.sum:null,over:true,result:null,hints:0,takebacks:0,time:0};
  viewPly=0; flip=e.colour===BLACK; hideBanner(); show('game'); buildBoard(); layoutBoard(); render(); drawReview(); }
function drawReview(){ const box=$('#review'); if(!G||!G.review){ box.hidden=true; return; } box.hidden=false; const e=S.anq.find(x=>x.id===G.anId), a=G.ann;
  if(!a){ const n=e?Math.round(e.evals.length/(e.g.moves.length+1)*100):0; box.innerHTML=`<div class="accrow"><div>${esc(T('Analysing…'))}<b>${n}%</b></div></div><div class="prog"><i style="width:${n}%"></i></div>`; return; }
  const cnt=side=>{ const c={}; a.moves.forEach(x=>{ if(x.side===side) c[x.cls]=(c[x.cls]||0)+1; }); return ['inaccuracy','mistake','blunder'].map(k=>`<span style="color:${CLS_COL[k]}">${c[k]||0}${CLS_SYM[k]}</span>`).join(' '); };
  const W=300, H=64, n=a.graph.length, pts=a.graph.map((v,i)=>`${(i/(Math.max(1,n-1))*W).toFixed(1)},${(H/2-v/1000*H/2).toFixed(1)}`).join(' '), vx=viewPly!=null?(viewPly/(Math.max(1,n-1))*W):-10;
  const cur=viewPly?a.moves[viewPly-1]:null;
  box.innerHTML=`<div class="accrow"><div>${esc(T('White'))}<b>${a.acc[0]!=null?a.acc[0]+'%':'—'}</b>${cnt(0)}</div><div>${esc(T('Black'))}<b>${a.acc[1]!=null?a.acc[1]+'%':'—'}</b>${cnt(1)}</div></div>
   <svg id="graph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><rect x="0" y="0" width="${W}" height="${H/2}" fill="rgba(255,255,255,.55)"/><rect x="0" y="${H/2}" width="${W}" height="${H/2}" fill="rgba(0,0,0,.35)"/><polyline points="0,${H/2} ${pts} ${W},${H/2}" fill="rgba(240,240,240,.85)" stroke="#e8a913" stroke-width="1.5"/><line x1="${vx}" x2="${vx}" y1="0" y2="${H}" stroke="#e8a913" stroke-width="2"/></svg>
   ${cur?`<div class="banner" style="background:${CLS_COL[cur.cls]}22;color:var(--gInk)"><b data-raw>${esc(sanShow(G.sans[viewPly-1]))} · ${esc(T(cur.cls==='forced'?'Only move':cur.cls[0].toUpperCase()+cur.cls.slice(1)))}${cur.cls!=='best'&&cur.cls!=='forced'&&cur.best?' · '+esc(TF('best was {0}',bestSan(viewPly-1,cur.best))):''}</b></div>`:''}`;
  $('#graph').onclick=e=>{ const r=e.currentTarget.getBoundingClientRect(); goPly(Math.round((e.clientX-r.left)/r.width*(n-1))); }; }
function bestSan(ply,u){ const q=posAt(G.g,ply), m=fromUci(q,u); return m?sanShow(toSan(q,m)):u; }

// ---------- pause (the game menu) ----------
$('#bPause').onclick=()=>{ if(G&&G.review){ leaveGame(); return; } openPause(); };
$('#bMenu').onclick=()=>{ if(G&&G.review){ leaveGame(); return; } openPause(); };
$('#bFlip').onclick=()=>{ if(!G) return; flip=!flip; sfx('tap'); buildBoard(); render(); };
$('#bPrev').onclick=()=>{ if(!G) return; goPly((viewPly==null?G.g.moves.length:viewPly)-1); };
$('#bNext').onclick=()=>{ if(!G||viewPly==null) return; goPly(viewPly+1); };
function openPause(){ if(!G||G.review) return; if(G.over){ showResultsAgain(); return; } stopClock(); saveGame(); const m=G.mode, vc=vsComputer();
  const cv=$('#cover'); cv.innerHTML=`<h2>Paused</h2><button id="pRes">Resume</button>
   ${vc?'<button id="pDraw">Offer a draw</button>':''}${m==='tp'&&G.pos.side===G.me?'<button id="pDraw2">Offer a draw with your next move</button>':''}
   ${vc||m==='tp'||m==='pp'?'<button id="pResign">Resign</button>':''}
   ${isPuzzle()&&m!=='daily'?'<button id="pRestart">Restart</button>':''}${m==='daily'?'<button id="pGive">End attempt</button>':''}
   <button id="pSet">Settings</button><button id="pHow">How to play</button><button id="pQuit">Save and quit</button>`;
  cv.classList.add('on'); guard();
  $('#pRes').onclick=resume;
  if($('#pDraw')) $('#pDraw').onclick=()=>{ cv.classList.remove('on'); startClock(); offerDraw(); };
  if($('#pDraw2')) $('#pDraw2').onclick=()=>{ cv.classList.remove('on'); G.offerNext=true; toast('Your next move will offer a draw'); startClock(); };
  if($('#pResign')) $('#pResign').onclick=()=>{ if(!G.resArm){ G.resArm=true; $('#pResign').textContent=T('Tap again to resign'); return; } G.resArm=false; cv.classList.remove('on'); resign(); };
  if($('#pRestart')) $('#pRestart').onclick=()=>{ cv.classList.remove('on'); restartPuzzle(); };
  if($('#pGive')) $('#pGive').onclick=()=>{ if(!G.giveArm){ G.giveArm=true; $('#pGive').textContent=T('Tap again to end'); return; } cv.classList.remove('on'); puzzleDone(false); };
  $('#pSet').onclick=()=>{ cv.classList.remove('on'); openSettingsFromGame(); }; $('#pHow').onclick=openHowto;
  $('#pQuit').onclick=()=>{ cv.classList.remove('on'); leaveGame(); }; }
function resume(){ $('#cover').classList.remove('on'); if(G){ G.giveArm=false; G.resArm=false; } startClock(); if(G&&!G.over&&vsComputer()&&G.pos.side!==G.me&&!G.thinking) nextTurn(); }
function showResultsAgain(){ openSheet(`<h2>${esc(T('Game over'))}</h2><div class="sub">${esc(T(RESULT_TEXT[G.reason]||''))}</div><div class="btns"><button class="ghost" id="raAn">Analysis</button><button class="primary" id="raHome">Home</button></div>`);
  $('#raAn').onclick=()=>{ closeSheet(); openAnalysis(G.anId||null); }; $('#raHome').onclick=()=>{ closeSheet(); G=null; goHome(); }; }
// Restart: the same puzzle with the clock at 0; hints already used keep it assisted
function restartPuzzle(){ if(!G||!G.pz) return; const r=puzzleRun(G.mode,G.pz,{lid:G.lid,set:G.set,streak:G.streak,date:G.date}); r.hints=G.hints; r.wrong=G.wrong; startGame(r); }

// ---------- keyboard: type moves (e4, Nf3, O-O) and press Enter ----------
document.addEventListener('keydown',e=>{ if(cur!=='game'||!G||sheetOn) return; if(coverOn()){ if(e.key==='Escape'||e.key==='p'||e.key==='P') resume(); return; }
  const k=e.key;
  if(k==='Escape'){ if(keyBuf){ keyBuf=''; hideBanner(); return; } if(G.review) leaveGame(); else openPause(); e.preventDefault(); return; }
  if(k==='ArrowLeft'){ $('#bPrev').click(); e.preventDefault(); return; } if(k==='ArrowRight'){ if(viewPly!=null) $('#bNext').click(); e.preventDefault(); return; }
  if(k==='Enter'){ if(keyBuf&&canMoveNow()){ const m=fromSan(G.pos,keyBuf); if(m){ keyBuf=''; hideBanner(); const ms=targetMoves(mFrom(m),mTo(m)); if(mPromo(m)) preMove(m); else preMove(m); } else { toast(TF('Not a legal move: {0}',keyBuf)); keyBuf=''; hideBanner(); } } return; }
  if(k==='Backspace'){ if(keyBuf){ keyBuf=keyBuf.slice(0,-1); keyBuf?showBanner(`<b data-raw>⌨ ${esc(keyBuf)}</b>`):hideBanner(); e.preventDefault(); } return; }
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='z'){ takeback(); e.preventDefault(); return; }
  if(!keyBuf&&!e.ctrlKey&&!e.metaKey){ const lk=k.toLowerCase();
    if(lk==='u'){ takeback(); return; } if(lk==='h'&&k==='h'){ doHint(); return; } if(lk==='f'&&k==='f'){ $('#bFlip').click(); return; } if(k==='p'){ openPause(); return; } }
  if(/^[a-hA-H1-8KQRBNOo0x=+#-]$/.test(k)&&!e.ctrlKey&&!e.metaKey&&!G.review){ keyBuf+=k; showBanner(`<b data-raw>⌨ ${esc(keyBuf)}</b>`); e.preventDefault(); } });

// ---------- win effects (Confetti, Fireworks; King Topple tips the losing king) ----------
function playWin(id,preview,card){ if(id==='topple'){ if(card){ const pv=card.querySelector('.pv svg:not(.i)')||card.querySelector('.pv'); pv.animate([{transform:'rotate(0)'},{transform:'rotate(80deg)',offset:.5},{transform:'rotate(80deg)'},{transform:'rotate(0)'}],{duration:2200,easing:'ease-in-out'}); } return; }
  const cv=$('#fxc'), dpr=Math.min(2,devicePixelRatio||1); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const W=innerWidth, H=innerHeight, ps=[], t0=performance.now(), cols=['#ffd54f','#ff7a7a','#7fd3ff','#b388ff','#7dffb0','#ffffff']; let dur=2600;
  if(id==='confetti'){ for(let k=0;k<160;k++) ps.push({k:'c',x:Math.random()*W,y:-20-Math.random()*H*.4,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6,vr:(Math.random()-.5)*.3,col:cols[k%5],born:Math.random()*600,a:1,w:6+Math.random()*5}); }
  else if(id==='fireworks'){ for(let b=0;b<7;b++){ const cx=W*(.15+Math.random()*.7), cy=H*(.15+Math.random()*.4), col=cols[b%5]; for(let k=0;k<46;k++){ const a=k/46*Math.PI*2, v=1.5+Math.random()*3.5; ps.push({k:'d',x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,born:b*320,col,a:1}); } } }
  const frame=()=>{ const t=performance.now()-t0; g.clearRect(0,0,W,H);
    for(const p of ps){ if(t<p.born) continue;
      if(p.k==='d'){ p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.vx*=.985; p.a-=.012; g.globalAlpha=Math.max(0,p.a); g.fillStyle=p.col; g.beginPath(); g.arc(p.x,p.y,2.2,0,7); g.fill(); g.globalAlpha=1; continue; }
      p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; if(t>dur-700) p.a-=.025; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.globalAlpha=Math.max(0,p.a); g.fillStyle=p.col; g.fillRect(-p.w/2,-p.w/4,p.w,p.w/2); g.restore(); }
    if(t<dur+900) requestAnimationFrame(frame); else g.clearRect(0,0,W,H); };
  requestAnimationFrame(frame); }

// ===================== START =====================
function boot(){ applyLook(); startI18n(); renderHome();
  if(location.hash==='#game-settings'){ openSettings(); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
  if(ARCADE) writeSummary();
  if(S.seenVer&&S.seenVer!==VERSION){ S.seenVer=VERSION; persist(); setTimeout(openNews,400); } else if(!S.seenVer){ S.seenVer=VERSION; persist(); }
  setTimeout(pumpAnalysis,1500); }
addEventListener('pageshow',()=>{ refreshShared(); applyLook(); if(G&&cur==='game') render(); });
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyLook);
boot();
</script>
