<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3f2ef" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<title>Solitaire</title>
<!--FONTS-->
<style>
:root{--bg:#f3f2ef;--panel:#fff;--ink:#1c1c1e;--sub:#8a8a90;--accent:#1f5f45;--accentInk:#fff;--line:rgba(0,0,0,.08);--gold:#e8a913;--good:#2f9e6a;--bad:#d9534f}
.dark{--bg:#101114;--panel:#1b1c20;--ink:#f2f2f4;--sub:#8d8e96;--accent:#e9eaee;--accentInk:#15161a;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
input[type=text]{width:100%;font:15px Inter,sans-serif;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
textarea{width:100%;font:12px/1.4 'JetBrains Mono',monospace;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:none;-webkit-user-select:text;user-select:text}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;flex:1;padding:16px 16px 36px;max-width:560px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h2{font-size:24px;font-weight:800;letter-spacing:-.03em;flex:1;min-width:0}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 0 16px}
.brand h1{font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1}
.brand p{color:var(--sub);font-size:14px;margin-top:8px;line-height:1.35}
.acts{display:flex;gap:8px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.backbtn{height:36px;padding:0 12px 0 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-bottom:6px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:22px 4px 10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.label span{letter-spacing:.02em;text-transform:none;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 15px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:10px;transition:transform .12s;min-width:0}
button.card:active{transform:scale(.98)}
.card .t{font-weight:700;font-size:17px;letter-spacing:-.01em;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.row2 .card .t{font-size:15.5px}
.card .s{color:var(--sub);font-size:13px;margin-top:2px;line-height:1.3;overflow-wrap:anywhere}
.card .grow{flex:1;min-width:0}
.card .r{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex:none;max-width:42%}
.card .r b{display:block;font-size:15px}
.card .r span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.card.dim{opacity:.55}
.ico{width:42px;height:42px;border-radius:12px;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.ico svg{width:26px;height:26px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .card{margin:0;padding:12px;gap:10px}
.row2 .ico{width:36px;height:36px}.row2 .card .s{overflow-wrap:normal}
.lvl .badge{width:50px;height:50px;border-radius:15px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.primary{background:var(--accent);color:var(--accentInk);border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;width:100%;transition:transform .12s}
.primary:active{transform:scale(.98)}
.ghost{background:var(--bg);border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;width:100%}
.danger{color:var(--bad)}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns>*{flex:1 1 0;min-width:0}
.seg{display:flex;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;padding:9px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);min-width:0}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.dark .seg button.on{background:#2a2b31}
.opt{margin:12px 0}
.opt>.h{font-size:12px;font-weight:700;color:var(--sub);margin:0 2px 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;width:100%;font-weight:600;font-size:15px;text-align:left}
.srow .d{font-size:12.5px;color:var(--sub);font-weight:500;margin-top:2px}
.srow>div{min-width:0}
.sw{width:46px;height:28px;border-radius:99px;background:var(--bg);position:relative;transition:background .2s;flex:none;border:1px solid var(--line)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--sub);transition:left .2s,background .2s}
.sw.on{background:var(--accent)}.sw.on::after{left:21px;background:var(--accentInk)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 14px;margin-bottom:10px}
.box .srow+.srow{border-top:1px solid var(--line)}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px;white-space:nowrap}
.stars .o{color:var(--sub);opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;max-width:100%;min-width:0;overflow-wrap:anywhere}
.chip.on{background:var(--accent);color:var(--accentInk);border-color:transparent}
.topseg{background:var(--panel);border:1px solid var(--line);margin:0 0 14px}
.topseg button{font-size:12px;padding:9px 3px;white-space:nowrap;letter-spacing:-.01em}
.topseg button.on{background:var(--accent);color:var(--accentInk)}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px;text-align:left;position:relative;transition:transform .12s;min-width:0}
.tcard:active{transform:scale(.98)}
.tcard .pv{aspect-ratio:7/4;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden;position:relative}
.tcard .n{font-weight:700;font-size:14px;margin:9px 5px 2px;overflow-wrap:anywhere}
.tcard .q{font-size:11.5px;color:var(--sub);margin:0 5px 5px;line-height:1.3;min-height:2.6em;overflow-wrap:anywhere}
.tcard.sel{box-shadow:0 0 0 2.5px var(--accent)}
.tcard.locked .pv{filter:grayscale(.9);opacity:.45}
.tcard .pv svg.i{width:38px;height:38px;stroke-width:1.6;color:var(--accent)}
.tcard.playing .pv{opacity:.4}
.lock{position:absolute;top:13px;right:13px;width:28px;height:28px;border-radius:9px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.lock svg.i{width:15px;height:15px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 2px;border-radius:10px;font-weight:700;font-size:13px;color:var(--sub);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--accentInk)}
.lvcard .num{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.lvcard.fin .num{background:var(--accent);color:var(--accentInk)}
.lvpath .lvcard:nth-child(4n+2),.lvpath .lvcard:nth-child(4n+3){margin-left:18px;width:calc(100% - 18px)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
.tbl th{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700;border:0}
.tbl td:first-child,.tbl th:first-child{text-align:left;font-weight:600}
.ach{display:flex;gap:12px;align-items:center;padding:10px 2px}
.ach+.ach{border-top:1px solid var(--line)}
.ach .m{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none;font-size:15px;font-weight:800}
.ach.done .m{background:var(--gold);color:#3a2a00}
.ach .n{font-weight:700;font-size:14.5px}.ach .d{color:var(--sub);font-size:12.5px;margin-top:1px;overflow-wrap:anywhere}
.ach>div:last-child{min-width:0}
.week{display:flex;gap:6px;justify-content:space-between;margin:6px 0}
.week div{flex:1;min-width:0;text-align:center;font-size:11px;font-weight:700;color:var(--sub);background:var(--bg);border-radius:10px;padding:7px 0}
.week div.on{background:var(--gold);color:#3a2a00}
/* sheets */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:2000;padding:0 0 env(safe-area-inset-bottom)}
#ov.on{display:flex}
#sheet{background:var(--panel);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px 20px;max-height:92vh;overflow-y:auto;overflow-x:hidden;animation:up .22s ease-out}
@media (min-height:700px) and (min-width:600px){ #ov{align-items:center} #sheet{border-radius:24px} }
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;overflow-wrap:anywhere}
#sheet .sub{color:var(--sub);font-size:14px;line-height:1.4;margin-bottom:12px}
.goal{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px;font-weight:600}
.goal .st{font-size:18px;color:var(--sub);opacity:.4;width:22px;text-align:center;flex:none}
.goal.got .st{color:var(--gold);opacity:1}
.goal.new .st{animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--bg);border-radius:12px;padding:9px 6px;text-align:center;min-width:0;overflow-wrap:anywhere}
.kv b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.kv span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.howto p{font-size:14px;line-height:1.5;margin:6px 0}
.howto h3{font-size:15px;margin:14px 0 4px}
#toast{position:fixed;left:50%;top:0;transform:translate(-50%,calc(-100% - env(safe-area-inset-top) - 20px));opacity:0;background:var(--accent);color:var(--accentInk);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:3000;transition:transform .35s,opacity .35s;max-width:calc(100vw - 24px);text-align:center;pointer-events:none;margin-top:calc(env(safe-area-inset-top) + 10px)}
#toast.on{transform:translate(-50%,0);opacity:1}
#fxc{position:fixed;inset:0;pointer-events:none;z-index:1500;width:100%;height:100%}

/* ===== the table ===== */
#game{background:var(--tbl);color:var(--tInk)}
.gcol{width:100%;height:100%;display:flex;flex-direction:column;padding:6px 6px 6px;gap:6px;margin:0 auto}
.gbar{display:flex;gap:6px;align-items:stretch;flex:none;max-width:900px;width:100%;margin:0 auto}
.gbar .info{flex:1;min-width:0;display:flex;gap:6px}
.gbar .box2{flex:1;min-width:0;background:var(--chip);border-radius:12px;padding:4px 8px;display:flex;flex-direction:column;justify-content:center;font-variant-numeric:tabular-nums;line-height:1.15}
.gbar .box2 b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar .box2 span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar .box2.warn b{color:#ffb4a8}
.gtag{font-size:11px;font-weight:700;text-align:center;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
.gbtn{width:44px;flex:none;border-radius:12px;background:var(--chip);display:grid;place-items:center;color:var(--tInk)}
#tableWrap{flex:1;min-height:0;position:relative;width:100%;max-width:1100px;margin:0 auto}
#table{position:absolute;inset:0;touch-action:none}
.slot{position:absolute;width:var(--cw);height:var(--ch);border-radius:calc(var(--cw)*.1);border:2px dashed var(--slot);display:grid;place-items:center;color:var(--slot);font-size:calc(var(--cw)*.42);font-weight:800}
.slot.stock{border-style:solid;cursor:pointer}
.slot svg{width:55%;height:55%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.badge-suits .slot.fnd{border-style:solid}
.badge-crests .slot{border:0;background:var(--slotBg)}
.badge-crests .slot::before{content:'';position:absolute;inset:12% 18% 18%;border:2px solid var(--slot);border-radius:12% 12% 50% 50%/10% 10% 60% 60%}
.badge-stars .slot{border:1.5px dotted var(--slot);background:radial-gradient(circle at 30% 25%,var(--slot) 1.5px,transparent 2px),radial-gradient(circle at 70% 40%,var(--slot) 1.2px,transparent 1.8px),radial-gradient(circle at 45% 75%,var(--slot) 1.6px,transparent 2.1px)}
.slot.tgt,.pc.tgt .fc{box-shadow:0 0 0 3px var(--hl),0 0 14px var(--hl)}
.slot.hint,.pc.hint .fc,.pc.hint .bk{box-shadow:0 0 0 3px var(--gold),0 0 16px var(--gold);animation:breathe 1.2s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 2px var(--gold),0 0 6px var(--gold)}}
.slot.glow{animation:landglow .6s ease-out}
@keyframes landglow{0%{box-shadow:0 0 0 0 var(--gold)}40%{box-shadow:0 0 0 5px var(--gold),0 0 24px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}
.ksel{outline:3px solid var(--hl);outline-offset:2px}
/* cards */
.pc{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);perspective:600px;will-change:transform;cursor:pointer;padding:0;margin:0;border:0;background:none;border-radius:0;display:block}
.pc.anim{transition:transform var(--mv) cubic-bezier(.25,.8,.3,1)}
.pc .cin{position:absolute;inset:0;transform-style:preserve-3d;transition:transform var(--fl) ease}
.pc .fc,.pc .bk{position:absolute;inset:0;border-radius:var(--rad);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.pc .fc{background:var(--face);box-shadow:var(--csh);border:var(--cbd)}
.pc .bk{transform:rotateY(180deg);background:var(--back);box-shadow:var(--csh);border:var(--cbd)}
.pc:not(.up) .cin{transform:rotateY(180deg)}
.flip-fade .pc .cin,.flip-spin .pc .cin{transform:none!important;transition:none}
.flip-fade .pc .fc,.flip-fade .pc .bk{transition:opacity var(--fl)}
.flip-fade .pc .bk{transform:none}
.flip-fade .pc:not(.up) .fc{opacity:0}.flip-fade .pc.up .bk{opacity:0}
.flip-spin .pc .bk{transform:none}
.flip-spin .pc .fc,.flip-spin .pc .bk{transition:opacity var(--fl),transform var(--fl)}
.flip-spin .pc:not(.up) .fc{opacity:0;transform:rotate(-90deg) scale(.6)}.flip-spin .pc.up .bk{opacity:0;transform:rotate(90deg) scale(.6)}
.pc.lift{filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.pc.lift .cin{transform:scale(1.05)}
.pc.blocked .fc{filter:brightness(.82) saturate(.7)}
.pc.trail .fc{box-shadow:var(--csh),0 0 16px 6px rgba(255,255,255,.35)}
.cr{position:absolute;left:5%;top:2%;right:4%;display:flex;align-items:flex-start;justify-content:space-between;line-height:1;font-weight:800;font-family:Inter,system-ui,sans-serif}
.cr b{font-size:calc(var(--cw)*var(--rk));letter-spacing:-.05em}
.cr i{font-style:normal;font-size:calc(var(--cw)*var(--rk)*.92);line-height:1.05}
.art{position:absolute;left:8%;right:8%;bottom:6%;top:36%;display:grid;place-items:center}
.art .pip{font-size:calc(var(--cw)*.62);line-height:1}
.art .ace{font-size:calc(var(--cw)*.8);line-height:1}
.art svg{width:100%;height:100%}
.s0{color:var(--sk)}.s1{color:var(--sr)}.s2{color:var(--sd)}.s3{color:var(--sc)}
#gbot{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:none;max-width:560px;width:100%;margin:0 auto;position:relative}
#gbot button{height:48px;border-radius:13px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;min-width:0;gap:1px;position:relative;color:var(--tInk)}
#gbot button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
#gbot button svg.i{width:19px;height:19px}
#gbot button.armed{background:var(--bad);color:#fff}
#gbot .cnt{position:absolute;top:-6px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--gold);color:#3a2a00;font-size:11px;font-weight:800;display:grid;place-items:center;font-style:normal}
#bAuto{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);background:var(--gold);color:#3a2a00;font-weight:800;border-radius:99px;padding:11px 22px;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:900;white-space:nowrap}
.banner{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;z-index:1200;box-shadow:0 6px 18px rgba(0,0,0,.35);background:rgba(20,24,22,.92);color:#fff;border-radius:12px;padding:8px 10px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:560px;width:100%;margin:0 auto}
.banner b{flex:1 1 160px;min-width:0;font-weight:700}
.banner button{background:rgba(255,255,255,.9);color:#1c1c1e;border-radius:10px;padding:7px 11px;font-weight:700;font-size:13px}
.strip{position:absolute;font-size:11px;font-weight:700;line-height:1.5;overflow:hidden;opacity:.9;white-space:normal}
.strip i{font-style:normal;margin-right:5px;white-space:nowrap}
#cover{position:fixed;inset:0;z-index:1000;background:var(--tbl);color:var(--tInk);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#cover.on{display:flex}
#cover h2{font-size:28px;font-weight:800}
#cover button{background:var(--chip);color:var(--tInk);border-radius:14px;padding:13px 22px;font-weight:700;font-size:15px;min-width:200px}
.pvc{position:relative;width:38px;height:53px;flex:none;--cw:38px;--ch:53px}
.pvc .pc{position:absolute;inset:0}
</style>
</head>
<body>
<div id="toast"></div>
<canvas id="fxc"></canvas>

<!-- HOME -->
<section class="screen on" id="home"><div class="scroll">

// ---------- translations (Sweep's watcher: every visible text node is translated as it appears) ----------
const LANGS=[['auto','Automatic'],['en','English'],['es','Español'],['fr','Français'],['de','Deutsch'],['pt','Português']];
let LANG='en', DICT=null, PATS=[];
const escRe=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

// ===================== AUDIO (Web Audio, synthesized live) =====================
const AU={};

  AU.mus.connect(AU.musLP); AU.musLP.connect(AU.master);
  AU.amb=c.createGain(); AU.amb.gain.value=0; AU.amb.connect(AU.master);
  AU.dly=c.createDelay(1); AU.dly.delayTime.value=.375;
  AU.fb=c.createGain(); AU.fb.gain.value=.3; const dl=c.createBiquadFilter(); dl.type='lowpass'; dl.frequency.value=2000;
  AU.dly.connect(dl); dl.connect(AU.fb); AU.fb.connect(AU.dly); dl.connect(AU.mus);
  AU.send=c.createGain(); AU.send.gain.value=.45; AU.send.connect(AU.dly);

  const bb=c.createBuffer(1,len,c.sampleRate), bd=bb.getChannelData(0); let last=0; for(let i=0;i<len;i++){ last=(last+.02*(Math.random()*2-1))/1.02; bd[i]=last*3.5; } AU.brown=bb; }
function audio(){ if(!AU.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; try{ buildAudio(new C()); }catch(e){ return null; } }
  if(AU.ctx.state==='suspended'&&!document.hidden) AU.ctx.resume().catch(()=>{}); return AU.ctx; }
const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(o){ const c=AU.ctx, t=(o.at!=null?o.at:c.currentTime)+(o.t||0), d=o.d||.12, v=o.v||.2, a=o.a||.005, h=o.hold||0;

  let n=osc; if(o.lp){ const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.lp; osc.connect(f); n=f; }
  n.connect(g); g.connect(o.dest||AU.sfx); if(o.send) g.connect(o.send); osc.start(t); osc.stop(t+a+h+d+.05); }

  f.frequency.setValueAtTime(o.f||1000,t); if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2,t+d); f.Q.value=o.q||.7;
  const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(o.v||.2,t+(o.a||.002)); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.loop=true; s.connect(f); f.connect(g); g.connect(o.dest||AU.sfx); s.start(t,Math.random()*1.5); s.stop(t+d+.05); }
// Sound packs: Soft (default; round sine clicks), Wooden (knocks), Chiptune (square waves).
function sfx(name,arg,pack){ if(!P.sfx&&!pack) return; const c=audio(); if(!c) return; const pk=pack||look('sound'), chip=pk==='chip', wood=pk==='wood', sq=chip?'square':'triangle', vv=chip?.4:1;
  const knock=(f,v,t)=>{ noise({t,d:.05,v:v||.18,ft:'bandpass',f:f*2.2,q:3}); tone({t,f,f2:f*.8,d:.07,v:(v||.18)*.6,type:'sine'}); };
  switch(name){
  case 'click': tone({f:chip?1760:1500,d:.025,v:.05*vv,type:chip?'square':'sine'}); return;
  case 'pick': if(wood) knock(520,.08); else tone({f:chip?880:700,d:.03,v:.05*vv,type:chip?'square':'sine'}); noise({d:.03,v:.05,ft:'highpass',f:3500}); return;
  case 'place': if(wood){ knock(330,.2); return; } noise({d:.04,v:.14,ft:'bandpass',f:chip?2600:1700,q:1.2}); tone({f:chip?520:380,f2:chip?400:300,d:.05,v:.07*vv,type:chip?'square':'sine'}); return;
  case 'flip': noise({d:.06,v:.09,ft:'bandpass',f:wood?900:2400,f2:wood?600:1500,q:1}); if(chip) tone({f:1200,f2:1800,d:.04,v:.03,type:'square'}); return;
  case 'stock': for(let i=0;i<(arg||1);i++) noise({t:i*.035,d:.045,v:.1,ft:'bandpass',f:wood?1100:2000+i*200,q:1.3}); return;
  case 'reset': noise({d:.32,v:.1,ft:'bandpass',f:500,f2:2400,q:.8}); return;
  case 'chime': { const m=72+[0,2,4,5,7,9,11,12,14,16,17,19,21][arg||0]; tone({f:hz(m),d:wood?.25:.5,v:.06*vv,type:chip?'square':'sine',send:AU.send}); tone({f:hz(m+12),d:.2,v:.015,type:'sine'}); return; }
  case 'undo': [74,69].forEach((m,i)=>tone({f:hz(m),t:i*.05,d:.07,v:.04*vv,type:sq})); return;
  case 'hint': [84,88,91].forEach((m,i)=>tone({f:hz(m),t:i*.05,d:.3,v:.05,type:'sine',send:AU.send})); return;
  case 'alert': tone({f:hz(69),d:.25,v:.06*vv,type:sq}); tone({f:hz(65),t:.18,d:.35,v:.05*vv,type:sq}); return;

  case 'win': [72,76,79,84,88,91].forEach((m,i)=>tone({f:hz(m),t:i*.08,d:i===5?.8:.25,v:.09*vv,type:sq,send:AU.send})); tone({f:hz(48),d:.9,v:.15}); return;

function piano(t,m,v,len,D){ tone({at:t,f:hz(m),a:.004,d:Math.max(.4,len),v,type:'triangle',lp:2600,dest:D}); tone({at:t,f:hz(m),a:.004,d:Math.max(.3,len*.7),v:v*.6,type:'sine',dest:D,send:AU.send}); tone({at:t,f:hz(m+12),d:.12,v:v*.15,type:'sine',dest:D}); }

// Android back: in a game it opens the pause menu first; then it closes a sheet; then it returns home; then (home, in Arcade) goes to Arcade.
let cur='home', sheetOn=false, guarded=false, G=null, setReturn=false;
function show(id){ $$('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); cur=id; guard(); if(id!=='game') stopClock(); }
const needGuard=()=>ARCADE||cur!=='home'||sheetOn;

addEventListener('popstate',()=>{ guarded=false; back(); guard(); });
const coverOn=()=>$('#cover').classList.contains('on');
function back(){
  if(cur==='game'&&G&&!G.over&&!sheetOn&&!coverOn()){ openPause(); return; }
  if(sheetOn){ closeSheet(); return; }
  if(coverOn()){ resume(); return; }
  if(cur==='game'&&G){ leaveGame(); return; }
  if(cur==='set'&&setReturn){ backFromSettings(); return; }
  if(cur!=='home'){ goHome(); return; }
  if(ARCADE) leaveTo(ARCADE_HOME); }

  let h=`<div class="top">${backBtn}<h2>Settings</h2></div>
  <div class="label">Gameplay</div><div class="box" style="padding:10px 14px">
   <div class="opt"><div class="h">Tap behaviour</div>${segHtml('tap',[['best','Best move'],['select','Select, then tap a target']],pr.tap)}</div>
   ${rowSw('safe','Safe auto-move',pr.safe,'Sends a card up only when it can never be needed on the table again')}
   ${rowSw('warn','"Still winnable?" warning',pr.warn,'A gentle banner when a move leaves no way to win')}
   <div class="opt"><div class="h">Animation speed</div>${segHtml('speed',[['normal','Normal'],['fast','Fast']],pr.speed)}</div></div>
  <div class="label">Cards</div><div class="box" style="padding:10px 14px">
   ${rowSw('large','Large cards',pr.large,'Bigger corner letters and tighter columns')}
   ${rowSw('four','4-colour suits',pr.four||P.cb,'Diamonds blue, clubs green')}
   ${rowSw('contrast','High-contrast faces',pr.contrast,'Pure white faces with strong outlines')}</div>`;
  if(!ARCADE) h+=`<div class="label">General</div><div class="box" style="padding:10px 14px">
   <div class="opt"><div class="h">Appearance</div>${segHtml('appearance',[['system','Auto'],['light','Light'],['dark','Dark']],P.appearance)}</div>
   ${rowSw('motion','Animations',P.motion,'Card movement, deal and win effects')}${rowSw('sfx','Sound effects',P.sfx)}${rowSw('music','Music and ambience',P.music)}${rowSw('haptics','Vibration',P.haptics)}
   ${rowSw('lefty','Left-handed',P.lefty,'Stock and waste move to the right')}${document.fullscreenEnabled?rowSw('fullscreen','Full screen',P.fullscreen):''}
   <button class="srow" id="langBtn"><div>Language</div><span style="color:var(--sub)" data-raw>${(LANGS.find(l=>l[0]===(P.lang||'auto'))||LANGS[0])[1]}</span></button></div>`;
  h+=`<div class="label">More</div><div class="box">
   <button class="srow" id="htBtn"><div>How to play</div><span>›</span></button>
   <button class="srow" id="wnBtn"><div>What's new</div><span style="color:var(--sub)">v${VERSION}</span></button>
   <button class="srow" id="bkBtn"><div>Backup &amp; restore<div class="d">Solitaire progress only</div></div><span>›</span></button>
   ${ARCADE?`<button class="srow" id="arcSet"><div>Arcade settings<div class="d">Sound, appearance, language and more</div></div><span>›</span></button>`:''}</div>
  <div class="sub" style="color:var(--sub);font-size:12px;text-align:center;margin:14px 0">${esc(TF('Solitaire {0}. No ads, no accounts. Nothing leaves your device.',VERSION))}</div>`;
  $('#setBody').innerHTML=h;
  if(setReturn){ const b=$('#setBody .iconbtn[data-home]'); b.removeAttribute('data-home'); b.onclick=backFromSettings; }
  $$('#setBody [data-seg]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const k=g.dataset.seg, v=b.dataset.v;
    if(k==='appearance') S.appearance=v; else S.prefs[k]=v; persist(); refreshShared(); applyLook(); renderSettings(); }));
  $$('#setBody [data-sw]').forEach(b=>b.onclick=()=>{ const k=b.dataset.sw; if(k==='four'){ S.prefs.four=!(S.prefs.four||P.cb); } else if(k in S.prefs) S.prefs[k]=!S.prefs[k]; else S[k]=!S[k]; persist(); refreshShared();
    if(k==='music'){ if(S.music) Music.start(); else Music.stop(); } if(k==='fullscreen'){ if(S.fullscreen) goFull(); else if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }
    applyLook(); renderSettings(); });
  if($('#langBtn')) $('#langBtn').onclick=openLang;
  $('#htBtn').onclick=openHowto; $('#wnBtn').onclick=openNews; $('#bkBtn').onclick=openBackup;
  if($('#arcSet')) $('#arcSet').onclick=()=>leaveTo(ARCADE_PREFS); }
function goFull(){ if(!document.fullscreenEnabled||document.fullscreenElement) return; const r=document.documentElement.requestFullscreen; if(r) r.call(document.documentElement,{navigationUI:'hide'}).catch(()=>{}); }
addEventListener('pointerup',()=>{ if(P.fullscreen) goFull(); },true);
function openLang(){ const curL=S.lang||'auto';
  openSheet(`<h2>Language</h2><div class="sub">Solitaire restarts in the chosen language. Your progress is kept.</div><div class="box">${LANGS.map(([k,n])=>`<button class="srow" data-lang="${k}"><span data-raw>${k==='auto'?T('Automatic'):n}</span><span>${k===curL?'✓':''}</span></button>`).join('')}</div>
   <div class="sub" style="font-size:12px">Translations are machine-assisted. If something reads oddly, tell the developer.</div><div class="btns"><button class="ghost" data-close>Close</button></div>`);
  $$('#sheet [data-lang]').forEach(b=>b.onclick=()=>{ const v=b.dataset.lang; if(v===curL){ closeSheet(); return; } S.lang=v; persist(); location.reload(); }); }
function openHowto(){ openSheet(`<div class="howto"><h2>How to play</h2>
  <p>Move all 52 cards up to the four foundations, one pile per suit, from Ace to King.</p>
  <h3>The table</h3><p>Seven columns, with only the top card of each face up. Build columns down in rank with alternating colours (a red 6 on a black 7). A run of face-up cards moves together. Only a King, or a run starting with a King, can go into an empty column. When a face-down card is uncovered, it turns over by itself.</p>
  <h3>The stock</h3><p>Tap the stock to turn 1 or 3 cards onto the waste (Draw 1 or Draw 3). Only the top waste card can be played. When the stock is empty, tap it to turn the waste back over for another pass, if passes remain.</p>
  <h3>Moving cards</h3><p>Tap a card to send it to its best spot (foundation first, then a column); tap again to try the next spot. Or drag it. Double-tap sends a card to its foundation. Cards on a foundation can come back down to a column.</p>
  <h3>Moves and par</h3><p>Every card or run moved counts as 1 move, and so does each stock tap, each pass reset and each undo. Automatic flips and auto-complete don't count. Each deal has a par for moves and time, set by a solver and a bot that plays like a person.</p>
  <h3>Every deal winnable</h3><p>Every deal you're given has been proven winnable by a solver. Hints show the next move on a winning path. If a move leaves no way to win, a gentle banner says so and offers Undo. Open deck deals every card face up, for pure planning.</p>
  <h3>Modes</h3><p>Classic: choose the draw, passes, Open deck and difficulty. Campaign: three campaigns of 15 levels, with 3 stars each (par moves, par time, no hints). Daily: the same winnable deal for everyone, easy on Monday and hardest on Sunday, with one scored attempt.</p>
  <h3>Keyboard</h3><p>Arrow keys move the selection, Enter or Space plays its best move, D draws, U or Ctrl+Z undoes, H gives a hint, P or Esc pauses.</p></div>
  <div class="btns"><button class="primary" data-close>Got it</button></div>`); S.howto=true; persist(); }
function openNews(){ openSheet(`<h2>What's new</h2>${CHANGES.map(c=>`<div class="label">v${c.v} · ${c.d}</div><div class="howto">${c.n.map(n=>`<p>${esc(n)}</p>`).join('')}</div>`).join('')}<div class="btns"><button class="primary" data-close>Close</button></div>`); }
async function gz(bytes,inflate){ const CS=inflate?window.DecompressionStream:window.CompressionStream; if(!CS) return null;
  const s=new Blob([bytes]).stream().pipeThrough(new CS('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); }
async function backupCode(){ const json=JSON.stringify(S);
  try{ const z=await gz(new TextEncoder().encode(json)); if(z){ let b=''; for(let i=0;i<z.length;i++) b+=String.fromCharCode(z[i]); return 'SOLITAIRE1Z.'+btoa(b); } }catch(e){}
  return backupPlain(S); }
async function readBackup(text){ const m=/SOLITAIRE1Z\.([A-Za-z0-9+/=]+)/.exec(String(text||''));
  if(m){ try{ const bin=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0)); const out=await gz(bin,true); const o=JSON.parse(new TextDecoder().decode(out)); return o&&typeof o.xp==='number'?o:null; }catch(e){ return null; } }
  return parseBackup(text); }
async function openBackup(){ if(G) saveGame(); const code=await backupCode();
  openSheet(`<h2>Backup &amp; restore</h2><div class="sub">This code holds your Solitaire progress: XP, stars, records, achievements, settings and games in progress. Keep it somewhere safe.</div>
   <textarea rows="4" readonly id="bkCode">${esc(code)}</textarea><div class="btns"><button class="ghost" id="bkCopy">Copy</button><button class="ghost" id="bkFile">${esc(TF('Save to file ({0} KB)',Math.ceil(code.length/1024)))}</button></div>
   <div class="label">Restore</div><textarea rows="3" id="bkIn" placeholder="Paste a backup code"></textarea><div class="btns"><button class="ghost" data-close>Close</button><button class="primary" id="bkGo">Restore</button></div>`);
  $('#bkCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(code); toast('Copied'); }catch(e){ $('#bkCode').select(); } S.bk.last=Date.now(); persist(); };
  $('#bkFile').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'})); a.download=`solitaire-backup-${todayStr()}.txt`; a.click(); S.bk.last=Date.now(); persist(); };
  let armed=null; $('#bkGo').onclick=async()=>{ const o=await readBackup($('#bkIn').value); if(!o){ toast('That code isn\'t a Solitaire backup'); return; }
    if(armed!==o.xp){ armed=o.xp; $('#bkGo').textContent=TF('Replace my progress (level {0})',levelOf(o.xp)); return; }
    S=loadSave(JSON.stringify(o),REDUCED); G=null; persist(); refreshShared(); applyLook(); closeSheet(); goHome(); toast('Progress restored'); }; }
</script>
<script>
// ===================== GAME =====================
// G: {mode:'classic'|'campaign'|'daily'|'practice', lid, date, deal:{draw,n,grade,par,parTime}, st (engine state),
//     assisted, hints (hints used), over, …}. The clock runs from the first move, and pauses with the game.
const EL={}; let LY=null;
function startGame(run){ G=Object.assign({over:false,clockOn:false,t0:0},run); G.st.time=G.st.time||0; G.fresh=!G.st.moves&&!G.st.hist.length;
  saveGame(); show('game'); buildTable(); layoutTable(); clearMarks(); hideBanner();
  if(G.fresh&&P.motion) dealAnim(); else render(false);
  updateBar(); if(G.st.moves>0) startClock(); afterMove(true); }
function resumeRun(run){ if(!run) return; startGame(JSON.parse(JSON.stringify(run))); }
// where the game is kept: Classic and campaign in S.run, the Daily's scored attempt in S.daily.run, practice in S.daily.practice
function saveGame(){ if(!G) return; commitClock(); const o={mode:G.mode,lid:G.lid,date:G.date,deal:G.deal,st:G.st,assisted:G.assisted,hints:G.hints,lost:G.lost};
  if(G.over){ if(G.mode==='daily'){ S.daily.run=null; } else if(G.mode==='practice') S.daily.practice=null; else if(S.run&&S.run.st.seed===G.st.seed&&S.run.mode===G.mode) S.run=null; }
  else if(G.mode==='daily'){ dailyFor(S,G.date).run=o; } else if(G.mode==='practice'){ dailyFor(S,G.date).practice=o; } else S.run=o;
  persist(); }
function leaveGame(){ saveGame(); stopJobs(); G=null; goHome(); }
// ---------- clock ----------
function startClock(){ if(!G||G.over||G.clockOn||cur!=='game'||coverOn()||sheetOn) return; G.clockOn=true; G.t0=performance.now(); }
function commitClock(){ if(G&&G.clockOn){ const n=performance.now(); G.st.time+=n-G.t0; G.t0=n; } }
function stopClock(){ if(G&&G.clockOn){ commitClock(); G.clockOn=false; } }
const elapsed=()=>G?G.st.time+(G.clockOn?performance.now()-G.t0:0):0;
setInterval(()=>{ if(G&&cur==='game') updateBar(true); },500);
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(G&&cur==='game'&&!G.over){ stopClock(); saveGame(); if(!sheetOn) openPause(); } if(AU.ctx) AU.ctx.suspend().catch(()=>{}); }
  else if(AU.ctx&&(P.sfx||P.music)) AU.ctx.resume().catch(()=>{}); });
addEventListener('pagehide',()=>{ if(G) saveGame(); persist(); writeSummary(); });

// ---------- the table: piles and their places ----------
function buildTable(){ const t=$('#table'); t.innerHTML=''; applyLook();
  EL.slots={}; const mk=(id,cls,html)=>{ const d=document.createElement('div'); d.className='slot '+cls; d.dataset.pile=id; d.innerHTML=html||''; t.appendChild(d); EL.slots[id]=d; };
  mk('stock','stock',''); mk('waste','waste','');
  for(let i=0;i<4;i++) mk('f'+i,'fnd',`<span class="sb">${look('badge')==='suits'?SUITS[i]:''}</span>`);
  for(let i=0;i<7;i++) mk('t'+i,'col',look('badge')==='suits'?'K':'');
  EL.strip=document.createElement('div'); EL.strip.className='strip'; t.appendChild(EL.strip);
  EL.cards=[]; for(let c=0;c<52;c++){ const el=cardEl(c); t.appendChild(el); EL.cards[c]=el; } }
// sizes: 7 columns across; cards about 48 px wide at 360 px. Wider screens get larger cards, limited by the height.
function layoutTable(){ const wrap=$('#tableWrap'), W=wrap.clientWidth, H=wrap.clientHeight, large=S.prefs.large;
  const gapR=large?.012:.028; let cw=Math.floor((W-12)/(7+6*gapR)); const ratio=1.4;
  // on wide screens, keep the longest column (19 cards) able to fit: about 6.2 card heights tall
  cw=Math.min(cw,Math.floor(H/(ratio*(1+6.2*0.62)+.3)),150); cw=Math.max(cw,30);
  const ch=Math.round(cw*ratio), gap=Math.max(2,Math.floor(cw*gapR)), tw=7*cw+6*gap, x0=Math.floor((W-tw)/2);
  const colX=i=>x0+i*(cw+gap), lefty=!!P.lefty;
  const top=4, colTop=top+ch+Math.max(10,Math.round(ch*.16))+(G&&G.st.cfg.open?16:0);
  LY={W,H,cw,ch,gap,x0,top,colTop,colX,
    stock:{x:colX(lefty?6:0),y:top}, waste:{x:colX(lefty?5:1),y:top,dir:lefty?-1:1},
    f:i=>({x:colX(lefty?i:3+i),y:top})};
  const t=$('#table'); t.style.setProperty('--cw',cw+'px'); t.style.setProperty('--ch',ch+'px');
  const place=(el,p)=>{ el.style.transform=`translate(${p.x}px,${p.y}px)`; };
  place(EL.slots.stock,LY.stock); place(EL.slots.waste,LY.waste); for(let i=0;i<4;i++) place(EL.slots['f'+i],LY.f(i)); for(let i=0;i<7;i++) place(EL.slots['t'+i],{x:colX(i),y:colTop});
  EL.strip.style.cssText=`left:${x0}px;top:${top+ch+4}px;width:${tw}px;max-height:${colTop-top-ch-4}px`; }
addEventListener('resize',()=>{ if(G&&cur==='game'){ layoutTable(); render(false); } });
// fan offsets for a column: face-down 0.12 of a card height, face-up 0.3, squeezed to fit the height (never below the corner)
function colOffsets(i){ const st=G.st, n=st.cols[i].length, dn=st.down[i], ch=LY.ch, avail=LY.H-LY.colTop-ch-4;
  // in Open deck the blocked cards are face up, so they get enough room to show their corners
  const open=!!st.cfg.open, minU=Math.ceil(LY.cw*(S.prefs.large?.5:.42))+3;
  let od=open?Math.round(ch*.26):Math.round(ch*.12), ou=Math.round(ch*(S.prefs.large?.34:.3)); const nd=Math.min(dn,n-1), nu=Math.max(0,n-1-nd);
  const need=nd*od+nu*ou; if(need>avail&&need>0){ const minD=open?minU:Math.max(4,Math.round(ch*.05));
    const k=avail/need; od=Math.max(minD,Math.floor(od*k)); ou=Math.max(minU,Math.floor((avail-nd*od)/Math.max(1,nu))); }
  const ys=[]; let y=LY.colTop; for(let j=0;j<n;j++){ ys.push(y); y+=j<dn?od:ou; } return ys; }
// where every card goes: {x, y, z, up}
function positions(){ const st=G.st, P2=new Array(52), open=!!st.cfg.open, L=st.deck.length;
  for(let s=0;s<4;s++) for(let r=0;r<st.f[s];r++) P2[s*13+r]={...LY.f(s),z:10+r,up:true};
  for(let k=L-1;k>=st.wp;k--) P2[st.deck[k]]={x:LY.stock.x,y:LY.stock.y,z:100+(L-k),up:open&&k===st.wp};
  const fan=st.cfg.draw===3?Math.min(3,st.wp):1, fx=Math.round(LY.cw*.26)*LY.waste.dir;
  for(let k=0;k<st.wp;k++){ const off=k>=st.wp-fan?(k-(st.wp-fan)):0; P2[st.deck[k]]={x:LY.waste.x+off*fx,y:LY.waste.y,z:200+k,up:true}; }
  for(let i=0;i<7;i++){ const ys=colOffsets(i); st.cols[i].forEach((c,j)=>{ P2[c]={x:LY.colX(i),y:ys[j],z:300+i*25+j,up:j>=st.down[i]||open,blocked:open&&j<st.down[i]}; }); }
  return P2; }
let flyT=0;
function render(anim){ if(!G) return; const st=G.st, pos=positions(), now=EL.cards;
  for(let c=0;c<52;c++){ const el=now[c], p=pos[c]; if(!p) continue; const tr=`translate(${p.x}px,${p.y}px)`, moved=el.style.transform!==tr;
    el.classList.toggle('anim',!!anim&&P.motion||!!anim&&moved);
    if(moved&&anim){ el.style.zIndex=1000+p.z; if(look('trail')==='soft'&&P.motion) el.classList.add('trail'); } else el.style.zIndex=p.z;
    el.style.transform=tr; el.classList.toggle('up',p.up); el.classList.toggle('blocked',!!p.blocked); el.dataset.z=p.z; }
  clearTimeout(flyT); flyT=setTimeout(()=>{ for(let c=0;c<52;c++){ const el=now[c]; el.style.zIndex=el.dataset.z; el.classList.remove('trail'); } },420);
  // the stock slot: a reset arrow while passes remain, a cross when none do
  const sl=EL.slots.stock; sl.innerHTML=stockLeft(st)?'':canReset(st)?'<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9.7 9.7 0 00-6.7 2.8L3 8"/><path d="M3 3v5h5"/></svg>':(st.deck.length?'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>':'');
  EL.strip.innerHTML=st.cfg.open&&stockLeft(st)?`<span data-raw>${st.deck.slice(st.wp).map(c=>`<i class="s${suitOf(c)}" style="color:inherit">${cardName(c)}</i>`).join('')}</span>`:'';
  EL.strip.hidden=!st.cfg.open;
  $('#bAuto').hidden=!canAutoComplete(st)||G.over||G.autoRun; }
// The deal animation: cards fly from the stock (Cascade, Riffle) or from the centre (Fan-out), then the top cards turn.
function dealAnim(){ const pos=positions(), id=look('deal'), st=G.st; G.dealing=true;
  const start=id==='fan'?{x:LY.W/2-LY.cw/2,y:LY.H/2-LY.ch/2}:LY.stock;
  for(let c=0;c<52;c++){ const el=EL.cards[c]; el.classList.remove('anim','up'); el.style.transition='none'; el.style.transform=`translate(${start.x}px,${start.y}px)`; el.style.zIndex=pos[c].z; }
  void $('#table').offsetWidth; let k=0; const order=[];
  const mx=Math.max(...st.cols.map(c=>c.length)); for(let row=0;row<mx;row++) for(let i=0;i<7;i++) if(st.cols[i][row]!=null) order.push(st.cols[i][row]);
  const step=S.prefs.speed==='fast'?18:32;
  order.forEach((c,n)=>{ const el=EL.cards[c], p=pos[c], d=id==='riffle'?(n%2?n*step*.7+40:n*step*.7):n*step;
    el.style.transition=`transform ${id==='fan'?.5:.32}s cubic-bezier(.25,.8,.3,1) ${d}ms`; el.style.transform=`translate(${p.x}px,${p.y}px)`+(id==='riffle'?' rotate(0deg)':''); k=Math.max(k,d); });
  for(let c=0;c<52;c++) if(!order.includes(c)){ const el=EL.cards[c]; el.style.transition=''; el.style.transform=`translate(${pos[c].x}px,${pos[c].y}px)`; }
  sfx('stock',4);
  setTimeout(()=>{ for(let c=0;c<52;c++){ EL.cards[c].style.transition=''; } G&&(G.dealing=false); render(false); sfx('flip'); },k+380); }

// ---------- reading what's under the pointer ----------
function srcOfCard(c){ const st=G.st;
  for(let i=0;i<7;i++){ const j=st.cols[i].indexOf(c); if(j>=0) return j>=st.down[i]?{k:'t',i,j}:null; }
  if(st.wp>0&&st.deck[st.wp-1]===c) return {k:'w'};
  const s=suitOf(c); if(st.f[s]>0&&s*13+st.f[s]-1===c) return {k:'f',i:s};
  if(st.deck.indexOf(c)>=st.wp) return {k:'stock'}; return null; }
// the pile under a point: columns run from their top to the bottom of the table
function pileAt(x,y){ const {cw,ch,gap}=LY;
  if(y<LY.colTop-gap){ for(let i=0;i<4;i++){ const p=LY.f(i); if(x>=p.x-gap&&x<=p.x+cw+gap&&y<=p.y+ch+gap) return {k:'f',i}; } return null; }
  for(let i=0;i<7;i++){ const x0=LY.colX(i); if(x>=x0-gap/2&&x<=x0+cw+gap/2) return {k:'t',i}; } return null; }
const pileEl=to=>{ const st=G.st; if(to.k==='f') return st.f[to.i]?EL.cards[to.i*13+st.f[to.i]-1]:EL.slots['f'+to.i];
  const col=st.cols[to.i]; return col.length?EL.cards[col[col.length-1]]:EL.slots['t'+to.i]; };
const srcCards=src=>src.k==='stock'?[]:cardsOf(G.st,src);

// ---------- input: tap, double-tap, drag ----------
let PT=null, lastTap={c:-1,t:0}, tapCycle=null, sel=null, kSel=null;
$('#table').addEventListener('pointerdown',e=>{ if(!G||G.over||G.dealing||G.autoRun) return; const r=$('#table').getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  const cardE=e.target.closest('.pc'), slotE=e.target.closest('.slot');
  let src=null, c=-1; if(cardE){ c=+cardE.dataset.c; src=srcOfCard(c); } else if(slotE&&slotE.dataset.pile==='stock') src={k:'stock'};
  PT={id:e.pointerId,x0:e.clientX,y0:e.clientY,x,y,src,c,slot:slotE&&slotE.dataset.pile,drag:false,els:[],moved:false,t:performance.now()};
  if(src&&src.k!=='stock'){ const cs=srcCards(src); if(cs.length){ PT.els=cs.map(k=>EL.cards[k]); PT.base=PT.els.map(el=>{ const m=/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/.exec(el.style.transform); return {x:+m[1],y:+m[2]}; }); } }
  try{ $('#table').setPointerCapture(e.pointerId); }catch(err){} });
$('#table').addEventListener('pointermove',e=>{ if(!PT||e.pointerId!==PT.id||!PT.els.length) return; const dx=e.clientX-PT.x0, dy=e.clientY-PT.y0;
  if(!PT.drag){ if(Math.hypot(dx,dy)<7) return; PT.drag=true; startDrag(); }
  PT.els.forEach((el,i)=>{ el.style.transform=`translate(${PT.base[i].x+dx}px,${PT.base[i].y+dy}px)`; }); });
$('#table').addEventListener('pointerup',e=>{ if(!PT||e.pointerId!==PT.id) return; const p=PT; PT=null;
  if(p.drag){ endDrag(p,e); return; }
  if(performance.now()-p.t>650) return; // a long press does nothing
  onTap(p); });
$('#table').addEventListener('pointercancel',()=>{ if(PT&&PT.drag){ clearTargets(); render(true); } PT=null; });

// ---------- solver jobs, run in ~8 ms slices per frame ----------

  res.stars&&res.stars.forEach((s,i)=>{ if(s) setTimeout(()=>sfx('star',i),300+i*220); });
  openSheet(h,()=>{});
  const end=()=>{ const g=G; G=null; return g; };
  $('#rHome').onclick=()=>{ end(); goHome(); };
  if($('#rNew')) $('#rNew').onclick=()=>{ closeSheet(); end(); startClassic(); };
  if($('#rSame')) $('#rSame').onclick=()=>{ closeSheet(); const g=end(); startGame({mode:'classic',deal:g.deal,st:newGame(g.st.seed,g.st.cfg),assisted:false,hints:0}); };
  if($('#rRetry')) $('#rRetry').onclick=()=>{ closeSheet(); end(); startLevel(L); };
  if($('#rNext')) $('#rNext').onclick=()=>{ closeSheet(); end(); openCamp(next.camp); openLevel(next); };
  if($('#rMap')) $('#rMap').onclick=()=>{ closeSheet(); end(); openCamp(L.camp); };
  if($('#rShare')) $('#rShare').onclick=()=>{ const dd=S.daily; share(shareLine(G?G.date:dd.date,dd.moves,dd.time,dd.stars,dd.assisted,dd.cleared)); };
  if($('#rPrac')) $('#rPrac').onclick=()=>{ closeSheet(); const g=end(); const dl=dailyDeal(g.date); dailyFor(S,g.date).practice=null; startGame({mode:'practice',date:g.date,deal:dl,st:newGame(dealSeed(dl.n),{draw:dl.draw}),assisted:false,hints:0}); }; }

// ===================== WIN EFFECTS (full-screen canvas) =====================
// None, Bouncing Cascade (our own take: cards spring off the foundations and bounce away, no trails), Card Fountain,
// Fireworks and Foundation Burst. Skipped when Animations are off.
function playWin(id,preview){ const cv=$('#fxc'), dpr=Math.min(2,devicePixelRatio||1); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const W=innerWidth, H=innerHeight, cw=LY&&!preview?LY.cw:44, ch=Math.round(cw*1.4), cols=suitCols(), sc=[cols.sk,cols.sr,cols.sd,cols.sc], tb=$('#table').getBoundingClientRect();
  const fpos=i=>LY&&!preview?{x:tb.left+LY.f(i).x+cw/2,y:tb.top+LY.f(i).y+ch/2}:{x:W*(.35+i*.1),y:H*.3};
  const ps=[]; let t0=performance.now(), dur=id==='bounce'?3200:2600;
  const drawCard=(p)=>{ g.save(); g.translate(p.x,p.y); g.rotate(p.r||0); g.globalAlpha=Math.max(0,p.a==null?1:p.a); g.fillStyle='#fff'; g.strokeStyle='rgba(0,0,0,.25)'; g.lineWidth=1;
    const w=cw*.8,h=ch*.8; g.beginPath(); g.roundRect?g.roundRect(-w/2,-h/2,w,h,w*.1):g.rect(-w/2,-h/2,w,h); g.fill(); g.stroke();
    g.fillStyle=sc[suitOf(p.c)]; g.font=`800 ${Math.round(w*.42)}px Inter,sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(RANKS[rankOf(p.c)],0,-h*.12); g.font=`${Math.round(w*.4)}px sans-serif`; g.fillText(SUITS[suitOf(p.c)],0,h*.22); g.restore(); };
  if(id==='bounce'){ for(let k=0;k<52;k++){ const c=51-k, s=suitOf(c), o=fpos(s); ps.push({c,x:o.x,y:o.y,vx:(Math.random()<.5?-1:1)*(1.5+Math.random()*3),vy:-(2+Math.random()*4),r:0,vr:(Math.random()-.5)*.08,born:k*55,a:1}); } }
  else if(id==='fountain'){ for(let k=0;k<70;k++) ps.push({c:Math.floor(Math.random()*52),x:W/2,y:H+20,vx:(Math.random()-.5)*7,vy:-(9+Math.random()*7),r:0,vr:(Math.random()-.5)*.2,born:k*30,a:1}); }
  else if(id==='fireworks'){ for(let b=0;b<7;b++){ const cx=W*(.15+Math.random()*.7), cy=H*(.15+Math.random()*.4), col=['#ffd54f','#ff7a7a','#7fd3ff','#b388ff','#7dffb0'][b%5]; for(let k=0;k<46;k++){ const a=k/46*Math.PI*2, v=1.5+Math.random()*3.5; ps.push({dot:1,x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,born:b*320,col,a:1}); } } }
  else if(id==='burst'){ for(let s=0;s<4;s++){ const o=fpos(s); for(let ring=0;ring<3;ring++) for(let k=0;k<14;k++){ const a=k/14*Math.PI*2+ring*.2, v=2.2+ring*1.4; ps.push({sym:SUITS[s],col:sc[s],x:o.x,y:o.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,born:s*180+ring*160,a:1,g:0}); } } }
  const frame=()=>{ const t=performance.now()-t0; g.clearRect(0,0,W,H);
    for(const p of ps){ if(t<p.born) continue;
      if(p.dot){ p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.vx*=.985; p.a-=.012; g.globalAlpha=Math.max(0,p.a); g.fillStyle=p.col; g.beginPath(); g.arc(p.x,p.y,2.2,0,7); g.fill(); g.globalAlpha=1; continue; }
      if(p.sym){ p.x+=p.vx; p.y+=p.vy; p.vx*=.97; p.vy*=.97; p.a-=.011; g.globalAlpha=Math.max(0,p.a); g.fillStyle=p.col; g.font='bold 18px sans-serif'; g.fillText(p.sym,p.x,p.y); g.globalAlpha=1; continue; }
      p.x+=p.vx; p.y+=p.vy; p.vy+=id==='bounce'?.32:.25; p.r+=p.vr;
      if(id==='bounce'&&p.y>H-ch*.4){ p.y=H-ch*.4; p.vy*=-.72; p.vx*=.98; }
      if(id==='bounce'&&t-p.born>1800) p.a-=.03; if(id==='fountain'&&p.vy>0) p.a-=.008;
      drawCard(p); }
    if(t<dur+52*55&&ps.some(p=>(p.a>0)&&p.x>-100&&p.x<W+100)) requestAnimationFrame(frame); else g.clearRect(0,0,W,H); };
  requestAnimationFrame(frame); }

function boot(){ applyLook(); startI18n(); renderHome();
  if(location.hash==='#game-settings'){ openSettings(); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
  if(ARCADE) writeSummary();
  if(S.seenVer&&S.seenVer!==VERSION){ S.seenVer=VERSION; persist(); setTimeout(openNews,400); } else if(!S.seenVer){ S.seenVer=VERSION; persist(); } }
addEventListener('pageshow',()=>{ refreshShared(); applyLook(); });
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyLook);
boot();
</script>
