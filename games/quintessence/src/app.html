<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f2f0f5" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#100f14" media="(prefers-color-scheme: dark)">
<title>Quintessence</title>
<!--FONTS-->
<style>
:root{--bg:#f2f0f5;--panel:#fff;--ink:#1c1b20;--sub:#8a8792;--accent:#5b3fb8;--accentInk:#fff;--line:rgba(0,0,0,.08);--gold:#e8a913;--good:#2f9e6a;--bad:#d9534f}
.dark{--bg:#100f14;--panel:#1c1a22;--ink:#f3f1f6;--sub:#8f8b98;--accent:#c9b8ff;--accentInk:#17141f;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
textarea{width:100%;font:12px/1.4 'JetBrains Mono',monospace;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:none;-webkit-user-select:text;user-select:text}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;flex:1;padding:16px 16px 36px;max-width:560px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h2{font-size:24px;font-weight:800;letter-spacing:-.03em;flex:1;min-width:0}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 0 16px}
.brand h1{font-size:34px;font-weight:800;letter-spacing:-.045em;line-height:1}
.brand p{color:var(--sub);font-size:14px;margin-top:8px;line-height:1.35}
.acts{display:flex;gap:8px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.backbtn{height:36px;padding:0 12px 0 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-bottom:6px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:22px 4px 10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.label span{letter-spacing:.02em;text-transform:none;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 15px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:10px;transition:transform .12s;min-width:0}
button.card:active{transform:scale(.98)}
.card .t{font-weight:700;font-size:17px;letter-spacing:-.01em;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.row2 .card .t{font-size:15.5px}
.card .s{color:var(--sub);font-size:13px;margin-top:2px;line-height:1.3;overflow-wrap:anywhere}
.card .grow{flex:1;min-width:0}
.card .r{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex:none;max-width:42%}
.card .r b{display:block;font-size:15px}
.card .r span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.card.dim{opacity:.55}
.ico{width:42px;height:42px;border-radius:12px;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.ico svg{width:26px;height:26px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .card{margin:0;padding:12px;gap:10px}
.row2 .ico{width:36px;height:36px}.row2 .card .s{overflow-wrap:normal}
.lvl .badge{width:50px;height:50px;border-radius:15px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.primary{background:var(--accent);color:var(--accentInk);border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;width:100%;transition:transform .12s}
.primary:active{transform:scale(.98)}
.ghost{background:var(--bg);border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;width:100%}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns>*{flex:1 1 0;min-width:0}
.seg{display:flex;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;padding:9px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);min-width:0}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.dark .seg button.on{background:#2a2b31}
.opt{margin:12px 0}
.opt>.h{font-size:12px;font-weight:700;color:var(--sub);margin:0 2px 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;width:100%;font-weight:600;font-size:15px;text-align:left}
.srow .d{font-size:12.5px;color:var(--sub);font-weight:500;margin-top:2px}
.srow>div{min-width:0}
.sw{width:46px;height:28px;border-radius:99px;background:var(--bg);position:relative;transition:background .2s;flex:none;border:1px solid var(--line)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--sub);transition:left .2s,background .2s}
.sw.on{background:var(--accent)}.sw.on::after{left:21px;background:var(--accentInk)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 14px;margin-bottom:10px}
.box .srow+.srow{border-top:1px solid var(--line)}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px;white-space:nowrap}
.stars .o{color:var(--sub);opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;max-width:100%;min-width:0;overflow-wrap:anywhere}
.chip.on{background:var(--accent);color:var(--accentInk);border-color:transparent}
.topseg{background:var(--panel);border:1px solid var(--line);margin:0 0 14px}
.topseg button{font-size:12px;padding:9px 3px;white-space:nowrap;letter-spacing:-.01em}
.topseg button.on{background:var(--accent);color:var(--accentInk)}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px;text-align:left;position:relative;transition:transform .12s;min-width:0}
.tcard:active{transform:scale(.98)}
.tcard .pv{aspect-ratio:7/4;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden;position:relative}
.tcard .n{font-weight:700;font-size:14px;margin:9px 5px 2px;overflow-wrap:anywhere}
.tcard .q{font-size:11.5px;color:var(--sub);margin:0 5px 5px;line-height:1.3;min-height:2.6em;overflow-wrap:anywhere}
.tcard.sel{box-shadow:0 0 0 2.5px var(--accent)}
.tcard.locked .pv{filter:grayscale(.9);opacity:.45}
.tcard .pv svg.i{width:38px;height:38px;stroke-width:1.6;color:var(--accent)}
.tcard.playing .pv{opacity:.4}
.lock{position:absolute;top:13px;right:13px;width:28px;height:28px;border-radius:9px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.lock svg.i{width:15px;height:15px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 2px;border-radius:10px;font-weight:700;font-size:13px;color:var(--sub);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--accentInk)}
.lvcard .num{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.lvcard.fin .num{background:var(--accent);color:var(--accentInk)}
.lvpath .lvcard:nth-child(4n+2),.lvpath .lvcard:nth-child(4n+3){margin-left:18px;width:calc(100% - 18px)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
.tbl th{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700;border:0}
.tbl td:first-child,.tbl th:first-child{text-align:left;font-weight:600}
.ach{display:flex;gap:12px;align-items:center;padding:10px 2px}
.ach+.ach{border-top:1px solid var(--line)}
.ach .m{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none;font-size:15px;font-weight:800}
.ach.done .m{background:var(--gold);color:#3a2a00}
.ach .n{font-weight:700;font-size:14.5px}.ach .d{color:var(--sub);font-size:12.5px;margin-top:1px;overflow-wrap:anywhere}
.ach>div:last-child{min-width:0}
.week{display:flex;gap:6px;justify-content:space-between;margin:6px 0}
.week div{flex:1;min-width:0;text-align:center;font-size:11px;font-weight:700;color:var(--sub);background:var(--bg);border-radius:10px;padding:7px 0}
.week div.on{background:var(--gold);color:#3a2a00}
/* sheets */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:2000;padding:0 0 env(safe-area-inset-bottom)}
#ov.on{display:flex}
#sheet{background:var(--panel);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px 20px;max-height:92vh;overflow-y:auto;overflow-x:hidden;animation:up .22s ease-out}
@media (min-height:700px) and (min-width:600px){ #ov{align-items:center} #sheet{border-radius:24px} }
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;overflow-wrap:anywhere}
#sheet .sub{color:var(--sub);font-size:14px;line-height:1.4;margin-bottom:12px}
.goal{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px;font-weight:600}
.goal .st{font-size:18px;color:var(--sub);opacity:.4;width:22px;text-align:center;flex:none}
.goal.got .st{color:var(--gold);opacity:1}
.goal.new .st{animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--bg);border-radius:12px;padding:9px 6px;text-align:center;min-width:0;overflow-wrap:anywhere}
.kv b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.kv span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.howto p{font-size:14px;line-height:1.5;margin:6px 0}
.howto h3{font-size:15px;margin:14px 0 4px}
.howto .dia{display:flex;justify-content:center;margin:8px 0 4px}
#toast{position:fixed;left:50%;top:0;transform:translate(-50%,calc(-100% - env(safe-area-inset-top) - 20px));opacity:0;background:var(--accent);color:var(--accentInk);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:3000;transition:transform .35s,opacity .35s;max-width:calc(100vw - 24px);text-align:center;pointer-events:none;margin-top:calc(env(safe-area-inset-top) + 10px)}
#toast.on{transform:translate(-50%,0);opacity:1}
#fxc{position:fixed;inset:0;pointer-events:none;z-index:1500;width:100%;height:100%}

/* ===== the game screen ===== */
#game{background:var(--gbg);color:var(--gInk)}
.gcol{width:100%;height:100%;display:flex;flex-direction:column;padding:6px 8px 8px;gap:6px;margin:0 auto;max-width:640px}
.gbar{display:flex;gap:6px;align-items:stretch;flex:none;width:100%}
.gbar .box2{min-width:0;background:var(--chip);border-radius:12px;padding:5px 8px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-variant-numeric:tabular-nums;line-height:1.15;text-align:center}
.gbar .box2 b{font-size:19px;white-space:nowrap}
.gbar .box2 span{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gbar .box2.warn b{color:var(--bad)}
.gbar #gMoves{flex:0 0 64px}.gbar #gScore{flex:0 0 86px}
#gGoals{flex:1;min-width:0;display:flex;gap:4px;justify-content:center;align-items:stretch}
.gl{flex:1 1 0;min-width:0;max-width:110px;background:var(--chip);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:5px;padding:4px 5px;font-variant-numeric:tabular-nums}
.gl canvas{width:26px;height:26px;flex:none}
.gl b{font-size:14.5px;white-space:nowrap}
.gl.done{box-shadow:inset 0 0 0 2px var(--gold)}
.gl.done b{color:var(--gold)}
.gl .sc{display:flex;flex-direction:column;align-items:flex-start;min-width:0;line-height:1.1}.gl .sc span{font-size:9.5px;font-weight:700;opacity:.7;text-transform:uppercase}
.gtag{font-size:11px;font-weight:700;text-align:center;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.75}
#bArea{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
#boardWrap{position:relative;flex:none;touch-action:none}
#bc{display:block;touch-action:none}
#announce{position:absolute;left:0;right:0;top:40%;text-align:center;pointer-events:none;font-weight:900;font-size:44px;letter-spacing:-.02em;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25),0 0 24px var(--annc,#c9b8ff);opacity:0;z-index:5}
#announce.on{animation:ann 1s ease-out}
@keyframes ann{0%{opacity:0;transform:scale(.5)}18%{opacity:1;transform:scale(1.12)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05) translateY(-14px)}}
#tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;flex:none;width:100%}
#tools button{height:48px;border-radius:13px;background:var(--chip);display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:700;min-width:0;position:relative;color:var(--gInk)}
#tools button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tools button svg.i{width:20px;height:20px}
#tools .cnt{min-width:30px;height:20px;padding:0 6px;border-radius:99px;background:var(--gold);color:#3a2a00;font-size:11px;font-weight:800;display:grid;place-items:center;font-style:normal}
#cover{position:fixed;inset:0;z-index:1000;background:var(--gbg);color:var(--gInk);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#cover.on{display:flex}
#cover h2{font-size:28px;font-weight:800}
#cover .sub{opacity:.75;font-size:13.5px;max-width:320px}
#cover button{background:var(--chip);color:var(--gInk);border-radius:14px;padding:12px 22px;font-weight:700;font-size:15px;min-width:220px}
#skipTip{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;pointer-events:none;z-index:6;white-space:nowrap}
.sp{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin:8px 0}
.sp canvas{width:36px;height:36px}
.sp p{margin:0}
.rx{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
.rx td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:middle}
.rx td:first-child{font-weight:700;white-space:nowrap}
.goalrow{display:flex;gap:10px;align-items:center;margin:4px 0;font-size:14px;font-weight:600}
.goalrow canvas{width:28px;height:28px;flex:none}
.pvc{width:100%;height:100%;display:block}
</style>
</head>
<body>
<div id="toast"></div>
<canvas id="fxc"></canvas>

<!-- HOME -->
<section class="screen on" id="home"><div class="scroll">
  <button class="backbtn" id="arcadeBtn" hidden><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Arcade</button>
  <div class="brand"><div><h1 data-raw>Quintessence</h1><p>Match the elements, master the storm.</p></div>
    <div class="acts"><button class="iconbtn" id="styleBtn" aria-label="Style"><svg class="i" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 000 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A5.6 5.6 0 0022 9.8C22 5.5 17.5 2 12 2z"/></svg></button>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button></div></div>
  <div id="homeBody"></div>
</div></section>

<section class="screen" id="camp"><div class="scroll" id="campBody"></div></section>
<section class="screen" id="progress"><div class="scroll" id="progBody"></div></section>
<section class="screen" id="style"><div class="scroll"><div class="top"><button class="iconbtn" data-home aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><h2>Style</h2><span class="stars" style="color:var(--sub);font-weight:700" id="sCount"></span></div><div class="seg topseg" id="styleTabs"></div><div id="styleBody"></div></div></section>
<section class="screen" id="set"><div class="scroll" id="setBody"></div></section>

<!-- GAME -->
<section class="screen" id="game"><div class="gcol">
  <div class="gbar"><div class="box2" id="gMoves"><b>30</b><span>Moves</span></div><div id="gGoals"></div><div class="box2" id="gScore"><b>0</b><span>Score</span></div></div>
  <div class="gtag" id="gtag"></div>
  <div id="bArea"><div id="boardWrap"><canvas id="bc"></canvas><div id="announce"></div></div></div>
  <div id="tools">
    <button id="bHint" aria-label="Hint"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg><span>Hint</span><i class="cnt" id="hintCnt"></i></button>
    <button id="bHow" aria-label="Help"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 015.8 1c0 2-3 3-3 3M12 17h.01"/></svg><span>Help</span></button>
    <button id="bPause" aria-label="Pause"><svg class="i" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg><span>Pause</span></button>
  </div>
</div></section>
<div id="cover"></div>
<div id="ov"><div id="sheet"></div></div>

<script>/*ENGINE*/</script>
<script>
// ===================== SHELL =====================
const ARCADE=!!window.__ARCADE__, ARCADE_HOME='../index.html', ARCADE_PREFS='../index.html#prefs';
const REDUCED=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

    else if(b.t==='all'){ g.fillStyle=`rgba(255,255,255,${a*.8})`; g.fillRect(0,0,LY.w,LY.h); }
    else if(b.t==='convert'){ g.globalAlpha=a; for(const c of b.cells){ g.strokeStyle='#fff'; g.lineWidth=3; rrect(g,cellX(c%W)+3,cellY((c/W)|0)+3,ts-6,ts-6,ts*.2); g.stroke(); } }
    g.restore(); } }
function drawParts(g,t){ if(!AN.parts.length) return; const dt=Math.min(40,t-(AN.lastT||t)); AN.lastT=t;
  AN.parts=AN.parts.filter(p=>(p.life+=dt)<p.max);
  for(const p of AN.parts){ p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; const a=1-p.life/p.max, s=p.size; g.save(); g.globalAlpha=Math.max(0,a); g.fillStyle=p.col; g.strokeStyle=p.col;
    if(p.kind==='flame'){ g.beginPath(); g.ellipse(p.x,p.y,s*.6*a+1,s*a+1,0,0,7); g.fill(); }
    else if(p.kind==='ring'){ g.lineWidth=3*a; g.beginPath(); g.arc(p.x,p.y,s+(1-a)*LY.ts*.6,0,7); g.stroke(); }
    else if(p.kind==='puff'){ g.beginPath(); g.arc(p.x,p.y,s*(1.3-a*.5),0,7); g.fill(); }
    else if(p.kind==='zap'){ g.lineWidth=2.5; g.shadowColor='#fff6a0'; g.shadowBlur=8; g.beginPath(); for(let k=0;k<3;k++){ let x=p.x, y=p.y; g.moveTo(x,y); for(let j=0;j<4;j++){ x+=(Math.random()-.5)*s*.8; y+=(Math.random()-.5)*s*.8; g.lineTo(x,y); } } g.stroke(); }
    else if(p.kind==='shard'){ g.translate(p.x,p.y); g.rotate((p.rot||0)+p.life/120); g.beginPath(); g.moveTo(0,-s); g.lineTo(s*.5,s*.6); g.lineTo(-s*.5,s*.6); g.closePath(); g.fill(); }
    else if(p.kind==='chunk'||p.kind==='px'){ g.fillRect(p.x-s/2,p.y-s/2,s,s); }
    else if(p.kind==='star'){ g.translate(p.x,p.y); g.rotate(p.life/200); g.beginPath(); for(let k=0;k<8;k++){ const r=k%2?s*.35:s; g.lineTo(Math.cos(k*Math.PI/4)*r,Math.sin(k*Math.PI/4)*r); } g.closePath(); g.fill(); }
    else if(p.kind==='blot'){ g.beginPath(); g.arc(p.x,p.y,s*(1+(1-a)*.8),0,7); g.fill(); }
    else { g.beginPath(); g.arc(p.x,p.y,s*a+.5,0,7); g.fill(); }
    g.restore(); } }
function drawLabels(g,t){ if(!AN.labels.length) return; const ts=LY.ts, W=G.st.W; AN.labels=AN.labels.filter(l=>t-l.t0<l.dur);
  for(const l of AN.labels){ const p=(t-l.t0)/l.dur, x=Math.min(LY.w-ts*1.2,Math.max(ts*1.2,cellX(l.c%W)+ts/2)), y=cellY((l.c/W)|0)+ts*.2-p*ts*.8; g.save(); g.globalAlpha=p<.15?p/.15:1-Math.max(0,(p-.6)/.4);
    g.font=`800 ${Math.round(ts*.42)}px Inter,system-ui,sans-serif`; g.textAlign='center'; g.lineWidth=4; g.strokeStyle='rgba(0,0,0,.55)'; g.strokeText(l.text,x,y); g.fillStyle=l.col; g.fillText(l.text,x,y); g.restore(); } }
// the render loop runs while the game screen is showing
let rafOn=false;
function loop(){ if(cur!=='game'||!G||document.hidden){ rafOn=false; return; } const t=now(); stepSprites(t); drawBoard(); clockTick(t); requestAnimationFrame(loop); }
function startLoop(){ if(!rafOn){ rafOn=true; AN.lastT=now(); requestAnimationFrame(loop); } }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&cur==='game') startLoop(); });
</script>
<script>
// ===================== NAVIGATION =====================
// Android back: in a game it opens the pause menu first; then it closes a sheet; then it returns home; then (home, in Arcade) goes to Arcade.
let cur='home', sheetOn=false, guarded=false, G=null, setReturn=false;
function show(id){ $$('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); cur=id; guard(); if(id==='game') startLoop(); if(typeof Music!=='undefined') Music.check(); }
const needGuard=()=>ARCADE||cur!=='home'||sheetOn;
function guard(){ if(needGuard()&&!guarded){ try{ history.pushState({qn:1},''); guarded=true; }catch(e){} } }
addEventListener('popstate',()=>{ guarded=false; back(); guard(); });
const coverOn=()=>$('#cover').classList.contains('on');
function back(){
  if(cur==='game'&&G&&!G.over&&!sheetOn&&!coverOn()){ openPause(); return; }
  if(sheetOn){ closeSheet(); return; }
  if(coverOn()){ resume(); return; }
  if(cur==='game'&&G){ leaveGame(); return; }
  if(cur==='set'&&setReturn){ backFromSettings(); return; }
  if(cur!=='home'){ goHome(); return; }
  if(ARCADE) leaveTo(ARCADE_HOME); }
function leaveTo(url){ if(G) saveGame(); persist(); writeSummary(); location.replace(url); }
let sheetClose=null;
function openSheet(html,onClose){ $('#sheet').innerHTML=html; $('#ov').classList.add('on'); $('#sheet').scrollTop=0; sheetOn=true; sheetClose=onClose||null; guard(); }
function closeSheet(){ if(!sheetOn) return; $('#ov').classList.remove('on'); sheetOn=false; const f=sheetClose; sheetClose=null; if(f) f(); }
$('#ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeSheet(); });
$('#sheet').addEventListener('click',e=>{ if(e.target.closest('[data-close]')) closeSheet(); });
function goHome(){ closeSheet(); renderHome(); show('home'); }
const backBtn=`<button class="iconbtn" data-home aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>`;
document.addEventListener('click',e=>{ if(e.target.closest('[data-home]')) goHome(); });
function segHtml(key,opts,val){ return `<div class="seg" data-seg="${key}">${opts.map(([v,n])=>`<button data-v="${v}" class="${String(v)===String(val)?'on':''}">${n}</button>`).join('')}</div>`; }
async function share(text,okMsg){ try{ if(navigator.share){ await navigator.share({text}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast(okMsg||'Copied to the clipboard'); return; }catch(e){}
  openSheet(`<h2>Share</h2><div class="sub">Copy this text:</div><textarea rows="3" readonly>${esc(text)}</textarea><div class="btns"><button class="primary" data-close>Done</button></div>`); $('#sheet textarea').select(); }
const elName=e=>T(EL_NAMES[e]);
function goalText(g){ return g.t==='score'?TF('Score {0}',fmtNum(g.n)):g.t==='collect'?TF('Collect {0} {1}',g.n,elName(g.e)):g.t==='relic'?TF('Bring down {0} relics',g.n):
  ({frost:'Clear all the Frost',stone:'Clear all the Stone',lava:'Clear all the Lava',fog:'Clear all the Fog'})[g.t]; }
const goalIcon=g=>g.t==='collect'?g.e:g.t;

// ===================== GAME =====================
// G: {mode:'classic'|'campaign'|'daily'|'practice', setup (Classic), lid, date, cfg, st (engine state), t (ms on the
//     clock), bonus (Timed: +2 s per big cascade), hintsUsed, carried, zenMs, started, over}
const assisted=()=>!!(G&&(G.hintsUsed>0||G.carried));
const timedLimit=()=>G?(G.setup&&G.setup.mode==='timed'?TIMED_MS:G.lid&&levelById(G.lid).twist==='timed'?levelById(G.lid).time*1000:0):0;
const timeLeft=()=>Math.max(0,timedLimit()+(G.bonus||0)-G.t);
function startGame(run){ G=Object.assign({over:false,t:0,bonus:0,hintsUsed:0,carried:false,zenMs:0,started:false,sel:-1,cursor:-1,pick:-1,kb:false,hint:null,lastIn:now(),stats0:null},run);
  G.stats0=JSON.parse(JSON.stringify(G.st.stats)); G.zen0=G.st.stats.matches.reduce((a,b)=>a+b,0);
  $('#announce').classList.remove('on'); AN.parts=[]; AN.beams=[]; AN.labels=[]; AN.q=[]; AN.cur=null; AN.onDone=null;
  saveGame(); show('game'); requestAnimationFrame(()=>{ layoutBoard(); syncSprites(snap(G.st)); buildHud(); updateHud(); });
  if(G.st.over&&!G.done) setTimeout(endGame,300); }
function resumeRun(run){ if(!run) return; startGame(JSON.parse(JSON.stringify(run))); }
function runOf(){ return {mode:G.mode,setup:G.setup,lid:G.lid,date:G.date,cfg:G.cfg,st:G.st,t:G.t,bonus:G.bonus,hintsUsed:G.hintsUsed,carried:G.carried,zenMs:G.zenMs,started:G.started}; }
function saveGame(){ if(!G||G.done) return; const o=runOf();
  if(G.mode==='daily') dailyFor(S,G.date).run=o; else if(G.mode==='practice') dailyFor(S,G.date).practice=o; else S.run=o; persist(); }
function leaveGame(){ if(G&&!G.done) saveGame(); G=null; goHome(); }
// ---------- the clock: it runs from the first swap, and stops while cascades play, when paused, hidden or on another screen ----------
let lastClock=0, lastTickSec=-1;
const clockRunning=()=>G&&G.started&&!G.over&&!AN.cur&&!AN.q.length&&cur==='game'&&!sheetOn&&!coverOn()&&!document.hidden;
function clockTick(t){ const dt=Math.min(200,t-(lastClock||t)); lastClock=t; if(!clockRunning()) return; G.t+=dt; if(G.setup&&G.setup.mode==='zen') G.zenMs+=dt;
  const lim=timedLimit(); if(lim){ const left=timeLeft(), sec=Math.ceil(left/1000); if(sec!==lastTickSec){ lastTickSec=sec; updateHud(); if(sec<=10&&sec>0) sfx('tick'); }
    if(left<=0){ G.st.over=true; G.st.ended='time'; G.st.won=!G.st.goals.length; endGame(); return; } }
  else if(Math.floor(G.t/1000)!==Math.floor((G.t-dt)/1000)) updateHud(true);
  if(S.prefs.idle&&!G.hint&&t-G.lastIn>8000&&canInput()) idleHint(); }
// ---------- the HUD ----------
function buildHud(){ const st=G.st, gl=$('#gGoals'); gl.innerHTML=''; const goals=G.mode==='classic'&&G.setup.mode!=='zen'?classicThresholds(G.setup).map((n,i)=>({t:'tier',n,i})):st.goals;
  if(G.mode==='classic'&&G.setup.mode==='zen'){ gl.innerHTML=`<div class="gl"><div class="sc"><b id="zenM">0</b><span>Matches</span></div></div><div class="gl"><div class="sc"><b id="zenC">0</b><span>Best cascade</span></div></div>`; }
  else for(const [k,g] of goals.entries()){ const d=document.createElement('div'); d.className='gl'; d.dataset.k=k;
    if(g.t==='tier'){ d.innerHTML=`<div class="sc"><b data-raw>${'★'.repeat(g.i+1)}</b><span data-raw>${fmtNum(g.n)}</span></div>`; }
    else { d.appendChild(elemCanvas(goalIcon(g),26)); const b=document.createElement('b'); d.appendChild(b); }
    gl.appendChild(d); }
  const L=G.lid?levelById(G.lid):null;
  $('#gtag').innerHTML=G.mode==='campaign'?`<span data-raw>${esc(T(CAMPS[L.camp].name)+' '+L.n+' · '+L.name)}</span>`:esc(G.mode==='daily'?TF('Daily · {0}',T(DAILY_RECIPES[weekdayOf(G.date)].label)):G.mode==='practice'?TF('Daily practice · {0}',T(DAILY_RECIPES[weekdayOf(G.date)].label)):`${T(MODES[G.setup.mode])} · ${T(boardName(G.setup.board))} · ${T(NE_NAMES[G.setup.ne])}`); }
const short=n=>n>=100000?Math.round(n/1000)+'k':n>=10000?(n/1000).toFixed(1).replace(/\.0$/,'')+'k':fmtNum(n);
function updateHud(){ if(!G) return; const st=G.st, mv=$('#gMoves'), lim=timedLimit();
  if(lim){ const l=timeLeft(); mv.innerHTML=`<b>${fmtTime(l)}</b><span>${esc(T('Time'))}</span>`; mv.classList.toggle('warn',l<10500&&G.started); }
  else if(st.limit){ const l=movesLeft(st); mv.innerHTML=`<b>${l}</b><span>${esc(T('Moves'))}</span>`; mv.classList.toggle('warn',l<=3); }
  else { mv.innerHTML=`<b>${st.moves}</b><span>${esc(T('Moves'))}</span>`; mv.classList.remove('warn'); }
  $('#gScore').innerHTML=`<b>${short(st.score)}</b><span>${esc(T('Score'))}</span>`;
  if(G.mode==='classic'&&G.setup.mode==='zen'){ const m=st.stats.matches.reduce((a,b)=>a+b,0); if($('#zenM')) $('#zenM').textContent=fmtNum(m); if($('#zenC')) $('#zenC').textContent=st.stats.best; }
  else if(G.mode==='classic'){ const th=classicThresholds(G.setup); $$('#gGoals .gl').forEach((d,i)=>d.classList.toggle('done',st.score>=th[i])); }
  else $$('#gGoals .gl').forEach((d,i)=>{ const g=st.goals[i]; if(!g) return; const [a,b]=goalProgress(st,g), done=a>=b; d.classList.toggle('done',done);
    const el=d.querySelector('b'); if(el) el.textContent=g.t==='score'?`${short(Math.min(a,b))}/${short(b)}`:done?'✓':`${b-a}`; });
  $('#hintCnt').textContent=`${S.hints}/${HINT_CAP}`; }
// ---------- input: swipe a piece toward a neighbour, or tap one then the other ----------
const canInput=()=>G&&!G.over&&!AN.cur&&!AN.q.length&&cur==='game'&&!sheetOn&&!coverOn();
function cellAt(ev){ const r=BC.getBoundingClientRect(), x=Math.floor((ev.clientX-r.left-LY.pad)/LY.ts), y=Math.floor((ev.clientY-r.top-LY.pad)/LY.ts); if(x<0||y<0||x>=LY.W||y>=LY.H) return -1; const i=y*LY.W+x; return G.st.mask[i]?i:-1; }
let drag=null;
BC.addEventListener('pointerdown',e=>{ if(!G) return; if(AN.cur||AN.q.length){ if(G.overflowing) skipAnim(); return; } if(!canInput()) return; G.lastIn=now(); G.kb=false; const c=cellAt(e); if(c<0) return;
  drag={id:e.pointerId,c,x:e.clientX,y:e.clientY,done:false}; try{ BC.setPointerCapture(e.pointerId); }catch(er){} });
BC.addEventListener('pointermove',e=>{ if(!drag||drag.id!==e.pointerId||drag.done||S.prefs.input==='tap') return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y, thr=LY.ts*({low:.5,normal:.32,high:.2}[S.prefs.sens]||.32);
  if(Math.abs(dx)<thr&&Math.abs(dy)<thr) return; drag.done=true; const W=G.st.W, x=drag.c%W; let nb;
  if(Math.abs(dx)>Math.abs(dy)) nb=dx>0?(x<W-1?drag.c+1:-1):(x>0?drag.c-1:-1); else nb=dy>0?drag.c+W:drag.c-W;
  if(nb<0||nb>=G.st.N||!G.st.mask[nb]) return; G.sel=-1; trySwap(drag.c,nb); });
BC.addEventListener('pointerup',e=>{ if(!drag||drag.id!==e.pointerId) return; const d=drag; drag=null; if(d.done||S.prefs.input==='swipe'||!canInput()) return; tapCell(d.c); });
BC.addEventListener('pointercancel',()=>{ drag=null; });
function tapCell(c){ const st=G.st; if(G.sel<0){ if(movable(st,c)){ G.sel=c; sfx('select'); } else lockedFeedback(c); return; }
  if(c===G.sel){ G.sel=-1; return; } if(adjacent(st,G.sel,c)){ const a=G.sel; G.sel=-1; trySwap(a,c); return; } if(movable(st,c)){ G.sel=c; sfx('select'); } else lockedFeedback(c); }
function lockedFeedback(c){ const st=G.st; sfx('bad'); buzz(15); if(st.fr[c]) toast('Frozen: match next to it, or a Fire match, to free it'); else if(st.ch[c]) toast('Chained: match this piece, or a Lightning match in its row or column'); else if(st.fg[c]) toast('Fog hides this piece: match next to it, or an Earth match nearby');
  else if(st.stn[c]) toast('Stone: match next to it to break it (Air breaks two layers)'); else if(st.lv[c]) toast('Lava: match next to it (Water quenches, Ice freezes it)'); }
function trySwap(a,b){ const st=G.st; if(!canInput()) return;
  if(!movable(st,a)){ lockedFeedback(a); return; } if(!movable(st,b)){ lockedFeedback(b); return; }
  if(!validSwap(st,a,b)){ // slides back; no move is used
    sfx('swap'); setTimeout(()=>sfx('bad'),110); const c=cloneSt(st); swapCells(c,a,b); play([{kind:'swapped',b:snap(c)},{kind:'back',b:snap(st)}],()=>{}); return; }
  clearHint(); G.started=true; const before=JSON.parse(JSON.stringify(st.stats)); sfx('swap');
  const r=doSwap(st,a,b,true); play(r.frames,()=>afterMoveUI(r,before)); }
function afterMoveUI(r,before){ const st=G.st; addStats(S,before,st.stats); S.rec.best=Math.max(S.rec.best||0,r.cascade); S.rec.mostSp=Math.max(S.rec.mostSp||0,r.specials);
  if(timedLimit()&&r.cascade>=5){ G.bonus+=2000; toast(T('+2 seconds')); }
  if(G.setup&&G.setup.mode==='zen'){ const z=S.rec.zen, m=st.stats.matches.reduce((a,b)=>a+b,0), dm=m-(before.matches.reduce((a,b)=>a+b,0)); z.matches+=dm; z.best=Math.max(z.best,r.cascade); z.mostSp=Math.max(z.mostSp,r.specials); z.longest=Math.max(z.longest,G.zenMs);
    const xp=zenXP(S,todayStr(),dm); if(xp){ const x=addXP(S,xp); if(x.after>x.before){ sfx('level'); toast(TF('Level {0}!',x.after)); } } }
  const big=r.cascade>=5||r.combo||r.specials>=3; if(big){ shake(r.combo==='prism+prism'?9:r.cascade>=9?7:4); buzz(big?[10,30,10]:12); }
  if(r.label&&S.prefs.announcer) announce(r.label);
  const got=checkAch(S,{mode:G.mode}); for(const id of got){ const a=ACH.find(x=>x.id===id); toast(TF('Achievement: {0}',a.name)); }
  saveGame(); updateHud(); G.lastIn=now();
  if(st.over) endGame(); }
const ANN_COL={'Flow!':'#7fb6ff','Surge!':'#ffd23a','Storm!':'#c9b8ff','Elemental!':'#ff8a3a','Quintessence!':'#ff5af0'};
function announce(w){ const el=$('#announce'); el.textContent=T(w); el.style.setProperty('--annc',ANN_COL[w]||'#fff'); el.classList.remove('on'); void el.offsetWidth; if(fxOn()) el.classList.add('on'); else { el.style.opacity=1; setTimeout(()=>el.style.opacity='',700); }
  sfx('announce',{'Flow!':60,'Surge!':64,'Storm!':67,'Elemental!':70,'Quintessence!':74}[w]); }
// ---------- hints: the strong bot's best swap, glowing ----------
$('#bHint').onclick=()=>doHint();
function doHint(){ if(!canInput()) return; if(G.hint){ return; } if(S.hints<=0){ toast(T('No hints left today. You get +1 for every level-up.')); return; }
  const m=hintMove(G.st); if(!m){ toast('No swap found'); return; } useHint(S); G.hintsUsed++; G.hint={a:m[0],b:m[1]}; sfx('hint'); saveGame(); updateHud(); buildTag(); }
function idleHint(){ const m=hintMove(G.st); if(!m) return; G.hint={a:m[0],b:m[1],idle:true}; if(G.mode==='campaign'||G.mode==='daily'){ G.hintsUsed++; buildTag(); } }
function clearHint(){ if(G) G.hint=null; }
function buildTag(){ if(!G) return; const tg=$('#gtag'); if(assisted()&&!tg.dataset.as){ tg.dataset.as=1; tg.insertAdjacentHTML('beforeend',' · '+esc(T('assisted'))); } }
// ---------- keyboard: arrows move a cursor; Space picks a piece, then an arrow swaps; H hints; P or Esc pauses ----------
document.addEventListener('keydown',e=>{ if(cur!=='game'||!G||sheetOn) return; if(coverOn()){ if(e.key==='Escape'||e.key==='p'||e.key==='P') resume(); return; }
  const k=e.key.toLowerCase(), st=G.st, W=st.W, H=st.H;
  if(k==='escape'||k==='p'){ openPause(); e.preventDefault(); return; }
  if(AN.cur&&G.overflowing&&(k===' '||k==='enter')){ skipAnim(); return; }
  if(G.over) return; if(k==='h'){ doHint(); return; }
  const dirs={arrowleft:[-1,0],arrowright:[1,0],arrowup:[0,-1],arrowdown:[0,1]};
  if(dirs[k]){ e.preventDefault(); G.kb=true; G.lastIn=now(); if(G.cursor<0){ G.cursor=st.N>>1; return; } const [dx,dy]=dirs[k], x=G.cursor%W, y=(G.cursor/W)|0, nx=x+dx, ny=y+dy;
    if(nx<0||ny<0||nx>=W||ny>=H) return; const nb=ny*W+nx;
    if(G.pick>=0){ const a=G.pick; G.pick=-1; if(st.mask[nb]) trySwap(a,nb); return; } G.cursor=nb; return; }
  if(k===' '||k==='enter'){ e.preventDefault(); G.kb=true; if(G.cursor<0){ G.cursor=st.N>>1; return; } if(G.pick>=0) G.pick=-1; else if(movable(st,G.cursor)){ G.pick=G.cursor; sfx('select'); } else lockedFeedback(G.cursor); } });

// ---------- pause (the game menu) ----------
$('#bPause').onclick=()=>openPause(); $('#bHow').onclick=()=>openHowto();
function openPause(){ if(!G||G.over) return; saveGame(); const m=G.mode, zen=G.setup&&G.setup.mode==='zen';
  const cv=$('#cover'); cv.innerHTML=`<h2>Paused</h2>${G.st.goals.length?`<div class="sub">${esc(G.st.goals.map(goalText).join(' · '))}</div>`:''}<button id="pRes">Resume</button>${m!=='daily'&&!zen?'<button id="pRestart">Restart</button>':''}${m==='classic'?`<button id="pNew">${zen?'End run':'New game'}</button>`:''}
   <button id="pSet">Settings</button><button id="pHow">How to play</button>${m==='daily'?'<button id="pGive">End attempt</button>':''}<button id="pQuit">Save and quit</button>`;
  cv.classList.add('on'); guard();
  $('#pRes').onclick=resume; if($('#pRestart')) $('#pRestart').onclick=()=>{ cv.classList.remove('on'); restartGame(); };
  if($('#pNew')) $('#pNew').onclick=()=>{ cv.classList.remove('on'); if(zen){ G.st.over=true; G.st.ended='zen'; endGame(); } else newClassic(); };
  $('#pSet').onclick=()=>{ cv.classList.remove('on'); openSettingsFromGame(); }; $('#pHow').onclick=openHowto;
  if($('#pGive')) $('#pGive').onclick=()=>{ if(!G.giveArm){ G.giveArm=true; $('#pGive').textContent=T('Tap again to end'); return; } cv.classList.remove('on'); G.st.over=true; G.st.won=false; G.st.ended='gave'; endGame(); };
  $('#pQuit').onclick=()=>{ cv.classList.remove('on'); leaveGame(); }; }
function resume(){ $('#cover').classList.remove('on'); if(G) G.giveArm=false; }
// Restart replays the same board with the clock at 0; assists already used keep it assisted.
function restartGame(){ if(!G) return; const run={mode:G.mode,setup:G.setup,lid:G.lid,date:G.date,cfg:G.cfg,st:newGame(G.cfg),carried:assisted()}; startGame(run); }
function newClassic(){ if(G&&G.mode==='classic'&&G.started&&!G.st.over&&G.setup.mode!=='zen'){ S.rec.cur=0; } G=null; S.run=null; startClassic(); }

// ---------- the end of a game ----------
function endGame(){ if(!G||G.done||G.ending) return; G.ending=true; G.over=true; const st=G.st;
  const go=()=>{ G.overflowing=false; $('#skipTip')&&$('#skipTip').remove(); finish(); };
  if(st.won&&st.goals.length&&(G.mode==='campaign'||G.mode==='daily'||G.mode==='practice')){ const left=movesLeft(st); const of=overflow(st,true);
    if(!of.frames.length){ go(); return; }
    if(left) toast(TF('Overflow! {0} moves left become Surges',left)); else toast(T('Overflow!'));
    if(S.prefs.autoSkip||!P.motion){ syncSprites(snap(st)); updateHud(); setTimeout(go,300); return; }
    G.overflowing=true; $('#boardWrap').insertAdjacentHTML('beforeend',`<div id="skipTip">${esc(T('Tap to skip'))}</div>`);
    play(of.frames,()=>{ updateHud(); setTimeout(go,350); }); const iv=setInterval(()=>{ if(!G||!G.overflowing){ clearInterval(iv); return; } updateHud(); },200); return; }
  setTimeout(finish,st.won?250:450); }
function finish(){ if(!G||G.done) return; const st=G.st, today=todayStr(), as=assisted(), m=G.mode, won=st.won&&st.ended!=='gave';
  const res={won,xp:null,stars:null,fresh:[],ach:[],rec:false};
  if(m==='classic'){ if(G.setup.mode==='zen'){ res.zen=true; }
    else { const cr=classicResult(S,G.setup,st.score,as,st.stats); res.stars=cr.stars; res.fresh=cr.fresh; res.rec=cr.record; res.won=cr.won; if(cr.xp) res.xp=addXP(S,cr.xp); } S.run=null; }
  else if(m==='campaign'){ const L=levelById(G.lid), spare=L.twist==='timed'?Math.floor(timeLeft()/1000):movesLeft(st); const cr=campaignResult(S,L,won,spare,as,st.score);
    res.stars=cr.earned; res.fresh=cr.fresh; res.camp=cr; if(cr.xp) res.xp=addXP(S,cr.xp); S.run=null; }
  else if(m==='daily'){ const left=movesLeft(st); const dr=dailyResult(S,G.date,won,left,st.score,as,today); if(dr){ res.stars=dr.stars; if(dr.xp) res.xp=addXP(S,dr.xp); } }
  else { const cfg=dailyCfg(G.date); res.stars=dailyStars(won,movesLeft(st),cfg.par,as); dailyFor(S,G.date).practice=null; }
  res.ach=checkAch(S,{mode:m,setup:G.setup,score:st.score,zenMs:G.zenMs});
  G.done=true; persist(); writeSummary(); updateHud();
  if(res.won||res.zen){ sfx('win'); buzz([20,40,20]); const fx=P.motion&&look('win')!=='none'&&res.won; if(fx) playWin(look('win')); setTimeout(()=>showResults(res),fx?2000:600); }
  else { sfx('lose'); showResults(res); } }
function showResults(res){ if(!G) return; const st=G.st, m=G.mode, L=G.lid?levelById(G.lid):null, won=res.won, zen=res.zen;
  let labels; if(m==='classic'&&!zen){ const th=classicThresholds(G.setup); labels=[TF('Bronze: {0}',fmtNum(th[0])),TF('Silver: {0}',fmtNum(th[1])),T('Bronze with no assists')]; }
  else if(m!=='classic'){ const par=L?L.par:dailyCfg(G.date).par, timed=L&&L.twist==='timed'; labels=[T('Goal met'),timed?TF('{0} seconds to spare',par):TF('{0} moves to spare',par),T('No assists (no hints)')]; }
  const title=zen?'Zen run ended':m==='classic'?(won?'Well played!':'Game over'):won?(m==='practice'?'Practice cleared':'Level complete!'):st.ended==='stuck'?'No moves left':st.ended==='time'?'Out of time':st.ended==='gave'?'Attempt ended':'Out of moves';
  const sub=m==='campaign'?`<span data-raw>${esc(T(CAMPS[L.camp].name)+' '+L.n+' · '+L.name)}</span>`:esc(m==='classic'?`${T(MODES[G.setup.mode])} · ${T(boardName(G.setup.board))} · ${T(NE_NAMES[G.setup.ne])}`:m==='daily'?TF('Daily · {0}',G.date):TF('Daily practice · {0}',G.date));
  const kv2=zen?[[fmtNum(st.stats.matches.reduce((a,b)=>a+b,0)),'Matches'],[st.stats.best,'Best cascade'],[fmtTime(G.zenMs),'Time']]:[[fmtNum(st.score),'Score'],[m==='classic'?(G.setup.mode==='timed'?fmtTime(timeLeft()):st.moves):timedLimit()?fmtTime(timeLeft()):movesLeft(st),m==='classic'?(G.setup.mode==='timed'?'Time left':'Moves'):timedLimit()?'Time left':'Moves left'],[st.stats.best,'Best cascade']];
  let h=`<h2>${esc(T(title))}</h2><div class="sub">${sub}${assisted()?' · '+esc(T('assisted')):''}</div><div class="kv">${kv2.map(([v,k])=>`<div><b>${esc(String(v))}</b><span>${esc(T(k))}</span></div>`).join('')}</div>`;
  if(res.stars) h+=labels.map((lb,i)=>`<div class="goal${res.stars[i]?' got':''}${res.fresh.includes(i)?' new':''}"><span class="st">★</span><span>${esc(lb)}</span>${res.fresh.includes(i)?'<b style="margin-left:6px;color:var(--gold)">'+esc(T('New!'))+'</b>':''}</div>`).join('');
  if(m!=='classic'&&!won) h+=`<div class="sub" style="margin-top:6px">${esc(st.goals.map(g=>{ const [a,b]=goalProgress(st,g); return TF('{0}: {1}',goalText(g),(g.t==='score'?fmtNum(a):a)+'/'+(g.t==='score'?fmtNum(b):b)); }).join(' · '))}</div>`;
  if(res.rec) h+=`<div class="sub"><b>${esc(T('New best score!'))}</b></div>`;
  if(m==='practice') h+=`<div class="sub" style="margin-top:6px">Practice doesn't score.</div>`;
  if(res.xp) h+=`<div class="sub" style="margin-top:10px"><b>+${res.xp.xp} XP</b>${res.xp.after>res.xp.before?` · <span>${esc(TF('Level {0}!',res.xp.after))}</span> · <span>${esc(TF('+{0} hint',res.xp.hints))}</span>`:''}</div>${res.xp.rewards.length?`<div class="sub">${esc(TF('Unlocked: {0}',res.xp.rewards.join(' · ')))}</div>`:''}`;
  if(res.camp&&res.camp.finished) h+=`<div class="sub"><b>${esc(TF('{0} complete!',T(CAMPS[L.camp].name)))}</b></div>`;
  if(res.ach.length) h+=`<div class="label">Achievements</div><div class="box">${res.ach.map(id=>{ const a=ACH.find(x=>x.id===id); return `<div class="ach done"><div class="m">★</div><div><div class="n" data-raw>${esc(a.name)}</div><div class="d">${esc(a.desc)}${a.reward?' · '+esc(TF('Unlocks {0}',T(a.reward))):''}</div></div></div>`; }).join('')}</div>`;
  const next=m==='campaign'?LEVELS[LEVELS.indexOf(L)+1]:null;
  h+=`<div class="btns"><button class="ghost" id="rHome">Home</button>${m==='classic'?`<button class="primary" id="rNew">${zen?'New run':'Play again'}</button>`:''}
   ${m==='campaign'?`<button class="ghost" id="rRetry">${won?'Retry for stars':'Retry'}</button>${won&&next&&unlocked(S,next)?'<button class="primary" id="rNext">Next level</button>':'<button class="primary" id="rMap">Campaign</button>'}`:''}
   ${m==='daily'?'<button class="ghost" id="rShare">Share</button><button class="primary" id="rPrac">Practise</button>':''}${m==='practice'?'<button class="primary" id="rPrac">Practise again</button>':''}</div>`;
  if(res.xp&&res.xp.after>res.xp.before) sfx('level');
  res.stars&&res.stars.forEach((s,i)=>{ if(s) setTimeout(()=>sfx('star',i),300+i*220); });
  openSheet(h,()=>{});
  const end=()=>{ const g=G; G=null; return g; };
  $('#rHome').onclick=()=>{ end(); goHome(); };
  if($('#rNew')) $('#rNew').onclick=()=>{ closeSheet(); end(); startClassic(); };
  if($('#rRetry')) $('#rRetry').onclick=()=>{ closeSheet(); end(); startLevel(L); };
  if($('#rNext')) $('#rNext').onclick=()=>{ closeSheet(); end(); openCamp(next.camp); openLevel(next); };
  if($('#rMap')) $('#rMap').onclick=()=>{ closeSheet(); end(); openCamp(L.camp); };
  if($('#rShare')) $('#rShare').onclick=()=>{ const dd=S.daily; share(shareLine(dd.date,dd.stars,dd.left,dd.score,dd.cleared,dd.assisted)); };
  if($('#rPrac')) $('#rPrac').onclick=()=>{ closeSheet(); const g=end(); startPractice(g.date); }; }
// win effects on the overlay canvas: Overflow Fireworks, Aurora, Elemental Storm
function playWin(id,preview){ const cv=$('#fxc'), dpr=Math.min(2,devicePixelRatio||1); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const W=innerWidth, H=innerHeight, t0=now(), dur=1900, parts=[], R=Math.random;
  if(id==='fireworks') for(let k=0;k<6;k++){ const cx=W*(.2+R()*.6), cy=H*(.18+R()*.35), col=EC[k%6].c, dl=k*180; for(let j=0;j<26;j++){ const a=j/26*Math.PI*2, v=1.6+R()*1.6; parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,col,dl}); } }
  if(id==='storm') for(let k=0;k<70;k++) parts.push({a:R()*Math.PI*2,r:Math.max(W,H)*(.25+R()*.5),e:k%6,sp:.002+R()*.002,dl:0});
  const tick=()=>{ const t=now()-t0; g.clearRect(0,0,W,H); if(t>dur){ g.clearRect(0,0,W,H); return; } const a=t<1500?1:1-(t-1500)/400;
    if(id==='aurora'){ for(let k=0;k<4;k++){ const lg=g.createLinearGradient(0,0,W,0); lg.addColorStop(0,'rgba(0,0,0,0)'); lg.addColorStop(.5,`hsla(${(140+k*40+t/12)%360},90%,60%,${.28*a})`); lg.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=lg;
        g.beginPath(); g.moveTo(0,H*.1+k*40); for(let x=0;x<=W;x+=20) g.lineTo(x,H*(.12+.05*k)+Math.sin(x/90+t/400+k)*30); g.lineTo(W,0); g.lineTo(0,0); g.closePath(); g.fill(); } }
    else if(id==='storm'){ for(const p of parts){ p.a+=p.sp*16; p.r*=.992; const x=W/2+Math.cos(p.a)*p.r, y=H/2+Math.sin(p.a)*p.r*.7; g.globalAlpha=a; g.drawImage(sprite(p.e,22,look('skin'),false),x-11,y-11,22,22); } g.globalAlpha=1; }
    else for(const p of parts){ if(t<p.dl) continue; const tt=(t-p.dl)/16; g.globalAlpha=Math.max(0,a*(1-tt/80)); g.fillStyle=p.col; g.beginPath(); g.arc(p.x+p.vx*tt,p.y+p.vy*tt+.02*tt*tt,2.6,0,7); g.fill(); }
    g.globalAlpha=1; requestAnimationFrame(tick); };
  requestAnimationFrame(tick); }
</script>
<script>
// ===================== HOME =====================
const ICONS={classic:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="2"/><circle cx="15.5" cy="8.5" r="2"/><circle cx="8.5" cy="15.5" r="2"/><circle cx="15.5" cy="15.5" r="2"/></svg>',
 camp:'<svg class="i" viewBox="0 0 24 24"><path d="M4 21V4l8 3 8-3v17l-8 3z"/><path d="M12 7v17"/></svg>',
 daily:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 prog:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/></svg>',
 help:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 015.8 1c0 2-3 3-3 3M12 17h.01"/></svg>',
 play:'<svg class="i" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>'};
const setupLabel=c=>`${T(MODES[c.mode])} · ${T(boardName(c.board))} · ${T(NE_NAMES[c.ne])}`;
function nextLevel(){ for(const L of LEVELS) if(unlocked(S,L)&&!campCleared(S,L.id)) return L; return null; }
const lvName=L=>`${T(CAMPS[L.camp].name)} ${L.n} · ${L.name}`;
const WDN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function renderHome(){ const today=todayStr(); refreshHints(S,today); streakNow(S,today); const l=levelOf(S.xp), nx=xpNext(S), base=LVXP[l-1], pct=nx?Math.round((S.xp-base)/(nx-base)*100):100;
  const dd=dailyFor(S,today), nl=nextLevel(), run=S.run, dr=DAILY_RECIPES[weekdayOf(today)];
  let h=`<button class="card lvl" id="hLevel"><div class="badge">${l}</div><div class="grow"><div class="t">Level ${l}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="s">${nx?`${S.xp} / ${nx} XP`:`${S.xp} XP · max level`}</div></div><div class="r"><b>${S.hints}/${HINT_CAP}</b><span>Hints</span></div></button>`;
  if(run&&run.st&&!run.st.over){ const L=run.mode==='campaign'?levelById(run.lid):null;
    h+=`<button class="card" id="hCont"><div class="ico">${ICONS.play}</div><div class="grow"><div class="t">Continue</div><div class="s">${L?`<span data-raw>${esc(lvName(L))}</span>`:esc(setupLabel(run.setup))}</div></div><div class="r"><b>${short(run.st.score)}</b><span>${run.st.limit?esc(TF('{0} moves left',movesLeft(run.st))):esc(T('Score'))}</span></div></button>`; }
  h+=`<div class="label">Play</div>
   <button class="card" id="hClassic"><div class="ico">${ICONS.classic}</div><div class="grow"><div class="t">Classic</div><div class="s">${esc(setupLabel(S.setup))}</div></div><div class="r"><b>${S.rec.clears}</b><span>Cleared</span></div></button>
   <button class="card" id="hCamp"><div class="ico">${ICONS.camp}</div><div class="grow"><div class="t">Campaign</div><div class="s">${nl?`<span data-raw>${esc(TF('Next: {0}',lvName(nl)))}</span>`:'Every level cleared'}</div></div><div class="r"><b>${totalStars(S)}/${LEVELS.length*3}</b><span>Stars</span></div></button>
   <button class="card" id="hDaily"><div class="ico">${ICONS.daily}</div><div class="grow"><div class="t">Daily</div><div class="s">${esc(T(WDN[weekdayOf(today)]))} · ${esc(T(dr.label))}</div></div><div class="r">${dd.scored?`<b>${dd.cleared?short(dd.score):'—'}</b>${starsHtml(dd.stars)}`:dd.run?`<b>Resume</b><span>${esc(TF('{0} moves left',movesLeft(dd.run.st)))}</span>`:`<b>Play</b><span>Today</span>`}</div></button>
   <div class="row2"><button class="card" id="hProg"><div class="ico">${ICONS.prog}</div><div class="grow"><div class="t">Progress</div><div class="s">${Object.keys(S.ach).length}/${ACH.length} achievements</div></div></button>
   <button class="card" id="hHelp"><div class="ico">${ICONS.help}</div><div class="grow"><div class="t">How to play</div></div></button></div>`;
  $('#homeBody').innerHTML=h; $('#arcadeBtn').hidden=!ARCADE;
  $('#hLevel').onclick=()=>openProgress('levels'); $('#hClassic').onclick=openSetup; $('#hCamp').onclick=()=>openCamp(); $('#hDaily').onclick=openDaily;
  $('#hProg').onclick=()=>openProgress('levels'); $('#hHelp').onclick=openHowto;
  if($('#hCont')) $('#hCont').onclick=()=>resumeRun(S.run); }
$('#arcadeBtn').onclick=()=>leaveTo(ARCADE_HOME);
$('#styleBtn').onclick=()=>openStyle(); $('#settingsBtn').onclick=openSettings;

// ===================== CLASSIC SETUP =====================
const MDESC={moves:'Best score in 30 moves.',timed:'Best score in 2:00. The clock stops while cascades play out; a cascade of 5 or more adds 2 seconds.',zen:'Endless and relaxed: no moves, no clock, no stars. Your run saves and resumes.'};
function openSetup(){ const c=Object.assign({},S.setup);
  const draw=()=>{ const th=c.mode!=='zen'?classicThresholds(c):null, r=S.rec.cl[clKey(c)];
    openSheet(`<h2>Classic</h2><div class="sub">Your choices are remembered.</div>
     <div class="opt"><div class="h">Mode</div>${segHtml('mode',[['moves','Moves'],['timed','Timed'],['zen','Zen']],c.mode)}</div>
     <div class="sub" style="font-size:12.5px;margin:-4px 2px 4px">${esc(T(MDESC[c.mode]))}</div>
     <div class="opt"><div class="h">Board</div>${segHtml('board',BOARDS.slice(0,3),c.board)}<div style="height:4px"></div>${segHtml('board',BOARDS.slice(3),c.board)}</div>
     <div class="opt"><div class="h">Elements</div>${segHtml('ne',[[4,'4 · Easy'],[5,'5 · Normal'],[6,'6 · Hard']],c.ne)}</div>
     <div class="opt"><div class="h">Obstacles</div>${segHtml('obst',[['off','Off'],['light',`<span data-raw>${esc(LANG==='en'?'Light':T('Light (obstacles)'))}</span>`]],c.obst)}</div>
     ${th?`<div class="kv"><div><b>${fmtNum(th[0])}</b><span>★ Bronze</span></div><div><b>${fmtNum(th[1])}</b><span>★★ Silver</span></div><div><b>${r?fmtNum(r.best):'—'}</b><span>Best</span></div></div>`:''}
     <div class="btns"><button class="ghost" data-close>Close</button><button class="primary" id="goPlay">Play</button></div>`);
    $$('#sheet [data-seg]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const k=g.dataset.seg; c[k]=k==='ne'?+b.dataset.v:b.dataset.v; draw(); }));
    $('#goPlay').onclick=()=>{ S.setup=c; persist(); closeSheet(); startClassic(); }; };
  draw(); }
function startClassic(){ if(S.run&&S.run.mode==='classic'&&S.run.started&&!S.run.st.over&&S.run.setup.mode!=='zen') S.rec.cur=0; // an abandoned Classic game counts as a loss for the streak
  const setup=Object.assign({},S.setup), seed=Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36), cfg=classicCfg(setup,seed);
  startGame({mode:'classic',setup,cfg,st:newGame(cfg)}); }

// ===================== CAMPAIGN =====================
function openCamp(tab){ if(tab!=null) S.campTab=tab; else { const nl=nextLevel(); if(nl) S.campTab=nl.camp; } renderCamp(); show('camp'); }
const TWISTS={timed:'Against the clock',tight:'Tight moves',lava:'Lava every move',combos:'Combos only'};
function levelTag(L){ const x=[T(NE_NAMES[L.ne])]; if(L.shape) x.push(T(SHAPE_NAMES[L.shape])); if(L.type==='puzzle') x.push(T('Puzzle')); if(L.twist) x.push(T(TWISTS[L.twist])); if(L.n===15) x.push(T('Finale')); return x.join(' · '); }
function renderCamp(){ const t=S.campTab, open=campOpen(S,t), ts=totalStars(S);
  let h=`<div class="top">${backBtn}<h2>Campaign</h2><span class="stars" style="font-weight:700">★ ${ts}/${LEVELS.length*3}</span></div>
   <div class="tabs">${CAMPS.map((c,i)=>`<button data-ct="${i}" class="${i===t?'on':''}" data-raw>${esc(T(c.name))}</button>`).join('')}</div>
   <div class="sub" style="color:var(--sub);font-size:12.5px;margin:0 4px 10px">${esc(TF('{0} elements',CAMPS[t].ne))}</div>
   <div class="chips" style="margin-bottom:12px">${starUnlocks().map(u=>`<div class="chip${ts>=u.stars?' on':''}">★ ${u.stars} · ${esc(u.text)}</div>`).join('')}</div>`;
  if(!open) h+=`<div class="box" style="padding:14px"><div class="srow"><div>Locked<div class="d" data-raw>${esc(TF('Clear level 15 of {0} to open this campaign.',T(CAMPS[t-1].name)))}</div></div></div></div>`;
  h+='<div class="lvpath">';
  for(const L of LEVELS.filter(L=>L.camp===t)){ const u=unlocked(S,L), c=campOf(S,L.id);
    h+=`<button class="card lvcard${c.c?' fin':''}${u?'':' dim'}" data-lv="${L.id}"><div class="num">${L.n}</div><div class="grow"><div class="t" data-raw>${esc(L.name)}</div><div class="s">${esc(levelTag(L))}</div></div><div class="r">${starsHtml(campStars(S,L.id))}</div></button>`; }
  h+='</div>'; $('#campBody').innerHTML=h;
  $$('#campBody [data-ct]').forEach(b=>b.onclick=()=>{ S.campTab=+b.dataset.ct; persist(); renderCamp(); });
  $$('#campBody [data-lv]').forEach(b=>b.onclick=()=>{ const L=levelById(b.dataset.lv); if(!unlocked(S,L)){ toast('Clear the level before to unlock this one'); return; } openLevel(L); }); }
function goalRows(goals){ return goals.map(g=>`<div class="goalrow" data-g="${esc(String(goalIcon(g)))}"><span class="gi"></span><span>${esc(goalText(g))}</span></div>`).join(''); }
function fillGoalIcons(root){ $$(root+' .goalrow').forEach(r=>{ const k=r.dataset.g, e=/^\d$/.test(k)?+k:k; r.querySelector('.gi').replaceWith(elemCanvas(e,28)); }); }
function openLevel(L){ const c=campOf(S,L.id), timed=L.twist==='timed', inRun=S.run&&S.run.lid===L.id&&!S.run.st.over;
  openSheet(`<h2 data-raw>${esc(L.name)}</h2><div class="sub"><span data-raw>${esc(T(CAMPS[L.camp].name)+' · '+TF('Level {0}',L.n))}</span> · ${esc(levelTag(L))}</div>
   ${goalRows(L.goals)}<div class="sub" style="margin-top:6px">${esc(timed?TF('Time: {0}',fmtTime(L.time*1000)):TF('{0} moves',L.limit))}</div>
   <div class="sub">${esc(L.tip)}</div>
   <div class="goal${c.s[0]?' got':''}"><span class="st">★</span><span>${esc(T('Meet the goal'))}</span></div>
   <div class="goal${c.s[1]?' got':''}"><span class="st">★</span><span>${esc(timed?TF('Finish with {0} seconds to spare',L.par):TF('Finish with {0} moves to spare',L.par))}</span></div>
   <div class="goal${c.s[2]?' got':''}"><span class="st">★</span><span>${esc(T('No assists (no hints)'))}</span></div>
   ${c.c?`<div class="sub" style="margin-top:8px">${esc(TF('Best score: {0}',fmtNum(c.best||0)))}</div>`:''}
   <div class="btns"><button class="ghost" data-close>Close</button><button class="primary" id="lvGo">${inRun?'Continue':'Play'}</button></div>`);
  fillGoalIcons('#sheet');

function startLevel(L){ if(S.run&&S.run.mode==='classic'&&S.run.started&&!S.run.st.over&&S.run.setup.mode!=='zen') S.rec.cur=0;

function previewCanvas(k,id){ const w=168, h=96, c=document.createElement('canvas'), dpr=Math.min(2.5,devicePixelRatio||1); c.width=w*dpr; c.height=h*dpr; c.className='pvc'; const g=c.getContext('2d'); g.scale(dpr,dpr);
  const th=k==='board'?THEMES[id]:TH, t=now();
  g.fillStyle=k==='board'?th.gbg:TH.gbg; g.fillRect(0,0,w,h);

  if(k==='board'){ const ts=22; for(let y=0;y<3;y++) for(let x=0;x<6;x++){ g.fillStyle=(x+y)%2?th.cellB:th.cellA; g.beginPath(); g.roundRect(18+x*ts,14+y*ts,ts-1,ts-1,4); g.fill(); }
    [[0,0],[1,1],[2,2],[3,0],[4,1],[5,2]].forEach(([x,y],i)=>g.drawImage(sprite(i,18,look('skin'),false),20+x*ts,16+y*ts,18,18)); return c; }
  if(k==='spx'){ const s=44; [[SURGE_H,0],[BURST,1],[WISP,4]].forEach(([sp,e],i)=>{ const x=8+i*54, y=24; g.drawImage(sprite(e,s*.8,look('skin'),false),x+s*.1,y+s*.1,s*.8,s*.8); g.save(); g.translate(x,y); drawSpecial(g,s,sp,t,id,e); g.restore(); }); return c; }
  if(k==='mfx'){ const C=['#ff5a1f','#2f7df6','#6f9a2e','#ffd21f'], R=rngFor('pv'+id);
    for(let n=0;n<26;n++){ const x=20+R()*128, y=12+R()*72, col=C[n%4]; g.fillStyle=col; g.globalAlpha=.85;
      if(id==='sparkle'){ g.beginPath(); for(let q=0;q<8;q++){ const r=q%2?2:6; g.lineTo(x+Math.cos(q*Math.PI/4)*r,y+Math.sin(q*Math.PI/4)*r); } g.closePath(); g.fill(); }
      else if(id==='ink'){ g.fillStyle='#2a2440'; g.beginPath(); g.arc(x,y,3+R()*6,0,7); g.fill(); }
      else if(id==='pixel') g.fillRect(x,y,6,6); else { g.beginPath(); g.ellipse(x,y,3,5,0,0,7); g.fill(); } } g.globalAlpha=1; return c; }
  if(k==='win'){ if(id==='none'){ g.fillStyle=TH.chip2; g.font='700 13px Inter'; g.textAlign='center'; g.fillText('—',w/2,h/2+4); return c; }
    for(let n=0;n<40;n++){ const a=n/40*Math.PI*2, r=id==='storm'?30:20+(n%3)*8; g.fillStyle=id==='aurora'?`hsl(${140+n*4},90%,60%)`:EC[n%6].c; g.beginPath(); g.arc(w/2+Math.cos(a)*r*1.6,h/2+Math.sin(a)*r,id==='storm'?3.5:2.5,0,7); g.fill(); } return c; }
  return c; }

// How to play: the rules, the specials and combos, and the reaction chart
function openHowto(){ const ic=k=>`<i data-ic="${k}"></i>`;
  openSheet(`<div class="howto"><h2>How to play</h2>
  <p>Swipe a piece toward a neighbour to swap them, or tap one and then the other. Line up 3 or more of the same element in a row or column, or make a 2×2 square, to clear them. Pieces above fall, new ones drop in, and any new matches clear too: cascades score more at every step.</p>
  <p>A swap that makes no match slides back and uses no move.</p>
  <h3>The elements</h3><div class="sp">${[0,1,2,3,4,5].map(e=>`${ic(e)}<p><b>${esc(elName(e))}</b>${e>=4?'<br>'+esc(T(e===4?'From Stormfront (5 elements)':'From Frostfall (6 elements)')):''}</p>`).join('')}</div>
  <p>Fewer elements mean more matches: 4 is Easy, 5 Normal, 6 Hard. Every element has its own shape, so colour is never needed.</p>
  <h3>Specials</h3><div class="sp">${[['sp1','Surge','4 in a line. Clears its whole row (made across) or column (made down).'],['sp3','Burst','An L or T of 5. Clears the 3×3 around it, then once more after the board settles.'],['sp4','Wisp','A 2×2 square. Clears a cross around itself, then flies to the most useful cell for your goal.'],['sp5','Prism','5 in a line. Swap it with a piece to clear every piece of that element. It belongs to no element: it\'s the fifth.']].map(([k,n,d])=>`${ic(k)}<p><b data-raw>${n}</b><br>${esc(T(d))}</p>`).join('')}</div>
  <h3>Combos: swap two specials</h3><table class="rx">${[['Surge + Surge','Clears a cross: its row and its column'],['Surge + Burst','Clears 3 rows and 3 columns'],['Burst + Burst','Clears a 5×5 area, twice'],['Wisp + Surge / Burst','The Wisp carries the special away and sets it off where it lands'],['Wisp + Wisp','Three Wisps fly out'],['Prism + Surge / Burst / Wisp','Every piece of the most common element becomes that special, then they all go off'],['Prism + Prism','Clears the whole board']].map(([k,d])=>`<tr><td data-raw>${k}</td><td>${esc(T(d))}</td></tr>`).join('')}</table>
  <h3>Obstacles and reactions</h3><p>Any match next to an obstacle damages it by one layer. A match of the reacting element does more.</p><table class="rx">${[['frost','Frost','Frost holds a piece in place; it can still be matched. Fire thaws every layer at once: Thaw!'],['lava','Lava','Lava spreads into a neighbouring piece after any move that clears no lava. Water quenches it and the lava touching it: Quench! Ice freezes it into stone: Freeze!'],['stone','Stone','Stone (1 to 3 layers) blocks its cell. Air takes two layers: Erode!'],['fog','Fog','Fog hides the piece underneath, which can\'t be matched. Earth clears the fog all around: Clear!'],['chain','Chains','Chains hold a piece; matching it breaks the chain. Lightning breaks every chain in its row and column: Shatter!'],['relic','Relics','Relics fall like pieces. Bring them down and out through the glowing exits at the bottom.']].map(([k,n,d])=>`<tr><td>${ic(k)}</td><td>${esc(T(d))}</td></tr>`).join('')}</table>
  <p>Specials damage every obstacle in their area by one layer.</p>
  <h3>Fair boards</h3><p>No lives, no paywalls, no boosters. A board never starts with a match and always has a swap. If no swap is left, it reshuffles for free (not an assist, no move used). New pieces come from a seeded stream for each column, so the same moves always give the same result: levels can be learned.</p>
  <h3>Stars</h3><p>Campaign and Daily: ★ meet the goal ★ with moves to spare ★ no assists (no hints). Classic: ★ bronze ★ silver ★ bronze with no hints. When you meet a goal, every move left becomes a Surge in the Overflow, for bonus score.</p>
  <h3>Modes</h3><p>Classic: Moves (30 moves), Timed (2:00) or Zen (endless). Campaign: Origins, Stormfront and Frostfall, 15 levels each. Daily: the same level for everyone, one scored attempt.</p>
  <h3>Keyboard</h3><p>Arrows move a cursor; Space picks a piece, then an arrow swaps it. H shows a hint, P or Esc pauses.</p></div>
  <div class="btns"><button class="primary" data-close>Got it</button></div>`);
  $$('#sheet [data-ic]').forEach(el=>{ const k=el.dataset.ic; let c;
    if(/^\d$/.test(k)) c=elemCanvas(+k,34); else if(/^sp/.test(k)){ c=document.createElement('canvas'); const dpr=Math.min(2.5,devicePixelRatio||1), s=34; c.width=c.height=s*dpr; c.style.width=c.style.height=s+'px'; const g=c.getContext('2d'); g.scale(dpr,dpr);
      const sp=+k.slice(2); if(sp===5) drawPrism(g,s,0,'classic'); else { g.drawImage(sprite(sp===1?0:sp===3?2:1,s*.8,look('skin'),false),s*.1,s*.1,s*.8,s*.8); drawSpecial(g,s,sp,0,'classic',0); } }
    else c=elemCanvas(k,30); el.replaceWith(c); });
  S.howto=true; persist(); }
function openNews(){ openSheet(`<h2>What's new</h2>${CHANGES.map(c=>`<div class="label">v${c.v} · ${c.d}</div><div class="howto">${c.n.map(n=>`<p>${esc(n)}</p>`).join('')}</div>`).join('')}<div class="btns"><button class="primary" data-close>Close</button></div>`); }
async function gz(bytes,inflate){ const CS=inflate?window.DecompressionStream:window.CompressionStream; if(!CS) return null;
  const s=new Blob([bytes]).stream().pipeThrough(new CS('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); }
async function backupCode(){ const json=JSON.stringify(S);
  try{ const z=await gz(new TextEncoder().encode(json)); if(z){ let b=''; for(let i=0;i<z.length;i++) b+=String.fromCharCode(z[i]); return 'QUINTESSENCE1Z.'+btoa(b); } }catch(e){}
  return backupPlain(S); }
async function readBackup(text){ const m=/QUINTESSENCE1Z\.([A-Za-z0-9+/=]+)/.exec(String(text||''));
  if(m){ try{ const bin=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0)); const out=await gz(bin,true); const o=JSON.parse(new TextDecoder().decode(out)); return o&&typeof o.xp==='number'?o:null; }catch(e){ return null; } }
  return parseBackup(text); }
async function openBackup(){ if(G) saveGame(); const code=await backupCode();
  openSheet(`<h2>Backup &amp; restore</h2><div class="sub">This code holds your Quintessence progress: XP, stars, records, achievements, settings and games in progress. Keep it somewhere safe.</div>
   <textarea rows="4" readonly id="bkCode">${esc(code)}</textarea><div class="btns"><button class="ghost" id="bkCopy">Copy</button><button class="ghost" id="bkFile">${esc(TF('Save to file ({0} KB)',Math.ceil(code.length/1024)))}</button></div>
   <div class="label">Restore</div><textarea rows="3" id="bkIn" placeholder="Paste a backup code"></textarea><div class="btns"><button class="ghost" data-close>Close</button><button class="primary" id="bkGo">Restore</button></div>`);
  $('#bkCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(code); toast('Copied'); }catch(e){ $('#bkCode').select(); } S.bk.last=Date.now(); persist(); };
  $('#bkFile').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'})); a.download=`quintessence-backup-${todayStr()}.txt`; a.click(); S.bk.last=Date.now(); persist(); };
  let armed=null; $('#bkGo').onclick=async()=>{ const o=await readBackup($('#bkIn').value); if(!o){ toast('That code isn\'t a Quintessence backup'); return; }
    if(armed!==o.xp){ armed=o.xp; $('#bkGo').textContent=TF('Replace my progress (level {0})',levelOf(o.xp)); return; }
    S=loadSave(JSON.stringify(o),REDUCED); G=null; persist(); refreshShared(); applyLook(); closeSheet(); goHome(); toast('Progress restored'); }; }

// ===================== START =====================
function boot(){ applyLook(); startI18n(); renderHome();
  if(location.hash==='#game-settings'){ openSettings(); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
  if(ARCADE) writeSummary();
  if(S.seenVer&&S.seenVer!==VERSION){ S.seenVer=VERSION; persist(); setTimeout(openNews,400); } else if(!S.seenVer){ S.seenVer=VERSION; persist(); } }
addEventListener('pageshow',()=>{ refreshShared(); applyLook(); });
addEventListener('pagehide',()=>{ if(G&&!G.done) saveGame(); persist(); writeSummary(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(G&&!G.done) saveGame(); writeSummary(); } });
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyLook);
boot();
</script>
