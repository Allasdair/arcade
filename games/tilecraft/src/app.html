<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3f2ef" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<title>Tilecraft</title>
<!--FONTS-->
<style>
:root{--bg:#f3f2ef;--panel:#fff;--ink:#1c1c1e;--sub:#8a8a90;--accent:#2d3a36;--accentInk:#fff;--line:rgba(0,0,0,.08);--gold:#e8a913;--good:#2f9e6a;--bad:#d9534f;--lf:Inter}
.dark{--bg:#101114;--panel:#1b1c20;--ink:#f2f2f4;--sub:#8d8e96;--accent:#e9eaee;--accentInk:#15161a;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
input[type=text]{width:100%;font:15px Inter,sans-serif;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
textarea{width:100%;font:12px/1.4 'JetBrains Mono',monospace;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:none;-webkit-user-select:text;user-select:text}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;flex:1;padding:16px 16px 36px;max-width:560px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h2{font-size:24px;font-weight:800;letter-spacing:-.03em;flex:1;min-width:0}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 0 16px}
.brand h1{font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1}
.brand p{color:var(--sub);font-size:14px;margin-top:8px;line-height:1.35}
.acts{display:flex;gap:8px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.backbtn{height:36px;padding:0 12px 0 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-bottom:6px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:22px 4px 10px;display:flex;justify-content:space-between;gap:8px}
.label span{letter-spacing:.02em;text-transform:none;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 15px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:10px;transition:transform .12s;min-width:0}
button.card:active{transform:scale(.98)}
.card .t{font-weight:700;font-size:17px;letter-spacing:-.01em;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.row2 .card .t{font-size:15.5px}
.card .s{color:var(--sub);font-size:13px;margin-top:2px;line-height:1.3;overflow-wrap:anywhere}
.card .grow{flex:1;min-width:0}
.card .r{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex:none;max-width:42%}
.card .r b{display:block;font-size:15px}
.card .r span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.card.dim{opacity:.55}
.ico{width:42px;height:42px;border-radius:12px;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.ico svg{width:26px;height:26px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .card{margin:0}
.lvl .badge{width:50px;height:50px;border-radius:15px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.primary{background:var(--accent);color:var(--accentInk);border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;width:100%;transition:transform .12s}
.primary:active{transform:scale(.98)}
.ghost{background:var(--bg);border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;width:100%}
.danger{color:var(--bad)}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns>*{flex:1 1 0;min-width:0}
.seg{display:flex;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;padding:9px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);min-width:0}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.dark .seg button.on{background:#2a2b31}
.opt{margin:12px 0}
.opt>.h{font-size:12px;font-weight:700;color:var(--sub);margin:0 2px 6px;display:flex;justify-content:space-between;gap:8px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;width:100%;font-weight:600;font-size:15px;text-align:left}
.srow .d{font-size:12.5px;color:var(--sub);font-weight:500;margin-top:2px}
.srow>div{min-width:0}
.sw{width:46px;height:28px;border-radius:99px;background:var(--bg);position:relative;transition:background .2s;flex:none;border:1px solid var(--line)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--sub);transition:left .2s,background .2s}
.sw.on{background:var(--accent)}.sw.on::after{left:21px;background:var(--accentInk)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 14px;margin-bottom:10px}
.box .srow+.srow{border-top:1px solid var(--line)}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px;white-space:nowrap}
.stars .o{color:var(--sub);opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;max-width:100%;min-width:0;overflow-wrap:anywhere}
.chip.on{background:var(--accent);color:var(--accentInk);border-color:transparent}
.topseg{background:var(--panel);border:1px solid var(--line);margin:0 0 14px;flex-wrap:nowrap}
.topseg button{font-size:12px;padding:9px 3px;flex:1 1 auto;white-space:nowrap;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis}
.topseg button.on{background:var(--accent);color:var(--accentInk)}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px;text-align:left;position:relative;transition:transform .12s;min-width:0}
.tcard:active{transform:scale(.98)}
.tcard .pv{aspect-ratio:7/4;border-radius:12px;display:grid;place-items:center;overflow:hidden;position:relative}
.tcard .n{font-weight:700;font-size:14px;margin:9px 5px 2px}
.tcard .q{font-size:11.5px;color:var(--sub);margin:0 5px 5px;line-height:1.3;min-height:2.6em}
.tcard.sel{box-shadow:0 0 0 2.5px var(--accent)}
.tcard.locked .pv{filter:grayscale(.9);opacity:.45}
.tcard .pv svg.i{width:38px;height:38px;stroke-width:1.6;color:var(--accent)}
.tcard.playing .pv{opacity:.4}
.lock{position:absolute;top:13px;right:13px;width:28px;height:28px;border-radius:9px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.lock svg.i{width:15px;height:15px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 2px;border-radius:10px;font-weight:700;font-size:13px;color:var(--sub);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--accentInk)}
.lvcard .num{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.lvcard.fin .num{background:var(--accent);color:var(--accentInk)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
.tbl th{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700;border:0}
.tbl td:first-child,.tbl th:first-child{text-align:left;font-weight:600}
.ach{display:flex;gap:12px;align-items:center;padding:10px 2px}
.ach+.ach{border-top:1px solid var(--line)}
.ach .m{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none;font-size:15px;font-weight:800}
.ach.done .m{background:var(--gold);color:#3a2a00}
.ach .n{font-weight:700;font-size:14.5px}.ach .d{color:var(--sub);font-size:12.5px;margin-top:1px}
.ach>div:last-child{min-width:0}
/* sheets */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:0 0 env(safe-area-inset-bottom)}
#ov.on{display:flex}
#sheet{background:var(--panel);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px 20px;max-height:92vh;overflow-y:auto;overflow-x:hidden;animation:up .22s ease-out}
@media (min-height:700px) and (min-width:600px){ #ov{align-items:center} #sheet{border-radius:24px} }
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
#sheet .sub{color:var(--sub);font-size:14px;line-height:1.4;margin-bottom:12px}
.goal{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px;font-weight:600}
.goal .st{font-size:18px;color:var(--sub);opacity:.4;width:22px;text-align:center;flex:none}
.goal.got .st{color:var(--gold);opacity:1}
.goal.new .st{animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--bg);border-radius:12px;padding:9px 6px;text-align:center;min-width:0;overflow-wrap:anywhere}
.kv b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.kv span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.howto p{font-size:14px;line-height:1.5;margin:6px 0}
.howto h3{font-size:15px;margin:14px 0 4px}
#toast{position:fixed;left:50%;top:0;transform:translate(-50%,calc(-100% - env(safe-area-inset-top) - 20px));opacity:0;background:var(--accent);color:var(--accentInk);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:40;transition:transform .35s,opacity .35s;max-width:calc(100vw - 24px);text-align:center;pointer-events:none;margin-top:calc(env(safe-area-inset-top) + 10px)}
#toast.on{transform:translate(-50%,0);opacity:1}
#fxc{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
.ltbl{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.ltbl td{padding:4px 3px;border-top:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
.ltbl td:first-child{font-weight:800}
.hist{font-size:14px}
.hist .hr{display:flex;gap:8px;padding:7px 2px;border-top:1px solid var(--line);align-items:baseline}
.hist .hr b{font-variant-numeric:tabular-nums;margin-left:auto}
.hist .hr .who{color:var(--sub);font-size:12px;flex:none;width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .hr .w{min-width:0;overflow-wrap:anywhere}
.letters{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}
.letters button{aspect-ratio:1;border-radius:10px;background:var(--bg);font-weight:800;font-size:18px}
/* ===== game ===== */
#game{align-items:center}
.gcol{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;justify-content:center;padding:6px 8px 8px;gap:6px}
.sb{display:flex;align-items:stretch;gap:6px;flex:none}
.pl{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;position:relative}
.pl .nm{font-size:12px;font-weight:700;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .sc{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.pl.on{box-shadow:0 0 0 2px var(--accent)}
.pl.on .nm{color:var(--ink)}
.pl .think{position:absolute;right:8px;top:7px;font-size:11px;color:var(--sub);font-weight:700}
.mid{flex:none;min-width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 6px;font-variant-numeric:tabular-nums}
.mid b{font-size:16px}.mid span{font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.mid.warn b{color:var(--bad)}
.menubtn{width:44px;flex:none;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
#bview{position:relative;overflow:hidden;flex:none;align-self:center;border-radius:12px;touch-action:none;background:var(--bFrame)}
#board{position:absolute;left:0;top:0;display:grid;grid-template-columns:repeat(var(--n),var(--cs));grid-auto-rows:var(--cs);transform-origin:0 0}
.c{position:relative;width:var(--cs);height:var(--cs)}
.c .f{position:absolute;inset:max(.5px,calc(var(--cs)*.04));border-radius:calc(var(--cs)*.14);background:var(--cell);display:grid;place-items:center;overflow:hidden}
.c.x .f{background:transparent}
.c.p1 .f{background:var(--p1)}.c.p2 .f{background:var(--p2)}.c.p3 .f{background:var(--p3)}.c.p4 .f{background:var(--p4)}
.c .lb{font-size:calc(var(--cs)*.3);font-weight:800;line-height:1.02;text-align:center;color:var(--pInk);letter-spacing:-.02em}
.c.p2 .lb,.c.p4 .lb{color:var(--pInk2)}
.c .lb small{display:block;font-size:calc(var(--cs)*.16);font-weight:700;opacity:.85;text-transform:uppercase}
.c.st .f{color:var(--star);font-size:calc(var(--cs)*.6)}
.c.hint .f{box-shadow:inset 0 0 0 2px var(--gold)}
.c.tgt .f{box-shadow:inset 0 0 0 2px var(--accent)}
.tile{position:absolute;inset:max(.5px,calc(var(--cs)*.04));border-radius:calc(var(--cs)*.16);background:var(--tBg);color:var(--tInk);box-shadow:var(--tSh);border:var(--tBd);display:grid;place-items:center;font-family:var(--lf),Inter,sans-serif;z-index:1}
.tile b{font-size:calc(var(--cs)*.6);font-weight:var(--lfw);line-height:1}
.tile i{position:absolute;right:9%;bottom:5%;font-style:normal;font-size:calc(var(--cs)*.24);font-weight:700;opacity:.75;font-family:Inter,sans-serif}
.tile.bl b{color:var(--tBlank)}.tile.bl b::after{content:'';display:block;margin:1px auto 0;width:45%;border-bottom:2px dotted currentColor;opacity:.7}
.tile.pend{box-shadow:0 0 0 2px var(--pend),var(--tSh)}
.tile.bad{box-shadow:0 0 0 2px var(--bad),var(--tSh)}
.tile.last::before{content:'';position:absolute;inset:-1px;border-radius:inherit;box-shadow:0 0 0 2px var(--last);pointer-events:none}
.tile.ghostt{opacity:.55;box-shadow:0 0 0 2px var(--gold)}
.tile.drop{animation:drop .28s ease-out}
@keyframes drop{0%{transform:scale(1.5);opacity:0}100%{transform:none;opacity:1}}
.tile.glint::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);background-size:250% 100%;animation:glint .6s ease-out forwards;pointer-events:none}
@keyframes glint{from{background-position:120% 0}to{background-position:-40% 0}}
.wl{flex:none;min-height:30px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px;font-weight:700;padding:0 4px;justify-content:center;text-align:center}
.wl .w{padding:3px 8px;border-radius:9px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.wl .w.no{color:var(--bad)}.wl .w.yes{color:var(--good)}
.wl .tot{font-size:16px;font-variant-numeric:tabular-nums}
.wl .msg{color:var(--sub);font-weight:600}
.rack{flex:none;display:flex;justify-content:center;gap:5px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;min-height:calc(var(--rt) + 14px);touch-action:none}
.rack .rt{position:relative;width:var(--rt);height:var(--rt);flex:none;--cs:var(--rt)}
.rack .rt .tile{inset:0}
.rack .rt.sel .tile{transform:translateY(-6px);box-shadow:0 0 0 2.5px var(--accent),var(--tSh)}
.rack .rt.gone{visibility:hidden}
.rack .rt.sw .tile{opacity:.45;transform:translateY(5px)}
.acts2{flex:none;display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 1.6fr;gap:5px}
.acts2.lefty{grid-template-columns:1.6fr 1fr 1fr 1fr 1fr 1fr}
.acts2.lefty #bPlay{order:-1}
.acts2 button{height:46px;border-radius:13px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--sub);min-width:0;gap:1px;position:relative}
.acts2 button svg.i{width:19px;height:19px;color:var(--ink)}
.acts2 #bPlay{background:var(--accent);color:var(--accentInk);font-size:15px;border:0}
.acts2 #bPlay:disabled{opacity:.35}
.acts2 .cnt{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accentInk);font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.acts2 span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
#drag{position:fixed;z-index:25;pointer-events:none;width:var(--dt);height:var(--dt);--cs:var(--dt);transform:translate(-50%,-80%) scale(1.08);display:none}
#drag .tile{inset:0;box-shadow:0 8px 22px rgba(0,0,0,.3)}
#cover{position:fixed;inset:0;z-index:15;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#cover.on{display:flex}
#cover h2{font-size:26px;font-weight:800}
#cover p{color:var(--sub);font-size:14px;max-width:320px}
.banner{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner b{flex:1 1 180px;min-width:0}
.banner button{background:var(--bg);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px}
.gtag{font-size:11px;color:var(--sub);font-weight:700;text-align:center;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="toast"></div>
<canvas id="fxc"></canvas>

<!-- HOME -->
<section class="screen on" id="home"><div class="scroll">
  <button class="backbtn" id="arcadeBtn" hidden><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Arcade</button>

    for(const [st,m,len] of SG.mel[bar]) if(st===s){ tone({at:t,f:hz(m),a:.003,d:Math.max(.2,len*sd*.9),v:.06,type:'triangle',lp:2400,dest:D,send:AU.send}); tone({at:t,f:hz(m+19),d:.05,v:.01,dest:D}); }
    return; }
  // Hearth
  if(s===0||s===8) tone({at:t,f:hz(SG.bass[bar]),d:.7,v:.24,type:'sine',lp:400,dest:D});
  if(s===12) tone({at:t,f:hz(SG.bass[bar]+7),d:.4,v:.16,type:'sine',lp:400,dest:D});
  if(s===4||s===12) noise({at:t,d:.16,v:.03,ft:'bandpass',f:2400,q:.6,dest:D});
  if(s===0) for(const m of SG.chords[bar]) for(const det of [-5,5]){ tone({at:t,f:hz(m),det,a:.02,hold:sd*6,d:1.2,v:.018,type:'sine',dest:D}); tone({at:t,f:hz(m+12),det,a:.01,d:.5,v:.006,type:'triangle',dest:D}); }
  if(s===8) for(const m of SG.chords[bar]) tone({at:t,f:hz(m),a:.02,d:.8,v:.012,type:'sine',dest:D});
  for(const [st,m,len] of SG.mel[bar]) if(st===s) tone({at:t,f:hz(m),a:.01,d:Math.max(.35,len*sd*1.1),v:.05,type:'sine',dest:D,send:AU.send}); }
const Music={on:false,step:0,next:0,iv:0,
  start(){ const c=audio(); if(!c||this.on) return; this.on=true; this.step=0; this.next=c.currentTime+.08;
    SG=SONGS[look('track')]||HEARTH;
    AU.dly.delayTime.setValueAtTime(3*60/SG.bpm/4,c.currentTime);
    const g=AU.mus.gain; g.cancelScheduledValues(c.currentTime); g.setValueAtTime(g.value,c.currentTime); g.linearRampToValueAtTime(MUSVOL,c.currentTime+2);
    clearInterval(this.iv); this.iv=setInterval(()=>this.tick(),30); },
  stop(){ if(!this.on) return; this.on=false; clearInterval(this.iv); const c=AU.ctx, g=AU.mus.gain; g.cancelScheduledValues(c.currentTime); g.setTargetAtTime(0,c.currentTime,.25); },
  restart(){ if(!this.on) return; this.stop(); setTimeout(()=>{ if(P.music) this.start(); },450); },
  tick(){ const c=AU.ctx, sd=60/SG.bpm/4; if(c.state!=='running'){ this.next=c.currentTime+.05; return; }
    if(this.next<c.currentTime) this.next=c.currentTime+.02;
    while(this.next<c.currentTime+.2){ musicStep(this.step,this.next,sd); this.next+=sd; this.step=(this.step+1)%128; } } };

// ===================== DAILY =====================
// Par comes from the solver playing the same 10 turns as the Expert; it's worked out in slices and cached.
let parJob=null;
function needPar(date,done){ if(S.parCache[date]){ done&&done(S.parCache[date]); return; }
  if(parJob&&parJob.date===date){ parJob.cbs.push(done); return; }
  parJob={date,gen:parGen(dailyCfg(date)),cbs:[done]}; const job=parJob;
  const step=()=>{ if(parJob!==job) return; const t=performance.now(); let r;
    do r=job.gen.next(); while(!r.done&&performance.now()-t<6);
    if(r.done){ setPar(S,date,r.value); persist(); parJob=null; job.cbs.forEach(f=>f&&f(r.value)); } else requestAnimationFrame(step); };
  requestAnimationFrame(step); }
function openDaily(){ const d=todayStr(), dd=dailyFor(S,d); persist();
  const tm=new Date(); tm.setHours(24,0,0,0); const left=Math.max(0,tm-Date.now()), hh=Math.floor(left/36e5), mm=Math.floor(left%36e5/6e4);
  const draw=()=>{ const par=S.parCache[d]||0;
    let body=`<div class="sub" style="margin:0">Daily · ${esc(d)}</div><h2>10 turns, one board</h2>
     <div class="sub">Everyone gets the same board and the same tiles in the same order today. Score as much as you can in 10 turns. No hints. One scored attempt, then practice as much as you like.</div>
     <div class="kv"><div><b>${par||'…'}</b><span>Par</span></div><div><b>${par?Math.ceil(par*.6):'…'}</b><span>★</span></div><div><b>${par?Math.ceil(par*.85):'…'}</b><span>★★</span></div></div>`;
    if(dd.scored) body+=`<div class="kv"><div><b>${dd.score}</b><span>Score</span></div><div><b>${par?Math.round(dd.score/par*100)+'%':'—'}</b><span>Of par</span></div><div><b>${S.dstreak.cur}</b><span>Streak</span></div></div>
     <div style="text-align:center;font-size:24px">${starsHtml(dd.stars)}</div>
     <div class="btns"><button class="ghost" id="dShare">Share</button><button class="primary" id="dPrac">Practice</button></div>`;
    else body+=`<div class="btns"><button class="ghost" data-close>Close</button><button class="primary" id="dPlay"${par?'':' disabled'}>${dd.run?'Resume':par?'Play':'Working out par…'}</button></div>`;
    body+=`<div class="sub" style="text-align:center;margin:12px 0 0;font-size:12.5px">New Daily in ${hh}h ${mm}m</div>`;
    openSheet(body);
    if($('#dPlay')) $('#dPlay').onclick=()=>{ closeSheet(); if(dd.run) resumeRun(dd.run); else startGame({mode:'daily',date:d},newGame(dailyCfg(d))); };
    if($('#dPrac')) $('#dPrac').onclick=()=>{ closeSheet(); confirmReplace(()=>startGame({mode:'practice',date:d},newGame(dailyCfg(d)))); };
    if($('#dShare')) $('#dShare').onclick=()=>share(shareLine(d,dd.score,par,dd.stars)); };
  draw(); if(!S.parCache[d]) needPar(d,()=>{ if(sheetOn&&$('#dPlay')) draw(); }); }

   ${rowSw('cb','Colourblind-safe colours',P.cb,'Okabe-Ito premium colours, labels on every square')}${rowSw('lefty','Left-handed',P.lefty,'Play button on the left')}${document.fullscreenEnabled?rowSw('fullscreen','Full screen',P.fullscreen):''}
   <button class="srow" id="langBtn"><div>Language<div class="d">The word list stays English</div></div><span style="color:var(--sub)" data-raw>${(LANGS.find(l=>l[0]===(P.lang||'auto'))||LANGS[0])[1]}</span></button>
   <button class="srow" id="nameBtn"><div>Your name<div class="d">Shown in 2-Player games</div></div><span style="color:var(--sub)" data-raw>${esc(P.name||'—')}</span></button></div>`;
  h+=`<div class="label">More</div><div class="box">
   <button class="srow" id="htBtn"><div>How to play</div><span>›</span></button>
   <button class="srow" id="wnBtn"><div>What's new</div><span style="color:var(--sub)">v${VERSION}</span></button>

    if(k==='music'){ if(S.music) Music.start(); else Music.stop(); } if(k==='fullscreen'){ if(S.fullscreen) goFull(); else if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }
    applyLook(); renderSettings(); });
  if($('#langBtn')) $('#langBtn').onclick=openLang; if($('#nameBtn')) $('#nameBtn').onclick=openName;
  $('#htBtn').onclick=openHowto; $('#wnBtn').onclick=openNews; $('#bkBtn').onclick=openBackup; $('#abBtn').onclick=openAbout;
  if($('#arcSet')) $('#arcSet').onclick=()=>leaveTo(ARCADE_PREFS); }
function goFull(){ if(!document.fullscreenEnabled||document.fullscreenElement) return; const r=document.documentElement.requestFullscreen; if(r) r.call(document.documentElement,{navigationUI:'hide'}).catch(()=>{}); }
addEventListener('pointerup',()=>{ if(P.fullscreen) goFull(); },true);
function openLang(){ const curL=S.lang||'auto';
  openSheet(`<h2>Language</h2><div class="sub">Tilecraft restarts in the chosen language. Your progress is kept. The word list stays English in every language.</div><div class="box">${LANGS.map(([k,n])=>`<button class="srow" data-lang="${k}"><span data-raw>${k==='auto'?T('Automatic'):n}</span><span>${k===curL?'✓':''}</span></button>`).join('')}</div>
   <div class="sub" style="font-size:12px">Translations are machine-assisted. If something reads oddly, tell the developer.</div><div class="btns"><button class="ghost" data-close>Close</button></div>`);
  $$('#sheet [data-lang]').forEach(b=>b.onclick=()=>{ const v=b.dataset.lang; if(v===curL){ closeSheet(); return; } S.lang=v; persist(); location.reload(); }); }
function openName(){ openSheet(`<h2>Your name</h2><div class="sub">Shown to friends in 2-Player games. Up to 16 characters.</div><input type="text" id="nmIn" maxlength="16" value="${esc(S.name||'')}" placeholder="Player">
  <div class="btns"><button class="ghost" data-close>Close</button><button class="primary" id="nmGo">Save</button></div>`);
  $('#nmGo').onclick=()=>{ S.name=cleanName($('#nmIn').value); persist(); refreshShared(); closeSheet(); renderSettings(); }; }
function letterTable(){ const L=ALPHA.split('').sort((a,b)=>LETTERS[b][2]-LETTERS[a][2]||LETTERS[a][0]-LETTERS[b][0]||(a<b?-1:1));
  return `<table class="ltbl"><tr><td></td><td>Value</td><td>Small</td><td>Medium</td><td>Large</td></tr>${L.map(c=>`<tr><td>${c}</td><td>${LETTERS[c][0]}</td><td>${LETTERS[c][1]}</td><td>${LETTERS[c][2]}</td><td>${LETTERS[c][3]}</td></tr>`).join('')}
   <tr><td>?</td><td>0</td><td>2</td><td>2</td><td>3</td></tr></table>`; }
function openHowto(){ openSheet(`<div class="howto"><h2>How to play</h2>
  <p>Make words on the board from the 7 tiles on your rack. Words read across or down, and every word you make must be in the word list.</p>
  <h3>Your turn</h3><p>Place one or more tiles in a single row or column, with no gaps (tiles already on the board can fill them). The first word must cover the star in the middle; every word after that must join onto the board. Then tap Play. Instead of playing you can swap tiles (while the bag holds 7 or more) or pass.</p>
  <p>Drag tiles from the rack, or tap a tile and then a square. Tap a placed tile to take it back. Pinch or double-tap to zoom, drag to move round the board. A blank (?) can be any letter and is worth 0.</p>
  <h3>Scoring</h3><p>A word scores the sum of its letters. 2× Letter and 3× Letter squares multiply the letter on them; 2× Word and 3× Word squares multiply the whole word, and two of them multiply together. Premium squares only count on the turn a tile is placed on them. Every word you make in a move scores, the crossing words too.</p>
  <p>Full Rack: use all 7 tiles in one move for +40.</p>
  <h3>The end</h3><p>The game ends when the bag is empty and a player has used all their tiles, or after six scoreless turns in a row. Each player loses the value of the tiles left on their rack; a player who went out gains the other player's leftover total. Highest score wins.</p>
  <h3>Modes</h3><p>Classic: you against the computer (Easy, Normal, Hard or Expert) with your choice of board and modifiers. Campaign: 45 levels in three campaigns, 3 stars each. Daily: 10 turns on today's board, the same for everyone, scored against par. 2-Player: send share codes back and forth, or pass one device between you.</p>
  <p>Hints show a good move as ghost tiles. You get 3 a day, plus 1 for every level-up. A game where you used a hint still earns XP and stars, but sets no best-score records.</p>
  <h3>Letters</h3><p>The word list is English (ENABLE) in every language. Tilecraft's own letter values and tile counts:</p>${letterTable()}</div>
  <div class="btns"><button class="primary" data-close>Got it</button></div>`); S.howto=true; persist(); }
function openNews(){ openSheet(`<h2>What's new</h2>${CHANGES.map(c=>`<div class="label">v${c.v} · ${c.d}</div><div class="howto">${c.n.map(n=>`<p>${esc(n)}</p>`).join('')}</div>`).join('')}<div class="btns"><button class="primary" data-close>Close</button></div>`); }
function openAbout(){ openSheet(`<div class="howto"><h2>About and credits</h2>
  <p>Tilecraft ${VERSION}: an ad-free crossword tile game. No accounts, no tracking; nothing leaves your device.</p>
  <h3>Word list</h3><p data-raw>ENABLE (Enhanced North American Benchmark Lexicon), public domain. ${DICT_WORDS.toLocaleString('en')} words are used.</p>
  <h3>Banned words</h3><p>Slurs, obscenities and other offensive words are removed from the dictionary for everyone. The review started from the List of Dirty, Naughty, Obscene and Otherwise Bad Words (LDNOOBW contributors, CC BY 4.0).</p>
  <h3>Fonts</h3><p>Inter, JetBrains Mono and Caveat, under the SIL Open Font License.</p></div><div class="btns"><button class="primary" data-close>Close</button></div>`); }
async function gz(text,inflate){ const CS=inflate?window.DecompressionStream:window.CompressionStream; if(!CS) return null;
  const s=new Blob([text]).stream().pipeThrough(new CS('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); }
async function backupCode(){ const json=JSON.stringify(S);
  try{ const z=await gz(new TextEncoder().encode(json)); if(z){ let b=''; for(let i=0;i<z.length;i++) b+=String.fromCharCode(z[i]); return 'TILECRAFT1Z.'+btoa(b); } }catch(e){}
  return backupPlain(S); }
async function readBackup(text){ const m=/TILECRAFT1Z\.([A-Za-z0-9+/=]+)/.exec(String(text||''));
  if(m){ try{ const bin=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0)); const out=await gz(bin,true); const o=JSON.parse(new TextDecoder().decode(out)); return o&&typeof o.xp==='number'?o:null; }catch(e){ return null; } }
  return parseBackup(text); }
async function openBackup(){ if(G) saveGame(); const code=await backupCode();
  openSheet(`<h2>Backup &amp; restore</h2><div class="sub">This code holds your Tilecraft progress: XP, stars, records, achievements, settings, games in progress and your 2-Player games. Keep it somewhere safe.</div>
   <textarea rows="4" readonly id="bkCode">${esc(code)}</textarea><div class="btns"><button class="ghost" id="bkCopy">Copy</button><button class="ghost" id="bkFile">Save to file (${Math.ceil(code.length/1024)} KB)</button></div>
   <div class="label">Restore</div><textarea rows="3" id="bkIn" placeholder="Paste a backup code"></textarea><div class="btns"><button class="ghost" data-close>Close</button><button class="primary" id="bkGo">Restore</button></div>`);
  $('#bkCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(code); toast('Copied'); }catch(e){ $('#bkCode').select(); } S.bk.last=Date.now(); persist(); };
  $('#bkFile').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'})); a.download=`tilecraft-backup-${todayStr()}.txt`; a.click(); S.bk.last=Date.now(); persist(); };
  let armed=null; $('#bkGo').onclick=async()=>{ const o=await readBackup($('#bkIn').value); if(!o){ toast('That code isn\'t a Tilecraft backup'); return; }
    if(armed!==o.xp){ armed=o.xp; $('#bkGo').textContent=`Replace my progress (level ${levelOf(o.xp)})`; return; }
    S=loadSave(JSON.stringify(o),REDUCED); G=null; persist(); refreshShared(); applyLook(); closeSheet(); goHome(); toast('Progress restored'); }; }

// ===================== GAME =====================
// G: {mode, lid, date, gid, st, hints, pend: Map(cell -> {k, ch, bl}), view: rack order, sel, z, tx, ty, ai, timer…}
let G=null;
const humanSeat=g=>g.mode==='tp'?(tpGame(g).mode==='local'?g.st.turn:tpGame(g).me):0;
const tpGame=g=>tpFind(S,g.gid);
const isAiTurn=g=>!g.st.over&&!!g.st.cfg.players[g.st.turn].ai;
const myTurn=g=>!g.st.over&&!isAiTurn(g)&&(g.mode!=='tp'||tpGame(g).mode==='local'||g.st.turn===tpGame(g).me);
function startGame(meta,st,extra){ stopAi(); stopTimer();
  G=Object.assign({st,hints:0,assisted:false,pend:new Map(),view:null,sel:null,z:1,tx:0,ty:0,ghost:null,started:Date.now()},meta,extra||{});
  if(G.mode==='classic'||G.mode==='campaign'||G.mode==='practice'){ S.run=runOf(G); } if(G.mode==='daily'){ dailyFor(S,G.date).run=runOf(G); }
  persist(); buildBoard(); show('game'); applyLook(); closeSheet(); layout(); syncRack(); render(); turnStart(true); }
function runOf(g){ return {mode:g.mode,lid:g.lid,date:g.date,st:g.st,hints:g.hints,assisted:g.assisted}; }
function resumeRun(run){ startGame({mode:run.mode,lid:run.lid,date:run.date},cloneState(run.st),{hints:run.hints||0,assisted:!!run.assisted}); }
function saveGame(){ if(!G) return; recallAll(true);
  if(G.mode==='tp'){ const g=tpGame(G); if(g){ g.last=g.last||Date.now(); } }
  else if(G.mode==='daily'){ const d=dailyFor(S,G.date); if(!d.scored) d.run=G.st.over?null:runOf(G); }
  else S.run=G.st.over?null:runOf(G);
  persist(); }
function leaveGame(){ saveGame(); stopAi(); stopTimer(); const m=G.mode; G=null; closeSheet(); hideCover(); if(m==='tp') openTp(); else if(m==='campaign'){ renderCamp(); show('camp'); } else goHome(); }

// ---------- layout: the board fills the width; zoom and pan move inside it ----------
let BV=0; // board view size (px)
function layout(){ if(!G) return; const col=$('#gcol').getBoundingClientRect(), n=boardOf(G.st.cfg).n;
  const rt=Math.max(34,Math.min(52,Math.floor((col.width-16-6*5)/7))); document.documentElement.style.setProperty('--rt',rt+'px'); document.documentElement.style.setProperty('--dt',Math.max(44,rt+4)+'px');
  const used=['#sb','#gtag','#banner','#wl','#rack','#acts'].reduce((a,s)=>{ const e=$(s); return a+(e&&!e.hidden?e.getBoundingClientRect().height+6:0); },0);
  BV=Math.floor(Math.max(160,Math.min(col.width-16,col.height-used-16))); const v=$('#bview'); v.style.width=v.style.height=BV+'px';
  G.s0=BV/n; G.zmax=Math.max(1,Math.min(3.2,44/G.s0)); setZoom(G.z,null,true); }
addEventListener('resize',()=>{ if(G&&cur==='game') layout(); });
function setZoom(z,at,quiet){ const n=boardOf(G.st.cfg).n; z=Math.max(1,Math.min(G.zmax,z)); const s=G.s0*z, size=n*s;
  if(at){ const [px,py]=at, bx=(px-G.tx)/(G.s0*G.z), by=(py-G.ty)/(G.s0*G.z); G.tx=px-bx*s; G.ty=py-by*s; }
  G.z=z; G.tx=Math.min(0,Math.max(BV-size,G.tx)); G.ty=Math.min(0,Math.max(BV-size,G.ty)); if(z===1){ G.tx=0; G.ty=0; }
  const b=$('#board'); b.style.setProperty('--cs',s+'px'); b.style.setProperty('--n',n); b.style.transform=`translate(${G.tx}px,${G.ty}px)`;
  b.classList.toggle('lbl',s>=26); }
function zoomTo(cell,on){ const n=boardOf(G.st.cfg).n; if(on===false||G.z>1.01&&on!==true){ setZoom(1); return; }
  const z=G.zmax, s=G.s0*z, x=(cell%n+.5)*s, y=(((cell/n)|0)+.5)*s; G.z=z; G.tx=BV/2-x; G.ty=BV/2-y; setZoom(z); }

// ---------- board ----------
function buildBoard(){ const B=boardOf(G.st.cfg); let h='';
  for(let i=0;i<B.N;i++){ const p=B.prem[i]; h+=`<div class="c${B.mask[i]?'':' x'}${p?' p'+p:''}${i===B.start?' st':''}" data-c="${i}"><div class="f"></div></div>`; }
  $('#board').innerHTML=h; G.cellEls=[...$('#board').children]; }
function premLabel(p,cs){ const [a,b]=PREM_NAMES[p].split(' '); return cs>=30?`<span class="lb">${a}<small>${b}</small></span>`:`<span class="lb" data-raw>${a}${b[0]}</span>`; }
function render(){ if(!G) return; const st=G.st, B=boardOf(st.cfg), last=st.moves.slice().reverse().find(m=>m.t==='p'), lastSet=new Set(last?last.tiles.map(t=>t[0]):[]), cs=G.s0*G.z, lbl=cs>=18;
  const ghost=G.ghost?new Map(moveTiles(st,G.ghost).map(t=>[t[0],t])):null, ev=G.eval;
  const badCells=ev&&!ev.ok&&ev.words?new Set(ev.words.filter(w=>!w.ok).flatMap(w=>w.cells)):new Set();
  for(let i=0;i<B.N;i++){ const el=G.cellEls[i], c=st.cells[i], pd=G.pend.get(i); let inner='<div class="f">'+(i===B.start&&!c&&!pd?'★':B.prem[i]&&lbl&&!c&&!pd?premLabel(B.prem[i],cs):'')+'</div>';
    if(c) inner+=tileHtml(c.toUpperCase(),{bl:c>='a',cls:(lastSet.has(i)&&!G.pend.size?'last':'')+(P.motion&&G.animSet&&G.animSet.has(i)?' drop':'')});
    else if(pd) inner+=tileHtml(pd.ch||'?',{bl:pd.bl,cls:'pend'+(badCells.has(i)?' bad':'')+(pd.glint?' glint':'')});
    else if(ghost&&ghost.has(i)){ const t=ghost.get(i); inner+=tileHtml(t[1],{bl:t[2],cls:'ghostt'}); }
    if(el.innerHTML!==inner) el.innerHTML=inner; el.classList.toggle('tgt',G.sel!=null&&!c&&!pd&&!!B.mask[i]); }
  renderSb(); renderRack(); renderWl(); renderActs(); }
function renderSb(){ const st=G.st, np=st.racks.length, cfg=st.cfg, tg=G.mode==='tp'?tpGame(G):null;
  const pl=p=>`<div class="pl${!st.over&&st.turn===p?' on':''}"><div class="nm" data-raw>${esc(cfg.players[p].name||'Player '+(p+1))}${tg&&tg.mode==='code'&&tg.me===p?` (${esc(T('you'))})`:''}</div><div class="sc">${st.result?st.result.final[p]:st.scores[p]}</div>${G.ai&&st.turn===p?'<div class="think">thinking…</div>':''}</div>`;
  let mid; const timer=G.timer?`<div class="mid${G.timer.left<=5?' warn':''}"><b>${G.timer.left}</b><span>sec</span></div>`:'';
  if(cfg.solo) mid=`<div class="mid"><b>${Math.min(cfg.turns,st.moves.length+(st.over?0:1))}/${cfg.turns}</b><span>Turn</span></div>`;
  else mid=`<div class="mid"><b>${st.bag.length}</b><span>Bag</span></div>`;
  let extra=''; if(G.mode==='daily'||G.mode==='practice'){ const par=S.parCache[G.date]; extra=`<div class="mid"><b>${par||'…'}</b><span>Par</span></div>`; }
  else if(G.mode==='campaign'&&levelById(G.lid).type==='target') extra=`<div class="mid"><b>${levelById(G.lid).goal.v}</b><span>Goal</span></div>`;
  $('#sb').innerHTML=pl(0)+mid+timer+extra+(np>1?pl(1):'')+`<button class="menubtn" id="bMenu" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>`;
  $('#bMenu').onclick=openPause;
  const raw=G.mode==='campaign'; $('#gtag').toggleAttribute('data-raw',raw);
  const tag=G.mode==='campaign'?`${T(CAMPS[levelById(G.lid).camp].name)} ${levelById(G.lid).n} · ${levelById(G.lid).name}`:G.mode==='daily'?'Daily · '+G.date:G.mode==='practice'?'Daily practice · doesn\'t score':G.mode==='classic'?setupLabel(Object.assign({ai:cfg.players[1].ai,size:cfg.size,shape:cfg.shape},cfg.mods)):tg&&tg.mode==='local'?'Pass-and-play · '+setupLabel(Object.assign({size:cfg.size,shape:cfg.shape},cfg.mods)):'2-Player · '+setupLabel(Object.assign({size:cfg.size,shape:cfg.shape},cfg.mods));
  $('#gtag').textContent=tag+(G.assisted?' · '+(raw?T('Assisted'):'Assisted'):''); }
// the rack in display order; G.view holds tiles, pending ones are hidden
function syncRack(){ const p=humanSeat(G), r=(G.st.racks[p]||[]).slice(), old=G.view||[], out=[];
  for(const t of old){ const k=r.indexOf(t); if(k>=0){ out.push(t); r.splice(k,1); } } G.view=out.concat(r); G.seat=p; }
function renderRack(){ const show=myTurn(G)||G.st.over||isAiTurn(G);
  $('#rack').innerHTML=show?G.view.map((t,k)=>{ const used=[...G.pend.values()].some(v=>v.k===k), swp=G.swapSel&&G.swapSel.has(k);
    return `<div class="rt${used?' gone':''}${G.sel===k?' sel':''}${swp?' sw':''}" data-k="${k}">${tileHtml(t==='?'?' ':t,{bl:t==='?'})}</div>`; }).join(''):''; }
function renderWl(){ const el=$('#wl'), ev=G.eval;
  if(G.flash){ el.innerHTML=G.flash; return; }
  if(G.st.over){ el.innerHTML=`<span class="msg">Game over</span>`; return; }
  if(G.mode==='tp'&&!myTurn(G)){ el.innerHTML=`<span class="msg" data-raw>${esc(TF('Waiting for {0}',G.st.cfg.players[G.st.turn].name||T('Player 2')))}</span>`; return; }
  if(isAiTurn(G)){ el.innerHTML=`<span class="msg" data-raw>${esc(TF('{0} is thinking…',T(G.st.cfg.players[G.st.turn].name)))}</span>`; return; }
  if(!G.pend.size){ el.innerHTML=G.ghost?`<span class="msg" data-raw>${esc(TF('Hint: {0} for {1}',G.ghost.w,G.ghost.sc))}</span>`:`<span class="msg">${G.st.cells.some(c=>c)?'Drag or tap tiles onto the board':'Cover the ★ with your first word'}</span>`; return; }
  if(!ev||!ev.words||!ev.words.length){ el.innerHTML=`<span class="msg">${esc(ev&&ev.err?errMsg(ev.err):'')}</span>`; return; }
  el.innerHTML=ev.words.map(w=>`<span class="w ${w.ok?'yes':'no'}" data-raw>${esc(w.w)} ${w.ok?'✓':'✗'} ${w.sc}</span>`).join('')+(ev.full?`<span class="w yes">Full Rack +40</span>`:'')+
    (ev.ok?`<span class="tot">= ${ev.score}</span>`:`<span class="msg">${esc(errMsg(ev.err))}</span>`); }
function renderActs(){ const mine=myTurn(G)&&!G.busy, st=G.st;
  $('#bPlay').disabled=!(mine&&G.eval&&G.eval.ok); const pl=G.swapSel?'Swap':'Play'; if($('#bPlay').dataset.l!==pl){ $('#bPlay').dataset.l=pl; $('#bPlay').textContent=pl; }
  if(G.swapSel) $('#bPlay').disabled=!G.swapSel.size;
  $('#bShuffle').disabled=!mine; $('#bRecall').disabled=!mine||!G.pend.size; $('#bSwap').disabled=!mine||!canSwap(st); $('#bPass').disabled=!mine;
  const noHint=G.mode==='daily'||G.mode==='practice'||G.mode==='tp'; $('#bHint').disabled=!mine||noHint; $('#hintCnt').textContent=noHint?'':S.hints;
  const tg=G.mode==='tp'?tpGame(G):null, ban=$('#banner'), was=ban.hidden;
  if(tg&&tg.mode==='code'&&!st.over&&st.turn!==tg.me){ ban.hidden=false; ban.innerHTML=`<b data-raw>${esc(TF('Send the code to {0}, then paste their reply.',tg.names[1-tg.me]||T('your friend')))}</b><button id="bnSend">Send code</button><button id="bnPaste">Paste reply</button>`;
    $('#bnSend').onclick=()=>share(tpCodeText(tg,st),'Code copied. Send it to your friend.'); $('#bnPaste').onclick=()=>tpPaste(); }
  else if(tg&&tg.mode==='code'&&st.over){ ban.hidden=false; ban.innerHTML=`<b>Game over. Send the last code so your friend sees the end.</b><button id="bnSend">Send code</button>`; $('#bnSend').onclick=()=>share(tpCodeText(tg,st),'Code copied. Send it to your friend.'); }
  else ban.hidden=true;
  if(was!==ban.hidden) layout(); }

// ---------- placing tiles ----------
const placeMode=()=>S.prefs.place;
function evalPend(){ G.eval=G.pend.size?evalPlay(G.st,[...G.pend].map(([i,v])=>[i,v.ch,v.bl?1:0])):null; }
function placeTile(k,cell,ch){ const t=G.view[k]; if(t==null) return; const B=boardOf(G.st.cfg);
  if(!B.mask[cell]||G.st.cells[cell]||G.pend.has(cell)) return;
  for(const [i,v] of G.pend) if(v.k===k) G.pend.delete(i);
  const bl=t==='?'; G.pend.set(cell,{k,ch:bl?(ch||''):t,bl,glint:B.prem[cell]>0&&P.motion});
  G.sel=null; G.ghost=null; sfx('place'); if(B.prem[cell]) setTimeout(()=>sfx('glint'),60); buzz(6);
  if(S.prefs.zoom&&G.pend.size===1&&G.z<1.01&&G.s0<30) zoomTo(cell,true);
  if(bl&&!ch){ pickLetter(cell); }
  evalPend(); render(); }
function pickLetter(cell){ openSheet(`<h2>Blank tile</h2><div class="sub">Choose the letter it stands for. It scores 0.</div><div class="letters">${ALPHA.split('').map(c=>`<button data-l="${c}">${c}</button>`).join('')}</div><div class="btns"><button class="ghost" data-close>Cancel</button></div>`,
  ()=>{ const v=G&&G.pend.get(cell); if(v&&!v.ch){ G.pend.delete(cell); evalPend(); render(); } });
  $$('#sheet [data-l]').forEach(b=>b.onclick=()=>{ const v=G.pend.get(cell); if(v) v.ch=b.dataset.l; sheetClose=null; closeSheet(); evalPend(); render(); }); }
function unplace(cell){ if(!G.pend.has(cell)) return; G.pend.delete(cell); sfx('lift'); evalPend(); render(); }
function recallAll(quiet){ if(!G||!G.pend.size) return; G.pend.clear(); G.sel=null; evalPend(); if(!quiet){ sfx('recall'); render(); } }
function cellAt(x,y){ const r=$('#bview').getBoundingClientRect(); if(x<r.left||y<r.top||x>r.right||y>r.bottom) return -1;
  const n=boardOf(G.st.cfg).n, s=G.s0*G.z, cx=Math.floor((x-r.left-G.tx)/s), cy=Math.floor((y-r.top-G.ty)/s); return cx<0||cy<0||cx>=n||cy>=n?-1:cy*n+cx; }
function overRack(x,y){ const r=$('#rack').getBoundingClientRect(); return y>=r.top-10&&y<=r.bottom+10&&x>=r.left&&x<=r.right; }
// pointer handling: drag from the rack or the board, tap-to-place, pinch to zoom, drag to pan, double-tap to zoom
const PT=new Map(); let gest=null, lastTap={t:0,x:0,y:0};
function dragShow(t,x,y,bl){ const d=$('#drag'); d.innerHTML=tileHtml(t==='?'?' ':t,{bl}); d.style.display='block'; d.style.left=x+'px'; d.style.top=y+'px'; }
function dragHide(){ $('#drag').style.display='none'; }
$('#game').addEventListener('pointerdown',e=>{ if(!G||cur!=='game') return; const rt=e.target.closest('.rt'), onBoard=e.target.closest('#bview');
  if(!rt&&!onBoard) return; e.preventDefault(); PT.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY});
  if(PT.size===2&&onBoard){ const [a,b]=[...PT.values()]; if(gest&&gest.drag) dragHide(); gest={pinch:true,d0:Math.hypot(a.x-b.x,a.y-b.y),z0:G.z}; return; }
  if(PT.size>1) return;
  try{ e.target.setPointerCapture&&e.target.setPointerCapture(e.pointerId); }catch(_){}
  if(rt){ const k=+rt.dataset.k; gest={kind:'rack',k,id:e.pointerId}; return; }
  const cell=cellAt(e.clientX,e.clientY); gest={kind:G.pend.has(cell)&&myTurn(G)?'pend':'board',cell,id:e.pointerId,tx0:G.tx,ty0:G.ty}; },{passive:false});
addEventListener('pointermove',e=>{ if(!G||!PT.has(e.pointerId)||!gest) return; const p=PT.get(e.pointerId); p.x=e.clientX; p.y=e.clientY;
  if(gest.pinch){ if(PT.size<2) return; const [a,b]=[...PT.values()], d=Math.hypot(a.x-b.x,a.y-b.y), r=$('#bview').getBoundingClientRect();
    setZoom(gest.z0*d/Math.max(20,gest.d0),[(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top]); render(); return; }
  const moved=Math.hypot(p.x-p.x0,p.y-p.y0)>7;
  if(gest.drag){ $('#drag').style.left=p.x+'px'; $('#drag').style.top=p.y+'px'; const c=cellAt(p.x,p.y); if(c!==gest.over){ gest.over=c; } return; }
  if(!moved) return;
  if((gest.kind==='rack'||gest.kind==='pend')&&placeMode()!=='tap'&&myTurn(G)&&!G.swapSel){
    const t=gest.kind==='rack'?G.view[gest.k]:G.view[G.pend.get(gest.cell).k], bl=t==='?'; if(gest.kind==='pend'){ gest.k=G.pend.get(gest.cell).k; gest.from=gest.cell; G.pend.delete(gest.cell); evalPend(); render(); }
    if(gest.kind==='rack'&&[...G.pend.values()].some(v=>v.k===gest.k)) return;
    gest.drag=true; G.sel=null; dragShow(t,p.x,p.y,bl); sfx('lift'); return; }
  if(gest.kind!=='rack'&&G.z>1.01){ gest.kind='pan'; G.tx=gest.tx0+(p.x-p.x0); G.ty=gest.ty0+(p.y-p.y0); setZoom(G.z); } });
function endPointer(e){ if(!G||!PT.has(e.pointerId)) return; const p=PT.get(e.pointerId); PT.delete(e.pointerId); const g=gest;
  if(!g){ return; } if(g.pinch){ if(!PT.size) gest=null; return; } gest=null;
  if(g.drag){ dragHide(); const c=cellAt(p.x,p.y), B=boardOf(G.st.cfg);
    if(c>=0&&B.mask[c]&&!G.st.cells[c]&&!G.pend.has(c)){ const ch=g.from!=null&&G.view[g.k]==='?'?null:null; placeTile(g.k,c,ch); }
    else if(overRack(p.x,p.y)){ const r=[...$$('#rack .rt')], tx=p.x; let at=r.findIndex(el=>{ const b=el.getBoundingClientRect(); return tx<b.left+b.width/2; }); if(at<0) at=r.length-1;
      moveInRack(g.k,at); sfx('lift'); evalPend(); render(); }
    else { evalPend(); render(); }
    return; }
  if(e.type==='pointercancel') return;
  const now=performance.now(), dbl=now-lastTap.t<300&&Math.hypot(p.x-lastTap.x,p.y-lastTap.y)<30;
  if(g.kind==='rack'){ if(G.swapSel){ G.swapSel.has(g.k)?G.swapSel.delete(g.k):G.swapSel.add(g.k); render(); return; }
    if(!myTurn(G)||placeMode()==='drag') return; if([...G.pend.values()].some(v=>v.k===g.k)) return; G.sel=G.sel===g.k?null:g.k; sfx('lift'); render(); return; }
  if(g.kind==='pend'){ unplace(g.cell); lastTap={t:0,x:0,y:0}; return; }
  if(g.kind==='board'){ const c=cellAt(p.x,p.y);
    if(G.sel!=null&&c>=0&&myTurn(G)){ placeTile(G.sel,c); lastTap={t:0,x:0,y:0}; return; }
    if(dbl){ const r=$('#bview').getBoundingClientRect(); if(G.z>1.01) setZoom(1); else { G.z=1; setZoom(G.zmax,[p.x-r.left,p.y-r.top]); } render(); lastTap={t:0,x:0,y:0}; return; }
    lastTap={t:now,x:p.x,y:p.y}; } }
addEventListener('pointerup',endPointer); addEventListener('pointercancel',endPointer);
function moveInRack(k,at){ // move rack tile k to display position at, keeping pending tiles pointing at the right tiles
  const ord=G.view.map((t,i)=>i); ord.splice(ord.indexOf(k),1); ord.splice(at,0,k);
  const map=new Map(ord.map((old,nw)=>[old,nw])); G.view=ord.map(i=>G.view[i]); for(const v of G.pend.values()) v.k=map.get(v.k); if(G.sel!=null) G.sel=map.get(G.sel); }
$('#bShuffle').onclick=()=>{ if(!myTurn(G)) return; const free=G.view.map((t,i)=>i).filter(i=>![...G.pend.values()].some(v=>v.k===i));
  const rng=Math.random; for(let i=free.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const a=free[i], b=free[j]; const t=G.view[a]; G.view[a]=G.view[b]; G.view[b]=t; }
  G.sel=null; sfx('shuffle'); render(); };
$('#bRecall').onclick=()=>recallAll();
$('#bPass').onclick=()=>{ if(!myTurn(G)) return; openSheet(`<h2>Pass?</h2><div class="sub">You score 0 this turn. Six scoreless turns in a row end the game.</div><div class="btns"><button class="ghost" data-close>Cancel</button><button class="primary" id="psGo">Pass</button></div>`);
  $('#psGo').onclick=()=>{ closeSheet(); recallAll(true); doMove({t:'-'}); }; };
$('#bSwap').onclick=()=>{ if(!myTurn(G)) return; if(!canSwap(G.st)){ toast(G.st.cfg.mods.swaps===false?'Swaps are off in this game':'Swaps need at least 7 tiles in the bag'); return; }
  recallAll(true); if(G.swapSel){ G.swapSel=null; render(); return; } G.swapSel=new Set(); G.sel=null; toast('Tap the tiles to swap, then Swap'); render(); };
$('#bHint').onclick=()=>{ if(!myTurn(G)||G.busy) return; if(S.hints<=0){ toast('No hints left. They refill tomorrow, and each level-up gives one.'); return; }
  recallAll(true); G.busy=true; render(); const gen=moveGen(G.st,G.st.racks[humanSeat(G)],{slice:true});
  sliced(gen,ms=>{ G.busy=false; const h=hintFrom(G.st,ms,G.hints); if(!h){ toast('No move found. Try a swap.'); render(); return; }
    useHint(S); G.hints++; G.assisted=true; G.ghost=h; sfx('hint'); saveGame(); const t=moveTiles(G.st,h); zoomTo(t[0][0],G.s0<30?true:false); render(); }); };
$('#bPlay').onclick=()=>{ if(!myTurn(G)) return;
  if(G.swapSel){ const ts=[...G.swapSel].map(k=>G.view[k]); G.swapSel=null; doMove({t:'x',tiles:ts}); return; }
  if(!G.eval||!G.eval.ok) return; const tiles=[...G.pend].map(([i,v])=>[i,v.ch,v.bl?1:0]);
  if(S.prefs.confirm){ openSheet(`<h2 data-raw>${esc(TF('Play {0}?',G.eval.main.w))}</h2><div class="sub">${G.eval.score} points${G.eval.words.length>1?' · '+G.eval.words.slice(1).map(w=>w.w).join(', '):''}</div><div class="btns"><button class="ghost" data-close>Cancel</button><button class="primary" id="cfGo">Play</button></div>`);
    $('#cfGo').onclick=()=>{ closeSheet(); doMove({t:'p',tiles}); }; return; }
  doMove({t:'p',tiles}); };
addEventListener('keydown',e=>{ if(!G||cur!=='game'||sheetOn) return; if(e.key==='Enter'){ $('#bPlay').click(); } else if(e.key==='Escape'){ if(G.pend.size) recallAll(); else openPause(); } else if(e.key===' '){ e.preventDefault(); $('#bShuffle').click(); } else if(e.key==='Backspace'){ const last=[...G.pend.keys()].pop(); if(last!=null) unplace(last); } });

// ---------- moves ----------
function doMove(mv,why){ if(!G) return; const st=G.st, p=st.turn; stopTimer();
  const r=applyMove(st,mv.t==='-'&&why?{t:'-',why}:mv); if(!r.ok){ toast(errMsg(r.err)); sfx('bad'); return; }
  G.pend.clear(); G.sel=null; G.ghost=null; G.eval=null; G.swapSel=null;
  const rec=st.moves[st.moves.length-1]; afterMove(rec,p,true); }
function afterMove(rec,p,human){ const st=G.st;
  if(rec.t==='p'){ G.animSet=new Set(rec.tiles.map(t=>t[0])); countUp(rec); if(rec.full){ sfx('full'); playFx(look('fx'),true); buzz([20,40,20]); } else if(rec.sc>=50){ sfx('big'); playFx(look('fx'),false); } else sfx('score',rec.sc); }
  else if(rec.t==='x'){ sfx('swap'); flashMsg(esc(TF('{0} swapped {1}',T(st.cfg.players[p].name),rec.tiles.length)),1); } else { sfx('pass'); flashMsg(rec.why==='time'?esc(T('Time\'s up: turn passed')):esc(TF('{0} passed',T(st.cfg.players[p].name))),1); }
  if(G.mode==='tp'){ const g=tpGame(G); g.moves=codeMoves(st); g.n=g.moves.length; g.last=Date.now(); g.over=st.over; g.turn=st.over?-1:st.turn; tpSave(S,g); }
  syncRack(); saveGame(); render(); setTimeout(()=>{ if(G) { G.animSet=null; } },400);
  if(st.over){ setTimeout(finishGame,rec.t==='p'?900:400); return; }
  if(G.mode==='tp'){ const g=tpGame(G);
    if(g.mode==='code'&&human){ setTimeout(()=>openSheet(`<h2>Send your move</h2><div class="sub" data-raw>${esc(TF('Send this code to {0}. When they reply, paste their code here.',g.names[1-g.me]||T('your friend')))}</div>
      <textarea rows="5" readonly id="cdOut">${esc(tpCodeText(g,st))}</textarea><div class="btns"><button class="ghost" data-close>Later</button><button class="primary" id="cdSend">Send code</button></div>`),500);
      setTimeout(()=>{ if($('#cdSend')) $('#cdSend').onclick=()=>{ share(tpCodeText(g,st),'Code copied. Send it to your friend.'); closeSheet(); }; },520); return; }
    if(g.mode==='local'){ setTimeout(()=>showCover(st.cfg.players[st.turn].name),700); return; } }
  turnStart(); }
let flashT=0; function flashMsg(h,raw){ if(!G) return; G.flash=`<span class="msg"${raw?' data-raw':''}>${h}</span>`; renderWl(); clearTimeout(flashT); flashT=setTimeout(()=>{ if(G){ G.flash=null; renderWl(); } },1600); }
function countUp(rec){ let n=0; const end=rec.sc, steps=Math.min(18,end), d=P.motion?Math.max(18,500/Math.max(1,steps)):0, ws=[rec.w,...rec.ws].map(w=>`<span class="w yes" data-raw>${esc(w)}</span>`).join('');
  const draw=v=>{ if(!G) return; G.flash=`${ws}${rec.full?'<span class="w yes">Full Rack +40</span>':''}<span class="tot">+${v}</span>`; renderWl(); };
  if(!d){ draw(end); } else { const iv=setInterval(()=>{ n++; const v=Math.round(end*n/steps); draw(v); if(n%2===0) sfx('count',n); if(n>=steps) clearInterval(iv); },d); }
  clearTimeout(flashT); flashT=setTimeout(()=>{ if(G){ G.flash=null; renderWl(); } },1800+steps*d); }

// ---------- turns, the computer opponent and the timer ----------
function turnStart(first){ if(!G||G.st.over) return; const st=G.st; layout();
  if(isAiTurn(G)){ runAi(); return; }
  if(G.mode==='tp'&&tpGame(G).mode==='local'&&first){ showCover(st.cfg.players[st.turn].name); return; }
  if(myTurn(G)&&st.cfg.mods.timer) startTimer(st.cfg.mods.timer);
  render(); }
function sliced(gen,done){ const job={gen}; G.job=job; const step=()=>{ if(!G||G.job!==job) return; const t=performance.now(); let r;
    do r=gen.next(); while(!r.done&&performance.now()-t<8);
    if(r.done){ G.job=null; done(r.value); } else requestAnimationFrame(step); };
  requestAnimationFrame(step); }
function runAi(){ const st=G.st, p=st.turn, lvl=st.cfg.players[p].ai, t0=performance.now(), wait=S.prefs.think?600+Math.random()*600:0;
  G.ai=true; render();
  sliced(moveGen(st,st.racks[p],{slice:true}),ms=>{ const mv=aiChoose(st,p,lvl,ms);
    const go=()=>{ if(!G||G.st!==st) return; G.ai=false;
      if(mv.t!=='p'||!P.motion){ const r=applyMove(st,mv.t==='p'?{t:'p',tiles:mv.tiles}:mv); afterMove(st.moves[st.moves.length-1],p,false); showHistAfter(); return; }
      // the computer's tiles animate onto the board one by one
      let k=0; const tiles=mv.tiles; G.busy=true;
      const iv=setInterval(()=>{ if(!G||G.st!==st){ clearInterval(iv); return; } const [i,ch,bl]=tiles[k]; G.pend.set(i,{k:-1,ch,bl}); sfx('ai'); render(); k++;
        if(k>=tiles.length){ clearInterval(iv); setTimeout(()=>{ if(!G||G.st!==st) return; G.pend.clear(); G.busy=false; applyMove(st,{t:'p',tiles}); afterMove(st.moves[st.moves.length-1],p,false); showHistAfter(); },260); } },140); };
    const left=wait-(performance.now()-t0); if(left>0) setTimeout(go,left); else go(); }); }
function showHistAfter(){ if(S.prefs.history&&G&&!G.st.over) setTimeout(()=>{ if(G&&!sheetOn&&myTurn(G)) openHistory(); },700); }
function stopAi(){ if(G){ G.job=null; G.ai=false; G.busy=false; } }
function startTimer(sec){ stopTimer(); G.timer={left:sec}; G.timer.iv=setInterval(()=>{ if(!G||!G.timer) return; if(sheetOn&&cur==='game'&&$('#pauseSheet')) return; G.timer.left--;

  c.classList.add('on'); $('#cvGo').onclick=()=>{ hideCover(); syncRack(); render(); if(G.st.cfg.mods.timer) startTimer(G.st.cfg.mods.timer); }; $('#cvMenu').onclick=()=>{ hideCover(); leaveGame(); }; }

// ---------- pause menu and move history ----------

  <div class="btns"><button class="ghost" id="pmQuit">Save and quit</button><button class="primary" data-close>Resume</button></div>`);

// ---------- results ----------
function finishGame(){ if(!G) return; const g=G, st=g.st, today=todayStr(), p=g.mode==='tp'?(tpGame(g).mode==='local'?0:tpGame(g).me):0;
  stopTimer(); stopAi(); hideCover();
  const res=st.result, gs=gameStats(st,p); let xp=0, title='', rx=null, extra='', recs=[], up=null, ach=[], dres=null;
  const ai=st.cfg.players.length>1?st.cfg.players[1-p].ai:null, won=res.winner===p;
  if(g.mode==='classic'){ S.run=null; xp=classicXP(st,p,ai); recs=addRecords(S,st,p,ai,g.assisted,today); addStats(S,st,p); title=won?'You win!':res.winner===-1?'A draw':'Game over'; }
  if(g.mode==='campaign'){ S.run=null; const L=levelById(g.lid), o=levelOutcome(L,st); rx=campaignResult(S,L,o,g.hints); xp=rx.xp; addStats(S,st,p); title=o.goal?'Level cleared':'Not this time'; }
  if(g.mode==='daily'){ const d=dailyFor(S,g.date); d.run=null; if(!d.par&&S.parCache[g.date]) d.par=S.parCache[g.date]; dres=dailyResult(S,g.date,st.scores[0],today); xp=dres?dres.xp:0; addStats(S,st,p); title='Daily'; }
  if(g.mode==='practice'){ S.run=null; title='Practice'; }
  if(g.mode==='tp'){ const t=tpGame(g); title=t.mode==='local'?(res.winner===-1?T('A draw'):TF('{0} wins',st.cfg.players[res.winner].name)):won?T('You win!'):res.winner===-1?T('A draw'):TF('{0} wins',st.cfg.players[1-p].name); tpCount(S,t,st); }
  if(xp) up=addXP(S,xp);
  ach=checkAch(S,{mode:g.mode==='practice'?'daily':g.mode,st,p,hints:g.hints,ai,practice:g.mode==='practice',local:g.mode==='tp'&&tpGame(g).mode==='local'});
  persist();
  const L=g.mode==='campaign'?levelById(g.lid):null;
  let h=`<div class="sub" style="margin:0" data-raw>${esc($('#gtag').textContent)}</div><h2${g.mode==='tp'?' data-raw':''}>${esc(title)}</h2>`;
  if(st.racks.length>1) h+=`<div class="kv" style="grid-template-columns:1fr 1fr">${[0,1].map(q=>`<div><b>${res.final[q]}</b><span data-raw>${esc(st.cfg.players[q].name)}</span>${res.adj[q]?`<span style="display:block;font-size:10px">${res.adj[q]>0?'Gained '+res.adj[q]:'Lost '+(-res.adj[q])} for tiles left</span>`:''}</div>`).join('')}</div>`;
  else h+=`<div class="big">${st.scores[0]}</div>`;
  h+=`<div class="kv"><div><b data-raw>${esc(gs.longest||'—')}</b><span>Longest word</span></div><div><b>${gs.best?gs.best.sc:'—'}</b><span>Top move</span></div><div><b>${gs.fullRacks}</b><span>Full Racks</span></div></div>`;
  if(gs.best) h+=`<div class="sub" style="text-align:center" data-raw>${esc(TF('Highest-scoring move: {0} for {1}',gs.best.w,gs.best.sc))}</div>`;
  if(L) h+=levelGoals(L,campOf(S,L.id),rx.fresh)+(rx.finished?`<div class="sub" style="font-weight:700;color:var(--ink)" data-raw>${esc(TF('{0} campaign complete!',T(CAMPS[L.camp].name)))}</div>`:'');
  if(g.mode==='daily'||g.mode==='practice'){ const par=S.parCache[g.date]||0, n=par?parStars(st.scores[0],par):0;
    h+=`<div style="text-align:center;font-size:26px;margin:4px 0">${starsHtml(n)}</div><div class="sub" style="text-align:center">${par?`${Math.round(st.scores[0]/par*100)}% of par (${par})`:''}${g.mode==='practice'?' · practice doesn\'t score':''}</div>`; }
  if(g.assisted&&g.mode==='classic') h+=`<div class="sub">Assisted: a hint was used, so no best-score records.</div>`;
  if(recs.length) h+=`<div class="sub" style="font-weight:700;color:var(--ink)" data-raw>${esc(TF('New record: {0}',recs.map(r=>T(r)).join(', ')))}</div>`;
  if(xp) h+=`<div class="sub" style="font-weight:700;color:var(--ink)">+${xp} XP${up&&up.after>up.before?` · Level ${up.after}!${up.rewards.length?' · '+esc(up.rewards.join(' · ')):''} · +${up.hints} hint`:''}</div>`;
  for(const id of ach){ const a=ACH.find(a=>a.id===id); h+=`<div class="sub" style="font-weight:700;color:var(--ink)">🏆 <span data-raw>${esc(a.name)}</span>${a.reward?` · <span>${esc(a.reward)}</span>`:''}</div>`; }
  const canNext=L&&campCleared(S,L.id)&&LEVELS.find(x=>x.camp===L.camp&&x.n===L.n+1);
  h+=`<div class="btns">${g.mode==='daily'?'<button class="ghost" id="rShare">Share</button>':''}<button class="ghost" id="rMoves">Moves</button><button class="ghost" id="rHome">Menu</button>
   ${g.mode==='tp'&&tpGame(g).mode==='code'?'<button class="ghost" id="rSend">Send code</button>':''}${g.mode==='daily'?'<button class="primary" id="rPrac">Practice</button>':canNext?'<button class="ghost" id="rAgain">Retry</button><button class="primary" id="rNext">Next level</button>':g.mode==='tp'?'<button class="primary" id="rList">Games</button>':'<button class="primary" id="rAgain">Play again</button>'}</div>`;
  openSheet(h,()=>{ if(cur==='game'&&G&&G.st.over) leaveGame(); });
  if(up&&up.after>up.before){ sfx('level'); playFx('confetti',true); } else if(won||(L&&rx.fresh.length)) sfx('win'); else if(st.racks.length>1) sfx('lose');
  if(L) rx.fresh.forEach((i,k)=>setTimeout(()=>sfx('star',i),300+k*180));
  if(g.mode!=='tp'){ if(g.mode==='daily'){ const d=dailyFor(S,g.date); d.run=null; } else S.run=null; persist(); }
  $('#rHome').onclick=()=>{ sheetClose=null; closeSheet(); G=null; goHome(); }; $('#rMoves').onclick=()=>{ const keep=sheetClose; sheetClose=null; openHistory(); sheetClose=keep; };
  if($('#rAgain')) $('#rAgain').onclick=()=>{ sheetClose=null; closeSheet(); if(g.mode==='campaign') startGame({mode:'campaign',lid:L.id},newGame(levelCfg(L))); else startClassic(); };
  if($('#rNext')) $('#rNext').onclick=()=>{ sheetClose=null; closeSheet(); G=null; const nx=LEVELS.find(x=>x.camp===L.camp&&x.n===L.n+1); S.campTab=nx.camp; renderCamp(); show('camp'); openLevel(nx); };
  if($('#rPrac')) $('#rPrac').onclick=()=>{ sheetClose=null; closeSheet(); startGame({mode:'practice',date:g.date},newGame(dailyCfg(g.date))); };
  if($('#rSend')) $('#rSend').onclick=()=>share(tpCodeText(tpGame(g),st),'Code copied. Send it to your friend.');
  if($('#rList')) $('#rList').onclick=()=>{ sheetClose=null; closeSheet(); G=null; openTp(); };
  if($('#rShare')) $('#rShare').onclick=()=>{ const d=dailyFor(S,g.date); share(shareLine(g.date,d.score,d.par,d.stars)); }; }

// ===================== WORD EFFECTS (full-screen layer) =====================
const fxc=$('#fxc'), fctx=fxc.getContext('2d'); let FX=[], fxRun=false;
const FX_COL={sparks:['#ffd36b','#ffb347','#fff3c4','#ff9f43'],embers:['#ff6a3d','#ff9a3c','#ffd08a','#c2471b'],confetti:['#8064cc','#3d9a77','#f1cc68','#ff8f5a','#2aa198','#e85d75'],lightning:['#cfe8ff','#ffffff','#9fd3ff']};
function playFx(kind,big){ if(!P.motion||!kind) return; const w=innerWidth, h=innerHeight, pal=FX_COL[kind]||FX_COL.sparks, m=big?2:1;
  if(FX.length>1500) return; const bv=$('#bview').getBoundingClientRect(), cx=bv.width?bv.left+bv.width/2:w/2, cy=bv.height?bv.top+bv.height/2:h/2;
  if(kind==='sparks') for(let i=0;i<70*m;i++){ const a=Math.random()*Math.PI*2, sp=120+Math.random()*260*m; FX.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-80,s:2+Math.random()*2,col:pal[i%pal.length],life:.9+Math.random()*.6,k:'s',g:260}); }
  if(kind==='embers') for(let i=0;i<60*m;i++) FX.push({x:Math.random()*w,y:h+10+Math.random()*60,vx:(Math.random()-.5)*40,vy:-(80+Math.random()*160),s:2+Math.random()*3,col:pal[i%pal.length],life:1.6+Math.random()*1.2,k:'e',g:-10,ph:Math.random()*6});
  if(kind==='confetti') for(let i=0;i<110*m;i++) FX.push({x:Math.random()*w,y:-20-Math.random()*h*.3,vx:(Math.random()-.5)*120,vy:100+Math.random()*160,r:Math.random()*6,vr:(Math.random()-.5)*10,s:5+Math.random()*5,col:pal[i%pal.length],life:2.6,k:'c',g:30});
  if(kind==='lightning') for(let b=0;b<(big?3:1);b++) FX.push({k:'l',life:.5,t0:.5,delay:b*.18,x0:cx+(Math.random()-.5)*bv.width*.6,seed:Math.random()});
  if(!fxRun){ fxRun=true; let last=performance.now(); const run=now=>{ const dt=Math.min(.05,(now-last)/1000); last=now; const dpr=devicePixelRatio||1;
    if(fxc.width!==innerWidth*dpr){ fxc.width=innerWidth*dpr; fxc.height=innerHeight*dpr; } fctx.setTransform(dpr,0,0,dpr,0,0); fctx.clearRect(0,0,innerWidth,innerHeight);
    for(const p of FX){ if(p.delay>0){ p.delay-=dt; continue; } p.life-=dt;
      if(p.k==='l'){ const a=Math.max(0,p.life/p.t0); fctx.globalAlpha=a; fctx.strokeStyle='#e8f4ff'; fctx.lineWidth=3; fctx.shadowColor='#9fd3ff'; fctx.shadowBlur=18; fctx.beginPath();
        let x=p.x0, y=0, r=p.seed; fctx.moveTo(x,y); while(y<innerHeight){ r=(r*9301+49297)%233280/233280; x+=(r-.5)*60; y+=30+r*30; fctx.lineTo(x,y); } fctx.stroke(); fctx.shadowBlur=0;
        fctx.globalAlpha=a*.18; fctx.fillStyle='#fff'; fctx.fillRect(0,0,innerWidth,innerHeight); continue; }
      p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.k==='e') p.x+=Math.sin((p.ph+=dt*3))*0.6; fctx.globalAlpha=Math.max(0,Math.min(1,p.life)); fctx.fillStyle=p.col;
      if(p.k==='c'){ p.r+=p.vr*dt; fctx.save(); fctx.translate(p.x,p.y); fctx.rotate(p.r); fctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); fctx.restore(); }
      else { fctx.beginPath(); fctx.arc(p.x,p.y,p.s,0,7); fctx.fill(); } }
    fctx.globalAlpha=1; FX=FX.filter(p=>p.life>0); if(FX.length) requestAnimationFrame(run); else { fxRun=false; fctx.clearRect(0,0,innerWidth,innerHeight); } };
    requestAnimationFrame(run); } }

// ===================== START =====================
function init(){ applyLook(); startI18n(); renderHome();
  // Arcade → Settings → Tilecraft opens straight to the game's settings
  if(location.hash==='#game-settings'){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} openSettings(); }
  if(S.seenVer&&S.seenVer!==VERSION) setTimeout(openNews,400); S.seenVer=VERSION; persist(); guard();
  if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyLook);
  addEventListener('pagehide',()=>{ if(G) saveGame(); writeSummary(); });
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(G) saveGame(); writeSummary(); } });
  addEventListener('pageshow',e=>{ refreshShared(); applyLook(); if(e.persisted) renderHome(); });
  try{ store.set('tilecraft.probe','1'); localStorage.removeItem('tilecraft.probe'); }catch(e){} }
init();
</script>
