<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3f2ef" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<title>Mahjong</title>
<!--FONTS-->
<style>
:root{--bg:#f3f2ef;--panel:#fff;--ink:#1c1c1e;--sub:#8a8a90;--accent:#2d3a36;--accentInk:#fff;--line:rgba(0,0,0,.08);--gold:#e8a913;--good:#2f9e6a;--bad:#d9534f;--lf:Inter}
.dark{--bg:#101114;--panel:#1b1c20;--ink:#f2f2f4;--sub:#8d8e96;--accent:#e9eaee;--accentInk:#15161a;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
input[type=text]{width:100%;font:15px Inter,sans-serif;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
textarea{width:100%;font:12px/1.4 'JetBrains Mono',monospace;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:none;-webkit-user-select:text;user-select:text}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;flex:1;padding:16px 16px 36px;max-width:560px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h2{font-size:24px;font-weight:800;letter-spacing:-.03em;flex:1;min-width:0}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 0 16px}
.brand h1{font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1}
.brand p{color:var(--sub);font-size:14px;margin-top:8px;line-height:1.35}
.acts{display:flex;gap:8px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.backbtn{height:36px;padding:0 12px 0 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-bottom:6px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:22px 4px 10px;display:flex;justify-content:space-between;gap:8px}
.label span{letter-spacing:.02em;text-transform:none;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 15px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:10px;transition:transform .12s;min-width:0}
button.card:active{transform:scale(.98)}
.card .t{font-weight:700;font-size:17px;letter-spacing:-.01em;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.row2 .card .t{font-size:15.5px}
.card .s{color:var(--sub);font-size:13px;margin-top:2px;line-height:1.3;overflow-wrap:anywhere}
.card .grow{flex:1;min-width:0}
.card .r{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex:none;max-width:42%}
.card .r b{display:block;font-size:15px}
.card .r span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.card.dim{opacity:.55}
.ico{width:42px;height:42px;border-radius:12px;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.ico svg{width:26px;height:26px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .card{margin:0}
.lvl .badge{width:50px;height:50px;border-radius:15px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.primary{background:var(--accent);color:var(--accentInk);border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;width:100%;transition:transform .12s}
.primary:active{transform:scale(.98)}
.ghost{background:var(--bg);border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;width:100%}
.danger{color:var(--bad)}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns>*{flex:1 1 0;min-width:0}
.seg{display:flex;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;padding:9px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);min-width:0}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.dark .seg button.on{background:#2a2b31}
.opt{margin:12px 0}
.opt>.h{font-size:12px;font-weight:700;color:var(--sub);margin:0 2px 6px;display:flex;justify-content:space-between;gap:8px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;width:100%;font-weight:600;font-size:15px;text-align:left}
.srow .d{font-size:12.5px;color:var(--sub);font-weight:500;margin-top:2px}
.srow>div{min-width:0}
.sw{width:46px;height:28px;border-radius:99px;background:var(--bg);position:relative;transition:background .2s;flex:none;border:1px solid var(--line)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--sub);transition:left .2s,background .2s}
.sw.on{background:var(--accent)}.sw.on::after{left:21px;background:var(--accentInk)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 14px;margin-bottom:10px}
.box .srow+.srow{border-top:1px solid var(--line)}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px;white-space:nowrap}
.stars .o{color:var(--sub);opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;max-width:100%;min-width:0;overflow-wrap:anywhere}
.chip.on{background:var(--accent);color:var(--accentInk);border-color:transparent}
.topseg{background:var(--panel);border:1px solid var(--line);margin:0 0 14px;flex-wrap:nowrap}
.topseg button{font-size:12px;padding:9px 3px;flex:1 1 auto;white-space:nowrap;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis}
.topseg button.on{background:var(--accent);color:var(--accentInk)}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px;text-align:left;position:relative;transition:transform .12s;min-width:0}
.tcard:active{transform:scale(.98)}
.tcard .pv{aspect-ratio:7/4;border-radius:12px;display:grid;place-items:center;overflow:hidden;position:relative}
.tcard .n{font-weight:700;font-size:14px;margin:9px 5px 2px}
.tcard .q{font-size:11.5px;color:var(--sub);margin:0 5px 5px;line-height:1.3;min-height:2.6em}
.tcard.sel{box-shadow:0 0 0 2.5px var(--accent)}
.tcard.locked .pv{filter:grayscale(.9);opacity:.45}
.tcard .pv svg.i{width:38px;height:38px;stroke-width:1.6;color:var(--accent)}
.tcard.playing .pv{opacity:.4}
.lock{position:absolute;top:13px;right:13px;width:28px;height:28px;border-radius:9px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.lock svg.i{width:15px;height:15px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 2px;border-radius:10px;font-weight:700;font-size:13px;color:var(--sub);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--accentInk)}
.lvcard .num{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.lvcard.fin .num{background:var(--accent);color:var(--accentInk)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
.tbl th{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700;border:0}
.tbl td:first-child,.tbl th:first-child{text-align:left;font-weight:600}
.ach{display:flex;gap:12px;align-items:center;padding:10px 2px}
.ach+.ach{border-top:1px solid var(--line)}
.ach .m{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none;font-size:15px;font-weight:800}
.ach.done .m{background:var(--gold);color:#3a2a00}
.ach .n{font-weight:700;font-size:14.5px}.ach .d{color:var(--sub);font-size:12.5px;margin-top:1px}
.ach>div:last-child{min-width:0}
/* sheets */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:0 0 env(safe-area-inset-bottom)}
#ov.on{display:flex}
#sheet{background:var(--panel);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px 20px;max-height:92vh;overflow-y:auto;overflow-x:hidden;animation:up .22s ease-out}
@media (min-height:700px) and (min-width:600px){ #ov{align-items:center} #sheet{border-radius:24px} }
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
#sheet .sub{color:var(--sub);font-size:14px;line-height:1.4;margin-bottom:12px}
.goal{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px;font-weight:600}
.goal .st{font-size:18px;color:var(--sub);opacity:.4;width:22px;text-align:center;flex:none}
.goal.got .st{color:var(--gold);opacity:1}
.goal.new .st{animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--bg);border-radius:12px;padding:9px 6px;text-align:center;min-width:0;overflow-wrap:anywhere}
.kv b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.kv span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.howto p{font-size:14px;line-height:1.5;margin:6px 0}
.howto h3{font-size:15px;margin:14px 0 4px}
#toast{position:fixed;left:50%;top:0;transform:translate(-50%,calc(-100% - env(safe-area-inset-top) - 20px));opacity:0;background:var(--accent);color:var(--accentInk);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:40;transition:transform .35s,opacity .35s;max-width:calc(100vw - 24px);text-align:center;pointer-events:none;margin-top:calc(env(safe-area-inset-top) + 10px)}
#toast.on{transform:translate(-50%,0);opacity:1}
#fxc{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
/* ===== game ===== */
#game{align-items:center}
.gcol{width:100%;max-width:640px;height:100%;display:flex;flex-direction:column;padding:6px 8px 8px;gap:6px}
.gbar{display:flex;align-items:stretch;gap:6px;flex:none}
.gbar .mid{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px 10px;display:flex;flex-direction:column;justify-content:center}
.gbar .mid .tg{font-size:11.5px;font-weight:700;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar .mid .nums{display:flex;gap:12px;align-items:baseline;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.gbar .mid .nums b{font-size:19px;font-weight:800}
.gbar .mid .nums span{font-size:11px;color:var(--sub);font-weight:700}
.gbar .mid .nums .warn{color:var(--bad)}
.gbar .sc{flex:none;min-width:64px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.gbar .sc b{font-size:17px}.gbar .sc span{font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.gbar .sc .cb{color:var(--gold);font-size:11px;font-weight:800;min-height:13px}
.menubtn{width:46px;flex:none;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
#bview{position:relative;overflow:hidden;flex:1;min-height:120px;border-radius:16px;touch-action:none;background:var(--tbl)}
#bview svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#bview .stars-bg{position:absolute;inset:0;pointer-events:none;background:var(--tblx,none)}
.t .in{transition:transform .12s;transform-box:fill-box;transform-origin:center}
.t.sel .in{transform:translate(-3px,-5px)}
.t .glow{display:none}
.t.sel .glow,.t.hint .glow,.t.mt .glow{display:block}
.t.hint .glow{stroke:var(--gold);animation:breathe 1.2s ease-in-out infinite}
.t.mt .glow{stroke:#3fbf7f}
@keyframes breathe{50%{opacity:.35}}
.t.shake .in{animation:shake .28s}
@keyframes shake{20%{transform:translate(-3px,0)}40%{transform:translate(3px,0)}60%{transform:translate(-2px,0)}80%{transform:translate(2px,0)}}
.t.out .in{animation:out var(--outd,.22s) ease-in forwards}
@keyframes out{to{opacity:0;transform:translate(-6px,-14px) scale(.9)}}
.t.flip .in{animation:flip .3s ease-out}
@keyframes flip{0%{transform:scaleX(.1)}100%{transform:none}}
.t.swirl .in{animation:swirl .5s ease-out}
@keyframes swirl{0%{opacity:.2;transform:rotate(8deg) scale(.9)}100%{opacity:1;transform:none}}
.gtools{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gtools.lefty{direction:rtl}.gtools.lefty>*{direction:ltr}
.gtools button{height:50px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sub);min-width:0;gap:1px;position:relative}
.gtools button svg.i{width:20px;height:20px;color:var(--ink)}
.gtools .cnt{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accentInk);font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg);font-style:normal}
.gtools button.dim{opacity:.5}
.gtools span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.banner{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner b{flex:1 1 170px;min-width:0}
.banner button{background:var(--accent);color:var(--accentInk);border-radius:10px;padding:8px 11px;font-weight:700;font-size:13px}
.banner button.g{background:var(--bg);color:var(--ink)}
.finding{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:14px;margin:10px 0}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
.lylist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lylist button{background:var(--bg);border-radius:12px;padding:6px 4px 7px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;border:2px solid transparent}
.lylist button.on{border-color:var(--accent)}
.lylist button.lk{opacity:.45}
.lylist svg{width:100%;height:46px}
.lylist span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:inline-flex;gap:3px}
.mini svg{width:26px;height:35px}
.weekrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0}
.weekrow div{background:var(--bg);border-radius:9px;text-align:center;padding:6px 0;font-size:11px;font-weight:700;color:var(--sub)}
.weekrow div.on{background:var(--gold);color:#3a2a00}
</style>
</head>
<body>
<div id="toast"></div>
<canvas id="fxc"></canvas>

<!-- HOME -->
<section class="screen on" id="home"><div class="scroll">
  <button class="backbtn" id="arcadeBtn" hidden><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Arcade</button>
  <div class="brand"><div><h1 data-raw>Mahjong</h1><p>Match pairs, clear the stack. Every board can be won.</p></div>
    <div class="acts"><button class="iconbtn" id="styleBtn" aria-label="Style"><svg class="i" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 000 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A5.6 5.6 0 0022 9.8C22 5.5 17.5 2 12 2z"/></svg></button>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button></div></div>
  <div id="homeBody"></div>
</div></section>

<section class="screen" id="camp"><div class="scroll" id="campBody"></div></section>
<section class="screen" id="progress"><div class="scroll" id="progBody"></div></section>
<section class="screen" id="style"><div class="scroll"><div class="top"><button class="iconbtn" data-home aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><h2>Style</h2><span class="stars" style="color:var(--sub);font-weight:700" id="sCount"></span></div><div class="seg topseg" id="styleTabs"></div><div id="styleBody"></div></div></section>
<section class="screen" id="set"><div class="scroll" id="setBody"></div></section>

<!-- GAME -->
<section class="screen" id="game"><div class="gcol" id="gcol">
  <div class="gbar"><button class="menubtn" id="bMenu" aria-label="Pause"><svg class="i" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
    <div class="mid"><div class="tg" id="gtag" data-raw></div><div class="nums" id="gnums"></div></div>
    <div class="sc"><span>Score</span><b id="gscore">0</b><i class="cb" id="gcombo"></i></div></div>
  <div class="banner" id="banner" hidden></div>
  <div id="bview"><div class="stars-bg"></div><svg id="bsvg" xmlns="http://www.w3.org/2000/svg"><defs id="bdefs"></defs><g id="cam"><g id="tiles"></g></g></svg></div>

// A random Classic board: generate seeds and grade them with the blind bot (in slices) until one matches the
// difficulty's grade. After 10 tries it takes the closest.
function findBoard(diff,lid,done){ const want=diff, L0=lid?layoutById(lid):null; let tries=0, best=null, trap=GRADE_TRAP[want];
  const job={}; findJob=job;
  const next=()=>{ if(findJob!==job) return; if(tries>=10){ done(best); return; }
    const Ls=layoutsFor(diff), L=L0||Ls[rnd32()%Ls.length], seed='C'+rnd32().toString(36); tries++;
    const g=generate(L,diff,seed,trap); if(!g){ setTimeout(next,0); return; }
    sliced(gradeGen(L,g.faces,seed),r=>{ if(findJob!==job) return; const d=GRADES.indexOf(r.grade)-GRADES.indexOf(want);
      const cand={lid:L.id,seed,trap,grade:r.grade,rate:r.rate,g,d:Math.abs(d)}; if(!best||cand.d<best.d) best=cand;
      if(d===0){ done(cand); return; } trap=Math.max(0,Math.min(1,trap+(d<0?.12:-.12))); next(); },job); };
  next(); }

function openProgress(tab){ progTab=tab||progTab; renderProgress(); show('progress'); }
function renderProgress(){ const l=levelOf(S.xp), R=S.rec;
  let h=`<div class="top">${backBtn}<h2>Progress</h2></div><div class="tabs">${[['levels','Levels'],['ach','Achievements'],['rec','Records']].map(([k,n])=>`<button data-pt="${k}" class="${progTab===k?'on':''}">${n}</button>`).join('')}</div>`;
  if(progTab==='levels'){ h+=`<div class="sub" style="color:var(--sub);font-size:13px;margin:0 4px 10px">Every level-up gives +1 hint. Hints refill to ${HINT_CAP} each day.</div><div class="box">`;
    for(let i=1;i<=MAXL;i++){ const r=i===1?[STARTER]:rewardsAt(i); h+=`<div class="ach${l>=i?' done':''}"><div class="m">${i}</div><div><div class="n">Level ${i}${i>1?` · ${LVXP[i-1]} XP`:''}</div><div class="d">${esc(r.join(' · '))}</div></div></div>`; } h+='</div>'; }
  else if(progTab==='ach'){ let g=''; for(const a of ACH){ if(a.g!==g){ if(g) h+='</div>'; g=a.g; h+=`<div class="label">${g}</div><div class="box">`; }
      const p=achProg(S,a), prog=a.n&&p!=null&&!S.ach[a.id]?` · ${Math.min(p,a.n)}/${a.n}`:'';
      h+=`<div class="ach${S.ach[a.id]?' done':''}"><div class="m">${S.ach[a.id]?'★':'☆'}</div><div><div class="n" data-raw>${esc(a.name)}</div><div class="d">${esc(a.desc)}${prog}${a.reward?` · Unlocks ${esc(a.reward)}`:''}</div></div></div>`; } h+='</div>'; }
  else { h+=`<div class="kv"><div><b>${R.cleared}</b><span>Boards cleared</span></div><div><b>${R.streak.cur}</b><span>Win streak</span></div><div><b>${R.streak.best}</b><span>Best streak</span></div></div>
    <div class="kv"><div><b>${R.bestCombo?'×'+COMBO_MUL[R.bestCombo]:'—'}</b><span>Best combo</span></div><div><b>${R.quads}</b><span>Four of a kind</span></div><div><b>${R.taBest?fmtTime(R.taBest):'—'}</b><span>Most time left</span></div></div>
    <div class="label">Classic wins</div><div class="box" style="padding:8px 12px"><table class="tbl"><tr>${DIFF_IDS.map(d=>`<th>${DIFFS[d].name}</th>`).join('')}</tr><tr>${DIFF_IDS.map(d=>`<td style="text-align:center">${R.wins[d]||0}</td>`).join('')}</tr></table></div>`;
    const bests=Object.keys(R.best); if(bests.length) h+=`<div class="label">Best by layout</div><div class="box" style="padding:8px 12px"><table class="tbl"><tr><th></th><th>Time</th><th>Score</th></tr>${bests.map(k=>{ const [lid,d]=k.split('|'), L=layoutById(lid); return `<tr><td><span data-raw>${esc(L?L.name:lid)}</span> · ${DIFFS[d].name}</td><td>${R.best[k].t?fmtTime(R.best[k].t):'—'}</td><td>${R.best[k].s}</td></tr>`; }).join('')}</table></div>`;
    h+=`<div class="label">Daily</div><div class="kv"><div><b>${S.dcount}</b><span>Cleared</span></div><div><b>${S.dstreak.cur}</b><span>Streak</span></div><div><b>${S.dstreak.best}</b><span>Longest</span></div></div>`; }
  $('#progBody').innerHTML=h; $$('#progBody [data-pt]').forEach(b=>b.onclick=()=>{ progTab=b.dataset.pt; renderProgress(); }); }

function openHowto(){ openSheet(`<div class="howto"><h2>How to play</h2>
  <p>Clear the board by removing matching pairs. Tap a free tile, then a free tile that matches it.</p>
  <h3>Free tiles</h3><p>A tile is free when nothing lies on top of it and its left or its right side is open. Blocked tiles are dimmed (Settings: Highlight free tiles). Tapping a blocked tile gives it a little shake.</p>

  <p>Dots, Bamboo and Characters run 1 to 9:</p>${tileRow([2,11,20,27,31,32,33])}<p>Winds (East, South, West, North) and Dragons (red, green, white). Flowers and Seasons:</p>${tileRow([34,35,36,37,38,39,40,41])}

  <h3>Helpers</h3><p>Hints show a pair that keeps the board winnable. You get ${HINT_CAP} a day, plus 1 for every level-up. The "still winnable?" warning tells you when a pair has left no way to win without a shuffle. A hint, an undo, a shuffle or Show matches makes a game assisted: it can't earn the third star.</p>

async function gz(text,inflate){ const CS=inflate?window.DecompressionStream:window.CompressionStream; if(!CS) return null;
  const s=new Blob([text]).stream().pipeThrough(new CS('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); }
async function backupCode(){ const json=JSON.stringify(S);
  try{ const z=await gz(new TextEncoder().encode(json)); if(z){ let b=''; for(let i=0;i<z.length;i++) b+=String.fromCharCode(z[i]); return 'MAHJONG1Z.'+btoa(b); } }catch(e){}
  return backupPlain(S); }
async function readBackup(text){ const m=/MAHJONG1Z\.([A-Za-z0-9+/=]+)/.exec(String(text||''));
  if(m){ try{ const bin=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0)); const out=await gz(bin,true); const o=JSON.parse(new TextDecoder().decode(out)); return o&&typeof o.xp==='number'?o:null; }catch(e){ return null; } }
  return parseBackup(text); }
async function openBackup(){ if(G) saveGame(); const code=await backupCode();
  openSheet(`<h2>Backup &amp; restore</h2><div class="sub">This code holds your Mahjong progress: XP, stars, records, achievements, settings and games in progress. Keep it somewhere safe.</div>
   <textarea rows="4" readonly id="bkCode">${esc(code)}</textarea><div class="btns"><button class="ghost" id="bkCopy">Copy</button><button class="ghost" id="bkFile">Save to file (${Math.ceil(code.length/1024)} KB)</button></div>
   <div class="label">Restore</div><textarea rows="3" id="bkIn" placeholder="Paste a backup code"></textarea><div class="btns"><button class="ghost" data-close>Close</button><button class="primary" id="bkGo">Restore</button></div>`);
  $('#bkCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(code); toast('Copied'); }catch(e){ $('#bkCode').select(); } S.bk.last=Date.now(); persist(); };
  $('#bkFile').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'})); a.download=`mahjong-backup-${todayStr()}.txt`; a.click(); S.bk.last=Date.now(); persist(); };
  let armed=null; $('#bkGo').onclick=async()=>{ const o=await readBackup($('#bkIn').value); if(!o){ toast('That code isn\'t a Mahjong backup'); return; }
    if(armed!==o.xp){ armed=o.xp; $('#bkGo').textContent=TF('Replace my progress (level {0})',levelOf(o.xp)); return; }
    S=loadSave(JSON.stringify(o),REDUCED); G=null; persist(); refreshShared(); defsSig=''; applyLook(); closeSheet(); goHome(); toast('Progress restored'); }; }

// ===================== GAME =====================
// G: {mode, lid (campaign level), date, st, ref (a winning line to guide the solver), cam:{s,tx,ty}, fit, job…}
let G=null;
function startGame(meta,st){ stopJob(); findJob=null;
  G=Object.assign({st,ref:st.order||null,cam:{s:1,tx:0,ty:0},fit:true,hint:null,warn:false,last:0},meta);
  G.par=st.cfg.par||parTime(layoutOf(st),st.cfg.grade);
  saveGame(); show('game'); applyLook(); closeSheet(); fitBoard(true); render(); updateBar(); afterChange(true);
  if(!G.ref) checkWinnable(); }
function runOf(g){ return {mode:g.mode,lid:g.lid,date:g.date,st:g.st}; }
function resumeRun(run){ startGame({mode:run.mode,lid:run.lid,date:run.date},cloneState(run.st)); }
function saveGame(){ if(!G) return;
  if(G.mode==='daily'){ const d=dailyFor(S,G.date); if(!d.scored) d.run=G.st.over?null:runOf(G); }
  else S.run=G.st.over?null:runOf(G);
  persist(); }
function leaveGame(){ saveGame(); stopJob(); const m=G.mode; G=null; closeSheet(); if(m==='campaign'){ renderCamp(); show('camp'); } else goHome(); }
function gameTag(){ const st=G.st, L=layoutOf(st);
  if(G.mode==='campaign'){ const Lv=levelById(G.lid); return T(CAMPS[Lv.camp].name)+' '+Lv.n+' · '+Lv.name; }
  if(G.mode==='daily'||G.mode==='practice') return T(G.mode==='daily'?'Daily':'Daily practice')+' · '+T(DIFFS[st.cfg.diff].name)+' · '+L.name;
  return T(DIFFS[st.cfg.diff].name)+' · '+L.name+(st.cfg.ta?' · '+T('Time Attack'):'')+(st.cfg.fog?' · '+T('Fog'):''); }
function updateBar(){ if(!G) return; const st=G.st;
  $('#gtag').textContent=gameTag();
  const left=tilesLeft(st), tm=st.ta?`<b class="${st.ta.left<10000?'warn':''}">${fmtTime(st.ta.left)}</b><span data-raw>${T('left')}</span>`:`<b>${fmtTime(st.t)}</b><span data-raw>${G.par?T('par')+' '+fmtTime(G.par*1000):''}</span>`;
  $('#gnums').innerHTML=`${tm}<b>${left}</b><span data-raw>${T('tiles')}</span>`;
  $('#gscore').textContent=st.score; $('#gcombo').textContent=st.combo?'×'+COMBO_MUL[st.combo]:'';
  $('#hintCnt').textContent=S.hints; const sc=$('#shufCnt'); if(st.cfg.shuffles==='inf') sc.hidden=true; else { sc.hidden=false; sc.textContent=Math.max(0,st.cfg.shuffles-st.shuffles); }
  $('#bUndo').disabled=!canUndo(st)||st.over; $('#bShuffle').disabled=!canShuffle(st)||st.over; $('#bHint').disabled=st.over; }

// ---------- board view: fit, zoom and pan ----------
function tileXY(L,i){ const [x,y,z]=L.pos[i]; return [x*HX+z*LX,y*HY+z*LY]; }
function bounds(onlyLeft){ const st=G.st, L=layoutOf(st); let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(let i=0;i<L.n;i++){ if(onlyLeft&&st.gone[i]) continue; const [X,Y]=tileXY(L,i); x0=Math.min(x0,X); y0=Math.min(y0,Y); x1=Math.max(x1,X+TW+SX); y1=Math.max(y1,Y+TH+SY); }
  if(x0>x1) return bounds(false); return {x0:x0-8,y0:y0-8,x1:x1+8,y1:y1+8}; }
function viewSize(){ const r=$('#bview').getBoundingClientRect(); return [r.width,r.height]; }
function fitBoard(first){ if(!G) return; const [W,H]=viewSize(); if(!W||!H) return;
  const b=S.prefs.autozoom&&!first?bounds(true):bounds(false), bw=b.x1-b.x0, bh=b.y1-b.y0;
  let s=Math.min(W/bw,H/bh); s=Math.min(s,96/TW); // never more than 96 px wide when fitted
  G.s0=Math.min(W/(bounds(false).x1-bounds(false).x0),H/(bounds(false).y1-bounds(false).y0));
  G.smax=Math.max(s*1.05,62/TW*(S.prefs.large?1.25:1)); // zoomed: tiles about 62 px wide
  G.fitB=b; G.fit=true;
  if(S.prefs.large&&s*TW<44){ const z=44/TW; setCam(z,W/2-((b.x0+b.x1)/2)*z,8-b.y0*z); G.fit=false; return; }
  setCam(s,(W-bw*s)/2-b.x0*s,(H-bh*s)/2-b.y0*s); }
function setCam(s,tx,ty){ const [W,H]=viewSize(), b=G.fitB||bounds(false), bw=(b.x1-b.x0)*s, bh=(b.y1-b.y0)*s;
  // keep the board in view: centred when it's smaller than the view, otherwise no gap at the edges
  if(bw<=W) tx=(W-bw)/2-b.x0*s; else tx=Math.min(-b.x0*s,Math.max(W-b.x1*s,tx));
  if(bh<=H) ty=(H-bh)/2-b.y0*s; else ty=Math.min(-b.y0*s,Math.max(H-b.y1*s,ty));
  G.cam={s,tx,ty}; $('#cam').setAttribute('transform',`translate(${tx.toFixed(1)} ${ty.toFixed(1)}) scale(${s.toFixed(4)})`); }
function zoomAt(s,px,py){ const c=G.cam; s=Math.max(Math.min(G.s0,c.s),Math.min(G.smax*1.6,s)); const bx=(px-c.tx)/c.s, by=(py-c.ty)/c.s; G.fit=false; setCam(s,px-bx*s,py-by*s); }
function toggleZoom(px,py){ const [W,H]=viewSize(); if(px==null){ px=W/2; py=H/2; }
  if(!G.fit&&G.cam.s>G.s0*1.05){ fitBoard(); return; } zoomAt(Math.max(G.smax,G.cam.s*1.8),px,py); }
addEventListener('resize',()=>{ if(G&&cur==='game'){ if(G.fit) fitBoard(); else setCam(G.cam.s,G.cam.tx,G.cam.ty); } });

// ---------- drawing the tiles ----------
function drawOrder(L){ if(L._ord) return L._ord; return L._ord=[...Array(L.n).keys()].sort((a,b)=>L.pos[a][2]-L.pos[b][2]||L.pos[a][1]-L.pos[b][1]||L.pos[a][0]-L.pos[b][0]); }
function render(){ if(!G) return; const st=G.st, L=layoutOf(st), B=BODIES[look('body')], hl=S.prefs.highlight, dim=BOARDS[look('board')].dim;
  const mt=new Set(G.mt||[]), hint=new Set(G.hint||[]); let h='';
  for(const i of drawOrder(L)){ if(st.gone[i]) continue; const [X,Y]=tileXY(L,i), free=stFree(st,i), up=faceUp(st,i);
    const cls='t'+(st.sel===i?' sel':'')+(hint.has(i)?' hint':'')+(mt.has(i)?' mt':'');
    h+=`<g class="${cls}" data-i="${i}" transform="translate(${X} ${Y})"><g class="in">${L.pos[i][2]?`<rect x="${SX+4}" y="${SY+5}" width="${TW}" height="${TH}" rx="9" fill="rgba(0,0,0,.22)"/>`:''}<rect x="${SX}" y="${SY}" width="${TW}" height="${TH}" rx="8" fill="url(#gSide)"/><rect width="${TW}" height="${TH}" rx="8" fill="url(#gFace)" stroke="${B.edge}" stroke-width=".8"/>`+
      `<use href="#${up?'f'+st.faces[i]:'fback'}" width="${TW}" height="${TH}"/>${hl&&!free&&!st.over?`<rect width="${TW}" height="${TH}" rx="8" fill="${dim}"/>`:''}<rect class="glow" x="-1.5" y="-1.5" width="${TW+3}" height="${TH+3}" rx="9" fill="none" stroke="var(--sel)" stroke-width="4"/></g></g>`; }
  $('#tiles').innerHTML=h; }
const tileEl=i=>$(`#tiles .t[data-i="${i}"]`);
function tileScreen(i){ const L=layoutOf(G.st), [X,Y]=tileXY(L,i), c=G.cam, r=$('#bview').getBoundingClientRect(); return [r.left+c.tx+(X+TW/2)*c.s,r.top+c.ty+(Y+TH/2)*c.s]; }
// the topmost tile under a point on the screen
function hitTile(px,py){ const st=G.st, L=layoutOf(st), c=G.cam, bx=(px-c.tx)/c.s, by=(py-c.ty)/c.s, ord=drawOrder(L);
  for(let k=ord.length-1;k>=0;k--){ const i=ord[k]; if(st.gone[i]) continue; const [X,Y]=tileXY(L,i); if(bx>=X&&bx<=X+TW+SX*.6&&by>=Y&&by<=Y+TH+SY*.6) return i; } return -1; }

// ---------- input: tap, pinch, pan, double-tap the table, wheel, keys ----------
const PT=new Map(); let gest=null, lastTap={t:0,x:0,y:0};
$('#bview').addEventListener('pointerdown',e=>{ if(!G||cur!=='game') return; e.preventDefault(); const r=$('#bview').getBoundingClientRect();
  PT.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top,x0:e.clientX-r.left,y0:e.clientY-r.top});
  if(PT.size===2){ const [a,b]=[...PT.values()]; gest={pinch:true,d0:Math.hypot(a.x-b.x,a.y-b.y),s0:G.cam.s}; return; }
  if(PT.size>1) return; try{ $('#bview').setPointerCapture(e.pointerId); }catch(_){}
  gest={id:e.pointerId,tx0:G.cam.tx,ty0:G.cam.ty}; },{passive:false});
$('#bview').addEventListener('pointermove',e=>{ if(!G||!PT.has(e.pointerId)||!gest) return; const r=$('#bview').getBoundingClientRect(), p=PT.get(e.pointerId); p.x=e.clientX-r.left; p.y=e.clientY-r.top;
  if(gest.pinch){ if(PT.size<2) return; const [a,b]=[...PT.values()], d=Math.hypot(a.x-b.x,a.y-b.y); zoomAt(gest.s0*d/Math.max(20,gest.d0),(a.x+b.x)/2,(a.y+b.y)/2); return; }
  if(gest.pan||Math.hypot(p.x-p.x0,p.y-p.y0)>8){ gest.pan=true; if(!G.fit||G.cam.s>G.s0*1.02){ G.fit=false; setCam(G.cam.s,gest.tx0+(p.x-p.x0),gest.ty0+(p.y-p.y0)); } } });
function endPointer(e){ if(!G||!PT.has(e.pointerId)) return; const p=PT.get(e.pointerId); PT.delete(e.pointerId); const g=gest;
  if(!g) return; if(g.pinch){ if(!PT.size) gest=null; return; } gest=null; if(g.pan||e.type==='pointercancel') return;
  const i=hitTile(p.x,p.y);
  if(i<0){ const now=performance.now(); if(now-lastTap.t<320&&Math.hypot(p.x-lastTap.x,p.y-lastTap.y)<30){ toggleZoom(p.x,p.y); lastTap={t:0,x:0,y:0}; } else lastTap={t:now,x:p.x,y:p.y}; return; }
  onTile(i); }
$('#bview').addEventListener('pointerup',endPointer); $('#bview').addEventListener('pointercancel',endPointer);
$('#bview').addEventListener('wheel',e=>{ if(!G) return; e.preventDefault(); const r=$('#bview').getBoundingClientRect(); zoomAt(G.cam.s*Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top); },{passive:false});
addEventListener('keydown',e=>{ if(!G||cur!=='game'||e.ctrlKey&&e.key!=='z'||e.metaKey) return;
  if(sheetOn){ if(e.key==='Escape') closeSheet(); return; }
  const k=e.key.toLowerCase(); if(k==='escape'||k==='p'){ openPause(); e.preventDefault(); } else if(k==='u'||k==='z'){ doUndo(); } else if(k==='h'){ doHint(); } else if(k==='s'){ doShuffle(); } else if(k==='f'||k==='+'||k==='-'){ toggleZoom(); } });

// ---------- playing ----------
function animate(i,cls,ms){ const el=tileEl(i); if(!el||!P.motion) return; el.classList.remove(cls); void el.getBBox(); el.classList.add(cls); setTimeout(()=>el.classList.remove(cls),ms); }
function onTile(i){ const st=G.st; if(st.over||G.busy) return; if(!G.started){ G.started=true; G.last=performance.now(); }
  const r=tap(st,i,st.t);
  if(r.k==='blocked'){ sfx('blocked'); buzz(15); animate(i,'shake',300); return; }
  if(r.k==='select'||r.k==='switch'){ sfx('select'); G.hint=null; showMatches(); render(); return; }
  if(r.k==='deselect'){ G.mt=null; render(); return; }
  if(r.k==='match') onMatch(r); }
function showMatches(){ G.mt=null; const st=G.st; if(!S.prefs.show||st.cfg.fog||st.sel<0) return; const k=matchKey(st.faces[st.sel]);
  const m=freeList(layoutOf(st),st.gone).filter(j=>j!==st.sel&&matchKey(st.faces[j])===k); if(m.length){ G.mt=m; st.assists.show=1; } }
function onMatch(r){ const st=G.st; G.hint=null; G.mt=null; G.warn=false; sfx('match',r.combo); buzz(10);
  if(r.combo>=4&&!S.ach.combo) {} // checked at the end of the game
  const pts=[tileScreen(r.a),tileScreen(r.b)];
  const done=()=>{ if(!G||G.st!==st) return; render(); if(r.revealed&&r.revealed.length){ r.revealed.forEach(i=>animate(i,'flip',320)); sfx('flip'); }
    if(G.fit&&S.prefs.autozoom) fitBoard(); afterChange(); };
  if(P.motion){ const d=Math.round(220*speed()); document.documentElement.style.setProperty('--outd',d+'ms'); [r.a,r.b].forEach(i=>{ const el=tileEl(i); if(el) el.classList.add('out'); });
    playMatchFx(look('match'),pts); G.busy=true; setTimeout(()=>{ if(G) G.busy=false; done(); },d); }
  else done(); }
// after every change: end of game, stuck banner, the "still winnable?" check
function afterChange(first){ const st=G.st; updateBar(); saveGame(); stopJob();
  if(st.won){ setTimeout(()=>finishGame(),P.motion?300:0); return; }
  if(stuck(st)){ showStuck(); return; } hideBanner();
  if(!first) checkWinnable(); }
function checkWinnable(){ const st=G.st, mv=st.moves, warn=S.prefs.warn&&!st.cfg.fog;
  // runs quietly; it also refreshes the guide line used by hints. A timeout stays quiet.
  runJob(solveGen(layoutOf(st),st.faces,st.gone,{limit:120000,ref:G.ref}),res=>{ if(!G||G.st.moves!==mv) return;
    if(res.win){ G.ref=res.line; return; }
    if(!res.timeout&&warn&&!stuck(st)){ G.warn=true; sfx('alert'); banner(`<b>${T('This position can\'t be won without a shuffle.')}</b>${canUndo(st)?`<button id="wnUndo">${T('Undo')}</button>`:''}<button class="g" id="wnOk">${T('OK')}</button>`);
      if($('#wnUndo')) $('#wnUndo').onclick=doUndo; $('#wnOk').onclick=hideBanner; } }); }
function banner(h){ const b=$('#banner'); b.innerHTML=h; b.hidden=false; if(G&&G.fit) fitBoard(); }
function hideBanner(){ const b=$('#banner'); if(!b.hidden){ b.hidden=true; if(G&&G.fit) fitBoard(); } }
function showStuck(){ const st=G.st; sfx('stuck');
  banner(`<b>${T('No matching pairs left.')}</b>${canUndo(st)?`<button id="skUndo">${T('Undo')}</button>`:''}${canShuffle(st)?`<button id="skShuf">${T('Shuffle')}</button>`:''}<button class="g" id="skEnd">${T('End game')}</button>`);
  if($('#skUndo')) $('#skUndo').onclick=doUndo; if($('#skShuf')) $('#skShuf').onclick=doShuffle; $('#skEnd').onclick=()=>{ st.over=true; st.lost=true; finishGame(); }; }
function doUndo(){ if(!G||G.st.over||G.busy) return; const st=G.st; if(st.cfg.undo===false){ toast('No undo on this level'); return; } const r=undoMove(st); if(!r){ return; }
  sfx('undo'); G.hint=null; G.mt=null; render(); afterChange(); }
function doShuffle(){ if(!G||G.st.over||G.busy) return; const st=G.st; if(!canShuffle(st)){ toast(st.cfg.shuffles===0?'No shuffles on this board':'No shuffles left'); return; }
  if(!shuffleBoard(st,'S'+rnd32())){ toast('The tiles left can\'t be cleared in any order: undo instead'); return; }
  G.ref=st.order; G.hint=null; G.mt=null; sfx('shuffle'); render();
  if(P.motion) $$('#tiles .t').forEach(el=>{ el.classList.add('swirl'); setTimeout(()=>el.classList.remove('swirl'),520); });
  afterChange(); }
function doHint(){ if(!G||G.st.over||G.busy||G.hintBusy) return; const st=G.st; if(S.hints<=0){ toast('No hints left today'); return; }
  G.hintBusy=true; $('#bHint').classList.add('dim'); const mv=st.moves;
  runJob(solveGen(layoutOf(st),st.faces,st.gone,{limit:400000,ref:G.ref}),res=>{ if(!G) return; G.hintBusy=false; $('#bHint').classList.remove('dim'); if(G.st.moves!==mv) return;
    if(res.win){ useHint(S); st.assists.hint++; G.ref=res.line; G.hint=res.line[0]; st.sel=-1; sfx('hint'); render(); updateBar(); saveGame(); }
    else if(!res.timeout) toast(canShuffle(st)?'No winning pair from here: undo or shuffle':'No winning pair from here: undo');
    else toast('Couldn\'t find a sure hint in time. Try again'); }); }
$('#bUndo').onclick=doUndo; $('#bShuffle').onclick=doShuffle; $('#bHint').onclick=doHint; $('#bZoom').onclick=()=>{ if(G) toggleZoom(); }; $('#bMenu').onclick=()=>openPause();

// ---------- sliced work: the solver and grading run ~8 ms per frame so the page never freezes ----------
let JOB=null;
function sliced(gen,done,owner){ const job={gen}; if(!owner) JOB=job; const step=()=>{ if(owner?findJob!==owner:JOB!==job) return; const t=performance.now(); let r;
    do r=gen.next(); while(!r.done&&performance.now()-t<8);
    if(r.done){ if(!owner) JOB=null; done(r.value); } else requestAnimationFrame(step); };
  requestAnimationFrame(step); return job; }
const runJob=(gen,done)=>sliced(gen,done);
function stopJob(){ JOB=null; if(G){ G.hintBusy=false; const b=$('#bHint'); if(b) b.classList.remove('dim'); } }

// ---------- the clock ----------
setInterval(()=>{ if(!G||cur!=='game'||!G.started||G.st.over) { if(G) G.last=performance.now(); return; } const now=performance.now(), dt=Math.min(1000,now-G.last); G.last=now;
  if(sheetOn||document.hidden) return; const st=G.st, before=st.ta?Math.ceil(st.ta.left/1000):0;
  if(tickClock(st,dt)){ updateBar(); sfx('lose'); finishGame(); return; }
  if(st.ta){ const s=Math.ceil(st.ta.left/1000); if(s!==before&&s<=10) sfx('tick'); }
  updateBar(); },200);

// ---------- pause ----------
function openPause(){ if(!G) return; const st=G.st, canRestart=G.mode!=='daily';
  openSheet(`<h2>Paused</h2><div class="sub" data-raw>${esc(gameTag())}</div>
  <div class="kv"><div><b>${fmtTime(st.t)}</b><span>Time</span></div><div><b>${tilesLeft(st)}</b><span>Tiles left</span></div><div><b>${st.score}</b><span>Score</span></div></div>
  <div class="box"><button class="srow" id="pmHow"><div>How to play</div><span>›</span></button><button class="srow" id="pmSet"><div>Settings</div><span>›</span></button>
  ${canRestart?`<button class="srow" id="pmRestart"><div>Restart this board</div><span>›</span></button>`:''}${G.mode==='classic'?`<button class="srow" id="pmNew"><div>New game</div><span>›</span></button>`:''}
  ${G.mode!=='practice'?`<button class="srow" id="pmEnd"><div class="danger">End game</div><span>›</span></button>`:''}</div>
  <div class="btns"><button class="ghost" id="pmQuit">Save and quit</button><button class="primary" data-close>Resume</button></div>`);
  $('#pmHow').onclick=openHowto; $('#pmSet').onclick=()=>{ closeSheet(); saveGame(); openSettingsFromGame(); }; $('#pmQuit').onclick=()=>leaveGame();
  if($('#pmRestart')) $('#pmRestart').onclick=restartBoard;
  if($('#pmNew')) $('#pmNew').onclick=()=>{ saveGame(); closeSheet(); goHome(); openSetup(); };
  if($('#pmEnd')) $('#pmEnd').onclick=()=>{ openSheet(`<h2>End game?</h2><div class="sub">${G.mode==='daily'?'This uses up today\'s scored attempt.':'The board counts as not cleared.'}</div><div class="btns"><button class="ghost" data-close>Cancel</button><button class="primary" id="egGo">End game</button></div>`);
    $('#egGo').onclick=()=>{ closeSheet(); st.over=true; st.lost=true; finishGame(); }; }; }
// Restart: the same board from the start. Assists already used keep the game assisted.
function restartBoard(){ const st=G.st, cfg=st.cfg, L=layoutOf(st); const fresh=newGame(cfg); fresh.assists=Object.assign({},st.assists);
  closeSheet(); startGame({mode:G.mode,lid:G.lid,date:G.date},fresh); }

// ---------- results ----------
function diffOfGame(g){ if(g.mode==='campaign'){ const L=levelById(g.lid); return L.grade==='expert'?'expert':L.diff; } return g.st.cfg.diff; }
function finishGame(){ if(!G||G.finished===G.st) return; const g=G, st=g.st, today=todayStr(); G.finished=st; stopJob(); hideBanner(); st.over=true;
  const stars=winStars(st,g.par), n=starCount(stars), diff=diffOfGame(g); let xp=0, recs=[], up=null, rx=null, dres=null, title=st.won?'Cleared!':st.ta&&st.ta.left<=0?'Time\'s up':'Not cleared';
  if(g.mode==='classic'){ S.run=null; xp=classicXP(st); recs=addRecords(S,st); addClear(S,st); }
  if(g.mode==='campaign'){ S.run=null; const L=levelById(g.lid); rx=campaignResult(S,L,stars); xp=rx.xp; addClear(S,st); }
  if(g.mode==='daily'){ dres=dailyResult(S,g.date,st,today); xp=dres?dres.xp:0; if(dres) addClear(S,st); }
  if(g.mode==='practice'){ S.run=null; }
  if(xp) up=addXP(S,xp);
  const ach=checkAch(S,{mode:g.mode,st,diff,stars,practice:g.mode==='practice'});
  persist();
  const L=g.mode==='campaign'?levelById(g.lid):null, got=L?campOf(S,L.id).s:stars;
  let h=`<div class="sub" style="margin:0" data-raw>${esc(gameTag())}</div><h2>${title}</h2>
   <div class="kv"><div><b>${st.ta?fmtTime(st.ta.left):fmtTime(st.t)}</b><span>${st.ta?'Time left':'Time'}</span></div><div><b>${st.score}</b><span>Score</span></div><div><b>${st.bestCombo?'×'+COMBO_MUL[st.bestCombo]:'—'}</b><span>Best combo</span></div></div>`;
  const texts=L?goalTexts(L):['Clear the board',st.ta?'Finish with 30 s or more left':TF('Under par ({0})',fmtTime(g.par*1000)),'No assists (hints, undos, shuffles)'];
  h+=goalsHtml(texts,L?got:stars,L?rx.fresh:stars.map((s,i)=>s?i:-1).filter(i=>i>=0));
  if(L&&rx.finished) h+=`<div class="sub" style="font-weight:700;color:var(--ink)" data-raw>${esc(TF('{0} campaign complete!',T(CAMPS[L.camp].name)))}</div>`;
  if(g.mode==='practice') h+=`<div class="sub">Practice doesn't score.</div>`;
  if(assisted(st)) h+=`<div class="sub">Assisted: ${[st.assists.hint&&'hints',st.assists.undo&&'undos',st.assists.shuffle&&'shuffles',st.assists.show&&'Show matches'].filter(Boolean).map(x=>T(x)).join(', ')}.</div>`;
  if(recs.length) h+=`<div class="sub" style="font-weight:700;color:var(--ink)" data-raw>${esc(TF('New record: {0}',recs.map(r=>T(r)).join(', ')))}</div>`;
  if(xp) h+=`<div class="sub" style="font-weight:700;color:var(--ink)">+${xp} XP${up&&up.after>up.before?` · Level ${up.after}!${up.rewards.length?' · '+esc(up.rewards.join(' · ')):''} · +${up.hints} hint`:''}</div>`;
  for(const id of ach){ const a=ACH.find(a=>a.id===id); h+=`<div class="sub" style="font-weight:700;color:var(--ink)">🏆 <span data-raw>${esc(a.name)}</span>${a.reward?` · <span>${esc(a.reward)}</span>`:''}</div>`; }
  const nxt=L&&campCleared(S,L.id)&&LEVELS.find(x=>x.camp===L.camp&&x.n===L.n+1)||(L&&L.n===15&&campDone(S,L.camp)&&LEVELS.find(x=>x.camp===L.camp+1&&x.n===1));
  h+=`<div class="btns">${g.mode==='daily'?'<button class="ghost" id="rShare">Share</button>':''}<button class="ghost" id="rHome">Menu</button>
   ${g.mode==='daily'?'<button class="primary" id="rPrac">Practice</button>':nxt?'<button class="ghost" id="rAgain">Retry</button><button class="primary" id="rNext">Next level</button>':g.mode==='campaign'?'<button class="primary" id="rAgain">Retry</button>':g.mode==='practice'?'<button class="primary" id="rAgain">Again</button>':'<button class="primary" id="rAgain">Play again</button>'}</div>`;
  const reveal=()=>{ openSheet(h,()=>{ if(cur==='game'&&G&&G.st.over) leaveGame(); });
    $('#rHome').onclick=()=>{ sheetClose=null; closeSheet(); G=null; goHome(); };
    if($('#rAgain')) $('#rAgain').onclick=()=>{ sheetClose=null; closeSheet(); if(g.mode==='campaign') startLevel(L); else if(g.mode==='practice') startGame({mode:'practice',date:g.date},newGame(dailyBoard(g.date))); else { G=null; goHome(); openSetup(); startClassic(); } };
    if($('#rNext')) $('#rNext').onclick=()=>{ sheetClose=null; closeSheet(); G=null; S.campTab=nxt.camp; renderCamp(); show('camp'); openLevel(nxt); };
    if($('#rPrac')) $('#rPrac').onclick=()=>{ sheetClose=null; closeSheet(); startGame({mode:'practice',date:g.date},newGame(dailyBoard(g.date))); };
    if($('#rShare')) $('#rShare').onclick=()=>{ const d=dailyFor(S,g.date); share(shareLine(g.date,d.won,d.time,d.stars,d.assisted)); };
    if(L) rx.fresh.forEach((i,k)=>setTimeout(()=>sfx('star',i),300+k*180)); };
  if(st.won){ sfx(up&&up.after>up.before?'level':'win'); const wf=look('win'); if(wf!=='none'&&P.motion){ playWinFx(wf); setTimeout(reveal,Math.round(1400*speed())); } else reveal(); }
  else { sfx('lose'); reveal(); }
  if(g.mode==='daily'){ const d=dailyFor(S,g.date); d.run=null; } else S.run=null; persist(); }

// ===================== EFFECTS (full-screen canvas) =====================
const fxc=$('#fxc'), fctx=fxc.getContext('2d'); let FX=[], fxRun=false;
const PAL={petals:['#ffb7c9','#ff8fab','#ffd6e0','#f7a1c4'],sparks:['#ffd36b','#ffb347','#fff3c4','#ff9f43'],ink:['#1a1a1a','#2b2b2b','#b3261e'],fire:['#ff5d5d','#ffd23f','#5fd3ff','#9b7bff','#7dff9e','#ff8fd1'],lantern:['#ff7a3d','#ffb347','#ff5a4f']};
function playMatchFx(kind,pts){ if(!P.motion||kind==='fade'||FX.length>1500) return;
  for(const [x,y] of pts){
    if(kind==='petals') for(let i=0;i<14;i++){ const a=Math.random()*6.28, sp=40+Math.random()*110; FX.push({k:'p',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,g:90,s:3+Math.random()*3,r:Math.random()*6,vr:(Math.random()-.5)*8,col:PAL.petals[i%4],life:.9+Math.random()*.5}); }
    if(kind==='sparks') for(let i=0;i<22;i++){ const a=Math.random()*6.28, sp=120+Math.random()*200; FX.push({k:'s',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:240,s:1.6+Math.random()*1.6,col:PAL.sparks[i%4],life:.5+Math.random()*.4}); }
    if(kind==='inksplash'){ for(let i=0;i<10;i++){ const a=Math.random()*6.28, sp=50+Math.random()*120; FX.push({k:'s',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:0,drag:4,s:2+Math.random()*5,col:PAL.ink[i%3],life:.7+Math.random()*.4}); } FX.push({k:'ring',x,y,r:6,vr:120,col:'#1a1a1a',life:.45}); } }
  runFx(); }
function playWinFx(kind){ if(!P.motion) return; const w=innerWidth, h=innerHeight;
  if(kind==='lanterns') for(let i=0;i<22;i++) FX.push({k:'lan',x:Math.random()*w,y:h+20+Math.random()*h*.4,vx:(Math.random()-.5)*14,vy:-(60+Math.random()*80),g:0,s:9+Math.random()*7,col:PAL.lantern[i%3],life:3.2,ph:Math.random()*6});
  if(kind==='petalstorm') for(let i=0;i<140;i++) FX.push({k:'p',x:-30-Math.random()*w*.5,y:Math.random()*h,vx:140+Math.random()*160,vy:(Math.random()-.4)*60,g:20,s:3+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*8,col:PAL.petals[i%4],life:2.6+Math.random()*.6});
  if(kind==='fireworks') for(let b=0;b<6;b++){ const x=w*(.15+Math.random()*.7), y=h*(.15+Math.random()*.35), col=PAL.fire[b%6]; for(let i=0;i<46;i++){ const a=i/46*6.28, sp=80+Math.random()*120; FX.push({k:'s',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:60,s:1.8,col,life:1.4,delay:b*.28}); } }
  if(kind==='cascade'&&G){ const L=layoutOf(G.st), set=look('face'); for(let i=0;i<28;i++){ FX.push({k:'tile',x:Math.random()*w,y:-60-Math.random()*h*.6,vx:(Math.random()-.5)*40,vy:120+Math.random()*120,g:200,r:Math.random()*6,vr:(Math.random()-.5)*3,s:22,life:2.6,col:BODIES[look('body')].face}); } }
  runFx(); }
function runFx(){ if(fxRun) return; fxRun=true; let last=performance.now();
  const run=now=>{ const dt=Math.min(.05,(now-last)/1000)/speed(); last=now; const dpr=devicePixelRatio||1;
    if(fxc.width!==Math.round(innerWidth*dpr)){ fxc.width=Math.round(innerWidth*dpr); fxc.height=Math.round(innerHeight*dpr); } fctx.setTransform(dpr,0,0,dpr,0,0); fctx.clearRect(0,0,innerWidth,innerHeight);
    for(const p of FX){ if(p.delay>0){ p.delay-=dt; continue; } p.life-=dt;
      if(p.k==='ring'){ p.r+=p.vr*dt; fctx.globalAlpha=Math.max(0,p.life*2); fctx.strokeStyle=p.col; fctx.lineWidth=3; fctx.beginPath(); fctx.arc(p.x,p.y,p.r,0,7); fctx.stroke(); continue; }
      if(p.drag){ p.vx*=1-p.drag*dt; p.vy*=1-p.drag*dt; } p.vy+=(p.g||0)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; fctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.5)); fctx.fillStyle=p.col;
      if(p.k==='p'||p.k==='tile'){ p.r+=p.vr*dt; fctx.save(); fctx.translate(p.x,p.y); fctx.rotate(p.r);
        if(p.k==='p'){ fctx.beginPath(); fctx.ellipse(0,0,p.s,p.s*.55,0,0,7); fctx.fill(); } else { fctx.fillRect(-p.s/2,-p.s*.67,p.s,p.s*1.33); fctx.strokeStyle='rgba(0,0,0,.3)'; fctx.strokeRect(-p.s/2,-p.s*.67,p.s,p.s*1.33); } fctx.restore(); }
      else if(p.k==='lan'){ p.x+=Math.sin((p.ph+=dt*1.5))*.4; fctx.globalAlpha=Math.max(0,Math.min(.95,p.life)); const g=fctx.createRadialGradient(p.x,p.y,1,p.x,p.y,p.s*2.2); g.addColorStop(0,'rgba(255,200,120,.55)'); g.addColorStop(1,'rgba(255,160,80,0)'); fctx.fillStyle=g; fctx.fillRect(p.x-p.s*2.2,p.y-p.s*2.2,p.s*4.4,p.s*4.4);
        fctx.fillStyle=p.col; fctx.beginPath(); fctx.ellipse(p.x,p.y,p.s*.7,p.s,0,0,7); fctx.fill(); fctx.fillStyle='#5a2a10'; fctx.fillRect(p.x-p.s*.4,p.y-p.s-2,p.s*.8,2); fctx.fillRect(p.x-p.s*.4,p.y+p.s,p.s*.8,2); }
      else { fctx.beginPath(); fctx.arc(p.x,p.y,p.s,0,7); fctx.fill(); } }
    fctx.globalAlpha=1; FX=FX.filter(p=>p.life>0); if(FX.length) requestAnimationFrame(run); else { fxRun=false; fctx.clearRect(0,0,innerWidth,innerHeight); } };
  requestAnimationFrame(run); }

// ===================== START =====================
function init(){ applyLook(); startI18n(); renderHome();
  // Arcade → Settings → Mahjong opens straight to the game's settings
  if(location.hash==='#game-settings'){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} openSettings(); }
  if(S.seenVer&&S.seenVer!==VERSION) setTimeout(openNews,400); S.seenVer=VERSION; persist(); guard();
  if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyLook);
  addEventListener('pagehide',()=>{ if(G) saveGame(); writeSummary(); });
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(G) saveGame(); writeSummary(); } });
  addEventListener('pageshow',e=>{ refreshShared(); applyLook(); if(e.persisted) renderHome(); });
  try{ store.set('mahjong.probe','1'); localStorage.removeItem('mahjong.probe'); }catch(e){} }
init();
</script>
