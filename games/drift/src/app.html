<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f2f1ee" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<title>Drift</title>
<!--FONTS-->
<style>
:root{--bg:#f2f1ee;--panel:#fff;--ink:#1c1c1e;--sub:#8a8a90;--accent:#2b2f3a;--accentInk:#fff;--line:rgba(0,0,0,.08);--gold:#e8a913;--bez:#2c3446;--bezHi:#3d4760;--bezInk:#e9ecf2;--btn:#171b24;--btnHi:#262c38;--ab:#3f8cff;--abInk:#fff;--ab2:#e8664a}
.dark{--bg:#101114;--panel:#1b1c20;--ink:#f2f2f4;--sub:#8d8e96;--accent:#e9eaee;--accentInk:#15161a;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
textarea{width:100%;font:12px/1.4 'JetBrains Mono',monospace;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:none;-webkit-user-select:text;user-select:text}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;flex:1;padding:16px 16px 36px;max-width:560px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h2{font-size:24px;font-weight:800;letter-spacing:-.03em;flex:1;min-width:0}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 0 16px}
.brand h1{font-size:42px;font-weight:800;letter-spacing:-.045em;line-height:1}
.brand p{color:var(--sub);font-size:14px;margin-top:8px;line-height:1.35}
.acts{display:flex;gap:8px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.backbtn{height:36px;padding:0 12px 0 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-bottom:6px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:22px 4px 10px;display:flex;justify-content:space-between;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 15px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:10px;transition:transform .12s;min-width:0}
button.card:active{transform:scale(.98)}
.card .t{font-weight:700;font-size:17px;letter-spacing:-.01em}
.card .s{color:var(--sub);font-size:13px;margin-top:2px;line-height:1.3;overflow-wrap:anywhere}
.card .grow{flex:1;min-width:0}
.card .r{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex:none;max-width:42%}
.card .r b{display:block;font-size:15px}
.card .r span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.card.dim{opacity:.55}
.ico{width:42px;height:42px;border-radius:12px;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.ico svg{width:26px;height:26px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row3 .card{flex-direction:column;align-items:flex-start;gap:8px;margin:0;padding:12px}
.row3 .card .t{font-size:14px}
.lvl .badge{width:50px;height:50px;border-radius:15px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.primary{background:var(--accent);color:var(--accentInk);border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;width:100%;transition:transform .12s}
.primary:active{transform:scale(.98)}
.ghost{background:var(--bg);border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;width:100%}
.btns{display:flex;gap:8px;margin-top:14px}
.btns>*{flex:1}
.seg{display:flex;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;padding:9px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);min-width:0}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.dark .seg button.on{background:#2a2b31}
.opt{margin:12px 0}
.opt>.h{font-size:12px;font-weight:700;color:var(--sub);margin:0 2px 6px;display:flex;justify-content:space-between;gap:8px}
.mods .opt{margin:9px 0}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;width:100%;font-weight:600;font-size:15px;text-align:left}
.srow .d{font-size:12.5px;color:var(--sub);font-weight:500;margin-top:2px}
.srow>div{min-width:0}
.sw{width:46px;height:28px;border-radius:99px;background:var(--bg);position:relative;transition:background .2s;flex:none;border:1px solid var(--line)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--sub);transition:left .2s,background .2s}
.sw.on{background:var(--accent)}.sw.on::after{left:21px;background:var(--accentInk)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 14px;margin-bottom:10px}
.box .srow+.srow{border-top:1px solid var(--line)}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px;white-space:nowrap}
.stars .o{color:var(--sub);opacity:.45}
.topseg{background:var(--panel);border:1px solid var(--line);margin:0 0 14px;flex-wrap:nowrap}
.topseg button{font-size:11.5px;padding:9px 2px;flex:1 1 auto;white-space:nowrap;letter-spacing:-.01em}
.topseg button.on{background:var(--accent);color:var(--accentInk)}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px;text-align:left;position:relative;transition:transform .12s}
.tcard:active{transform:scale(.98)}
.tcard canvas{width:100%;aspect-ratio:7/4;border-radius:12px;display:block}
.tcard .n{font-weight:700;font-size:14px;margin:9px 5px 2px}
.tcard .q{font-size:11.5px;color:var(--sub);margin:0 5px 5px;line-height:1.3;min-height:2.6em}
.tcard.sel{box-shadow:0 0 0 2.5px var(--accent)}
.tcard.locked canvas{filter:grayscale(.9);opacity:.45}
.tcard .big{aspect-ratio:7/4;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.tcard .big svg.i{width:38px;height:38px;stroke-width:1.6}
.tcard.locked .big{opacity:.45}
.lock{position:absolute;top:13px;right:13px;width:28px;height:28px;border-radius:9px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.lock svg.i{width:15px;height:15px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 0;border-radius:10px;font-weight:700;font-size:13px;color:var(--sub);min-width:0}
.tabs button.on{background:var(--accent);color:var(--accentInk)}
.lvcard .num{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.lvcard.boss .num{background:var(--accent);color:var(--accentInk)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
.tbl th{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700;border:0}
.tbl td:first-child,.tbl th:first-child{text-align:left;font-weight:600}
.ach{display:flex;gap:12px;align-items:center;padding:10px 2px}
.ach+.ach{border-top:1px solid var(--line)}
.ach .m{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none;font-size:16px}
.ach.done .m{background:var(--gold);color:#3a2a00}
.ach .n{font-weight:700;font-size:14.5px}.ach .d{color:var(--sub);font-size:12.5px;margin-top:1px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:0 0 env(safe-area-inset-bottom)}
#ov.on{display:flex}
#sheet{background:var(--panel);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px 20px;max-height:92vh;overflow-y:auto;overflow-x:hidden;animation:up .22s ease-out}
@media (min-height:700px) and (min-width:600px){ #ov{align-items:center} #sheet{border-radius:24px} }
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
#sheet .sub{color:var(--sub);font-size:14px;line-height:1.4;margin-bottom:12px}
.goal{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px;font-weight:600}
.goal .st{font-size:18px;color:var(--sub);opacity:.4;width:22px;text-align:center;flex:none}
.goal.got .st{color:var(--gold);opacity:1}
.goal.new .st{animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--bg);border-radius:12px;padding:9px 4px;text-align:center;min-width:0}
.kv b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.kv span{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;font-weight:700;overflow-wrap:anywhere}
.howto p{font-size:14px;line-height:1.5;margin:6px 0}
.howto p+p{margin-top:8px}
.howto h3{font-size:15px;margin:14px 0 4px}
#toast{position:fixed;left:50%;top:0;transform:translate(-50%,calc(-100% - env(safe-area-inset-top) - 20px));opacity:0;background:var(--accent);color:var(--accentInk);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:40;transition:transform .35s,opacity .35s;max-width:calc(100vw - 24px);text-align:center;pointer-events:none;margin-top:calc(env(safe-area-inset-top) + 10px)}
#toast.on{transform:translate(-50%,0);opacity:1}
#fxc{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
/* ===== console ===== */
#game{background:var(--bg)}
.console{flex:1;display:flex;flex-direction:column;min-height:0;margin:6px 8px 8px;border-radius:26px 26px 44px 26px;background:linear-gradient(170deg,var(--bezHi),var(--bez) 45%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.18),0 8px 24px rgba(0,0,0,.18);padding:12px 12px 10px;transition:box-shadow .2s}
.console.pulse{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 0 3px var(--ab2),0 0 30px var(--ab2)}
.scrwrap{flex:0 0 57%;min-height:0;display:flex;flex-direction:column;background:#11141a;border-radius:14px 14px 30px 14px;padding:10px 12px 8px;box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.scrhead{display:flex;align-items:center;gap:8px;color:#8d93a0;font-size:9px;font-weight:700;letter-spacing:.14em;margin:0 2px 6px}
.led{width:7px;height:7px;border-radius:50%;background:#3fd37a;box-shadow:0 0 6px #3fd37a}
.scr{flex:1;min-height:0;position:relative;border-radius:6px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.logo{text-align:left;color:var(--bezInk);font-weight:800;font-size:15px;letter-spacing:.32em;margin:10px 6px 0;opacity:.85}
.logo i{font-style:normal;font-weight:500;letter-spacing:.12em;font-size:9px;opacity:.65;margin-left:6px}
#zone{flex:1;min-height:150px;position:relative;touch-action:none;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;align-items:center;padding:4px 4px 0;-webkit-user-select:none;user-select:none}
#zone.lefty .dpad{order:2}#zone.lefty .ab{order:1}
.dpad{justify-self:center;display:grid;grid-template:repeat(3,var(--b)) / repeat(3,var(--b));--b:52px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25));touch-action:none}
#zone.lg .dpad,#zone.lg .ab{--b:62px}
.dpad>*{background:var(--btn);color:#9aa1ad;display:grid;place-items:center;touch-action:none;pointer-events:none}
.dpad svg{width:22px;height:22px;fill:currentColor;stroke:none}
.dpad .u{grid-area:1/2;border-radius:8px 8px 0 0}.dpad .l{grid-area:2/1;border-radius:8px 0 0 8px}.dpad .r{grid-area:2/3;border-radius:0 8px 8px 0}.dpad .d{grid-area:3/2;border-radius:0 0 8px 8px}
.dpad .c{grid-area:2/2}
.dpad .down,.ab button.down,.pills button.down{background:var(--btnHi);transform:translateY(2px)}
.ab{justify-self:center;display:flex;gap:16px;align-items:center;--b:52px}
.ab button{width:calc(var(--b)*1.18);height:calc(var(--b)*1.18);border-radius:50%;background:var(--ab);color:var(--abInk);font-weight:800;font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.28);touch-action:none;display:grid;place-items:center;line-height:1}
.ab button.b{background:var(--ab2)}
.ab button small{display:block;font-size:8px;font-weight:700;letter-spacing:.06em;opacity:.85;margin-top:2px}
.ab button.down{filter:brightness(.85);box-shadow:0 1px 0 rgba(0,0,0,.28);transform:translateY(2px)}
.pills{grid-column:1/3;display:flex;justify-content:center;gap:22px;padding:8px 0 6px}
.pills button{min-width:64px;height:26px;border-radius:99px;background:var(--btn);color:#a8aebb;font-size:9.5px;font-weight:800;letter-spacing:.1em;touch-action:none;padding:0 12px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.pills label{display:block;text-align:center;font-size:9px;letter-spacing:.12em;color:var(--bezInk);opacity:.7;font-weight:700;margin-top:5px}
.stickpad{grid-column:1/3;align-self:stretch;display:none;grid-template-columns:1fr 1fr;gap:8px;margin:6px 4px;min-height:120px}
.stickpad>div{border:1.5px dashed rgba(255,255,255,.25);border-radius:18px;display:grid;place-items:center;text-align:center;color:var(--bezInk);font-size:11.5px;font-weight:600;line-height:1.45;position:relative;overflow:hidden}
.stickpad>div span{opacity:.5;pointer-events:none}
.stickpad .fire.down{background:rgba(63,140,255,.18)}
#knob{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);pointer-events:none;display:none}
#knobBase{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1.5px solid rgba(255,255,255,.18);pointer-events:none;display:none}
#zone.stick .dpad,#zone.stick .ab{display:none}
#zone.stick .stickpad{display:grid}
#zone.donly .ab .a{visibility:hidden}
@media (min-aspect-ratio:5/4){
 .console{display:grid;grid-template-columns:minmax(170px,1fr) minmax(0,3.2fr) minmax(170px,1fr);grid-template-rows:minmax(0,1fr) auto;border-radius:40px;padding:14px 18px;max-width:1300px;margin:8px auto;width:calc(100% - 16px)}
 .scrwrap{grid-column:2;grid-row:1;min-height:0}
 .logo{display:none}
 #zone{display:contents}
 #zone .dpad{grid-column:1;grid-row:1;align-self:center;justify-self:center}
 #zone .ab{grid-column:3;grid-row:1;align-self:center;justify-self:center}
 #zone.lefty .dpad{grid-column:3}#zone.lefty .ab{grid-column:1}
 #zone .pills{grid-column:2;grid-row:2;padding:10px 0 0}
 #zone .stickpad{grid-column:1/4;grid-row:1;display:none}
 #zone.stick .stickpad{display:grid;grid-template-columns:minmax(170px,1fr) minmax(0,3.2fr) minmax(170px,1fr);background:none;margin:0;pointer-events:none}
 #zone.stick .stickpad>div{pointer-events:auto;align-self:center;min-height:220px}
 #zone.stick .stickpad .fire{grid-column:3}
}
.scr .cd{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:800 64px/1 Inter,sans-serif;text-shadow:0 4px 20px rgba(0,0,0,.5);pointer-events:none}
</style>
</head>
<body>
<div id="toast"></div>
<canvas id="fxc"></canvas>

<!-- HOME -->
<section class="screen on" id="home"><div class="scroll">
  <button class="backbtn" id="arcadeBtn" hidden><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Arcade</button>
  <div class="brand"><div><h1 data-raw>Drift</h1><p>Thrust, shoot, clear the field.</p></div>
    <div class="acts"><button class="iconbtn" id="styleBtn" aria-label="Style"><svg class="i" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 000 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A5.6 5.6 0 0022 9.8C22 5.5 17.5 2 12 2z"/></svg></button>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button></div></div>
  <div id="homeBody"></div>
</div></section>

<section class="screen" id="camp"><div class="scroll" id="campBody"></div></section>
<section class="screen" id="records"><div class="scroll" id="recBody"></div></section>
<section class="screen" id="progress"><div class="scroll" id="progBody"></div></section>
<section class="screen" id="style"><div class="scroll"><div class="top"><button class="iconbtn" data-home aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><h2>Style</h2><span class="stars" style="color:var(--sub);font-weight:700" id="sCount"></span></div><div class="seg topseg" id="styleTabs"></div><div id="styleBody"></div></div></section>
<section class="screen" id="set"><div class="scroll" id="setBody"></div></section>

<!-- GAME: a handheld console. The screen shows the game only; the control zone is the only in-game touch area. -->
<section class="screen" id="game">
  <div class="console" id="console">
    <div class="scrwrap"><div class="scrhead" data-raw><span class="led" id="led"></span><span>POWER</span></div>
      <div class="scr" id="scr"><canvas id="cv"></canvas><div class="cd" id="cd"></div></div></div>
    <div class="logo" data-raw>DRIFT<i>HANDHELD</i></div>

    if(s===0) for(const m of SG.chords[bar]) for(const det of [-7,7]) tone({at:t,f:hz(m),det,a:.35,hold:sd*16-.6,d:.6,v:.02,type:'triangle',lp:1400,dest:D});
    for(const [st,m,len] of SG.mel[bar]) if(st===s&&I>.15){ tone({at:t,f:hz(m),d:Math.max(.18,len*sd*1.2),v:.07,dest:D,send:AU.send}); tone({at:t,f:hz(m+12),d:.06,v:.014,type:'triangle',dest:D}); }
    return; }
  // driving tracks (Orbit, Afterburn, Signal, the boss variant)
  if(s%4===0) tone({at:t,f:SG.dark?100:120,f2:42,glide:.1,d:.2,v:.46,dest:D});
  if(I>.35&&(s===4||s===12)) noise({at:t,d:.09,v:.08,ft:'bandpass',f:SG.dark?1600:2100,q:1,dest:D});
  if(I>.55&&s%2===0) noise({at:t,d:.025,v:s%4===2?.05:.022,ft:'highpass',f:8000,dest:D});
  const bs=SG.off?(s%4===2):(s%2===0);
  if(bs) tone({at:t,f:hz(SG.bass[bar]+(s%8===6?12:0)),d:.16,v:SG.dark?.2:.16,type:'sawtooth',lp:(SG.dark?380:500)+(s%4)*110,dest:D});
  if(I>.25){ const ch=SG.chords[bar], m=ch[s%3]+(s>=8?12:0); tone({at:t,f:hz(m+12),d:.07,v:.018+.01*I,type:'square',lp:2200,dest:D}); }
  if(s===0) for(const m of SG.chords[bar]) for(const det of [-5,5]) tone({at:t,f:hz(m),det,a:.4,hold:sd*14,d:.5,v:.016,type:'sawtooth',lp:1100,dest:D});
  for(const [st,m,len] of SG.mel[bar]) if(st===s&&I>.15) tone({at:t,f:hz(m),d:Math.max(.15,len*sd*1.05),v:.05,type:'triangle',lp:3000,dest:D,send:AU.send}); }
const Music={on:false,step:0,next:0,iv:0,intensity:.5,boss:false,
  start(){ const c=audio(); if(!c||this.on) return; this.on=true; this.step=0; this.next=c.currentTime+.08;
    SG=this.boss?BOSS_TRACK:(SONGS[S.look.track]||ORBIT); if(!this.boss&&!owned(S,findCos('track',SG.id))) SG=ORBIT;
    AU.dly.delayTime.setValueAtTime(3*60/SG.bpm/4,c.currentTime);
    const g=AU.mus.gain; g.cancelScheduledValues(c.currentTime); g.setValueAtTime(g.value,c.currentTime); g.linearRampToValueAtTime(MUSVOL,c.currentTime+2);
    clearInterval(this.iv); this.iv=setInterval(()=>this.tick(),30); },
  stop(){ if(!this.on) return; this.on=false; clearInterval(this.iv); const c=AU.ctx, g=AU.mus.gain; g.cancelScheduledValues(c.currentTime); g.setTargetAtTime(0,c.currentTime,.25); },
  restart(){ if(!this.on) return; this.stop(); setTimeout(()=>{ if(P.music) this.start(); },450); },
  setBoss(b){ if(b===this.boss) return; this.boss=b; this.restart(); },
  tick(){ const c=AU.ctx, sd=60/SG.bpm/4; if(c.state!=='running'){ this.next=c.currentTime+.05; return; }
    if(this.next<c.currentTime) this.next=c.currentTime+.02;
    while(this.next<c.currentTime+.2){ musicStep(this.step,this.next,sd); this.next+=sd; this.step=(this.step+1)%128; } } };

// ===================== STYLE =====================
// Sweep's layout: a tab per kind, then a grid of cards. Each card previews the item itself (drawn in it), locked ones
// greyed with a lock badge. Tapping a sound or effect plays it even while locked; tapping an owned item uses it.
const SI={lock:'<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
 note:'<svg class="i" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
 play:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z"/></svg>'};
const COS_DESC={arrow:'A notched chevron',dart:'Slim and quick-looking',wing:'Wide swept wings',orbiter:'A pod inside a ring',raptor:'Forward-swept prongs',prism:'Faceted crystal hull',ghost:'See-through, with a wavy tail',
 stone:'Grey rock with craters',crystal:'Faceted and glassy',ember:'Dark with glowing seams',wire:'Outlines only',ice:'Pale and translucent',molten:'A crust over lava',
 deep:'Navy space, blue highlights',midnight:'Black space, white highlights',sunset:'Plum and amber',retro:'Green phosphor',paper:'Ink on paper',nebula:'Purple clouds',
 plain:'A short fading trail',ion:'A blue ion stream',sparkle:'Twinkling sparks',comet:'A long glowing tail',bolt:'Short bright streaks',orb:'Round glowing shots',laser:'Long thin beams',
 none:'Just the results',fireworks:'Bursts of colour',supernova:'A blinding ring',orbit:'Spacey and driving',afterburn:'Hard and fast',signal:'Linefall\'s driving track',daylight:'Sweep\'s bright original',
 soft:'Gentle and round',chip:'Retro square waves'};
const STABS=[['ship','Ships'],['rock','Rocks'],['theme','Themes'],['trail','Trails'],['bullet','Shots'],['sound','Sounds'],['fx','Effects']];
let styleTab='ship', sndPrevT=0;
const lockText=it=>{ if(it.lvl) return T('Reach level {0}').replace('{0}',it.lvl); const a=ACH.find(a=>a.id===it.req)||EXPEDITIONS.find(x=>x.id===it.req); return T('Unlock: {0}').replace('{0}',a?T(a.desc||a.name):''); };
function openStyle(){ renderStyle(); show('style'); }
function styleItems(){ return styleTab==='sound'?[...COS.track.map(it=>({k:'track',it})),...COS.sound.map(it=>({k:'sound',it}))]:COS[styleTab].map(it=>({k:styleTab,it})); }
function renderStyle(){ const all=COS_KINDS.flatMap(([k])=>COS[k]); $('#sCount').textContent=`${all.filter(it=>owned(S,it)).length}/${all.length}`;
  $('#styleTabs').innerHTML=STABS.map(([k,n])=>`<button data-tab="${k}" class="${k===styleTab?'on':''}">${n}</button>`).join('');
  $$('#styleTabs [data-tab]').forEach(b=>b.onclick=()=>{ styleTab=b.dataset.tab; renderStyle(); });
  const items=styleItems(), visual=styleTab!=='sound';
  $('#styleBody').innerHTML=`<div class="tgrid">${items.map(({k,it},i)=>{ const u=owned(S,it), sel=look(k)===it.id;
    const art=visual?'<canvas></canvas>':`<div class="big">${k==='track'?SI.play:SI.note}</div>`;
    return `<button class="tcard${sel?' sel':''}${u?'':' locked'}" data-i="${i}">${art}${u?'':`<div class="lock">${SI.lock}</div>`}
      <div class="n" data-raw>${esc(it.name)}</div><div class="q">${u?(sel?'In use':esc(COS_DESC[it.id]||'')):esc(lockText(it))}</div></button>`; }).join('')}</div>`;
  if(visual) requestAnimationFrame(drawStyleCards);
  $$('#styleBody .tcard').forEach(el=>el.onclick=()=>{ const {k,it}=items[+el.dataset.i], u=owned(S,it);
    if(k==='sound'&&sndPrevT<performance.now()){ sndPrevT=performance.now()+1100; sfx('fire',0,it.id); setTimeout(()=>sfx('hit',0,it.id),140); setTimeout(()=>sfx('break',3,it.id),320); setTimeout(()=>sfx('pickup',0,it.id),700); }
    if(k==='fx'&&it.id!=='none'){ if(!P.motion) toast('Turn on Animations to see effects'); else playFx(it.id); }
    if(!u){ toast('🔒 '+lockText(it)); return; }
    if(look(k)===it.id){ if(k==='track'&&!P.music) toast('Turn on Music in Settings to hear it'); return; }
    S.look[k]=it.id; persist(); applyLook();
    if(k==='track'){ if(P.music&&Music.on) Music.restart(); else toast('Turn on Music in Settings to hear it'); }
    renderStyle(); }); }
function drawStyleCards(){ if(cur!=='style') return; const items=styleItems();
  $$('#styleBody .tcard').forEach(el=>{ const cv=el.querySelector('canvas'); if(!cv) return; const {k,it}=items[+el.dataset.i]; drawPreview(cv,k,it.id); }); }
// each card draws its item: a ship, a few rocks, a whole scene in a theme, a trail behind a ship, a volley of shots
function drawPreview(cv,k,id){ const r=cv.getBoundingClientRect(), d=Math.min(devicePixelRatio||1,3); if(!r.width) return;
  cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d); const c=cv.getContext('2d'); c.setTransform(d,0,0,d,0,0);
  const o={ship:look('ship'),rock:look('rock'),theme:look('theme'),trail:look('trail'),bullet:look('bullet')}; o[k]=id;
  const th=Object.assign({},THEMES[o.theme]); if(P.cb) Object.assign(th,CB); const w=r.width, h=r.height, s=h/120;
  drawSpace(c,th,w,h,0,0,1);
  if(k==='fx'){ c.strokeStyle=th.accent; c.lineWidth=2; for(let i=0;i<3;i++){ c.globalAlpha=1-i*.3; c.beginPath(); c.arc(w/2,h/2,h*(.15+i*.12),0,7); c.stroke(); } c.globalAlpha=1; if(id==='none'){ c.fillStyle=th.sub; c.font=`700 ${12*s}px Inter`; c.textAlign='center'; c.fillText('—',w/2,h/2+4*s); } return; }
  const rock=(x,y,size,seed,type,hp)=>drawRock(c,th,o.rock,{x,y,r:ROCK_R[size]*s*.55,seed,type:type||'stone',hp:hp||1,maxHp:hp||1,a:seed%256,flash:0,arm:type==='armour',size},s*.55);
  if(k==='rock'){ rock(w*.28,h*.52,3,11); rock(w*.62,h*.38,2,23,'stone'); rock(w*.78,h*.7,1,37); rock(w*.55,h*.75,1,41); return; }
  if(k==='theme'){ rock(w*.22,h*.35,3,5); rock(w*.8,h*.62,2,9,'volatile'); rock(w*.68,h*.25,1,17,'gold'); }
  const sx=k==='trail'?w*.64:k==='bullet'?w*.3:w*.5, sy=h*.55, a=k==='trail'?40:k==='bullet'?64:0;
  if(k==='trail'||k==='theme'){ const pts=[]; for(let i=0;i<16;i++) pts.push({x:sx-dirX(a)*i*5*s,y:sy-dirY(a)*i*5*s+Math.sin(i*.7)*s*1.5,life:1-i/16});
    drawTrail(c,th,o.trail,pts,(x,y)=>[x,y],s); }
  if(k==='bullet'){ for(let i=1;i<=3;i++) drawBullet(c,th,o.bullet,sx+i*28*s,sy,BUL_V,0,s); }
  drawShip(c,th,o.ship,sx,sy,a,k==='ship'?s*1.5:s,{thrust:k==='trail'||k==='theme'?1:0,t:performance.now()}); }

function openHowto(){ openSheet(`<div class="howto"><h2>How to play</h2>
  <p>Rocks drift in from the edges of the field. Shoot them to break them: a Large splits into two Mediums, a Medium into two or three Smalls, and a Small into dust. Clear every incoming rock to win. Don't let a rock, a drone or a drone's shot touch your ship.</p>
  <h3>Controls</h3><p>D-pad steers. With Direct steering (the default) the ship turns to face the direction you hold and thrusts once it's facing it; a quick tap just aims. With Classic steering ◀ ▶ rotate, ▲ thrusts and ▼ brakes. A fires (hold for steady fire), B dashes: a quick burst with a moment of invincibility, then a 3-second cooldown. Select uses your power-up and Start pauses.</p>
  <p>Settings has two other layouts: D-pad only (fire is automatic) and a Thumbstick pad. Keyboard: arrow keys steer, Space fires, Shift or X dashes, C uses a power-up, P or Esc pauses.</p>
  <h3>The field</h3><p>The ship drifts: it keeps moving until drag slows it. Edges are soft walls unless wrap is on, where you fly off one side and come back on the other. A rock that drifts out through a wall comes back later. On bigger fields the camera follows you; the radar shows the whole field and arrows point to rocks heading your way.</p>
  <h3>Scoring</h3><p>Large 60, Medium 40, Small 20, times the difficulty and modifier multipliers. Kills within 1.5 seconds of each other build a combo, +10% each, up to ×2. Gold rocks are worth five times as much. Hunter drones are worth 200. An extra life every 10,000 points, up to 5.</p>
  <h3>Power-ups</h3><p>Broken rocks sometimes drop one. Fly over it to pick it up and press Select to use it. Spread fires three ways, Rapid doubles your fire rate, Pierce shoots through rocks, Shield absorbs one hit and Shockwave destroys Smalls and damages everything nearby.</p>
  <h3>Rocks</h3><p>Armoured rocks need a hit to crack their shell first. Volatile rocks explode and damage what's around them. Ice rocks break into fast shards. Magnetic rocks pull your ship in when you get close.</p>
  <h3>Modes</h3><p>Normal: pick a difficulty and modifiers. Campaign: three campaigns of 15 levels, each ending in a boss, with 3 stars per level. Endless: waves that keep getting harder, with milestones every 5 waves.</p></div>
  <div class="btns"><button class="primary" data-close>Got it</button></div>`); S.howto=true; persist(); }
function openNews(){ openSheet(`<h2>What's new</h2>${CHANGES.map(c=>`<div class="label">v${c.v} · ${c.d}</div><div class="howto">${c.n.map(n=>`<p>${esc(n)}</p>`).join('')}</div>`).join('')}<div class="btns"><button class="primary" data-close>Close</button></div>`); }
async function gz(text,inflate){ const CS=inflate?window.DecompressionStream:window.CompressionStream; if(!CS) return null;
  const s=new Blob([text]).stream().pipeThrough(new CS('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); }
async function backupCode(){ const o=Object.assign({},S); o.run=null; const json=JSON.stringify(o);
  try{ const z=await gz(new TextEncoder().encode(json)); if(z){ let b=''; for(let i=0;i<z.length;i++) b+=String.fromCharCode(z[i]); return 'DRIFT1Z.'+btoa(b); } }catch(e){}
  return backupPlain(S); }
async function readBackup(text){ const m=/DRIFT1Z\.([A-Za-z0-9+/=]+)/.exec(String(text||''));
  if(m){ try{ const bin=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0)); const out=await gz(bin,true); const o=JSON.parse(new TextDecoder().decode(out)); return o&&typeof o.xp==='number'?o:null; }catch(e){ return null; } }
  return parseBackup(text); }
async function openBackup(){ const code=await backupCode();
  openSheet(`<h2>Backup &amp; restore</h2><div class="sub">This code holds your Drift progress: XP, stars, records, achievements and settings. Keep it somewhere safe.</div>
   <textarea rows="4" readonly id="bkCode">${esc(code)}</textarea><div class="btns"><button class="ghost" id="bkCopy">Copy</button><button class="ghost" id="bkFile">Save to file (${Math.ceil(code.length/1024)} KB)</button></div>
   <div class="label">Restore</div><textarea rows="3" id="bkIn" placeholder="Paste a backup code"></textarea><div class="btns"><button class="ghost" data-close>Close</button><button class="primary" id="bkGo">Restore</button></div>`);
  $('#bkCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(code); toast('Copied'); }catch(e){ $('#bkCode').select(); } S.bk.last=Date.now(); persist(); };
  $('#bkFile').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'})); a.download=`drift-backup-${todayStr()}.txt`; a.click(); S.bk.last=Date.now(); persist(); };
  let armed=null; $('#bkGo').onclick=async()=>{ const o=await readBackup($('#bkIn').value); if(!o){ toast('That code isn\'t a Drift backup'); return; }
    if(armed!==o.xp){ armed=o.xp; $('#bkGo').textContent=T('Replace my progress (level {0})').replace('{0}',levelOf(o.xp)); return; }
    S=loadSave(JSON.stringify(o),REDUCED); persist(); refreshShared(); applyLook(); closeSheet(); goHome(); toast('Progress restored'); }; }

// ===================== GAME =====================
let G=null; const PEND=[];
const ctlCfg=()=>({steer:S.ctl.steer,fire:S.ctl.layout==='donly'?'range':S.ctl.autofire});
function cfgFor(mode,o){ if(mode==='normal') return normalCfg(S.setup.diff,S.setup.mods,ctlCfg());
  if(mode==='campaign') return levelCfg(LEVEL_BY[o.lid],ctlCfg());
  return Object.assign(endlessCfg(S.esetup),ctlCfg()); }
function startGame(mode,o){ const st=newGame(cfgFor(mode,o)); st.app={ms:0};
  G={mode,lid:o.lid,st,state:'count',fx:newFx(),cam:null}; enterGame(); }
function resumeRun(run){ const st=run.st; Object.assign(st.cfg,ctlCfg()); st.ev=[]; st.in=Object.assign(st.in,{left:0,right:0,up:0,down:0,fire:0,sx:0,sy:0,firePress:0});
  G={mode:run.mode,lid:run.lid,st,state:'count',fx:newFx(),cam:null}; enterGame(); }
function saveRun(){ if(!G||G.state==='end') return; S.run={mode:G.mode,lid:G.lid,st:snapshot(G.st)}; persist(); }
function enterGame(){ sheetClose=null; closeSheet(); applyLook(); show('game'); resize(); releaseAll(); countdown(); Music.setBoss(!!G.st.cfg.boss); if(P.music) Music.start(); }
function countdown(){ G.state='count'; let n=3; const el=$('#cd'); el.textContent='3'; sfx('tick'); clearInterval(G.cdI);
  G.cdI=setInterval(()=>{ n--; if(n>0){ el.textContent=n; sfx('tick'); } else { clearInterval(G.cdI); el.textContent=''; sfx('go'); G.state='play'; G.last=performance.now(); G.acc=0; } },650); }

// ---------- loop: fixed 60 Hz logic ticks, at most 4 catch-up ticks per frame ----------
const TICK=1000/60;

    while(G.acc>=TICK&&n<4){ const ins=PEND.splice(0); step(G.st,ins); handleEvents(G.st.ev); G.acc-=TICK; n++;
      if(G.st.phase==='over'||G.st.phase==='done'){ G.state='end'; G.endAt=now; thrustSound(false,0); setTimeout(finishGame,G.st.phase==='over'?900:500); break; } }
    if(n===4) G.acc=0; }
  else if(G.state==='count'&&PEND.length){ /* keep held keys: apply the input state without advancing */ applyInputs(G.st,PEND.splice(0)); }
  draw(now); }

// ---------- events → sound, haptics, effects ----------

    case 'break': sfx('break',e.size); debris(e,th); if(e.pts) fx.pops.push({x:e.x,y:e.y,t:'+'+fmtNum(e.pts),life:1,col:e.type==='gold'?'#ffd34d':th.hud});
      if(e.size>=3&&mo) fx.shake=Math.max(fx.shake,e.size===4?1:.35); if(e.last) G.lastKill={x:e.x,y:e.y}; buzz(e.size>=3?12:5); break;
    case 'explode': sfx('explode'); fx.rings.push({x:e.x,y:e.y,r:10,max:e.r,life:1,col:'#ff8a3d'}); sparks(e.x,e.y,18,'#ffb057',5); if(mo) fx.shake=Math.max(fx.shake,.5); break;

const cv=$('#cv'), ctx=cv.getContext('2d'); let LY=null;

// Easy fits the whole field on screen; Normal and Hard show a view about 800 units across the short side and follow the ship
function setScale(){ const st=G.st, w=LY.w, h=LY.h; let s;
  if(st.cfg.diff==='easy'&&st.cfg.mode!=='endless') s=Math.min(w/st.W,h/st.H);
  else s=Math.min(w,h)/VIEW_W*(w<h?1:1.15);

addEventListener('resize',()=>{ if(cur==='game') resize(); if(cur==='style') drawStyleCards(); });
function camStep(st,dt){ const sh=st.ship, lead=S.ctl.lead?28:0; if(!G.cam) G.cam={x:sh.x,y:sh.y};

  const C=G.cam; C.x+=(st.wx?wd(tx-C.x,st.W):tx-C.x)*k; C.y+=(st.wy?wd(ty-C.y,st.H):ty-C.y)*k; if(st.wx) C.x=((C.x%st.W)+st.W)%st.W; if(st.wy) C.y=((C.y%st.H)+st.H)%st.H;

  if(!st.wx){ C.x=LY.vw>=st.W?st.W/2:Math.max(LY.vw/2-40,Math.min(st.W-LY.vw/2+40,C.x)); }

const STARS=[]; for(let i=0;i<140;i++) STARS.push([hrand(7,i),hrand(11,i),hrand(13,i)]);

  if(o&&o.thrust>0){ const fl=(9+6*o.thrust+Math.sin((o.t||0)/30)*3)*k; const g=c.createLinearGradient(0,6*k,0,6*k+fl); g.addColorStop(0,'#fff6c8'); g.addColorStop(.4,'#ffb24a'); g.addColorStop(1,'rgba(255,90,40,0)');

      if(fx.flash>0){ c.fillStyle='rgba(255,240,180,.8)'; c.beginPath(); c.arc(x+dirX(sh.a)*SHIP_R*1.2*s,y+dirY(sh.a)*SHIP_R*1.2*s,3.5*s*fx.flash/4,0,7); c.fill(); }
      if(sh.shield){ c.strokeStyle=`rgba(143,211,255,${.55+.25*Math.sin(now/160)})`; c.lineWidth=2; c.beginPath(); c.arc(x,y,(SHIP_R+9)*s,0,7); c.stroke(); c.fillStyle='rgba(143,211,255,.12)'; c.fill(); }
      if(sh.inv>0&&sh.dash>0){ c.strokeStyle=alpha(th.ship,.5); c.lineWidth=1.5; c.beginPath(); c.arc(x,y,(SHIP_R+4)*s,0,7); c.stroke(); } }); }
  if(fx.flash>0) fx.flash--;
  // particles and rings
  for(const p of fx.parts){ p.x+=p.vx*dt*60; p.y+=p.vy*dt*60; p.vx*=.985; p.vy*=.985; p.life-=dt*p.dec;
    const [x,y]=scr(st,p.x,p.y); c.globalAlpha=Math.max(0,p.life); c.fillStyle=p.col; const z=p.z*s*(p.chunk?1:1);
    if(p.chunk){ p.rot+=dt*4; c.save(); c.translate(x,y); c.rotate(p.rot); c.fillRect(-z/2,-z/3,z,z*.66); c.restore(); } else c.fillRect(x-z/2,y-z/2,z,z); }
  c.globalAlpha=1; fx.parts=fx.parts.filter(p=>p.life>0); if(fx.parts.length>900) fx.parts.splice(0,fx.parts.length-900);
  for(const g of fx.rings){ g.r+=(g.max-g.r)*Math.min(1,dt*7); g.life-=dt*1.8; const [x,y]=scr(st,g.x,g.y); c.strokeStyle=g.col; c.globalAlpha=Math.max(0,g.life); c.lineWidth=3; c.beginPath(); c.arc(x,y,g.r*s,0,7); c.stroke(); }
  c.globalAlpha=1; fx.rings=fx.rings.filter(g=>g.life>0);
  // score popups
  for(const p of fx.pops){ const [x,y]=scr(st,p.x,p.y); c.globalAlpha=Math.min(1,p.life*2); c.font=`800 ${Math.round(12+2*s)}px Inter,sans-serif`; c.textAlign='center'; c.lineWidth=3; c.strokeStyle=th.bg; c.strokeText(p.t,x,y-(1-p.life)*30); c.fillStyle=p.col; c.fillText(p.t,x,y-(1-p.life)*30); p.life-=dt*1.1; }
  c.globalAlpha=1; fx.pops=fx.pops.filter(p=>p.life>0); if(fx.pops.length>14) fx.pops.splice(0,fx.pops.length-14);
  // fog: you see only around the ship
  if(st.cfg.fog&&!sh.dead){ const [sx,sy]=scr(st,sh.x,sh.y), r0=170*s, r1=280*s, g=c.createRadialGradient(sx,sy,r0,sx,sy,r1); g.addColorStop(0,alpha(th.bg,0)); g.addColorStop(1,alpha(th.bg,.97)); c.fillStyle=g; c.fillRect(-20,-20,w+40,h+40); }
  else if(st.cfg.fog){ c.fillStyle=alpha(th.bg,.97); c.fillRect(-20,-20,w+40,h+40); }
  c.restore();
  // ---- screen space: arrows, danger, HUD, radar ----
  edgeArrows(c,st,th,now); danger(c,st,th,now); hud(c,st,th,now,dt);
  // music intensity follows the rocks on screen
  if(G.state==='play'){ const n=st.rocks.length+st.drones.length*2; Music.intensity=Math.min(1,.2+n/18); thrustSound(sh.thrust>0&&!sh.dead,Math.hypot(sh.vx,sh.vy)); } }
// arrows at the screen edge point to off-screen rocks heading toward the ship
function edgeArrows(c,st,th,now){ const sh=st.ship; if(sh.dead) return; const w=LY.w, h=LY.h, s=LY.s, [sx,sy]=scr(st,sh.x,sh.y);
  const arrow=(x,y,col)=>{ const dx=x-w/2, dy=y-h/2, k=Math.min((w/2-14)/Math.abs(dx||1e-6),(h/2-14)/Math.abs(dy||1e-6)); const ax=w/2+dx*k, ay=h/2+dy*k, a=Math.atan2(dy,dx);
    c.save(); c.translate(ax,ay); c.rotate(a); c.fillStyle=col; c.beginPath(); c.moveTo(9,0); c.lineTo(-5,-6); c.lineTo(-5,6); c.closePath(); c.fill(); c.restore(); };
  for(const r of st.rocks){ const [x,y]=scr(st,r.x,r.y), R=r.r*s; if(x>-R&&x<w+R&&y>-R&&y<h+R) continue;
    const px=dxOf(st,r.x,sh.x), py=dyOf(st,r.y,sh.y), d=Math.hypot(px,py); if(d>900) continue; const toward=(px*r.vx+py*r.vy)/(d||1); if(toward<.3&&!r.boss) continue;
    arrow(x,y,r.boss?'#ff9a6b':alpha(th.hud,.75)); }
  for(const p of st.pending){ const [x,y]=scr(st,p.x,p.y); if(x>0&&x<w&&y>0&&y<h) continue; if(Math.floor(now/150)%2) arrow(x,y,th.shot); } }
// the danger pulse: a rock or shot will reach the ship within half a second
function danger(c,st,th,now){ if(!S.danger) return; const sh=st.ship; if(sh.dead||sh.inv>0||sh.prot>0||st.phase!=='play') return; let hit=false;
  const test=(x,y,vx,vy,rad)=>{ const px=dxOf(st,sh.x,x), py=dyOf(st,sh.y,y), rvx=vx-sh.vx, rvy=vy-sh.vy, vv=rvx*rvx+rvy*rvy; const t=vv>1e-6?Math.max(0,-(px*rvx+py*rvy)/vv):0;
    if(t>30) return; const cx=px+rvx*t, cy=py+rvy*t; if(Math.hypot(cx,cy)<rad*.85+SHIP_R*.8) hit=true; };
  for(const r of st.rocks){ test(r.x,r.y,r.vx,r.vy,r.r); if(hit) break; } if(!hit) for(const q of st.dshots){ test(q.x,q.y,q.vx,q.vy,5); if(hit) break; }
  if(!hit) return; const p=.5+.5*Math.sin(now/70), w=LY.w, h=LY.h, g=c.createRadialGradient(w/2,h/2,Math.min(w,h)*.35,w/2,h/2,Math.max(w,h)*.75);
  g.addColorStop(0,'rgba(230,60,60,0)'); g.addColorStop(1,`rgba(230,60,60,${.18+.14*p})`); c.fillStyle=g; c.fillRect(0,0,w,h); }
function hud(c,st,th,now,dt){ const w=LY.w, h=LY.h, fx=G.fx, sh=st.ship, m=8, big=w<380?18:21;
  c.textBaseline='alphabetic'; c.fillStyle=th.hud; c.textAlign='left'; c.font=`700 ${big}px "JetBrains Mono",monospace`;
  const sc=fmtNum(st.score); c.lineWidth=3; c.strokeStyle=alpha(th.bg,.6); c.strokeText(sc,m,m+big-2); c.fillText(sc,m,m+big-2);
  // lives as small ships
  for(let i=0;i<Math.min(5,st.lives);i++) drawShip(c,th,look('ship'),m+8+i*15,m+big+13,0,.5,null);
  // the clock
  c.textAlign='right'; c.font=`700 13px "JetBrains Mono",monospace`; c.fillStyle=th.sub; c.fillText(fmtTime(st.tick/60),w-m,m+13);
  // progress bar (Normal, Campaign) or the wave (Endless)
  const bw=Math.min(150,w*.34), bx=(w-bw)/2, by=m+4;
  c.fillStyle=alpha(th.hud,.15); rr(c,bx,by,bw,6,3); c.fill(); c.fillStyle=th.accent; rr(c,bx,by,Math.max(6,bw*progress(st)),6,3); c.fill();
  c.textAlign='center'; c.font='700 10px Inter,sans-serif'; c.fillStyle=th.sub;
  if(st.cfg.mode==='endless') c.fillText(T('WAVE {0}').replace('{0}',st.wave),w/2,by+18);
  else { const boss=st.rocks.find(r=>r.boss); if(boss){ c.fillText(BOSSES[boss.boss].name.toUpperCase(),w/2,by+18); const hb=Math.min(200,w*.5); c.fillStyle=alpha(th.hud,.15); rr(c,(w-hb)/2,by+23,hb,5,2.5); c.fill(); c.fillStyle='#ff7a4d'; rr(c,(w-hb)/2,by+23,Math.max(4,hb*boss.hp/boss.maxHp),5,2.5); c.fill(); } }
  // combo
  if(st.combo.n>0&&st.combo.t>0){ const cm=Math.min(2,1+.1*st.combo.n); c.textAlign='right'; c.font=`800 ${14}px Inter,sans-serif`; c.fillStyle=cm>=2?'#ffd34d':th.hud; c.globalAlpha=Math.min(1,st.combo.t/30); c.fillText(`×${cm.toFixed(1)}`,w-m,m+32); c.globalAlpha=1; }
  // power-up slot (bottom left): the held item, plus the active one's timer
  const z=17, px=m+z, py=h-m-z; c.fillStyle=alpha(th.bg,.55); rr(c,px-z,py-z,z*2,z*2,9); c.fill(); c.strokeStyle=fx.slotFlash>0?'#fff':alpha(th.pup,st.power.held?.9:.3); c.lineWidth=2; rr(c,px-z,py-z,z*2,z*2,9); c.stroke(); fx.slotFlash=Math.max(0,fx.slotFlash-dt*2);
  if(st.power.held) pupIcon(c,st.power.held,px,py,z*.55,th.pup);
  if(st.power.active){ const ax=px+z*2+8; c.strokeStyle=alpha(th.pup,.3); c.lineWidth=3; c.beginPath(); c.arc(ax+6,py,11,0,7); c.stroke(); c.strokeStyle=th.pup; c.beginPath(); c.arc(ax+6,py,11,-Math.PI/2,-Math.PI/2+Math.PI*2*st.power.t/PUP_T); c.stroke(); pupIcon(c,st.power.active,ax+6,py,6,th.pup); }
  // radar (bottom right) with the dash cooldown ring beside it
  const rad=radar(c,st,th,now);
  const dx=w-m-rad.w-22, dy=h-m-14; c.strokeStyle=alpha(th.hud,.2); c.lineWidth=3; c.beginPath(); c.arc(dx,dy,10,0,7); c.stroke();
  const rdy=sh.dashCd===0; c.strokeStyle=rdy?th.accent:alpha(th.hud,.6); c.beginPath(); c.arc(dx,dy,10,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-sh.dashCd/DASH_CD)); c.stroke();
  c.fillStyle=rdy?th.hud:th.sub; c.font='800 9px Inter,sans-serif'; c.textAlign='center'; c.fillText('B',dx,dy+3);
  // banners
  if(fx.banner){ const b=fx.banner; c.globalAlpha=Math.min(1,b.life*2); c.font=`800 ${w<380?17:20}px Inter,sans-serif`; c.textAlign='center'; c.lineWidth=4; c.strokeStyle=alpha(th.bg,.7); c.strokeText(b.t,w/2,h*.36); c.fillStyle=th.hud; c.fillText(b.t,w/2,h*.36); c.globalAlpha=1; b.life-=dt; if(b.life<=0) fx.banner=null; }
  if(st.phase==='break'){ c.font='700 12px Inter,sans-serif'; c.fillStyle=th.sub; c.textAlign='center'; c.fillText(T('Next wave in {0}').replace('{0}',Math.ceil((180-st.pt)/60)),w/2,h*.36+22); }
  if(sh.dead&&st.lives>0&&st.phase==='play'){ c.font='700 12px Inter,sans-serif'; c.fillStyle=th.sub; c.textAlign='center'; c.fillText(T('{0} lives left').replace('{0}',st.lives),w/2,h*.5); } }
function radar(c,st,th,now){ const w=LY.w, h=LY.h, m=8, sz={small:58,normal:76,large:96}[S.ctl.radar]||76;
  const hide=st.cfg.diff==='easy'&&st.cfg.mode!=='endless'&&LY.vw>=st.W*.98&&LY.vh>=st.H*.98;
  if(hide) return {w:0};
  const ar=st.W/st.H, rh=sz, rw=Math.round(sz*ar), x0=w-m-rw, y0=h-m-rh, k=rw/st.W;
  c.fillStyle=alpha(th.bg,.62); rr(c,x0,y0,rw,rh,8); c.fill(); c.strokeStyle=alpha(th.hud,.25); c.lineWidth=1; rr(c,x0,y0,rw,rh,8); c.stroke();
  // the camera's view
  const C=G.cam; c.strokeStyle=alpha(th.hud,.35); c.strokeRect(x0+(C.x-LY.vw/2)*k,y0+(C.y-LY.vh/2)*k,LY.vw*k,LY.vh*k);
  c.save(); rr(c,x0,y0,rw,rh,8); c.clip();
  for(const r of st.rocks){ const z=Math.max(1.5,r.r*k*1.1); c.fillStyle=r.boss?'#ff9a6b':r.type==='gold'?'#ffd34d':alpha(th.hud,.8); c.beginPath(); c.arc(x0+r.x*k,y0+r.y*k,z,0,7); c.fill(); }
  for(const p of st.pups){ c.fillStyle=th.pup; c.fillRect(x0+p.x*k-2,y0+p.y*k-2,4,4); }
  for(const d of st.drones){ c.fillStyle=th.drone; c.beginPath(); c.moveTo(x0+d.x*k,y0+d.y*k-3); c.lineTo(x0+d.x*k+3,y0+d.y*k+2); c.lineTo(x0+d.x*k-3,y0+d.y*k+2); c.fill(); }
  if(Math.floor(now/150)%2) for(const p of st.pending){ c.fillStyle=th.shot; c.fillRect(x0+Math.max(0,Math.min(st.W,p.x))*k-2,y0+Math.max(0,Math.min(st.H,p.y))*k-2,4,4); }
  const sh=st.ship; if(!sh.dead){ c.fillStyle=th.ship; c.beginPath(); c.arc(x0+sh.x*k,y0+sh.y*k,2.6,0,7); c.fill(); }
  c.restore(); return {w:rw}; }

// ===================== RESULTS =====================
function finishGame(){ if(!G) return; const g=G, st=g.st, res=st.result, today=todayStr(); let xp=0, title='', newBest=false, info={};
  addStats(S,res); S.run=null;
  if(g.mode==='normal'){ info=normalResult(S,st.cfg,res,today); xp=info.xp; newBest=info.newBest; title=res.ok?(info.newBest?'New best!':'Field cleared'):'Game over'; }
  if(g.mode==='campaign'){ const L=LEVEL_BY[g.lid]; info=campaignResult(S,L,res); xp=info.xp; title=res.ok?(L.boss?T('{0} defeated').replace('{0}',BOSSES[L.boss].name):'Level cleared'):'Not this time'; newBest=info.fresh.length>0; }
  if(g.mode==='endless'){ info=endlessResult(S,st); xp=info.xp; title=info.newWave?'New best wave!':'Run over'; newBest=info.newWave||info.newScore; }
  const up=xp?addXP(S,xp):null; const ach=checkAch(S,{mode:g.mode,cfg:st.cfg,res,st});
  persist(); G=null; Music.setBoss(false); showResults(g,st,res,{xp,up,ach,info,title,newBest}); }
function showResults(g,st,res,o){ const secs=res.ticks/60, L=g.mode==='campaign'?LEVEL_BY[g.lid]:null;
  let h=`<div class="sub" style="margin:0">${L?`${T(CAMPAIGNS[L.ci].name)} ${L.n} · <span data-raw>${esc(L.name)}</span>`:g.mode==='endless'?'Endless':esc(setupLabel(st.cfg.diff,st.cfg.mods))}</div><h2>${esc(T(o.title))}</h2>
   <div class="big">${fmtNum(res.score)}</div>`;
  if(g.mode==='endless') h+=`<div class="kv"><div><b>${res.wave}</b><span>Wave</span></div><div><b>${fmtTime(secs)}</b><span>Time</span></div><div><b>${Math.round(res.acc*100)}%</b><span>Accuracy</span></div><div><b>×${Math.min(2,1+.1*res.comboMax).toFixed(1)}</b><span>Best combo</span></div></div>`;
  else h+=`<div class="kv"><div><b>${fmtTime(secs)}</b><span>Time</span></div><div><b>${res.livesLost}</b><span>Lives lost</span></div><div><b>${Math.round(res.acc*100)}%</b><span>Accuracy</span></div><div><b>×${Math.min(2,1+.1*res.comboMax).toFixed(1)}</b><span>Best combo</span></div></div>`;
  if(L){ const c=campOf(S,L.id); h+=[0,1,2].map(i=>`<div class="goal${c.s[i]?' got':''}${o.info.fresh.includes(i)?' new':''}"><span class="st">★</span><span>${esc(starText(L,i))}</span></div>`).join(''); }
  if(g.mode==='normal'){ const par=normalPar(st.cfg.diff,st.cfg.mods.density), sv=o.info.stars; h+=[['Clear the field'],['No lives lost'],[T('Clear in {0}').replace('{0}',fmtTime(par))]].map(([t],i)=>`<div class="goal${sv[i]?' got':''}${o.info.fresh.includes(i)?' new':''}"><span class="st">★</span><span>${esc(t)}</span></div>`).join(''); }
  if(g.mode==='endless'){ const E=S.endless; h+=`<div class="sub">${T('Best wave: {0} · best score: {1}').replace('{0}',E.bestWave).replace('{1}',fmtNum(E.bestScore))}${st.app&&st.app.ms?' · '+T('Milestones: +{0} XP').replace('{0}',st.app.ms):''}</div>`;
    for(const x of o.info.exps) h+=`<div class="sub" style="font-weight:700;color:var(--ink)">🧭 ${esc(x.name)} · +${x.xp} XP${x.reward?' · '+esc(x.reward):''}</div>`; }
  if(o.xp) h+=`<div class="sub" style="font-weight:700;color:var(--ink)">+${o.xp} XP${o.up&&o.up.after>o.up.before?` · ${T('Level {0}!').replace('{0}',o.up.after)}${o.up.rewards.length?' · '+esc(o.up.rewards.join(' · ')):''}`:''}</div>`;
  for(const id of o.ach){ const a=ACH.find(a=>a.id===id); h+=`<div class="sub" style="font-weight:700;color:var(--ink)">🏆 <span data-raw>${esc(a.name)}</span>${a.reward?` · ${esc(a.reward)}`:''}</div>`; }
  const nextL=L&&LEVELS[LEVELS.indexOf(L)+1], canNext=nextL&&unlocked(S,nextL.id)&&res.ok;
  h+=`<div class="btns"><button class="ghost" id="rHome">Menu</button>${canNext?'<button class="ghost" id="rAgain">Retry</button><button class="primary" id="rNext">Next level</button>':'<button class="primary" id="rAgain">Play again</button>'}</div>`;
  openSheet(h,()=>{ if(cur==='game') goHome(); });
  if(o.up&&o.up.after>o.up.before){ sfx('life'); playFx(look('fx')==='none'?'fireworks':look('fx')); } else if(res.ok&&o.newBest) playFx(look('fx'));
  if(L) o.info.fresh.forEach((i,k)=>setTimeout(()=>sfx('star',i),300+k*180));
  $('#rHome').onclick=()=>goHome();
  $('#rAgain').onclick=()=>{ sheetClose=null; closeSheet(); startGame(g.mode,{lid:g.lid}); };
  if($('#rNext')) $('#rNext').onclick=()=>{ sheetClose=null; closeSheet(); campCi=nextL.ci; renderCamp(); show('camp'); openLevel(nextL); }; }

// ===================== WIN EFFECTS (full-screen layer) =====================
const fxc=$('#fxc'), fctx=fxc.getContext('2d'); let FX=[], fxRun=false;
function playFx(kind){ if(!P.motion||!kind||kind==='none') return; const w=innerWidth, h=innerHeight, th=TH(), pal=[th.accent,th.ship,th.bullet,th.pup,th.drone,'#ffffff'];
  if(FX.length>1200) return;
  if(kind==='fireworks') for(let b=0;b<5;b++){ const cx=w*(.2+.6*Math.random()), cy=h*(.15+.35*Math.random()), col=pal[b%pal.length], t0=b*.35; for(let i=0;i<46;i++){ const a=i/46*Math.PI*2, sp=90+Math.random()*120; FX.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,col,life:1.6,delay:t0,k:'f'}); } }
  if(kind==='supernova') FX.push({k:'n',x:w/2,y:h*.42,life:1.8,t:0,col:th.accent});
  if(!fxRun){ fxRun=true; let last=performance.now(); const run=now=>{ const dt=Math.min(.05,(now-last)/1000); last=now; const dpr=devicePixelRatio||1;
    if(fxc.width!==innerWidth*dpr){ fxc.width=innerWidth*dpr; fxc.height=innerHeight*dpr; } fctx.setTransform(dpr,0,0,dpr,0,0); fctx.clearRect(0,0,innerWidth,innerHeight);
    for(const p of FX){ if(p.delay>0){ p.delay-=dt; continue; } p.life-=dt;
      if(p.k==='n'){ p.t+=dt; const R=p.t*Math.max(innerWidth,innerHeight)*.9; fctx.globalAlpha=Math.max(0,Math.min(1,p.life)); fctx.strokeStyle=p.col; fctx.lineWidth=14*(1-p.t/1.8)+2; fctx.beginPath(); fctx.arc(p.x,p.y,R,0,7); fctx.stroke();
        fctx.globalAlpha=Math.max(0,.6-p.t); fctx.fillStyle='#fff'; fctx.fillRect(0,0,innerWidth,innerHeight); continue; }
      p.vy+=60*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; fctx.globalAlpha=Math.max(0,Math.min(1,p.life)); fctx.fillStyle=p.col; fctx.fillRect(p.x-1.5,p.y-1.5,3,3); }
    fctx.globalAlpha=1; FX=FX.filter(p=>p.life>0); if(FX.length) requestAnimationFrame(run); else { fxRun=false; fctx.clearRect(0,0,innerWidth,innerHeight); } };
    requestAnimationFrame(run); } }

// ===================== START =====================
function init(){ applyLook(); startI18n(); renderHome();
  // Arcade → Settings → Drift opens straight to the game's settings
  if(location.hash==='#game-settings'){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} openSettings(); }
  else if(location.hash){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
  if(S.seenVer&&S.seenVer!==VERSION) setTimeout(openNews,400); S.seenVer=VERSION; persist(); guard();
  if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyLook);
  try{ store.set('drift.probe','1'); localStorage.removeItem('drift.probe'); }catch(e){} }
init();
