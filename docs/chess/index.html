<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3f2ef" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<title>Chess</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="../fonts.css">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arcade">
<script src="../avatars.js"></script>

<script>window.__ARCADE__=1</script>
<style>
:root{--bg:#f3f2ef;--panel:#fff;--ink:#1c1c1e;--sub:#8a8a90;--accent:#2f5fb3;--accentInk:#fff;--line:rgba(0,0,0,.08);--gold:#e8a913;--good:#2f9e6a;--bad:#d9534f}
.dark{--bg:#101114;--panel:#1b1c20;--ink:#f2f2f4;--sub:#8d8e96;--accent:#e9eaee;--accentInk:#15161a;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
textarea{width:100%;font:12px/1.4 'JetBrains Mono',monospace;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:none;-webkit-user-select:text;user-select:text}
input[type=text]{width:100%;font:15px Inter,sans-serif;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;flex:1;padding:16px 16px 36px;max-width:560px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h2{font-size:24px;font-weight:800;letter-spacing:-.03em;flex:1;min-width:0}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 0 16px}
.brand h1{font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1}
.brand p{color:var(--sub);font-size:14px;margin-top:8px;line-height:1.35}
.acts{display:flex;gap:8px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.backbtn{height:36px;padding:0 12px 0 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-bottom:6px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:22px 4px 10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.label span{letter-spacing:.02em;text-transform:none;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 15px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:10px;transition:transform .12s;min-width:0}
button.card:active{transform:scale(.98)}
.card .t{font-weight:700;font-size:17px;letter-spacing:-.01em;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.row2 .card .t{font-size:15.5px}
.card .s{color:var(--sub);font-size:13px;margin-top:2px;line-height:1.3;overflow-wrap:anywhere}
.card .grow{flex:1;min-width:0}
.card .r{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex:none;max-width:42%}
.card .r b{display:block;font-size:15px}
.card .r span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.card.dim{opacity:.55}
.ico{width:42px;height:42px;border-radius:12px;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.ico svg{width:26px;height:26px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .card{margin:0;padding:12px;gap:10px}
.row2 .ico{width:36px;height:36px}.row2 .card .s{overflow-wrap:normal}
.lvl .badge{width:50px;height:50px;border-radius:15px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.primary{background:var(--accent);color:var(--accentInk);border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;width:100%;transition:transform .12s}
.primary:active{transform:scale(.98)}
.ghost{background:var(--bg);border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;width:100%}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns>*{flex:1 1 0;min-width:0}
.seg{display:flex;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;padding:9px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);min-width:0}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.dark .seg button.on{background:#2a2b31}
.opt{margin:12px 0}
.opt>.h{font-size:12px;font-weight:700;color:var(--sub);margin:0 2px 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;width:100%;font-weight:600;font-size:15px;text-align:left}
.srow .d{font-size:12.5px;color:var(--sub);font-weight:500;margin-top:2px}
.srow>div{min-width:0}
.sw{width:46px;height:28px;border-radius:99px;background:var(--bg);position:relative;transition:background .2s;flex:none;border:1px solid var(--line)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--sub);transition:left .2s,background .2s}
.sw.on{background:var(--accent)}.sw.on::after{left:21px;background:var(--accentInk)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 14px;margin-bottom:10px}
.box .srow+.srow{border-top:1px solid var(--line)}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px;white-space:nowrap}
.stars .o{color:var(--sub);opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;max-width:100%;min-width:0;overflow-wrap:anywhere}
.chip.on{background:var(--accent);color:var(--accentInk);border-color:transparent}
.topseg{background:var(--panel);border:1px solid var(--line);margin:0 0 14px}
.topseg button{font-size:12px;padding:9px 3px;white-space:nowrap;letter-spacing:-.01em}
.topseg button.on{background:var(--accent);color:var(--accentInk)}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px;text-align:left;position:relative;transition:transform .12s;min-width:0}
.tcard:active{transform:scale(.98)}
.tcard .pv{aspect-ratio:7/4;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:4px;overflow:hidden;position:relative}
.tcard .n{font-weight:700;font-size:14px;margin:9px 5px 2px;overflow-wrap:anywhere}
.tcard .q{font-size:11.5px;color:var(--sub);margin:0 5px 5px;line-height:1.3;min-height:2.6em;overflow-wrap:anywhere}
.tcard.sel{box-shadow:0 0 0 2.5px var(--accent)}
.tcard.locked .pv{filter:grayscale(.9);opacity:.45}
.tcard .pv svg.i{width:38px;height:38px;stroke-width:1.6;color:var(--accent)}
.tcard.playing .pv{opacity:.4}
.lock{position:absolute;top:13px;right:13px;width:28px;height:28px;border-radius:9px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.lock svg.i{width:15px;height:15px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 2px;border-radius:10px;font-weight:700;font-size:13px;color:var(--sub);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--accentInk)}
.lvcard .num{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.lvcard.fin .num{background:var(--accent);color:var(--accentInk)}
.lvpath .lvcard:nth-child(4n+2),.lvpath .lvcard:nth-child(4n+3){margin-left:18px;width:calc(100% - 18px)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
.tbl th{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700;border:0}
.tbl td:first-child,.tbl th:first-child{text-align:left;font-weight:600}
.ach{display:flex;gap:12px;align-items:center;padding:10px 2px}
.ach+.ach{border-top:1px solid var(--line)}
.ach .m{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none;font-size:15px;font-weight:800}
.ach.done .m{background:var(--gold);color:#3a2a00}
.ach .n{font-weight:700;font-size:14.5px}.ach .d{color:var(--sub);font-size:12.5px;margin-top:1px;overflow-wrap:anywhere}
.ach>div:last-child{min-width:0}
.week{display:flex;gap:6px;justify-content:space-between;margin:6px 0}
.week div{flex:1;min-width:0;text-align:center;font-size:11px;font-weight:700;color:var(--sub);background:var(--bg);border-radius:10px;padding:7px 0}
.week div.on{background:var(--gold);color:#3a2a00}
.avpick{display:flex;flex-wrap:wrap;gap:6px}.avpick button{border:2px solid transparent;border-radius:12px;padding:2px;line-height:0}.avpick button.on{border-color:var(--accent)}
.av{flex:none}
/* sheets */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:2000;padding:0 0 env(safe-area-inset-bottom)}
#ov.on{display:flex}
#sheet{background:var(--panel);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px 20px;max-height:92vh;overflow-y:auto;overflow-x:hidden;animation:up .22s ease-out}
@media (min-height:700px) and (min-width:600px){ #ov{align-items:center} #sheet{border-radius:24px} }
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;overflow-wrap:anywhere}
#sheet .sub{color:var(--sub);font-size:14px;line-height:1.4;margin-bottom:12px}
.goal{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px;font-weight:600}
.goal .st{font-size:18px;color:var(--sub);opacity:.4;width:22px;text-align:center;flex:none}
.goal.got .st{color:var(--gold);opacity:1}
.goal.new .st{animation:pop .5s}
.goal.wait .st{opacity:.7;color:var(--sub);animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.25}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--bg);border-radius:12px;padding:9px 6px;text-align:center;min-width:0;overflow-wrap:anywhere}
.kv b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.kv span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.howto p{font-size:14px;line-height:1.5;margin:6px 0}
.howto h3{font-size:15px;margin:14px 0 4px}
.howto .dia{display:flex;justify-content:center;margin:8px 0 4px}
.prom{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.prom button{aspect-ratio:1;border-radius:14px;background:var(--bg);display:grid;place-items:center}
.prom button svg{width:80%;height:80%}
#toast{position:fixed;left:50%;top:0;transform:translate(-50%,calc(-100% - env(safe-area-inset-top) - 20px));opacity:0;background:var(--accent);color:var(--accentInk);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:3000;transition:transform .35s,opacity .35s;max-width:calc(100vw - 24px);text-align:center;pointer-events:none;margin-top:calc(env(safe-area-inset-top) + 10px)}
#toast.on{transform:translate(-50%,0);opacity:1}
#fxc{position:fixed;inset:0;pointer-events:none;z-index:1500;width:100%;height:100%}
#pdefs{position:absolute;width:0;height:0;overflow:hidden}

/* ===== the game screen ===== */
#game{background:var(--gbg);color:var(--gInk)}
.gcol{width:100%;height:100%;display:flex;flex-direction:column;padding:6px 0 8px;gap:6px;margin:0 auto}
.gtop,.pbar,#side{padding-left:8px;padding-right:8px}
.gtop{display:flex;gap:6px;align-items:center;flex:none;max-width:640px;width:100%;margin:0 auto}
.gtag{flex:1;min-width:0;font-size:12px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
.gbtn{width:44px;height:40px;flex:none;border-radius:12px;background:var(--chip);display:grid;place-items:center;color:var(--gInk)}
#main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
#main.land{flex-direction:row;justify-content:center;align-items:stretch}
#bcol{display:flex;flex-direction:column;gap:5px;flex:none;align-items:stretch}
.pbar{display:flex;align-items:center;gap:8px;min-height:40px;padding:3px 4px;min-width:0}
.pbar .who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.pbar .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.pbar .nm small{font-weight:600;opacity:.65;font-size:11.5px}
.pbar .cap{display:flex;align-items:center;min-height:18px;font-size:11.5px;font-weight:700;opacity:.85;overflow:hidden}
.pbar .cap svg{width:17px;height:17px;margin-right:-5px}
.pbar .cap b{margin-left:8px}
.pbar .badge2{width:34px;height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.pbar .clk{font:700 19px 'JetBrains Mono',ui-monospace,monospace;padding:4px 9px;border-radius:10px;background:var(--chip);min-width:74px;text-align:center;flex:none;font-variant-numeric:tabular-nums}
.pbar .clk.on{background:var(--gInk);color:var(--gbg)}
.pbar .clk.low{background:var(--bad);color:#fff}
.pbar .think{font-size:11px;font-weight:700;opacity:.7;animation:breathe 1.2s infinite}
.pbar.turn .nm::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
#boardWrap{position:relative;flex:none;border-radius:6px;box-shadow:0 0 0 3px var(--frame),0 6px 22px rgba(0,0,0,.18);touch-action:none}
#board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;height:100%;border-radius:4px;overflow:hidden}
.sq{position:relative;background:var(--sqL)}
.sq.d{background:var(--sqD)}
.sq::before{content:'';position:absolute;inset:0;pointer-events:none}
.sq.lm::before{background:var(--hlLast)}
.sq.sel::before{background:var(--hlSel)}
.sq.hint::before{background:var(--hlHint);box-shadow:inset 0 0 0 3px var(--gold)}
.sq.chk::before{background:radial-gradient(circle,rgba(255,40,40,.85) 0%,rgba(255,40,40,.45) 45%,rgba(255,40,40,0) 72%)}
.sq.tgt::after{content:'';position:absolute;left:50%;top:50%;width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;background:var(--hlDot);pointer-events:none;z-index:3}
.sq.cap::after{content:'';position:absolute;inset:4%;border-radius:50%;box-shadow:inset 0 0 0 calc(var(--cs)*.075) var(--hlDot);pointer-events:none;z-index:3}
.sq.hov{box-shadow:inset 0 0 0 3px var(--hlDot)}
.sq.bad::before{background:rgba(217,83,79,.55)}
.sq.good::before{background:rgba(47,158,106,.5)}
.sq .cf,.sq .cr{position:absolute;font-size:calc(var(--cs)*.2);font-weight:800;line-height:1;opacity:.85;pointer-events:none;z-index:1}
.big .sq .cf,.big .sq .cr{font-size:calc(var(--cs)*.3)}
.sq .cf{right:4%;bottom:3%}.sq .cr{left:5%;top:4%}
.sq .cf,.sq .cr{color:var(--cD)}.sq.d .cf,.sq.d .cr{color:var(--cL)}
#pcs{position:absolute;inset:0;pointer-events:none;z-index:2}
.pc{position:absolute;left:0;top:0;width:var(--cs);height:var(--cs);will-change:transform}
.pc svg{width:100%;height:100%;display:block}
.pc.drag{z-index:10;transition:none!important;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.pc.slide{transition:transform var(--slide,160ms) cubic-bezier(.3,.7,.3,1)}
.pc.gone{transition:opacity .2s;opacity:0}
.pc.topple svg{transition:transform .9s cubic-bezier(.5,0,.7,1);transform-origin:50% 88%;transform:rotate(80deg)}
#arrows{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:visible}
.mark{position:absolute;width:calc(var(--cs)*.36);height:calc(var(--cs)*.36);border-radius:50%;display:grid;place-items:center;font:800 calc(var(--cs)*.22) Inter,sans-serif;color:#fff;z-index:6;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.4)}
#side{display:flex;flex-direction:column;gap:6px;width:100%;flex:1;min-height:0;max-width:640px;position:relative}
#main.land #side{width:min(320px,38vw);flex:none}
#mlist{display:flex;gap:2px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none;padding:4px 2px;flex:none;min-height:34px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
#mlist::-webkit-scrollbar{display:none}
#main.land #mlist{flex-wrap:wrap;overflow-y:auto;align-content:flex-start;flex:1;white-space:normal}
#mlist .mn{opacity:.55;font-size:12px;padding:0 2px 0 6px;font-weight:700}
#mlist button{padding:4px 6px;border-radius:8px;font-weight:600;font-size:14px;color:var(--gInk)}
#mlist button.on{background:var(--gInk);color:var(--gbg)}
#mlist button .c{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:3px;vertical-align:middle}
#mlist .res{font-weight:800;padding:0 8px}
#tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:none;margin-top:auto}
#tools button{height:50px;border-radius:13px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;min-width:0;gap:1px;position:relative;color:var(--gInk)}
#tools button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
#tools button svg.i{width:19px;height:19px}
#tools button.on{background:var(--accent);color:var(--accentInk)}
#tools .cnt{position:absolute;top:-6px;right:2px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--gold);color:#3a2a00;font-size:11px;font-weight:800;display:grid;place-items:center;font-style:normal}
.banner{background:rgba(22,24,30,.94);color:#fff;border-radius:13px;padding:8px 10px;font-size:13px;line-height:1.35;display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none}
.banner b{flex:1 1 170px;min-width:0;font-weight:600}
.banner button{background:rgba(255,255,255,.92);color:#1c1c1e;border-radius:10px;padding:7px 11px;font-weight:700;font-size:13px}
.banner button.ok2{background:rgba(255,255,255,.16);color:#fff}
#review{display:flex;flex-direction:column;gap:6px;flex:none}
.accrow{display:flex;gap:8px}

<script>// ===================== Chess engine: board, rules, notation =====================
// 0x88 board. Pure (no DOM): Node tests and the page share it. Positions are plain objects with typed arrays;
// games are saved as {start FEN, moves (UCI)} and rebuilt by replaying, so a resumed game is exact.

// ---------- seeded randomness (Sweep's cyrb128 → sfc32) ----------
function cyrb128(str){ let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;
  for(let i=0,k;i<str.length;i++){ k=str.charCodeAt(i); h1=h2^Math.imul(h1^k,597399067); h2=h3^Math.imul(h2^k,2869860233); h3=h4^Math.imul(h3^k,951274213); h4=h1^Math.imul(h4^k,2716044179); }
  h1=Math.imul(h3^(h1>>>18),597399067); h2=Math.imul(h4^(h2>>>22),2869860233); h3=Math.imul(h1^(h3>>>17),951274213); h4=Math.imul(h2^(h4>>>19),2716044179);
  return [(h1^h2^h3^h4)>>>0,(h2^h1)>>>0,(h3^h1)>>>0,(h4^h1)>>>0]; }
function sfc32(a,b,c,d){ return function(){ a>>>=0;b>>>=0;c>>>=0;d>>>=0; let t=(a+b)|0; a=b^(b>>>9); b=(c+(c<<3))|0; c=(c<<21)|(c>>>11); d=(d+1)|0; t=(t+d)|0; c=(c+t)|0; return (t>>>0)/4294967296; }; }
const rngFor=str=>{ const s=cyrb128(String(str)); return sfc32(s[0],s[1],s[2],s[3]); };

// ---------- pieces and squares ----------
// A piece is type | colour<<3: white 1–6, black 9–14 (P N B R Q K). Square = rank*16 + file, a1 = 0, h8 = 119.
const WHITE=0, BLACK=1, PAWN=1, KNIGHT=2, BISHOP=3, ROOK=4, QUEEN=5, KING=6;
const PCH=' PNBRQK  pnbrqk';
const sqName=s=>'abcdefgh'[s&7]+((s>>4)+1);
const parseSq=t=>{ const m=/^([a-h])([1-8])$/.exec(t||''); return m?(m[2]-1)*16+'abcdefgh'.indexOf(m[1]):-1; };
const sq64=s=>(s>>4)*8+(s&7), sq88=i=>(i>>3)*16+(i&7);
const ND=[33,31,18,14,-33,-31,-18,-14], KD=[1,-1,16,-16,17,15,-17,-15], BD=[17,15,-17,-15], RD=[1,-1,16,-16];
// move = from | to<<7 | promo<<14 | flags<<17. Castling is encoded king → its own rook (works for Chess960).
const F_CAP=1, F_EP=2, F_CASTLE=4, F_DOUBLE=8;
const mFrom=m=>m&127, mTo=m=>(m>>7)&127, mPromo=m=>(m>>14)&7, mFlags=m=>m>>17;
const mk=(f,t,pr,fl)=>f|(t<<7)|(pr<<14)|(fl<<17);

// ---------- Zobrist keys (two 32-bit halves) and incremental evaluation tables ----------
const ZL=new Int32Array(16*128), ZH=new Int32Array(16*128), ZCL=new Int32Array(16), ZCH=new Int32Array(16), ZEL=new Int32Array(8), ZEH=new Int32Array(8);
let ZSL=0, ZSH=0;
(function(){ const r=rngFor('chess-zobrist-v1'), u=()=>(r()*4294967296)|0;
  for(let i=0;i<ZL.length;i++){ ZL[i]=u(); ZH[i]=u(); } for(let i=0;i<16;i++){ ZCL[i]=u(); ZCH[i]=u(); } for(let i=0;i<8;i++){ ZEL[i]=u(); ZEH[i]=u(); } ZSL=u(); ZSH=u(); })();
// Material and piece-square values, our own: written as formulas, middlegame / endgame, white's view (black mirrored).
const VAL_MG=[0,100,320,335,480,960,0], VAL_EG=[0,125,300,320,540,1010,0], PHASE=[0,0,1,1,2,4,0];
const PST_MG=new Int16Array(16*128), PST_EG=new Int16Array(16*128);
(function(){ const cd=(f,r)=>Math.max(Math.abs(f-3.5),Math.abs(r-3.5)), md=(f,r)=>Math.abs(f-3.5)+Math.abs(r-3.5);
  const T={ // f file 0–7, r rank 0–7 from the owner's side
    1:[(f,r)=>r===0||r===7?0:(r-1)*6+(f>=2&&f<=5?[0,0,-6,4,14,10,6][r-1]*(f===3||f===4?1.6:0.8):0)+(r===1&&(f===3||f===4)?-12:0)-(f===0||f===7?4:0),
       (f,r)=>r===0||r===7?0:[0,0,6,16,32,58,92][r-1]],
    2:[(f,r)=>Math.round(22-cd(f,r)*11-(r===0?6:0)), (f,r)=>Math.round(18-cd(f,r)*10)],
    3:[(f,r)=>Math.round(10-cd(f,r)*4-(r===0?8:0)+((f===r||f+r===7)?6:0)), (f,r)=>Math.round(10-cd(f,r)*5)],
    4:[(f,r)=>(r===6?16:0)+(f===3||f===4?6:f===2||f===5?2:-2)+(r===0&&(f===0||f===7)?-4:0), (f,r)=>(r===6?10:0)],
    5:[(f,r)=>Math.round(6-cd(f,r)*2-(r===0?0:r<3?0:2)), (f,r)=>Math.round(16-md(f,r)*4)],
    6:[(f,r)=>r===0?[18,28,12,-4,0,-4,30,20][f]:r===1?[2,4,-10,-18,-18,-10,6,4][f]:-30-r*6, (f,r)=>Math.round(26-md(f,r)*7-(r===0||r===7?6:0))]};
  for(let c=0;c<2;c++) for(let t=1;t<=6;t++) for(let s=0;s<128;s++){ if(s&0x88) continue; const f=s&7, r=c?7-(s>>4):(s>>4), p=t|(c<<3), sg=c?-1:1;
    PST_MG[p*128+s]=sg*(VAL_MG[t]+Math.round(T[t][0](f,r))); PST_EG[p*128+s]=sg*(VAL_EG[t]+Math.round(T[t][1](f,r))); } })();

// ---------- positions ----------
function newPos(){ return {b:new Int8Array(128),side:WHITE,cm:0,rf:[[7,0],[7,0]],ep:-1,half:0,full:1,k:[-1,-1],hl:0,hh:0,mg:0,eg:0,ph:0,cnt:new Int8Array(16),
  undo:[],hist:[],c960:false}; }
function put(p,s,pc){ p.b[s]=pc; const i=pc*128+s; p.hl^=ZL[i]; p.hh^=ZH[i]; p.mg+=PST_MG[i]; p.eg+=PST_EG[i]; p.ph+=PHASE[pc&7]; p.cnt[pc]++; if((pc&7)===KING) p.k[pc>>3]=s; }
function take(p,s){ const pc=p.b[s]; p.b[s]=0; const i=pc*128+s; p.hl^=ZL[i]; p.hh^=ZH[i]; p.mg-=PST_MG[i]; p.eg-=PST_EG[i]; p.ph-=PHASE[pc&7]; p.cnt[pc]--; return pc; }
const setCastle=(p,cm)=>{ p.hl^=ZCL[p.cm]^ZCL[cm]; p.hh^=ZCH[p.cm]^ZCH[cm]; p.cm=cm; };
const setEp=(p,ep)=>{ if(p.ep>=0){ p.hl^=ZEL[p.ep&7]; p.hh^=ZEH[p.ep&7]; } p.ep=ep; if(ep>=0){ p.hl^=ZEL[ep&7]; p.hh^=ZEH[ep&7]; } };
const rookSq=(p,c,s)=>(c?112:0)+p.rf[c][s]; // castling right bit = c*2+s, s 0 kingside, 1 queenside

const START_FEN='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
function fromFEN(fen){ const p=newPos(), f=String(fen||'').trim().split(/\s+/); if(f.length<2) throw new Error('bad FEN');
  const rows=f[0].split('/'); if(rows.length!==8) throw new Error('bad FEN');
  for(let r=0;r<8;r++){ let fi=0; for(const ch of rows[r]){ if(/\d/.test(ch)){ fi+=+ch; continue; } const i=PCH.indexOf(ch); if(i<1||ch===' ') throw new Error('bad FEN'); if(fi>7) throw new Error('bad FEN'); put(p,(7-r)*16+fi,i); fi++; }
    if(fi!==8) throw new Error('bad FEN'); }
  if(p.cnt[KING]!==1||p.cnt[KING|8]!==1) throw new Error('bad FEN: kings');
  p.side=f[1]==='b'?BLACK:WHITE; if(p.side){ p.hl^=ZSL; p.hh^=ZSH; }
  let cm=0; const cf=f[2]||'-';
  if(cf!=='-') for(const ch of cf){ const c=ch===ch.toUpperCase()?0:1, kf=p.k[c]&7, rank=c?112:0, U=ch.toUpperCase();
    let file=-1, s;
    if(U==='K'){ for(let x=7;x>kf;x--) if(p.b[rank+x]===(ROOK|c<<3)){ file=x; break; } s=0; }
    else if(U==='Q'){ for(let x=0;x<kf;x++) if(p.b[rank+x]===(ROOK|c<<3)){ file=x; break; } s=1; }
    else if(U>='A'&&U<='H'){ file=U.charCodeAt(0)-65; s=file>kf?0:1; }
    if(file<0||p.b[rank+file]!==(ROOK|c<<3)||(p.k[c]>>4)!==(c?7:0)) continue;
    p.rf[c][s]=file; cm|=1<<(c*2+s); }
  setCastle(p,cm);
  // a castling right with the king off e1/e8 or a rook off a/h means Chess960 rules
  p.c960=[0,1].some(c=>[0,1].some(s=>(cm&(1<<(c*2+s)))&&((p.k[c]&7)!==4||p.rf[c][s]!==(s?0:7))));
  const ep=parseSq(f[3]); if(ep>=0){ // keep the en passant square only if a capture is possible (cleaner repetition keys)
    const c=p.side, pw=PAWN|c<<3, from=c?[ep+15,ep+17]:[ep-15,ep-17]; if(from.some(s=>!(s&0x88)&&p.b[s]===pw)) setEp(p,ep); }
  p.half=+f[4]||0; p.full=Math.max(1,+f[5]||1);
  return p; }
function toFEN(p){ let s='';
  for(let r=7;r>=0;r--){ let e=0; for(let f=0;f<8;f++){ const pc=p.b[r*16+f]; if(!pc){ e++; continue; } if(e){ s+=e; e=0; } s+=PCH[pc]; } if(e) s+=e; if(r) s+='/'; }
  let c=''; for(const col of [0,1]) for(const sd of [0,1]) if(p.cm&(1<<(col*2+sd))){ const f=p.rf[col][sd]; let ch=p.c960?'ABCDEFGH'[f]:sd?'Q':'K'; c+=col?ch.toLowerCase():ch; }
  return `${s} ${p.side?'b':'w'} ${c||'-'} ${p.ep>=0?sqName(p.ep):'-'} ${p.half} ${p.full}`; }
function clonePos(p){ const q=newPos(); q.b.set(p.b); q.cnt.set(p.cnt); Object.assign(q,{side:p.side,cm:p.cm,rf:[p.rf[0].slice(),p.rf[1].slice()],ep:p.ep,half:p.half,full:p.full,k:p.k.slice(),hl:p.hl,hh:p.hh,mg:p.mg,eg:p.eg,ph:p.ph,c960:p.c960}); q.hist=p.hist.slice(); return q; }

// ---------- Chess960 ----------
// Back rank n (0–959) in the standard numbering: 518 is the normal start. Both sides get the same arrangement.
const KN960=[[0,1],[0,2],[0,3],[0,4],[1,2],[1,3],[1,4],[2,3],[2,4],[3,4]];
function back960(n){ const a=Array(8).fill(''); a[(n%4)*2+1]='B'; n=Math.floor(n/4); a[(n%4)*2]='B'; n=Math.floor(n/4);
  const empty=()=>a.map((x,i)=>x?-1:i).filter(i=>i>=0);
  a[empty()[n%6]]='Q'; n=Math.floor(n/6); const e=empty(), kn=KN960[n]; a[e[kn[0]]]='N'; a[e[kn[1]]]='N';
  const r=empty(); a[r[0]]='R'; a[r[1]]='K'; a[r[2]]='R'; return a.join(''); }
function fen960(n){ const w=back960(n), f=[...w].map((ch,i)=>ch==='R'?'ABCDEFGH'[i]:'').filter(Boolean);
  return `${w.toLowerCase()}/pppppppp/8/8/8/8/PPPPPPPP/${w} w ${f[1]}${f[0]}${f[1].toLowerCase()}${f[0].toLowerCase()} - 0 1`; }
const index960=seed=>Math.floor(rngFor('CH960|'+seed)()*960);

// ---------- attacks ----------
function attacked(p,s,by){ const b=p.b, pb=by<<3;
  if(by===WHITE){ if(!((s-15)&0x88)&&b[s-15]===PAWN) return true; if(!((s-17)&0x88)&&b[s-17]===PAWN) return true; }
  else { if(!((s+15)&0x88)&&b[s+15]===(PAWN|8)) return true; if(!((s+17)&0x88)&&b[s+17]===(PAWN|8)) return true; }
  for(let i=0;i<8;i++){ const t=s+ND[i]; if(!(t&0x88)&&b[t]===(KNIGHT|pb)) return true; }
  for(let i=0;i<8;i++){ const t=s+KD[i]; if(!(t&0x88)&&b[t]===(KING|pb)) return true; }
  for(let i=0;i<4;i++){ const d=BD[i]; let t=s+d; while(!(t&0x88)){ const q=b[t]; if(q){ if(q===(BISHOP|pb)||q===(QUEEN|pb)) return true; break; } t+=d; } }
  for(let i=0;i<4;i++){ const d=RD[i]; let t=s+d; while(!(t&0x88)){ const q=b[t]; if(q){ if(q===(ROOK|pb)||q===(QUEEN|pb)) return true; break; } t+=d; } }
  return false; }
const inCheck=(p,c)=>attacked(p,p.k[c==null?p.side:c],(c==null?p.side:c)^1);

// ---------- move generation (pseudo-legal; legality is checked by making the move) ----------
function genMoves(p,out,capsOnly){ const b=p.b, c=p.side, them=c^1, up=c?-16:16, start=c?6:1, last=c?0:7;
  for(let r=0;r<8;r++) for(let f=0;f<8;f++){ const s=r*16+f, pc=b[s]; if(!pc||(pc>>3)!==c) continue; const t=pc&7;
    if(t===PAWN){ const one=s+up;
      if(!capsOnly||(one>>4)===last){ if(!(one&0x88)&&!b[one]){ if((one>>4)===last){ for(let pr=QUEEN;pr>=KNIGHT;pr--) out.push(mk(s,one,pr,0)); }
          else { out.push(mk(s,one,0,0)); if(r===start&&!b[one+up]&&!capsOnly) out.push(mk(s,one+up,0,F_DOUBLE)); } } }
      for(let j=0;j<2;j++){ const x=s+up+(j?1:-1); if(x&0x88) continue; const q=b[x];
        if(q&&(q>>3)===them){ if((x>>4)===last){ for(let pr=QUEEN;pr>=KNIGHT;pr--) out.push(mk(s,x,pr,F_CAP)); } else out.push(mk(s,x,0,F_CAP)); }
        else if(x===p.ep) out.push(mk(s,x,0,F_CAP|F_EP)); }
      continue; }
    if(t===KNIGHT||t===KING){ const D=t===KNIGHT?ND:KD; for(let i=0;i<8;i++){ const x=s+D[i]; if(x&0x88) continue; const q=b[x];
        if(!q){ if(!capsOnly) out.push(mk(s,x,0,0)); } else if((q>>3)===them) out.push(mk(s,x,0,F_CAP)); }
      if(t===KING&&!capsOnly) genCastles(p,out); continue; }
    const D=t===BISHOP?BD:t===ROOK?RD:KD, n=t===QUEEN?8:4;
    for(let i=0;i<n;i++){ const d=D[i]; let x=s+d; while(!(x&0x88)){ const q=b[x];
        if(!q){ if(!capsOnly) out.push(mk(s,x,0,0)); } else { if((q>>3)===them) out.push(mk(s,x,0,F_CAP)); break; } x+=d; } } }
  return out; }
// Castling, Chess960 rules: king ends on g/c, rook on f/d; every square both cross (and land on) must be empty apart from
// the two pieces themselves, and the king may not be in check, pass through or land on an attacked square.
function genCastles(p,out){ const c=p.side, rank=c?112:0, ks=p.k[c];
  for(let sd=0;sd<2;sd++){ if(!(p.cm&(1<<(c*2+sd)))) continue; const rs=rank+p.rf[c][sd], kt=rank+(sd?2:6), rt=rank+(sd?3:5);
    if(p.b[rs]!==(ROOK|c<<3)) continue; let okk=true;
    const lo=Math.min(ks,rs,kt,rt), hi=Math.max(ks,rs,kt,rt);

// ---------- root ----------
// one iteration: every root move, best first. With `all`, each move gets a usable score (window best−300 … ∞)
function* groot(p,d,root,all){ const c=p.side; let a=-INF, best=-INF, bm=root[0].m;
  for(let i=0;i<root.length;i++){ const R=root[i]; makeMove(p,R.m); let s;
    const lo=all?Math.max(-INF,(best>-INF?best:-INF)-300):a;
    if(i===0||all) s=d-1>=GEN_MIN?-(yield* gab(p,d-1,-INF,-lo,1,true)):-ab(p,d-1,-INF,-lo,1);
    else { s=d-1>=GEN_MIN?-(yield* gab(p,d-1,-a-1,-a,1,false)):-ab(p,d-1,-a-1,-a,1);
      if(!SR.stop&&s>a) s=d-1>=GEN_MIN?-(yield* gab(p,d-1,-INF,-a,1,true)):-ab(p,d-1,-INF,-a,1); }
    unmakeMove(p); if(SR.stop&&i>0) return {best,bm,partial:true}; if(SR.stop) return null;
    R.s=s; R.d=d; if(s>best){ best=s; bm=R.m; } if(s>a) a=s;

// Iterative deepening. o: {depth, time (ms, soft), hard (ms), all, qlim}. Returns {move, score, depth, nodes, root, pv}.
function* thinkGen(p,o){ o=o||{}; const t0=now(), maxD=o.depth||64, soft=o.time||0, hard=o.hard||(soft?soft*2:o.depth?20000:4000);

function runGen(gen){ let r; SR.slice=Infinity; do{ r=gen.next(); }while(!r.done); return r.value; }

const STRENGTHS=[null,

// ---------- post-game analysis ----------

// count as ±100. A move's loss L = W(best) − W(after). Move accuracy = 100·e^(−L/15); a player's accuracy is the mean

// ===================== 2-Player share codes (CHF1.) =====================
// CHF1.<base64url>: version, a random 6-byte game id, flags, the Chess960 back rank (or none), both names and the full
// move list (each move as its index among the legal moves, sorted by UCI). Then 0xA1 + both players' Arcade avatar
// numbers (0 = none), then a 16-bit checksum. A code without the avatar bytes reads as 0, 0. Every device rebuilds the
// game by replaying every move, so an illegal or impossible move is caught.
// Seats: 0 = the player who made the game, 1 = the player who joined. Flags: bit 0 seat 0 plays Black; bits 1–2 the end
// (0 playing, 1 White resigned, 2 Black resigned, 3 draw agreed); bit 3 the last mover offers a draw.
const B64U='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
const toB64U=b=>{ let s=''; for(let i=0;i<b.length;i+=3){ const n=(b[i]<<16)|((b[i+1]||0)<<8)|(b[i+2]||0);
  s+=B64U[n>>18&63]+B64U[n>>12&63]+(i+1<b.length?B64U[n>>6&63]:'')+(i+2<b.length?B64U[n&63]:''); } return s; };
const fromB64U=s=>{ const out=[]; let buf=0,bits=0; for(const ch of s){ const v=B64U.indexOf(ch); if(v<0) throw new Error('char'); buf=(buf<<6)|v; bits+=6; if(bits>=8){ bits-=8; out.push((buf>>bits)&255); } } return Uint8Array.from(out); };
const cleanName=t=>[...String(t||'').replace(/[\u0000-\u001f\u007f<>&"'`]/g,'')].slice(0,16).join('').trim();
const fnv16=b=>{ let h=2166136261; for(const v of b){ h^=v; h=Math.imul(h,16777619); } return (h^(h>>>16))&0xffff; };
const AV_MARK=0xA1;
// moves as indexes among the legal moves, sorted by their UCI text (the same on every device)
function sortedLegal(p){ return legalMoves(p).map(m=>[toUci(p,m),m]).sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0); }
function encodeGame(g){ // g: {id:[6 bytes], c960 (-1 or 0–959), p0black, names:[a,b], avs:[a,b], moves:[uci], end, offer}
  const b=[1,...g.id];
  b.push((g.p0black?1:0)|((g.end||0)<<1)|(g.offer?8:0));
  const n=g.c960>=0?g.c960+1:0; b.push(n>>8,n&255);
  for(const nm of g.names){ const u=new TextEncoder().encode(cleanName(nm)); b.push(u.length,...u); }
  const p=fromFEN(g.c960>=0?fen960(g.c960):START_FEN); if(g.c960>=0) p.c960=true;
  b.push(g.moves.length>>8,g.moves.length&255);
  for(const u of g.moves){ const L=sortedLegal(p), k=L.findIndex(x=>x[0]===u); if(k<0) throw new Error('illegal'); b.push(k); makeMove(p,L[k][1]); }
  const av=g.avs||[0,0]; if(av[0]||av[1]) b.push(AV_MARK,av[0]&255,av[1]&255);
  const ck=fnv16(b); b.push(ck>>8,ck&255);
  return 'CHF1.'+toB64U(Uint8Array.from(b)); }
const findCode=text=>{ const m=String(text||'').match(/CHF1\.([A-Za-z0-9_-]{16,})/); return m?m[0]:null; };
function decodeGame(text){ const code=findCode(text); if(!code) throw new Error('nocode');
  const all=fromB64U(code.slice(5)); if(all.length<14) throw new Error('short');
  const b=all.slice(0,-2); if(fnv16(b)!==((all[all.length-2]<<8)|all[all.length-1])) throw new Error('checksum');
  let i=0; if(b[i++]!==1) throw new Error('version');
  const id=[...b.slice(i,i+6)]; i+=6; const fl=b[i++], c9=(b[i]<<8)|b[i+1]; i+=2; if(c9>960) throw new Error('bad');
  const names=[]; for(let k=0;k<2;k++){ const l=b[i++]; if(l===undefined||l>64||i+l>b.length) throw new Error('names'); names.push(cleanName(new TextDecoder().decode(b.slice(i,i+l)))); i+=l; }
  const cnt=(b[i]<<8)|b[i+1]; i+=2; if(i+cnt>b.length) throw new Error('short');
  const g={id:idHex(id),idBytes:id,c960:c9?c9-1:-1,p0black:!!(fl&1),end:(fl>>1)&3,offer:!!(fl&8),names,moves:[],avs:[0,0]};
  const p=fromFEN(g.c960>=0?fen960(g.c960):START_FEN); if(g.c960>=0) p.c960=true;
  for(let k=0;k<cnt;k++){ const L=sortedLegal(p), x=b[i++]; if(x>=L.length) throw new Error('invalid'); g.moves.push(L[x][0]); makeMove(p,L[x][1]); }
  if(b[i]===AV_MARK) g.avs=[b[i+1]|0,b[i+2]|0];
  return g; }
const idHex=b=>b.map(v=>v.toString(16).padStart(2,'0')).join('');
const newGameId=()=>{ const b=new Uint8Array(6); try{ crypto.getRandomValues(b); }catch(e){ for(let i=0;i<6;i++) b[i]=Math.floor(Math.random()*256); } return [...b]; };
// seat of a colour: seat 0 plays White unless p0black
const seatOf=(g,colour)=>(colour===WHITE)!==!!g.p0black?0:1;
const colourOf=(g,seat)=>(seat===0)!==!!g.p0black?WHITE:BLACK;
// a game's result, from its moves and end flag: {over, result, reason, winner (colour)}
function codeStatus(g){ const p=posAt({start:g.c960>=0?fen960(g.c960):START_FEN,moves:g.moves,c960:g.c960});
  if(g.end===1) return {over:true,result:'0-1',reason:'resign',winner:BLACK,p};
  if(g.end===2) return {over:true,result:'1-0',reason:'resign',winner:WHITE,p};
  if(g.end===3) return {over:true,result:'1/2-1/2',reason:'agreed',p};
  return Object.assign(gameStatus(p),{p}); }
// importing: replays every move; refused if damaged, deleted, illegal, older than the saved game, the same, or not this
// device's turn yet
function importCheck(text,local){ let g; try{ g=decodeGame(text); }catch(e){ return {ok:false,why:e.message==='nocode'?'nocode':e.message==='invalid'?'invalid':'bad'}; }
  if(local&&local.deleted&&local.deleted.includes(g.id)) return {ok:false,why:'deleted',g};
  const have=local&&local.games?local.games.find(x=>x.id===g.id):null, st=codeStatus(g);
  const me=have?have.me:1, len=n=>n+(g.end?1:0);
  if(have){ const hn=have.moves.length+(have.end?1:0), gn=len(g.moves.length); if(gn<hn) return {ok:false,why:'older',g}; if(gn===hn&&!!g.offer===!!have.offer) return {ok:false,why:'same',g}; }
  if(!st.over&&seatOf(g,st.p.side)!==me) return {ok:false,why:'notyours',g};
  return {ok:true,g,st,me,isNew:!have}; }

// ---------- hints: refilled daily to 5, +1 per level-up, earned extras stack to 99 ----------
function refreshHints(S,today){ if(S.hintDate!==today){ S.hints=Math.max(S.hints||0,HINT_CAP); S.hintDate=today; } return S.hints; }
function useHint(S){ if(S.hints<=0) return false; S.hints--; return true; }

// ---------- XP ----------
function addXP(S,n){ const before=levelOf(S.xp); S.xp+=Math.max(0,Math.round(n)); const after=levelOf(S.xp), rewards=[];
  for(let l=before+1;l<=after;l++) rewards.push(...rewardsAt(l));
  const ups=after-before; if(ups>0) S.hints=Math.min(HINT_MAX,(S.hints||0)+ups); // +1 hint per level-up
  return {xp:Math.round(n),before,after,rewards,hints:ups}; }
const xpNext=S=>{ const l=levelOf(S.xp); return l>=MAXL?null:LVXP[l]; };
// Classic game: a win pays 5 + 5 × strength (10–45); a draw half; an assisted result half again; losses nothing.
function classicXP(level,result,assisted){ const base=5+5*level; let x=result==='win'?base:result==='draw'?base/2:0; if(assisted) x/=2; return Math.round(x); }
// Puzzles: 2 XP per Classic puzzle solved first try, capped at 30 a day
function puzzleXP(S,today){ const d=S.rec.puzDay; if(d.date!==today){ d.date=today; d.xp=0; } const x=Math.min(2,30-d.xp); d.xp+=Math.max(0,x); return Math.max(0,x); }

// ---------- records ----------
// wins, draws and losses per strength × colour; best accuracy; longest win streak; the Chess960 record.
// An abandoned Classic game counts as a loss for the streak.
const recKey=(level,colour)=>level+'|'+(colour===WHITE?'w':'b');
function recordGame(S,o){ // o: {level, colour, result 'win'|'draw'|'loss', c960}
  const k=recKey(o.level,o.colour), r=S.rec.by[k]||(S.rec.by[k]={w:0,d:0,l:0}), R=S.rec; const fresh=[];
  r[o.result[0]]++; R.games++;
  if(o.c960) R.c960[o.result[0]]++;
  if(o.result==='win'){ R.wins++; R.streak++; if(R.streak>R.bestStreak){ R.bestStreak=R.streak; if(R.streak>1) fresh.push('Longest win streak'); } } else R.streak=0;
  return fresh; }
const winsAt=(S,level)=>{ const a=S.rec.by[recKey(level,WHITE)], b=S.rec.by[recKey(level,BLACK)]; return (a?a.w:0)+(b?b.w:0); };
// Classic game stars: ★ win, ★ no assists (no hints, no takebacks), ★ accuracy ≥ 75% (arrives with the analysis)
function gameStars(won,assisted,acc){ return [won?1:0,won&&!assisted?1:0,won&&acc!=null&&acc>=ACC_STAR?1:0]; }

// ---------- the puzzle bank (generated by tools/build_puzzles.js from the Lichess puzzle database, CC0) ----------
// Entry: id~placement~side castling ep~setup move~solution (UCI, promotions in capitals)~rating (base 36)~themes (bits, base 36)
const PUZ_BANDS=[['beginner','Beginner',0,999],['easy','Easy',1000,1399],['normal','Normal',1400,1799],['hard','Hard',1800,2199],['expert','Expert',2200,9999]];
const PUZ_THEME_UI=[['mateIn1','Mate in 1'],['mateIn2','Mate in 2'],['mateIn3','Mate in 3'],['fork','Fork'],['pin','Pin'],['skewer','Skewer'],['discoveredAttack','Discovered attack'],['backRankMate','Back-rank mate'],['promotion','Promotion'],['endgame','Endgame']];
function splitUci(s){ const out=[]; let i=0; while(i<s.length){ let u=s.slice(i,i+4); i+=4; if(i<s.length&&'QRBN'.includes(s[i])){ u+=s[i].toLowerCase(); i++; } out.push(u); } return out; }
function decodePuzzle(e){ const f=e.split('~'), sc=f[2];
  const side=sc[0], ep=/[a-h][36]$/.test(sc)?sc.slice(-2):'-', cast=sc.slice(1,ep==='-'?undefined:-2)||'-';
  const th=parseInt(f[6]||'0',36), themes=PUZ_THEMES.filter((t,i)=>th&(2**i));
  return {id:f[0],fen:`${f[1]} ${side} ${cast} ${ep} 0 1`,setup:f[3],sol:splitUci(f[4]),rating:parseInt(f[5],36),themes}; }
let PUZ_LIST=null, PUZ_DAILY=null;
function puzList(){ if(!PUZ_LIST) PUZ_LIST=PUZ_C?PUZ_C.split(',').map(decodePuzzle):[]; return PUZ_LIST; }
function puzDaily(band){ if(!PUZ_DAILY) PUZ_DAILY=PUZ_D.map(s=>s?s.split(',').map(decodePuzzle):[]); return PUZ_DAILY[band]; }
const puzById=id=>puzList().find(p=>p.id===id)||PUZ_D.join(',').split(',').filter(Boolean).map(decodePuzzle).find(p=>p.id===id)||null;
const bandOf=r=>PUZ_BANDS.find(b=>r>=b[2]&&r<=b[3])[0];
// Classic Puzzles: by difficulty band or theme; no repeats until that part of the bank is used up
function pickPuzzle(S,o,rnd){ const all=puzList(), key=o.by==='theme'?'t:'+o.theme:'b:'+o.band;
  const pool=all.filter(p=>o.by==='theme'?p.themes.includes(o.theme):bandOf(p.rating)===o.band); if(!pool.length) return null;
  let used=S.pused[key]||[]; let left=pool.filter(p=>!used.includes(p.id)); if(!left.length){ used=[]; left=pool; }
  const p=left[Math.floor(rnd()*left.length)]; used.push(p.id); if(used.length>pool.length) used=used.slice(-pool.length); S.pused[key]=used; return p; }
// Puzzle Streak: first-try solves in a row, each puzzle harder (start near 800, +60 rating each)
const streakTarget=n=>800+n*60;
function pickStreak(n,rnd,avoid){ const t=streakTarget(n), all=puzList(); let best=null, bd=1e9;
  for(let k=0;k<40;k++){ const p=all[Math.floor(rnd()*all.length)]; if(avoid&&avoid.includes(p.id)) continue; const d=Math.abs(p.rating-t)+(p.rating<t-80?200:0); if(d<bd){ bd=d; best=p; } }
  return best; }
// A puzzle move is right if it's the stored move, or (as Lichess does) any move that also mates.
function puzzleMoveOk(p,m,expectUci){ if(toUci(p,m)===expectUci) return true; makeMove(p,m); const mate=inCheck(p)&&!legalMoves(p).length; unmakeMove(p); return mate; }
// puzzle stars: ★ solved, ★ first try (no wrong moves), ★ no hints
const puzzleStars=(solved,wrong,hints)=>[solved?1:0,solved&&!wrong?1:0,solved&&!hints?1:0];
function recordPuzzle(S,pz,solved,wrong,hints,today){ const R=S.rec, fresh=[]; let xp=0;
  if(solved){ R.puzSolved++; if(!wrong){ R.puzFirst++; R.puzStreak++; if(R.puzStreak>R.puzBest){ R.puzBest=R.puzStreak; fresh.push('Puzzle streak'); } if(!hints) xp=puzzleXP(S,today); } else R.puzStreak=0; }
  else R.puzStreak=0;
  return {xp,fresh}; }

// ---------- campaign ----------
const campOf=(S,id)=>S.camp[id]||{s:[0,0,0],tries:0,best:0};
const campStars=(S,id)=>campOf(S,id).s.reduce((a,b)=>a+b,0);
const totalStars=S=>LEVELS.reduce((a,L)=>a+campStars(S,L.id),0);
const campCleared=(S,id)=>!!campOf(S,id).s[0];
const campDone=(S,c)=>campCleared(S,LEVELS.find(L=>L.camp===c&&L.n===15).id);
const campOpen=(S,c)=>c===0||campDone(S,c-1);
// clearing a level unlocks the next; clearing level 15 unlocks the next campaign
const unlocked=(S,Lv)=>campOpen(S,Lv.camp)&&(Lv.n===1||campCleared(S,LEVELS.find(L=>L.camp===Lv.camp&&L.n===Lv.n-1).id));
const levelById=id=>LEVELS.find(L=>L.id===id);
// The three stars by level type (clearing is required for any star):
//  set (and tech): solve all · all first try · no hints
//  drill: checkmate · within par moves · no assists
//  game: win · no assists · accuracy ≥ 75%
//  pos: win · no assists · within par moves
function levelStarText(L){
  if(L.type==='set'||L.type==='tech') return ['Solve every puzzle','Every puzzle on the first try','No hints'];
  if(L.type==='drill') return ['Checkmate',TFX('Mate within {0} moves',L.par),'No assists (hints or takebacks)'];
  if(L.type==='hold') return [TFX('Hold for {0} moves (or draw)',L.hold),'Keep your rook','No assists (hints or takebacks)'];
  if(L.type==='pos') return ['Win the game','No assists (hints or takebacks)',TFX('Win within {0} moves',L.par)];
  return ['Win the game','No assists (hints or takebacks)',`Accuracy ${ACC_STAR}% or more`]; }
const TFX=(t,...a)=>(typeof TF==='function'?TF(t,...a):t.replace(/\{(\d)\}/g,(_,n)=>a[n]));
// o: {cleared, s2, s3} → stars build up across attempts, each earned once
function campaignResult(S,Lv,o){ const c=campOf(S,Lv.id), C=CAMPS[Lv.camp], wasDone=campDone(S,Lv.camp), fresh=[]; let xp=0;
  const earned=[o.cleared?1:0,o.cleared&&o.s2?1:0,o.cleared&&o.s3?1:0];
  c.tries=(c.tries||0)+1;
  earned.forEach((e,i)=>{ if(e&&!c.s[i]){ c.s[i]=1; fresh.push(i); xp+=C.xp; } });
  S.camp[Lv.id]=c; const finished=!wasDone&&campDone(S,Lv.camp); if(finished) xp+=C.bonus;
  return {earned,fresh,stars:campStars(S,Lv.id),xp,finished}; }
// the accuracy star arrives later, when the analysis finishes
function campaignAccStar(S,Lv,acc){ if(Lv.type!=='game'||acc==null||acc<ACC_STAR) return null; const c=campOf(S,Lv.id); if(!c.s[0]||c.s[2]) return null;
  const wasDone=campDone(S,Lv.camp); c.s[2]=1; S.camp[Lv.id]=c; return {xp:CAMPS[Lv.camp].xp+(!wasDone&&campDone(S,Lv.camp)?CAMPS[Lv.camp].bonus:0)}; }

// ---------- Daily ----------
// CHD1|YYYY-MM-DD picks the day's puzzle from the reserved Daily part of the bank (never used by Classic Puzzles),
// with difficulty by weekday. Everyone gets the same puzzle.
const DAILY_BANDS=[[2100,2400],[800,1100],[1100,1300],[1300,1500],[1500,1700],[1700,1900],[1900,2100]]; // index = getDay(): Sunday … Saturday
const weekdayOf=date=>{ const [y,m,d]=date.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)).getUTCDay(); };
function dailyPuzzle(date){ const w=weekdayOf(date), pool=puzDaily(w), r=rngFor('CHD1|'+date); if(!pool||!pool.length) return null;
  return Object.assign({},pool[Math.floor(r()*pool.length)],{daily:date}); }
const dailyFingerprint=date=>{ const p=dailyPuzzle(date); return p?p.id:''; };
function dailyFor(S,date){ if(S.daily.date!==date) S.daily={date,scored:false,cleared:false,stars:0,time:0,first:false,hints:0,run:null,practice:null}; return S.daily; }
const dayNum=date=>{ const [y,m,d]=date.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); };
// The one scored attempt. Ending it without solving counts as the attempt too.
function dailyResult(S,date,solved,wrong,hints,time,today){ const d=dailyFor(S,date); if(d.scored) return null;
  const st=puzzleStars(solved,wrong,hints), stars=st.reduce((a,b)=>a+b,0);
  Object.assign(d,{scored:true,cleared:solved,stars,time,first:solved&&!wrong,hints,run:null});
  S.dhist[date]={won:solved,stars,time,first:solved&&!wrong}; const keys=Object.keys(S.dhist).sort(); while(keys.length>7) delete S.dhist[keys.shift()]; // the last 7 Dailies
  let xp=0;
  if(solved){ S.dclears=(S.dclears||0)+1; xp=20*(date===today?2:1); if(stars===3) S.d3=(S.d3||0)+1;
    const n=dayNum(date), last=S.dstreak.last?dayNum(S.dstreak.last):-99;
    if(n!==last){ S.dstreak.cur=n===last+1?S.dstreak.cur+1:1; S.dstreak.last=date; S.dstreak.best=Math.max(S.dstreak.best,S.dstreak.cur); }
    if(stars===3) S.dweek[weekdayOf(date)]=1; }
  return {stars:st,xp,won:solved}; }
function streakNow(S,today){ const last=S.dstreak.last?dayNum(S.dstreak.last):-99; if(dayNum(today)-last>1) S.dstreak.cur=0; return S.dstreak.cur; }
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// no spoilers: the share line never shows a move
function shareLine(date,solved,stars,first,time){ const [,m,dd]=date.split('-').map(Number);
  return `Chess Daily · ${WD[weekdayOf(date)]} ${dd} ${MON[m-1]} · ${'★'.repeat(stars)}${'☆'.repeat(3-stars)} · ${solved?(first?'first try':'solved'):'not solved'}${solved?' · '+fmtTime(time):''}`; }

function tpFind(S,id){ return S.tp.games.find(g=>g.id===id); }
function tpSave(S,g){ const k=S.tp.games.findIndex(x=>x.id===g.id); if(k>=0) S.tp.games[k]=g; else S.tp.games.unshift(g); }
function tpDelete(S,id){ S.tp.games=S.tp.games.filter(g=>g.id!==id); if(!S.tp.deleted.includes(id)) S.tp.deleted.push(id); if(S.tp.deleted.length>200) S.tp.deleted.shift(); }
// a finished share-code game won by this device's player counts once toward Rivals; pass-and-play counts nothing
function tpCount(S,g,st){ if(g.mode!=='code'||!st.over||S.tp.counted.includes(g.id)) return false; S.tp.counted.push(g.id);
  if(st.winner!=null&&seatOf(g,st.winner)===g.me){ S.tp.wins++; return true; } return false; }

// How a game ended in mate, from the final position and move: {mate, smother, castle, ep, promo, minor}
function mateKind(g){ if(!g.moves.length) return null; const p=posAt(g,g.moves.length-1), m=fromUci(p,g.moves[g.moves.length-1]); if(!m) return null;
  const mover=p.side, pc=p.b[mFrom(m)]&7; makeMove(p,m); const mate=inCheck(p)&&!legalMoves(p).length; if(!mate) return null;
  // smothered: a knight mates and every square around the loser's king is blocked by its own pieces
  const k=p.k[p.side]; let smother=pc===KNIGHT;
  if(smother) for(const d of KD){ const x=k+d; if(x&0x88) continue; const q=p.b[x]; if(!q||(q>>3)!==p.side){ smother=false; break; } }
  return {mate:true,mover,smother,castle:!!(mFlags(m)&F_CASTLE),ep:!!(mFlags(m)&F_EP),promo:!!mPromo(m),minor:pc===KNIGHT||pc===BISHOP}; }
// the lowest material balance (you minus them, in pawns) you were at during the game
function worstBalance(g,colour){ const p=fromFEN(g.start); if(g.c960>=0) p.c960=true; let w=material(p,colour)-material(p,colour^1);
  for(const u of g.moves){ makeMove(p,fromUci(p,u)); w=Math.min(w,material(p,colour)-material(p,colour^1)); } return w; }
// ctx: {mode, won, level, colour, g (the game), clock, acc, assisted, practice, local, puzzle {rating, first}}
function checkAch(S,ctx){ const got=[], give=id=>{ if(!S.ach[id]){ S.ach[id]=Date.now(); got.push(id); } };
  if(ctx.practice) return got;
  if(ctx.mode==='tp'){ if(!ctx.local) for(const a of ACH) if(a.g==='2-Player'&&S.tp.wins>=a.n) give(a.id); return got; }
  if((ctx.mode==='classic'||ctx.mode==='campaign')&&ctx.won&&ctx.g){ const lv=ctx.level;
    if(lv) give('beat'+lv); if(lv>=5&&ctx.colour===BLACK) give('black5');
    if(worstBalance(ctx.g,ctx.colour)<=-5) give('comeback');
    if(ctx.acc!=null&&ctx.acc>=90) give('perfect');
    if(ctx.g.c960>=0) give('fischer'); if(ctx.clock==='3+2') give('clock');
    const mk=mateKind(ctx.g); if(mk&&mk.mover===ctx.colour){ if(mk.smother) give('smother'); if(mk.castle) give('mcastle'); if(mk.ep) give('mep'); if(mk.promo) give('mpromo'); if(mk.minor) give('mminor');
      if(lv>=4&&Math.ceil(ctx.g.moves.length/2)<20) give('mquick'); } }
  if(ctx.acc!=null&&ctx.acc>=90&&ctx.won) give('perfect');
  const R=S.rec; for(const a of ACH) if(a.g==='Puzzles'&&a.n&&R.puzSolved>=a.n) give(a.id);
  if(R.puzBest>=10) give('pstreak10'); if(R.puzBest>=25) give('pstreak25');
  if(ctx.puzzle&&ctx.puzzle.first&&ctx.puzzle.rating>=2000) give('p2000');
  if(ctx.mode==='campaign'){ CAMPS.forEach((cp,i)=>{ if(campDone(S,i)) give('camp'+(i+1)); if(LEVELS.filter(L=>L.camp===i).every(L=>campStars(S,L.id)>=3)) give('perf'+(i+1)); });
    if(LEVELS.filter(L=>L.type==='drill').every(L=>campStars(S,L.id)>=3)) give('egmaster'); }
  if(ctx.mode==='daily'){ const n=S.dclears||0, s3=S.d3||0; if(n>=7) give('d7'); if(n>=30) give('d30'); if(n>=100) give('d100');
    if(s3>=1) give('dstar1'); if(s3>=10) give('dstar10'); if(s3>=30) give('dstar30'); if(S.dstreak.cur>=7) give('dstreak'); if(S.dweek.every(Boolean)) give('dweek'); }
  return got; }
const achProgress=(S,a)=>a.g==='Puzzles'&&a.n?Math.min(S.rec.puzSolved,a.n):a.id.startsWith('pstreak')?Math.min(S.rec.puzBest,a.id==='pstreak10'?10:25):/^d\d/.test(a.id)?Math.min(S.dclears||0,a.n):/^dstar/.test(a.id)?Math.min(S.d3||0,a.n):a.id==='dweek'?S.dweek.filter(Boolean).length:a.g==='2-Player'?Math.min(S.tp.wins,a.n):null;
const achTotal=a=>a.n||(a.id==='dweek'?7:a.id==='pstreak10'?10:a.id==='pstreak25'?25:null);

// ---------- post-game analysis queue ----------
// Games waiting for analysis (the accuracy star needs it). It runs in the background in slices and resumes after
// leaving; partial results are saved. Entry: {id, mode, lid, level, colour, g, won, assisted, clock, evals, acc}
function queueAnalysis(S,e){ S.anq=S.anq.filter(x=>x.id!==e.id); S.anq.push(e); while(S.anq.length>6) S.anq.shift(); }
// When an analysis finishes: the player's accuracy, the best-accuracy record, the accuracy star and Perfect Game
function analysisDone(S,e,sum){ const acc=sum.acc[e.colour]; e.acc=acc; const out={acc,star:false,xp:0,ach:[]};
  if(acc!=null&&e.mode!=='tp'&&e.mode!=='pp'){ if(acc>S.rec.bestAcc) S.rec.bestAcc=acc; }
  if(e.mode==='campaign'&&e.won){ const L=levelById(e.lid), r=L?campaignAccStar(S,L,acc):null; if(r){ out.star=true; out.xp=r.xp; } }
  if(e.mode==='classic'&&e.won&&acc>=ACC_STAR) out.star=true;
  if(e.won&&acc>=90&&(e.mode==='classic'||e.mode==='campaign')){ if(!S.ach.perfect){ S.ach.perfect=Date.now(); out.ach.push('perfect'); } }
  if(e.mode==='campaign') for(const id of checkAch(S,{mode:'campaign'})) out.ach.push(id);
  return out; }

// CHESS1Z.<base64 gzip> where the app can compress, CHESS1.<base64> otherwise. Both decode here (the app inflates Z).
const b64e=str=>{ const u=new TextEncoder().encode(str); let b=''; for(let i=0;i<u.length;i++) b+=String.fromCharCode(u[i]); return btoa(b); };
const b64d=b=>new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)));
function backupPlain(S){ return 'CHESS1.'+b64e(JSON.stringify(S)); }
function parseBackup(text){ const m=/CHESS1\.([A-Za-z0-9+/=]+)/.exec(String(text||'')); if(!m) return null;
  try{ const o=JSON.parse(b64d(m[1])); if(!o||typeof o!=='object'||typeof o.xp!=='number') return null; return o; }catch(e){ return null; } }

// ---------- Arcade contract ----------
// Shared settings live in arcade.v1 (read only, never written). They're applied in memory only.
function readArcade(store){ try{ const a=JSON.parse(store.get(ARCADE_KEY)||'null'); if(!a||typeof a!=='object') return null; return a; }catch(e){ return null; } }
function applyShared(S,a){ if(!a) return S; const o=Object.assign({},S), set=a.set||{}; for(const k of SHARED) if(set[k]!==undefined) o[k]=set[k]; if(typeof a.name==='string'&&a.name) o.name=a.name; return o; }
function summary(S){ const l=levelOf(S.xp);
  return {v:1,game:GAME_ID,ver:VERSION,level:l,maxLevel:MAXL,xp:S.xp,xpLevel:l,xpNext:xpNext(S),
    ach:ACH.map(a=>[a.name,a.desc,!!S.ach[a.id]]),
    hi:[['Wins',String(S.rec.wins)],['Puzzles solved',String(S.rec.puzSolved)],['Campaign stars',`${totalStars(S)}/${LEVELS.length*3}`]],
    last:Date.now()}; }

["Rooks move in straight lines; bishops move along diagonals. Find the strong move with each.","Las torres se mueven en línea recta; los alfiles, en diagonal. Encuentra la jugada fuerte con cada uno.","Les tours vont en ligne droite ; les fous, en diagonale. Trouvez le coup fort avec chacun.","Türme ziehen gerade, Läufer diagonal. Finde mit jedem den starken Zug.","Torres andam em linha reta; bispos, na diagonal. Encontre o lance forte com cada um."],
["The queen moves like a rook and a bishop together. The knight jumps in an L shape, over anything in the way.","La dama se mueve como torre y alfil juntos. El caballo salta en forma de L, por encima de lo que haya.","La dame bouge comme une tour et un fou réunis. Le cavalier saute en L, par-dessus tout obstacle.","Die Dame zieht wie Turm und Läufer zusammen. Der Springer springt im L, über alles hinweg.","A dama se move como torre e bispo juntos. O cavalo salta em L, por cima do que houver."],
["Pawns move straight ahead and capture diagonally. The king steps one square in any direction.","Los peones avanzan recto y capturan en diagonal. El rey se mueve una casilla en cualquier dirección.","Les pions avancent tout droit et prennent en diagonale. Le roi fait un pas dans n'importe quelle direction.","Bauern ziehen geradeaus und schlagen schräg. Der König geht ein Feld in jede Richtung.","Peões avançam em frente e capturam na diagonal. O rei anda uma casa em qualquer direção."],
["King and queen against a lone king. Use the queen to shrink the king's box (a knight's move away), bring your king up, then mate on the edge. Careful: no stalemate!","Rey y dama contra rey solo. Usa la dama para encerrar al rey (a un salto de caballo), acerca tu rey y da mate en el borde. ¡Ojo con el ahogado!","Roi et dame contre roi seul. Resserrez la cage du roi avec la dame (à un saut de cavalier), approchez votre roi, puis matez au bord. Attention au pat !","König und Dame gegen einen nackten König. Engt den König mit der Dame ein (einen Springerzug entfernt), hol deinen König heran und setze am Rand matt. Vorsicht: kein Patt!","Rei e dama contra rei sozinho. Use a dama para fechar o rei (a um salto de cavalo), traga seu rei e dê mate na borda. Cuidado com o afogamento!"],
["Each puzzle is a mate in one. Look at every check.","Cada problema es un mate en una. Mira todos los jaques.","Chaque problème est un mat en un. Regardez chaque échec.","Jede Aufgabe ist ein Matt in einem Zug. Prüfe jedes Schach.","Cada problema é um mate em um. Olhe todos os xeques."],
["A full game against Pebble, the gentlest opponent. Develop your pieces, castle, and look for free captures.","Una partida completa contra Pebble, el rival más suave. Desarrolla tus piezas, enroca y busca capturas gratis.","Une partie complète contre Pebble, l'adversaire le plus doux. Développez vos pièces, roquez et cherchez les prises gratuites.","Eine ganze Partie gegen Pebble, den sanftesten Gegner. Entwickle deine Figuren, rochiere und suche freie Schlagzüge.","Uma partida completa contra Pebble, o adversário mais gentil. Desenvolva as peças, roque e procure capturas grátis."],
["This time you play Black against Twig. White moves first: answer in the centre.","Esta vez juegas con negras contra Twig. Las blancas mueven primero: responde en el centro.","Cette fois, vous jouez les Noirs contre Twig. Les Blancs commencent : répondez au centre.","Diesmal spielst du Schwarz gegen Twig. Weiß zieht zuerst: antworte im Zentrum.","Desta vez você joga de pretas contra Twig. As brancas começam: responda no centro."],
["King and rook against a lone king. Cut the king off along a rank or file, walk your king up, and push it to the edge.","Rey y torre contra rey solo. Corta al rey por una fila o columna, acerca tu rey y empújalo al borde.","Roi et tour contre roi seul. Coupez le roi sur une rangée ou une colonne, approchez votre roi et repoussez-le au bord.","König und Turm gegen einen nackten König. Schneide den König auf einer Reihe oder Linie ab, hol deinen König heran und drück ihn an den Rand.","Rei e torre contra rei sozinho. Corte o rei por uma fileira ou coluna, traga seu rei e empurre-o para a borda."],
["Something is undefended or a mate is waiting. Find it.","Algo está sin defender o hay un mate esperando. Encuéntralo.","Une pièce est sans défense ou un mat attend. Trouvez-le.","Etwas ist ungedeckt oder ein Matt wartet. Finde es.","Algo está sem defesa ou há um mate esperando. Encontre."],
["Technique: the back-rank mate. A king shut in by its own pawns can be mated by a rook or queen on the last rank.","Técnica: el mate en la última fila. Un rey encerrado por sus peones puede recibir mate de una torre o dama en la última fila.","Technique : le mat du couloir. Un roi enfermé par ses propres pions peut être maté par une tour ou une dame sur la dernière rangée.","Technik: das Grundreihenmatt. Ein von eigenen Bauern eingesperrter König kann von Turm oder Dame auf der Grundreihe mattgesetzt werden.","Técnica: o mate na última fileira. Um rei preso pelos próprios peões leva mate de torre ou dama na última fileira."],
["You start a knight up in an Italian Game. Trade pieces, keep your king safe, and turn the extra piece into a win.","Empiezas con un caballo de más en una Italiana. Cambia piezas, protege a tu rey y convierte la pieza extra en victoria.","Vous commencez avec un cavalier de plus dans une partie italienne. Échangez, mettez votre roi à l'abri et transformez la pièce en victoire.","Du beginnst in einer Italienischen Partie mit einem Springer mehr. Tausche Figuren, sichere deinen König und verwandle die Mehrfigur in einen Sieg.","Você começa com um cavalo a mais numa Italiana. Troque peças, proteja o rei e transforme a peça extra em vitória."],
["Two rooks mate on their own: one checks along a rank while the other guards the next one. Walk the king to the edge like a ladder.","Dos torres dan mate solas: una da jaque en una fila mientras la otra vigila la siguiente. Lleva al rey al borde como por una escalera.","Deux tours matent seules : l'une donne échec sur une rangée, l'autre garde la suivante. Menez le roi au bord comme une échelle.","Zwei Türme setzen allein matt: einer gibt auf einer Reihe Schach, der andere deckt die nächste. Treibe den König wie auf einer Leiter an den Rand.","Duas torres dão mate sozinhas: uma dá xeque numa fileira e a outra guarda a seguinte. Leve o rei à borda como numa escada."],
["A mix of everything so far.","Una mezcla de todo lo visto.","Un mélange de tout ce qui précède.","Eine Mischung aus allem bisher.","Uma mistura de tudo até aqui."],
["A game against Lantern with no takebacks and no hints. Check every move for loose pieces before you play it.","Una partida contra Lantern sin deshacer ni pistas. Revisa las piezas sueltas antes de cada jugada.","Une partie contre Lantern sans reprise ni indice. Vérifiez les pièces en prise avant chaque coup.","Eine Partie gegen Lantern ohne Zurücknehmen und Tipps. Prüfe vor jedem Zug, ob Figuren hängen.","Uma partida contra Lantern sem voltar lances nem dicas. Confira peças soltas antes de cada lance."],
["The Pawn campaign's finale: a full game against Lantern.","El final de la campaña Peón: una partida completa contra Lantern.","La finale de la campagne Pion : une partie complète contre Lantern.","Das Finale der Bauer-Kampagne: eine ganze Partie gegen Lantern.","O final da campanha Peão: uma partida completa contra Lantern."],
["A full game against Lantern. Control the centre and develop knights before bishops.","Una partida completa contra Lantern. Controla el centro y desarrolla los caballos antes que los alfiles.","Une partie complète contre Lantern. Contrôlez le centre et sortez les cavaliers avant les fous.","Eine ganze Partie gegen Lantern. Beherrsche das Zentrum und entwickle Springer vor Läufern.","Uma partida completa contra Lantern. Controle o centro e desenvolva cavalos antes dos bispos."],
["A fork attacks two things at once. Knights are the best at it.","Un ataque doble amenaza dos cosas a la vez. Los caballos son los mejores en eso.","Une fourchette attaque deux cibles à la fois. Les cavaliers excellent à ça.","Eine Gabel greift zwei Ziele zugleich an. Springer können das am besten.","Um garfo ataca duas coisas ao mesmo tempo. Cavalos são os melhores nisso."],
["A pinned piece can't move without exposing something more valuable behind it. Attack it again!","Una pieza clavada no puede moverse sin descubrir algo más valioso detrás. ¡Atácala otra vez!","Une pièce clouée ne peut bouger sans exposer plus précieux derrière elle. Attaquez-la encore !","Eine gefesselte Figur kann nicht ziehen, ohne Wertvolleres dahinter freizugeben. Greif sie noch einmal an!","Uma peça cravada não pode se mover sem expor algo mais valioso atrás. Ataque-a de novo!"],
["King and pawn against king. Your king in front of the pawn wins: take the opposition, escort the pawn home, promote, then mate.","Rey y peón contra rey. Tu rey delante del peón gana: toma la oposición, acompaña al peón, corona y da mate.","Roi et pion contre roi. Votre roi devant le pion gagne : prenez l'opposition, escortez le pion, promouvez, puis matez.","König und Bauer gegen König. Dein König vor dem Bauern gewinnt: nimm die Opposition, geleite den Bauern, wandle um und setze matt.","Rei e peão contra rei. Seu rei à frente do peão vence: tome a oposição, escolte o peão, promova e dê mate."],
["Mate in two: a forcing first move, then mate whatever the reply.","Mate en dos: una primera jugada forzada y luego mate responda lo que responda.","Mat en deux : un premier coup forcé, puis mat quelle que soit la réponse.","Matt in zwei: ein erzwingender erster Zug, dann Matt, egal was folgt.","Mate em dois: um primeiro lance forçado, depois mate seja qual for a resposta."],
["A full game against Brook, who rarely blunders. Make a plan and improve your worst piece.","Una partida completa contra Brook, que rara vez se equivoca. Haz un plan y mejora tu peor pieza.","Une partie complète contre Brook, qui gaffe rarement. Faites un plan et améliorez votre pire pièce.","Eine ganze Partie gegen Brook, der selten patzt. Mach einen Plan und verbessere deine schlechteste Figur.","Uma partida completa contra Brook, que raramente erra feio. Faça um plano e melhore sua pior peça."],
["A 5 + 3 game against Brook: five minutes each, three seconds added per move. Don't lose on time!","Una partida 5 + 3 contra Brook: cinco minutos cada uno y tres segundos por jugada. ¡No pierdas por tiempo!","Une partie 5 + 3 contre Brook : cinq minutes chacun, trois secondes par coup. Ne perdez pas au temps !","Eine 5-+-3-Partie gegen Brook: fünf Minuten pro Seite, drei Sekunden pro Zug. Verlier nicht auf Zeit!","Uma partida 5 + 3 contra Brook: cinco minutos cada, três segundos por lance. Não perca no tempo!"],
["Rook and pawn against rook. Use your king to shield the pawn from checks and push it home.","Torre y peón contra torre. Usa tu rey para proteger al peón de los jaques y llévalo a coronar.","Tour et pion contre tour. Abritez le pion des échecs avec votre roi et poussez-le jusqu'au bout.","Turm und Bauer gegen Turm. Schirme den Bauern mit dem König vor Schachs ab und bring ihn durch.","Torre e peão contra torre. Use o rei para proteger o peão dos xeques e leve-o à promoção."],
["A skewer attacks through a piece to the one behind; a discovered attack moves one piece to unleash another.","Una enfilada ataca a través de una pieza a la de detrás; un ataque a la descubierta mueve una pieza para liberar otra.","Une enfilade attaque à travers une pièce celle qui est derrière ; une attaque à la découverte déplace une pièce pour en libérer une autre.","Ein Spieß greift durch eine Figur die dahinter an; ein Abzugsangriff zieht eine Figur weg und entfesselt eine andere.","Um espeto ataca através de uma peça a que está atrás; um ataque descoberto move uma peça para liberar outra."],
["The fork: one piece attacks two at once. The knight jumps to give check and also attacks the queen and rook; after the king moves, it takes one of them.","El ataque doble: una pieza amenaza dos a la vez. El caballo da jaque y también ataca dama y torre; cuando el rey se mueve, captura una de ellas.","La fourchette : une pièce en attaque deux. Le cavalier donne échec et attaque aussi la dame et la tour ; après le coup du roi, il en prend une.","Die Gabel: eine Figur greift zwei an. Der Springer gibt Schach und greift zugleich Dame und Turm an; nach dem Königszug schlägt er eine davon.","O garfo: uma peça ataca duas. O cavalo dá xeque e também ataca dama e torre; depois que o rei se move, captura uma delas."],
["Technique: the fork. Find the square where one piece hits two targets.","Técnica: el ataque doble. Encuentra la casilla donde una pieza ataca dos objetivos.","Technique : la fourchette. Trouvez la case d'où une pièce frappe deux cibles.","Technik: die Gabel. Finde das Feld, von dem eine Figur zwei Ziele trifft.","Técnica: o garfo. Encontre a casa onde uma peça atinge dois alvos."],
["A Sicilian where your opponent is a knight down. Open lines and use the extra piece.","Una Siciliana donde tu rival tiene un caballo de menos. Abre líneas y usa la pieza extra.","Une sicilienne où l'adversaire a un cavalier de moins. Ouvrez des lignes et utilisez la pièce de plus.","Ein Sizilianer, in dem dem Gegner ein Springer fehlt. Öffne Linien und nutze die Mehrfigur.","Uma Siciliana em que o adversário tem um cavalo a menos. Abra linhas e use a peça extra."],
["Queen against a pawn about to promote. Check from close by to force the king in front of its pawn, then bring your king one step closer each time.","Dama contra un peón a punto de coronar. Da jaques de cerca para obligar al rey a ponerse delante de su peón y acerca tu rey cada vez.","Dame contre un pion prêt à promouvoir. Donnez des échecs de près pour forcer le roi devant son pion, puis approchez votre roi d'un pas à chaque fois.","Dame gegen einen Bauern kurz vor der Umwandlung. Gib Schachs aus der Nähe, um den König vor seinen Bauern zu zwingen, und rücke jedes Mal mit deinem König näher.","Dama contra um peão prestes a promover. Dê xeques de perto para forçar o rei à frente do peão e aproxime seu rei a cada vez."],
["Forks, pins, skewers, discoveries and mates, all mixed.","Ataques dobles, clavadas, enfiladas, descubiertas y mates, todo mezclado.","Fourchettes, clouages, enfilades, découvertes et mats, tout mélangé.","Gabeln, Fesselungen, Spieße, Abzüge und Matts, alles gemischt.","Garfos, cravadas, espetos, descobertos e mates, tudo misturado."],
["Chess960 against Falcon: the back rank is shuffled, so no opening book. Think from move one.","Chess960 contra Falcon: la primera fila está mezclada, así que no hay libro de aperturas. Piensa desde la primera jugada.","Chess960 contre Falcon : la première rangée est mélangée, donc pas de théorie. Réfléchissez dès le premier coup.","Chess960 gegen Falcon: die Grundreihe ist gemischt, also keine Eröffnungstheorie. Denk ab dem ersten Zug.","Chess960 contra Falcon: a primeira fileira é embaralhada, então não há livro de aberturas. Pense desde o primeiro lance."],
["The Knight campaign's finale: a full game against Falcon.","El final de la campaña Caballo: una partida completa contra Falcon.","La finale de la campagne Cavalier : une partie complète contre Falcon.","Das Finale der Springer-Kampagne: eine ganze Partie gegen Falcon.","O final da campanha Cavalo: uma partida completa contra Falcon."],
["A full game against Falcon, who knows its openings.","Una partida completa contra Falcon, que conoce sus aperturas.","Une partie complète contre Falcon, qui connaît ses ouvertures.","Eine ganze Partie gegen Falcon, der seine Eröffnungen kennt.","Uma partida completa contra Falcon, que conhece suas aberturas."],
["Mate in three. Checks, captures and threats: calculate every forcing line.","Mate en tres. Jaques, capturas y amenazas: calcula cada línea forzada.","Mat en trois. Échecs, prises et menaces : calculez chaque ligne forcée.","Matt in drei. Schachs, Schlagzüge und Drohungen: berechne jede erzwingende Variante.","Mate em três. Xeques, capturas e ameaças: calcule cada linha forçada."],
["Discoveries, deflections and decoys.","Descubiertas, desviaciones y señuelos.","Découvertes, déviations et attractions.","Abzüge, Ablenkungen und Hinlenkungen.","Descobertos, desvios e atrações."],
["The hardest basic mate: bishop and knight. Drive the king to a corner of your bishop's colour and keep it there. You have fifty moves.","El mate básico más difícil: alfil y caballo. Lleva al rey a una esquina del color de tu alfil y mantenlo ahí. Tienes cincuenta jugadas.","Le mat élémentaire le plus dur : fou et cavalier. Menez le roi dans un coin de la couleur de votre fou et gardez-l'y. Vous avez cinquante coups.","Das schwerste Grundmatt: Läufer und Springer. Treibe den König in eine Ecke von der Farbe deines Läufers und halte ihn dort. Du hast fünfzig Züge.","O mate básico mais difícil: bispo e cavalo. Leve o rei a um canto da cor do seu bispo e mantenha-o lá. Você tem cinquenta lances."],
["Hard puzzles, any theme.","Problemas difíciles, de cualquier tema.","Problèmes difficiles, tous thèmes.","Schwere Aufgaben, jedes Thema.","Problemas difíceis, qualquer tema."],
["A full game against Tower, who calculates deep and never blunders.","Una partida completa contra Tower, que calcula hondo y nunca se equivoca feo.","Une partie complète contre Tower, qui calcule loin et ne gaffe jamais.","Eine ganze Partie gegen Tower, der tief rechnet und nie patzt.","Uma partida completa contra Tower, que calcula fundo e nunca erra feio."],
["You play Black against Tower.","Juegas con negras contra Tower.","Vous jouez les Noirs contre Tower.","Du spielst Schwarz gegen Tower.","Você joga de pretas contra Tower."],
["The Lucena position: build a bridge. Bring your rook to the fourth rank so it can block the checks, then walk the king out.","La posición de Lucena: construye el puente. Lleva tu torre a la cuarta fila para tapar los jaques y luego saca al rey.","La position de Lucena : construisez le pont. Amenez votre tour sur la quatrième rangée pour couvrir les échecs, puis sortez le roi.","Die Lucena-Stellung: baue die Brücke. Bring deinen Turm auf die vierte Reihe, damit er die Schachs abblocken kann, und führe dann den König heraus.","A posição de Lucena: construa a ponte. Leve sua torre à quarta fileira para bloquear os xeques e depois tire o rei."],
["Expert puzzles.","Problemas de experto.","Problèmes d'expert.","Expertenaufgaben.","Problemas de especialista."],
["Technique: deflection. Force a defender away from the square or line it guards.","Técnica: la desviación. Obliga a un defensor a abandonar la casilla o línea que vigila.","Technique : la déviation. Forcez un défenseur à quitter la case ou la ligne qu'il garde.","Technik: die Ablenkung. Zwinge einen Verteidiger weg von dem Feld oder der Linie, die er deckt.","Técnica: o desvio. Force um defensor a abandonar a casa ou linha que guarda."],
["A Queen's Gambit where Tower is a knight down. Converting against a strong defender takes patience.","Un Gambito de Dama donde Tower tiene un caballo de menos. Convertir contra un buen defensor requiere paciencia.","Un gambit dame où Tower a un cavalier de moins. Convertir contre un bon défenseur demande de la patience.","Ein Damengambit, in dem Tower ein Springer fehlt. Gegen einen starken Verteidiger braucht die Verwertung Geduld.","Um Gambito da Dama em que Tower tem um cavalo a menos. Converter contra um bom defensor exige paciência."],
["Defend! Rook against rook and pawn. Keep your rook on your third rank (the sixth) until the pawn steps onto it, then check from behind. Hold for 25 moves.","¡Defiende! Torre contra torre y peón. Mantén tu torre en tu tercera fila (la sexta) hasta que el peón llegue a ella; luego da jaques desde atrás. Aguanta 25 jugadas.","Défendez ! Tour contre tour et pion. Gardez votre tour sur votre troisième rangée (la sixième) jusqu'à ce que le pion y arrive, puis donnez des échecs par derrière. Tenez 25 coups.","Verteidige! Turm gegen Turm und Bauer. Halte deinen Turm auf deiner dritten Reihe (der sechsten), bis der Bauer sie betritt, und gib dann Schach von hinten. Halte 25 Züge.","Defenda! Torre contra torre e peão. Mantenha a torre na sua terceira fileira (a sexta) até o peão chegar nela; depois dê xeques por trás. Resista 25 lances."],
["The hardest puzzles in the bank.","Los problemas más difíciles del banco.","Les problèmes les plus durs de la banque.","Die schwersten Aufgaben der Sammlung.","Os problemas mais difíceis do banco."],
["Chess960 against Sage, with no takebacks and no hints.","Chess960 contra Sage, sin deshacer ni pistas.","Chess960 contre Sage, sans reprise ni indice.","Chess960 gegen Sage, ohne Zurücknehmen und Tipps.","Chess960 contra Sage, sem voltar lances nem dicas."],
["The grand finale: a full game against Titan, as strong as our engine gets.","La gran final: una partida completa contra Titan, lo más fuerte de nuestro motor.","La grande finale : une partie complète contre Titan, le plus fort de notre moteur.","Das große Finale: eine ganze Partie gegen Titan, so stark wie unsere Engine nur kann.","A grande final: uma partida completa contra Titan, o mais forte do nosso motor."],
["Back-rank mate: the king is shut in by its own pawns, so a rook or queen on the back rank gives mate (Ra8#).","Mate en la última fila: el rey está encerrado por sus peones, así que una torre o dama en la última fila da mate (Ra8#).","Mat du couloir : le roi est enfermé par ses pions, donc une tour ou une dame sur la dernière rangée mate (Ra8#).","Grundreihenmatt: Der König ist von eigenen Bauern eingesperrt, also setzt ein Turm oder eine Dame auf der Grundreihe matt (Ra8#).","Mate na última fileira: o rei está preso pelos próprios peões, então uma torre ou dama na última fileira dá mate (Ra8#)."],
["Deflection: force a defender away from its job. The queen sacrifice on d8 drags the rook away, and the white rook then mates on the back rank.","Desviación: aparta a un defensor de su tarea. El sacrificio de dama en d8 arrastra a la torre, y la torre blanca da mate en la última fila.","Déviation : détournez un défenseur de sa tâche. Le sacrifice de dame en d8 attire la tour, et la tour blanche mate sur la dernière rangée.","Ablenkung: lenke einen Verteidiger von seiner Aufgabe ab. Das Damenopfer auf d8 zieht den Turm weg, und der weiße Turm setzt auf der Grundreihe matt.","Desvio: afaste um defensor da sua tarefa. O sacrifício de dama em d8 arrasta a torre, e a torre branca dá mate na última fileira."],

["This code holds your Chess progress: XP, stars, records, achievements, settings, 2-Player games and games in progress. Keep it somewhere safe.","Este código guarda tu progreso de Chess: XP, estrellas, récords, logros, ajustes, partidas de 2 jugadores y partidas en curso. Guárdalo en un lugar seguro.","Ce code contient votre progression Chess : XP, étoiles, records, succès, réglages, parties à 2 et parties en cours. Gardez-le en lieu sûr.","Dieser Code enthält deinen Chess-Fortschritt: XP, Sterne, Rekorde, Erfolge, Einstellungen, 2-Spieler-Partien und laufende Partien. Bewahre ihn sicher auf.","Este código guarda seu progresso no Chess: XP, estrelas, recordes, conquistas, ajustes, partidas de 2 jogadores e partidas em andamento. Guarde em lugar seguro."],
