["Checkmate the enemy king: attack it so it has no escape. Each piece moves its own way; pawns promote on the last rank; castling, en passant and the draw rules (stalemate, threefold repetition, fifty moves, not enough material) all apply.","Da jaque mate al rey rival: atácalo sin que tenga escapatoria. Cada pieza se mueve a su manera; los peones coronan en la última fila; se aplican el enroque, la captura al paso y las reglas de tablas (ahogado, triple repetición, cincuenta jugadas, material insuficiente).","Matez le roi adverse : attaquez-le sans issue. Chaque pièce a sa marche ; les pions se promeuvent sur la dernière rangée ; roque, prise en passant et règles de nulle (pat, triple répétition, cinquante coups, matériel insuffisant) s'appliquent.","Setze den gegnerischen König matt: greif ihn an, sodass er nicht entkommt. Jede Figur zieht auf ihre Weise; Bauern wandeln auf der letzten Reihe um; Rochade, En passant und die Remisregeln (Patt, dreifache Wiederholung, 50 Züge, zu wenig Material) gelten.","Dê xeque-mate no rei adversário: ataque-o sem que tenha saída. Cada peça anda do seu jeito; peões promovem na última fileira; valem roque, en passant e as regras de empate (afogamento, tripla repetição, cinquenta lances, material insuficiente)."],
["Moving","Mover","Déplacer","Ziehen","Mover"],
["Tap a piece, then a square (dots show where it can go; rings show captures), or drag it. On a keyboard, type the move (e4, Nf3, O-O) and press Enter. Arrows step through the moves; F flips the board; H gives a hint; U takes back; P or Esc pauses.","Toca una pieza y luego una casilla (los puntos muestran adónde puede ir; los anillos, capturas), o arrástrala. Con teclado, escribe la jugada (e4, Nf3, O-O) y pulsa Intro. Las flechas recorren las jugadas; F gira el tablero; H da una pista; U deshace; P o Esc pausa.","Touchez une pièce puis une case (les points montrent où elle peut aller ; les anneaux, les prises), ou faites-la glisser. Au clavier, tapez le coup (e4, Nf3, O-O) puis Entrée. Les flèches parcourent les coups ; F pivote l'échiquier ; H donne un indice ; U reprend ; P ou Échap met en pause.","Tippe auf eine Figur, dann auf ein Feld (Punkte zeigen Ziele, Ringe Schlagzüge), oder zieh sie. Auf der Tastatur tippst du den Zug (e4, Nf3, O-O) und drückst Enter. Pfeile blättern durch die Züge; F dreht das Brett; H gibt einen Tipp; U nimmt zurück; P oder Esc pausiert.","Toque numa peça e depois numa casa (pontos mostram aonde pode ir; anéis, capturas), ou arraste-a. No teclado, digite o lance (e4, Nf3, O-O) e tecle Enter. As setas percorrem os lances; F gira o tabuleiro; H dá uma dica; U volta; P ou Esc pausa."],
["Eight strengths, from Pebble (about 400) to Titan (as strong as our engine gets). Ratings are rough labels from our own self-play tests, not official ratings. ★ win · ★ no assists (hints and takebacks are assists) · ★ accuracy 75% or more.","Ocho niveles, de Pebble (unos 400) a Titan (lo más fuerte de nuestro motor). Las cifras son etiquetas aproximadas de nuestras propias pruebas, no puntuaciones oficiales. ★ victoria · ★ sin ayudas (pistas y deshacer son ayudas) · ★ precisión del 75% o más.","Huit niveaux, de Pebble (environ 400) à Titan (le plus fort de notre moteur). Les classements sont des repères issus de nos propres tests, pas des classements officiels. ★ victoire · ★ sans aide (indices et reprises sont des aides) · ★ précision de 75 % ou plus.","Acht Stärken, von Pebble (etwa 400) bis Titan (so stark wie unsere Engine nur kann). Die Wertungen sind grobe Angaben aus eigenen Tests, keine offiziellen Wertungen. ★ Sieg · ★ ohne Hilfen (Tipps und Zurücknehmen sind Hilfen) · ★ Genauigkeit 75 % oder mehr.","Oito níveis, de Pebble (cerca de 400) a Titan (o mais forte do nosso motor). Os números são rótulos aproximados dos nossos próprios testes, não ratings oficiais. ★ vitória · ★ sem ajudas (dicas e voltar lances são ajudas) · ★ precisão de 75% ou mais."],
["After a game the engine reviews every move. Each move gets a class (best, good, inaccuracy, mistake, blunder) from how much it lowered your winning chances, and your accuracy is the average.","Tras la partida, el motor revisa cada jugada. Cada una recibe una clase (mejor, buena, imprecisión, error, error grave) según cuánto bajó tus opciones de ganar, y tu precisión es la media.","Après la partie, le moteur revoit chaque coup. Chacun reçoit une catégorie (meilleur, bon, imprécision, erreur, gaffe) selon la baisse de vos chances de gain, et votre précision est la moyenne.","Nach der Partie prüft die Engine jeden Zug. Jeder bekommt eine Klasse (bester, gut, Ungenauigkeit, Fehler, Patzer) danach, wie stark er deine Gewinnchancen gesenkt hat; deine Genauigkeit ist der Durchschnitt.","Depois da partida, o motor revisa cada lance. Cada um recebe uma classe (melhor, bom, imprecisão, erro, erro grave) conforme o quanto baixou suas chances de vencer, e sua precisão é a média."],
["The back rank is shuffled into one of 960 positions (the same for both sides, bishops on opposite colours, the king between the rooks). Castling puts the king and rook on the usual squares (g and f, or c and d) wherever they started. To castle, move the king onto its own rook.","La primera fila se mezcla en una de 960 posiciones (igual para ambos bandos, alfiles en colores opuestos, el rey entre las torres). El enroque deja rey y torre en las casillas habituales (g y f, o c y d) empiecen donde empiecen. Para enrocar, mueve el rey sobre su propia torre.","La première rangée est mélangée en une des 960 positions (la même des deux côtés, fous de couleurs opposées, roi entre les tours). Le roque place roi et tour sur les cases habituelles (g et f, ou c et d) où qu'ils soient partis. Pour roquer, posez le roi sur sa propre tour.","Die Grundreihe wird zu einer von 960 Stellungen gemischt (für beide Seiten gleich, Läufer auf verschiedenen Farben, König zwischen den Türmen). Die Rochade stellt König und Turm auf die üblichen Felder (g und f oder c und d), egal wo sie standen. Zum Rochieren zieh den König auf den eigenen Turm.","A primeira fileira é embaralhada em uma de 960 posições (igual para os dois lados, bispos em cores opostas, rei entre as torres). O roque põe rei e torre nas casas de sempre (g e f, ou c e d), onde quer que tenham começado. Para rocar, mova o rei sobre a própria torre."],
["Find the best move; the computer plays the replies. Any move that also mates counts. ★ solved · ★ first try · ★ no hints. A first hint shows the piece to move, a second shows the move.","Encuentra la mejor jugada; el ordenador responde. Cualquier jugada que también dé mate vale. ★ resuelto · ★ al primer intento · ★ sin pistas. La primera pista muestra la pieza; la segunda, la jugada.","Trouvez le meilleur coup ; l'ordinateur répond. Tout coup qui mate aussi compte. ★ résolu · ★ du premier coup · ★ sans indice. Un premier indice montre la pièce, un second le coup.","Finde den besten Zug; der Computer antwortet. Jeder Zug, der ebenfalls mattsetzt, zählt. ★ gelöst · ★ im ersten Versuch · ★ ohne Tipps. Ein erster Tipp zeigt die Figur, ein zweiter den Zug.","Encontre o melhor lance; o computador responde. Qualquer lance que também dê mate vale. ★ resolvido · ★ de primeira · ★ sem dicas. A primeira dica mostra a peça; a segunda, o lance."],

["The same puzzle for everyone, rated about 800–1100 on Monday up to 2100–2400 on Sunday. One scored attempt, then unlimited practice.","El mismo problema para todos, de nivel 800–1100 el lunes hasta 2100–2400 el domingo. Un intento puntuable y luego práctica ilimitada.","Le même problème pour tous, classé environ 800–1100 le lundi jusqu'à 2100–2400 le dimanche. Un essai noté, puis entraînement illimité.","Dieselbe Aufgabe für alle, Wertung etwa 800–1100 am Montag bis 2100–2400 am Sonntag. Ein gewerteter Versuch, dann unbegrenzt üben.","O mesmo problema para todos, nível 800–1100 na segunda até 2100–2400 no domingo. Uma tentativa valendo, depois treino ilimitado."],
["Pass-and-play on one device, or share codes: each move makes a code to send; paste the reply to continue. Codes aren't secret, so it's friendly play.","Por turnos en un dispositivo o con códigos: cada jugada genera un código para enviar; pega la respuesta para seguir. Los códigos no son secretos, así que es juego amistoso.","Chacun son tour sur un appareil, ou par codes : chaque coup crée un code à envoyer ; collez la réponse pour continuer. Les codes ne sont pas secrets : c'est amical.","Abwechselnd auf einem Gerät oder per Code: jeder Zug erzeugt einen Code zum Verschicken; füge die Antwort ein, um weiterzuspielen. Codes sind nicht geheim, also freundschaftlich.","Passando o aparelho ou por códigos: cada lance gera um código para enviar; cole a resposta para continuar. Os códigos não são secretos, então é jogo amistoso."],

["Puzzles come from the Lichess puzzle database (database.lichess.org), released into the public domain (CC0). Thank you, Lichess.","Los problemas vienen de la base de datos de problemas de Lichess (database.lichess.org), de dominio público (CC0). Gracias, Lichess.","Les problèmes viennent de la base de problèmes de Lichess (database.lichess.org), dans le domaine public (CC0). Merci, Lichess.","Die Aufgaben stammen aus der Lichess-Aufgabendatenbank (database.lichess.org), gemeinfrei (CC0). Danke, Lichess.","Os problemas vêm da base de problemas do Lichess (database.lichess.org), em domínio público (CC0). Obrigado, Lichess."],
["First playable demo: play the computer at 8 strengths, with a colour choice, an optional clock and Chess960.","Primera demo jugable: juega contra el ordenador en 8 niveles, eligiendo color, con reloj opcional y Chess960.","Première démo jouable : affrontez l'ordinateur sur 8 niveaux, avec choix de couleur, pendule facultative et Chess960.","Erste spielbare Demo: gegen den Computer in 8 Stärken, mit Farbwahl, optionaler Uhr und Chess960.","Primeira demo jogável: jogue contra o computador em 8 níveis, com escolha de cor, relógio opcional e Chess960."],
["Puzzles from the Lichess puzzle database, by difficulty or theme, plus a Puzzle Streak that gets harder as you go.","Problemas de la base de Lichess, por dificultad o tema, más una racha que se vuelve más difícil.","Des problèmes de la base Lichess, par difficulté ou thème, et une série qui se corse au fil des réussites.","Aufgaben aus der Lichess-Datenbank, nach Schwierigkeit oder Thema, dazu eine Serie, die immer schwerer wird.","Problemas da base do Lichess, por dificuldade ou tema, mais uma sequência que fica mais difícil."],
["Three campaigns of 15 levels: puzzle sets, endgame drills, position games and games against rising strengths.","Tres campañas de 15 niveles: series de problemas, ejercicios de final, partidas desde posición y partidas contra niveles crecientes.","Trois campagnes de 15 niveaux : séries de problèmes, exercices de finale, parties depuis une position et parties contre des niveaux croissants.","Drei Kampagnen mit je 15 Levels: Aufgabenserien, Endspielübungen, Partien aus Stellungen und Partien gegen steigende Stärken.","Três campanhas de 15 níveis: séries de problemas, treinos de final, partidas de posição e partidas contra níveis crescentes."],
["A Daily puzzle, the same for everyone, easier on Monday and harder on Sunday.","Un problema diario, igual para todos, más fácil el lunes y más difícil el domingo.","Un problème du jour, le même pour tous, plus facile le lundi et plus dur le dimanche.","Eine Tagesaufgabe, für alle gleich, montags leichter und sonntags schwerer.","Um problema diário, igual para todos, mais fácil na segunda e mais difícil no domingo."],
["2-Player: pass-and-play, or share codes that carry the whole game (and your Arcade avatar).","2 jugadores: por turnos o con códigos que llevan toda la partida (y tu avatar del Arcade).","2 joueurs : chacun son tour, ou des codes qui transportent toute la partie (et votre avatar de l'Arcade).","2 Spieler: abwechselnd oder per Code, der die ganze Partie (und deinen Arcade-Avatar) enthält.","2 jogadores: passando o aparelho ou com códigos que levam a partida inteira (e seu avatar do Arcade)."],
["Post-game analysis: every move classified, an evaluation graph and your accuracy.","Análisis tras la partida: cada jugada clasificada, una gráfica de evaluación y tu precisión.","Analyse d'après-partie : chaque coup classé, une courbe d'évaluation et votre précision.","Analyse nach der Partie: jeder Zug eingestuft, eine Bewertungskurve und deine Genauigkeit.","Análise pós-partida: cada lance classificado, um gráfico de avaliação e sua precisão."],
["Our own engine, our own pieces and boards, and original music: Study and Gambit, plus Sweep's Daylight.","Nuestro propio motor, nuestras piezas y tableros, y música original: Study y Gambit, más Daylight de Sweep.","Notre propre moteur, nos pièces et échiquiers, et de la musique originale : Study et Gambit, plus Daylight de Sweep.","Eigene Engine, eigene Figuren und Bretter und eigene Musik: Study und Gambit, dazu Sweeps Daylight.","Nosso próprio motor, nossas peças e tabuleiros, e música original: Study e Gambit, mais Daylight do Sweep."],

["The Lichess puzzle database (database.lichess.org), public domain (CC0). Each puzzle keeps its Lichess id.","La base de problemas de Lichess (database.lichess.org), de dominio público (CC0). Cada problema conserva su id de Lichess.","La base de problèmes de Lichess (database.lichess.org), domaine public (CC0). Chaque problème garde son identifiant Lichess.","Die Lichess-Aufgabendatenbank (database.lichess.org), gemeinfrei (CC0). Jede Aufgabe behält ihre Lichess-ID.","A base de problemas do Lichess (database.lichess.org), domínio público (CC0). Cada problema mantém seu id do Lichess."],

const CHANGES=[{v:'0.1.0',d:'2026-11-26',n:['First playable demo: play the computer at 8 strengths, with a colour choice, an optional clock and Chess960.','Puzzles from the Lichess puzzle database, by difficulty or theme, plus a Puzzle Streak that gets harder as you go.','Three campaigns of 15 levels: puzzle sets, endgame drills, position games and games against rising strengths.','A Daily puzzle, the same for everyone, easier on Monday and harder on Sunday.','2-Player: pass-and-play, or share codes that carry the whole game (and your Arcade avatar).','Post-game analysis: every move classified, an evaluation graph and your accuracy.','Our own engine, our own pieces and boards, and original music: Study and Gambit, plus Sweep\'s Daylight.']}];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const buzz=p=>{ if(!P.haptics) return; try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} };

const tq=[]; let tBusy=false, tTimer=0, tCur='';

function nextToast(){ const m=tq.shift(); if(!m){ tBusy=false; tCur=''; return; } const el=$('#toast'); tBusy=true; tCur=m; el.textContent=m; el.classList.add('on'); clearTimeout(tTimer);
  tTimer=setTimeout(()=>{ el.classList.remove('on'); tTimer=setTimeout(nextToast,420); },2400); }

// ---------- translations (Sweep's watcher: every visible text node is translated as it appears) ----------
const LANGS=[['auto','Automatic'],['en','English'],['es','Español'],['fr','Français'],['de','Deutsch'],['pt','Português']];
let LANG='en', DICT=null, PATS=[];
const escRe=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function setLang(){ const pref=P.lang||'auto'; let l=pref==='auto'?String(navigator.language||'en').slice(0,2).toLowerCase():pref;
  const col=(typeof I18N_LANGS!=='undefined')?I18N_LANGS.indexOf(l):-1; if(col<1) l='en'; LANG=l; DICT=null; PATS=[]; document.documentElement.lang=l;
  if(l==='en') return; DICT=new Map();

    if(row[0].includes('{')){ const parts=row[0].split(/(\{\d\})/), idx=[]; let re='^';
      for(const pt of parts){ const m=pt.match(/^\{(\d)\}$/); if(m){ re+='(.+?)'; idx.push(+m[1]); } else re+=escRe(pt); }
      PATS.push({re:new RegExp(re+'$','s'),idx,out:v,lit:parts[0],len:row[0].replace(/\{\d\}/g,'').length}); } }
  PATS.sort((a,b)=>b.len-a.len);

let DICTV=null, DICTVP=[];

function tr(text){ if(!DICT||text==null) return null; const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(text), core=m[2].replace(/\s+/g,' ');
  if(!core||!/[A-Za-z]/.test(core)) return null; let o=DICT.get(core);
  if(o==null) for(const Q of PATS){ if(Q.lit&&!core.startsWith(Q.lit)) continue; const mm=Q.re.exec(core); if(!mm) continue;
    const args=[]; Q.idx.forEach((n,i)=>args[n]=mm[i+1]); o=Q.out.replace(/\{(\d)\}/g,(_,n)=>{ const a=args[n]||''; const t=tr(a); return t!=null?t.trim():a; }); break; }
  if(o==null&&core.includes(' · ')){ let any=false; const parts=core.split(' · ').map(x=>{ const t=tr(x); if(t!=null){ any=true; return t; } return x; }); if(any) o=parts.join(' · '); }
  return o==null?null:m[1]+o+m[3]; }
const T=t=>{ const o=tr(t); return o==null?t:o; };
const SKIP=new Set(['SCRIPT','STYLE','TEXTAREA','INPUT']); const done=new WeakMap();
// the board, the move list and notation are never translated (move notation stays standard)

function trNode(n){ const v=n.nodeValue; if(done.get(n)===v||!n.isConnected) return; const p=n.parentNode; if(p&&(SKIP.has(p.nodeName)||p.closest&&p.closest(NOTR))){ done.set(n,v); return; }
  const t=tr(v); if(t!=null&&t!==v) n.nodeValue=t; else if(t==null&&window.__i18nMiss&&/[A-Za-z]{2}/.test(v)&&!known(v)) window.__i18nMiss.add(v.trim()); done.set(n,n.nodeValue); }

  if(root.closest&&root.closest('#board,#pcs,#mlist')) return;

// ===================== AUDIO (Web Audio, synthesized live) =====================
const AU={};
function buildAudio(c){
  AU.ctx=c; AU.master=c.createGain(); AU.master.gain.value=.9; AU.master.connect(c.destination);
  AU.sfx=c.createGain(); AU.sfx.gain.value=1; AU.sfx.connect(AU.master);
  AU.mus=c.createGain(); AU.mus.gain.value=0;
  AU.musLP=c.createBiquadFilter(); AU.musLP.type='lowpass'; AU.musLP.frequency.value=3200;
  AU.mus.connect(AU.musLP); AU.musLP.connect(AU.master);
  AU.amb=c.createGain(); AU.amb.gain.value=0; AU.amb.connect(AU.master);
  AU.dly=c.createDelay(1); AU.dly.delayTime.value=.375;
  AU.fb=c.createGain(); AU.fb.gain.value=.3; const dl=c.createBiquadFilter(); dl.type='lowpass'; dl.frequency.value=2000;
  AU.dly.connect(dl); dl.connect(AU.fb); AU.fb.connect(AU.dly); dl.connect(AU.mus);
  AU.send=c.createGain(); AU.send.gain.value=.45; AU.send.connect(AU.dly);
  const len=c.sampleRate*2, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; AU.noise=b;
  const bb=c.createBuffer(1,len,c.sampleRate), bd=bb.getChannelData(0); let last=0; for(let i=0;i<len;i++){ last=(last+.02*(Math.random()*2-1))/1.02; bd[i]=last*3.5; } AU.brown=bb; }
function audio(){ if(!AU.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; try{ buildAudio(new C()); }catch(e){ return null; } }
  if(AU.ctx.state==='suspended'&&!document.hidden) AU.ctx.resume().catch(()=>{}); return AU.ctx; }
const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(o){ const c=AU.ctx, t=(o.at!=null?o.at:c.currentTime)+(o.t||0), d=o.d||.12, v=o.v||.2, a=o.a||.005, h=o.hold||0;
  const osc=c.createOscillator(), g=c.createGain(); osc.type=o.type||'sine'; osc.frequency.setValueAtTime(o.f,t);
  if(o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2,t+(o.glide||d)); if(o.det) osc.detune.value=o.det;
  g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(v,t+a); if(h) g.gain.setValueAtTime(v,t+a+h); g.gain.exponentialRampToValueAtTime(.0001,t+a+h+d);
  let n=osc; if(o.lp){ const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.lp; osc.connect(f); n=f; }
  n.connect(g); g.connect(o.dest||AU.sfx); if(o.send) g.connect(o.send); osc.start(t); osc.stop(t+a+h+d+.05); }
function noise(o){ const c=AU.ctx, t=(o.at!=null?o.at:c.currentTime)+(o.t||0), d=o.d||.1;
  const s=c.createBufferSource(); s.buffer=o.brown?AU.brown:AU.noise; const f=c.createBiquadFilter(); f.type=o.ft||'lowpass';
  f.frequency.setValueAtTime(o.f||1000,t); if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2,t+d); f.Q.value=o.q||.7;
  const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(o.v||.2,t+(o.a||.002)); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.loop=true; s.connect(f); f.connect(g); g.connect(o.dest||AU.sfx); s.start(t,Math.random()*1.5); s.stop(t+d+.05); }
// Sound packs: Wood (default; a piece set down on a wooden board), Felt (soft, muffled), Chiptune (square waves).
function sfx(name,arg,pack){ if(!P.sfx&&!pack) return; const c=audio(); if(!c) return; const pk=pack||look('sound'), chip=pk==='chip', felt=pk==='felt', sq=chip?'square':'triangle', vv=chip?.4:1;
  const knock=(t,v,hi)=>{ if(chip){ tone({t,f:hi?520:330,f2:hi?260:180,d:.06,v:.12*v,type:'square'}); return; }
    if(felt){ noise({t,d:.07,v:.16*v,ft:'lowpass',f:520,q:.5}); tone({t,f:hi?140:110,d:.06,v:.12*v,type:'sine'}); return; }
    noise({t,d:.05,v:.22*v,ft:'bandpass',f:hi?2100:1500,q:1.4}); tone({t,f:hi?250:190,f2:hi?160:130,d:.07,v:.16*v,type:'sine'}); };
  switch(name){
  case 'click': tone({f:chip?1760:1500,d:.025,v:.05*vv,type:chip?'square':'sine'}); return;
  case 'tap': tone({f:chip?1320:1150,d:.02,v:.025*vv,type:chip?'square':'sine'}); return;
  case 'move': knock(0,1,false); return;
  case 'capture': knock(0,1.3,true); knock(.045,.8,false); return;
  case 'castle': knock(0,.9,false); knock(.11,.9,false); return;
  case 'check': knock(0,1,true); [76,83].forEach((m,i)=>tone({f:hz(m),t:.03+i*.06,d:.14,v:.05*vv,type:chip?'square':'sine'})); return;
  case 'promote': knock(0,1,false); [72,76,79,84].forEach((m,i)=>tone({f:hz(m),t:.05+i*.05,d:.2,v:.05*vv,type:chip?'square':'sine',send:AU.send})); return;
  case 'mate': knock(0,1.4,true); [60,55,48].forEach((m,i)=>tone({f:hz(m),t:.08+i*.11,d:.45,v:.09*vv,type:sq})); return;
  case 'tick': tone({f:chip?1400:1900,d:.02,v:.03*vv,type:chip?'square':'sine'}); return;
  case 'hint': [84,88,91].forEach((m,i)=>tone({f:hz(m),t:i*.05,d:.3,v:.05,type:'sine',send:AU.send})); return;
  case 'right': [76,83].forEach((m,i)=>tone({f:hz(m),t:i*.07,d:.22,v:.06*vv,type:chip?'square':'sine'})); return;
  case 'bad': tone({f:220,f2:170,d:.16,v:.08*vv,type:sq}); return;
  case 'lose': [67,63,60].forEach((m,i)=>tone({f:hz(m),t:i*.14,d:.3,v:.07*vv,type:sq})); return;
  case 'draw': [67,67].forEach((m,i)=>tone({f:hz(m),t:i*.16,d:.25,v:.06*vv,type:sq})); return;
  case 'level': [79,84,88,91].forEach((m,i)=>tone({f:hz(m),t:i*.08,d:.3,v:.09*vv,type:sq})); return;
  case 'win': [72,76,79,84,88,91].forEach((m,i)=>tone({f:hz(m),t:i*.08,d:i===5?.8:.25,v:.09*vv,type:sq,send:AU.send})); tone({f:hz(48),d:.9,v:.15}); return;
  case 'star': tone({f:hz(84+(arg||0)*2),d:.3,v:.08,type:'sine',send:AU.send}); return;
  case 'topple': noise({t:.75,d:.18,v:.2,ft:'bandpass',f:900,q:1}); tone({t:.75,f:150,f2:80,d:.2,v:.18}); return; } }

const SONGS={study:STUDY,gambit:GAMBIT,daylight:DAYLIGHT}; let SG=STUDY;
const MUSVOL=.32;
const bell=(t,m,v,len,D)=>{ tone({at:t,f:hz(m),a:.006,d:Math.max(.5,len),v,type:'sine',dest:D,send:AU.send}); tone({at:t,f:hz(m+12),a:.004,d:.25,v:v*.22,type:'sine',dest:D}); tone({at:t,f:hz(m)*2.76,d:.12,v:v*.06,type:'sine',dest:D}); };
function musicStep(step,t,sd){ const bar=step>>4, s=step&15, D=AU.mus;
  if(SG.style==='day'){ const BP={0:0,6:0,8:7,11:0,14:12}; if(s&1) t+=sd*.14;
    if(s===0||s===8||(s===10&&bar%2===1)) tone({at:t,f:110,f2:42,glide:.12,d:.22,v:.5,dest:D});
    if(s===4||s===12) noise({at:t,d:.07,v:.08,ft:'bandpass',f:1900,q:1.2,dest:D});
    if(s%4===2) noise({at:t,d:.035,v:.055,ft:'highpass',f:7500,dest:D});
    if(s in BP) tone({at:t,f:hz(SG.bass[bar]+BP[s]),d:.26,v:.2,type:'triangle',lp:900,dest:D});
    if(s===0) for(const m of SG.chords[bar]) for(const det of [-7,7]) tone({at:t,f:hz(m),det,a:.35,hold:sd*16-.6,d:.6,v:.02,type:'triangle',lp:1400,dest:D});
    for(const [st,m,len] of SG.mel[bar]) if(st===s){ tone({at:t,f:hz(m),d:Math.max(.18,len*sd*1.2),v:.07,dest:D,send:AU.send}); tone({at:t,f:hz(m+12),d:.06,v:.014,type:'triangle',dest:D}); }
    return; }
  if(SG.style==='lofi'){ if(s&1) t+=sd*.18;
    if(s===0||s===10) tone({at:t,f:95,f2:45,glide:.1,d:.25,v:.38,dest:D});
    if(s===4||s===12) noise({at:t,d:.05,v:.05,ft:'bandpass',f:1500,q:2,dest:D});
    if(s%4===2) noise({at:t,d:.03,v:.03,ft:'highpass',f:7000,dest:D});
    if(s===0||s===7) tone({at:t,f:hz(SG.bass[bar]),d:.6,v:.2,type:'sine',lp:400,dest:D});
    if(s===2||s===6||s===11) SG.chords[bar].forEach((m,i)=>tone({at:t+i*.012,f:hz(m+12),a:.003,d:.3,v:.011,type:'triangle',lp:2000,dest:D}));
    if(s===0) for(const m of SG.chords[bar]) tone({at:t,f:hz(m),a:.4,hold:sd*12,d:.8,v:.009,type:'sine',dest:D});
    for(const [st,m,len] of SG.mel[bar]) if(st===s) tone({at:t,f:hz(m),a:.01,d:Math.max(.3,len*sd),v:.045,type:'triangle',lp:2200,dest:D,send:AU.send});
    return; }

    const g=AU.mus.gain; g.cancelScheduledValues(c.currentTime); g.setValueAtTime(g.value,c.currentTime); g.linearRampToValueAtTime(MUSVOL,c.currentTime+2);

  stop(){ if(!this.on) return; this.on=false; clearInterval(this.iv); const c=AU.ctx, g=AU.mus.gain; g.cancelScheduledValues(c.currentTime); g.setTargetAtTime(0,c.currentTime,.25); Amb.stop(); },
  restart(){ if(!this.on) return; this.stop(); setTimeout(()=>{ if(P.music) this.start(); },450); },
  tick(){ const c=AU.ctx, sd=60/SG.bpm/4; if(c.state!=='running'){ this.next=c.currentTime+.05; return; }

// Ambience (optional background, follows the Music switch): Library, Rain or Park.
const Amb={src:null,id:'none',next:0,
  start(){ const c=audio(); if(!c) return; this.stop(true); this.id=look('amb'); if(this.id==='none') return;
    const s=c.createBufferSource(); s.buffer=this.id==='library'?AU.brown:AU.noise; s.loop=true; const f=c.createBiquadFilter();
    if(this.id==='rain'){ f.type='bandpass'; f.frequency.value=1800; f.Q.value=.4; } else if(this.id==='park'){ f.type='lowpass'; f.frequency.value=500; } else { f.type='lowpass'; f.frequency.value=320; }
    const g=c.createGain(); g.gain.value=this.id==='rain'?.06:this.id==='park'?.035:.09; s.connect(f); f.connect(g); g.connect(AU.amb); s.start(); this.src=s;
    const a=AU.amb.gain; a.cancelScheduledValues(c.currentTime); a.setTargetAtTime(.9,c.currentTime,.8); this.next=c.currentTime+.5; },
  stop(now){ if(this.src){ try{ this.src.stop(); }catch(e){} this.src=null; } if(AU.ctx&&!now) AU.amb.gain.setTargetAtTime(0,AU.ctx.currentTime,.2); },

<script>
// ===================== NAVIGATION =====================
// Android back: in a game it opens the pause menu first; then it closes a sheet; then it returns home; then (home, in Arcade) goes to Arcade.
let cur='home', sheetOn=false, guarded=false, G=null, setReturn=false;
function show(id){ $$('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); cur=id; guard(); if(id!=='game') stopClock(); }
const needGuard=()=>ARCADE||cur!=='home'||sheetOn;
function guard(){ if(needGuard()&&!guarded){ try{ history.pushState({chess:1},''); guarded=true; }catch(e){} } }
addEventListener('popstate',()=>{ guarded=false; back(); guard(); });
const coverOn=()=>$('#cover').classList.contains('on');
function back(){
  if(cur==='game'&&G&&!G.over&&!G.review&&!sheetOn&&!coverOn()){ openPause(); return; }
  if(sheetOn){ closeSheet(); return; }
  if(coverOn()){ resume(); return; }
  if(cur==='game'&&G){ leaveGame(); return; }
  if(cur==='set'&&setReturn){ backFromSettings(); return; }
  if(cur!=='home'){ goHome(); return; }
  if(ARCADE) leaveTo(ARCADE_HOME); }
function leaveTo(url){ if(G) saveGame(); persist(); writeSummary(); location.replace(url); }
let sheetClose=null;
function openSheet(html,onClose){ $('#sheet').innerHTML=html; $('#ov').classList.add('on'); $('#sheet').scrollTop=0; sheetOn=true; sheetClose=onClose||null; guard(); stopClock(); }

const backBtn=`<button class="iconbtn" data-home aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>`;

function segHtml(key,opts,val){ return `<div class="seg" data-seg="${key}">${opts.map(([v,n])=>`<button data-v="${v}" class="${String(v)===String(val)?'on':''}">${n}</button>`).join('')}</div>`; }
async function share(text,okMsg){ try{ if(navigator.share){ await navigator.share({text}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast(okMsg||'Copied to the clipboard'); return; }catch(e){}
  openSheet(`<h2>Share</h2><div class="sub">Copy this text:</div><textarea rows="4" readonly>${esc(text)}</textarea><div class="btns"><button class="primary" data-close>Done</button></div>`); $('#sheet textarea').select(); }

// starting something new replaces the game in progress (an abandoned Classic game is a loss)
function confirmReplace(go){ const r=S.run; if(!r||r.over){ go(); return; }
  openSheet(`<h2>Start a new game?</h2><div class="sub" data-raw>${esc(TF('Your game in progress ({0}) will be replaced.',runLabel(r)))}${r.mode==='classic'&&r.g.moves.length>1?' '+esc(T('It counts as a loss.')):''}</div>
   <div class="btns"><button class="ghost" data-close>Cancel</button><button class="primary" id="rpGo">Start</button></div>`);
  $('#rpGo').onclick=()=>{ if(r.mode==='classic'&&r.g.moves.length>1) recordGame(S,{level:r.level,colour:r.me,result:'loss',c960:r.g.c960>=0}); S.run=null; persist(); closeSheet(); go(); }; }

     <div class="opt"><div class="h">Your colour</div>${segHtml('colour',[['white','White'],['black','Black'],['random','Random']],c.colour)}</div>

     <div class="btns"><button class="ghost" data-close>Close</button><button class="primary" id="goPlay">Play</button></div>`);
    $$('#sheet [data-seg]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const k=g.dataset.seg; c[k]=k==='level'?+b.dataset.v:b.dataset.v; draw(); }));

function startClassic(){ const c=S.setup, me=c.colour==='white'?WHITE:c.colour==='black'?BLACK:(Math.random()<.5?WHITE:BLACK);
  const n=c.start==='960'?Math.floor(Math.random()*960):-1;
  startGame(newRun({mode:'classic',level:c.level,me,clock:c.clock==='none'?null:c.clock,g:gameNew({c960:n})})); }
// a run: everything needed to resume exactly
function newRun(o){ const ck=o.clock&&CLOCKS[o.clock]; return Object.assign({id:Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36),hints:0,takebacks:0,assisted:false,time:0,
  left:ck?[ck.base,ck.base]:null,over:false},o); }

function startPuzzle(streakN){ const c=S.puz; let pz, streak=null;
  if(c.by==='streak'){ streak=streakN||0; pz=pickStreak(streak,Math.random,S.pused.streak); S.pused.streak=(S.pused.streak||[]).concat(pz?[pz.id]:[]).slice(-300); }
  else pz=pickPuzzle(S,c,Math.random);

  startGame(puzzleRun('puzzle',pz,{streak})); }
function puzzleRun(mode,pz,o){ const p=fromFEN(pz.fen); return newRun(Object.assign({mode,pz,me:p.side,g:{start:pz.fen,moves:[],c960:-1},wrong:0,hints:0,hintStage:0},o||{})); }

  $$('#campBody [data-lv]').forEach(b=>b.onclick=()=>{ const L=levelById(b.dataset.lv); if(!unlocked(S,L)){ toast('Clear the level before to unlock this one'); return; } openLevel(L); }); }
const TWISTS={clock:'5 + 3 clock',c960:'Chess960',black:'Play as Black',noassist:'No takebacks or hints'};
const TYPE_NAME={set:'Puzzle set',tech:'Technique set',drill:'Endgame drill',hold:'Defence drill',game:'Game',pos:'Position game',final:'Finale'};
function levelTag(L){ const x=[T(TYPE_NAME[L.type])];
  if(L.type==='set'||L.type==='tech') x.push(TF('{0} puzzles',L.puzzles.length));
  if(L.strength) x.push(TF('vs {0}',strengthName(L.strength)));
  for(const t of L.twists||[]) x.push(T(TWISTS[t])); if(L.final) x.push(T('Finale'));
  return x.join(' · '); }
function openLevel(L){ const c=campOf(S,L.id), labels=levelStarText(L);
  openSheet(`<h2 data-raw>${esc(L.name)}</h2><div class="sub">${esc(T(CAMPS[L.camp].name)+' · '+TF('Level {0}',L.n))} · ${esc(levelTag(L))}</div>
   <div class="sub">${esc(L.tip)}</div>
   ${L.type==='tech'?`<div class="howto">${techDiagram(L.tech)}</div>`:''}
   ${labels.map((lb,i)=>`<div class="goal${c.s[i]?' got':''}"><span class="st">★</span><span>${esc(T(lb))}</span></div>`).join('')}
   <div class="btns"><button class="ghost" data-close>Close</button><button class="primary" id="lvGo">${S.run&&S.run.lid===L.id&&!S.run.over?'Continue':'Play'}</button></div>`);

function startLevel(L){ const tw=L.twists||[];
  if(L.type==='set'||L.type==='tech'){ const pz=puzById(L.puzzles[0]); startGame(puzzleRun('campaign',pz,{lid:L.id,set:{i:0,wrong:0,hints:0}})); return; }
  const me=L.colour!=null?L.colour:tw.includes('black')?BLACK:WHITE, n=tw.includes('c960')?index960(L.id+'|'+Date.now()):-1;
  startGame(newRun({mode:'campaign',lid:L.id,level:L.strength,me,clock:tw.includes('clock')?'5+3':null,noassist:tw.includes('noassist'),g:gameNew({fen:L.fen,c960:n})})); }

  if(t==='fork') return diaBoard(['....k...','........','...N....','..r...q.'],{'4,1':'t'})+`<p>${esc(T('The fork: one piece attacks two at once. The knight jumps to give check and also attacks the queen and rook; after the king moves, it takes one of them.'))}</p>`;
  if(t==='deflection') return diaBoard(['...r..k.','.....ppp','........','...Q....','........','........','........','...R..K.'],{'3,0':'t'})+`<p>${esc(T('Deflection: force a defender away from its job. The queen sacrifice on d8 drags the rook away, and the white rook then mates on the back rank.'))}</p>`;

function openHowto(){ openSheet(`<div class="howto"><h2>How to play</h2>
  <p>Checkmate the enemy king: attack it so it has no escape. Each piece moves its own way; pawns promote on the last rank; castling, en passant and the draw rules (stalemate, threefold repetition, fifty moves, not enough material) all apply.</p>
  <h3>Moving</h3><p>Tap a piece, then a square (dots show where it can go; rings show captures), or drag it. On a keyboard, type the move (e4, Nf3, O-O) and press Enter. Arrows step through the moves; F flips the board; H gives a hint; U takes back; P or Esc pauses.</p>
  <h3>Play the computer</h3><p>Eight strengths, from Pebble (about 400) to Titan (as strong as our engine gets). Ratings are rough labels from our own self-play tests, not official ratings. ★ win · ★ no assists (hints and takebacks are assists) · ★ accuracy 75% or more.</p>

  <h3>Puzzles</h3><p>Find the best move; the computer plays the replies. Any move that also mates counts. ★ solved · ★ first try · ★ no hints. A first hint shows the piece to move, a second shows the move.</p>
  <h3>Campaign techniques</h3><h3 style="font-size:13px">Back-rank mate</h3>${techDiagram('backrank')}<h3 style="font-size:13px">The fork</h3>${techDiagram('fork')}<h3 style="font-size:13px">Deflection</h3>${techDiagram('deflection')}
  <h3>Daily</h3><p>The same puzzle for everyone, rated about 800–1100 on Monday up to 2100–2400 on Sunday. One scored attempt, then unlimited practice.</p>
  <h3>2-Player</h3><p>Pass-and-play on one device, or share codes: each move makes a code to send; paste the reply to continue. Codes aren't secret, so it's friendly play.</p>

  <div class="btns"><button class="primary" data-close>Got it</button></div>`); S.howto=true; persist(); }

  <h3>Engine</h3><p>Our own engine, written in JavaScript for this game: alpha-beta search with a transposition table and our own evaluation. It contains no code from other engines.</p>

async function gz(bytes,inflate){ const CS=inflate?window.DecompressionStream:window.CompressionStream; if(!CS) return null;
  const s=new Blob([bytes]).stream().pipeThrough(new CS('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); }
async function backupCode(){ const json=JSON.stringify(S);
  try{ const z=await gz(new TextEncoder().encode(json)); if(z){ let b=''; for(let i=0;i<z.length;i++) b+=String.fromCharCode(z[i]); return 'CHESS1Z.'+btoa(b); } }catch(e){}
  return backupPlain(S); }
async function readBackup(text){ const m=/CHESS1Z\.([A-Za-z0-9+/=]+)/.exec(String(text||''));
  if(m){ try{ const bin=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0)); const out=await gz(bin,true); const o=JSON.parse(new TextDecoder().decode(out)); return o&&typeof o.xp==='number'?o:null; }catch(e){ return null; } }
  return parseBackup(text); }
async function openBackup(){ if(G) saveGame(); const code=await backupCode();
  openSheet(`<h2>Backup &amp; restore</h2><div class="sub">This code holds your Chess progress: XP, stars, records, achievements, settings, 2-Player games and games in progress. Keep it somewhere safe.</div>
   <textarea rows="4" readonly id="bkCode">${esc(code)}</textarea><div class="btns"><button class="ghost" id="bkCopy">Copy</button><button class="ghost" id="bkFile">${esc(TF('Save to file ({0} KB)',Math.ceil(code.length/1024)))}</button></div>
   <div class="label">Restore</div><textarea rows="3" id="bkIn" placeholder="Paste a backup code"></textarea><div class="btns"><button class="ghost" data-close>Close</button><button class="primary" id="bkGo">Restore</button></div>`);
  $('#bkCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(code); toast('Copied'); }catch(e){ $('#bkCode').select(); } S.bk.last=Date.now(); persist(); };
  $('#bkFile').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'})); a.download=`chess-backup-${todayStr()}.txt`; a.click(); S.bk.last=Date.now(); persist(); };
  let armed=null; $('#bkGo').onclick=async()=>{ const o=await readBackup($('#bkIn').value); if(!o){ toast('That code isn\'t a Chess backup'); return; }
    if(armed!==o.xp){ armed=o.xp; $('#bkGo').textContent=TF('Replace my progress (level {0})',levelOf(o.xp)); return; }
    S=loadSave(JSON.stringify(o),REDUCED); G=null; persist(); refreshShared(); applyLook(); closeSheet(); goHome(); toast('Progress restored'); }; }

<script>
// ===================== ENGINE JOBS =====================
// One search at a time, in ~8 ms slices per frame: the foreground job (the computer's move, a hint) first, then the
// background analysis. Each job keeps its own search state between slices.
const JOBS=[]; let jobRAF=0;
function runJob(gen,o){ const j={gen,fg:!!o.fg,done:o.done,tick:o.tick,sr:null,last:0}; JOBS.push(j); schedule(); return j; }
function cancelJob(j){ const k=JOBS.indexOf(j); if(k>=0) JOBS.splice(k,1); }
function cancelFg(){ for(const j of JOBS.filter(j=>j.fg)) cancelJob(j); }
function schedule(){ if(!jobRAF&&JOBS.length) jobRAF=requestAnimationFrame(jobTick); }
function jobTick(){ jobRAF=0; const j=JOBS.find(x=>x.fg)||JOBS[0]; if(!j) return; const t=performance.now();
  if(j.sr){ Object.assign(SR,j.sr); SR.hard=j.sr.hard+(t-j.last); } // time spent waiting doesn't count against the job
  CX=j.cx||CX_MAIN; SR.slice=t+6.5; /* a ~6.5 ms budget: with the last child finishing, slices end around 7–8 ms */ let r; try{ r=j.gen.next(); }catch(e){ console.error(e); CX=CX_MAIN; cancelJob(j); schedule(); return; }
  j.cx=CX; CX=CX_MAIN; j.sr={stop:SR.stop,hard:SR.hard,qlim:SR.qlim,nodes:SR.nodes,seldepth:SR.seldepth}; j.last=performance.now();
  if(r.done){ cancelJob(j); if(j.done) j.done(r.value); } else if(j.tick) j.tick(r.value);
  schedule(); }

// ===================== GAME =====================
// G: the run (see newRun) plus the live position G.pos, SAN list G.sans, the clock state and UI flags.
const EL={sq:[]}; let LY=null, selSq=-1, flip=false, viewPly=null, drag=null, keyBuf='', aiJob=null;
const vsComputer=()=>G&&(G.mode==='classic'||(G.mode==='campaign'&&!G.pz));
const isPuzzle=()=>G&&!!G.pz;
const assistedNow=()=>!!(G.assisted||G.hints||G.takebacks);
function startGame(run){ cancelFg(); closeSheet(); $('#cover').classList.remove('on');
  G=Object.assign({},run,{clockOn:false,t0:0}); G.pos=posAt(G.g); G.sans=gameSans(G.g); G.time=G.time||0;
  viewPly=null; selSq=-1; drag=null; keyBuf=''; hideBanner();
  flip=G.mode==='pp'?(S.prefs.autoFlip&&G.pos.side===BLACK):G.me===BLACK;
  saveGame(); show('game'); buildBoard(); layoutBoard(); render();
  if(G.mode==='pp'&&G.g.moves.length&&!G.over) passCover();
  if(G.mode==='tp') tpBanner();
  if(G.g.moves.length&&!isPuzzle()) startClock(); else if(isPuzzle()&&G.time) startClock();
  nextTurn(); }
function resumeRun(run){ if(!run) return; startGame(JSON.parse(JSON.stringify(run))); }
// where the game is kept: S.run (Classic, campaign, puzzles), S.daily.run / .practice, and 2-Player games in S.tp
function runOf(){ const o={}; for(const k in G) if(!['pos','sans','clockOn','t0','thinking','busy','hint','review','ann','st0'].includes(k)) o[k]=G[k]; o.g={start:G.g.start,moves:G.g.moves.slice(),c960:G.g.c960}; return o; }
function saveGame(){ if(!G||G.review) return; commitClock(); const o=runOf();
  if(G.mode==='tp'||G.mode==='pp'){ const g=tpFind(S,G.gid); if(g){ g.moves=G.g.moves.slice(); g.left=G.left; g.last=Date.now(); const st=codeStatus(g); g.over=st.over||!!g.end; g.turn=g.over?-1:seatOf(g,st.p.side); } }
  else if(G.mode==='daily'){ dailyFor(S,G.date).run=G.over?null:o; }
  else if(G.mode==='practice'){ dailyFor(S,G.date).practice=G.over?null:o; }
  else S.run=G.over?null:o;
  persist(); }
function leaveGame(){ if(G&&!G.review) saveGame(); cancelFg(); G=null; hideBanner(); goHome(); }

// ---------- clock: starts on the first move; stops when paused, hidden or on another screen ----------
function startClock(){ if(!G||G.over||G.review||G.clockOn||cur!=='game'||coverOn()||sheetOn) return; if(!G.g.moves.length&&!isPuzzle()) return; if(isPuzzle()&&!G.started) return;
  G.clockOn=true; G.t0=performance.now(); }
function commitClock(){ if(G&&G.clockOn){ const n=performance.now(), el=n-G.t0; G.time+=el; if(G.left) G.left[G.pos.side]-=el; G.t0=n; } }
function stopClock(){ if(G&&G.clockOn){ commitClock(); G.clockOn=false; } }
const leftNow=c=>G.left?Math.max(0,G.left[c]-(G.clockOn&&G.pos.side===c?performance.now()-G.t0:0)):0;
const elapsed=()=>G?G.time+(G.clockOn?performance.now()-G.t0:0):0;
let lastTick=0;
setInterval(()=>{ if(!G||cur!=='game'||G.review) return; if(G.left&&G.clockOn){ const c=G.pos.side, l=leftNow(c);
    if(l<=0){ commitClock(); G.left[c]=0; flagFall(c); return; }
    if(l<10000&&P.sfx&&Math.floor(l/1000)!==lastTick){ lastTick=Math.floor(l/1000); if(G.me==null||c===G.me) sfx('tick'); } }
  drawBars(true); },100);
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(G&&cur==='game'&&!G.over&&!G.review){ stopClock(); saveGame(); if(!sheetOn&&!coverOn()) openPause(); } if(AU.ctx) AU.ctx.suspend().catch(()=>{}); persist(); }
  else if(AU.ctx&&(P.sfx||P.music)) AU.ctx.resume().catch(()=>{}); });
addEventListener('pagehide',()=>{ if(G) saveGame(); persist(); writeSummary(); });

// ---------- the board ----------
const sqAt=(row,col)=>flip?(row*16+(7-col)):((7-row)*16+col);
const sqXY=s=>{ const f=s&7, r=s>>4, col=flip?7-f:f, row=flip?r:7-r; return [col*LY.cs,row*LY.cs]; };
function buildBoard(){ const b=$('#board'); b.innerHTML=''; EL.sq=[];
  for(let row=0;row<8;row++) for(let col=0;col<8;col++){ const s=sqAt(row,col), d=document.createElement('div'); d.className='sq'+(((s>>4)+(s&7))%2===0?' d':''); d.dataset.s=s;
    let co=''; if(S.prefs.coords){ if(row===7) co+=`<span class="cf">${'abcdefgh'[s&7]}</span>`; if(col===0) co+=`<span class="cr">${(s>>4)+1}</span>`; } d.innerHTML=co; b.appendChild(d); EL.sq[s]=d; } }
// portrait: the board fills the width (45 px squares at 360 px); landscape: the move list sits beside it
function layoutBoard(){ if(!G) return; const main=$('#main'), land=innerWidth>=innerHeight*1.15&&innerWidth>=560;
  main.classList.toggle('land',land); main.style.flexDirection=land?(P.lefty?'row-reverse':'row'):'column';
  let size; if(land){ size=Math.min(main.clientHeight-2*46-12,innerWidth-Math.min(320,innerWidth*.38)-40); }
  else { size=Math.min(main.clientWidth,640,main.clientHeight-2*46-14-110); }
  size=Math.max(200,size); const cs=Math.floor(size/8), bw=cs*8; LY={cs,bw};
  const w=$('#boardWrap'); w.style.width=bw+'px'; w.style.height=bw+'px'; w.style.setProperty('--cs',cs+'px'); $('#bcol').style.width=bw+'px'; }
addEventListener('resize',()=>{ if(G&&cur==='game'){ layoutBoard(); render(); } });
const viewPos=()=>viewPly==null?G.pos:posAt(G.g,viewPly);
function render(anim){ if(!G) return; const p=viewPos(), ply=viewPly==null?G.g.moves.length:viewPly;
  // last move
  let lm=null; if(ply>0){ const q=posAt(G.g,ply-1), m=fromUci(q,G.g.moves[ply-1]); if(m){ const f=mFrom(m); lm=[f,mFlags(m)&F_CASTLE?(f&0x70)+(castleSide(m)?2:6):mTo(m)]; } }
  else if(G.pz&&G.pz.setup){ lm=[parseSq(G.pz.setup.slice(0,2)),parseSq(G.pz.setup.slice(2,4))]; }
  const chk=inCheck(p)?p.k[p.side]:-1, tg=new Map();
  if(selSq>=0&&viewPly==null&&S.prefs.legal) for(const m of legalMoves(p)) if(mFrom(m)===selSq){ const t=mFlags(m)&F_CASTLE?mTo(m):mTo(m); tg.set(t,(mFlags(m)&F_CAP)||p.b[t]&&!(mFlags(m)&F_CASTLE)?'cap':'tgt');
    if(mFlags(m)&F_CASTLE&&!p.c960) tg.set((selSq&0x70)+(castleSide(m)?2:6),'tgt'); }
  const H=G.hint;
  for(let s=0;s<120;s++){ if(s&0x88){ s+=7; continue; } const cl=EL.sq[s].classList;
    cl.toggle('lm',!!lm&&(s===lm[0]||s===lm[1])); cl.toggle('sel',s===selSq); cl.toggle('chk',s===chk);
    cl.toggle('tgt',tg.get(s)==='tgt'); cl.toggle('cap',tg.get(s)==='cap'); cl.toggle('hint',!!H&&H.sq===s);
    cl.toggle('bad',!!G.badSq&&G.badSq===s); cl.toggle('hov',!!drag&&drag.over===s); }
  drawPieces(p,anim); drawArrows(); drawBars(); drawMoves(); drawTools(); }
function drawPieces(p,anim){ const box=$('#pcs'); let h='';
  for(let s=0;s<120;s++){ if(s&0x88){ s+=7; continue; } const pc=p.b[s]; if(!pc) continue; const [x,y]=sqXY(s);
    h+=`<div class="pc" data-s="${s}" style="transform:translate(${x}px,${y}px)"><svg viewBox="0 0 100 100"><use href="#pc-${pc>>3?'b':'w'}${pcLetter(pc)}"/></svg></div>`; }
  box.innerHTML=h;
  if(anim&&P.motion) for(const [from,to] of anim){ const el=box.querySelector(`.pc[data-s="${to}"]`); if(!el) continue; const [x0,y0]=sqXY(from), [x1,y1]=sqXY(to);
    el.style.transform=`translate(${x0}px,${y0}px)`; void el.offsetWidth; el.classList.add('slide'); el.style.transform=`translate(${x1}px,${y1}px)`; } }
function arrowSvg(f,t,col,w){ const c=LY.cs, [x0,y0]=sqXY(f), [x1,y1]=sqXY(t), ax=x0+c/2, ay=y0+c/2, bx=x1+c/2, by=y1+c/2, L=Math.hypot(bx-ax,by-ay)||1, ux=(bx-ax)/L, uy=(by-ay)/L, hl=c*.38, ex=bx-ux*hl*.9, ey=by-uy*hl*.9;
  return `<line x1="${ax+ux*c*.18}" y1="${ay+uy*c*.18}" x2="${ex}" y2="${ey}" stroke="${col}" stroke-width="${c*(w||.16)}" stroke-linecap="round" opacity=".85"/><path d="M${bx} ${by}L${bx-ux*hl-uy*hl*.55} ${by-uy*hl+ux*hl*.55}L${bx-ux*hl+uy*hl*.55} ${by-uy*hl-ux*hl*.55}Z" fill="${col}" opacity=".9"/>`; }
function drawArrows(){ const sv=$('#arrows'); sv.setAttribute('viewBox',`0 0 ${LY.bw} ${LY.bw}`); sv.setAttribute('width',LY.bw); sv.setAttribute('height',LY.bw); let h='';
  if(G.hint&&G.hint.arrow&&viewPly==null) h+=arrowSvg(G.hint.arrow[0],G.hint.arrow[1],'#e8a913');
  if(G.review&&G.ann&&viewPly!=null&&viewPly>0){ const a=G.ann.moves[viewPly-1]; if(a&&a.best&&a.best!==G.g.moves[viewPly-1]&&a.cls!=='best'&&a.cls!=='good'){ const q=posAt(G.g,viewPly-1); const m=fromUci(q,a.best); if(m){ const f=mFrom(m), t=mFlags(m)&F_CASTLE?(f&0x70)+(castleSide(m)?2:6):mTo(m); h+=arrowSvg(f,t,'#2f9e6a'); } } }
  sv.innerHTML=h;
  $$('#boardWrap .mark').forEach(e=>e.remove());
  if(G.review&&G.ann&&viewPly){ const a=G.ann.moves[viewPly-1]; if(a&&CLS_COL[a.cls]){ const q=posAt(G.g,viewPly-1), m=fromUci(q,G.g.moves[viewPly-1]); if(m){ const t=mFlags(m)&F_CASTLE?(mFrom(m)&0x70)+(castleSide(m)?2:6):mTo(m), [x,y]=sqXY(t);
      const d=document.createElement('div'); d.className='mark'; d.style.background=CLS_COL[a.cls]; d.style.left=(x+LY.cs*.66)+'px'; d.style.top=(y-LY.cs*.04)+'px'; d.textContent=CLS_SYM[a.cls]; $('#boardWrap').appendChild(d); } } } }
const CLS_COL={best:'#2f9e6a',good:'#7fb069',inaccuracy:'#e8b923',mistake:'#e8892a',blunder:'#d9534f',forced:'#8a8a90'};
const CLS_SYM={best:'★',good:'✓',inaccuracy:'?!',mistake:'?',blunder:'??',forced:'□'};
// player bars: the opponent above the board, you below (pass-and-play: whoever sits at that edge)
function barInfo(c){ const loc=G.mode==='pp', tg=(G.mode==='tp'||loc)?tpFind(S,G.gid):null;
  if(vsComputer()){ if(c===G.me) return {name:P.name||T('You'),av:avOn()?avH(myAv(),P.name||'Y',34):'',sub:''};

function puzzleMove(m,dragged){ const pz=G.pz, step=G.g.moves.length, exp=pz.sol[step];

  if(puzzleMoveOk(G.pos,m,exp)){ const alt=toUci(G.pos,m)!==exp; playMove(m,{anim:!dragged}); G.hintStage=0;
    if(alt||G.g.moves.length>=pz.sol.length){ puzzleDone(true); return; }
    sfx('right'); G.busy=true; const game=G;
    setTimeout(()=>{ if(G!==game) return; G.busy=false; const r=fromUci(G.pos,pz.sol[G.g.moves.length]); if(r) playMove(r,{}); render(); },480); return; }
  // wrong: show it, then take it back
  G.wrong++; if(G.set) G.set.wrong++; sfx('bad'); buzz([30,40,30]); const p=G.pos; makeMove(p,m); G.badSq=mTo(m); render([[mFrom(m),mTo(m)]]); G.busy=true; const game=G;
  setTimeout(()=>{ if(G!==game) return; unmakeMove(p); G.badSq=0; G.busy=false; render(); saveGame();
    if(G.streak!=null){ puzzleDone(false); return; } toast('Not the best move: try again'); },650); }
function puzzleHint(){ if(G.busy||G.pos.side!==G.me) return; const exp=G.pz.sol[G.g.moves.length]; if(!exp) return; const m=fromUci(G.pos,exp); if(!m) return;
  if(G.hintStage===0){ if(S.hints<=0){ toast('No hints left today. You get +1 for every level-up.'); return; } useHint(S); G.hints++; if(G.set) G.set.hints++; persist(); G.hintStage=1; G.hint={sq:mFrom(m)}; sfx('hint'); render(); toast('This piece moves'); return; }
  G.hintStage=2; const f=mFrom(m), t=mFlags(m)&F_CASTLE?(f&0x70)+(castleSide(m)?2:6):mTo(m); G.hint={sq:-1,arrow:[f,t]}; sfx('hint'); render(); }
function puzzleDone(solved){ stopClock(); G.over=true; const pz=G.pz, today=todayStr(); let res={kind:'puzzle',solved,stars:null,xp:null,ach:[],fresh:[]};
  if(G.mode==='puzzle'){ const r=recordPuzzle(S,pz,solved,G.wrong,G.hints,today); res.stars=puzzleStars(solved,G.wrong,G.hints); if(r.xp) res.xp=addXP(S,r.xp); res.recs=r.fresh;
    res.ach=checkAch(S,{mode:'puzzle',puzzle:{rating:pz.rating,first:solved&&!G.wrong}}); }
  else if(G.mode==='daily'){ const dr=dailyResult(S,G.date,solved,G.wrong,G.hints,G.time,today); if(dr){ res.stars=dr.stars; if(dr.xp) res.xp=addXP(S,dr.xp); }
    if(solved) recordPuzzle(S,pz,true,G.wrong,G.hints,'');
    res.ach=checkAch(S,{mode:'daily',puzzle:{rating:pz.rating,first:solved&&!G.wrong}}); }
  else if(G.mode==='practice') res.stars=puzzleStars(solved,G.wrong,G.hints);
  else if(G.mode==='campaign'){ const L=levelById(G.lid); recordPuzzle(S,pz,solved,G.wrong,G.hints,today);
    if(G.set.i<L.puzzles.length-1){ G.set.i++; const next=puzById(L.puzzles[G.set.i]); sfx('right'); setTimeout(()=>{ if(!G||G.lid!==L.id) return; const set=G.set; startGame(puzzleRun('campaign',next,{lid:L.id,set})); toast(TF('Puzzle {0} of {1}',set.i+1,L.puzzles.length)); },900); saveGame(); render(); return; }
    const cr=campaignResult(S,L,{cleared:true,s2:!G.set.wrong,s3:!G.set.hints}); res.stars=cr.earned; res.fresh=cr.fresh; res.camp=cr; if(cr.xp) res.xp=addXP(S,cr.xp);
    res.ach=checkAch(S,{mode:'campaign',puzzle:{rating:pz.rating,first:!G.wrong}}); }
  G.result=null; saveGame(); persist(); writeSummary(); render();
  if(solved){ sfx('win'); buzz([20,40,20]); setTimeout(()=>showPuzzleResults(res),700); } else { sfx('lose'); showSolution(()=>showPuzzleResults(res)); } }
// after a failed streak puzzle, play out the rest of the solution
function showSolution(then){ const game=G; let k=0; const stepFn=()=>{ if(G!==game) return; const u=G.pz.sol[G.g.moves.length]; if(!u||k++>12){ setTimeout(then,500); return; } const m=fromUci(G.pos,u); if(!m){ then(); return; } playMove(m,{}); setTimeout(stepFn,650); }; setTimeout(stepFn,500); }
function showPuzzleResults(res){ if(!G) return; const pz=G.pz, m=G.mode, L=G.lid?levelById(G.lid):null, labels=m==='campaign'?levelStarText(L):['Solved','First try','No hints'];

   <div class="kv"><div><b>${fmtTime(G.time)}</b><span>Time</span></div><div><b>${m==='campaign'?G.set.wrong:G.wrong}</b><span>Wrong moves</span></div><div><b>${m==='campaign'?G.set.hints:G.hints}</b><span>Hints</span></div></div>`;
  if(res.stars) h+=labels.map((lb,i)=>`<div class="goal${res.stars[i]?' got':''}${res.fresh.includes(i)?' new':''}"><span class="st">★</span><span>${esc(T(lb))}</span></div>`).join('');
  if(G.streak!=null) h+=`<div class="sub" style="margin-top:8px"><b>${esc(TF('Streak: {0}',G.streak+(res.solved&&!G.wrong?1:0)))}</b> · ${esc(TF('Best: {0}',S.rec.puzBest))}</div>`;
  if(m==='practice') h+=`<div class="sub">Practice doesn't score.</div>`;
  h+=xpHtml(res); if(res.camp&&res.camp.finished) h+=`<div class="sub"><b>${esc(TF('{0} complete!',T(CAMPS[L.camp].name)))}</b></div>`;
  h+=achHtml(res.ach)+`<div class="sub" style="font-size:12px;margin-top:8px">${esc(TF('Lichess puzzle {0}',pz.id))}</div>`;
  const next=m==='campaign'?LEVELS[LEVELS.indexOf(L)+1]:null, cont=G.streak!=null&&res.solved&&!G.wrong;
  h+=`<div class="btns"><button class="ghost" id="rHome">Home</button>${m==='puzzle'?`<button class="primary" id="rNext">${esc(T(cont?'Next puzzle':G.streak!=null?'New streak':'Next puzzle'))}</button>`:''}
   ${m==='campaign'?`<button class="ghost" id="rRetry">Retry for stars</button>${next&&unlocked(S,next)?'<button class="primary" id="rLv">Next level</button>':'<button class="primary" id="rMap">Campaign</button>'}`:''}
   ${m==='daily'?'<button class="ghost" id="rShare">Share</button><button class="primary" id="rPrac">Practise</button>':''}${m==='practice'?'<button class="primary" id="rPrac">Practise again</button>':''}</div>`;
  starSounds(res); openSheet(h,()=>{});
  const end=()=>{ const g=G; G=null; return g; };
  $('#rHome').onclick=()=>{ end(); goHome(); };
  if($('#rNext')) $('#rNext').onclick=()=>{ closeSheet(); const g=end(); startPuzzle(g.streak!=null?(cont?g.streak+1:0):undefined); };
  if($('#rRetry')) $('#rRetry').onclick=()=>{ closeSheet(); end(); startLevel(L); };
  if($('#rLv')) $('#rLv').onclick=()=>{ closeSheet(); end(); openCamp(next.camp); openLevel(next); };
  if($('#rMap')) $('#rMap').onclick=()=>{ closeSheet(); end(); openCamp(L.camp); };
  if($('#rShare')) $('#rShare').onclick=()=>{ const dd=S.daily; share(shareLine(dd.date,dd.cleared,dd.stars,dd.first,dd.time)); };
  if($('#rPrac')) $('#rPrac').onclick=()=>{ closeSheet(); const g=end(); dailyFor(S,g.date).practice=null; startGame(puzzleRun('practice',dailyPuzzle(g.date),{date:g.date})); }; }
function xpHtml(res){ return res.xp?`<div class="sub" style="margin-top:10px"><b>+${res.xp.xp} XP</b>${res.xp.after>res.xp.before?` · <span>${esc(TF('Level {0}!',res.xp.after))}</span> · <span>${esc(TF('+{0} hint',res.xp.hints))}</span>`:''}</div>${res.xp.rewards.length?`<div class="sub">${esc(TF('Unlocked: {0}',res.xp.rewards.join(' · ')))}</div>`:''}`:''; }
function achHtml(ids){ return ids&&ids.length?`<div class="label">Achievements</div><div class="box">${ids.map(id=>{ const a=ACH.find(x=>x.id===id); return `<div class="ach done"><div class="m">★</div><div><div class="n" data-raw>${esc(a.name)}</div><div class="d">${esc(a.desc)}${a.reward?' · '+esc(TF('Unlocks {0}',T(a.reward))):''}</div></div></div>`; }).join('')}</div>`:''; }
function starSounds(res){ if(res.xp&&res.xp.after>res.xp.before) sfx('level'); res.stars&&res.stars.forEach((s,i)=>{ if(s) setTimeout(()=>sfx('star',i),300+i*220); }); }

// ---------- the end of a game ----------
const RESULT_TEXT={checkmate:'Checkmate',stalemate:'Stalemate',repetition:'Draw by threefold repetition',fifty:'Draw by the fifty-move rule',material:'Draw: not enough material to mate',agreed:'Draw agreed',resign:'Resigned',time:'Lost on time','timeout-draw':'Time out, but no material to mate: draw',held:'You held the position'};
function endGame(st){ if(!G||G.over) return; stopClock(); cancelFg(); G.thinking=false; G.over=true; G.result=st.result==='held'?'½':st.result; G.reason=st.reason; selSq=-1; const today=todayStr();
  const me=G.me, won=me!=null&&((st.result==='1-0'&&me===WHITE)||(st.result==='0-1'&&me===BLACK)), draw=st.result==='1/2-1/2', outcome=won?'win':draw?'draw':'loss';
  const res={won,draw,outcome,reason:st.reason,stars:null,xp:null,ach:[],fresh:[],recs:[],pendingAcc:false};
  const g={start:G.g.start,moves:G.g.moves.slice(),c960:G.g.c960};
  if(G.mode==='classic'){ res.recs=recordGame(S,{level:G.level,colour:me,result:outcome,c960:g.c960>=0}); res.xp=addXP(S,classicXP(G.level,outcome,assistedNow()))||null; if(res.xp&&!res.xp.xp) res.xp=null;
    res.stars=gameStars(won,assistedNow(),null); res.pendingAcc=won; res.ach=checkAch(S,{mode:'classic',won,level:G.level,colour:me,g,clock:G.clock}); }
  else if(G.mode==='campaign'){ const L=levelById(G.lid), mine=myMoveCount();
    let o; if(L.type==='drill') o={cleared:won&&st.reason==='checkmate',s2:mine<=L.par,s3:!assistedNow()};
    else if(L.type==='hold'){ const ok=st.result==='held'||draw; o={cleared:ok,s2:ok&&G.pos.cnt[ROOK|me<<3]>0,s3:!assistedNow()}; res.won=ok; }
    else if(L.type==='pos') o={cleared:won,s2:!assistedNow(),s3:mine<=L.par};
    else { o={cleared:won,s2:!assistedNow(),s3:false}; res.pendingAcc=won; }
    const cr=campaignResult(S,L,o); res.stars=cr.earned; res.fresh=cr.fresh; res.camp=cr; if(cr.xp) res.xp=addXP(S,cr.xp);
    if(L.strength&&L.type!=='drill'&&L.type!=='hold') recordGame(S,{level:L.strength,colour:me,result:outcome,c960:g.c960>=0});
    res.ach=checkAch(S,{mode:'campaign',won,level:L.strength,colour:me,g,clock:G.clock}); }
  else if(G.mode==='tp'){ const tg=tpFind(S,G.gid); if(tg){ const cs=codeStatus(tg); tg.over=true; if(tpCount(S,tg,Object.assign({},cs,{over:true,winner:st.result==='1-0'?WHITE:st.result==='0-1'?BLACK:null}))) res.ach=checkAch(S,{mode:'tp'}); } }
  else if(G.mode==='pp'){ const k=st.result==='1-0'?'w':st.result==='0-1'?'b':'d'; S.rec.pp[k]++; }
  // the analysis (accuracy star, move classes) runs in the background and resumes after leaving
  if((G.mode==='classic'||G.mode==='campaign')&&g.moves.length>=2){ const e={id:G.id,mode:G.mode,lid:G.lid,level:G.level,colour:me,g,won:res.won,assisted:assistedNow(),evals:[],done:false,auto:S.prefs.analyse};
    e.paused=!S.prefs.analyse; queueAnalysis(S,e); G.anId=e.id; pumpAnalysis(); }
  saveGame(); persist(); writeSummary(); render();
  const wfx=P.motion&&won&&look('win')!=='none';
  if(won){ sfx('win'); buzz([20,40,20]); if(wfx) setTimeout(()=>winFx(),400); } else if(draw||st.result==='held') sfx('draw'); else sfx('lose');
  setTimeout(()=>showResults(res),won&&wfx?2200:st.reason==='checkmate'?1100:600); }
function winFx(){ const id=look('win'); if(id==='topple'){ const k=G.pos.k[G.pos.side], el=$(`#pcs .pc[data-s="${k}"]`); if(el){ el.classList.add('topple'); sfx('topple'); } return; } playWin(id); }
function showResults(res){ if(!G) return; const m=G.mode, L=G.lid?levelById(G.lid):null, an=S.anq.find(e=>e.id===G.anId);
  const me=G.me, title=m==='pp'?(res.draw?T('Draw'):TF('{0} wins',T(colourName(G.result==='1-0'?WHITE:BLACK)))):m==='tp'&&!res.won&&!res.draw?T('Your friend won'):res.won?(L&&L.type==='hold'?T('Held!'):T('You won!')):res.draw?T('Draw'):T('You lost');
  const labels=m==='campaign'?levelStarText(L):['Win','No assists (hints or takebacks)',TF('Accuracy {0}% or more',ACC_STAR)];
  let h=`<h2>${esc(title)}</h2><div class="sub">${esc(T(RESULT_TEXT[res.reason]||''))}${m==='campaign'?` · <span data-raw>${esc(campName(L))}</span>`:m==='classic'?' · '+esc(TF('vs {0}',strengthName(G.level))):''}</div>
   <div class="kv"><div><b>${Math.ceil(G.g.moves.length/2)}</b><span>Moves</span></div><div><b id="accV">${an&&an.done&&an.acc!=null?an.acc+'%':'—'}</b><span>Accuracy</span></div><div><b>${G.hints+G.takebacks}</b><span>Assists</span></div></div>`;
  if(res.stars) h+=labels.map((lb,i)=>{ const pend=i===2&&res.pendingAcc&&!(an&&an.done); return `<div class="goal${res.stars[i]?' got':''}${res.fresh.includes(i)?' new':''}${pend?' wait':''}" ${i===2?'id="accStar"':''}><span class="st">★</span><span>${esc(T(lb))}${pend?' · '+esc(T(an&&!an.paused?'analysing…':'tap Analysis')):''}</span></div>`; }).join('');
  if(m==='campaign'&&!res.won) h+=`<div class="sub" style="margin-top:6px">Clear the level to earn its stars.</div>`;
  if(m==='tp'||m==='pp') h+=`<div class="sub">${esc(T(m==='pp'?'Pass-and-play counts nothing.':'Share-code wins count toward the Rivals achievements.'))}</div>`;
  h+=xpHtml(res); if(res.camp&&res.camp.finished) h+=`<div class="sub"><b>${esc(TF('{0} complete!',T(CAMPS[L.camp].name)))}</b></div>`;
  if(res.recs&&res.recs.length) h+=`<div class="sub">${esc(TF('New record: {0}',res.recs.map(T).join(', ')))}</div>`;
  h+=achHtml(res.ach);
  const next=m==='campaign'?LEVELS[LEVELS.indexOf(L)+1]:null;
  h+=`<div class="btns">${G.g.moves.length>=2?'<button class="ghost" id="rAn">Analysis</button>':''}<button class="ghost" id="rHome">Home</button>
   ${m==='classic'?'<button class="primary" id="rNew">New game</button>':''}
   ${m==='campaign'?`<button class="ghost" id="rRetry">${res.won?'Retry for stars':'Retry'}</button>${res.won&&next&&unlocked(S,next)?'<button class="primary" id="rLv">Next level</button>':'<button class="primary" id="rMap">Campaign</button>'}`:''}
   ${m==='tp'||m==='pp'?'<button class="primary" id="rTp">2-Player</button>':''}</div>${m==='tp'&&G.sendEnd?'<div class="btns"><button class="primary" id="rSend">Send the result to your friend</button></div>':''}`;
  starSounds(res); openSheet(h,()=>{}); G.resOpen=true;
  const end=()=>{ const g=G; G=null; return g; };
  if($('#rAn')) $('#rAn').onclick=()=>{ closeSheet(); openAnalysis(G.anId||null); };
  $('#rHome').onclick=()=>{ end(); goHome(); };
  if($('#rNew')) $('#rNew').onclick=()=>{ closeSheet(); end(); startClassic(); };
  if($('#rRetry')) $('#rRetry').onclick=()=>{ closeSheet(); end(); startLevel(L); };
  if($('#rLv')) $('#rLv').onclick=()=>{ closeSheet(); end(); openCamp(next.camp); openLevel(next); };
  if($('#rMap')) $('#rMap').onclick=()=>{ closeSheet(); end(); openCamp(L.camp); };
  if($('#rTp')) $('#rTp').onclick=()=>{ closeSheet(); end(); openTp(); };
  if($('#rSend')) $('#rSend').onclick=()=>{ closeSheet(); tpShareSheet(); }; }

// ---------- analysis: background queue and the review screen ----------
let anJob=null, anSaved=0;
function pumpAnalysis(){ if(anJob) return; const e=S.anq.find(x=>!x.done&&!x.paused); if(!e) return;
  anJob=runJob(analyseGen(e.g,e),{fg:false,tick:pr=>{ if(performance.now()-anSaved>3000){ anSaved=performance.now(); persist(); }
      const ln=$('#anLine'); if(ln) ln.textContent=TF('Analysing your last game… {0}%',Math.round(e.evals.length/(e.g.moves.length+1)*100));
      if(G&&G.review&&G.anId===e.id) drawReview(); },
    done:sum=>{ anJob=null; e.done=true; e.sum=sum; const r=analysisDone(S,e,sum); if(r.xp) addXP(S,r.xp); persist(); writeSummary();
      if(r.acc!=null&&!(G&&G.review)) toast(TF('Analysis ready: {0}% accuracy',r.acc)+(r.star?' · ★':''));
      if(r.star){ sfx('star',2); } for(const id of r.ach) toast('★ '+ACH.find(a=>a.id===id).name);
      if(G&&G.anId===e.id&&sheetOn){ const v=$('#accV'), s=$('#accStar'); if(v) v.textContent=r.acc!=null?r.acc+'%':'—'; if(s){ s.classList.remove('wait'); if(r.star) s.classList.add('got','new'); s.lastChild.textContent=TF('Accuracy {0}% or more',ACC_STAR); } }
      if(G&&G.review&&G.anId===e.id){ G.ann=sum; render(); drawReview(); }
      pumpAnalysis(); }}); }
function openAnalysis(id){ let e=id?S.anq.find(x=>x.id===id):null; const src=G;
  if(!e){ e={id:src.id,mode:src.mode,lid:src.lid,level:src.level,colour:src.me==null?WHITE:src.me,g:{start:src.g.start,moves:src.g.moves.slice(),c960:src.g.c960},won:false,evals:[],done:false}; queueAnalysis(S,e); }
  if(e.paused){ e.paused=false; } persist(); pumpAnalysis();
  cancelFg(); G={review:true,anId:e.id,g:e.g,me:e.colour,mode:'review',pos:posAt(e.g),sans:gameSans(e.g),ann:e.done?e.sum:null,over:true,result:null,hints:0,takebacks:0,time:0};
  viewPly=0; flip=e.colour===BLACK; hideBanner(); show('game'); buildBoard(); layoutBoard(); render(); drawReview(); }
function drawReview(){ const box=$('#review'); if(!G||!G.review){ box.hidden=true; return; } box.hidden=false; const e=S.anq.find(x=>x.id===G.anId), a=G.ann;
  if(!a){ const n=e?Math.round(e.evals.length/(e.g.moves.length+1)*100):0; box.innerHTML=`<div class="accrow"><div>${esc(T('Analysing…'))}<b>${n}%</b></div></div><div class="prog"><i style="width:${n}%"></i></div>`; return; }
  const cnt=side=>{ const c={}; a.moves.forEach(x=>{ if(x.side===side) c[x.cls]=(c[x.cls]||0)+1; }); return ['inaccuracy','mistake','blunder'].map(k=>`<span style="color:${CLS_COL[k]}">${c[k]||0}${CLS_SYM[k]}</span>`).join(' '); };
  const W=300, H=64, n=a.graph.length, pts=a.graph.map((v,i)=>`${(i/(Math.max(1,n-1))*W).toFixed(1)},${(H/2-v/1000*H/2).toFixed(1)}`).join(' '), vx=viewPly!=null?(viewPly/(Math.max(1,n-1))*W):-10;
  const cur=viewPly?a.moves[viewPly-1]:null;
  box.innerHTML=`<div class="accrow"><div>${esc(T('White'))}<b>${a.acc[0]!=null?a.acc[0]+'%':'—'}</b>${cnt(0)}</div><div>${esc(T('Black'))}<b>${a.acc[1]!=null?a.acc[1]+'%':'—'}</b>${cnt(1)}</div></div>
   <svg id="graph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><rect x="0" y="0" width="${W}" height="${H/2}" fill="rgba(255,255,255,.55)"/><rect x="0" y="${H/2}" width="${W}" height="${H/2}" fill="rgba(0,0,0,.35)"/><polyline points="0,${H/2} ${pts} ${W},${H/2}" fill="rgba(240,240,240,.85)" stroke="#e8a913" stroke-width="1.5"/><line x1="${vx}" x2="${vx}" y1="0" y2="${H}" stroke="#e8a913" stroke-width="2"/></svg>
   ${cur?`<div class="banner" style="background:${CLS_COL[cur.cls]}22;color:var(--gInk)"><b data-raw>${esc(sanShow(G.sans[viewPly-1]))} · ${esc(T(cur.cls==='forced'?'Only move':cur.cls[0].toUpperCase()+cur.cls.slice(1)))}${cur.cls!=='best'&&cur.cls!=='forced'&&cur.best?' · '+esc(TF('best was {0}',bestSan(viewPly-1,cur.best))):''}</b></div>`:''}`;
  $('#graph').onclick=e=>{ const r=e.currentTarget.getBoundingClientRect(); goPly(Math.round((e.clientX-r.left)/r.width*(n-1))); }; }
function bestSan(ply,u){ const q=posAt(G.g,ply), m=fromUci(q,u); return m?sanShow(toSan(q,m)):u; }

$('#bMenu').onclick=()=>{ if(G&&G.review){ leaveGame(); return; } openPause(); };

$('#bPrev').onclick=()=>{ if(!G) return; goPly((viewPly==null?G.g.moves.length:viewPly)-1); };

function openPause(){ if(!G||G.review) return; if(G.over){ showResultsAgain(); return; } stopClock(); saveGame(); const m=G.mode, vc=vsComputer();
  const cv=$('#cover'); cv.innerHTML=`<h2>Paused</h2><button id="pRes">Resume</button>
   ${vc?'<button id="pDraw">Offer a draw</button>':''}${m==='tp'&&G.pos.side===G.me?'<button id="pDraw2">Offer a draw with your next move</button>':''}
   ${vc||m==='tp'||m==='pp'?'<button id="pResign">Resign</button>':''}
   ${isPuzzle()&&m!=='daily'?'<button id="pRestart">Restart</button>':''}${m==='daily'?'<button id="pGive">End attempt</button>':''}
   <button id="pSet">Settings</button><button id="pHow">How to play</button><button id="pQuit">Save and quit</button>`;
  cv.classList.add('on'); guard();
  $('#pRes').onclick=resume;
  if($('#pDraw')) $('#pDraw').onclick=()=>{ cv.classList.remove('on'); startClock(); offerDraw(); };
  if($('#pDraw2')) $('#pDraw2').onclick=()=>{ cv.classList.remove('on'); G.offerNext=true; toast('Your next move will offer a draw'); startClock(); };
  if($('#pResign')) $('#pResign').onclick=()=>{ if(!G.resArm){ G.resArm=true; $('#pResign').textContent=T('Tap again to resign'); return; } G.resArm=false; cv.classList.remove('on'); resign(); };
  if($('#pRestart')) $('#pRestart').onclick=()=>{ cv.classList.remove('on'); restartPuzzle(); };
  if($('#pGive')) $('#pGive').onclick=()=>{ if(!G.giveArm){ G.giveArm=true; $('#pGive').textContent=T('Tap again to end'); return; } cv.classList.remove('on'); puzzleDone(false); };
  $('#pSet').onclick=()=>{ cv.classList.remove('on'); openSettingsFromGame(); }; $('#pHow').onclick=openHowto;
  $('#pQuit').onclick=()=>{ cv.classList.remove('on'); leaveGame(); }; }
function resume(){ $('#cover').classList.remove('on'); if(G){ G.giveArm=false; G.resArm=false; } startClock(); if(G&&!G.over&&vsComputer()&&G.pos.side!==G.me&&!G.thinking) nextTurn(); }
function showResultsAgain(){ openSheet(`<h2>${esc(T('Game over'))}</h2><div class="sub">${esc(T(RESULT_TEXT[G.reason]||''))}</div><div class="btns"><button class="ghost" id="raAn">Analysis</button><button class="primary" id="raHome">Home</button></div>`);
  $('#raAn').onclick=()=>{ closeSheet(); openAnalysis(G.anId||null); }; $('#raHome').onclick=()=>{ closeSheet(); G=null; goHome(); }; }
// Restart: the same puzzle with the clock at 0; hints already used keep it assisted
function restartPuzzle(){ if(!G||!G.pz) return; const r=puzzleRun(G.mode,G.pz,{lid:G.lid,set:G.set,streak:G.streak,date:G.date}); r.hints=G.hints; r.wrong=G.wrong; startGame(r); }

// ---------- keyboard: type moves (e4, Nf3, O-O) and press Enter ----------
document.addEventListener('keydown',e=>{ if(cur!=='game'||!G||sheetOn) return; if(coverOn()){ if(e.key==='Escape'||e.key==='p'||e.key==='P') resume(); return; }
  const k=e.key;
  if(k==='Escape'){ if(keyBuf){ keyBuf=''; hideBanner(); return; } if(G.review) leaveGame(); else openPause(); e.preventDefault(); return; }
  if(k==='ArrowLeft'){ $('#bPrev').click(); e.preventDefault(); return; } if(k==='ArrowRight'){ if(viewPly!=null) $('#bNext').click(); e.preventDefault(); return; }
  if(k==='Enter'){ if(keyBuf&&canMoveNow()){ const m=fromSan(G.pos,keyBuf); if(m){ keyBuf=''; hideBanner(); const ms=targetMoves(mFrom(m),mTo(m)); if(mPromo(m)) preMove(m); else preMove(m); } else { toast(TF('Not a legal move: {0}',keyBuf)); keyBuf=''; hideBanner(); } } return; }
  if(k==='Backspace'){ if(keyBuf){ keyBuf=keyBuf.slice(0,-1); keyBuf?showBanner(`<b data-raw>⌨ ${esc(keyBuf)}</b>`):hideBanner(); e.preventDefault(); } return; }
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='z'){ takeback(); e.preventDefault(); return; }
  if(!keyBuf&&!e.ctrlKey&&!e.metaKey){ const lk=k.toLowerCase();
    if(lk==='u'){ takeback(); return; } if(lk==='h'&&k==='h'){ doHint(); return; } if(lk==='f'&&k==='f'){ $('#bFlip').click(); return; } if(k==='p'){ openPause(); return; } }
  if(/^[a-hA-H1-8KQRBNOo0x=+#-]$/.test(k)&&!e.ctrlKey&&!e.metaKey&&!G.review){ keyBuf+=k; showBanner(`<b data-raw>⌨ ${esc(keyBuf)}</b>`); e.preventDefault(); } });

// ---------- win effects (Confetti, Fireworks; King Topple tips the losing king) ----------
function playWin(id,preview,card){ if(id==='topple'){ if(card){ const pv=card.querySelector('.pv svg:not(.i)')||card.querySelector('.pv'); pv.animate([{transform:'rotate(0)'},{transform:'rotate(80deg)',offset:.5},{transform:'rotate(80deg)'},{transform:'rotate(0)'}],{duration:2200,easing:'ease-in-out'}); } return; }
  const cv=$('#fxc'), dpr=Math.min(2,devicePixelRatio||1); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const W=innerWidth, H=innerHeight, ps=[], t0=performance.now(), cols=['#ffd54f','#ff7a7a','#7fd3ff','#b388ff','#7dffb0','#ffffff']; let dur=2600;
  if(id==='confetti'){ for(let k=0;k<160;k++) ps.push({k:'c',x:Math.random()*W,y:-20-Math.random()*H*.4,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6,vr:(Math.random()-.5)*.3,col:cols[k%5],born:Math.random()*600,a:1,w:6+Math.random()*5}); }
  else if(id==='fireworks'){ for(let b=0;b<7;b++){ const cx=W*(.15+Math.random()*.7), cy=H*(.15+Math.random()*.4), col=cols[b%5]; for(let k=0;k<46;k++){ const a=k/46*Math.PI*2, v=1.5+Math.random()*3.5; ps.push({k:'d',x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,born:b*320,col,a:1}); } } }
  const frame=()=>{ const t=performance.now()-t0; g.clearRect(0,0,W,H);
    for(const p of ps){ if(t<p.born) continue;
      if(p.k==='d'){ p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.vx*=.985; p.a-=.012; g.globalAlpha=Math.max(0,p.a); g.fillStyle=p.col; g.beginPath(); g.arc(p.x,p.y,2.2,0,7); g.fill(); g.globalAlpha=1; continue; }
      p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; if(t>dur-700) p.a-=.025; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.globalAlpha=Math.max(0,p.a); g.fillStyle=p.col; g.fillRect(-p.w/2,-p.w/4,p.w,p.w/2); g.restore(); }
    if(t<dur+900) requestAnimationFrame(frame); else g.clearRect(0,0,W,H); };
  requestAnimationFrame(frame); }

// ===================== START =====================
function boot(){ applyLook(); startI18n(); renderHome();
  if(location.hash==='#game-settings'){ openSettings(); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
  if(ARCADE) writeSummary();
  if(S.seenVer&&S.seenVer!==VERSION){ S.seenVer=VERSION; persist(); setTimeout(openNews,400); } else if(!S.seenVer){ S.seenVer=VERSION; persist(); }
  setTimeout(pumpAnalysis,1500); }
addEventListener('pageshow',()=>{ refreshShared(); applyLook(); if(G&&cur==='game') render(); });
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyLook);
boot();
</script>
