<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f2f1ee" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<title>Drift</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="../fonts.css">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arcade">

<script>window.__ARCADE__=1</script>
<style>
:root{--bg:#f2f1ee;--panel:#fff;--ink:#1c1c1e;--sub:#8a8a90;--accent:#2b2f3a;--accentInk:#fff;--line:rgba(0,0,0,.08);--gold:#e8a913;--bez:#2c3446;--bezHi:#3d4760;--bezInk:#e9ecf2;--btn:#171b24;--btnHi:#262c38;--ab:#3f8cff;--abInk:#fff;--ab2:#e8664a}
.dark{--bg:#101114;--panel:#1b1c20;--ink:#f2f2f4;--sub:#8d8e96;--accent:#e9eaee;--accentInk:#15161a;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
textarea{width:100%;font:12px/1.4 'JetBrains Mono',monospace;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:none;-webkit-user-select:text;user-select:text}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;flex:1;padding:16px 16px 36px;max-width:560px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h2{font-size:24px;font-weight:800;letter-spacing:-.03em;flex:1;min-width:0}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 0 16px}
.brand h1{font-size:42px;font-weight:800;letter-spacing:-.045em;line-height:1}
.brand p{color:var(--sub);font-size:14px;margin-top:8px;line-height:1.35}
.acts{display:flex;gap:8px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.backbtn{height:36px;padding:0 12px 0 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-bottom:6px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:22px 4px 10px;display:flex;justify-content:space-between;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 15px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:10px;transition:transform .12s;min-width:0}
button.card:active{transform:scale(.98)}
.card .t{font-weight:700;font-size:17px;letter-spacing:-.01em}
.card .s{color:var(--sub);font-size:13px;margin-top:2px;line-height:1.3;overflow-wrap:anywhere}
.card .grow{flex:1;min-width:0}
.card .r{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex:none;max-width:42%}
.card .r b{display:block;font-size:15px}
.card .r span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.card.dim{opacity:.55}
.ico{width:42px;height:42px;border-radius:12px;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.ico svg{width:26px;height:26px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row3 .card{flex-direction:column;align-items:flex-start;gap:8px;margin:0;padding:12px}
.row3 .card .t{font-size:14px}
.lvl .badge{width:50px;height:50px;border-radius:15px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.primary{background:var(--accent);color:var(--accentInk);border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;width:100%;transition:transform .12s}
.primary:active{transform:scale(.98)}
.ghost{background:var(--bg);border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;width:100%}
.btns{display:flex;gap:8px;margin-top:14px}
.btns>*{flex:1}
.seg{display:flex;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;padding:9px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);min-width:0}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.dark .seg button.on{background:#2a2b31}
.opt{margin:12px 0}
.opt>.h{font-size:12px;font-weight:700;color:var(--sub);margin:0 2px 6px;display:flex;justify-content:space-between;gap:8px}
.mods .opt{margin:9px 0}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;width:100%;font-weight:600;font-size:15px;text-align:left}
.srow .d{font-size:12.5px;color:var(--sub);font-weight:500;margin-top:2px}
.srow>div{min-width:0}
.sw{width:46px;height:28px;border-radius:99px;background:var(--bg);position:relative;transition:background .2s;flex:none;border:1px solid var(--line)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--sub);transition:left .2s,background .2s}
.sw.on{background:var(--accent)}.sw.on::after{left:21px;background:var(--accentInk)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 14px;margin-bottom:10px}
.box .srow+.srow{border-top:1px solid var(--line)}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px;white-space:nowrap}
.stars .o{color:var(--sub);opacity:.45}
.topseg{background:var(--panel);border:1px solid var(--line);margin:0 0 14px;flex-wrap:nowrap}
.topseg button{font-size:11.5px;padding:9px 2px;flex:1 1 auto;white-space:nowrap;letter-spacing:-.01em}
.topseg button.on{background:var(--accent);color:var(--accentInk)}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px;text-align:left;position:relative;transition:transform .12s}
.tcard:active{transform:scale(.98)}
.tcard canvas{width:100%;aspect-ratio:7/4;border-radius:12px;display:block}
.tcard .n{font-weight:700;font-size:14px;margin:9px 5px 2px}
.tcard .q{font-size:11.5px;color:var(--sub);margin:0 5px 5px;line-height:1.3;min-height:2.6em}
.tcard.sel{box-shadow:0 0 0 2.5px var(--accent)}
.tcard.locked canvas{filter:grayscale(.9);opacity:.45}
.tcard .big{aspect-ratio:7/4;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.tcard .big svg.i{width:38px;height:38px;stroke-width:1.6}
.tcard.locked .big{opacity:.45}
.lock{position:absolute;top:13px;right:13px;width:28px;height:28px;border-radius:9px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.lock svg.i{width:15px;height:15px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 0;border-radius:10px;font-weight:700;font-size:13px;color:var(--sub);min-width:0}
.tabs button.on{background:var(--accent);color:var(--accentInk)}
.lvcard .num{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.lvcard.boss .num{background:var(--accent);color:var(--accentInk)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
.tbl th{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700;border:0}
.tbl td:first-child,.tbl th:first-child{text-align:left;font-weight:600}
.ach{display:flex;gap:12px;align-items:center;padding:10px 2px}
.ach+.ach{border-top:1px solid var(--line)}
.ach .m{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none;font-size:16px}
.ach.done .m{background:var(--gold);color:#3a2a00}
.ach .n{font-weight:700;font-size:14.5px}.ach .d{color:var(--sub);font-size:12.5px;margin-top:1px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:0 0 env(safe-area-inset-bottom)}
#ov.on{display:flex}
#sheet{background:var(--panel);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px 20px;max-height:92vh;overflow-y:auto;overflow-x:hidden;animation:up .22s ease-out}
@media (min-height:700px) and (min-width:600px){ #ov{align-items:center} #sheet{border-radius:24px} }
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
#sheet .sub{color:var(--sub);font-size:14px;line-height:1.4;margin-bottom:12px}
.goal{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px;font-weight:600}
.goal .st{font-size:18px;color:var(--sub);opacity:.4;width:22px;text-align:center;flex:none}
.goal.got .st{color:var(--gold);opacity:1}
.goal.new .st{animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--bg);border-radius:12px;padding:9px 4px;text-align:center;min-width:0}
.kv b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.kv span{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;font-weight:700;overflow-wrap:anywhere}
.howto p{font-size:14px;line-height:1.5;margin:6px 0}
.howto p+p{margin-top:8px}
.howto h3{font-size:15px;margin:14px 0 4px}
#toast{position:fixed;left:50%;top:0;transform:translate(-50%,calc(-100% - env(safe-area-inset-top) - 20px));opacity:0;background:var(--accent);color:var(--accentInk);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:40;transition:transform .35s,opacity .35s;max-width:calc(100vw - 24px);text-align:center;pointer-events:none;margin-top:calc(env(safe-area-inset-top) + 10px)}
#toast.on{transform:translate(-50%,0);opacity:1}
#fxc{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
/* ===== console ===== */
#game{background:var(--bg)}
.console{flex:1;display:flex;flex-direction:column;min-height:0;margin:6px 8px 8px;border-radius:26px 26px 44px 26px;background:linear-gradient(170deg,var(--bezHi),var(--bez) 45%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.18),0 8px 24px rgba(0,0,0,.18);padding:12px 12px 10px;transition:box-shadow .2s}
.console.pulse{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 0 3px var(--ab2),0 0 30px var(--ab2)}
.scrwrap{flex:0 0 57%;min-height:0;display:flex;flex-direction:column;background:#11141a;border-radius:14px 14px 30px 14px;padding:10px 12px 8px;box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.scrhead{display:flex;align-items:center;gap:8px;color:#8d93a0;font-size:9px;font-weight:700;letter-spacing:.14em;margin:0 2px 6px}
.led{width:7px;height:7px;border-radius:50%;background:#3fd37a;box-shadow:0 0 6px #3fd37a}
.scr{flex:1;min-height:0;position:relative;border-radius:6px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.logo{text-align:left;color:var(--bezInk);font-weight:800;font-size:15px;letter-spacing:.32em;margin:10px 6px 0;opacity:.85}
.logo i{font-style:normal;font-weight:500;letter-spacing:.12em;font-size:9px;opacity:.65;margin-left:6px}
#zone{flex:1;min-height:150px;position:relative;touch-action:none;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;align-items:center;padding:4px 4px 0;-webkit-user-select:none;user-select:none}
#zone.lefty .dpad{order:2}#zone.lefty .ab{order:1}
.dpad{justify-self:center;display:grid;grid-template:repeat(3,var(--b)) / repeat(3,var(--b));--b:52px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25));touch-action:none}
#zone.lg .dpad,#zone.lg .ab{--b:62px}
.dpad>*{background:var(--btn);color:#9aa1ad;display:grid;place-items:center;touch-action:none;pointer-events:none}
.dpad svg{width:22px;height:22px;fill:currentColor;stroke:none}
.dpad .u{grid-area:1/2;border-radius:8px 8px 0 0}.dpad .l{grid-area:2/1;border-radius:8px 0 0 8px}.dpad .r{grid-area:2/3;border-radius:0 8px 8px 0}.dpad .d{grid-area:3/2;border-radius:0 0 8px 8px}
.dpad .c{grid-area:2/2}
.dpad .down,.ab button.down,.pills button.down{background:var(--btnHi);transform:translateY(2px)}
.ab{justify-self:center;display:flex;gap:16px;align-items:center;--b:52px}
.ab button{width:calc(var(--b)*1.18);height:calc(var(--b)*1.18);border-radius:50%;background:var(--ab);color:var(--abInk);font-weight:800;font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.28);touch-action:none;display:grid;place-items:center;line-height:1}
.ab button.b{background:var(--ab2)}
.ab button small{display:block;font-size:8px;font-weight:700;letter-spacing:.06em;opacity:.85;margin-top:2px}
.ab button.down{filter:brightness(.85);box-shadow:0 1px 0 rgba(0,0,0,.28);transform:translateY(2px)}
.pills{grid-column:1/3;display:flex;justify-content:center;gap:22px;padding:8px 0 6px}
.pills button{min-width:64px;height:26px;border-radius:99px;background:var(--btn);color:#a8aebb;font-size:9.5px;font-weight:800;letter-spacing:.1em;touch-action:none;padding:0 12px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.pills label{display:block;text-align:center;font-size:9px;letter-spacing:.12em;color:var(--bezInk);opacity:.7;font-weight:700;margin-top:5px}
.stickpad{grid-column:1/3;align-self:stretch;display:none;grid-template-columns:1fr 1fr;gap:8px;margin:6px 4px;min-height:120px}
.stickpad>div{border:1.5px dashed rgba(255,255,255,.25);border-radius:18px;display:grid;place-items:center;text-align:center;color:var(--bezInk);font-size:11.5px;font-weight:600;line-height:1.45;position:relative;overflow:hidden}
.stickpad>div span{opacity:.5;pointer-events:none}
.stickpad .fire.down{background:rgba(63,140,255,.18)}
#knob{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);pointer-events:none;display:none}
#knobBase{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1.5px solid rgba(255,255,255,.18);pointer-events:none;display:none}
#zone.stick .dpad,#zone.stick .ab{display:none}
#zone.stick .stickpad{display:grid}
#zone.donly .ab .a{visibility:hidden}
@media (min-aspect-ratio:5/4){
 .console{display:grid;grid-template-columns:minmax(170px,1fr) minmax(0,3.2fr) minmax(170px,1fr);grid-template-rows:minmax(0,1fr) auto;border-radius:40px;padding:14px 18px;max-width:1300px;margin:8px auto;width:calc(100% - 16px)}
 .scrwrap{grid-column:2;grid-row:1;min-height:0}
 .logo{display:none}
 #zone{display:contents}
 #zone .dpad{grid-column:1;grid-row:1;align-self:center;justify-self:center}
 #zone .ab{grid-column:3;grid-row:1;align-self:center;justify-self:center}
 #zone.lefty .dpad{grid-column:3}#zone.lefty .ab{grid-column:1}
 #zone .pills{grid-column:2;grid-row:2;padding:10px 0 0}
 #zone .stickpad{grid-column:1/4;grid-row:1;display:none}
 #zone.stick .stickpad{display:grid;grid-template-columns:minmax(170px,1fr) minmax(0,3.2fr) minmax(170px,1fr);background:none;margin:0;pointer-events:none}
 #zone.stick .stickpad>div{pointer-events:auto;align-self:center;min-height:220px}
 #zone.stick .stickpad .fire{grid-column:3}
}
.scr .cd{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:800 64px/1 Inter,sans-serif;text-shadow:0 4px 20px rgba(0,0,0,.5);pointer-events:none}
</style>
</head>
<body>
<div id="toast"></div>
<canvas id="fxc"></canvas>

<!-- HOME -->
<section class="screen on" id="home"><div class="scroll">
  <button class="backbtn" id="arcadeBtn" hidden><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Arcade</button>
  <div class="brand"><div><h1 data-raw>Drift</h1><p>Thrust, shoot, clear the field.</p></div>
    <div class="acts"><button class="iconbtn" id="styleBtn" aria-label="Style"><svg class="i" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 000 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A5.6 5.6 0 0022 9.8C22 5.5 17.5 2 12 2z"/></svg></button>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button></div></div>
  <div id="homeBody"></div>
</div></section>

<section class="screen" id="camp"><div class="scroll" id="campBody"></div></section>
<section class="screen" id="records"><div class="scroll" id="recBody"></div></section>
<section class="screen" id="progress"><div class="scroll" id="progBody"></div></section>
<section class="screen" id="style"><div class="scroll"><div class="top"><button class="iconbtn" data-home aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><h2>Style</h2><span class="stars" style="color:var(--sub);font-weight:700" id="sCount"></span></div><div class="seg topseg" id="styleTabs"></div><div id="styleBody"></div></div></section>
<section class="screen" id="set"><div class="scroll" id="setBody"></div></section>

<!-- GAME: a handheld console. The screen shows the game only; the control zone is the only in-game touch area. -->
<section class="screen" id="game">
  <div class="console" id="console">

      <div class="stickpad" id="stickpad"><div class="steer" id="steerPad"><span>Drag to steer<br>further = more thrust</span><div id="knobBase"></div><div id="knob"></div></div><div class="fire" id="firePad"><span>Hold to fire<br>double-tap to dash</span></div></div>

    </div>
  </div>
</section>

<div id="ov"><div id="sheet"></div></div>

<script>// ===================== Drift engine =====================
// Pure: no DOM, no timers. step(st, inputs) advances one 60 Hz logic tick. All randomness comes from the run's seeded
// RNG (cyrb128 -> sfc32) and angles use a 256-step lookup table, so the same seed and input stream give the same run,
// and all state is plain JSON (saves resume exactly). The engine only knows world coordinates: the camera, radar and
// wrapped drawing live in app.html. Angles: 0 = up, 64 = right, 128 = down, 192 = left (screen y grows downward).
const DR_HZ=60;
// ---------- seeded RNG: cyrb128 -> sfc32 (as in Sweep and Linefall), state kept as plain numbers ----------
function rngFrom(str){
  let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;
  for(let i=0;i<str.length;i++){ const k=str.charCodeAt(i); h1=h2^Math.imul(h1^k,597399067); h2=h3^Math.imul(h2^k,2869860233); h3=h4^Math.imul(h3^k,951274213); h4=h1^Math.imul(h4^k,2716044813); }
  h1=Math.imul(h3^(h1>>>18),597399067); h2=Math.imul(h4^(h2>>>22),2869860233); h3=Math.imul(h1^(h3>>>17),951274213); h4=Math.imul(h2^(h4>>>19),2716044813);
  const R={a:(h1^h2^h3^h4)>>>0,b:(h2^h1)>>>0,c:(h3^h1)>>>0,d:(h4^h1)>>>0}; for(let i=0;i<15;i++) rnd(R); return R; }
function rnd(R){ let a=R.a>>>0,b=R.b>>>0,c=R.c>>>0,d=R.d>>>0; let t=(a+b)|0; a=b^(b>>>9); b=(c+(c<<3))|0; c=(c<<21)|(c>>>11); d=(d+1)|0; t=(t+d)|0; c=(c+t)|0;
  R.a=a>>>0; R.b=b>>>0; R.c=c>>>0; R.d=d>>>0; return (t>>>0)/4294967296; }
const rint=(R,n)=>Math.floor(rnd(R)*n);
const randSeed=()=>'DR'+Date.now().toString(36)+Math.floor(Math.random()*1e9).toString(36);
function fnv(arr){ let h=2166136261; for(const v of arr){ const n=v|0; for(let s=0;s<32;s+=8){ h^=(n>>>s)&255; h=Math.imul(h,16777619); } } return (h>>>0).toString(16).padStart(8,'0'); }

// ---------- angles: a 256-step table (rounded so every engine builds the same table) ----------
const ASIN=[], ACOS=[]; for(let i=0;i<256;i++){ ASIN.push(Math.round(Math.sin(i*Math.PI/128)*1e6)/1e6); ACOS.push(Math.round(Math.cos(i*Math.PI/128)*1e6)/1e6); }
const aIdx=a=>Math.round(a)&255;
const dirX=a=>ASIN[aIdx(a)], dirY=a=>-ACOS[aIdx(a)];
const angDiff=(from,to)=>{ let d=((to-from)%256+256)%256; if(d>=128) d-=256; return d; }; // the short way, -128..127
// direction (dx,dy) -> nearest of the 256 steps, by a search over the table (no atan2 in the logic)
function angOf(dx,dy){ if(!dx&&!dy) return 0; let best=0, bv=-1e9; // coarse 16, then fine
  for(let i=0;i<256;i+=16){ const v=dx*ASIN[i]-dy*ACOS[i]; if(v>bv){ bv=v; best=i; } }
  let b2=best; for(let j=-8;j<=8;j++){ const i=(best+j+256)&255, v=dx*ASIN[i]-dy*ACOS[i]; if(v>bv){ bv=v; b2=i; } } return b2; }

// ---------- tuning (first estimates; tuned with the bots, tests/sim.js) ----------
const DIFFS={
  easy:{id:'easy',name:'Easy',W:800,H:1000,spd:1,mult:1,count:20,mix:[50,30,20],group:2,calm:3,groupT:540},
  normal:{id:'normal',name:'Normal',W:1200,H:1500,spd:1.5,mult:1.5,count:40,mix:[60,30,10],group:3,calm:5,groupT:420},
  hard:{id:'hard',name:'Hard',W:1600,H:2000,spd:2,mult:2,count:60,mix:[70,25,5],group:4,calm:7,groupT:360}};
const DIFF_IDS=['easy','normal','hard'];
const VIEW_W=700; // first estimate was 800; 700 keeps objects readable on a 360-412 px phone
// sizes: 1 Small, 2 Medium, 3 Large, 4 boss
const ROCK_R=[0,20,38,62,138], ROCK_HP=[0,1,2,3,0], ROCK_PTS=[0,20,40,60,0], ROCK_V=[0,1.55,1.1,0.75,0.35], ROCK_W=[0,1,3.5,8,0];
const SIZE_NAMES=['','Small','Medium','Large','Boss'];
const ROCK_TYPES=['stone','armour','volatile','ice','magnet','gold'];
const SHIP_R=18, THRUST=0.2, MAXV=7, DRAG=0.972, DRAG_MIN=0.02, BRAKE=0.9, TURN=256/54;
const BUL_V=12, BUL_LIFE=41, FIRE_CD=10, BUL_MAX=6, BUL_R=3;
const DASH_V=13, DASH_INV=18, DASH_CD=180, DIE_T=90, PROT_T=120, LIFE_EVERY=10000, LIVES_MAX=5;
const COMBO_T=90, PUP_LIFE=480, PUP_BLINK=120, PUP_T=600, PUP_R=16;
const PUP_KINDS=['spread','rapid','pierce','shield','shock'];
const DRONE_R=22, DRONE_HP=2, DRONE_PTS=200, DRONE_LIFE=1500, DSHOT_V=4, DSHOT_LIFE=160;
const BOOM_R=120, SHOCK_R=300, MAG_R=250, WELL_K=10;
const CLEARING_T=45;

// ---------- modifiers (section 5) ----------
const MODS={
  wrap:{name:'Wrap',opts:[['none','None',1],['lr','Left/Right',1],['all','All sides',1]],def:'none'},
  density:{name:'Density',opts:[['few','Fewer',0.8],['normal','Normal',1],['more','More',1.2]],def:'normal'},
  speed:{name:'Rock speed',opts:[['slow','Slow',0.8],['normal','Normal',1],['fast','Fast',1.25]],def:'normal'},
  types:{name:'Rock types',opts:[['stone','Stone only',1],['mixed','Mixed',1.1]],def:'stone'},
  pups:{name:'Power-ups',opts:[['on','On',1],['off','Off',1.15]],def:'on'},
  drones:{name:'Hunter drones',opts:[['off','Off',1],['on','On',1.15]],def:'off'},
  drag:{name:'Drag',opts:[['normal','Normal',1],['space','True space',1.25]],def:'normal'},
  well:{name:'Gravity well',opts:[['off','Off',1],['on','On',1.2]],def:'off'},
  ricochet:{name:'Ricochet',opts:[['off','Off',1],['on','On',0.9]],def:'off'},
  lives:{name:'Lives',opts:[['3','3',1],['1','1 (Hardcore)',1.5]],def:'3'},
  fog:{name:'Fog',opts:[['off','Off',1],['on','On',1.25]],def:'off'}};
const MOD_IDS=Object.keys(MODS);
const DENSITY={few:0.75,normal:1,more:1.5}, SPEEDMOD={slow:0.8,normal:1,fast:1.25};
// Normal mode defaults per difficulty: mixed rock types and drones from Normal up
function defMods(diff){ const m={}; for(const k of MOD_IDS) m[k]=MODS[k].def; if(diff!=='easy'){ m.types='mixed'; m.drones='on'; } return m; }
function modMult(m){ let x=1; for(const k of MOD_IDS){ const o=MODS[k].opts.find(o=>o[0]===m[k]); if(o) x*=o[2]; } return Math.round(x*1000)/1000; }
const MIXED_TYPES=[['stone',60],['armour',10],['volatile',9],['ice',9],['magnet',8],['gold',4]];

// Normal-mode config from a difficulty and modifiers
function normalCfg(diff,mods,extra){ const D=DIFFS[diff], m=Object.assign(defMods(diff),mods||{});
  return Object.assign({mode:'normal',diff,W:D.W,H:D.H,count:Math.round(D.count*DENSITY[m.density]),mix:D.mix.slice(),
    types:m.types==='mixed'?MIXED_TYPES:[['stone',1]],spd:D.spd*SPEEDMOD[m.speed],wrap:m.wrap,drones:m.drones==='on',
    droneEvery:[2400,3600],droneFast:false,pups:m.pups==='on',pupKinds:PUP_KINDS.slice(),space:m.drag==='space',nobrake:m.drag==='space',
    well:m.well==='on',ricochet:m.ricochet==='on',lives:+m.lives,fog:m.fog==='on',group:D.group,calm:D.calm,groupT:D.groupT,
    boss:null,mult:D.mult*modMult(m),mods:m,seed:randSeed()},extra||{}); }

// ---------- new game ----------
function newGame(cfg){ const c=Object.assign({mode:'normal',diff:'easy',W:800,H:1000,count:20,mix:[50,30,20],types:[['stone',1]],spd:1,wrap:'none',
    drones:false,droneEvery:[2400,3600],droneFast:false,pups:true,pupKinds:PUP_KINDS.slice(),space:false,nobrake:false,well:false,ricochet:false,
    lives:3,fog:false,group:2,calm:3,groupT:540,boss:null,mult:1,seed:'drift',steer:'direct',fire:'hold'},cfg);
  const R=rngFrom(c.seed+'|run');
  const st={v:1,cfg:c,W:c.W,H:c.H,wx:c.wrap!=='none',wy:c.wrap==='all',tick:0,phase:'play',pt:0,rng:R,nid:1,
    ship:{x:c.W/2,y:c.H/2,vx:0,vy:0,a:0,dead:0,prot:PROT_T,inv:0,dash:0,dashCd:0,fireCd:0,shield:false,thrust:0,wall:0,held:0},
    in:{left:0,right:0,up:0,down:0,fire:0,sx:0,sy:0,firePress:0,dirT:0},
    bullets:[],rocks:[],drones:[],dshots:[],pups:[],pulses:[],pending:[],queue:[],spawnT:60,droneT:0,
    score:0,lives:c.lives,nextLife:LIFE_EVERY,combo:{n:0,t:0},power:{held:null,active:null,t:0},
    wave:0,waveT:0,total:0,
    stats:{shots:0,hits:0,kills:0,livesLost:0,comboMax:0,gold:0,closeCall:0,dashes:0,chainMax:0,droneKills:0,pupsUsed:0,escaped:0,shock:0},
    result:null,ev:[],chains:{}};
  if(c.mode==='endless'){ st.wave=0; nextWave(st); }
  else { fillQueue(st,c.count,c.mix,c.types); if(c.boss) spawnBoss(st,c.boss); }
  st.total=remaining(st); return st; }

function pickType(st,types){ let tot=0; for(const [,w] of types) tot+=w; let r=rnd(st.rng)*tot; for(const [t,w] of types){ r-=w; if(r<0) return t; } return types[0][0]; }
function fillQueue(st,n,mix,types){ for(let i=0;i<n;i++){ const r=rnd(st.rng)*100, size=r<mix[0]?3:r<mix[0]+mix[1]?2:1; st.queue.push({size,type:pickType(st,types)}); } }
// rock left, in units of Smalls: a Large counts as its full set of pieces
function rockWeight(r){ if(r.size===4) return 24+30*r.hp/r.maxHp; if(r.orb) return 2; return ROCK_W[r.size]; }
function remaining(st){ let w=0; for(const q of st.queue) w+=ROCK_W[q.size]; for(const p of st.pending) w+=ROCK_W[p.size]; for(const r of st.rocks) w+=rockWeight(r); return w; }
const progress=st=>st.total?Math.max(0,Math.min(1,1-remaining(st)/st.total)):1;

// ---------- geometry with wrap ----------
const wd=(d,L)=>d-L*Math.round(d/L);
const dxOf=(st,a,b)=>st.wx?wd(b-a,st.W):b-a, dyOf=(st,a,b)=>st.wy?wd(b-a,st.H):b-a;
function dist2(st,a,b){ const dx=dxOf(st,a.x,b.x), dy=dyOf(st,a.y,b.y); return dx*dx+dy*dy; }
const wrapPos=(st,o)=>{ if(st.wx) o.x=((o.x%st.W)+st.W)%st.W; if(st.wy) o.y=((o.y%st.H)+st.H)%st.H; };
// spatial hash grid over rocks (cell 128): bullets and the ship only test nearby rocks
const CELL=128;
function buildGrid(st){ const g=new Map(), cols=Math.ceil(st.W/CELL), rows=Math.ceil(st.H/CELL);
  st.rocks.forEach(r=>{ const x0=Math.floor((r.x-r.r)/CELL), x1=Math.floor((r.x+r.r)/CELL), y0=Math.floor((r.y-r.r)/CELL), y1=Math.floor((r.y+r.r)/CELL);
    for(let cx=x0;cx<=x1;cx++) for(let cy=y0;cy<=y1;cy++){ const kx=st.wx?((cx%cols)+cols)%cols:cx, ky=st.wy?((cy%rows)+rows)%rows:cy, k=(kx+64)*8192+(ky+64);
      let a=g.get(k); if(!a){ a=[]; g.set(k,a); } a.push(r); } });
  return {g,cols,rows}; }
function nearRocks(st,G,x,y,rad){ const out=new Set(), x0=Math.floor((x-rad)/CELL), x1=Math.floor((x+rad)/CELL), y0=Math.floor((y-rad)/CELL), y1=Math.floor((y+rad)/CELL);
  for(let cx=x0;cx<=x1;cx++) for(let cy=y0;cy<=y1;cy++){ const kx=st.wx?((cx%G.cols)+G.cols)%G.cols:cx, ky=st.wy?((cy%G.rows)+G.rows)%G.rows:cy, a=G.g.get((kx+64)*8192+(ky+64)); if(a) for(const r of a) out.add(r); }
  return [...out].filter(r=>st.rocks.indexOf(r)>=0).sort((a,b)=>a.id-b.id); }

// ---------- input ----------
// events: ['p',key] / ['r',key] for left right up down fire; ['p','dash']; ['p','use']; ['stick',ax,ay] with ax,ay in -64..64 (0,0 = released)
function applyInputs(st,ins){ const I=st.in;
  for(const e of ins||[]){ const [ty,k]=e;
    if(ty==='stick'){ I.sx=Math.max(-64,Math.min(64,e[1]|0)); I.sy=Math.max(-64,Math.min(64,e[2]|0)); continue; }
    if(ty==='p'){ if(k==='dash') I.dashP=1; else if(k==='use') I.useP=1; else if(k in I){ if(k==='fire'&&!I.fire) I.firePress++; I[k]=1; } }
    else if(ty==='r'&&k in I) I[k]=0; } }
const DIR8={'0,-1':0,'1,-1':32,'1,0':64,'1,1':96,'0,1':128,'-1,1':160,'-1,0':192,'-1,-1':224};

// ---------- the tick ----------
function step(st,ins){ st.ev=[]; st.chains={}; applyInputs(st,ins);
  if(st.phase==='over'||st.phase==='done') return st;
  st.tick++;
  if(st.phase==='clearing'){ shipStep(st); moveWorld(st); if(++st.pt>=CLEARING_T) finish(st,true); return st; }
  if(st.phase==='break'){ moveWorld(st); shipStep(st); if(++st.pt>=180){ st.phase='play'; st.pt=0; nextWave(st); } return st; }
  if(st.phase==='dying'){ moveWorld(st); if(++st.pt>=DIE_T) finish(st,false); return st; }
  shipStep(st); spawnStep(st); droneSpawn(st); moveWorld(st); collide(st); bossStep(st);
  if(st.combo.t>0&&--st.combo.t===0) st.combo.n=0;
  if(st.power.active&&--st.power.t<=0){ st.ev.push({e:'pupEnd',k:st.power.active}); st.power.active=null; }
  // cleared?
  if(st.phase==='play'&&!st.queue.length&&!st.pending.length&&!st.rocks.length){
    if(st.cfg.mode==='endless'){ const b=100*st.wave; st.score+=b; checkLife(st); st.ev.push({e:'wave',n:st.wave,bonus:b}); st.phase='break'; st.pt=0; st.drones.forEach(d=>d.life=Math.min(d.life,0)); }
    else { st.phase='clearing'; st.pt=0; st.ev.push({e:'clear'}); st.drones.forEach(d=>d.life=0); } }
  st.in.dashP=0; st.in.useP=0; return st; }

function finish(st,ok){ st.phase=ok?'done':'over'; const s=st.stats;
  st.result={ok,score:st.score,ticks:st.tick,livesLost:s.livesLost,shots:s.shots,hits:s.hits,acc:s.shots?s.hits/s.shots:0,comboMax:s.comboMax,
    kills:s.kills,wave:st.wave,stats:Object.assign({},s),lives:st.lives};
  st.ev.push({e:ok?'done':'over'}); }

// ---------- ship ----------
function shipStep(st){ const sh=st.ship, I=st.in, c=st.cfg;
  if(sh.dead){ if(--sh.dead===0) respawn(st); return; }
  if(sh.inv>0) sh.inv--; if(sh.dashCd>0) sh.dashCd--; if(sh.fireCd>0) sh.fireCd--;
  let thrust=0, target=null, brake=false;
  const stickM=Math.sqrt(I.sx*I.sx+I.sy*I.sy)/64;
  if(stickM>=0.15){ target=angOf(I.sx,I.sy); thrust=Math.max(0,Math.min(1,(stickM-0.3)/0.5)); }
  else if(c.steer==='classic'){ if(I.left) sh.a-=TURN; if(I.right) sh.a+=TURN; if(I.up) thrust=1; if(I.down) brake=true; }
  else { const dx=(I.right?1:0)-(I.left?1:0), dy=(I.down?1:0)-(I.up?1:0);
    if(dx||dy){ target=DIR8[dx+','+dy]; I.dirT++; thrust=I.dirT>6?1:0; } else I.dirT=0; }
  if(target!==null){ const d=angDiff(sh.a,target); sh.a+=Math.max(-TURN,Math.min(TURN,d)); if(Math.abs(angDiff(sh.a,target))>48) thrust=0; }
  sh.a=((sh.a%256)+256)%256;
  sh.thrust=thrust;
  if(thrust>0){ sh.vx+=dirX(sh.a)*THRUST*thrust; sh.vy+=dirY(sh.a)*THRUST*thrust; if(sh.prot) sh.prot=0; }
  else if(!c.space){ const dr=c.glide?0.986:DRAG; sh.vx*=dr; sh.vy*=dr; const v=Math.sqrt(sh.vx*sh.vx+sh.vy*sh.vy); if(v<DRAG_MIN*6){ const k=Math.max(0,v-DRAG_MIN)/(v||1); sh.vx*=k; sh.vy*=k; } }
  if(brake&&!c.nobrake){ sh.vx*=BRAKE; sh.vy*=BRAKE; }
  // magnetic rocks and the gravity well pull the ship
  for(const r of st.rocks){ const rng=r.boss==='leviathan'?500:r.type==='magnet'?MAG_R:0; if(!rng) continue;
    const dx=dxOf(st,sh.x,r.x), dy=dyOf(st,sh.y,r.y), d=Math.sqrt(dx*dx+dy*dy); if(d<rng&&d>1){ const k=(r.boss?0.09:0.05)*(1-d/rng)/d; sh.vx+=dx*k; sh.vy+=dy*k; } }
  if(c.well) pullWell(st,sh,1);
  let v=Math.sqrt(sh.vx*sh.vx+sh.vy*sh.vy), cap=sh.dash>0?DASH_V:MAXV; if(v>cap){ sh.vx*=cap/v; sh.vy*=cap/v; }
  if(sh.dash>0) sh.dash--;
  sh.x+=sh.vx; sh.y+=sh.vy; sh.wall=0; softWall(st,sh,SHIP_R); wrapPos(st,sh);
  if(sh.prot>0) sh.prot--;
  // dash
  if(I.dashP&&sh.dashCd===0){ sh.vx=dirX(sh.a)*DASH_V; sh.vy=dirY(sh.a)*DASH_V; sh.dash=DASH_INV; sh.inv=Math.max(sh.inv,DASH_INV); sh.dashCd=DASH_CD; st.stats.dashes++; sh.prot=0; st.ev.push({e:'dash',x:sh.x,y:sh.y,a:sh.a}); }
  // power-up
  if(I.useP&&st.power.held) usePower(st);
  // fire
  const mode=c.fire; let want=false;
  if(mode==='on') want=sh.prot===0;
  else if(mode==='hold') want=!!I.fire||I.firePress>0;
  else if(mode==='tap') want=I.firePress>0;
  else if(mode==='range'){ for(const r of st.rocks){ if(dist2(st,sh,r)<(560+r.r)*(560+r.r)){ want=sh.prot===0; break; } } }
  if(want&&sh.fireCd===0&&fire(st)) I.firePress=0; // a press during the cooldown is buffered
  if(mode==='on'||mode==='range') I.firePress=0; }
function softWall(st,o,r){ let hit=0;
  if(!st.wx){ if(o.x<r){ o.x=r; if(o.vx<0) o.vx=0; hit=1; } else if(o.x>st.W-r){ o.x=st.W-r; if(o.vx>0) o.vx=0; hit=1; } }
  if(!st.wy){ if(o.y<r){ o.y=r; if(o.vy<0) o.vy=0; hit=1; } else if(o.y>st.H-r){ o.y=st.H-r; if(o.vy>0) o.vy=0; hit=1; } }
  if(hit&&o===st.ship){ o.wall=1; } return hit; }
function pullWell(st,o,k){ const dx=dxOf(st,o.x,st.W/2), dy=dyOf(st,o.y,st.H/2), d=Math.sqrt(dx*dx+dy*dy); if(d<4) return; const a=WELL_K/Math.max(d,70)*k/d; o.vx+=dx*a; o.vy+=dy*a; }
function fire(st){ const sh=st.ship, c=st.cfg, P=st.power.active, spread=P==='spread', rapid=P==='rapid';
  const mine=st.bullets.filter(b=>!b.d).length, cap=BUL_MAX*(spread?3:1)*(rapid?2:1); if(mine+(spread?3:1)>cap) return false;
  const angs=spread?[-12,0,12]:[0];
  for(const da of angs){ const a=sh.a+da, dx=dirX(a), dy=dirY(a);
    st.bullets.push({x:sh.x+dx*(SHIP_R+2),y:sh.y+dy*(SHIP_R+2),vx:dx*BUL_V+sh.vx,vy:dy*BUL_V+sh.vy,life:BUL_LIFE,pierce:P==='pierce',hit:[],bounced:false}); st.stats.shots++; }
  sh.fireCd=rapid?5:FIRE_CD; if(sh.prot) sh.prot=0; st.ev.push({e:'fire',x:sh.x,y:sh.y,a:sh.a}); return true; }
function usePower(st){ const k=st.power.held; st.power.held=null; st.stats.pupsUsed++; st.ev.push({e:'use',k});

function respawn(st){ const sh=st.ship, W=st.W, H=st.H; let best=null, bv=-1e9;

function shipHit(st,by){ const sh=st.ship; if(sh.dead||sh.inv>0||sh.prot>0||st.phase!=='play') return false;

  st.lives--; st.stats.livesLost++; sh.dead=DIE_T; sh.shield=false; st.ev.push({e:'boom',x:sh.x,y:sh.y,vx:sh.vx,vy:sh.vy});

// ---------- spawning: incoming rocks in groups, each announced ~1 s before it enters ----------
function spawnStep(st){ const c=st.cfg;
  for(const p of st.pending.slice()){ if(--p.t>0) continue; st.pending.splice(st.pending.indexOf(p),1);
    const r=makeRock(st,p.size,p.type,p.x,p.y,p.vx,p.vy); r.in=false; st.rocks.push(r); st.ev.push({e:'enter',x:p.x,y:p.y,size:p.size}); }
  if(!st.queue.length||st.pending.length) return;
  if(st.spawnT>0) st.spawnT--;

  if(st.spawnT>0&&inPlay>c.calm) return;
  if(inPlay>c.calm*2+2) return; // when the timer runs out, still wait if the field is crowded (wrapped rocks never leave)

  st.spawnT=c.groupT; }
function entry(st,size){ const R=st.rng, W=st.W, H=st.H, r=ROCK_R[size], edge=rint(R,4), f=0.1+rnd(R)*0.8;

const rockSpeed=(st,size)=>ROCK_V[size]*st.cfg.spd;
function makeRock(st,size,type,x,y,vx,vy){ const R=st.rng;

// ---------- moving everything ----------
function moveWorld(st){ const c=st.cfg;

  for(const b of st.bullets){ b.x+=b.vx; b.y+=b.vy; b.life--;
    let out=false; if(!st.wx&&(b.x<0||b.x>st.W)){ if(c.ricochet&&!b.bounced){ b.vx=-b.vx; b.bounced=true; b.x=Math.max(0,Math.min(st.W,b.x)); st.ev.push({e:'ric',x:b.x,y:b.y}); } else out=true; }
    if(!st.wy&&(b.y<0||b.y>st.H)){ if(c.ricochet&&!b.bounced){ b.vy=-b.vy; b.bounced=true; b.y=Math.max(0,Math.min(st.H,b.y)); st.ev.push({e:'ric',x:b.x,y:b.y}); } else out=true; }
    if(out) b.life=0; wrapPos(st,b); }
  st.bullets=st.bullets.filter(b=>b.life>0);
  for(const s of st.dshots){ s.x+=s.vx; s.y+=s.vy; s.life--; if((!st.wx&&(s.x<0||s.x>st.W))||(!st.wy&&(s.y<0||s.y>st.H))) s.life=0; wrapPos(st,s); }
  st.dshots=st.dshots.filter(s=>s.life>0);

  const keep=[];
  for(const r of st.rocks){ r.age++; if(r.flash>0) r.flash--; r.a+=r.spin;
    if(r.orb) { keep.push(r); continue; } // ring rocks are placed by their boss
    if(c.well&&!r.boss) pullWell(st,r,0.5);
    if(c.well||r.size===4){ const v=Math.sqrt(r.vx*r.vx+r.vy*r.vy), cap=Math.max(3.5,ROCK_V[Math.min(3,r.size)]*c.spd*3); if(v>cap){ r.vx*=cap/v; r.vy*=cap/v; } }

      if(!st.wy){ if(r.y<r.r&&r.vy<0&&r.age>200) r.vy=-r.vy; if(r.y>st.H-r.r&&r.vy>0) r.vy=-r.vy; }

// ---------- collisions ----------
function collide(st){ const G=buildGrid(st), sh=st.ship, dead=new Set();

    for(const r of nearRocks(st,G,b.x,b.y,BUL_R+4)){ if(dead.has(r.id)||b.hit.includes(r.id)) continue;
      const rr=r.r+BUL_R; if(dist2(st,b,r)>rr*rr) continue;
      st.stats.hits++; b.hit.push(r.id); const nx=b.vx, ny=b.vy, n=Math.sqrt(nx*nx+ny*ny)||1;

    if(b.life<=0) continue;

    for(const r of nearRocks(st,G,sh.x,sh.y,SHIP_R+4)){ if(dead.has(r.id)) continue; const rr=SHIP_R*0.8+r.r*0.85;
      if(dist2(st,sh,r)<rr*rr){ if(sh.dash>0){ if(!r.cc){ r.cc=1; st.stats.closeCall++; st.ev.push({e:'close'}); } continue; }
        if(sh.inv>0||sh.prot>0) continue; const shielded=sh.shield; if(shipHit(st,'rock')&&shielded){ const dx=dxOf(st,sh.x,r.x), dy=dyOf(st,sh.y,r.y), d=Math.sqrt(dx*dx+dy*dy)||1; if(damage(st,r,1,'ship',[dx/d,dy/d])) dead.add(r.id); } break; } }

// a bullet hits a rock: returns 'clank' (bounced off), 'hit' or 'dead'
function hitRock(st,r,b,nx,ny){

  if(r.boss==='leviathan'&&st.rocks.some(o=>o.orb&&o.orb.boss===r.id)){ st.ev.push({e:'clank',x:b.x,y:b.y}); return 'clank'; }

// damage a rock; returns true if destroyed. src: bullet | shock | boom | drone | ship
function damage(st,r,n,src,dir,crack,chain){ if(st.rocks.indexOf(r)<0) return false;

  if(r.arm){ r.arm=false; n--; if(n<=0){ r.flash=6; st.ev.push({e:'crack',x:r.x,y:r.y,size:r.size}); return false; } }
  r.hp-=n; r.flash=6;
  if(dir&&r.size<4){ const k=[0,0.6,0.35,0.2][r.size]; r.vx+=dir[0]*k; r.vy+=dir[1]*k; }
  if(r.size===4) bossDamaged(st,r);

function destroy(st,r,src,chain){ const i=st.rocks.indexOf(r); if(i<0) return; st.rocks.splice(i,1);

// ---------- hunter drones ----------
function droneSpawn(st){ const c=st.cfg; if(!c.drones) return;
  if(st.droneT<=0) st.droneT=c.droneEvery[0]+rint(st.rng,c.droneEvery[1]-c.droneEvery[0]+1);
  if(--st.droneT>0) return; if(st.queue.length+st.pending.length+st.rocks.length===0) return;

function spawnDrone(st){ const R=st.rng, edge=rint(R,4), f=0.15+rnd(R)*0.7, W=st.W, H=st.H, m=30;
  const x=edge===1?W+m:edge===3?-m:W*f, y=edge===0?-m:edge===2?H+m:H*f;
  st.drones.push({id:st.nid++,x,y,vx:0,vy:0,hp:DRONE_HP,t:0,life:DRONE_LIFE,fireT:90,orb:rint(R,256),dir:rnd(R)<0.5?-1:1,flash:0}); st.ev.push({e:'droneIn',x,y}); }
function droneMove(st){ const sh=st.ship, fast=st.cfg.droneFast, sp=fast?3.2:2.2;
  for(const d of st.drones){ d.t++; d.life--; if(d.flash>0) d.flash--;
    let tx, ty;
    if(d.life<=0){ // leaving: head for the nearest edge
      const ex=d.x<st.W/2?-200:st.W+200; tx=ex; ty=d.y; }
    else { d.orb+=0.7*d.dir; const R=260+60*ASIN[aIdx(d.t*1.3)]; tx=sh.x+dirX(d.orb)*R; ty=sh.y+dirY(d.orb)*R;
      tx=Math.max(40,Math.min(st.W-40,tx)); ty=Math.max(40,Math.min(st.H-40,ty)); }
    let dx=st.wx&&d.life>0?wd(tx-d.x,st.W):tx-d.x, dy=st.wy&&d.life>0?wd(ty-d.y,st.H):ty-d.y; const dd=Math.sqrt(dx*dx+dy*dy)||1;

    if(d.life>0) wrapPos(st,d);
    if(d.life<=0&&(d.x<-120||d.x>st.W+120||d.y<-120||d.y>st.H+120)){ d.hp=0; d.gone=1; continue; }
    // fire slow aimed shots
    if(d.life>0&&!sh.dead&&--d.fireT<=0){ d.fireT=fast?70:100; const sx=dxOf(st,d.x,sh.x), sy=dyOf(st,d.y,sh.y), s=Math.sqrt(sx*sx+sy*sy);
      if(s<620&&st.phase==='play'){ st.dshots.push({x:d.x,y:d.y,vx:sx/s*DSHOT_V,vy:sy/s*DSHOT_V,life:DSHOT_LIFE}); st.ev.push({e:'dshot',x:d.x,y:d.y}); } } }
  st.drones=st.drones.filter(d=>d.hp>0); }
function hitDrone(st,d,n,scored){ if(d.hp<=0) return; d.hp-=n; d.flash=6;
  if(d.hp<=0){ if(scored){ const pts=Math.round(DRONE_PTS*st.cfg.mult); st.score+=pts; checkLife(st); st.stats.droneKills++; st.ev.push({e:'droneKill',x:d.x,y:d.y,pts}); } else st.ev.push({e:'droneKill',x:d.x,y:d.y,pts:0}); }
  else st.ev.push({e:'droneHit',x:d.x,y:d.y}); }

// ---------- bosses (campaign level 15) ----------
const BOSSES={titan:{name:'Titan',hp:30},bastion:{name:'Bastion',hp:36},leviathan:{name:'Leviathan',hp:24}};
function spawnBoss(st,kind){ const B=BOSSES[kind], W=st.W;
  const r=makeRock(st,4,kind==='leviathan'?'volatile':kind==='bastion'?'armour':'stone',W/2,-120,0,1.2); r.arm=false;
  Object.assign(r,{boss:kind,hp:B.hp,maxHp:B.hp,r:kind==='leviathan'?78:138,stage:0,in:true,spin:kind==='bastion'?0.3:0.15,pulseT:240,escortT:0});
  if(kind==='bastion') r.cracks=[0,85,170];
  st.rocks.push(r);
  if(kind==='leviathan'){ for(let i=0;i<8;i++){ const o=makeRock(st,2,'stone',r.x,r.y,0,0); Object.assign(o,{r:42,hp:3,maxHp:3,orb:{boss:r.id,ang:i*32,rad:210}}); st.rocks.push(o); }
    spawnDrone(st); spawnDrone(st); }
  st.ev.push({e:'bossIn',k:kind}); }
function bossStep(st){
  for(const b of st.rocks){ if(b.size!==4) continue;

    if(b.boss==='leviathan'){

// ---------- bots: they play through step() with real inputs ----------
// casual: slower reactions, noisy aim, rarely dashes, uses power-ups at once (an average player)
// strong: quick reactions, good lead, dashes when a hit is about to land, saves the shield
const BOT_KINDS={casual:{react:14,noise:10,lead:0.5,dash:0.3,safe:130,fireErr:10},strong:{react:3,noise:1.5,lead:1,dash:1,safe:190,fireErr:5}};
function botThink(st,o,mem){ const sh=st.ship, R=o.R, out=[]; if(sh.dead||st.phase!=='play'&&st.phase!=='break') return [['stick',0,0],['r','fire']];
  // threats: time to closest approach for every rock and drone shot
  let danger=null, dt=1e9;
  const consider=(x,y,vx,vy,rad)=>{ const px=dxOf(st,sh.x,x), py=dyOf(st,sh.y,y), rvx=vx-sh.vx, rvy=vy-sh.vy, vv=rvx*rvx+rvy*rvy;
    const t=vv>1e-6?Math.max(0,-(px*rvx+py*rvy)/vv):0, cx=px+rvx*t, cy=py+rvy*t, miss=Math.sqrt(cx*cx+cy*cy), d=Math.sqrt(px*px+py*py);
    if(miss<rad+SHIP_R+12&&t<70&&t<dt){ dt=t; danger={px,py,rvx,rvy,t,d,rad}; }
    if(d-rad<o.safe*0.55&&d-rad<(danger?danger.d-danger.rad:1e9)&&!danger){ danger={px,py,rvx,rvy,t:d/3,d,rad}; dt=d/3; } };
  for(const r of st.rocks) consider(r.x,r.y,r.vx,r.vy,r.r);
  for(const s of st.dshots) consider(s.x,s.y,s.vx,s.vy,4);
  for(const d of st.drones) consider(d.x,d.y,d.vx,d.vy,DRONE_R);
  for(const p of st.pulses){ const d=Math.sqrt(dist2(st,sh,p)); if(d>p.r&&d-p.r<60&&sh.dashCd===0&&rnd(R)<o.dash) out.push(['p','dash']); }

  if(danger&&dt<14&&sh.dashCd===0&&!sh.prot&&rnd(R)<o.dash*0.5+0.1){ const a=angOf(-danger.rvy,danger.rvx); out.push(['stick',Math.round(dirX(a)*64),Math.round(dirY(a)*64)],['p','dash']); return out; }
  // power-ups: casual uses at once; strong saves the shield for later and fires shockwaves when crowded
  if(st.power.held){ const k=st.power.held, crowd=st.rocks.filter(r=>dist2(st,sh,r)<SHOCK_R*SHOCK_R).length;
    if(o.dash<1||(k!=='shield'&&k!=='shock')||(k==='shield'&&!sh.shield)||(k==='shock'&&crowd>=3)) out.push(['p','use']); }
  if(--mem.wait>0&&!(danger&&dt<25)) return out; mem.wait=o.react;
  // evade: thrust away from the closest threat
  if(danger&&(dt<40||danger.d-danger.rad<o.safe*0.6)){ let ax=-danger.px, ay=-danger.py; const pl=-danger.rvy, pr=danger.rvx; // sideways to its path works better than straight back
    const s=(ax*pl+ay*pr)>=0?1:-1; ax=ax*0.5+pl*s; ay=ay*0.5+pr*s;
    // keep off the walls
    const mx=st.W*0.5-sh.x, my=st.H*0.5-sh.y; if(!st.wx&&(sh.x<120||sh.x>st.W-120)) ax+=mx*0.02; if(!st.wy&&(sh.y<120||sh.y>st.H-120)) ay+=my*0.02;
    const n=Math.sqrt(ax*ax+ay*ay)||1; mem.mode='evade'; out.push(['stick',Math.round(ax/n*64),Math.round(ay/n*64)],['r','fire']); return out; }
  // pick a target: the most threatening rock in range, else the nearest power-up, else drift to the middle
  let best=null, bv=1e9;
  for(const r of st.rocks){ if(r.orb===undefined&&r.boss==='leviathan'&&st.rocks.some(q=>q.orb)) continue; const d=Math.sqrt(dist2(st,sh,r))-r.r; let v=d;
    const px=dxOf(st,r.x,sh.x), py=dyOf(st,r.y,sh.y); if(px*r.vx+py*r.vy>0) v-=120; if(r.boss==='bastion') v+=60; if(v<bv){ bv=v; best=r; } }
  for(const d of st.drones){ const v=Math.sqrt(dist2(st,sh,d))-150; if(v<bv){ bv=v; best=d; } }
  let tx=null, ty=null;
  if(best&&bv<700){ const px=dxOf(st,sh.x,best.x), py=dyOf(st,sh.y,best.y), d=Math.sqrt(px*px+py*py), t=d/BUL_V*o.lead;
    tx=px+(best.vx-sh.vx)*t; ty=py+(best.vy-sh.vy)*t;
    if(best.boss==='bastion'){ const c=best.cracks.map(c=>c+best.a).sort((a,b)=>Math.abs(angDiff(angOf(-px,-py),a))-Math.abs(angDiff(angOf(-px,-py),b)))[0]; tx+=dirX(c)*best.r*0.8; ty+=dirY(c)*best.r*0.8; } }
  const pu=st.pups.find(p=>dist2(st,sh,p)<350*350&&!st.power.held);

  if(tx===null){ const mx=st.W/2-sh.x, my=st.H/2-sh.y, n=Math.sqrt(mx*mx+my*my); if(n>120) out.push(['stick',Math.round(mx/n*50),Math.round(my/n*50)]); else out.push(['stick',0,0]); out.push(['r','fire']); return out; }

// ===================== Drift campaign and Endless =====================
// Three campaigns (Easy, Normal, Hard), 15 levels each. Every level is a recipe (world size, incoming count and mix,
// rock speed, rock types, wrap, drones, power-ups, any twist) with a fixed seed, so its rock order is the same on
// every attempt. The mix follows the kickoff: 1-3 basics, 4 introduces wrap, 5 and 9 a new rock type, 7 and 14
// twists, 8 drone-heavy (Easy 8 introduces the Shield), 12 a storm of fast Smalls, 15 a boss.
// Par times (the third star) come from the casual bot: median clear time × ~1.15 (tests/sim.js), rounded to 5 s.
const fmtTime=s=>{ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const fmtNum=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const CAMPAIGNS=[{id:'easy',name:'Easy',boss:'titan'},{id:'normal',name:'Normal',boss:'bastion'},{id:'hard',name:'Hard',boss:'leviathan'}];
const LEVEL_NAMES={

 normal:['Outer Belt','Scatter','Pressure Front','Every Door','Short Fuse','Hunting Ground','Low Visibility','Swarm','Cold Front','Splinters','Crossfire','Meteor Shower','Drifters','Weightless','Bastion'],
 hard:['Deep Field','Rubble Run','Crush Depth','Fault Lines','Lodestone','Gauntlet','Event Horizon','Kill Box','Everything','Breakwater','Tidal Lock','Firestorm','Iron Sky','Blackout','Leviathan']};
const TWIST_NAMES={nobrake:'No brake',onelife:'One life',fog:'Fog',space:'True space',well:'Gravity well',storm:'Storm',drones:'Drone swarm',boss:'Boss',shield:'New: Shield'};
const TYPE_NAMES={stone:'Stone',armour:'Armoured',volatile:'Volatile',ice:'Ice',magnet:'Magnetic',gold:'Gold'};
const PUP_NAMES={spread:'Spread',rapid:'Rapid',pierce:'Pierce',shield:'Shield',shock:'Shockwave'};
// Measured par times in seconds (casual-bot median × 1.15, 8 runs per level, 2026-11-24); see tests/sim.js.
const PAR={e1:40,e2:65,e3:45,e4:45,e5:70,e6:65,e7:120,e8:85,e9:100,e10:90,e11:100,e12:45,e13:115,e14:115,e15:90,n1:140,n2:140,n3:140,n4:170,n5:165,n6:205,n7:270,n8:335,n9:265,n10:225,n11:235,n12:120,n13:275,n14:595,n15:240,h1:365,h2:375,h3:435,h4:480,h5:515,h6:400,h7:390,h8:655,h9:615,h10:565,h11:500,h12:270,h13:535,h14:675,h15:305};

function recipe(ci,n){ const C=CAMPAIGNS[ci], D=DIFFS[C.id], id=C.id[0]+n;
  const range=[[8,20],[20,40],[40,60]][ci], count=n>=15?[6,10,8][ci]:Math.round(range[0]+(range[1]-range[0])*Math.min(1,(n-1)/13));
  const sp=D.spd*([0.85,0.87,0.82][ci]+0.2*(n-1)/14);
  // rock types: each campaign keeps what came before and adds two
  const T=[['stone',60]], add=(t,w)=>T.push([t,w]);
  if(ci===0){ if(n>=5) add('armour',12); if(n>=9) add('gold',5); }
  if(ci===1){ add('armour',8); add('gold',4); if(n>=5) add('volatile',12); if(n>=9) add('ice',12); }
  if(ci===2){ add('armour',8); add('gold',4); add('volatile',8); add('ice',8); if(n>=5) add('magnet',12); if(n>=9){ T.length=0; [['stone',30],['armour',12],['volatile',12],['ice',12],['magnet',12],['gold',5]].forEach(x=>T.push(x)); } }
  // wrap: introduced at level 4, then on some later levels
  const WR=[{4:'lr',6:'lr',10:'lr',13:'lr'},{4:'all',6:'lr',10:'all',11:'all',13:'lr'},{4:'lr',6:'all',10:'lr',11:'all',13:'all'}][ci];
  // power-ups: Spread and Rapid from the start, Shield from Easy 8, Pierce from Easy 10, Shockwave from Easy 13
  let pk=['spread','rapid']; if(ci>0||n>=8) pk.push('shield'); if(ci>0||n>=10) pk.push('pierce'); if(ci>0||n>=13) pk.push('shock');

    space:false,nobrake:false,well:false,ricochet:false,lives:3,fog:false,group:D.group,calm:D.calm,groupT:D.groupT,boss:null,mult:D.mult,seed:`DRC1|${id}`};
  if(n<=3) cfg.mix=[[30,40,30],[45,35,20],[60,30,10]][ci];
  let twist=null;
  if(n===7) twist=['nobrake','fog','well'][ci];
  if(n===14) twist=['onelife','space','onelife'][ci];

  if(n===12) twist='storm';
  if(n===15) twist='boss';

  if(twist==='fog') cfg.fog=true;
  if(twist==='well'){ cfg.well=true; cfg.count=Math.round(count*0.8); }
  if(twist==='space'){ cfg.space=true; cfg.nobrake=true; }
  if(twist==='onelife'){ cfg.lives=1; if(ci===2) cfg.fog=true; }
  if(twist==='drones'){ cfg.drones=true; cfg.droneEvery=ci===2?[1200,1500]:[1500,1900]; }
  if(twist==='storm'){ cfg.count=Math.round(count*1.4); cfg.mix=[0,10,90]; cfg.spd=sp*1.4; cfg.group=D.group+2; cfg.groupT=Math.round(D.groupT*0.6); cfg.calm=D.calm+4; }
  if(twist==='boss'){ cfg.boss=C.boss; cfg.count=count; cfg.groupT=D.groupT*2; }
  const par=PAR[id]||Math.round(20+count*4.5);
  return {id,ci,n,camp:C.id,name:LEVEL_NAMES[C.id][n-1],cfg,twist,par,boss:twist==='boss'?C.boss:null}; }
const LEVELS=[]; for(let ci=0;ci<3;ci++) for(let n=1;n<=15;n++) LEVELS.push(recipe(ci,n));
const LEVEL_BY={}; for(const L of LEVELS) LEVEL_BY[L.id]=L;
const levelCfg=(L,extra)=>Object.assign(JSON.parse(JSON.stringify(L.cfg)),extra||{});
function levelLabel(L){ const c=L.cfg, x=[`${c.count} rocks`]; if(c.wrap!=='none') x.push(c.wrap==='all'?'Wrap: all sides':'Wrap: left/right');
  if(L.twist&&L.twist!=='boss') x.push(TWIST_NAMES[L.twist]); if(c.drones&&L.twist!=='drones') x.push('Drones'); return x.join(' · '); }

const EXPEDITIONS=[{id:'x10',name:'Reach wave 10',xp:50},{id:'x20',name:'Reach wave 20 with no dash used',xp:75,reward:'Comet trail'},
 {id:'x15w',name:'Reach wave 15 on All-sides wrap',xp:75},{id:'x25',name:'Reach wave 25',xp:150,reward:'Nebula theme'}];
function checkExp(S,st){ const out=[], E=S.endless.exp, w=st.wave, c=st.cfg;
  const give=x=>{ if(!E[x.id]){ E[x.id]=Date.now(); out.push(x); } };
  if(w>=10) give(EXPEDITIONS[0]); if(w>=20&&st.stats.dashes===0) give(EXPEDITIONS[1]); if(w>=15&&c.wrap==='all') give(EXPEDITIONS[2]); if(w>=25) give(EXPEDITIONS[3]);
  return out; }
// milestones every 5 waves: 25 XP, rising by 5, capped at 50 each and 200 a run
const milestoneXP=k=>Math.min(50,25+5*(k-1));
function endlessXP(waves){ let x=0; for(let k=1;k*MILESTONE_EVERY<=waves;k++) x+=milestoneXP(k); return Math.min(200,x); }
// the XP a run has earned so far at a given wave (each milestone pays as it's reached)
function milestoneAt(wave){ return wave>0&&wave%MILESTONE_EVERY===0?milestoneXP(wave/MILESTONE_EVERY):0; }

// ctx: {mode: normal|campaign|endless, cfg, res, st}
function checkAch(S,ctx){ const got=[], give=id=>{ if(!S.ach[id]){ S.ach[id]=Date.now(); got.push(id); } };
  const {mode,cfg,res}=ctx;
  if(res){ const s=res.stats;
    if(s.chainMax>=5) give('chain'); if(s.comboMax>=10) give('combo'); if(s.closeCall>0) give('close');
    if(res.ok&&mode!=='endless'){ give('first'); if(res.shots>=10&&res.acc>=0.7) give('sharp'); if(cfg.diff==='hard'&&res.livesLost===0) give('untouch');
      if(mode==='normal'){ const m=cfg.mods||{};
        if(cfg.diff==='normal'&&m.drag==='space') give('weightless'); if(cfg.diff==='normal'&&m.well==='on') give('horizon'); if(cfg.diff==='normal'&&m.fog==='on') give('blind');
        if(cfg.diff==='hard'&&m.lives==='1') give('lone'); if(cfg.diff==='hard'&&m.pups==='off') give('purist'); } }
    if(mode==='endless'){ if(res.wave>=10) give('steady'); if(res.wave>=25) give('deep'); if(res.ticks>=30*60*60) give('survivor'); } }
  if(S.stats.gold>=10) give('goldrush'); if(S.stats.kills>=1000) give('breaker'); if(S.stats.wins>=25) give('veteran');
  for(const [ci,id] of [[0,'titan'],[1,'bastion'],[2,'leviathan']]) if(campOf(S,CAMPAIGNS[ci].id[0]+'15').s[0]) give(id);
  const camp3=ci=>LEVELS.filter(L=>L.ci===ci).every(L=>campStars(S,L.id)>=3);
  if([0,1,2].some(camp3)) give('ace'); if([0,1,2].every(camp3)) give('fleet');
  return got; }

// ---------- XP ----------
function addXP(S,n){ const before=levelOf(S.xp); S.xp+=Math.max(0,Math.round(n)); const after=levelOf(S.xp); const rewards=[];
  for(let l=before+1;l<=after;l++) rewards.push(...rewardsAt(l)); return {xp:Math.round(n),before,after,rewards}; }
const xpNext=S=>{ const l=levelOf(S.xp); return l>=MAXL?null:LV[l]; };
const NORMAL_XP={easy:15,normal:30,hard:45};
// Normal mode win: base × (1 + half of the modifier bonus); each new win star on a difficulty × wrap pays +5 once
function normalXP(cfg){ const mm=modMult(cfg.mods||{}); return Math.round(NORMAL_XP[cfg.diff]*(1+Math.max(0,mm-1)/2)); }

// ---------- Normal mode: win stars and records ----------
// "plain" = the difficulty's default modifiers (wrap aside); anything else records separately
const isPlain=(diff,m)=>MOD_IDS.every(k=>k==='wrap'||m[k]===defMods(diff)[k]);
const recKey=c=>`${c.diff}|${c.mods.wrap}|${isPlain(c.diff,c.mods)?'std':'mod'}`;
function normalStars(cfg,res){ if(!res.ok) return [0,0,0]; return [1,res.livesLost===0?1:0,res.ticks/60<=normalPar(cfg.diff,cfg.mods.density)?1:0]; }
function normalResult(S,cfg,res,date){ const k=recKey(cfg), r=S.rec[k]||{score:0,time:0}, stars=normalStars(cfg,res);
  let newBest=false, newTime=false; if(res.score>r.score){ r.score=res.score; newBest=true; }
  if(res.ok&&(!r.time||res.ticks<r.time)){ r.time=res.ticks; newTime=!!res.ok; } r.date=date||''; S.rec[k]=r;
  let xp=res.ok?normalXP(cfg):0; const wk=`${cfg.diff}|${cfg.mods.wrap}`, ws=S.wstars[wk]||[0,0,0], fresh=[];
  stars.forEach((s,i)=>{ if(s&&!ws[i]){ ws[i]=1; fresh.push(i); xp+=5; } }); S.wstars[wk]=ws;
  return {stars,fresh,xp,newBest,newTime}; }
const bestOf=(S,diff,wrap,plain)=>(S.rec[`${diff}|${wrap}|${plain?'std':'mod'}`]||{score:0}).score;

// ---------- campaign ----------
const campOf=(S,id)=>S.camp[id]||{s:[0,0,0],best:0,time:0};
const campStars=(S,id)=>campOf(S,id).s.reduce((a,b)=>a+b,0);
const totalStars=S=>LEVELS.reduce((a,L)=>a+campStars(S,L.id),0);
const campUnlocked=(S,ci)=>ci===0||!!campOf(S,CAMPAIGNS[ci-1].id[0]+'15').s[0];
function unlocked(S,id){ const L=LEVEL_BY[id]; if(!campUnlocked(S,L.ci)) return false; return L.n===1||!!campOf(S,L.camp[0]+(L.n-1)).s[0]; }
const STAR_XP=[6,10,15], CAMP_XP=[75,150,225];
function starsEarned(L,res){ return [res.ok?1:0,res.ok&&res.livesLost===0?1:0,res.ok&&res.ticks/60<=L.par?1:0]; }
function starText(L,i){ return [L.boss?`Defeat ${BOSSES[L.boss].name}`:'Clear the level','No lives lost',`Clear in ${fmtTime(L.par)}`][i]; }
function campaignResult(S,L,res){ const earned=starsEarned(L,res), c=campOf(S,L.id), fresh=[]; let xp=0;
  const doneBefore=!!campOf(S,L.camp[0]+'15').s[0];
  earned.forEach((e,i)=>{ if(e&&!c.s[i]){ c.s[i]=1; fresh.push(i); xp+=STAR_XP[L.ci]; } });
  if(res.ok){ c.best=Math.max(c.best||0,res.score); if(!c.time||res.ticks<c.time) c.time=res.ticks; } S.camp[L.id]=c;
  const campDone=!doneBefore&&!!campOf(S,L.camp[0]+'15').s[0]; if(campDone) xp+=CAMP_XP[L.ci];
  return {earned,fresh,stars:campStars(S,L.id),xp,campDone}; }
function nextLevel(S){ for(const L of LEVELS) if(unlocked(S,L.id)&&!campOf(S,L.id).s[0]) return L; for(const L of LEVELS) if(unlocked(S,L.id)&&campStars(S,L.id)<3) return L; return null; }

// ---------- Endless ----------
function endlessResult(S,st){ const E=S.endless, w=st.wave, sc=st.score; let newWave=false, newScore=false;
  if(w>E.bestWave){ E.bestWave=w; newWave=true; } if(sc>E.bestScore){ E.bestScore=sc; newScore=true; } E.runs++;
  const exps=checkExp(S,st); let xp=exps.reduce((a,x)=>a+x.xp,0);
  return {newWave,newScore,exps,xp}; }

// ---------- lifetime stats ----------
function addStats(S,res){ const t=S.stats, s=res.stats; t.games++; if(res.ok) t.wins++; t.kills+=s.kills; t.gold+=s.gold; t.ticks+=res.ticks; t.shots+=s.shots; t.hits+=s.hits; }

// ---------- backup (Drift only) ----------
// DRIFT1Z.<base64 gzip> where the app can compress, DRIFT1.<base64> otherwise. Both decode here (the app inflates Z).
const b64e=str=>{ const u=new TextEncoder().encode(str); let b=''; for(let i=0;i<u.length;i++) b+=String.fromCharCode(u[i]); return btoa(b); };
const b64d=b=>new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)));
function backupPlain(S){ const o=Object.assign({},S); o.run=null; return 'DRIFT1.'+b64e(JSON.stringify(o)); }
function parseBackup(text){ const m=/DRIFT1\.([A-Za-z0-9+/=]+)/.exec(String(text||'')); if(!m) return null;
  try{ const o=JSON.parse(b64d(m[1])); if(!o||typeof o!=='object'||typeof o.xp!=='number') return null; return o; }catch(e){ return null; } }

// ---------- Arcade contract ----------
// Shared settings live in arcade.v1 (read only, never written). They're applied in memory only.
function readArcade(store){ try{ const a=JSON.parse(store.get(ARCADE_KEY)||'null'); if(!a||typeof a!=='object') return null; return a; }catch(e){ return null; } }
function applyShared(S,a){ if(!a) return S; const o=Object.assign({},S), set=a.set||{}; for(const k of SHARED) if(set[k]!==undefined) o[k]=set[k]; if(typeof a.name==='string') o.name=a.name; return o; }
function summary(S){ const l=levelOf(S.xp), h=Math.max(bestOf(S,'hard','none',true),bestOf(S,'hard','lr',true),bestOf(S,'hard','all',true),bestOf(S,'hard','none',false),bestOf(S,'hard','lr',false),bestOf(S,'hard','all',false));
  return {v:1,game:GAME_ID,ver:VERSION,level:l,maxLevel:MAXL,xp:S.xp,xpLevel:l,xpNext:xpNext(S),
    ach:ACH.map(a=>[a.name,a.desc,!!S.ach[a.id]]),
    hi:[['Best Endless wave',S.endless.bestWave?String(S.endless.bestWave):'—'],['Campaign stars',`${totalStars(S)}/135`],['Best score (Hard)',h?fmtNum(h):'—']],
    last:Date.now()}; }

// ---- how to play and what's new ----
["Rocks drift in from the edges of the field. Shoot them to break them: a Large splits into two Mediums, a Medium into two or three Smalls, and a Small into dust. Clear every incoming rock to win. Don't let a rock, a drone or a drone's shot touch your ship.","Las rocas entran por los bordes del campo. Dispárales para romperlas: una grande se parte en dos medianas, una mediana en dos o tres pequeñas y una pequeña en polvo. Destruye todas las rocas entrantes para ganar. Que no toquen tu nave ni las rocas, ni los drones ni sus disparos.","Les rochers arrivent par les bords du terrain. Tire pour les briser : un gros se divise en deux moyens, un moyen en deux ou trois petits, et un petit en poussière. Détruis tous les rochers entrants pour gagner. Ne laisse ni rocher, ni drone, ni tir de drone toucher ton vaisseau.","Felsen treiben von den Rändern ins Feld. Schieß sie kaputt: Ein großer zerfällt in zwei mittlere, ein mittlerer in zwei oder drei kleine und ein kleiner zu Staub. Zerstöre alle ankommenden Felsen, um zu gewinnen. Lass weder Felsen noch Drohnen oder deren Schüsse dein Schiff berühren.","As rochas entram pelas bordas do campo. Atire para quebrá-las: uma grande vira duas médias, uma média vira duas ou três pequenas e uma pequena vira poeira. Destrua todas as rochas que chegam para vencer. Não deixe rochas, drones ou tiros de drones tocarem sua nave."],
["D-pad steers. With Direct steering (the default) the ship turns to face the direction you hold and thrusts once it's facing it; a quick tap just aims. With Classic steering ◀ ▶ rotate, ▲ thrusts and ▼ brakes. A fires (hold for steady fire), B dashes: a quick burst with a moment of invincibility, then a 3-second cooldown. Select uses your power-up and Start pauses.","La cruceta dirige. Con dirección Directa (por defecto) la nave gira hacia donde mantienes y acelera al apuntar; un toque rápido solo apunta. Con dirección Clásica ◀ ▶ giran, ▲ acelera y ▼ frena. A dispara (mantén para fuego continuo), B da un impulso: un acelerón con un instante de invencibilidad y 3 segundos de recarga. Select usa tu potenciador y Start pausa.","La croix dirige. En pilotage Direct (par défaut) le vaisseau se tourne vers la direction tenue et pousse une fois aligné ; une touche brève vise seulement. En pilotage Classique ◀ ▶ tournent, ▲ pousse et ▼ freine. A tire (maintiens pour un tir continu), B donne un élan : une accélération avec un instant d'invincibilité, puis 3 secondes de recharge. Select utilise ton bonus et Start met en pause.","Das Steuerkreuz lenkt. Mit direkter Steuerung (Standard) dreht sich das Schiff in die gehaltene Richtung und gibt Schub, sobald es dorthin zeigt; kurzes Tippen zielt nur. Mit klassischer Steuerung drehen ◀ ▶, ▲ gibt Schub und ▼ bremst. A feuert (halten für Dauerfeuer), B sprintet: ein kurzer Schub mit einem Moment Unverwundbarkeit, danach 3 Sekunden Abklingzeit. Select benutzt dein Extra, Start pausiert.","O direcional pilota. Na pilotagem Direta (padrão) a nave gira para a direção segurada e acelera quando aponta para ela; um toque rápido só mira. Na Clássica ◀ ▶ giram, ▲ acelera e ▼ freia. A atira (segure para tiro contínuo), B dá uma arrancada: um impulso com um instante de invencibilidade e 3 segundos de recarga. Select usa seu poder e Start pausa."],
["Settings has two other layouts: D-pad only (fire is automatic) and a Thumbstick pad. Keyboard: arrow keys steer, Space fires, Shift or X dashes, C uses a power-up, P or Esc pauses.","Ajustes tiene otros dos diseños: solo cruceta (disparo automático) y joystick. Teclado: flechas para dirigir, Espacio dispara, Shift o X impulso, C usa un potenciador, P o Esc pausa.","Les réglages proposent deux autres dispositions : croix seule (tir automatique) et joystick. Clavier : flèches pour diriger, Espace tire, Maj ou X pour l'élan, C utilise un bonus, P ou Échap met en pause.","In den Einstellungen gibt es zwei weitere Layouts: nur Steuerkreuz (automatisches Feuer) und Daumenstick. Tastatur: Pfeiltasten lenken, Leertaste feuert, Umschalt oder X sprintet, C benutzt ein Extra, P oder Esc pausiert.","Os ajustes têm mais dois layouts: só direcional (tiro automático) e joystick. Teclado: setas pilotam, Espaço atira, Shift ou X arrancada, C usa um poder, P ou Esc pausa."],
["The field","El campo","Le terrain","Das Feld","O campo"],
["The ship drifts: it keeps moving until drag slows it. Edges are soft walls unless wrap is on, where you fly off one side and come back on the other. A rock that drifts out through a wall comes back later. On bigger fields the camera follows you; the radar shows the whole field and arrows point to rocks heading your way.","La nave se desliza: sigue moviéndose hasta que el rozamiento la frena. Los bordes son muros blandos salvo que actives los bordes abiertos, y entonces sales por un lado y vuelves por el otro. Una roca que sale por un muro vuelve más tarde. En campos grandes la cámara te sigue; el radar muestra todo el campo y unas flechas señalan las rocas que vienen hacia ti.","Le vaisseau glisse : il avance jusqu'à ce que le frottement le ralentisse. Les bords sont des murs souples, sauf si les bords sont ouverts : tu sors d'un côté et reviens de l'autre. Un rocher qui sort par un mur revient plus tard. Sur les grands terrains, la caméra te suit ; le radar montre tout le terrain et des flèches indiquent les rochers qui arrivent vers toi.","Das Schiff gleitet: Es fliegt weiter, bis die Reibung es bremst. Die Ränder sind weiche Wände, außer offene Ränder sind an – dann fliegst du auf einer Seite hinaus und kommst auf der anderen wieder herein. Ein Felsen, der durch eine Wand hinaustreibt, kommt später wieder. Auf großen Feldern folgt dir die Kamera; das Radar zeigt das ganze Feld, und Pfeile zeigen auf Felsen, die auf dich zukommen.","A nave desliza: continua se movendo até o atrito frear. As bordas são paredes macias, a menos que as bordas abertas estejam ligadas: você sai de um lado e volta pelo outro. Uma rocha que sai por uma parede volta depois. Em campos maiores a câmera segue você; o radar mostra o campo todo e setas apontam rochas vindo na sua direção."],
["Large 60, Medium 40, Small 20, times the difficulty and modifier multipliers. Kills within 1.5 seconds of each other build a combo, +10% each, up to ×2. Gold rocks are worth five times as much. Hunter drones are worth 200. An extra life every 10,000 points, up to 5.","Grande 60, mediana 40, pequeña 20, por los multiplicadores de dificultad y modificadores. Destruir rocas a menos de 1,5 segundos entre sí crea un combo, +10% cada una, hasta ×2. Las de oro valen cinco veces más. Los drones cazadores valen 200. Una vida extra cada 10.000 puntos, hasta 5.","Gros 60, moyen 40, petit 20, multipliés par la difficulté et les modificateurs. Des destructions à moins de 1,5 seconde d'écart forment un combo, +10 % chacune, jusqu'à ×2. Les rochers d'or valent cinq fois plus. Les drones chasseurs valent 200. Une vie en plus tous les 10 000 points, jusqu'à 5.","Groß 60, mittel 40, klein 20, mal Schwierigkeits- und Modifikator-Multiplikator. Abschüsse innerhalb von 1,5 Sekunden bilden ein Combo, je +10 %, bis ×2. Goldfelsen zählen fünffach. Jagddrohnen bringen 200. Ein Extraleben alle 10.000 Punkte, bis zu 5.","Grande 60, média 40, pequena 20, vezes os multiplicadores de dificuldade e modificadores. Destruições com menos de 1,5 segundo entre si fazem combo, +10% cada, até ×2. Rochas de ouro valem cinco vezes mais. Drones caçadores valem 200. Uma vida extra a cada 10.000 pontos, até 5."],
["Broken rocks sometimes drop one. Fly over it to pick it up and press Select to use it. Spread fires three ways, Rapid doubles your fire rate, Pierce shoots through rocks, Shield absorbs one hit and Shockwave destroys Smalls and damages everything nearby.","A veces las rocas rotas sueltan uno. Pasa por encima para recogerlo y pulsa Select para usarlo. Abanico dispara en tres direcciones, Rápido duplica la cadencia, Perforante atraviesa rocas, Escudo absorbe un impacto y Onda destruye las pequeñas y daña todo lo cercano.","Les rochers brisés en lâchent parfois un. Passe dessus pour le prendre et appuie sur Select pour l'utiliser. Éventail tire dans trois directions, Rafale double la cadence, Perforant traverse les rochers, Bouclier absorbe un coup et Onde de choc détruit les petits et abîme tout autour.","Zerstörte Felsen lassen manchmal eins fallen. Flieg darüber, um es aufzuheben, und drück Select, um es zu benutzen. Streuung feuert dreifach, Schnellfeuer verdoppelt die Feuerrate, Durchschlag schießt durch Felsen, Schild fängt einen Treffer ab und Schockwelle zerstört kleine Felsen und beschädigt alles in der Nähe.","Rochas quebradas às vezes soltam um. Passe por cima para pegar e aperte Select para usar. Leque atira em três direções, Rajada dobra a cadência, Perfurante atravessa rochas, Escudo absorve um golpe e Onda de choque destrói as pequenas e danifica tudo por perto."],
["Armoured rocks need a hit to crack their shell first. Volatile rocks explode and damage what's around them. Ice rocks break into fast shards. Magnetic rocks pull your ship in when you get close.","Las rocas blindadas necesitan un impacto para agrietar su coraza. Las volátiles explotan y dañan lo que las rodea. Las de hielo se rompen en esquirlas rápidas. Las magnéticas atraen tu nave si te acercas.","Les rochers blindés doivent d'abord être fêlés. Les volatils explosent et abîment ce qui les entoure. Ceux de glace éclatent en éclats rapides. Les magnétiques attirent ton vaisseau de près.","Gepanzerte Felsen brauchen erst einen Treffer, um die Schale zu brechen. Explosive Felsen platzen und beschädigen alles um sie herum. Eisfelsen zerspringen in schnelle Splitter. Magnetische Felsen ziehen dein Schiff an, wenn du nahe kommst.","Rochas blindadas precisam de um tiro para rachar a casca. Voláteis explodem e danificam o que está em volta. As de gelo se partem em lascas rápidas. As magnéticas puxam sua nave quando você chega perto."],
["Normal: pick a difficulty and modifiers. Campaign: three campaigns of 15 levels, each ending in a boss, with 3 stars per level. Endless: waves that keep getting harder, with milestones every 5 waves.","Normal: elige dificultad y modificadores. Campaña: tres campañas de 15 niveles, cada una con un jefe al final y 3 estrellas por nivel. Infinito: oleadas cada vez más difíciles, con hitos cada 5 oleadas.","Normal : choisis la difficulté et les modificateurs. Campagne : trois campagnes de 15 niveaux, chacune finissant par un boss, 3 étoiles par niveau. Sans fin : des vagues de plus en plus dures, avec une étape toutes les 5 vagues.","Normal: Wähle Schwierigkeit und Modifikatoren. Kampagne: drei Kampagnen mit je 15 Levels und einem Boss am Ende, 3 Sterne pro Level. Endlos: immer schwerere Wellen, mit Meilensteinen alle 5 Wellen.","Normal: escolha a dificuldade e os modificadores. Campanha: três campanhas de 15 níveis, cada uma terminando com um chefe, 3 estrelas por nível. Infinito: ondas cada vez mais difíceis, com marcos a cada 5 ondas."],
["First playable demo: Normal mode with 11 modifiers, three 15-level campaigns with bosses, and Endless waves.","Primera demo jugable: modo Normal con 11 modificadores, tres campañas de 15 niveles con jefes y oleadas infinitas.","Première démo jouable : mode Normal avec 11 modificateurs, trois campagnes de 15 niveaux avec boss, et des vagues sans fin.","Erste spielbare Demo: Normal-Modus mit 11 Modifikatoren, drei Kampagnen mit je 15 Levels und Bossen, dazu Endlos-Wellen.","Primeira demo jogável: modo Normal com 11 modificadores, três campanhas de 15 níveis com chefes e ondas infinitas."],
["A handheld console with three control layouts (D-pad + A/B, D-pad only, Thumbstick), Direct or Classic steering, plus keyboard.","Una consola portátil con tres diseños de control (cruceta + A/B, solo cruceta, joystick), dirección Directa o Clásica, y teclado.","Une console portable avec trois dispositions (croix + A/B, croix seule, joystick), pilotage Direct ou Classique, et clavier.","Eine Handheld-Konsole mit drei Steuerungslayouts (Steuerkreuz + A/B, nur Steuerkreuz, Daumenstick), direkter oder klassischer Steuerung und Tastatur.","Um console portátil com três layouts (direcional + A/B, só direcional, joystick), pilotagem Direta ou Clássica, e teclado."],
["XP levels, 22 achievements, Endless expeditions and 35 cosmetics.","Niveles de XP, 22 logros, expediciones infinitas y 35 cosméticos.","Niveaux d'XP, 22 succès, expéditions sans fin et 35 cosmétiques.","XP-Level, 22 Erfolge, Endlos-Expeditionen und 35 Designs.","Níveis de XP, 22 conquistas, expedições infinitas e 35 cosméticos."],
["Original soundtracks: Orbit and Afterburn, plus Sweep's Daylight and Linefall's Signal.","Bandas sonoras originales: Orbit y Afterburn, más Daylight de Sweep y Signal de Linefall.","Bandes-son originales : Orbit et Afterburn, plus Daylight de Sweep et Signal de Linefall.","Originale Soundtracks: Orbit und Afterburn, dazu Daylight aus Sweep und Signal aus Linefall.","Trilhas originais: Orbit e Afterburn, mais Daylight do Sweep e Signal do Linefall."],

<script>
// ===================== SHELL =====================
const ARCADE=!!window.__ARCADE__, ARCADE_HOME='../index.html', ARCADE_PREFS='../index.html#prefs';
const REDUCED=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const store={get:k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } },set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} }};
let S=loadSave(store.get(KEY),REDUCED);
S.ctl.layout=['dpad','donly','stick'].includes(S.ctl.layout)?S.ctl.layout:'dpad';
// P = settings in effect. Standalone it IS the save; inside Arcade the shared settings come from arcade.v1, in memory only.
let P=S;
function refreshShared(){ P=ARCADE?applyShared(S,readArcade(store)):S; }
refreshShared();
let sumT=0;

    SG=this.boss?BOSS_TRACK:(SONGS[S.look.track]||ORBIT); if(!this.boss&&!owned(S,findCos('track',SG.id))) SG=ORBIT;
    AU.dly.delayTime.setValueAtTime(3*60/SG.bpm/4,c.currentTime);
    const g=AU.mus.gain; g.cancelScheduledValues(c.currentTime); g.setValueAtTime(g.value,c.currentTime); g.linearRampToValueAtTime(MUSVOL,c.currentTime+2);
    clearInterval(this.iv); this.iv=setInterval(()=>this.tick(),30); },
  stop(){ if(!this.on) return; this.on=false; clearInterval(this.iv); const c=AU.ctx, g=AU.mus.gain; g.cancelScheduledValues(c.currentTime); g.setTargetAtTime(0,c.currentTime,.25); },
  restart(){ if(!this.on) return; this.stop(); setTimeout(()=>{ if(P.music) this.start(); },450); },
  setBoss(b){ if(b===this.boss) return; this.boss=b; this.restart(); },
  tick(){ const c=AU.ctx, sd=60/SG.bpm/4; if(c.state!=='running'){ this.next=c.currentTime+.05; return; }
    if(this.next<c.currentTime) this.next=c.currentTime+.02;
    while(this.next<c.currentTime+.2){ musicStep(this.step,this.next,sd); this.next+=sd; this.step=(this.step+1)%128; } } };
const unlockAudio=()=>{ if(!P.sfx&&!P.music) return; audio(); if(P.music) Music.start(); };

// ===================== NAVIGATION =====================
// Android back: in a game it pauses first; then it closes a sheet; then it returns home; then (home, in Arcade) goes to Arcade.
let cur='home', sheetOn=false, guarded=false;
function show(id){ $$('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); cur=id; guard(); if(id!=='game') thrustSound(false,0); }
const needGuard=()=>ARCADE||cur!=='home'||sheetOn;
function guard(){ if(needGuard()&&!guarded){ try{ history.pushState({dr:1},''); guarded=true; }catch(e){} } }
addEventListener('popstate',()=>{ guarded=false; back(); guard(); });
function backToPause(){ Object.assign(G.st.cfg,ctlCfg()); show('game'); applyLook(); resize(); G.state='count'; pauseGame(); }
function back(){
  if(G&&G.state==='pause'&&cur==='set'&&!sheetOn){ backToPause(); return; }
  if(cur==='game'&&G&&G.state!=='end'){ if(G.state!=='pause') pauseGame(); else if(sheetOn) resumeGame(); return; }
  if(sheetOn){ closeSheet(); return; }
  if(cur!=='home'){ goHome(); return; }
  if(ARCADE) leaveTo(ARCADE_HOME); }
function leaveTo(url){ if(G&&G.state!=='end') saveRun(); persist(); writeSummary(); location.replace(url); }
let sheetClose=null;
function openSheet(html,onClose){ $('#sheet').innerHTML=html; $('#ov').classList.add('on'); $('#sheet').scrollTop=0; sheetOn=true; sheetClose=onClose||null; guard(); }
function closeSheet(){ if(!sheetOn) return; $('#ov').classList.remove('on'); sheetOn=false; const f=sheetClose; sheetClose=null; if(f) f(); }
$('#ov').addEventListener('click',e=>{ if(e.target.id==='ov'&&!(G&&cur==='game'&&G.state!=='end')) closeSheet(); });
$('#sheet').addEventListener('click',e=>{ if(e.target.closest('[data-close]')) closeSheet(); });
function goHome(){ if(G&&G.state==='pause'&&cur==='set'&&!sheetOn){ backToPause(); return; } closeSheet(); Music.intensity=.5; Music.setBoss(false); renderHome(); show('home'); }
const backBtn=`<button class="iconbtn" data-home aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>`;

function openSetup(){ const c=S.setup;
  const draw=()=>{ const m=c.mods, mult=DIFFS[c.diff].mult*modMult(m), plain=isPlain(c.diff,m), r=S.rec[`${c.diff}|${m.wrap}|${plain?'std':'mod'}`], par=normalPar(c.diff,m.density), D=DIFFS[c.diff];

    <div class="label" style="margin-top:14px">Modifiers</div><div class="mods">${MOD_IDS.map(k=>`<div class="opt"><div class="h">${MODS[k].name}</div>${segHtml(k,MODS[k].opts.map(o=>[o[0],o[1]]),m[k])}</div>`).join('')}</div>
    <div class="kv" style="grid-template-columns:1fr 1fr 1fr"><div><b>×${mult.toFixed(2)}</b><span>Score</span></div><div><b>${r&&r.score?fmtNum(r.score):'—'}</b><span>Best</span></div><div><b>${fmtTime(par)}</b><span>Par</span></div></div>
    ${plain?'':'<div class="sub" style="font-size:12.5px;text-align:center;margin:-4px 0 4px">Modified runs keep their own records.</div>'}
    <div class="btns"><button class="ghost" id="setDef">Defaults</button><button class="ghost" data-close>Close</button><button class="primary" id="goNormal">Play</button></div>`);
    $$('#sheet [data-seg]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const k=g.dataset.seg, v=b.dataset.v;
