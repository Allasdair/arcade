<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef2f6">
<title>Ship Fight — Naval Battle</title>
<meta name="description" content="Ship Fight: an ad-free naval battle game against the computer, with a Daily Hunt.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="../fonts.css">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arcade">
<script src="../avatars.js"></script>

<script>window.__ARCADE__=1</script>
<style>
:root{--bg:#eef2f6;--panel:#fff;--ink:#14202e;--sub:#7a8796;--accent:#1d4f86;--accentInk:#fff;--line:rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:default}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;flex:1;padding:18px 18px 36px;max-width:560px;width:100%;margin:0 auto}
.arcbtn{display:inline-flex;align-items:center;gap:2px;font-weight:700;font-size:14px;color:var(--sub);padding:6px 10px 6px 4px;margin:0 0 -4px -4px;border-radius:10px}
.arcbtn.hidden{display:none}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:10px 0 18px}
.brand h1{font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1}
.brand p{color:var(--sub);font-size:14px;margin-top:8px;line-height:1.35}
.brand .acts{display:flex;gap:8px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:24px 4px 10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.label span{letter-spacing:.02em;text-transform:none;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px 16px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:10px;transition:transform .12s}
button.card:active{transform:scale(.98)}
.card>div{min-width:0}
.card .t{font-weight:700;font-size:17px;letter-spacing:-.01em}
.card .s{color:var(--sub);font-size:13px;margin-top:2px;line-height:1.3}
.card .r{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.card .r b{display:block;font-size:15px}
.card .r span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.card.hl{box-shadow:0 0 0 2.5px var(--accent)}
.ico{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--bg);color:var(--accent);font-weight:800}
.ico.gold{background:var(--accent);color:var(--accentInk)}
.pips{display:flex;gap:3px}.pips i{width:7px;height:7px;border-radius:2px;background:var(--accent)}.pips i.o{opacity:.2}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;margin:14px 0 12px}
.seg button{flex:1;padding:9px 0;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);min-width:0}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.topseg{background:var(--panel);border:1px solid var(--line);margin:0 0 16px}
.topseg button.on{background:var(--accent);color:var(--accentInk)}
.topseg button{font-size:12.5px;padding:9px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.mini{margin:0;flex:none}.seg.mini button{flex:none;padding:7px 11px;font-size:12.5px}
.card.col{flex-direction:column;align-items:stretch;gap:0}
.primary{background:var(--accent);color:var(--accentInk);border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;width:100%;transition:transform .12s,opacity .2s}
.primary:active{transform:scale(.98)}
.primary:disabled{opacity:.35}
.ghost{padding:12px;border-radius:14px;font-weight:600;color:var(--sub)}
.ghost.warn{color:var(--accent)}
button.sm{padding:9px 14px;font-size:13.5px;min-width:0;width:auto;margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .card{flex-direction:column;align-items:flex-start;gap:10px;margin:0}
.lvl .badge{width:50px;height:50px;border-radius:15px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.lvl .grow,.grow{flex:1;min-width:0}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;width:100%;font-weight:600;font-size:15px;text-align:left}
.srow>span:first-child{min-width:0}
.srow .v{color:var(--sub);font-weight:600;flex:none}
div.srow{cursor:default}
.slabel{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);padding:12px 2px 2px}
.sw{width:46px;height:28px;border-radius:99px;background:var(--bg);position:relative;transition:background .2s;flex:none}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--sub);transition:left .2s,background .2s}
.sw.on{background:var(--accent)}.sw.on::after{left:22px;background:var(--accentInk)}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px 0;max-width:560px;width:100%;margin:0 auto}
.topbar h2{font-size:24px;font-weight:800;letter-spacing:-.03em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .c{margin-left:auto;color:var(--sub);font-weight:600;font-size:14px;flex:none}
/* game */
.hud{display:flex;align-items:center;gap:10px;padding:10px 12px 6px}
.pill{flex:1;min-width:0;display:flex;justify-content:center;align-items:center;gap:14px;font-variant-numeric:tabular-nums;font-weight:700;font-size:17px}
.pill span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill svg.i{width:18px;height:18px;color:var(--sub)}
.pill small{font-size:12px;color:var(--sub);font-weight:600}
.pill .tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accentInk);padding:4px 8px;border-radius:99px}
.turn{margin:0 auto;width:calc(100% - 24px);max-width:880px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;min-height:44px}
.turn .tt{font-weight:800;font-size:15px;white-space:nowrap}
.turn .ts{font-size:12.5px;color:var(--sub);font-weight:600;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.turn.ai .tt{color:var(--sub)}
.turn.ai .dotz::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.15}}
.fleetbar{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 10px;padding:8px 12px 0;min-height:22px}
.fleetbar .fs{display:flex;gap:2px;align-items:center;position:relative;padding:2px 0}
.fleetbar .fs i{width:9px;height:9px;border-radius:2px;background:var(--accent);opacity:.85}
.fleetbar .fs.sunk i{opacity:.18}
.fleetbar .fs.sunk::after{content:'';position:absolute;left:-2px;right:-2px;top:50%;height:2px;background:var(--ink);border-radius:2px;transform:rotate(-8deg)}
#cv,#pcv{flex:1;width:100%;min-height:0;touch-action:none;display:block}
.bn{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:16px;font-weight:800;font-size:20px;letter-spacing:-.02em;opacity:0;white-space:nowrap;z-index:3;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.bn.on{animation:bn 1.5s ease-out both}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.3);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:24px 16px;z-index:5}
.overlay.hidden{display:none}
#ov2{position:fixed;z-index:6}
.sheet{background:var(--panel);color:var(--ink);border-radius:26px;padding:26px 20px 18px;width:100%;max-width:360px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .28s cubic-bezier(.2,.9,.3,1.2);max-height:calc(100% - 20px);overflow-y:auto;overflow-x:hidden}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.sheet h2{font-size:30px;font-weight:800;letter-spacing:-.035em}
.sheet .sub{color:var(--sub);margin:4px 0 18px;font-size:14px;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--bg);border-radius:14px;padding:11px 4px;min-width:0}
.stats b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stats span{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:600;overflow-wrap:anywhere}
.xpline{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:16px;margin:4px 0 12px;color:var(--accent)}
.btns{display:grid;gap:4px;margin-top:6px}
.row-b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 6px}
.row-b .ghost{background:var(--bg);display:flex;align-items:center;justify-content:center;gap:7px;color:var(--ink);font-size:13.5px;padding:11px 6px}
.row-b svg.i{width:17px;height:17px}
.bigstars{display:flex;justify-content:center;gap:12px;font-size:44px;line-height:1;margin:4px 0 12px}
.bigstars span{color:var(--sub);opacity:.22}
.bigstars span.on{color:#f5b301;opacity:1;animation:starpop .5s cubic-bezier(.2,.9,.3,1.5) both}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0)}}
.crits{text-align:left;background:var(--bg);border-radius:14px;padding:6px 12px;margin-bottom:12px}
.crit{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:13.5px;font-weight:600}
.crit>span:last-child{min-width:0}
.crit small{color:var(--sub);font-weight:500}
.sr{color:var(--sub);opacity:.3;font-size:17px;flex:none}.sr.on{color:#f5b301;opacity:1}
.pauseov{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 60px);bottom:0;background:var(--bg);z-index:4;display:grid;place-items:center;text-align:center;padding:20px}
.pauseov.hidden{display:none}.pauseov h2{font-size:34px;font-weight:800;letter-spacing:-.035em}.pauseov .sub{color:var(--sub);margin:6px 0 22px}
.pauseov .primary{min-width:220px}.pauseov .ghost{display:block;margin:6px auto 0}
/* placement */
.pnote{text-align:center;color:var(--sub);font-size:13px;font-weight:600;padding:8px 16px 0}
.pbar{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px;padding:10px 14px 14px;max-width:560px;width:100%;margin:0 auto}
.pbar .ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:13px 6px;font-size:14px}
.pbar .primary{padding:13px 6px}
body.lefty .pbar{direction:rtl}body.lefty .pbar>*{direction:ltr}
/* style + progress */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px;text-align:left;position:relative;min-width:0}
.tcard canvas{width:100%;aspect-ratio:7/4;border-radius:12px;display:block}
.tcard .n{font-weight:700;font-size:14px;margin:9px 5px 2px}
.tcard .q{font-size:11.5px;color:var(--sub);margin:0 5px 5px;line-height:1.3;min-height:2.6em}
.tcard.sel{box-shadow:0 0 0 2.5px var(--accent)}
.tcard.locked canvas{filter:grayscale(.9);opacity:.45}
.tcard .big{aspect-ratio:7/4;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.tcard .big svg.i{width:38px;height:38px;stroke-width:1.6}
.tcard.locked .big{opacity:.45}
.tcard.playing .big{opacity:.4}
.lock{position:absolute;top:13px;right:13px;width:28px;height:28px;border-radius:9px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.lock svg.i{width:15px;height:15px}
.ach{display:flex;gap:14px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line)}
.ach>.ico{flex:none}.ach>div:not(.ico){flex:1 1 auto;min-width:0;overflow-wrap:break-word}
.ach .ico{color:var(--sub)}
.ach.got .ico{background:var(--accent);color:var(--accentInk)}
.ach:not(.got) .t{color:var(--sub)}
.ach .t{font-weight:700;font-size:15px}
.ach .d{font-size:12.5px;color:var(--sub);margin-top:2px;line-height:1.3}
.chip{margin-left:auto;font-size:11px;font-weight:700;padding:5px 9px;background:var(--bg);color:var(--sub);text-align:right;white-space:normal;flex:0 1 auto;max-width:46%;line-height:1.35;border-radius:12px}
.ach.got .chip{color:var(--ink)}
.ach.cur{background:var(--panel);border-radius:14px;padding-left:10px;padding-right:10px;border-bottom-color:transparent}
.ppage{display:none}.ppage.on{display:block}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;table-layout:fixed}
td,th{padding:11px 3px;text-align:right;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
th{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
td:first-child,th:first-child{text-align:left;font-weight:600;width:30%}
.foot{margin-top:30px;display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:12px}
.foot button{color:var(--sub);font-size:12px;font-weight:600;padding:8px 0}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,calc(-100% - env(safe-area-inset-top) - 40px));visibility:hidden;opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:600;font-size:14px;transition:transform .4s cubic-bezier(.2,.9,.3,1.15),opacity .3s,visibility 0s .4s;z-index:9;width:max-content;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.on{transform:translate(-50%,0);visibility:visible;opacity:1;pointer-events:auto;transition:transform .4s cubic-bezier(.2,.9,.3,1.15),opacity .15s,visibility 0s}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
ul.news{margin:0 0 4px;padding:0 0 0 18px;text-align:left;font-size:14px;line-height:1.45}ul.news li{margin:0 0 7px}ul.news b{font-weight:700}
.lb{margin:6px 0 12px;display:flex;flex-direction:column;gap:4px}
.lbr{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;background:var(--bg);text-align:left;font-size:14.5px;width:100%}
.lbr.me{box-shadow:inset 0 0 0 2px var(--accent)}.lbk{font-weight:800;text-align:center}
.code{width:100%;height:78px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:11px/1.4 "JetBrains Mono",ui-monospace,monospace;padding:10px;resize:none;-webkit-user-select:text;user-select:text;word-break:break-all}
.unl{display:flex;align-items:center;gap:10px;text-align:left;background:var(--bg);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.unl svg.i{color:var(--accent)}
.nudge{align-items:flex-start}.nudge .nb,.filec .nb{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.filec{margin:4px 0 12px;align-items:flex-start;text-align:left}
.row2.sq .card{aspect-ratio:1/1;justify-content:space-between;padding:16px;gap:6px}
.sqb .ico{width:48px;height:48px;border-radius:14px}.sqb .ico svg.i{width:26px;height:26px}
.sqb .t{font-size:21px}.sqb .s{font-size:12.5px}
.sqf{font-variant-numeric:tabular-nums;color:var(--sub);font-size:12px;font-weight:600}.sqf b{color:var(--ink);font-size:17px}
.mrow{text-align:left;margin:0 0 12px}
.mlab{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--sub);margin:0 2px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
.mlab span+span{text-transform:none;letter-spacing:0;font-weight:600;text-align:right}
.lnk{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:0;text-transform:none}
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sbtn{background:var(--bg);border-radius:12px;padding:7px 2px 6px;font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent;min-width:0}
.sbtn.on{border-color:var(--accent)}.sbtn canvas{width:34px;height:34px}.sbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.sheet .seg{margin:0}.sheet .seg button{padding:9px 2px;font-size:12.5px}
.sheet .dcard{background:var(--bg);border:0;margin-bottom:8px;padding:12px 13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 14px}
.chip2{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--bg);color:var(--ink)}.chip2.tw{background:var(--accent);color:var(--accentInk)}
#campTabs button{font-size:12px;padding:9px 4px}
.chead .t{font-size:18px}.chead svg.i{width:14px;height:14px;vertical-align:-2px}
.path{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.node{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:11px 13px;width:86%;text-align:left;transition:transform .12s}
.node:active{transform:scale(.98)}
.node .num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--bg);flex:none;font-variant-numeric:tabular-nums}
.node .num svg.i{width:16px;height:16px}
.node.done .num{background:var(--accent);color:var(--accentInk)}
.node.next{box-shadow:0 0 0 2.5px var(--accent)}
.node.locked{opacity:.45}
.node .t{font-weight:700;font-size:15px}.node .d{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.3}
.node .st{margin-left:auto;white-space:nowrap;flex:none}.node .st .sr{font-size:14px}
body.framed #cv,body.framed #pcv{margin:0 10px;width:calc(100% - 20px);border-radius:22px;background:var(--seabg)}
</style></head>
<body>
<section id="home" class="screen on"><div class="scroll">
  <button class="arcbtn hidden" id="toArcade" aria-label="Back to Arcade"></button>
  <div class="brand"><div><h1>Ship Fight</h1><p>Naval battle against the computer. No ads, nothing to buy.</p></div>
    <div class="acts"><button class="iconbtn" data-go="style" aria-label="Style" id="homeStyle"></button><button class="iconbtn" data-go="set" aria-label="Settings" id="homeSet"></button></div></div>
  <button class="card lvl" data-go="awards" data-pt="levels" id="lvlCard"></button>
  <div id="bkNudge"></div>
  <div id="resume"></div>
  <div class="label">Play</div>
  <div class="row2 sq"><button class="card sqb" id="battleBtn"></button><button class="card sqb" id="campBtn"></button></div>
  <div class="label">Daily Hunt <span id="huntClock"></span></div>
  <button class="card" id="huntCard"></button>

<script>
// ===================== SHIP FIGHT ENGINE =====================
// Rules, fleet placement, the three AI levels, modifiers and the Daily Hunt. No DOM, so `node tests/run.js` can load it.
// A sea is W×H cells, index i = y*W + x, with a mask (1 = water, 0 = land). Columns are letters, rows are numbers.
const COLS='ABCDEFGHIJKLMNOP';
const SEA=10, NCELL=100; // the classic sea
// ---------- modifiers ----------
// Ship types. Ids are unique within a fleet, so a ship is {id, x, y, v} (v=1 vertical).
const SHIPS={carrier:{name:'Carrier',len:5},dread:{name:'Dreadnought',len:4},cruiser:{name:'Cruiser',len:3},sub:{name:'Submarine',len:3},
  frigate:{name:'Frigate',len:3},destroyer:{name:'Destroyer',len:2},patrol:{name:'Patrol Boat',len:2}};
const FLEETS={
 light:{name:'Light',desc:'3 ships',ids:['dread','cruiser','destroyer']},
 standard:{name:'Standard',desc:'5 ships',ids:['carrier','dread','cruiser','sub','destroyer']},
 armada:{name:'Armada',desc:'7 ships',ids:['carrier','dread','cruiser','sub','frigate','destroyer','patrol']}};
// Sea shapes. mask(W,H,rng) returns 1 for water; omitted = all water.
const SHAPES={
 classic:{name:'Classic',desc:'10×10 open water',W:10,H:10},
 strait:{name:'Strait',desc:'A cramped 8×8',W:8,H:8},
 narrows:{name:'Narrows',desc:'Long and low, 12×8',W:12,H:8},
 ocean:{name:'Open Ocean',desc:'A wide 12×12',W:12,H:12},
 atoll:{name:'Atoll',desc:'A ring of water round an island',W:11,H:11,mask:(W,H)=>cellsMap(W,H,(x,y)=>{ const d=Math.hypot(x-5,y-5); return d>=1.9&&d<=6.3; })},
 cross:{name:'Cross',desc:'Four arms, no corners',W:12,H:12,mask:(W,H)=>cellsMap(W,H,(x,y)=>!((x<3||x>8)&&(y<3||y>8)))},
 isles:{name:'Archipelago',desc:'Islands scattered across the sea',W:10,H:10,mask:(W,H,rng)=>isles(W,H,rng)}};
const SHAPE_IDS=Object.keys(SHAPES), FLEET_IDS=Object.keys(FLEETS);
const CLASSIC={sea:'classic',fleet:'standard',touch:true};
function cellsMap(W,H,f){ const m=new Uint8Array(W*H); for(let y=0;y<H;y++) for(let x=0;x<W;x++) m[y*W+x]=f(x,y)?1:0; return m; }
// 5 small islands (1–3 cells), never on the edge and never touching each other, so every ship still fits
function isles(W,H,rng){ for(;;){ const m=new Uint8Array(W*H).fill(1); let n=0;
  for(let t=0;t<80&&n<5;t++){ const x=1+(rng()*(W-2)|0), y=1+(rng()*(H-2)|0), sz=1+(rng()*3|0), v=rng()<.5, c=[];
    for(let k=0;k<sz;k++){ const cx=v?x:x+k, cy=v?y+k:y; if(cx>=W-1||cy>=H-1){ c.length=0; break; } c.push(cy*W+cx); }
    if(!c.length) continue; let ok=true; for(const i of c){ const ix=i%W, iy=(i/W)|0; for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) if(!m[(iy+dy)*W+ix+dx]) ok=false; }
    if(ok){ c.forEach(i=>m[i]=0); n++; } }
  if(n>=4) return m; } }
const shipDef=id=>SHIPS[id];
const shipLen=id=>SHIPS[id].len;
// Everything a game needs to know about its rules. mods = {sea, fleet, touch}. An Archipelago's islands are random,
// so they're kept with the game (mask) and passed back in when it's restored.
function makeRules(mods,rng=Math.random,mask){ const md=Object.assign({},CLASSIC,mods||{}); if(!SHAPES[md.sea]) md.sea='classic'; if(!FLEETS[md.fleet]) md.fleet='standard'; md.touch=md.touch!==false;
  const sh=SHAPES[md.sea], W=sh.W, H=sh.H, N=W*H, m=mask?Uint8Array.from(mask):sh.mask?sh.mask(W,H,rng):new Uint8Array(N).fill(1), fleet=FLEETS[md.fleet].ids.slice();
  const place={}; for(const L of new Set(fleet.map(shipLen))){ const a=[]; for(let v=0;v<2;v++) for(let y=0;y<(v?H-L+1:H);y++) for(let x=0;x<(v?W:W-L+1);x++){ const c=[]; let ok=true;
    for(let k=0;k<L;k++){ const i=v?(y+k)*W+x:y*W+x+k; if(!m[i]){ ok=false; break; } c.push(i); } if(ok) a.push(c); } place[L]=a; }
  let water=0; for(const v of m) water+=v;
  return {mods:md,W,H,N,mask:m,fleet,touch:md.touch,place,water,cells:fleet.reduce((a,id)=>a+shipLen(id),0)}; }
const CLASSIC_RULES=makeRules(CLASSIC);
const isClassic=R=>R.mods.sea==='classic'&&R.mods.fleet==='standard'&&R.touch;
const cellName=(i,W=SEA)=>COLS[i%W]+(Math.floor(i/W)+1);
function cellsOf(s,W=SEA){ const L=shipLen(s.id), out=[]; for(let k=0;k<L;k++) out.push(s.v?(s.y+k)*W+s.x:s.y*W+s.x+k); return out; }
function fits(s,R=CLASSIC_RULES){ const L=shipLen(s.id); if(!(s.x>=0&&s.y>=0&&(s.v?(s.x<R.W&&s.y+L<=R.H):(s.y<R.H&&s.x+L<=R.W)))) return false;
  return cellsOf(s,R.W).every(i=>R.mask[i]); }
const NB8=(i,R)=>{ const x=i%R.W, y=(i/R.W)|0, o=[]; for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ if(!dx&&!dy) continue; const nx=x+dx, ny=y+dy; if(nx>=0&&ny>=0&&nx<R.W&&ny<R.H) o.push(ny*R.W+nx); } return o; };
const NB4=(i,R)=>{ const W=R.W, x=i%W, y=(i/W)|0, o=[]; if(x>0) o.push(i-1); if(x<W-1) o.push(i+1); if(y>0) o.push(i-W); if(y<R.H-1) o.push(i+W); return o; };
// Water cells around a ship (8 directions): empty when ships can't touch
const ringOf=(cells,R)=>{ const own=new Set(cells), out=new Set(); for(const c of cells) for(const n of NB8(c,R)) if(!own.has(n)&&R.mask[n]) out.add(n); return [...out]; };
// Checks a whole layout: exactly the fleet's ships, on water, no overlap, and no touching if the rules say so.
function checkFleet(ships,R=CLASSIC_RULES){
  if(!Array.isArray(ships)||ships.length!==R.fleet.length) return {ok:false,why:'count'};
  const seen=new Set(), occ=new Int8Array(R.N).fill(-1);
  for(const [k,s] of ships.entries()){
    if(!s||!R.fleet.includes(s.id)||seen.has(s.id)) return {ok:false,why:'ship'}; seen.add(s.id);
    if(![s.x,s.y].every(Number.isInteger)||!fits(s,R)) return {ok:false,why:'off',id:s.id};
    for(const i of cellsOf(s,R.W)){ if(occ[i]>=0) return {ok:false,why:'overlap',id:s.id}; occ[i]=k; } }
  if(!R.touch) for(const [k,s] of ships.entries()) for(const n of ringOf(cellsOf(s,R.W),R)) if(occ[n]>=0&&occ[n]!==k) return {ok:false,why:'touch',id:s.id};
  return {ok:true};
}
// Where a ship can go now, ignoring one ship (the one being moved). Used by the placement screen.
function canPlace(ships,s,R=CLASSIC_RULES,ignoreId){ if(!R.fleet.includes(s.id)||!fits(s,R)) return false; const occ=new Set();
  for(const o of ships) if(o.id!==ignoreId&&o.id!==s.id) for(const i of cellsOf(o,R.W)){ occ.add(i); if(!R.touch) for(const n of NB8(i,R)) occ.add(n); }
  return cellsOf(s,R.W).every(i=>!occ.has(i)); }
// Random legal fleet. Tries quick random draws first (on the classic sea this is exactly the original method, so Daily Hunt
// fleets never change), then falls back to a shuffled search that always finds a layout if one exists.
function randomFleet(R=CLASSIC_RULES,rng=Math.random){
  if(typeof R==='function'){ rng=R; R=CLASSIC_RULES; }
  for(let round=0;round<300;round++){ const out=[]; let bad=false;
    for(const id of R.fleet){ const L=shipLen(id); let placed=false;
      for(let t=0;t<200&&!placed;t++){ const v=rng()<.5?1:0, x=rng()*(v?R.W:R.W-L+1)|0, y=rng()*(v?R.H-L+1:R.H)|0, s={id,x,y,v};
        if(canPlace(out,s,R)){ out.push(s); placed=true; } }
      if(!placed){ bad=true; break; } }
    if(!bad) return out; }
  const ids=R.fleet.slice().sort((a,b)=>shipLen(b)-shipLen(a)), out=[];
  const go=k=>{ if(k===ids.length) return true; const id=ids[k], opts=[];
    for(let v=0;v<2;v++) for(let y=0;y<R.H;y++) for(let x=0;x<R.W;x++){ const s={id,x,y,v}; if(canPlace(out,s,R)) opts.push(s); }
    for(let i=opts.length-1;i>0;i--){ const j=rng()*(i+1)|0; [opts[i],opts[j]]=[opts[j],opts[i]]; }
    for(const s of opts){ out.push(s); if(go(k+1)) return true; out.pop(); } return false; };
  if(!go(0)) throw new Error('no legal fleet for these rules'); return R.fleet.map(id=>out.find(s=>s.id===id));
}

// ---------- a sea with a hidden fleet ----------
// shots[i]: 0 untried, 1 miss, 2 hit. clear[i]=1: known empty because ships can't touch (shown, can't be fired at).
class Sea{
  constructor(ships,shots,R=CLASSIC_RULES){ this.R=R; this.ships=ships.map(s=>({id:s.id,x:s.x,y:s.y,v:s.v?1:0})); this.own=new Int8Array(R.N).fill(-1);
    this.ships.forEach((s,k)=>cellsOf(s,R.W).forEach(i=>this.own[i]=k)); this.shots=new Uint8Array(R.N); this.clear=new Uint8Array(R.N);
    this.hp=this.ships.map(s=>shipLen(s.id)); this.sunk=[];
    if(shots) shots.forEach((v,i)=>{ if(v) this.fire(i); }); }
  canFire(i){ return i>=0&&i<this.R.N&&!!this.R.mask[i]&&!this.shots[i]&&!this.clear[i]; }
  fire(i){ if(!this.canFire(i)) return {res:'dup',i};
    const k=this.own[i]; if(k<0){ this.shots[i]=1; return {res:'miss',i}; }
    this.shots[i]=2; if(--this.hp[k]>0) return {res:'hit',i};
    const s=this.ships[k], cells=cellsOf(s,this.R.W); this.sunk.push(s.id);
    const r={res:'sunk',i,id:s.id,cells,len:shipLen(s.id)};
    if(!this.R.touch){ r.ring=ringOf(cells,this.R).filter(n=>!this.shots[n]); r.ring.forEach(n=>this.clear[n]=1); }
    return r; }
  get afloat(){ return this.hp.filter(h=>h>0).length; }
  get dead(){ return this.hp.every(h=>h===0); }
  shipAt(i){ const k=this.own[i]; return k<0?null:this.ships[k]; }
  isSunk(id){ return this.sunk.includes(id); }
  toJSON(){ return {ships:this.ships,shots:Array.from(this.shots)}; }
}

// ---------- AI ----------
// The AI never sees the player's fleet. It keeps its own view of the player's sea, built only from its shot results:
// view[i] 0 unknown, 1 miss / land / known empty, 2 hit (ship not yet sunk), 3 part of a sunk ship (sinks are announced and outlined).
// next() depends only on that view (and the RNG), which the tests check.
const LEVELS=['easy','normal','hard'], EASY_NB=.1; // Easy chases a hit only 1 turn in 10 (tuned by sim: ~90 shots a game)
class AI{
  constructor(level='normal',rng=Math.random,state,R=CLASSIC_RULES){ this.level=LEVELS.includes(level)?level:'normal'; this.rng=rng; this.R=R;
    this.view=state?Uint8Array.from(state.view):Uint8Array.from(R.mask,v=>v?0:1); this.left=state?state.left.slice():R.fleet.map(shipLen);
    this.focus=state&&state.focus?state.focus.slice():[]; } // Normal: hits it is chasing; dropped after each sink
  observe(i,r){ if(r.res==='miss') this.view[i]=1; else if(r.res==='hit'){ this.view[i]=2; this.focus.push(i); }
    else if(r.res==='sunk'){ for(const c of r.cells) this.view[c]=3; if(r.ring) for(const c of r.ring) if(!this.view[c]) this.view[c]=1;
      const k=this.left.indexOf(r.len); if(k>=0) this.left.splice(k,1); this.focus=[]; } }
  untried(){ const o=[]; for(let i=0;i<this.R.N;i++) if(!this.view[i]) o.push(i); return o; }
  open(){ const o=[]; for(let i=0;i<this.R.N;i++) if(this.view[i]===2) o.push(i); return o; } // hits on ships still afloat
  pickR(a){ return a[this.rng()*a.length|0]; }
  next(){ const free=this.untried(); if(!free.length) return -1;
    if(this.level==='easy') return this.easy(free); if(this.level==='hard') return this.hard(free); return this.normal(free); }
  easy(free){ const h=this.open();
    if(h.length&&this.rng()<EASY_NB){ const nb=[...new Set(h.flatMap(i=>NB4(i,this.R)))].filter(i=>!this.view[i]); if(nb.length) return this.pickR(nb); }
    return this.pickR(free); }
  normal(free){ const V=this.view, W=this.R.W, H=this.R.H, N=this.R.N, h=this.focus.filter(i=>V[i]===2);
    if(h.length){ const hs=new Set(h), line=[];
      for(const i of h){ const x=i%W, y=(i/W)|0;
        if(x<W-1&&hs.has(i+1)){ let a=i; while(a%W>0&&V[a-1]===2) a--; let b=i+1; while(b%W<W-1&&V[b+1]===2) b++;
          if(a%W>0&&!V[a-1]) line.push(a-1); if(b%W<W-1&&!V[b+1]) line.push(b+1); }
        if(y<H-1&&hs.has(i+W)){ let a=i; while(a>=W&&V[a-W]===2) a-=W; let b=i+W; while(b<N-W&&V[b+W]===2) b+=W;
          if(a>=W&&!V[a-W]) line.push(a-W); if(b<N-W&&!V[b+W]) line.push(b+W); } }
      if(line.length) return this.pickR(line);
      const nb=[...new Set(h.flatMap(i=>NB4(i,this.R)))].filter(i=>!V[i]); if(nb.length) return this.pickR(nb); }
    const m=Math.min(...this.left), par=free.filter(i=>((i%W)+((i/W)|0))%m===0);
    return this.pickR(par.length?par:free); }
  // Count every legal placement of every remaining ship. Placements covering unresolved hits count far more.
  heat(){ const V=this.view, H=new Float64Array(this.R.N);
    for(const L of this.left) for(const c of this.R.place[L]||[]){ let k=0, ok=true;
      for(const i of c){ const v=V[i]; if(v===1||v===3){ ok=false; break; } if(v===2) k++; }
      if(!ok) continue; const w=k?Math.pow(40,k):1; for(const i of c) if(!V[i]) H[i]+=w; }
    return H; }
  hard(free){ const H=this.heat(); let best=-1, top=[];
    for(const i of free){ if(H[i]>best+1e-9){ best=H[i]; top=[i]; } else if(Math.abs(H[i]-best)<=1e-9) top.push(i); }
    return this.pickR(top); }
  toJSON(){ return {level:this.level,view:Array.from(this.view),left:this.left.slice(),focus:this.focus.slice()}; }
}

// ---------- a match vs the AI ----------
// The player fires first, one shot per turn, then the AI fires. Win by sinking the whole enemy fleet first.
// Both fleets use the same rules. log: the player's shots in order, as [cell, 'm'|'h'|'s'] (accuracy and Clean Sink).
class Match{
  constructor(o){ this.level=o.level||'normal'; const R=this.R=o.R||makeRules(o.mods,o.rng||Math.random,o.mask);
    const sea=x=>x instanceof Sea?x:new Sea(x.ships||x,x.shots,R); this.me=sea(o.me); this.foe=sea(o.foe);
    this.ai=new AI(this.level,o.rng||Math.random,o.ai,R); this.turn=o.turn||'me'; this.state=o.state||'play'; this.camp=o.camp||null;
    this.log=o.log?o.log.map(e=>e.slice()):[]; this.aiLog=o.aiLog?o.aiLog.slice():[]; this.cleanSinks=o.cleanSinks||0; this.t0=o.t0||Date.now(); }
  get shots(){ return this.log.length; }
  get hits(){ return this.log.filter(e=>e[1]!=='m').length; }
  get acc(){ return this.shots?this.hits/this.shots:0; }
  fire(i){ if(this.state!=='play'||this.turn!=='me') return {res:'turn'};
    const r=this.foe.fire(i); if(r.res==='dup') return r;
    this.log.push([i,r.res==='miss'?'m':r.res==='hit'?'h':'s']);
    if(r.res==='sunk'){ // Clean Sink: no misses from the first hit on this ship to the last
      const own=new Set(r.cells); let a=this.log.findIndex(e=>own.has(e[0])); r.clean=this.log.slice(a).every(e=>e[1]!=='m'); if(r.clean) this.cleanSinks++; }
    if(this.foe.dead){ this.state='won'; this.turn='-'; } else this.turn='ai'; return r; }
  aiFire(){ if(this.state!=='play'||this.turn!=='ai') return null;
    const i=this.ai.next(), r=this.me.fire(i); this.ai.observe(i,r); this.aiLog.push(i);
    if(this.me.dead){ this.state='lost'; this.turn='-'; } else this.turn='me'; return r; }
  toJSON(){ return {level:this.level,mods:this.R.mods,mask:SHAPES[this.R.mods.sea].mask?Array.from(this.R.mask):undefined,camp:this.camp,
    me:this.me.toJSON(),foe:this.foe.toJSON(),ai:this.ai.toJSON(),turn:this.turn,state:this.state,log:this.log,aiLog:this.aiLog,cleanSinks:this.cleanSinks,t0:this.t0}; }
  static from(o,rng){ return new Match(Object.assign({},o,{rng,R:makeRules(o.mods,rng,o.mask)})); } // saves from before modifiers load as classic
}
// Stars for a won match: ★ win · ★ hit-rate target · ★ none of your ships sunk.
// The hit-rate target scales with how crowded the sea is (fleet cells ÷ water cells; classic is 17 ÷ 100).
const ACC_TARGET={easy:.35,normal:.45,hard:.5};
function accTarget(level,R=CLASSIC_RULES){ const f=Math.min(1.3,Math.max(.7,Math.sqrt((R.cells/R.water)/.17))); return Math.round(ACC_TARGET[level]*f*20)/20; }
function matchStars(m){ if(m.state!=='won') return [false,false,false]; return [true,m.acc>=accTarget(m.level,m.R)-1e-9,m.me.sunk.length===0]; }

// ---------- seeded RNG (from Sweep's League: cyrb128 -> sfc32), same numbers on every device ----------
function seedRng(str){
  let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;

// ---------- storage (falls back to memory if the browser refuses) ----------
const store=(()=>{ try{ const t='shipfight.probe'; localStorage.setItem(t,'1'); localStorage.removeItem(t); return localStorage; }
  catch(e){ const m=new Map(); return {getItem:k=>m.has(k)?m.get(k):null,setItem:(k,v)=>m.set(k,String(v)),removeItem:k=>m.delete(k)}; } })();
const REDUCED=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const FRESH=store.getItem(KEY)===null;
let S=loadSave(store,false); if(FRESH) S.motion=!REDUCED;
// Standalone copies of the shared settings, kept untouched while Arcade's values are in use
const OWN={}; for(const k of SHARED) OWN[k]=S[k];
if(ARCADE) applyArcade(S,store);
let sumT=0;
function persist(){ const out=ARCADE?Object.assign({},S,OWN):S; try{ store.setItem(KEY,JSON.stringify(out)); }catch(e){}
  if(ARCADE){ clearTimeout(sumT); sumT=setTimeout(writeSummary,300); } }
function writeSummary(){ clearTimeout(sumT); try{ store.setItem(SUMMARY_KEY,JSON.stringify(summary(S))); }catch(e){} }
// Settings changed here are the game's own; shared ones are only shown (and changed) outside Arcade
const setOwn=(k,v)=>{ S[k]=v; if(SHARED.includes(k)&&!ARCADE) OWN[k]=v; persist(); };

// ---------- translations (Sweep's watcher: every text node is translated as it appears) ----------
const LANGS=[['auto','Automatic'],['en','English'],['es','Español'],['fr','Français'],['de','Deutsch'],['pt','Português']];
let LANG='en', DICT=null, PATS=[];
const LOCALE=()=>LANG==='en'?undefined:LANG==='pt'?'pt-BR':LANG;
const escRe=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function setLang(){
  const pref=S.lang||'auto'; let l=pref==='auto'?String(navigator.language||'en').slice(0,2).toLowerCase():pref;
  const col=(typeof I18N_LANGS!=='undefined')?I18N_LANGS.indexOf(l):-1; if(col<1) l='en'; LANG=l; DICT=null; PATS=[]; document.documentElement.lang=l;
  if(l==='en') return; DICT=new Map();
  for(const row of I18N_ROWS){ const v=row[col]; if(!v) continue; DICT.set(row[0],v);
    if(row[0].includes('{')){ const parts=row[0].split(/(\{\d\})/), idx=[]; let re='^';
      for(const pt of parts){ const m=pt.match(/^\{(\d)\}$/); if(m){ re+='(.+?)'; idx.push(+m[1]); } else re+=escRe(pt); }
      PATS.push({re:new RegExp(re+'$','s'),idx,out:v,lit:parts[0],len:row[0].replace(/\{\d\}/g,'').length}); } }
  PATS.sort((a,b)=>b.len-a.len);
}
function tr(text){ if(!DICT||text==null) return null; const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(text), core=m[2].replace(/\s+/g,' ');
  if(!core||!/[A-Za-z]/.test(core)) return null;
  let o=DICT.get(core);
  if(o==null) for(const P of PATS){ if(P.lit&&!core.startsWith(P.lit)) continue; const mm=P.re.exec(core); if(!mm) continue;
    const args=[]; P.idx.forEach((n,i)=>args[n]=mm[i+1]); o=P.out.replace(/\{(\d)\}/g,(_,n)=>{ const a=args[n]||''; const t=tr(a); return t!=null?t.trim():a; }); break; }
  return o==null?null:m[1]+o+m[3]; }
const T=t=>{ const o=tr(t); return o==null?t:o; }; // for text that isn't in the DOM (canvas labels, share messages)
const TL=t=>String(t).split('\n').map(T).join('\n');
const SKIP=new Set(['SCRIPT','STYLE','TEXTAREA','INPUT']);
const done=new WeakMap();
function trNode(n){ const v=n.nodeValue; if(done.get(n)===v) return; const p=n.parentNode; if(p&&(SKIP.has(p.nodeName)||p.closest&&p.closest('[data-raw]'))){ done.set(n,v); return; }
  const t=tr(v); if(t!=null&&t!==v) n.nodeValue=t; else if(window.__i18nMiss&&/[A-Za-z]{2}/.test(v)) window.__i18nMiss.add(v.trim()); done.set(n,n.nodeValue); }
function trAttrs(el){ for(const a of ['placeholder','aria-label','title']){ const v=el.getAttribute&&el.getAttribute(a); if(v){ const t=tr(v); if(t!=null) el.setAttribute(a,t); } } }
function trTree(root){ if(!DICT) return; if(root.nodeType===3){ trNode(root); return; } if(root.nodeType!==1) return;
  trAttrs(root); if(SKIP.has(root.nodeName)) return; root.querySelectorAll&&root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(trAttrs);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n; while((n=w.nextNode())) trNode(n); }
function startI18n(){ setLang(); if(!DICT) return; trTree(document.body);
  new MutationObserver(ms=>{ for(const m of ms){ if(m.type==='characterData') trNode(m.target); else m.addedNodes.forEach(trTree); } })
    .observe(document.body,{subtree:true,childList:true,characterData:true}); }
function openLang(){
  const cur=S.lang||'auto', auto=String(navigator.language||'en').slice(0,2).toLowerCase(), autoName=(LANGS.find(l=>l[0]===auto)||LANGS[1])[1];
  sheet2(`<h2>Language</h2><div class="sub">Ship Fight restarts in the chosen language. Your progress is kept.</div><div class="lb">${LANGS.map(([k,n])=>`<button class="lbr${k===cur?' me':''}" data-lang="${k}"><span class="lbk">${k===cur?'✓':''}</span><span data-raw>${k==='auto'?`${T('Automatic')} (${autoName})`:n}</span><span></span></button>`).join('')}</div>
    <div class="sub" style="font-size:12px;margin:8px 0 0">Translations are machine-assisted. If something reads oddly, tell the developer.</div><div class="btns" style="margin-top:10px"><button class="ghost" data-close>Close</button></div>`);
  $$('#sheet2 [data-lang]').forEach(b=>b.onclick=()=>{ const v=b.dataset.lang; if(v===cur){ hideOv2(); return; } saveGame(); setOwn('lang',v); location.reload(); }); }

// ---------- themes and unlocks ----------
const level=()=>levelOf(S.xp);
const owned=it=>(!it.req||!!S.ach[it.req])&&(!it.lvl||level()>=it.lvl);
const pick=(list,id)=>{ const it=list.find(x=>x.id===id); return it&&owned(it)?it.id:list[0].id; };
const CBC=new Map();
const mixHex=(a,b,t)=>'#'+[1,3,5].map(i=>Math.round(parseInt(a.substr(i,2),16)*(1-t)+parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const lum=hex=>{ if(typeof hex!=='string'||hex[0]!=='#') return .5; const c=hex.slice(1), n=[0,2,4].map(i=>parseInt(c.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)); return .2126*n[0]+.7152*n[1]+.0722*n[2]; };
// Colourblind-safe markers (Okabe-Ito): vermillion hits, blue misses. Hits and misses also differ by shape in every theme.
const themeOf=t=>{ if(!S.cb) return t; if(!CBC.has(t)) CBC.set(t,Object.assign({},t,{flag:'#D55E00',miss:lum(t.water)<.3?'#56B4E9':'#0072B2'})); return CBC.get(t); };
const theme=()=>themeOf(SEAS.find(t=>t.id===pick(SEAS,S.sea)));
const hitStyle=()=>pick(HITS,S.hit), missStyle=()=>pick(MISSES,S.miss), fxStyle=()=>pick(FXS,S.fx);
const ALLC=()=>[...SEAS,...HITS,...MISSES,...FXS];
const motionOn=()=>S.motion!==false;
const goal=id=>ACH.find(a=>a.id===id);
const lockText=it=>it.lvl?`Reach level ${it.lvl}`:'Unlock: '+goal(it.req).desc;
const darkMQ=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
const isDark=()=>S.appearance==='dark'||(S.appearance==='system'&&!!darkMQ&&darkMQ.matches);
function applyTheme(){
  const Th=theme(), st=document.documentElement.style, framed=isDark()&&!Th.dark; let v;
  if(framed){ const acc=lum(Th.accent)<.03?'#f2f2f4':lum(Th.accent)<.2?mixHex(Th.accent,'#ffffff',.55):Th.accent;
    v={bg:'#111214',panel:'#1c1d22',ink:'#f2f2f4',sub:'#8d9099',accent:acc,accentInk:lum(acc)>.4?'#111214':'#ffffff',line:'rgba(255,255,255,.09)'}; }
  else v={bg:Th.bg,panel:Th.panel,ink:Th.ink,sub:Th.sub,accent:Th.accent,accentInk:Th.accentInk,line:Th.uiLine||(Th.dark?'rgba(255,255,255,.1)':'rgba(0,0,0,.08)')};
  for(const k in v) st.setProperty('--'+k,v[k]); st.setProperty('--seabg',Th.bg); UI=v;
  document.body.classList.toggle('framed',framed); document.body.classList.toggle('lefty',!!S.lefty);
  document.querySelectorAll('meta[name=theme-color]').forEach(m=>m.content=v.bg); st.colorScheme=(framed||Th.dark)?'dark':'light';
  if(cur==='game') resize(); if(cur==='place') presize();
}

// ---------- helpers ----------
const today=()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const DAY=864e5;
const pct=v=>Math.round(v*100)+'%';
const buzz=p=>{ if(!S.haptics) return; try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} };
const starStr=n=>'★'.repeat(n)+'☆'.repeat(3-n);
const shipName=id=>shipDef(id).name;
// toasts: the same message is never queued twice
const tq=[]; let tBusy=false, tTimer=0, tCur='';
function toast(m,now){ if(now){ tq.length=0; showToast(m); return; } if((tBusy&&m===tCur)||tq.includes(m)) return; tq.push(m); if(!tBusy) nextToast(); }
function nextToast(){ const m=tq.shift(); if(!m){ tBusy=false; tCur=''; return; } showToast(m); }
function showToast(m){ const el=$('#toast'); tBusy=true; tCur=m; el.textContent=m; el.classList.add('on'); clearTimeout(tTimer);
  tTimer=setTimeout(()=>{ el.classList.remove('on'); tTimer=setTimeout(nextToast,420); },2400); }
const sheet2=h=>{ $('#sheet2').innerHTML=h; $('#ov2').classList.remove('hidden'); };
const hideOv2=()=>$('#ov2').classList.add('hidden');
$('#ov2').addEventListener('click',e=>{ if(e.target.id==='ov2'||e.target.closest('[data-close]')) hideOv2(); });
// Shows what a finished game earned: achievements, then level-ups
function showGains(out){
  for(const id of out.ach||[]){ const a=goal(id), t=achRw(id); toast(`🏆 ${a.name}${t?` · ${t} unlocked`:''}`); }
  if(out.ups&&out.ups.length){ const l=out.ups[out.ups.length-1], r=out.ups.flatMap(l=>REWARDS[l]||[]); toast(`⭐ Level ${l}${r.length?' · '+r.join(', '):''}`); setTimeout(()=>{ sfx('level'); levelBurst(); },700); } }
function awardNow(id){ if(!award(S,id)) return; persist(); showGains({ach:[id]}); }

<script>
// ===================== AUDIO (all synthesized live with Web Audio) =====================
const AU={};
function buildAudio(c){
  AU.ctx=c; AU.master=c.createGain(); AU.master.gain.value=.9; AU.master.connect(c.destination);
  AU.sfx=c.createGain(); AU.sfx.gain.value=1; AU.sfx.connect(AU.master);
  AU.mus=c.createGain(); AU.mus.gain.value=0; AU.musLP=c.createBiquadFilter(); AU.musLP.type='lowpass'; AU.musLP.frequency.value=3200;
  AU.mus.connect(AU.musLP); AU.musLP.connect(AU.master);
  AU.dly=c.createDelay(1); AU.dly.delayTime.value=3*60/SONG.bpm/4; AU.fb=c.createGain(); AU.fb.gain.value=.3;
  const dl=c.createBiquadFilter(); dl.type='lowpass'; dl.frequency.value=1800; AU.dly.connect(dl); dl.connect(AU.fb); AU.fb.connect(AU.dly); dl.connect(AU.mus);
  AU.send=c.createGain(); AU.send.gain.value=.45; AU.send.connect(AU.dly);
  const len=c.sampleRate, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; AU.noise=b;
}
function audio(){ if(!AU.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; try{ buildAudio(new C()); }catch(e){ return null; } }
  if(AU.ctx.state==='suspended'&&!document.hidden) AU.ctx.resume().catch(()=>{}); return AU.ctx; }
const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(o){
  const c=AU.ctx, t=(o.at!=null?o.at:c.currentTime)+(o.t||0), d=o.d||.12, v=o.v||.2, a=o.a||.005, h=o.hold||0;
  const osc=c.createOscillator(), g=c.createGain(); osc.type=o.type||'sine'; osc.frequency.setValueAtTime(o.f,t);
  if(o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2,t+(o.glide||d)); if(o.det) osc.detune.value=o.det;
  g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(v,t+a); if(h) g.gain.setValueAtTime(v,t+a+h); g.gain.exponentialRampToValueAtTime(.0001,t+a+h+d);
  let n=osc; if(o.lp){ const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.lp; osc.connect(f); n=f; }
  n.connect(g); g.connect(o.dest||AU.sfx); if(o.send) g.connect(o.send); osc.start(t); osc.stop(t+a+h+d+.05);
}
function noise(o){
  const c=AU.ctx, t=(o.at!=null?o.at:c.currentTime)+(o.t||0), d=o.d||.1;
  const s=c.createBufferSource(); s.buffer=AU.noise; const f=c.createBiquadFilter(); f.type=o.ft||'lowpass';
  f.frequency.setValueAtTime(o.f||1000,t); if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2,t+d); f.Q.value=o.q||.7;
  const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(o.v||.2,t+(o.a||.004)); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.loop=true; s.connect(f); f.connect(g); g.connect(o.dest||AU.sfx); s.start(t,Math.random()*.5); s.stop(t+d+.02);
}
function duck(){ if(!Music.on) return; const c=AU.ctx, g=AU.mus.gain; g.cancelScheduledValues(c.currentTime); g.setValueAtTime(g.value,c.currentTime);
  g.linearRampToValueAtTime(MUSVOL*.25,c.currentTime+.05); g.linearRampToValueAtTime(MUSVOL,c.currentTime+2.5); }
// Effects: shot, splash, hit, sink, ping (radar), win, lose, level, click, place, turn, error
function sfx(name){
  if(!S.sfx) return; const c=audio(); if(!c) return;
  if(name==='click') return tone({f:1500,d:.025,v:.06});
  if(name==='shot'){ noise({d:.2,v:.1,ft:'bandpass',f:2600,f2:500,q:.9}); tone({f:170,f2:70,d:.12,v:.22}); return; }
  if(name==='splash'){ noise({d:.5,v:.22,f:2400,f2:260,a:.01}); noise({t:.04,d:.3,v:.06,ft:'highpass',f:4000});
    [0,.09,.17,.26].forEach((t,k)=>tone({t:t+.05,f:520+Math.random()*500,f2:1100+Math.random()*700,d:.06,v:.05-k*.008})); return; }
  if(name==='hit'){ noise({d:.6,v:.45,f:3000,f2:90}); tone({f:150,f2:40,d:.5,v:.5}); noise({t:.05,d:.35,v:.08,ft:'bandpass',f:900,f2:300}); duck(); return; }
  if(name==='sink'){ noise({d:.9,v:.5,f:2400,f2:60}); tone({f:130,f2:30,d:.9,v:.55}); tone({t:.25,f:330,f2:70,glide:1.3,d:1.3,v:.09,type:'triangle'});
    noise({t:.2,d:1.6,v:.22,f:240,f2:60,a:.2}); [0,.12,.25].forEach(t=>tone({t:.9+t,f:hz(52-t*20),d:.4,v:.05,type:'triangle'})); duck(); return; }
  if(name==='ping'){ tone({f:1320,d:.7,v:.09}); tone({t:.32,f:1320,d:.5,v:.03}); return; }
  if(name==='turn') return tone({f:hz(84),d:.09,v:.05,type:'triangle'});
  if(name==='place'){ tone({f:200,f2:150,d:.08,v:.16,type:'triangle'}); noise({d:.04,v:.05,ft:'bandpass',f:1200}); return; }
  if(name==='rotate') return tone({f:520,f2:760,d:.08,v:.1,type:'triangle'});
  if(name==='error'){ tone({f:220,d:.08,v:.06,type:'square',lp:1200}); tone({t:.1,f:180,d:.1,v:.06,type:'square',lp:1200}); return; }
  if(name==='win'||name==='level'){ const seq=name==='win'?[67,72,76,79,84]:[79,84,88,91];
    seq.forEach((m,i)=>tone({f:hz(m),t:i*.1,d:.32,v:.12,type:'triangle'})); if(name==='win') [72,76,79].forEach(m=>tone({f:hz(m),t:.55,d:1,v:.05,type:'triangle',a:.05}));
    noise({t:.3,d:.6,v:.03,ft:'highpass',f:6000}); return; }
  if(name==='lose'){ [64,60,57,52].forEach((m,i)=>tone({f:hz(m),t:i*.22,d:.5,v:.11})); return; }
}
// ---------- soundtrack "Harbour": 92 BPM in D dorian, 8 bars, generated live ----------
const SONG={bpm:92,
 chords:[[50,57,60,65],[48,55,59,64],[50,57,60,65],[45,52,57,60],[46,53,57,62],[48,55,59,64],[50,57,60,65],[45,52,55,61]],
 bass:[38,36,38,33,34,36,38,33],
 mel:[[[0,74,3],[4,76,2],[6,77,4],[12,76,2]],[[0,74,4],[6,72,2],[8,71,6]],[[2,69,2],[4,72,2],[6,74,4],[12,77,3]],[[0,76,6],[8,72,4],[12,69,3]],
      [[0,70,3],[4,74,2],[6,77,4],[12,74,2]],[[0,76,4],[6,79,2],[8,76,6]],[[2,74,2],[4,77,3],[8,81,4],[12,79,2]],[[0,76,4],[6,73,2],[8,74,7]]]};
const MUSVOL=.36, BASSPAT={0:0,7:7,10:0,14:12};
function musicStep(step,t,sd){ const bar=step>>4, s=step&15, D=AU.mus; if(s&1) t+=sd*.12;
  if(s===0||s===9) tone({at:t,f:100,f2:40,glide:.13,d:.24,v:.42,dest:D});
  if(s===4||s===12) noise({at:t,d:.08,v:.06,ft:'bandpass',f:1700,q:1.1,dest:D});
  if(s%2===0) noise({at:t,d:.03,v:s%4?.012:.03,ft:'highpass',f:8000,dest:D});
  if(s in BASSPAT) tone({at:t,f:hz(SONG.bass[bar]+BASSPAT[s]),d:.3,v:.2,type:'triangle',lp:800,dest:D});
  if(s===0) for(const m of SONG.chords[bar]) for(const det of [-6,6]) tone({at:t,f:hz(m),det,a:.4,hold:sd*16-.7,d:.7,v:.018,type:'triangle',lp:1300,dest:D});
  for(const [st,m,len] of SONG.mel[bar]) if(st===s) tone({at:t,f:hz(m),d:Math.max(.2,len*sd*1.2),v:.065,dest:D,send:AU.send}); }
const Music={on:false,step:0,next:0,iv:0,
  start(){ const c=audio(); if(!c||this.on) return; this.on=true; this.step=0; this.next=c.currentTime+.08;
    const g=AU.mus.gain; g.cancelScheduledValues(c.currentTime); g.setValueAtTime(g.value,c.currentTime); g.linearRampToValueAtTime(MUSVOL,c.currentTime+2.5);
    clearInterval(this.iv); this.iv=setInterval(()=>this.tick(),30); },
  stop(){ if(!this.on) return; this.on=false; clearInterval(this.iv); const c=AU.ctx, g=AU.mus.gain; g.cancelScheduledValues(c.currentTime); g.setTargetAtTime(0,c.currentTime,.25); },
  tick(){ const c=AU.ctx, sd=60/SONG.bpm/4; if(c.state!=='running'){ this.next=c.currentTime+.05; return; } if(this.next<c.currentTime) this.next=c.currentTime+.02;
    while(this.next<c.currentTime+.2){ musicStep(this.step,this.next,sd); this.next+=sd; this.step=(this.step+1)%128; } } };
const unlockAudio=()=>{ if(!S.sfx&&!S.music) return; audio(); if(S.music) Music.start(); };
['pointerdown','pointerup','touchend','keydown','click'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{ if(!AU.ctx) return; if(document.hidden) AU.ctx.suspend().catch(()=>{}); else AU.ctx.resume().catch(()=>{}); });
document.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b&&!b.disabled) sfx('click'); },true);
function goFull(){ if(!document.fullscreenEnabled||document.fullscreenElement) return; const r=document.documentElement.requestFullscreen; if(r) r.call(document.documentElement,{navigationUI:'hide'}).catch(()=>{}); }
addEventListener('pointerup',()=>{ if(S.fullscreen) goFull(); },true);

// ===================== PARTICLES (1,500-particle cap) =====================
const FX={P:[],on:false};
const fxBusy=()=>FX.P.length>0;
function fxAdd(arr){ if(!motionOn()||FX.P.length>1500) return; for(const p of arr) FX.P.push(p); if(!FX.on){ FX.on=true; requestAnimationFrame(fxFrame); } }
function starPath(c,x,y,r,rot){ c.beginPath(); for(let i=0;i<10;i++){ const a=rot-Math.PI/2+i*Math.PI/5, q=i%2?r*.45:r; c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q); } c.closePath(); }
function fxFrame(now){
  const cv=$('#fx'), d=Math.min(devicePixelRatio||1,2), W=innerWidth, H=innerHeight;
  if(cv.width!==Math.round(W*d)||cv.height!==Math.round(H*d)){ cv.width=Math.round(W*d); cv.height=Math.round(H*d); }
  const c=cv.getContext('2d'); c.setTransform(d,0,0,d,0,0); c.clearRect(0,0,W,H);
  FX.P=FX.P.filter(p=>now<p.born+p.life);
  for(const p of FX.P){ if(now<p.born) continue; const k=(now-p.born)/p.life;
    p.vy+=p.g; p.vx*=p.dr; p.vy*=p.dr; p.x+=p.vx; p.y+=p.vy; p.rot=(p.rot||0)+(p.vr||0);
    c.globalAlpha=Math.min(1,(1-k)*1.8); c.fillStyle=c.strokeStyle=p.col;
    if(p.kind==='rect'){ c.save(); c.translate(p.x,p.y); c.rotate(p.rot); c.fillRect(-p.w/2,-p.h/2,p.w,p.h); c.restore(); }
    else if(p.kind==='spark'){ const tl=p.tl||3; c.lineWidth=p.size; c.lineCap='round'; c.beginPath(); c.moveTo(p.x-p.vx*tl,p.y-p.vy*tl); c.lineTo(p.x,p.y); c.stroke(); }
    else if(p.kind==='ring'){ c.globalAlpha=(1-k)*(p.a||.9); c.lineWidth=Math.max(.5,(1-k)*p.size); c.beginPath(); c.ellipse(p.x,p.y,p.r0+k*p.rg,(p.r0+k*p.rg)*(p.sq||1),0,0,Math.PI*2); c.stroke(); }
    else if(p.kind==='flash'){ c.globalAlpha=(1-k)*.85; const r=p.r0+k*p.rg, gr=c.createRadialGradient(p.x,p.y,0,p.x,p.y,r); gr.addColorStop(0,p.col); gr.addColorStop(1,'rgba(255,255,255,0)'); c.fillStyle=gr; c.beginPath(); c.arc(p.x,p.y,r,0,Math.PI*2); c.fill(); }
    else if(p.kind==='puff'){ c.globalAlpha=(1-k)*.45; c.beginPath(); c.arc(p.x,p.y,p.size*(1+k*1.6),0,Math.PI*2); c.fill(); }
    else if(p.kind==='glow'){ const r=p.size*(1.2+.3*Math.sin(now/70+p.ph)), gr=c.createRadialGradient(p.x,p.y,0,p.x,p.y,r*3); gr.addColorStop(0,p.col); gr.addColorStop(.25,p.col); gr.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=gr; c.beginPath(); c.arc(p.x,p.y,r*3,0,Math.PI*2); c.fill(); }
    else if(p.kind==='drop'){ c.beginPath(); c.arc(p.x,p.y,p.size,0,Math.PI*2); c.fill(); }
    else { starPath(c,p.x,p.y,p.size,p.rot); c.fill(); } }
  c.globalAlpha=1;
  if(FX.P.length) requestAnimationFrame(fxFrame); else { FX.on=false; c.clearRect(0,0,W,H); }
}
// On-board effects. (x,y) is the cell centre on screen, s the cell size.
function splashFx(x,y,s){ const now=performance.now(), col=theme().miss, P=[];
  for(let i=0;i<3;i++) P.push({kind:'ring',x,y,vx:0,vy:0,g:0,dr:1,born:now+i*90,life:650,r0:s*.12,rg:s*.75,size:2.2,sq:.75,a:.8,col});
  for(let i=0;i<10;i++){ const a=-Math.PI/2+(Math.random()-.5)*1.6, sp=s*(.05+Math.random()*.06); P.push({kind:'drop',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:s*.012,dr:.98,born:now,life:520,size:Math.max(1.2,s*.05),col:i%3?col:'#ffffff'}); }
  fxAdd(P); }
function blastFx(x,y,s,big){ const now=performance.now(), Th=theme(), P=[];
  P.push({kind:'flash',x,y,vx:0,vy:0,g:0,dr:1,born:now,life:big?520:360,r0:s*.2,rg:s*(big?2.2:1.3),col:'rgba(255,214,140,1)'});
  const cols=['#ffd166','#ff9f43',Th.flag,'#ffffff'];
  for(let i=0;i<(big?34:20);i++){ const a=Math.random()*Math.PI*2, sp=s*(.05+Math.random()*.11); P.push({kind:'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-s*.02,g:s*.004,dr:.93,born:now,life:380+Math.random()*300,size:Math.max(1.3,s*.05),col:cols[i%4]}); }
  for(let i=0;i<(big?6:3);i++) P.push({kind:'puff',x:x+(Math.random()-.5)*s*.4,y:y+(Math.random()-.5)*s*.3,vx:(Math.random()-.5)*.3,vy:-.25-Math.random()*.3,g:0,dr:.99,born:now+80,life:900,size:s*.2,col:Th.dark?'#9aa3ad':'#6b7480'});
  fxAdd(P); }
function debrisFx(pts,s){ const now=performance.now(), Th=theme(), P=[];
  pts.forEach(([x,y],k)=>{ for(let i=0;i<8;i++){ const a=-Math.PI/2+(Math.random()-.5)*2.4, sp=s*(.04+Math.random()*.08);
    P.push({kind:'rect',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:s*.008,dr:.985,born:now+k*70,life:900+Math.random()*300,rot:Math.random()*3,vr:(Math.random()-.5)*.3,w:s*.13,h:s*.08,col:i%3?Th.hull:Th.deck}); }
    P.push({kind:'flash',x,y,vx:0,vy:0,g:0,dr:1,born:now+k*70,life:420,r0:s*.2,rg:s*1.2,col:'rgba(255,200,120,1)'}); });
  fxAdd(P); }
// Win effects
function flareFx(){ const W=innerWidth,H=innerHeight,now=performance.now(),P=[];
  for(let f=0;f<3;f++){ const x0=W*(.25+f*.25), t=now+f*260, col=['#ff5a4f','#ffffff','#ff5a4f'][f], peak=H*(.18+Math.random()*.1), vy=-(H-peak)/48;
    P.push({kind:'spark',x:x0,y:H+10,vx:(Math.random()-.5)*.6,vy,g:0,dr:1,born:t,life:800,size:3,tl:6,col:'#ffd8a8'});
    for(let i=0;i<14;i++) P.push({kind:'glow',x:x0+(Math.random()-.5)*16,y:peak+(Math.random()-.5)*10,vx:(Math.random()-.5)*.5,vy:.25+Math.random()*.3,g:.004,dr:1,born:t+800,life:2400,size:2+Math.random()*2,ph:i,col});
    setTimeout(()=>sfx('shot'),f*260); }
  fxAdd(P); }
function fireworksFx(){ const W=innerWidth,H=innerHeight,now=performance.now(),Th=theme(),cols=['#ffd166',Th.flag,'#7fd4ff','#ffffff',Th.accent],P=[];
  for(let b=0;b<6;b++){ const bx=W*(.15+Math.random()*.7), by=H*(.12+Math.random()*.3), t=now+b*260, col=cols[b%cols.length];
    for(let i=0;i<44;i++){ const a=i/44*Math.PI*2, sp=2.3+Math.random()*3;
      P.push({kind:'spark',x:bx,y:by,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:.06,dr:.965,born:t,life:1100+Math.random()*300,size:2.2,col:Math.random()<.2?'#ffffff':col});
      if(i%4===0) P.push({kind:'drop',x:bx,y:H-(by*.35),vx:Math.cos(a)*sp*.8,vy:Math.abs(Math.sin(a))*sp*.25,g:0,dr:.96,born:t+60,life:900,size:1.6,col}); } // reflections on the water
    setTimeout(()=>sfx('shot'),b*260); }
  fxAdd(P); }
function levelBurst(){ const W=innerWidth,now=performance.now(),cols=['#ffd166',theme().accent],P=[];
  for(let i=0;i<28;i++){ const a=-Math.PI*(.08+.84*Math.random()), sp=3+Math.random()*4; P.push({kind:'star',x:W/2,y:70,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*-.6+1,g:.14,dr:.98,born:now,life:1300,rot:0,vr:.1,size:4+Math.random()*4,col:cols[i%2]}); }
  fxAdd(P); }
function saluteFx(){ const W=innerWidth,H=innerHeight,now=performance.now(),P=[];
  for(let g=0;g<6;g++){ const left=g%2===0, x=left?W*.08:W*.92, y=H*(.55+.06*Math.floor(g/2)), t=now+g*260, dir=left?1:-1;
    P.push({kind:'flash',x,y,vx:0,vy:0,g:0,dr:1,born:t,life:380,r0:8,rg:60,col:'rgba(255,220,150,1)'});
    for(let i=0;i<5;i++) P.push({kind:'puff',x:x+dir*i*8,y:y-i*3,vx:dir*(1.2+Math.random()),vy:-.4-Math.random()*.4,g:0,dr:.985,born:t+30,life:1500,size:10+i*3,col:'#d9dde2'});
    setTimeout(()=>sfx('shot'),g*260); }
  for(let i=0;i<46;i++){ const a=-Math.PI*(.1+.8*Math.random()), sp=4+Math.random()*5; P.push({kind:'star',x:W/2,y:H*.62,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:.12,dr:.985,born:now+1700,life:1800,rot:0,vr:.08,size:4+Math.random()*4,col:i%3?'#f5c451':'#fff1b0'}); }
  fxAdd(P); }
const FXRUN={flare:flareFx,fireworks:fireworksFx,salute:saluteFx};
function winFx(){ const f=FXRUN[fxStyle()]; if(f&&motionOn()) f(); }
</script>
<script>
// ===================== DRAWING =====================
const UIFONT='Inter,system-ui,-apple-system,sans-serif';
function rrect(c,x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
// Water and grid for a sea of cols×rows cells at (x,y). shots: tried cells get the second water colour.

const GEO=new WeakMap();

  $('#statAll').innerHTML=row('Campaign stars',`${totalCampStars()} / ${CAMPS.length*30}`)+row('Hit rate',S.shots?pct(S.hits/S.shots):'—')+row('Enemy ships sunk',S.sinks)+row('Best win streak',S.bestStreak)+row('Daily Hunts played',S.huntPlayed)+row('Best Daily Hunt',S.huntBest?`${S.huntBest} shots`:'—'); }
let resetArm=0;
$('#reset').onclick=e=>{ const b=e.currentTarget; if(Date.now()-resetArm>3000){ resetArm=Date.now(); b.textContent='Tap again to erase all progress'; b.style.color='var(--accent)'; return; }
  const keep={}; for(const k of [...SHARED,'aiSpeed','showLast','confirmFire','name','seenVer']) keep[k]=S[k]; S=Object.assign(defSave(),keep); persist(); applyTheme(); b.textContent='Reset progress'; b.style.color=''; toast('Progress reset',true); renderAwards(); };

// ---------- sheets: how to play, what's new, privacy ----------
const CHANGES=[{v:'0.2.0',items:['Battle and Campaign are now big buttons on the home screen. Battle opens a menu where you pick the rules and your opponent.','Campaign: three campaigns of 10 levels each, Coastal Waters, Open Seas and Deep Waters, with twists that build up to the next AI.','New rules: seven sea shapes (Strait, Narrows, Open Ocean, Atoll, Cross, Archipelago and Classic), three fleet sizes, and a no-touching rule.','New unlocks for finishing each campaign: the Anchor hit marker, the Storm sea and the Salute win effect.']},{v:'0.1.0',items:['First demo: battles against Easy, Normal and Hard AI, the Daily Hunt, levels, achievements, and unlockable seas, markers and win effects.']}];
function openHowTo(){ sheet2(`<h2>How to play</h2><div class="sub">Sink the enemy fleet before it sinks yours.</div><ul class="news">
  <li>Each side hides five ships on a 10×10 sea: Carrier (5), Dreadnought (4), Cruiser (3), Submarine (3) and Destroyer (2).</li>
  <li>Ships are straight lines. They can touch, but never overlap.</li>
  <li>You fire first. Each side fires one shot per turn, hit or miss.</li>
  <li>A hit shows a flame and a miss shows rings on the water. When every part of a ship is hit, it sinks and its outline appears.</li>
  <li>The computer never sees your fleet. It only knows where its own shots landed, just like you.</li>
  <li><b>Stars:</b> win · reach the hit-rate target (classic rules: Easy 35%, Normal 45%, Hard 50%; higher on crowded seas) · lose no ships.</li>
  <li><b>Battle:</b> set the rules before you pick your opponent. Seas come in seven shapes, fleets in three sizes, and you can stop ships touching.</li>
  <li><b>No touching:</b> ships can't touch, even corner to corner. When a ship sinks, the water around it is marked clear for both sides.</li>
  <li><b>Campaign:</b> three campaigns of 10 levels. Levels add twists, and the last ones bring in the next AI.</li>
  <li><b>Daily Hunt:</b> everyone gets the same hidden fleet each day, and it doesn't shoot back. Sink it in 70, 55 or 45 shots for 1, 2 or 3 stars.</li></ul>
  <div class="btns" style="margin-top:12px"><button class="primary" data-close>Got it</button></div>`); }
function openNews(all){ const list=all?CHANGES:CHANGES.slice(0,1);
  sheet2(`<h2>What's new</h2><div class="sub">Ship Fight v${VERSION}</div>${list.map((c,i)=>`<div class="label" style="margin:${i?14:4}px 2px 6px">Version ${c.v}</div><ul class="news">${c.items.map(x=>`<li>${x}</li>`).join('')}</ul>`).join('')}
    <div class="btns" style="margin-top:12px"><button class="primary" data-close>Got it</button></div>`); }
function checkNews(){ if(S.seenVer===VERSION) return; const veteran=!!S.seenVer||S.xp>0; S.seenVer=VERSION; persist(); if(veteran) setTimeout(()=>openNews(false),600); }
function openPrivacy(){ sheet2(`<h2>Privacy</h2><div class="sub">Short version: Ship Fight collects nothing.</div><ul class="news">
  <li><b>No accounts, ads, analytics or trackers.</b> Nothing about you or how you play is sent anywhere.</li>
  <li><b>Your progress stays on this device.</b> It's kept in your browser's storage. Clearing site data removes it, so keep a backup.</li>
  <li><b>No network requests.</b> Only the game itself is loaded. A security policy blocks connections to any other site.</li>
  <li><b>Sharing.</b> A shared result contains only what's shown, and goes only where you send it.</li>
  <li><b>Open source.</b> Released under the MIT licence.</li></ul><div class="btns" style="margin-top:12px"><button class="primary" data-close>Close</button></div>`); }
// ---------- backup (SHIPFIGHT1Z. = gzip + base64, SHIPFIGHT1. where compression isn't available) ----------
const FRAMED=(()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })(); // downloads are blocked in embedded previews
const needsBackup=()=>{ if(ARCADE) return false; if(S.xp<50&&!S.wins) return false; const now=Date.now(), last=S.bk.last||0, nud=S.bk.nudged||0;
  return now-nud>7*DAY&&(!last||now-last>30*DAY); };
const markBackup=()=>{ S.bk=Object.assign({},S.bk,{last:Date.now()}); persist(); renderNudge(); };
function renderNudge(){ const el=$('#bkNudge'); if(!needsBackup()){ el.innerHTML=''; return; } const last=S.bk.last;
  el.innerHTML=`<div class="card nudge"><div class="ico">${ICON.save}</div><div class="grow"><div class="t">Back up your progress</div><div class="s">${last?`Last backup ${Math.floor((Date.now()-last)/DAY)} days ago.`:'You haven\'t made a backup yet.'} Your progress lives only on this device.</div>
    <div class="nb"><button class="primary sm" id="nbGo">Back up</button><button class="ghost sm" id="nbLater">Later</button></div></div></div>`;
  $('#nbGo').onclick=openBackup; $('#nbLater').onclick=()=>{ S.bk=Object.assign({},S.bk,{nudged:Date.now()}); persist(); renderNudge(); }; }
const fmtBytes=n=>n<1024?`${n} bytes`:`${(n/1024).toFixed(1)} KB`;
const b64e=u=>{ let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); };
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function packSave(){ const out=ARCADE?Object.assign({},S,OWN):S, bytes=new TextEncoder().encode(JSON.stringify({v:1,t:Date.now(),S:out}));
  if(window.CompressionStream){ try{ const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip')); return 'SHIPFIGHT1Z.'+b64e(new Uint8Array(await new Response(st).arrayBuffer())); }catch(e){} }
  return 'SHIPFIGHT1.'+b64e(bytes); }
async function unpackSave(code){ const m=code.replace(/\s+/g,'').match(/SHIPFIGHT1(Z?)\.([A-Za-z0-9+/=]+)/); if(!m) throw new Error('format'); let bytes=b64d(m[2]);
  if(m[1]){ const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')); bytes=new Uint8Array(await new Response(st).arrayBuffer()); }
  const o=JSON.parse(new TextDecoder().decode(bytes)); if(!o||!o.S||typeof o.S.xp!=='number') throw new Error('content'); return o; }
async function openBackup(){ const code=await packSave();
  sheet2(`<h2>${ARCADE?'Ship Fight backup':'Backup'}</h2><div class="sub">${ARCADE?'This code covers Ship Fight only. Arcade\'s own backup covers every game.':'Your progress is stored on this device only. Keep this code somewhere safe to restore it later or move it to another device.'}</div>
    <textarea class="code" id="bkOut" readonly>${code}</textarea>
    <div class="row-b" style="margin:10px 0 6px;${FRAMED?'grid-template-columns:1fr':''}"><button class="primary" id="bkCopy" style="margin:0">Copy code</button>${FRAMED?'':`<button class="ghost" id="bkFile">${ICON.save}Save to a file</button>`}</div>
    <div id="bkFileConfirm"></div>
    <div class="sub" style="font-size:12px;margin:0 0 16px">Covers XP, unlocks, stars, stats, settings and a battle in progress.</div>
    <div class="label" style="margin:0 2px 8px">Restore</div>
    <textarea class="code" id="bkIn" placeholder="Paste a backup code here"></textarea>
    <div class="btns" style="margin-top:8px"><button class="ghost" id="bkRestore">Restore from code</button><button class="ghost" id="bkLoad">Restore from a file</button><button class="ghost" data-close>Close</button></div>
    <input type="file" id="bkPick" accept=".txt,text/plain" hidden>`);
  $('#bkCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(code); toast('Backup code copied',true); }catch(e){ const t=$('#bkOut'); t.focus(); t.select(); toast('Code selected. Copy it from the box.',true); } markBackup(); };
  const bf=$('#bkFile'); if(bf) bf.onclick=()=>{ const blob=new Blob([code],{type:'text/plain'}), name=`shipfight-backup-${today()}.txt`;
    $('#bkFileConfirm').innerHTML=`<div class="unl filec">${ICON.save}<div style="flex:1;min-width:0"><b style="overflow-wrap:anywhere">${name}</b><br><span style="color:var(--sub)">File size: ${fmtBytes(blob.size)}</span>
      <div class="nb"><button class="primary sm" id="bkSaveYes">Save file</button><button class="ghost sm" id="bkSaveNo">Cancel</button></div></div></div>`;
    $('#bkSaveNo').onclick=()=>{ $('#bkFileConfirm').innerHTML=''; };
    $('#bkSaveYes').onclick=()=>{ const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000); $('#bkFileConfirm').innerHTML=''; markBackup(); toast(`Saved ${name}`,true); }; };
  $('#bkLoad').onclick=()=>$('#bkPick').click();
  $('#bkPick').onchange=async e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; if(f.size>2*1048576){ toast('That file is too big to be a Ship Fight backup.',true); return; }
    $('#bkIn').value=(await f.text()).trim(); e.target.value=''; $('#bkRestore').click(); };
  let arm=0;
  $('#bkRestore').onclick=async e=>{ const b=e.currentTarget, v=$('#bkIn').value; if(!v.trim()){ toast('Paste a backup code first',true); return; }
    let o; try{ o=await unpackSave(v); }catch(err){ toast('That code doesn\'t look right. Check it was copied in full.',true); return; }
    if(Date.now()-arm>3000){ arm=Date.now(); b.textContent=T(`Tap again to replace this device's progress with the level ${levelOf(o.S.xp)} backup`); b.classList.add('warn'); return; }
    S=Object.assign(defSave(),o.S); S.stats=Object.assign(defSave().stats,S.stats); for(const k of SHARED) OWN[k]=S[k]; if(ARCADE) applyArcade(S,store);
    S.bk=Object.assign({},S.bk,{last:Date.now()}); persist(); hideOv2(); applyTheme(); show('home'); toast('Progress restored',true); }; }

// ---------- back button and leaving ----------
function repush(){ try{ history.pushState({sf:1},''); }catch(e){} }
repush();
addEventListener('popstate',()=>{
  if(!$('#ov2').classList.contains('hidden')){ hideOv2(); repush(); return; }
  if(cur!=='home'){ show('home'); repush(); return; }
  if(ARCADE){ leaveToArcade(); return; }
  try{ history.back(); }catch(e){} });
addEventListener('pageshow',e=>{ if(e.persisted&&ARCADE){ applyArcade(S,store); applyTheme(); setLang(); if(cur==='home') renderHome(); } });
if(darkMQ){ const f=()=>{ if(S.appearance==='system') applyTheme(); }; darkMQ.addEventListener?darkMQ.addEventListener('change',f):darkMQ.addListener(f); }
addEventListener('resize',()=>{ if(cur==='game') resize(); if(cur==='place') presize(); });

// ---------- start ----------
$('#pauseBtn').innerHTML=ICON.pause; $('#back').innerHTML=ICON.back; $('#placeBack').innerHTML=ICON.back; $('#toArcade').innerHTML=ICON.back+'<span>Arcade</span>';
$('#homeStyle').innerHTML=ICON.palette; $('#homeSet').innerHTML=ICON.gear; $('#icoT').innerHTML=ICON.palette; $('#icoA').innerHTML=ICON.trophy;
$$('.topbar [data-go]').forEach(b=>b.innerHTML=ICON.back);
startI18n(); applyTheme(); show('home'); checkNews(); if(ARCADE) writeSummary();
if(document.fonts) document.fonts.ready.then(()=>{ if(cur==='game') render(); if(cur==='place') prender(); });
</script>
<script>addEventListener('load',()=>{ if(location.hash==='#game-settings'){ try{ history.replaceState(history.state,'',location.pathname+location.search); }catch(e){} const b=document.getElementById('homeSet'); if(b) b.click(); } });</script>
<script>
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('../sw.js',{scope:'../'}).then(reg=>{
  const c=navigator.serviceWorker.controller; if(c&&navigator.onLine) c.postMessage('arcade-repair');
  // Installed apps can stay open for days: re-check for updates when brought back, at most every 30 min.
  let last=Date.now(); document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&Date.now()-last>18e5){ last=Date.now(); reg.update().catch(()=>{}); } });
}).catch(()=>{}));
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
</script>
