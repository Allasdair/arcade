<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3f2ef" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<title>Mahjong</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="../fonts.css">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arcade">
<script src="../avatars.js"></script>

<script>window.__ARCADE__=1</script>
<style>
:root{--bg:#f3f2ef;--panel:#fff;--ink:#1c1c1e;--sub:#8a8a90;--accent:#2d3a36;--accentInk:#fff;--line:rgba(0,0,0,.08);--gold:#e8a913;--good:#2f9e6a;--bad:#d9534f;--lf:Inter}
.dark{--bg:#101114;--panel:#1b1c20;--ink:#f2f2f4;--sub:#8d8e96;--accent:#e9eaee;--accentInk:#15161a;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
input[type=text]{width:100%;font:15px Inter,sans-serif;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
textarea{width:100%;font:12px/1.4 'JetBrains Mono',monospace;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:none;-webkit-user-select:text;user-select:text}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;flex:1;padding:16px 16px 36px;max-width:560px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h2{font-size:24px;font-weight:800;letter-spacing:-.03em;flex:1;min-width:0}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 0 16px}
.brand h1{font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1}
.brand p{color:var(--sub);font-size:14px;margin-top:8px;line-height:1.35}
.acts{display:flex;gap:8px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.backbtn{height:36px;padding:0 12px 0 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-bottom:6px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:22px 4px 10px;display:flex;justify-content:space-between;gap:8px}
.label span{letter-spacing:.02em;text-transform:none;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 15px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:10px;transition:transform .12s;min-width:0}
button.card:active{transform:scale(.98)}
.card .t{font-weight:700;font-size:17px;letter-spacing:-.01em;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.row2 .card .t{font-size:15.5px}
.card .s{color:var(--sub);font-size:13px;margin-top:2px;line-height:1.3;overflow-wrap:anywhere}
.card .grow{flex:1;min-width:0}
.card .r{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex:none;max-width:42%}
.card .r b{display:block;font-size:15px}
.card .r span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.card.dim{opacity:.55}
.ico{width:42px;height:42px;border-radius:12px;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.ico svg{width:26px;height:26px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .card{margin:0}
.lvl .badge{width:50px;height:50px;border-radius:15px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.primary{background:var(--accent);color:var(--accentInk);border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;width:100%;transition:transform .12s}
.primary:active{transform:scale(.98)}
.ghost{background:var(--bg);border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;width:100%}
.danger{color:var(--bad)}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns>*{flex:1 1 0;min-width:0}
.seg{display:flex;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;padding:9px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);min-width:0}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.dark .seg button.on{background:#2a2b31}
.opt{margin:12px 0}
.opt>.h{font-size:12px;font-weight:700;color:var(--sub);margin:0 2px 6px;display:flex;justify-content:space-between;gap:8px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;width:100%;font-weight:600;font-size:15px;text-align:left}
.srow .d{font-size:12.5px;color:var(--sub);font-weight:500;margin-top:2px}
.srow>div{min-width:0}
.sw{width:46px;height:28px;border-radius:99px;background:var(--bg);position:relative;transition:background .2s;flex:none;border:1px solid var(--line)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--sub);transition:left .2s,background .2s}
.sw.on{background:var(--accent)}.sw.on::after{left:21px;background:var(--accentInk)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 14px;margin-bottom:10px}
.box .srow+.srow{border-top:1px solid var(--line)}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px;white-space:nowrap}
.stars .o{color:var(--sub);opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;max-width:100%;min-width:0;overflow-wrap:anywhere}
.chip.on{background:var(--accent);color:var(--accentInk);border-color:transparent}
.topseg{background:var(--panel);border:1px solid var(--line);margin:0 0 14px;flex-wrap:nowrap}
.topseg button{font-size:12px;padding:9px 3px;flex:1 1 auto;white-space:nowrap;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis}
.topseg button.on{background:var(--accent);color:var(--accentInk)}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px;text-align:left;position:relative;transition:transform .12s;min-width:0}
.tcard:active{transform:scale(.98)}
.tcard .pv{aspect-ratio:7/4;border-radius:12px;display:grid;place-items:center;overflow:hidden;position:relative}
.tcard .n{font-weight:700;font-size:14px;margin:9px 5px 2px}
.tcard .q{font-size:11.5px;color:var(--sub);margin:0 5px 5px;line-height:1.3;min-height:2.6em}
.tcard.sel{box-shadow:0 0 0 2.5px var(--accent)}
.tcard.locked .pv{filter:grayscale(.9);opacity:.45}
.tcard .pv svg.i{width:38px;height:38px;stroke-width:1.6;color:var(--accent)}
.tcard.playing .pv{opacity:.4}
.lock{position:absolute;top:13px;right:13px;width:28px;height:28px;border-radius:9px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.lock svg.i{width:15px;height:15px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 2px;border-radius:10px;font-weight:700;font-size:13px;color:var(--sub);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--accentInk)}
.lvcard .num{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.lvcard.fin .num{background:var(--accent);color:var(--accentInk)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
.tbl th{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700;border:0}
.tbl td:first-child,.tbl th:first-child{text-align:left;font-weight:600}
.ach{display:flex;gap:12px;align-items:center;padding:10px 2px}
.ach+.ach{border-top:1px solid var(--line)}
.ach .m{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none;font-size:15px;font-weight:800}
.ach.done .m{background:var(--gold);color:#3a2a00}
.ach .n{font-weight:700;font-size:14.5px}.ach .d{color:var(--sub);font-size:12.5px;margin-top:1px}
.ach>div:last-child{min-width:0}
/* sheets */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:0 0 env(safe-area-inset-bottom)}
#ov.on{display:flex}
#sheet{background:var(--panel);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px 20px;max-height:92vh;overflow-y:auto;overflow-x:hidden;animation:up .22s ease-out}
@media (min-height:700px) and (min-width:600px){ #ov{align-items:center} #sheet{border-radius:24px} }
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
#sheet .sub{color:var(--sub);font-size:14px;line-height:1.4;margin-bottom:12px}
.goal{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px;font-weight:600}
.goal .st{font-size:18px;color:var(--sub);opacity:.4;width:22px;text-align:center;flex:none}
.goal.got .st{color:var(--gold);opacity:1}
.goal.new .st{animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--bg);border-radius:12px;padding:9px 6px;text-align:center;min-width:0;overflow-wrap:anywhere}
.kv b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.kv span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.howto p{font-size:14px;line-height:1.5;margin:6px 0}
.howto h3{font-size:15px;margin:14px 0 4px}
#toast{position:fixed;left:50%;top:0;transform:translate(-50%,calc(-100% - env(safe-area-inset-top) - 20px));opacity:0;background:var(--accent);color:var(--accentInk);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:40;transition:transform .35s,opacity .35s;max-width:calc(100vw - 24px);text-align:center;pointer-events:none;margin-top:calc(env(safe-area-inset-top) + 10px)}
#toast.on{transform:translate(-50%,0);opacity:1}
#fxc{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
/* ===== game ===== */
#game{align-items:center}
.gcol{width:100%;max-width:640px;height:100%;display:flex;flex-direction:column;padding:6px 8px 8px;gap:6px}
.gbar{display:flex;align-items:stretch;gap:6px;flex:none}
.gbar .mid{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px 10px;display:flex;flex-direction:column;justify-content:center}
.gbar .mid .tg{font-size:11.5px;font-weight:700;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar .mid .nums{display:flex;gap:12px;align-items:baseline;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.gbar .mid .nums b{font-size:19px;font-weight:800}
.gbar .mid .nums span{font-size:11px;color:var(--sub);font-weight:700}
.gbar .mid .nums .warn{color:var(--bad)}
.gbar .sc{flex:none;min-width:64px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.gbar .sc b{font-size:17px}.gbar .sc span{font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.gbar .sc .cb{color:var(--gold);font-size:11px;font-weight:800;min-height:13px}
.menubtn{width:46px;flex:none;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
#bview{position:relative;overflow:hidden;flex:1;min-height:120px;border-radius:16px;touch-action:none;background:var(--tbl)}
#bview svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#bview .stars-bg{position:absolute;inset:0;pointer-events:none;background:var(--tblx,none)}
.t .in{transition:transform .12s;transform-box:fill-box;transform-origin:center}
.t.sel .in{transform:translate(-3px,-5px)}
.t .glow{display:none}
.t.sel .glow,.t.hint .glow,.t.mt .glow{display:block}
.t.hint .glow{stroke:var(--gold);animation:breathe 1.2s ease-in-out infinite}
.t.mt .glow{stroke:#3fbf7f}
@keyframes breathe{50%{opacity:.35}}
.t.shake .in{animation:shake .28s}
@keyframes shake{20%{transform:translate(-3px,0)}40%{transform:translate(3px,0)}60%{transform:translate(-2px,0)}80%{transform:translate(2px,0)}}
.t.out .in{animation:out var(--outd,.22s) ease-in forwards}
@keyframes out{to{opacity:0;transform:translate(-6px,-14px) scale(.9)}}
.t.flip .in{animation:flip .3s ease-out}
@keyframes flip{0%{transform:scaleX(.1)}100%{transform:none}}
.t.swirl .in{animation:swirl .5s ease-out}
@keyframes swirl{0%{opacity:.2;transform:rotate(8deg) scale(.9)}100%{opacity:1;transform:none}}
.gtools{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gtools.lefty{direction:rtl}.gtools.lefty>*{direction:ltr}
.gtools button{height:50px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sub);min-width:0;gap:1px;position:relative}
.gtools button svg.i{width:20px;height:20px;color:var(--ink)}
.gtools .cnt{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accentInk);font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg);font-style:normal}
.gtools button.dim{opacity:.5}
.gtools span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.banner{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner b{flex:1 1 170px;min-width:0}
.banner button{background:var(--accent);color:var(--accentInk);border-radius:10px;padding:8px 11px;font-weight:700;font-size:13px}
.banner button.g{background:var(--bg);color:var(--ink)}
.finding{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:14px;margin:10px 0}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
.lylist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lylist button{background:var(--bg);border-radius:12px;padding:6px 4px 7px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;border:2px solid transparent}
.lylist button.on{border-color:var(--accent)}
.lylist button.lk{opacity:.45}
.lylist svg{width:100%;height:46px}
.lylist span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:inline-flex;gap:3px}
.mini svg{width:26px;height:35px}
.weekrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0}
.weekrow div{background:var(--bg);border-radius:9px;text-align:center;padding:6px 0;font-size:11px;font-weight:700;color:var(--sub)}
.weekrow div.on{background:var(--gold);color:#3a2a00}
</style>
</head>
<body>
<div id="toast"></div>
<canvas id="fxc"></canvas>

<!-- HOME -->
<section class="screen on" id="home"><div class="scroll">
  <button class="backbtn" id="arcadeBtn" hidden><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Arcade</button>
  <div class="brand"><div><h1 data-raw>Mahjong</h1><p>Match pairs, clear the stack. Every board can be won.</p></div>
    <div class="acts"><button class="iconbtn" id="styleBtn" aria-label="Style"><svg class="i" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 000 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A5.6 5.6 0 0022 9.8C22 5.5 17.5 2 12 2z"/></svg></button>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button></div></div>
  <div id="homeBody"></div>
</div></section>

<section class="screen" id="camp"><div class="scroll" id="campBody"></div></section>
<section class="screen" id="progress"><div class="scroll" id="progBody"></div></section>
<section class="screen" id="style"><div class="scroll"><div class="top"><button class="iconbtn" data-home aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><h2>Style</h2><span class="stars" style="color:var(--sub);font-weight:700" id="sCount"></span></div><div class="seg topseg" id="styleTabs"></div><div id="styleBody"></div></div></section>
<section class="screen" id="set"><div class="scroll" id="setBody"></div></section>

<!-- GAME -->
<section class="screen" id="game"><div class="gcol" id="gcol">

function loadSave(raw,reduced){ const d=defSave(reduced); let s=null; try{ s=raw?JSON.parse(raw):null; }catch(e){ s=null; }
  if(!s||typeof s!=='object') return d;
  for(const k in d){ if(s[k]===undefined) continue;
    if(NESTED.includes(k)&&s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])) d[k]=Object.assign(d[k],s[k]); else d[k]=s[k]; }
  if(!d.rec.wins||typeof d.rec.wins!=='object') d.rec.wins={easy:0,normal:0,hard:0,expert:0};
  return d; }

function refreshHints(S,today){ if(S.hintDate!==today){ S.hints=Math.max(S.hints||0,HINT_CAP); S.hintDate=today; } return S.hints; }
function useHint(S){ if(S.hints<=0) return false; S.hints--; return true; }

  const second=st.ta?st.ta.left>=30000:(par?st.t<=par*1000:false); return [1,second?1:0,assisted(st)?0:1]; }

const achProg=(S,a)=>{ if(a.id[0]==='c'&&a.n) return S.rec.cleared; if(a.id[0]==='d'&&a.n) return S.dcount; if(a.id[0]==='s'&&a.n) return S.d3; if(a.id==='quads') return S.rec.quads; return null; };
// ctx: {mode, st, diff, stars:[a,b,c], practice}
function checkAch(S,ctx){ const got=[], give=id=>{ if(!S.ach[id]){ S.ach[id]=Date.now(); got.push(id); } };
  if(ctx.practice) return got;
  const st=ctx.st;
  if(st){ if(st.bestCombo>=4) give('combo');
    if(st.won){ const d=ctx.diff, s=ctx.stars||[1,0,0];
      give('clr_'+d); if(!st.ta&&s[1]) give('par_'+d); if(s[2]) give('pure_'+d);
      if(st.cfg.fog) give('fog'); if(st.ta) give('clock'); if(d==='hard'&&st.cfg.shuffles===0&&ctx.mode==='classic') give('purist'); } }
  for(const a of ACH) if(a.n){ const p=achProg(S,a); if(p!=null&&p>=a.n) give(a.id); }
  if(S.dstreak.cur>=7) give('dstreak'); if(S.week.every(x=>x)) give('fullweek');
  if(typeof CAMPS!=='undefined'){ CAMPS.forEach((c,i)=>{ if(campDone(S,i)) give('camp'+(i+1)); if(LEVELS.filter(L=>L.camp===i).every(L=>campStars(S,L.id)>=3)) give('perf'+(i+1)); });
    if(LEVELS.filter(L=>L.type==='puzzle').every(L=>campStars(S,L.id)>=3)) give('puzzle'); }
  return got; }

// ---------- XP ----------
function addXP(S,n){ const before=levelOf(S.xp); S.xp+=Math.max(0,Math.round(n)); const after=levelOf(S.xp), rewards=[];
  for(let l=before+1;l<=after;l++) rewards.push(...rewardsAt(l));
  const ups=after-before; if(ups>0) S.hints=Math.min(HINT_MAX,(S.hints||0)+ups); // +1 hint per level-up
  return {xp:Math.round(n),before,after,rewards,hints:ups}; }
const xpNext=S=>{ const l=levelOf(S.xp); return l>=MAXL?null:LVXP[l]; };
const WIN_XP={easy:10,normal:15,hard:22,expert:30};
function classicXP(st){ if(!st.won) return 0; let x=WIN_XP[st.cfg.diff]; if(st.cfg.shuffles===0) x+=5; if(st.cfg.fog) x+=5; if(st.cfg.ta) x+=5;
  return assisted(st)?Math.round(x/2):x; }

// ---------- records (Classic) ----------
// wins per difficulty, best time and best score per layout, the win streak; Time Attack keeps most time left
function addRecords(S,st){ const R=S.rec, fresh=[]; R.played++;
  if(!st.won){ R.lost++; R.streak.cur=0; return fresh; }
  R.wins[st.cfg.diff]=(R.wins[st.cfg.diff]||0)+1; R.streak.cur++; R.streak.best=Math.max(R.streak.best,R.streak.cur);
  const k=st.cfg.lid+'|'+st.cfg.diff, b=R.best[k]||{t:0,s:0};
  if(!st.ta&&!assisted(st)&&(!b.t||st.t<b.t)){ b.t=st.t; fresh.push('Best time'); }
  if(st.score>b.s){ b.s=st.score; fresh.push('Best score'); } R.best[k]=b;
  if(st.score>R.scoreBest){ R.scoreBest=st.score; }
  if(st.ta&&st.ta.left>R.taBest){ R.taBest=st.ta.left; fresh.push('Most time left'); }
  return fresh; }
// every clear (Classic, campaign, the scored Daily) counts toward the cumulative achievements
function addClear(S,st){ if(st.won) S.rec.cleared++; S.rec.bestCombo=Math.max(S.rec.bestCombo,st.bestCombo); S.rec.quads+=st.quads||0; }

// ---------- campaign ----------
const levelById=id=>LEVELS.find(L=>L.id===id);
const campOf=(S,id)=>S.camp[id]||{s:[0,0,0],best:0,tries:0};
const campStars=(S,id)=>campOf(S,id).s.reduce((a,b)=>a+b,0);
const totalStars=S=>typeof LEVELS==='undefined'?0:LEVELS.reduce((a,L)=>a+campStars(S,L.id),0);
const campCleared=(S,id)=>!!campOf(S,id).s[0];
const campDone=(S,c)=>campCleared(S,LEVELS.find(L=>L.camp===c&&L.n===15).id);
const campOpen=(S,c)=>c===0||campDone(S,c-1);
// clearing a level unlocks the next; clearing level 15 unlocks the next campaign
const unlocked=(S,Lv)=>campOpen(S,Lv.camp)&&(Lv.n===1||campCleared(S,LEVELS.find(L=>L.camp===Lv.camp&&L.n===Lv.n-1).id));
function levelCfg(Lv){ const gone=Lv.gone?unbits(Lv.gone,layoutById(Lv.lid).n):null;
  return {lid:Lv.lid,diff:Lv.diff,seed:Lv.seed,trap:Lv.trap,shuffles:Lv.shuffles,undo:Lv.undo,ta:!!Lv.ta,fog:!!Lv.fog,gone,par:Lv.par}; }
function unbits(s,n){ const o=new Array(n).fill(0); for(let i=0;i<n;i++){ const v=B64.indexOf(s[(i/6)|0]); if(v>>(i%6)&1) o[i]=1; } return o; }
function campaignResult(S,Lv,stars){ const c=campOf(S,Lv.id), fresh=[], C=CAMPS[Lv.camp]; let xp=0; const wasDone=campDone(S,Lv.camp);
  if(stars[0]) stars.forEach((e,i)=>{ if(e&&!c.s[i]){ c.s[i]=1; fresh.push(i); xp+=C.xp; } });
  c.tries=(c.tries||0)+1; S.camp[Lv.id]=c;
  const finished=!wasDone&&campDone(S,Lv.camp); if(finished) xp+=C.bonus;
  return {fresh,stars:campStars(S,Lv.id),xp,finished}; }

// ---------- Daily ----------
// MJD1|YYYY-MM-DD picks a board from the graded list for the weekday's difficulty: the same board for everyone.
const dayNum=date=>{ const [y,m,d]=date.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); };
const weekdayOf=date=>(new Date(dayNum(date)*864e5).getUTCDay()+6)%7; // Monday 0 … Sunday 6
function dailyBoard(date){ const [diff,grade]=DAILY_DAYS[weekdayOf(date)], list=DAILY_LISTS[diff+'|'+grade];
  const r=seedRng('MJD1|'+date), e=list[Math.floor(r()*list.length)], L=LAYOUTS[e[0]];
  return {lid:L.id,diff,grade,seed:`MJD|${diff}|${grade}|${e[1]}`,trap:e[2]/100,par:parTime(L,grade),shuffles:'inf',undo:true,ta:false,fog:false}; }
function dailyFor(S,date){ if(S.daily.date!==date) S.daily={date,scored:false,stars:0,time:0,assisted:false,run:null}; return S.daily; }
function dailyResult(S,date,st,today){ const d=dailyFor(S,date); if(d.scored) return null; const cfg=dailyBoard(date), stars=winStars(st,cfg.par), n=starCount(stars);
  d.scored=true; d.run=null; d.stars=n; d.time=st.t; d.assisted=assisted(st); d.won=st.won;
  S.dhist[date]={won:st.won,stars:n,time:st.t,assisted:d.assisted}; const keys=Object.keys(S.dhist).sort(); while(keys.length>7) delete S.dhist[keys.shift()]; // the last 7 Dailies
  let xp=0;
  if(st.won){ S.dcount++; if(n===3){ S.d3++; S.week[weekdayOf(date)]=1; } xp=20*(date===today?2:1);
    const nn=dayNum(date), last=S.dstreak.last?dayNum(S.dstreak.last):-99;
    if(nn!==last){ S.dstreak.cur=nn===last+1?S.dstreak.cur+1:1; S.dstreak.last=date; S.dstreak.best=Math.max(S.dstreak.best,S.dstreak.cur); } }
  return {stars,xp}; }
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const fmtTime=ms=>{ const s=Math.max(0,Math.round(ms/1000)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
function shareLine(date,won,time,stars,assist){ const [,m,dd]=date.split('-').map(Number);
  return `Mahjong Daily · ${DOW[weekdayOf(date)]} ${dd} ${MON[m-1]} · ${won?fmtTime(time):'not cleared'} · ${'★'.repeat(stars)}${'☆'.repeat(3-stars)}${assist?' (assisted)':''}`; }

// ---------- backup (Mahjong only) ----------
// MAHJONG1Z.<base64 gzip> where the app can compress, MAHJONG1.<base64> otherwise. Both decode here (the app inflates Z).
const b64e=str=>{ const u=new TextEncoder().encode(str); let b=''; for(let i=0;i<u.length;i++) b+=String.fromCharCode(u[i]); return btoa(b); };
const b64d=b=>new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)));
function backupPlain(S){ return 'MAHJONG1.'+b64e(JSON.stringify(S)); }
function parseBackup(text){ const m=/MAHJONG1\.([A-Za-z0-9+/=]+)/.exec(String(text||'')); if(!m) return null;
  try{ const o=JSON.parse(b64d(m[1])); if(!o||typeof o!=='object'||typeof o.xp!=='number') return null; return o; }catch(e){ return null; } }

// ---------- Arcade contract ----------
// Shared settings live in arcade.v1 (read only, never written). They're applied in memory only.
function readArcade(store){ try{ const a=JSON.parse(store.get(ARCADE_KEY)||'null'); if(!a||typeof a!=='object') return null; return a; }catch(e){ return null; } }
function applyShared(S,a){ if(!a) return S; const o=Object.assign({},S), set=a.set||{}; for(const k of SHARED) if(set[k]!==undefined) o[k]=set[k]; if(typeof a.name==='string'&&a.name) o.name=a.name; return o; }
function summary(S){ const l=levelOf(S.xp);
  return {v:1,game:GAME_ID,ver:VERSION,level:l,maxLevel:MAXL,xp:S.xp,xpLevel:l,xpNext:xpNext(S),
    ach:ACH.map(a=>[a.name,a.desc,!!S.ach[a.id]]),
    hi:[['Boards cleared',String(S.rec.cleared)],['Campaign stars',`${totalStars(S)}/${LEVELS.length*3}`],['Daily streak',String(S.dstreak.cur)]],
    last:Date.now()}; }

["Mahjong {0}. No ads, no accounts. Nothing leaves your device.", "Mahjong {0}. Sin anuncios ni cuentas. Nada sale de tu dispositivo.", "Mahjong {0}. Ni pub ni compte. Rien ne quitte votre appareil.", "Mahjong {0}. Keine Werbung, keine Konten. Nichts verlässt dein Gerät.", "Mahjong {0}. Sem anúncios, sem contas. Nada sai do seu aparelho."],
["Mahjong restarts in the chosen language. Your progress is kept.", "Mahjong se reinicia en el idioma elegido. Tu progreso se conserva.", "Mahjong redémarre dans la langue choisie. Votre progression est conservée.", "Mahjong startet in der gewählten Sprache neu. Dein Fortschritt bleibt.", "O Mahjong reinicia no idioma escolhido. Seu progresso é mantido."],
["Translations are machine-assisted. If something reads oddly, tell the developer.", "Las traducciones son asistidas por máquina. Si algo suena raro, avisa al desarrollador.", "Les traductions sont assistées par machine. Si quelque chose sonne faux, prévenez le développeur.", "Die Übersetzungen sind maschinell unterstützt. Klingt etwas seltsam, sag dem Entwickler Bescheid.", "As traduções são assistidas por máquina. Se algo soar estranho, avise o desenvolvedor."],
["This code holds your Mahjong progress: XP, stars, records, achievements, settings and games in progress. Keep it somewhere safe.", "Este código guarda tu progreso de Mahjong: XP, estrellas, récords, logros, ajustes y partidas en curso. Guárdalo en un lugar seguro.", "Ce code contient votre progression Mahjong : XP, étoiles, records, succès, réglages et parties en cours. Gardez-le en lieu sûr.", "Dieser Code enthält deinen Mahjong-Fortschritt: XP, Sterne, Rekorde, Erfolge, Einstellungen und laufende Spiele. Bewahre ihn sicher auf.", "Este código guarda seu progresso no Mahjong: XP, estrelas, recordes, conquistas, configurações e jogos em andamento. Guarde em local seguro."],

["Replace my progress (level {0})", "Reemplazar mi progreso (nivel {0})", "Remplacer ma progression (niveau {0})", "Meinen Fortschritt ersetzen (Level {0})", "Substituir meu progresso (nível {0})"],
["Progress restored", "Progreso restaurado", "Progression restaurée", "Fortschritt wiederhergestellt", "Progresso restaurado"],
["Clear the board by removing matching pairs. Tap a free tile, then a free tile that matches it.", "Despeja el tablero quitando parejas iguales. Toca una ficha libre y luego otra ficha libre que haga pareja.", "Videz le plateau en retirant des paires. Touchez une tuile libre, puis une tuile libre identique.", "Räume das Brett ab, indem du passende Paare entfernst. Tippe auf einen freien Stein, dann auf einen passenden freien Stein.", "Limpe o tabuleiro removendo pares iguais. Toque numa peça livre e depois numa peça livre igual."],
["Free tiles", "Fichas libres", "Tuiles libres", "Freie Steine", "Peças livres"],
["A tile is free when nothing lies on top of it and its left or its right side is open. Blocked tiles are dimmed (Settings: Highlight free tiles). Tapping a blocked tile gives it a little shake.", "Una ficha está libre cuando no tiene nada encima y su lado izquierdo o derecho está despejado. Las fichas bloqueadas se atenúan (Ajustes: Resaltar fichas libres). Si tocas una bloqueada, tiembla un poco.", "Une tuile est libre quand rien ne la recouvre et que son côté gauche ou droit est dégagé. Les tuiles bloquées sont assombries (Réglages : Mettre en valeur les tuiles libres). Toucher une tuile bloquée la fait trembler.", "Ein Stein ist frei, wenn nichts auf ihm liegt und seine linke oder rechte Seite offen ist. Blockierte Steine werden abgedunkelt (Einstellungen: Freie Steine hervorheben). Ein blockierter Stein wackelt beim Antippen.", "Uma peça está livre quando nada está sobre ela e o lado esquerdo ou direito está aberto. Peças bloqueadas ficam escurecidas (Configurações: Destacar peças livres). Tocar numa bloqueada a faz tremer."],
["Matching", "Parejas", "Paires", "Paare", "Pares"],
["Tiles match when they are identical. Any Flower matches any Flower, and any Season matches any Season.", "Las fichas hacen pareja si son idénticas. Cualquier Flor empareja con cualquier Flor, y cualquier Estación con cualquier Estación.", "Les tuiles s'associent si elles sont identiques. N'importe quelle Fleur va avec n'importe quelle Fleur, et n'importe quelle Saison avec n'importe quelle Saison.", "Steine passen zusammen, wenn sie gleich sind. Jede Blume passt zu jeder Blume, jede Jahreszeit zu jeder Jahreszeit.", "As peças combinam quando são idênticas. Qualquer Flor combina com qualquer Flor, e qualquer Estação com qualquer Estação."],
["Dots, Bamboo and Characters run 1 to 9:", "Círculos, Bambúes y Caracteres van del 1 al 9:", "Ronds, Bambous et Caractères vont de 1 à 9 :", "Kreise, Bambus und Zeichen gehen von 1 bis 9:", "Círculos, Bambus e Caracteres vão de 1 a 9:"],
["Winds (East, South, West, North) and Dragons (red, green, white). Flowers and Seasons:", "Vientos (Este, Sur, Oeste, Norte) y Dragones (rojo, verde, blanco). Flores y Estaciones:", "Vents (Est, Sud, Ouest, Nord) et Dragons (rouge, vert, blanc). Fleurs et Saisons :", "Winde (Ost, Süd, West, Nord) und Drachen (rot, grün, weiß). Blumen und Jahreszeiten:", "Ventos (Leste, Sul, Oeste, Norte) e Dragões (vermelho, verde, branco). Flores e Estações:"],
["Every board can be won", "Todos los tableros se pueden ganar", "Chaque plateau peut être gagné", "Jedes Brett ist lösbar", "Todo tabuleiro pode ser vencido"],
["Boards are built backwards from a winning order, so there is always a way through. Choices still matter: matching the wrong two of a kind can bury the other two. If no pairs are left, Undo or Shuffle. Shuffle rearranges the remaining tiles so the board can still be won.", "Los tableros se construyen al revés desde un orden ganador, así que siempre hay salida. Aun así, las decisiones importan: emparejar las dos equivocadas puede enterrar las otras dos. Si no quedan parejas, deshaz o baraja. Barajar recoloca las fichas restantes para que el tablero siga siendo ganable.", "Les plateaux sont construits à rebours depuis un ordre gagnant : il y a toujours une issue. Les choix comptent : associer les deux mauvaises peut enterrer les deux autres. S'il ne reste aucune paire, annulez ou mélangez. Le mélange réarrange les tuiles restantes pour que le plateau reste gagnable.", "Bretter werden rückwärts aus einer Gewinnreihenfolge gebaut, also gibt es immer einen Weg. Entscheidungen zählen trotzdem: Wer die falschen zwei paart, kann die anderen zwei verschütten. Gibt es keine Paare mehr: Zurück oder Mischen. Mischen ordnet die übrigen Steine so neu, dass das Brett lösbar bleibt.", "Os tabuleiros são montados de trás para frente a partir de uma ordem vencedora, então sempre há saída. As escolhas importam: combinar as duas erradas pode enterrar as outras duas. Sem pares, desfaça ou embaralhe. Embaralhar reorganiza as peças restantes para o tabuleiro continuar vencível."],
["Helpers", "Ayudas", "Aides", "Hilfen", "Ajudas"],
["Hints show a pair that keeps the board winnable. You get {0} a day, plus 1 for every level-up. The \"still winnable?\" warning tells you when a pair has left no way to win without a shuffle. A hint, an undo, a shuffle or Show matches makes a game assisted: it can't earn the third star.", "Las pistas muestran una pareja que mantiene el tablero ganable. Tienes {0} al día, más 1 por cada subida de nivel. El aviso \"¿Aún se puede ganar?\" te dice cuándo una pareja ha dejado el tablero sin solución sin barajar. Una pista, deshacer, barajar o Mostrar parejas hacen que la partida sea asistida: no puede ganar la tercera estrella.", "Les indices montrent une paire qui garde le plateau gagnable. Vous en avez {0} par jour, plus 1 par niveau gagné. L'alerte « Encore gagnable ? » prévient quand une paire rend la victoire impossible sans mélange. Un indice, une annulation, un mélange ou Montrer les paires rendent la partie assistée : pas de troisième étoile.", "Tipps zeigen ein Paar, mit dem das Brett lösbar bleibt. Du bekommst {0} pro Tag, plus 1 je Levelaufstieg. Die Warnung „Noch lösbar?“ sagt dir, wenn ein Paar das Brett ohne Mischen unlösbar gemacht hat. Ein Tipp, Zurück, Mischen oder Paare zeigen machen ein Spiel unterstützt: Es gibt keinen dritten Stern.", "As dicas mostram um par que mantém o tabuleiro vencível. Você ganha {0} por dia, mais 1 a cada subida de nível. O aviso \"Ainda dá para vencer?\" avisa quando um par impediu vencer sem embaralhar. Uma dica, desfazer, embaralhar ou Mostrar pares tornam o jogo assistido: sem a terceira estrela."],
["★ clear the board · ★ finish under par time · ★ no assists. In Time Attack the second star is for finishing with 30 s or more left.", "★ despeja el tablero · ★ termina por debajo del par · ★ sin ayudas. En contrarreloj, la segunda estrella es por terminar con 30 s o más.", "★ videz le plateau · ★ finissez sous le temps par · ★ sans aide. En contre-la-montre, la deuxième étoile récompense 30 s ou plus restantes.", "★ Brett abräumen · ★ unter Par-Zeit beenden · ★ ohne Hilfen. Im Zeitangriff gibt es den zweiten Stern für 30 s oder mehr Restzeit.", "★ limpe o tabuleiro · ★ termine abaixo do par · ★ sem ajudas. No contra o relógio, a segunda estrela é por terminar com 30 s ou mais."],
["Score and combos", "Puntos y combos", "Score et combos", "Punkte und Combos", "Pontos e combos"],
["Each pair scores 10 (Flowers and Seasons 20). Pairs made within 3 s of the last one build a combo: ×1.5, ×2, ×2.5, up to ×3. Stars never depend on score.", "Cada pareja vale 10 (Flores y Estaciones 20). Las parejas hechas a menos de 3 s de la anterior crean un combo: ×1,5, ×2, ×2,5, hasta ×3. Las estrellas nunca dependen de los puntos.", "Chaque paire vaut 10 (Fleurs et Saisons 20). Les paires faites moins de 3 s après la précédente créent un combo : ×1,5, ×2, ×2,5, jusqu'à ×3. Les étoiles ne dépendent jamais du score.", "Jedes Paar bringt 10 (Blumen und Jahreszeiten 20). Paare innerhalb von 3 s nach dem letzten bauen einen Combo auf: ×1,5, ×2, ×2,5, bis ×3. Sterne hängen nie von Punkten ab.", "Cada par vale 10 (Flores e Estações 20). Pares feitos até 3 s após o anterior formam um combo: ×1,5, ×2, ×2,5, até ×3. As estrelas nunca dependem dos pontos."],
["Modes", "Modos", "Modes", "Modi", "Modos"],
["Classic: your choice of difficulty, layout, shuffles, Time Attack (each pair adds 3 s) and Fog (Hard and Expert: blocked tiles stay face down until they're free). Campaign: 45 levels in Garden, Temple and Summit. Daily: one winnable board a day, the same for everyone, harder through the week.", "Clásico: eliges dificultad, disposición, barajadas, contrarreloj (cada pareja suma 3 s) y niebla (Difícil y Experto: las fichas bloqueadas quedan boca abajo hasta liberarse). Campaña: 45 niveles en Garden, Temple y Summit. Diario: un tablero ganable al día, el mismo para todos, más difícil según avanza la semana.", "Classique : choisissez difficulté, disposition, mélanges, contre-la-montre (chaque paire ajoute 3 s) et brouillard (Difficile et Expert : les tuiles bloquées restent face cachée jusqu'à être libres). Campagne : 45 niveaux dans Garden, Temple et Summit. Quotidien : un plateau gagnable par jour, le même pour tous, plus dur au fil de la semaine.", "Klassisch: Wähle Schwierigkeit, Aufbau, Mischen, Zeitangriff (jedes Paar bringt 3 s) und Nebel (Schwer und Experte: Blockierte Steine bleiben verdeckt, bis sie frei sind). Kampagne: 45 Level in Garden, Temple und Summit. Tagesrätsel: ein lösbares Brett pro Tag, für alle gleich, im Lauf der Woche schwerer.", "Clássico: escolha dificuldade, formato, embaralhadas, contra o relógio (cada par soma 3 s) e neblina (Difícil e Especialista: peças bloqueadas ficam viradas até ficarem livres). Campanha: 45 níveis em Garden, Temple e Summit. Diário: um tabuleiro vencível por dia, igual para todos, mais difícil ao longo da semana."],
["Pinch or use the Zoom button to get closer; drag to move round a big board. Double-tap the table (not a tile) to switch between whole board and zoomed.", "Pellizca o usa el botón Zoom para acercarte; arrastra para moverte por un tablero grande. Toca dos veces la mesa (no una ficha) para alternar entre el tablero entero y el zoom.", "Pincez ou utilisez le bouton Zoom pour vous rapprocher ; faites glisser pour parcourir un grand plateau. Touchez deux fois la table (pas une tuile) pour passer du plateau entier au zoom.", "Zum Vergrößern zwei Finger spreizen oder den Zoom-Knopf nutzen; ziehen, um dich auf einem großen Brett zu bewegen. Doppeltippe auf den Tisch (nicht auf einen Stein), um zwischen ganzem Brett und Zoom zu wechseln.", "Faça pinça ou use o botão Zoom para aproximar; arraste para andar por um tabuleiro grande. Toque duas vezes na mesa (não numa peça) para alternar entre o tabuleiro inteiro e o zoom."],
["Got it", "Entendido", "Compris", "Verstanden", "Entendi"],
["First playable demo: Classic at four difficulties with Time Attack and Fog, a 45-level campaign in three parts, and the Daily.", "Primera demo jugable: Clásico en cuatro dificultades con contrarreloj y niebla, una campaña de 45 niveles en tres partes y el diario.", "Première démo jouable : Classique en quatre difficultés avec contre-la-montre et brouillard, une campagne de 45 niveaux en trois parties et le quotidien.", "Erste spielbare Demo: Klassisch in vier Schwierigkeitsgraden mit Zeitangriff und Nebel, eine Kampagne mit 45 Leveln in drei Teilen und das Tagesrätsel.", "Primeira demo jogável: Clássico em quatro dificuldades com contra o relógio e neblina, uma campanha de 45 níveis em três partes e o diário."],
["Every board can be won: boards are built backwards from a winning order, and every Shuffle is too.", "Todos los tableros se pueden ganar: se construyen al revés desde un orden ganador, y cada barajada también.", "Chaque plateau peut être gagné : ils sont construits à rebours depuis un ordre gagnant, chaque mélange aussi.", "Jedes Brett ist lösbar: Bretter werden rückwärts aus einer Gewinnreihenfolge gebaut, und jedes Mischen ebenso.", "Todo tabuleiro pode ser vencido: são montados de trás para frente a partir de uma ordem vencedora, e cada embaralhada também."],
["Hints that keep the board winnable and a \"still winnable?\" warning, both checked by a solver.", "Pistas que mantienen el tablero ganable y un aviso \"¿Aún se puede ganar?\", ambos comprobados por un resolvedor.", "Des indices qui gardent le plateau gagnable et une alerte « Encore gagnable ? », vérifiés par un solveur.", "Tipps, mit denen das Brett lösbar bleibt, und die Warnung „Noch lösbar?“, beide von einem Löser geprüft.", "Dicas que mantêm o tabuleiro vencível e um aviso \"Ainda dá para vencer?\", ambos verificados por um resolvedor."],
["Our own tile art in five face sets, plus a High-contrast set with corner labels.", "Arte de fichas propio en cinco juegos de caras, más un juego de alto contraste con etiquetas.", "Notre propre dessin de tuiles en cinq jeux de faces, plus un jeu à fort contraste avec étiquettes.", "Eigene Steinmotive in fünf Sätzen, dazu ein kontrastreicher Satz mit Eck-Beschriftungen.", "Arte própria das peças em cinco conjuntos, mais um conjunto de alto contraste com rótulos."],

["Mahjong {0}: single-player Mahjong Solitaire with no ads and no accounts. Nothing leaves your device.", "Mahjong {0}: Mahjong Solitario para un jugador, sin anuncios ni cuentas. Nada sale de tu dispositivo.", "Mahjong {0} : Mahjong Solitaire en solo, sans pub ni compte. Rien ne quitte votre appareil.", "Mahjong {0}: Mahjong-Solitär für eine Person, ohne Werbung und Konten. Nichts verlässt dein Gerät.", "Mahjong {0}: Mahjong Paciência para um jogador, sem anúncios nem contas. Nada sai do seu aparelho."],
["Tiles and layouts", "Fichas y disposiciones", "Tuiles et dispositions", "Steine und Aufbauten", "Peças e formatos"],
["The tile art is our own, drawn as vector shapes. The shaped layouts use Sweep's shape masks; the Turtle is the traditional layout, turned to fit a phone.", "El arte de las fichas es propio, dibujado con formas vectoriales. Las disposiciones con forma usan las máscaras de Sweep; la Tortuga es la disposición tradicional, girada para caber en un móvil.", "Le dessin des tuiles est le nôtre, en formes vectorielles. Les dispositions en forme utilisent les masques de Sweep ; la Tortue est la disposition traditionnelle, tournée pour tenir sur un téléphone.", "Die Steinmotive sind eigene Vektorzeichnungen. Die geformten Aufbauten nutzen Sweeps Formmasken; die Schildkröte ist der traditionelle Aufbau, gedreht für das Handy.", "A arte das peças é própria, feita com formas vetoriais. Os formatos com desenho usam as máscaras do Sweep; a Tartaruga é o formato tradicional, girado para caber no celular."],
["Still Water and Lantern Walk are original and played live in the browser. Daylight comes from Sweep.", "Still Water y Lantern Walk son originales y se generan en directo en el navegador. Daylight viene de Sweep.", "Still Water et Lantern Walk sont originales et jouées en direct dans le navigateur. Daylight vient de Sweep.", "Still Water und Lantern Walk sind eigene Stücke, live im Browser gespielt. Daylight stammt aus Sweep.", "Still Water e Lantern Walk são originais e tocadas ao vivo no navegador. Daylight vem do Sweep."],

function applyLook(){ const dark=P.appearance==='dark'||(P.appearance!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);

// tile geometry in board units: a face is 60×80; half-grid steps 30×40; each layer shifts up-left; the side shows down-right
const TW=60, TH=80, HX=30, HY=40, LX=-6, LY=-8, SX=5, SY=6;
function buildDefs(){ const B=BODIES[look('body')], set=look('face'), o={hc:hcOn(),dark:!!B.dark,bg:B.face};
  let h=`<linearGradient id="gFace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${B.face}"/><stop offset="1" stop-color="${B.face2}"/></linearGradient>
   <linearGradient id="gSide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${B.side}"/><stop offset="1" stop-color="${B.side2}"/></linearGradient>`;
  for(let f=0;f<NFACES;f++) h+=`<symbol id="f${f}" viewBox="0 0 60 80">${faceSvg(f,set,o)}</symbol>`;

// a small stand-alone tile (Style previews, sheets)
function miniTile(f,set,body,hc){ const B=BODIES[body]; return `<svg viewBox="-1 -1 ${TW+SX+2} ${TH+SY+2}"><rect x="${SX}" y="${SY}" width="${TW}" height="${TH}" rx="8" fill="${B.side2}"/><rect width="${TW}" height="${TH}" rx="8" fill="${B.face}" stroke="${B.edge}"/>${faceSvg(f,set,{hc,dark:!!B.dark,bg:B.face})}</svg>`; }
// a top-down map of a layout (Classic sheet, Style)
function layoutMap(L){ const w=L.w*15, h=L.h*20; let r='';

  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${r}</svg>`; }

// Android back: in a game it opens the pause menu first; then it closes a sheet; then it returns home; then (home, in Arcade) goes to Arcade.
let cur='home', sheetOn=false, guarded=false;
function show(id){ $$('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); cur=id; guard(); }
const needGuard=()=>ARCADE||cur!=='home'||sheetOn;
function guard(){ if(needGuard()&&!guarded){ try{ history.pushState({mj:1},''); guarded=true; }catch(e){} } }
addEventListener('popstate',()=>{ guarded=false; back(); guard(); });
function back(){
  if(cur==='game'&&G&&!G.st.over&&!sheetOn){ openPause(); return; }
  if(sheetOn){ closeSheet(); return; }
  if(cur==='game'&&G){ leaveGame(); return; }
  if(cur==='set'&&setReturn){ backFromSettings(); return; }
  if(cur!=='home'){ goHome(); return; }
  if(ARCADE) leaveTo(ARCADE_HOME); }
function leaveTo(url){ if(G) saveGame(); persist(); writeSummary(); location.replace(url); }
let sheetClose=null;
function openSheet(html,onClose){ $('#sheet').innerHTML=html; $('#ov').classList.add('on'); $('#sheet').scrollTop=0; sheetOn=true; sheetClose=onClose||null; guard(); }
function closeSheet(){ if(!sheetOn) return; $('#ov').classList.remove('on'); sheetOn=false; const f=sheetClose; sheetClose=null; if(f) f(); }

async function share(text,okMsg){ try{ if(navigator.share){ await navigator.share({text}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast(okMsg||'Copied to the clipboard'); return; }catch(e){}
  openSheet(`<h2>Share</h2><div class="sub">Copy this text:</div><textarea rows="3" readonly>${esc(text)}</textarea><div class="btns"><button class="primary" data-close>Done</button></div>`); $('#sheet textarea').select(); }

   <div class="box" style="padding:4px 12px">${rowSw('ta','Time Attack',c.ta,'Beat the clock: each pair adds time')}${rowSw('fog','Fog',c.fog,c.diff==='easy'||c.diff==='normal'?'Hard and Expert only':'Blocked tiles stay face down until they\'re free')}</div>
   <div id="findBox"></div><div class="btns"><button class="ghost" data-close>Close</button><button class="primary" id="clGo">Play</button></div>`);
  $$('#sheet [data-seg]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const k=g.dataset.seg, v=b.dataset.v; c[k]=k==='shuffles'?(v==='inf'?'inf':+v):v; persist(); openSetup(); }));
  $$('#sheet [data-ly]').forEach(b=>b.onclick=()=>{ const L=layoutById(b.dataset.ly); if(L&&!layoutOpen(S,L)){ toast('🔒 '+lockText(findCos('layout',L.id))); return; } c.layout=b.dataset.ly; persist(); $$('#sheet [data-ly]').forEach(x=>x.classList.toggle('on',x===b)); });
  $$('#sheet [data-sw]').forEach(b=>b.onclick=()=>{ const k=b.dataset.sw; if(k==='fog'&&(c.diff==='easy'||c.diff==='normal')){ toast('Fog is for Hard and Expert'); return; } c[k]=!c[k]; persist(); openSetup(); });
  $('#clGo').onclick=startClassic; }
// A random Classic board: generate seeds and grade them with the blind bot (in slices) until one matches the
// difficulty's grade. After 10 tries it takes the closest.
function findBoard(diff,lid,done){ const want=diff, L0=lid?layoutById(lid):null; let tries=0, best=null, trap=GRADE_TRAP[want];
  const job={}; findJob=job;
  const next=()=>{ if(findJob!==job) return; if(tries>=10){ done(best); return; }
    const Ls=layoutsFor(diff), L=L0||Ls[rnd32()%Ls.length], seed='C'+rnd32().toString(36); tries++;
    const g=generate(L,diff,seed,trap); if(!g){ setTimeout(next,0); return; }
    sliced(gradeGen(L,g.faces,seed),r=>{ if(findJob!==job) return; const d=GRADES.indexOf(r.grade)-GRADES.indexOf(want);
      const cand={lid:L.id,seed,trap,grade:r.grade,rate:r.rate,g,d:Math.abs(d)}; if(!best||cand.d<best.d) best=cand;
      if(d===0){ done(cand); return; } trap=Math.max(0,Math.min(1,trap+(d<0?.12:-.12))); next(); },job); };
  next(); }
let findJob=null;
function startClassic(){ const c=S.setup;
  if(S.run&&S.run.mode==='classic'&&S.run.st.moves>0&&!S.run.st.over){ addRecords(S,Object.assign(cloneState(S.run.st),{won:false})); S.run=null; persist(); } // an abandoned game counts as a loss
  $('#findBox').innerHTML=`<div class="finding"><div class="spin"></div><span>Finding a ${GRADE_NAMES[c.diff].toLowerCase()} board…</span></div>`; $('#clGo').disabled=true;
  findBoard(c.diff,c.layout==='random'?null:c.layout,b=>{ if(!b||!sheetOn) return; const L=layoutById(b.lid);
    const cfg={lid:b.lid,diff:c.diff,seed:b.seed,trap:b.trap,shuffles:c.shuffles,undo:true,ta:!!c.ta,fog:!!c.fog,grade:b.grade,par:parTime(L,b.grade)};
    startGame({mode:'classic'},newGame(cfg,b.g)); }); }

async function gz(text,inflate){ const CS=inflate?window.DecompressionStream:window.CompressionStream; if(!CS) return null;
  const s=new Blob([text]).stream().pipeThrough(new CS('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); }
async function backupCode(){ const json=JSON.stringify(S);
  try{ const z=await gz(new TextEncoder().encode(json)); if(z){ let b=''; for(let i=0;i<z.length;i++) b+=String.fromCharCode(z[i]); return 'MAHJONG1Z.'+btoa(b); } }catch(e){}
  return backupPlain(S); }
async function readBackup(text){ const m=/MAHJONG1Z\.([A-Za-z0-9+/=]+)/.exec(String(text||''));
  if(m){ try{ const bin=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0)); const out=await gz(bin,true); const o=JSON.parse(new TextDecoder().decode(out)); return o&&typeof o.xp==='number'?o:null; }catch(e){ return null; } }
  return parseBackup(text); }
async function openBackup(){ if(G) saveGame(); const code=await backupCode();

  let armed=null; $('#bkGo').onclick=async()=>{ const o=await readBackup($('#bkIn').value); if(!o){ toast('That code isn\'t a Mahjong backup'); return; }
