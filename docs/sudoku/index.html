<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3f2ef" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<title>Sudoku</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="../fonts.css">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arcade">

<script>window.__ARCADE__=1</script>
<style>
:root{--bg:#f3f2ef;--panel:#fff;--ink:#1c1c1e;--sub:#8a8a90;--accent:#2f5fb3;--accentInk:#fff;--line:rgba(0,0,0,.08);--gold:#e8a913;--good:#2f9e6a;--bad:#d9534f}
.dark{--bg:#101114;--panel:#1b1c20;--ink:#f2f2f4;--sub:#8d8e96;--accent:#e9eaee;--accentInk:#15161a;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
textarea{width:100%;font:12px/1.4 'JetBrains Mono',monospace;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:none;-webkit-user-select:text;user-select:text}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;flex:1;padding:16px 16px 36px;max-width:560px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h2{font-size:24px;font-weight:800;letter-spacing:-.03em;flex:1;min-width:0}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 0 16px}
.brand h1{font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1}
.brand p{color:var(--sub);font-size:14px;margin-top:8px;line-height:1.35}
.acts{display:flex;gap:8px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.backbtn{height:36px;padding:0 12px 0 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-bottom:6px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:22px 4px 10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.label span{letter-spacing:.02em;text-transform:none;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 15px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:10px;transition:transform .12s;min-width:0}
button.card:active{transform:scale(.98)}
.card .t{font-weight:700;font-size:17px;letter-spacing:-.01em;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.row2 .card .t{font-size:15.5px}
.card .s{color:var(--sub);font-size:13px;margin-top:2px;line-height:1.3;overflow-wrap:anywhere}
.card .grow{flex:1;min-width:0}
.card .r{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex:none;max-width:42%}
.card .r b{display:block;font-size:15px}
.card .r span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.card.dim{opacity:.55}
.ico{width:42px;height:42px;border-radius:12px;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.ico svg{width:26px;height:26px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .card{margin:0;padding:12px;gap:10px}
.row2 .ico{width:36px;height:36px}.row2 .card .s{overflow-wrap:normal}
.lvl .badge{width:50px;height:50px;border-radius:15px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.primary{background:var(--accent);color:var(--accentInk);border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;width:100%;transition:transform .12s}
.primary:active{transform:scale(.98)}
.ghost{background:var(--bg);border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;width:100%}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns>*{flex:1 1 0;min-width:0}
.seg{display:flex;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;padding:9px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);min-width:0}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.dark .seg button.on{background:#2a2b31}
.opt{margin:12px 0}
.opt>.h{font-size:12px;font-weight:700;color:var(--sub);margin:0 2px 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;width:100%;font-weight:600;font-size:15px;text-align:left}
.srow .d{font-size:12.5px;color:var(--sub);font-weight:500;margin-top:2px}
.srow>div{min-width:0}
.sw{width:46px;height:28px;border-radius:99px;background:var(--bg);position:relative;transition:background .2s;flex:none;border:1px solid var(--line)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--sub);transition:left .2s,background .2s}
.sw.on{background:var(--accent)}.sw.on::after{left:21px;background:var(--accentInk)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 14px;margin-bottom:10px}
.box .srow+.srow{border-top:1px solid var(--line)}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px;white-space:nowrap}
.stars .o{color:var(--sub);opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;max-width:100%;min-width:0;overflow-wrap:anywhere}
.chip.on{background:var(--accent);color:var(--accentInk);border-color:transparent}
.topseg{background:var(--panel);border:1px solid var(--line);margin:0 0 14px}
.topseg button{font-size:12px;padding:9px 3px;white-space:nowrap;letter-spacing:-.01em}
.topseg button.on{background:var(--accent);color:var(--accentInk)}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px;text-align:left;position:relative;transition:transform .12s;min-width:0}
.tcard:active{transform:scale(.98)}
.tcard .pv{aspect-ratio:7/4;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden;position:relative}
.tcard .n{font-weight:700;font-size:14px;margin:9px 5px 2px;overflow-wrap:anywhere}
.tcard .q{font-size:11.5px;color:var(--sub);margin:0 5px 5px;line-height:1.3;min-height:2.6em;overflow-wrap:anywhere}
.tcard.sel{box-shadow:0 0 0 2.5px var(--accent)}
.tcard.locked .pv{filter:grayscale(.9);opacity:.45}
.tcard .pv svg.i{width:38px;height:38px;stroke-width:1.6;color:var(--accent)}
.tcard.playing .pv{opacity:.4}
.lock{position:absolute;top:13px;right:13px;width:28px;height:28px;border-radius:9px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.lock svg.i{width:15px;height:15px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 2px;border-radius:10px;font-weight:700;font-size:13px;color:var(--sub);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--accentInk)}
.lvcard .num{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.lvcard.fin .num{background:var(--accent);color:var(--accentInk)}
.lvpath .lvcard:nth-child(4n+2),.lvpath .lvcard:nth-child(4n+3){margin-left:18px;width:calc(100% - 18px)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
.tbl th{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700;border:0}
.tbl td:first-child,.tbl th:first-child{text-align:left;font-weight:600}
.ach{display:flex;gap:12px;align-items:center;padding:10px 2px}
.ach+.ach{border-top:1px solid var(--line)}
.ach .m{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none;font-size:15px;font-weight:800}
.ach.done .m{background:var(--gold);color:#3a2a00}
.ach .n{font-weight:700;font-size:14.5px}.ach .d{color:var(--sub);font-size:12.5px;margin-top:1px;overflow-wrap:anywhere}
.ach>div:last-child{min-width:0}
.week{display:flex;gap:6px;justify-content:space-between;margin:6px 0}
.week div{flex:1;min-width:0;text-align:center;font-size:11px;font-weight:700;color:var(--sub);background:var(--bg);border-radius:10px;padding:7px 0}
.week div.on{background:var(--gold);color:#3a2a00}
/* sheets */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:2000;padding:0 0 env(safe-area-inset-bottom)}
#ov.on{display:flex}
#sheet{background:var(--panel);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px 20px;max-height:92vh;overflow-y:auto;overflow-x:hidden;animation:up .22s ease-out}
@media (min-height:700px) and (min-width:600px){ #ov{align-items:center} #sheet{border-radius:24px} }
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;overflow-wrap:anywhere}
#sheet .sub{color:var(--sub);font-size:14px;line-height:1.4;margin-bottom:12px}
.goal{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px;font-weight:600}
.goal .st{font-size:18px;color:var(--sub);opacity:.4;width:22px;text-align:center;flex:none}
.goal.got .st{color:var(--gold);opacity:1}
.goal.new .st{animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--bg);border-radius:12px;padding:9px 6px;text-align:center;min-width:0;overflow-wrap:anywhere}
.kv b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.kv span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.howto p{font-size:14px;line-height:1.5;margin:6px 0}
.howto h3{font-size:15px;margin:14px 0 4px}
.howto .dia{display:flex;justify-content:center;margin:8px 0 4px}
#toast{position:fixed;left:50%;top:0;transform:translate(-50%,calc(-100% - env(safe-area-inset-top) - 20px));opacity:0;background:var(--accent);color:var(--accentInk);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:3000;transition:transform .35s,opacity .35s;max-width:calc(100vw - 24px);text-align:center;pointer-events:none;margin-top:calc(env(safe-area-inset-top) + 10px)}
#toast.on{transform:translate(-50%,0);opacity:1}
#fxc{position:fixed;inset:0;pointer-events:none;z-index:1500;width:100%;height:100%}

/* ===== the game screen ===== */
#game{background:var(--gbg);color:var(--gInk)}
.gcol{width:100%;height:100%;display:flex;flex-direction:column;padding:6px 8px 8px;gap:6px;margin:0 auto}
.gbar{display:flex;gap:6px;align-items:stretch;flex:none;max-width:620px;width:100%;margin:0 auto}
.gbar .info{flex:1;min-width:0;display:flex;gap:6px}
.gbar .box2{flex:1;min-width:0;background:var(--chip);border-radius:12px;padding:4px 8px;display:flex;flex-direction:column;justify-content:center;font-variant-numeric:tabular-nums;line-height:1.15}
.gbar .box2 b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar .box2 span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar .box2.warn b{color:var(--bad)}
.gtag{font-size:11px;font-weight:700;text-align:center;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.75}
.gbtn{width:44px;flex:none;border-radius:12px;background:var(--chip);display:grid;place-items:center;color:var(--gInk);min-height:40px}
#main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;width:100%}
#bArea{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#main.land{flex-direction:row;justify-content:center;align-items:center}
#main.land #bArea{flex:none;height:100%;width:auto}
#boardWrap{position:relative;flex:none}
#board{position:relative;display:grid;gap:1px;background:var(--thin);border-radius:6px;overflow:hidden;box-shadow:0 0 0 2.5px var(--thick),0 4px 18px rgba(0,0,0,.08);touch-action:manipulation}
.c{position:relative;background:var(--cell);display:grid;place-items:center;cursor:pointer;overflow:hidden;width:var(--cs);height:var(--cs);transition:background .12s}
.c.dg{background:var(--diagbg)}
.c.gv{background:var(--givbg)}
.c.dg.gv{background:linear-gradient(var(--diagbg),var(--diagbg)),var(--givbg);background-blend-mode:multiply}
.c::before{content:'';position:absolute;inset:0;background:var(--tint,transparent);pointer-events:none;transition:background .12s}
.c.hh{--tint:var(--hhouse)}
.c.same{--tint:var(--hsame)}
.c.sel{--tint:var(--hsel)}
.c.hint{box-shadow:inset 0 0 0 3px var(--gold);animation:hbreathe 1.2s ease-in-out infinite}
@keyframes hbreathe{50%{box-shadow:inset 0 0 0 1.5px var(--gold)}}
.c.hhouse{--tint:var(--hhint)}
.c.hpat{--tint:var(--hpat)}
.c .v{font-size:calc(var(--cs)*var(--ds));line-height:1;color:var(--ink2);font-weight:var(--pw);font-family:var(--df);position:relative;z-index:1;display:block;transform:translateY(var(--dy))}
.c.gv .v{color:var(--giv);font-weight:var(--gw)}
.c.bad .v{color:var(--bad)}
.cb .c.bad .v{text-decoration:underline dotted 2px;text-underline-offset:2px}
.c.conf::after{content:'';position:absolute;inset:2px;border:2px solid var(--bad);border-radius:5px;pointer-events:none;z-index:2}
.c .v svg{width:calc(var(--cs)*var(--ds)*.72);height:calc(var(--cs)*var(--ds));display:block;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:var(--rsw)}
.c.gv .v svg{stroke-width:var(--rgw)}
.c .fx{position:absolute;inset:0;background:var(--fxc);opacity:0;pointer-events:none;z-index:0}
.c.pop .v{animation:vpop .22s ease-out}
@keyframes vpop{0%{transform:translateY(var(--dy)) scale(.55)}70%{transform:translateY(var(--dy)) scale(1.12)}100%{transform:translateY(var(--dy)) scale(1)}}
.nt{position:absolute;inset:5%;display:grid;grid-template-columns:repeat(var(--nb),1fr);grid-template-rows:repeat(var(--nr),1fr);font-size:calc(var(--cs)*var(--ns));line-height:1;color:var(--note);font-weight:600;font-family:Inter,system-ui,sans-serif;z-index:1}
.nt i{font-style:normal;display:grid;place-items:center;border-radius:3px}
.nt i.on{background:var(--hnote);color:var(--hnoteInk)}
.nt i.out{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.ns-centre .nt{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:0 1px;inset:12% 6%;font-size:calc(var(--cs)*var(--ns)*.92)}
.ns-centre .nt i{padding:0 .5px}
#bsvg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:3}
#pad{display:flex;flex-direction:column;gap:7px;width:100%;max-width:560px;flex:none;position:relative}
#main.land #pad{width:min(300px,40vw)}
#tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#tools button{height:48px;border-radius:13px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;min-width:0;gap:1px;position:relative;color:var(--gInk)}
#tools button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
#tools button svg.i{width:19px;height:19px}
#tools button.on{background:var(--accent);color:var(--accentInk)}
#tools button.armed{background:var(--bad);color:#fff}
#tools .cnt{position:absolute;top:-6px;right:2px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--gold);color:#3a2a00;font-size:11px;font-weight:800;display:grid;place-items:center;font-style:normal}
#tools .tag{position:absolute;top:-6px;right:2px;padding:2px 6px;border-radius:99px;background:var(--chip2);font-size:9.5px;font-weight:800;font-style:normal}
#tools button.on .tag{background:var(--gold);color:#3a2a00}
#digits{display:grid;grid-template-columns:repeat(var(--nd),1fr);gap:5px}
#main.land #digits{grid-template-columns:repeat(3,1fr)}
#digits button{height:56px;border-radius:12px;background:var(--padbg);font-size:27px;font-weight:600;color:var(--ink2);font-family:var(--df);position:relative;min-width:0;display:grid;place-items:center;transition:transform .1s}
#digits button:active{transform:scale(.94)}
#digits button.done{opacity:.28}
#digits button.held{background:var(--accent);color:var(--accentInk);box-shadow:0 0 0 2px var(--gold)}
#digits button svg{width:18px;height:26px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:2.2}
#digits button .left{position:absolute;bottom:3px;right:5px;font:700 9.5px Inter,sans-serif;opacity:.55}
.notesOn #digits button{font-size:19px;color:var(--note)}
.notesOn #digits button.held{color:var(--accentInk)}
.notesOn #digits button .v{display:block;transform:translate(-30%,-22%)}
.notesOn #digits button svg{width:13px;height:19px;transform:translate(-30%,-22%)}
#main.land #digits button{height:52px}
.banner{position:absolute;left:0;right:0;bottom:calc(100% - 50px);z-index:20;min-height:56px;box-shadow:0 6px 18px rgba(0,0,0,.3);background:rgba(22,24,30,.96);color:#fff;border-radius:13px;padding:8px 10px;font-size:12.5px;line-height:1.35;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner b{flex:1 1 170px;min-width:0;font-weight:600}
.banner button{background:rgba(255,255,255,.92);color:#1c1c1e;border-radius:10px;padding:7px 11px;font-weight:700;font-size:13px}
.banner button.ok2{background:rgba(255,255,255,.16);color:#fff}
#cover{position:fixed;inset:0;z-index:1000;background:var(--gbg);color:var(--gInk);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#cover.on{display:flex}
#cover h2{font-size:28px;font-weight:800}
#cover button{background:var(--chip);color:var(--gInk);border-radius:14px;padding:12px 22px;font-weight:700;font-size:15px;min-width:220px}
#gen{position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center}
#gen.on{display:flex}
#gen div{background:var(--panel);color:var(--ink);border-radius:16px;padding:16px 22px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.mini{display:grid;gap:1px;background:var(--thin);box-shadow:0 0 0 2px var(--thick);border-radius:4px;overflow:hidden}
.mini i{width:22px;height:22px;background:var(--cell);display:grid;place-items:center;font-style:normal;font-size:14px;font-family:var(--df);color:var(--ink2);font-weight:var(--pw)}
.mini i.gv{color:var(--giv);font-weight:var(--gw);background:var(--givbg)}
.mini i.s{background:linear-gradient(var(--hsel),var(--hsel)),var(--cell)}.mini i.h{background:linear-gradient(var(--hhouse),var(--hhouse)),var(--cell)}.mini i.m{background:linear-gradient(var(--hsame),var(--hsame)),var(--cell)}
.mini i svg{width:11px;height:16px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:2}
.dia .mini i{width:24px;height:24px;font-size:13px}
.dia .mini i.k{background:linear-gradient(var(--hhint),var(--hhint)),var(--cell)}.dia .mini i.t{box-shadow:inset 0 0 0 2px var(--gold)}
.dia .mini i.x{color:var(--bad);font-size:11px}
.dia .mini i small{font-size:9px;color:var(--note);font-weight:700}

<script>// ===================== Sudoku engine =====================
// Pure: no DOM, no timers. The game state is plain JSON, so saves resume exactly.
// Cells are numbered row by row (0 … N·N−1). Digits are 1 … N; 0 is an empty cell. Notes are bit masks (bit d−1 = digit d).
// Every variant is just a list of "houses" (rows, columns, regions and, in Diagonal, the two main diagonals):
// like Sweep's neighbour lists, the rules, the solver, the generator and the hints all run on that one list.

// ---------- seeded RNG (as in Sweep): cyrb128 → sfc32 ----------
function cyrb128(str){ let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;
  for(let i=0,k;i<str.length;i++){ k=str.charCodeAt(i); h1=h2^Math.imul(h1^k,597399067); h2=h3^Math.imul(h2^k,2869860233); h3=h4^Math.imul(h3^k,951274213); h4=h1^Math.imul(h4^k,2716044179); }
  h1=Math.imul(h3^(h1>>>18),597399067); h2=Math.imul(h4^(h2>>>22),2869860233); h3=Math.imul(h1^(h3>>>17),951274213); h4=Math.imul(h2^(h4>>>19),2716044179);
  return [(h1^h2^h3^h4)>>>0,(h2^h1)>>>0,(h3^h1)>>>0,(h4^h1)>>>0]; }
function sfc32(a,b,c,d){ return function(){ a>>>=0;b>>>=0;c>>>=0;d>>>=0; let t=(a+b)|0; a=b^(b>>>9); b=(c+(c<<3))|0; c=(c<<21)|(c>>>11); d=(d+1)|0; t=(t+d)|0; c=(c+t)|0; return (t>>>0)/4294967296; }; }
const rngFor=str=>{ const s=cyrb128(String(str)); return sfc32(s[0],s[1],s[2],s[3]); };
function shuffleIn(a,r){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

// ---------- variants ----------
// Mini: digits 1–6 in 2×3 boxes (2 rows tall, 3 columns wide). Diagonal: Classic plus both main diagonals.
// Jigsaw: Classic rules with 9 irregular connected regions of 9 cells (a regions string: one region digit per cell).
const VARIANTS={mini:{N:6,bw:3,bh:2,name:'Mini 6×6'},classic:{N:9,bw:3,bh:3,name:'Classic'},diag:{N:9,bw:3,bh:3,diag:1,name:'Diagonal'},jigsaw:{N:9,bw:3,bh:3,jig:1,name:'Jigsaw'}};
const VKEYS=['mini','classic','diag','jigsaw'];
const GRADES=['easy','normal','hard','expert'], GRADE_NAMES={easy:'Easy',normal:'Normal',hard:'Hard',expert:'Expert'};
const gradesFor=v=>v==='mini'?['easy','normal']:GRADES;
function stdRegions(N,bw,bh){ let s=''; for(let r=0;r<N;r++) for(let c=0;c<N;c++) s+=String(Math.floor(r/bh)*(N/bw)+Math.floor(c/bw)); return s; }
const popc=m=>{ let n=0; while(m){ m&=m-1; n++; } return n; };
const POP=new Uint8Array(1<<9); for(let m=1;m<512;m++) POP[m]=POP[m>>1]+(m&1);
const lowDigit=m=>{ let d=1; while(!(m&1)){ m>>=1; d++; } return d; };
const digitsOf=m=>{ const o=[]; for(let d=1;m;d++,m>>=1) if(m&1) o.push(d); return o; };

// geometry: houses, the houses of each cell, peers, a "sees" table and house intersections (for locked candidates)
const GEO={};
function geom(variant,regions){ const V=VARIANTS[variant], key=variant+'|'+(V.jig?regions:''); if(GEO[key]) return GEO[key];
  const N=V.N, NN=N*N, reg=V.jig?regions:stdRegions(N,V.bw,V.bh), houses=[];
  for(let r=0;r<N;r++) houses.push({type:'row',i:r,cells:Array.from({length:N},(_,c)=>r*N+c)});
  for(let c=0;c<N;c++) houses.push({type:'col',i:c,cells:Array.from({length:N},(_,r)=>r*N+c)});
  for(let b=0;b<N;b++){ const cells=[]; for(let k=0;k<NN;k++) if(+reg[k]===b) cells.push(k); houses.push({type:'box',i:b,cells}); }
  if(V.diag){ houses.push({type:'diag',i:0,cells:Array.from({length:N},(_,k)=>k*N+k)}); houses.push({type:'diag',i:1,cells:Array.from({length:N},(_,k)=>k*N+(N-1-k))}); }
  const cellHouses=Array.from({length:NN},()=>[]); houses.forEach((h,hi)=>h.cells.forEach(c=>cellHouses[c].push(hi)));
  const sees=new Uint8Array(NN*NN), peers=[];
  for(let c=0;c<NN;c++){ const s=new Set(); for(const hi of cellHouses[c]) for(const p of houses[hi].cells) if(p!==c) s.add(p); peers.push([...s].sort((a,b)=>a-b)); for(const p of s) sees[c*NN+p]=1; }
  // pairs of houses sharing 2+ cells: the digit's spots in house a all inside the overlap clear it from the rest of house b
  const inter=[]; for(let a=0;a<houses.length;a++) for(let b=0;b<houses.length;b++){ if(a===b) continue; const B=new Set(houses[b].cells), I=houses[a].cells.filter(c=>B.has(c));
    if(I.length>=2&&I.length<N) inter.push({a,b,cells:I,rest:houses[b].cells.filter(c=>!I.includes(c))}); }
  const g={variant,N,NN,reg,houses,cellHouses,peers,sees,inter,full:(1<<N)-1,jig:!!V.jig,diag:!!V.diag,boxW:V.bw,boxH:V.bh};
  GEO[key]=g; return g; }

// ---------- puzzles as strings: one character per cell, '0' empty ----------
const toVals=s=>[...s].map(Number), toStr=a=>a.join('');
const givenCount=s=>[...s].filter(ch=>ch!=='0').length;

// ---------- game state ----------
// cfg: notes (false = the Notes button is off), check (mistake check), limit (mistakes allowed; the next one fails), parTime
const defCfg=o=>Object.assign({notes:true,check:true,limit:0},o||{});
// p: {variant, regions, givens, sol, seed, notes (optional pre-filled notes, for technique puzzles), fixed (optional pre-placed digits)}
function newGame(p,cfg){ const g=geom(p.variant,p.regions), NN=g.NN; const sol=p.sol||toStr(solveExact(g,toVals(p.givens)).sol);
  return {v:1,variant:p.variant,regions:p.regions||null,seed:String(p.seed||''),givens:p.givens,sol,cfg:defCfg(cfg),
    vals:toVals(p.givens),notes:p.notes?p.notes.slice():new Array(NN).fill(0),
    hist:[],moves:0,mistakes:0,hints:0,time:0,won:false,lost:false,fillUsed:false,notesUsed:!!p.notes,undos:0}; }
const geoOf=st=>geom(st.variant,st.regions);
const isGiven=(st,c)=>st.givens[c]!=='0';
const solOf=(st,c)=>+st.sol[c];
const isWrong=(st,c)=>st.vals[c]&&st.vals[c]!==+st.sol[c];
const filled=st=>st.vals.every(v=>v);
const HIST_MAX=3000;
function pushHist(st,ent){ st.hist.push(ent); if(st.hist.length>HIST_MAX) st.hist.shift(); }
const checkWon=st=>{ st.won=st.vals.every((v,c)=>v===+st.sol[c]); return st.won; };

// the legal candidates of a cell from the digits placed (what "Fill notes" puts in)
function legalMask(g,vals,c){ if(vals[c]) return 0; let m=g.full; for(const p of g.peers[c]) if(vals[p]) m&=~(1<<(vals[p]-1)); return m; }
// cells that break the rules: two equal digits in one house (the rules, not the solution)
function conflicts(st){ const g=geoOf(st), out=new Set();
  for(const h of g.houses){ const seen={}; for(const c of h.cells){ const v=st.vals[c]; if(!v) continue; if(seen[v]!=null){ out.add(c); out.add(seen[v]); } else seen[v]=c; } }
  return out; }
// houses completed by a move at cell c: full and clash-free
function completedAt(st,c){ const g=geoOf(st), out=[];
  for(const hi of g.cellHouses[c]){ const h=g.houses[hi]; let ok=true, seen=0; for(const k of h.cells){ const v=st.vals[k]; if(!v||(seen&(1<<v))){ ok=false; break; } seen|=1<<v; } if(ok) out.push(hi); }
  return out; }
// how many of each digit are placed (a pad digit greys out once all N are placed)
function digitCounts(st){ const g=geoOf(st), n=new Array(g.N+1).fill(0); for(const v of st.vals) if(v) n[v]++; return n; }

// ---------- actions (each returns null if nothing changed) ----------
// Place digit d in cell c. Placing the digit already there erases it. A wrong digit with mistake check on counts a mistake.
// o.autoNotes: remove d from the notes of every cell in the same houses (not an assist).
function place(st,c,d,o){ o=o||{}; if(st.won||st.lost||isGiven(st,c)||d<1||d>geoOf(st).N) return null; const g=geoOf(st);
  if(st.vals[c]===d) return erase(st,c);
  const ch=[[c,st.vals[c],st.notes[c]]]; st.vals[c]=d; st.notes[c]=0;
  if(o.autoNotes){ const bit=1<<(d-1); for(const p of g.peers[c]) if(st.notes[p]&bit){ ch.push([p,st.vals[p],st.notes[p]]); st.notes[p]&=~bit; } }
  let wrong=d!==+st.sol[c], counted=false;
  if(wrong&&st.cfg.check){ st.mistakes++; counted=true; }
  pushHist(st,{a:'p',ch}); st.moves++;
  const done=completedAt(st,c); checkWon(st);
  if(counted&&st.cfg.limit&&st.mistakes>st.cfg.limit) st.lost=true;
  return {c,d,wrong,counted,done,won:st.won,lost:st.lost}; }
// toggle the pencil mark d in an empty cell
function toggleNote(st,c,d){ if(st.won||st.lost||isGiven(st,c)||st.vals[c]||!st.cfg.notes) return null; const bit=1<<(d-1);
  pushHist(st,{a:'n',ch:[[c,0,st.notes[c]]]}); st.notes[c]^=bit; st.moves++; st.notesUsed=true; return {c,d,on:!!(st.notes[c]&bit)}; }
// set a cell's notes to exactly mask (used by hints that clear notes)
function setNotes(st,list){ const ch=[]; for(const [c,m] of list){ if(st.vals[c]||st.notes[c]===m) continue; ch.push([c,0,st.notes[c]]); st.notes[c]=m; }
  if(!ch.length) return null; pushHist(st,{a:'h',ch}); st.moves++; return {n:ch.length}; }
function erase(st,c){ if(st.won||st.lost||isGiven(st,c)) return null; if(!st.vals[c]&&!st.notes[c]) return null;
  pushHist(st,{a:'e',ch:[[c,st.vals[c],st.notes[c]]]}); if(st.vals[c]) st.vals[c]=0; else st.notes[c]=0; st.moves++; return {c}; }
// Fill notes: every empty cell gets all its legal candidates (not an assist: it saves tedium and makes no deduction)
function fillNotes(st){ if(st.won||st.lost||!st.cfg.notes) return null; const g=geoOf(st), ch=[];
  for(let c=0;c<g.NN;c++){ if(st.vals[c]) continue; const m=legalMask(g,st.vals,c); if(m!==st.notes[c]){ ch.push([c,0,st.notes[c]]); st.notes[c]=m; } }
  if(!ch.length) return null; pushHist(st,{a:'f',ch}); st.moves++; st.fillUsed=true; st.notesUsed=true; return {n:ch.length}; }
// unlimited undo; free (it's just editing). Mistakes already counted stay counted.
function undo(st){ if(st.won||st.lost||!st.hist.length) return null; const e=st.hist.pop();
  for(let k=e.ch.length-1;k>=0;k--){ const [c,v,n]=e.ch[k]; st.vals[c]=v; st.notes[c]=n; } st.undos++; st.moves++; return {a:e.a,cells:e.ch.map(x=>x[0])}; }
const canUndo=st=>!st.won&&!st.lost&&st.hist.length>0;

// ---------- compact puzzle strings (the bank) ----------
// Givens are 180°-symmetric, so a bit mask over the first half of the cells says which are given (6 bits per character),
// then the given digits in cell order, three per two characters (base 9). Jigsaw puzzles start with their layout's index.
const B64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
const B64I={}; [...B64].forEach((ch,i)=>B64I[ch]=i);
function encPuzzle(givens,layout){ const NN=givens.length, half=Math.ceil(NN/2); let o=layout!=null?B64[layout]:'', acc=0, nb=0;
  for(let i=0;i<half;i++){ acc=acc*2+(givens[i]!=='0'?1:0); nb++; if(nb===6){ o+=B64[acc]; acc=0; nb=0; } }
  if(nb){ acc<<=6-nb; o+=B64[acc]; }
  const ds=[...givens].filter(ch=>ch!=='0').map(ch=>+ch-1); while(ds.length%3) ds.push(0);
  for(let i=0;i<ds.length;i+=3){ const v=ds[i]*81+ds[i+1]*9+ds[i+2]; o+=B64[v>>6]+B64[v&63]; }
  return o; }
function decPuzzle(s,NN,jig){ let p=0, layout=null; if(jig) layout=B64I[s[p++]]; const half=Math.ceil(NN/2), mask=[];
  for(let i=0;i<half;i+=6){ const v=B64I[s[p++]]; for(let b=0;b<6&&i+b<half;b++) mask.push((v>>(5-b))&1); }
  const on=new Array(NN).fill(0); for(let i=0;i<half;i++) if(mask[i]){ on[i]=1; on[NN-1-i]=1; }
  const ds=[]; while(p<s.length){ const v=B64I[s[p]]*64+B64I[s[p+1]]; p+=2; ds.push((v/81|0)+1,((v/9|0)%9)+1,(v%9)+1); }
  let k=0, g=''; for(let c=0;c<NN;c++) g+=on[c]?ds[k++]:'0';
  return {givens:g,layout}; }

// ===================== Sudoku solver =====================
// 1. The logic solver: applies techniques in order of difficulty, always the easiest one that makes progress, on
//    candidates (notes) for every cell, until the grid is solved or nothing applies. It never guesses. Its output
//    grades a puzzle (the hardest technique used), sets par time and gives hints (the next logical step).
// 2. The exact solver: bit masks with backtracking; counts solutions and stops at 2 (uniqueness), or fills a grid.
// 3. The generator: a full grid, then givens removed in 180°-symmetric pairs while the logic solver can still finish
//    within the target grade. Kept only if its hardest technique is exactly the target grade. Runs in slices.

// ---------- techniques ----------
// lv: 0 Easy · 1 Normal · 2 Hard · 3 Expert. w: seconds a casual player takes to spot one (for par time).
const TECH=[
 {id:'hs',name:'Hidden single',lv:0,w:8},{id:'ns',name:'Naked single',lv:0,w:10},
 {id:'pt',name:'Pointing',lv:1,w:30},{id:'cl',name:'Claiming',lv:1,w:32},{id:'np',name:'Naked pair',lv:1,w:40},{id:'hp',name:'Hidden pair',lv:1,w:50},
 {id:'nt',name:'Naked triple',lv:2,w:75},{id:'ht',name:'Hidden triple',lv:2,w:90},{id:'xw',name:'X-Wing',lv:2,w:100},{id:'xy',name:'XY-Wing',lv:2,w:110},
 {id:'sf',name:'Swordfish',lv:3,w:150},{id:'xyz',name:'XYZ-Wing',lv:3,w:150},{id:'nq',name:'Naked quad',lv:3,w:150},{id:'hq',name:'Hidden quad',lv:3,w:170},{id:'sc',name:'Simple colouring',lv:3,w:180}];
const TECH_BY={}; TECH.forEach((t,i)=>{ TECH_BY[t.id]=t; t.k=i; });
// Par time: Σ steps × w × a generous slack (casual pace), Mini singles a little quicker. One place to loosen it.
const PAR={slack:1.4,mini:.6,round:30};
const HNAME={row:'row',col:'column',box:'box',diag:'diagonal'};
const hname=(g,h)=>h.type==='box'&&g.jig?'region':HNAME[h.type];

// candidates from the digits placed
function candsOf(g,vals){ const cand=new Uint16Array(g.NN); for(let c=0;c<g.NN;c++) cand[c]=legalMask(g,vals,c); return cand; }
function applyPlace(g,vals,cand,c,d){ vals[c]=d; cand[c]=0; const bit=~(1<<(d-1)); for(const p of g.peers[c]) cand[p]&=bit; }
function applyStep(g,vals,cand,s){ if(s.place) applyPlace(g,vals,cand,s.place[0],s.place[1]); else for(const [c,m] of s.elim) cand[c]&=~m; }
function* combos(arr,k,start,pre){ start=start||0; pre=pre||[]; if(pre.length===k){ yield pre; return; }
  for(let i=start;i<=arr.length-(k-pre.length);i++){ pre.push(arr[i]); yield* combos(arr,k,i+1,pre); pre.pop(); } }
// houses in hint order: boxes first (the most natural place to spot a single), then rows, columns and diagonals
const hOrder=g=>g._ho||(g._ho=g.houses.map((h,i)=>i).sort((a,b)=>(g.houses[a].type==='box'?0:1)-(g.houses[b].type==='box'?0:1)||a-b));

// --- singles ---
function tHidden(g,vals,cand){ for(const hi of hOrder(g)){ const cells=g.houses[hi].cells; let once=0, twice=0;
    for(const c of cells){ const m=cand[c]; twice|=once&m; once|=m; } const sg=once&~twice; if(!sg) continue;
    const d=lowDigit(sg), bit=1<<(d-1); for(const c of cells) if(cand[c]&bit) return {t:'hs',place:[c,d],houses:[hi],d}; }
  return null; }

// ===================== Sudoku core =====================
// Save, XP and levels, hints, records, stars, the bank, Classic picks, campaign, the Daily, achievements,
// cosmetics, backup and the Arcade contract. No DOM: storage is passed in, so Node tests can run it.
const VERSION='0.1.0', GAME_ID='sudoku', KEY='sudoku.v1', SUMKEY='arcade.summary.sudoku', ARCADE_KEY='arcade.v1';
const MAXL=10, LVXP=[0,50,150,300,525,825,1225,1725,2375,3175]; // Sweep's first 10 steps: 50,100,150,225,300,400,500,650,800
const levelOf=xp=>{ let l=1; while(l<MAXL&&xp>=LVXP[l]) l++; return l; };
const SHARED=['appearance','motion','sfx','music','haptics','fullscreen','cb','lefty','lang'];
const HINT_CAP=5, HINT_MAX=99;

function defSave(reduced){ return {v:1,xp:0,ach:{},camp:{},campTab:0,hints:HINT_CAP,hintDate:'',
  setup:{variant:'classic',grade:'normal'},used:{},
  rec:{by:{},clears:0,underPar:0,classicWins:0,top:{}},
  daily:{date:'',scored:false,cleared:false,stars:0,time:0,mistakes:0,assisted:false,run:null,practice:null},
  dhist:{},dstreak:{cur:0,best:0,last:''},dweek:[0,0,0,0,0,0,0],dclears:0,d3:0,
  look:{theme:'paper',font:'inter',notes:'grid',hl:'accent',comp:'ripple',win:'none',track:'inkwell',amb:'none',sound:'soft'},
  prefs:{check:true,autoNotes:true,hlSame:true,hlHouse:true,digitFirst:false,large:false,speed:'normal',contrast:false,cbhl:false},
  sfx:true,music:true,haptics:true,motion:!reduced,appearance:'system',fullscreen:false,cb:false,lefty:false,lang:'auto',name:'',
  run:null,seenVer:'',bk:{last:0},howto:false}; }
const defRec=()=>({games:0,wins:0,cur:0,best:0,bt:0,fm:-1});
const NESTED=['setup','rec','daily','dstreak','look','prefs','bk'];
// Old saves missing new fields are filled in from defSave() (one level deep for nested groups)
function loadSave(raw,reduced){ const d=defSave(reduced); let s=null; try{ s=raw?JSON.parse(raw):null; }catch(e){ s=null; }
  if(!s||typeof s!=='object') return d;
  for(const k in d){ if(s[k]===undefined) continue;
    if(NESTED.includes(k)&&s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])) d[k]=Object.assign(d[k],s[k]); else d[k]=s[k]; }
  for(const k in d.rec.by) d.rec.by[k]=Object.assign(defRec(),d.rec.by[k]);
  return d; }

// ---------- the bank ----------
const BANK={};
function bankList(variant,grade){ const k=variant+'|'+grade; if(!BANK[k]){ const raw=BANK_RAW[k]||'', NN=VARIANTS[variant].N**2, jig=!!VARIANTS[variant].jig;
    BANK[k]=raw?raw.split(',').map((e,i)=>{ const d=decPuzzle(e,NN,jig); return {variant,grade,k:i,givens:d.givens,regions:jig?BANK_REGIONS[d.layout]:null,layout:d.layout}; }):[]; }
  return BANK[k]; }
// solution, grade and par time of a puzzle (computed once, from the logic solver)
const INFO={};
function puzzleInfo(p){ const key=p.variant+'|'+p.givens+'|'+(p.regions||''); if(INFO[key]) return INFO[key];
  const g=geom(p.variant,p.regions), r=logicSolve(g,toVals(p.givens),3);
  return INFO[key]={sol:r.solved?toStr(r.vals):toStr(solveExact(g,toVals(p.givens),1).sol),grade:GRADES[r.grade],hardest:r.hardest,counts:r.counts,par:parSeconds(p.variant,r.counts)}; }
const fmtTime=ms=>{ const s=Math.floor(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const variantName=v=>VARIANTS[v].name;
const puzzleLabel=p=>`${variantName(p.variant)} · ${GRADE_NAMES[p.grade]}`;

// ---------- Classic: pick from the bank, no repeats until that part of the bank is used up ----------
function pickBank(S,variant,grade,rnd){ const pool=bankList(variant,grade); if(!pool.length) return null; const key=variant+'|'+grade;
  let used=S.used[key]||[]; let left=pool.filter(p=>!used.includes(p.k)); if(!left.length){ used=[]; left=pool; }
  const p=left[Math.floor(rnd()*left.length)]; used.push(p.k); S.used[key]=used; return Object.assign({src:'bank'},p); }
const canGenerate=(variant,grade)=>(GEN_ON_PHONE[variant]||[]).includes(grade);

// ---------- cosmetics ----------
// Unlocks: lvl (XP level), req (an achievement) or stars (campaign star total). Digits always stay instantly readable:
// givens and player digits always differ in weight and colour, and every font is tested at 38 px cells.
const COS={
 theme:[{id:'paper',name:'Paper'},{id:'slate',name:'Slate',lvl:2},{id:'graph',name:'Graph Paper',lvl:6},{id:'midnight',name:'Midnight',lvl:9},{id:'sakura',name:'Sakura',stars:75},{id:'terminal',name:'Terminal',req:'wing'}],
 font:[{id:'inter',name:'Inter'},{id:'mono',name:'JetBrains Mono',lvl:5},{id:'serif',name:'Serif',lvl:8},{id:'rounded',name:'Rounded',lvl:10},{id:'hand',name:'Handwritten',req:'pencil'}],
 notes:[{id:'grid',name:'Grid'},{id:'corner',name:'Corner',lvl:3},{id:'centre',name:'Centre',lvl:7}],
 hl:[{id:'accent',name:'Accent'},{id:'sky',name:'Sky',lvl:3},{id:'mint',name:'Mint',lvl:6},{id:'amber',name:'Amber',lvl:8},{id:'violet',name:'Violet',lvl:10}],
 comp:[{id:'ripple',name:'Ripple'},{id:'shimmer',name:'Shimmer',lvl:5},{id:'pulse',name:'Pulse',lvl:8},{id:'sweep',name:'Sweep',req:'poly'}],
 win:[{id:'none',name:'None'},{id:'confetti',name:'Confetti',lvl:2},{id:'fireworks',name:'Fireworks',lvl:7},{id:'rain',name:'Digit Rain',stars:30},{id:'glow',name:'Grid Glow',stars:135}],
 track:[{id:'inkwell',name:'Inkwell'},{id:'lanterns',name:'Lanterns',lvl:10},{id:'daylight',name:'Daylight',req:'dstar1'}],
 amb:[{id:'none',name:'No ambience'},{id:'rain',name:'Rain',lvl:4},{id:'cafe',name:'Café',lvl:7},{id:'library',name:'Library',req:'scholar'}],
 sound:[{id:'soft',name:'Soft'},{id:'pencil',name:'Pencil',lvl:4},{id:'chip',name:'Chiptune',lvl:9}]};
const COS_KINDS=[['theme','Board theme'],['font','Digit font'],['notes','Note style'],['hl','Highlight colour'],['comp','Completion effect'],['win','Win effect'],['track','Music'],['amb','Ambience'],['sound','Sound pack']];
const owned=(S,it)=>(!it.lvl||levelOf(S.xp)>=it.lvl)&&(!it.req||!!S.ach[it.req])&&(!it.stars||totalStars(S)>=it.stars);
const findCos=(kind,id)=>COS[kind].find(c=>c.id===id)||COS[kind][0];
function rewardsAt(level){ const o=[]; for(const [k,n] of COS_KINDS) for(const it of COS[k]) if(it.lvl===level) o.push(`${it.name} (${n.toLowerCase()})`); return o; }
const STARTER='Paper board, Inter digits, Grid notes, Ripple completion, Inkwell music, Soft sounds';
const starUnlocks=()=>COS_KINDS.flatMap(([k,n])=>COS[k].filter(it=>it.stars).map(it=>({stars:it.stars,text:`${it.name} (${n.toLowerCase()})`}))).sort((a,b)=>a.stars-b.stars);

// ---------- hints: refilled daily to 5, +1 per level-up, earned extras stack to 99 ----------
function refreshHints(S,today){ if(S.hintDate!==today){ S.hints=Math.max(S.hints||0,HINT_CAP); S.hintDate=today; } return S.hints; }
function useHint(S){ if(S.hints<=0) return false; S.hints--; return true; }

// ---------- XP ----------
function addXP(S,n){ const before=levelOf(S.xp); S.xp+=Math.max(0,Math.round(n)); const after=levelOf(S.xp), rewards=[];
  for(let l=before+1;l<=after;l++) rewards.push(...rewardsAt(l));
  const ups=after-before; if(ups>0) S.hints=Math.min(HINT_MAX,(S.hints||0)+ups); // +1 hint per level-up
  return {xp:Math.round(n),before,after,rewards,hints:ups}; }
const xpNext=S=>{ const l=levelOf(S.xp); return l>=MAXL?null:LVXP[l]; };
const CLASSIC_XP={easy:10,normal:15,hard:22,expert:30};
// Classic win by grade; an assisted win (a hint or a red mistake) earns half. Losses earn nothing.
const classicXP=(grade,assisted)=>assisted?Math.ceil(CLASSIC_XP[grade]/2):CLASSIC_XP[grade];

// ---------- stars: ★ clear, ★ under par time, ★ no assists (no hints and no mistakes) ----------
const assistedOf=(hints,mistakes)=>hints>0||mistakes>0;
function winStars(won,time,par,assisted){ return [won?1:0,won&&time<=par*1000?1:0,won&&!assisted?1:0]; }

// ---------- records ----------
// Wins, best time (unassisted), fewest mistakes and the win streak, per variant × difficulty. A started Classic game
// that is abandoned counts as a loss for the streak.
const recOf=(S,v,g)=>S.rec.by[v+'|'+g]||(S.rec.by[v+'|'+g]=defRec());
function recordClassic(S,p,won,time,mistakes,assisted){ const r=recOf(S,p.variant,p.grade), fresh=[];
  r.games++; if(won){ r.wins++; r.cur++; r.best=Math.max(r.best,r.cur); S.rec.classicWins++;
    if(!assisted&&(!r.bt||time<r.bt)){ r.bt=time; fresh.push('Best time'); }
    if(r.fm<0||mistakes<r.fm){ if(r.fm>=0) fresh.push('Fewest mistakes'); r.fm=mistakes; } } else r.cur=0;
  return fresh; }
// every cleared puzzle (Classic, campaign or the Daily's scored attempt) counts toward the cumulative clears
function countClear(S,p,time,par){ S.rec.clears++; if(time<=par*1000) S.rec.underPar++; }

// ---------- campaign ----------
const campOf=(S,id)=>S.camp[id]||{c:0,s:[0,0,0],bt:0,tries:0};
const campStars=(S,id)=>campOf(S,id).s.reduce((a,b)=>a+b,0);
const totalStars=S=>LEVELS.reduce((a,L)=>a+campStars(S,L.id),0);
const campCleared=(S,id)=>!!campOf(S,id).c;
const campDone=(S,c)=>campCleared(S,LEVELS.find(L=>L.camp===c&&L.n===15).id);
const campOpen=(S,c)=>c===0||campDone(S,c-1);
// clearing a level unlocks the next; clearing level 15 unlocks the next campaign
const unlocked=(S,Lv)=>campOpen(S,Lv.camp)&&(Lv.n===1||campCleared(S,LEVELS.find(L=>L.camp===Lv.camp&&L.n===Lv.n-1).id));
const levelById=id=>LEVELS.find(L=>L.id===id);
// the rules a level plays under (its twist)
const levelCfg=L=>({notes:L.twist!=='nonotes',check:L.twist==='nocheck'?false:undefined,limit:L.twist==='limit'?3:0});
const levelPuzzle=L=>({variant:L.variant,grade:L.grade,givens:L.givens,regions:L.regions||null,notes:L.notes||null,seed:L.id,par:L.par,src:'level'});
// Stars build up across attempts (each is earned once). Clearing is required for any star.
function campaignResult(S,Lv,won,time,assisted){ const c=campOf(S,Lv.id), C=CAMPS[Lv.camp], wasDone=campDone(S,Lv.camp), fresh=[]; let xp=0;
  const earned=winStars(won,time,Lv.par,assisted);
  c.tries=(c.tries||0)+1;
  if(won){ c.c=1; if(!c.bt||time<c.bt) c.bt=time; }
  earned.forEach((e,i)=>{ if(e&&!c.s[i]){ c.s[i]=1; fresh.push(i); xp+=C.xp; } });
  S.camp[Lv.id]=c; const finished=!wasDone&&campDone(S,Lv.camp); if(finished) xp+=C.bonus;
  return {earned,fresh,stars:campStars(S,Lv.id),xp,finished}; }

// ---------- Daily ----------
// SUDD1|YYYY-MM-DD picks the day's puzzle from the bank; difficulty by weekday, matching Solitaire and Mahjong.
const DAILY_TABLE=[ // index = getDay(): 0 Sunday … 6 Saturday
  {variant:'classic',grade:'expert'},{variant:'classic',grade:'easy'},{variant:'classic',grade:'normal'},{variant:'diag',grade:'normal'},
  {variant:'classic',grade:'hard'},{variant:'jigsaw',grade:'hard'},{variant:'diag',grade:'hard'}];
const weekdayOf=date=>{ const [y,m,d]=date.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)).getUTCDay(); };
function dailyPuzzle(date){ const w=DAILY_TABLE[weekdayOf(date)], pool=bankList(w.variant,w.grade), r=rngFor('SUDD1|'+date);
  const p=pool[Math.floor(r()*pool.length)]; return Object.assign({},p,{daily:date,seed:'SUDD1|'+date,src:'daily',par:puzzleInfo(p).par}); }
const dailyFingerprint=date=>{ const p=dailyPuzzle(date); return `${p.variant}|${p.grade}|${p.k}`; };
function dailyFor(S,date){ if(S.daily.date!==date) S.daily={date,scored:false,cleared:false,stars:0,time:0,mistakes:0,assisted:false,run:null,practice:null}; return S.daily; }
const dayNum=date=>{ const [y,m,d]=date.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); };
// The one scored attempt. Ending it without clearing counts as the attempt too.
function dailyResult(S,date,won,time,mistakes,assisted,today){ const d=dailyFor(S,date); if(d.scored) return null; const p=dailyPuzzle(date);
  const st=winStars(won,time,p.par,assisted), stars=st.reduce((a,b)=>a+b,0);
  Object.assign(d,{scored:true,cleared:won,stars,time,mistakes,assisted,run:null});
  S.dhist[date]={won,stars,time,assisted,variant:p.variant}; const keys=Object.keys(S.dhist).sort(); while(keys.length>7) delete S.dhist[keys.shift()]; // the last 7 Dailies
  let xp=0;
  if(won){ S.dclears=(S.dclears||0)+1; xp=20*(date===today?2:1); if(stars===3) S.d3=(S.d3||0)+1;
    const n=dayNum(date), last=S.dstreak.last?dayNum(S.dstreak.last):-99;
    if(n!==last){ S.dstreak.cur=n===last+1?S.dstreak.cur+1:1; S.dstreak.last=date; S.dstreak.best=Math.max(S.dstreak.best,S.dstreak.cur); }
    if(stars===3) S.dweek[weekdayOf(date)]=1; }
  return {stars:st,xp,won}; }
// a streak is broken once a whole day has passed without a cleared Daily
function streakNow(S,today){ const last=S.dstreak.last?dayNum(S.dstreak.last):-99; if(dayNum(today)-last>1) S.dstreak.cur=0; return S.dstreak.cur; }
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function shareLine(date,time,stars,assisted,won){ const [,m,dd]=date.split('-').map(Number), n=stars.reduce?stars.reduce((a,b)=>a+b,0):stars, p=dailyPuzzle(date);
  return `Sudoku Daily · ${WD[weekdayOf(date)]} ${dd} ${MON[m-1]} · ${variantName(p.variant)} · ${won?fmtTime(time):'not cleared'} · ${'★'.repeat(n)}${'☆'.repeat(3-n)}${assisted?' · assisted':''}`; }

// ctx: {mode, won, p (variant, grade), time, par, assisted, fillUsed, notesUsed, counts (techniques the puzzle needs), practice}
function checkAch(S,ctx){ const got=[], give=id=>{ if(!S.ach[id]){ S.ach[id]=Date.now(); got.push(id); } };
  if(ctx.practice) return got;
  if(ctx.won&&ctx.p){ const p=ctx.p, g=p.grade, gi=GRADES.indexOf(g);
    give('g_'+g); if(ctx.time<=ctx.par*1000) give('p_'+g); if(!ctx.assisted) give('a_'+g);
    if(p.variant!=='classic') give('v_'+p.variant);
    const top=S.rec.top; if(gi>=2||(p.variant==='mini'&&g==='normal')) top[p.variant]=1;
    if(['classic','diag','jigsaw','mini'].every(v=>top[v])) give('poly');
    for(const a of ACH) if(a.g==='Puzzles solved'&&S.rec.clears>=a.n) give(a.id);
    if(ctx.counts&&(ctx.counts.xy||ctx.counts.xyz)) give('wing');
    if(gi>=2&&!ctx.fillUsed) give('pencil'); if(gi>=1&&!ctx.notesUsed) give('ink'); }
  if(ctx.mode==='campaign'){ CAMPS.forEach((cp,i)=>{ if(campDone(S,i)) give('camp'+(i+1)); if(LEVELS.filter(L=>L.camp===i).every(L=>campStars(S,L.id)>=3)) give('perf'+(i+1)); });
    if(LEVELS.filter(L=>L.type==='tech').every(L=>campStars(S,L.id)>=3)) give('scholar'); }
  if(ctx.mode==='daily'){ const n=S.dclears||0, s3=S.d3||0; if(n>=7) give('d7'); if(n>=30) give('d30'); if(n>=100) give('d100');
    if(s3>=1) give('dstar1'); if(s3>=10) give('dstar10'); if(s3>=30) give('dstar30'); if(S.dstreak.cur>=7) give('dstreak'); if(S.dweek.every(Boolean)) give('dweek'); }
  return got; }
const achProgress=(S,a)=>a.g==='Puzzles solved'?Math.min(S.rec.clears,a.n):/^d\d/.test(a.id)?Math.min(S.dclears||0,a.n):/^dstar/.test(a.id)?Math.min(S.d3||0,a.n):a.id==='dweek'?S.dweek.filter(Boolean).length:null;
const achTotal=a=>a.n||(a.id==='dweek'?7:null);

// ---------- backup (Sudoku only) ----------
// SUDOKU1Z.<base64 gzip> where the app can compress, SUDOKU1.<base64> otherwise. Both decode here (the app inflates Z).
const b64e=str=>{ const u=new TextEncoder().encode(str); let b=''; for(let i=0;i<u.length;i++) b+=String.fromCharCode(u[i]); return btoa(b); };
const b64d=b=>new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)));
function backupPlain(S){ return 'SUDOKU1.'+b64e(JSON.stringify(S)); }
function parseBackup(text){ const m=/SUDOKU1\.([A-Za-z0-9+/=]+)/.exec(String(text||'')); if(!m) return null;
  try{ const o=JSON.parse(b64d(m[1])); if(!o||typeof o!=='object'||typeof o.xp!=='number') return null; return o; }catch(e){ return null; } }

// Shared settings live in arcade.v1 (read only, never written). They're applied in memory only.
function readArcade(store){ try{ const a=JSON.parse(store.get(ARCADE_KEY)||'null'); if(!a||typeof a!=='object') return null; return a; }catch(e){ return null; } }
function applyShared(S,a){ if(!a) return S; const o=Object.assign({},S), set=a.set||{}; for(const k of SHARED) if(set[k]!==undefined) o[k]=set[k]; if(typeof a.name==='string'&&a.name) o.name=a.name; return o; }
function summary(S){ const l=levelOf(S.xp);
  return {v:1,game:GAME_ID,ver:VERSION,level:l,maxLevel:MAXL,xp:S.xp,xpLevel:l,xpNext:xpNext(S),
    ach:ACH.map(a=>[a.name,a.desc,!!S.ach[a.id]]),
    hi:[['Puzzles solved',String(S.rec.clears)],['Campaign stars',`${totalStars(S)}/${LEVELS.length*3}`],['Daily streak',String(S.dstreak.cur)]],
    last:Date.now()}; }

["Each row, column and box holds 1 to 6 once. Look for the only spot a digit can go.","Cada fila, columna y bloque tiene del 1 al 6 una vez. Busca el único sitio donde puede ir un dígito.","Chaque ligne, colonne et bloc contient 1 à 6 une fois. Cherchez la seule place possible d'un chiffre.","Jede Zeile, Spalte und jeder Block enthält 1 bis 6 genau einmal. Suche den einzigen Platz für eine Ziffer.","Cada linha, coluna e bloco tem de 1 a 6 uma vez. Procure o único lugar onde um dígito pode ir."],
["Pick a digit and find the box where it can only go in one cell.","Elige un dígito y busca el bloque donde solo puede ir en una casilla.","Choisissez un chiffre et trouvez le bloc où il ne peut aller que dans une case.","Wähle eine Ziffer und finde den Block, in dem sie nur in eine Zelle passt.","Escolha um dígito e ache o bloco onde ele só cabe numa casa."],
["The full 9×9 grid: rows, columns and 3×3 boxes each hold 1 to 9 once.","La cuadrícula completa de 9×9: filas, columnas y bloques de 3×3 tienen del 1 al 9 una vez.","La grille 9×9 complète : lignes, colonnes et blocs 3×3 contiennent 1 à 9 une fois.","Das ganze 9×9-Gitter: Zeilen, Spalten und 3×3-Blöcke enthalten 1 bis 9 je einmal.","A grade 9×9 completa: linhas, colunas e blocos 3×3 têm de 1 a 9 uma vez."],
["A Mini that needs one step beyond singles. Notes help here.","Un Mini que necesita un paso más allá de los únicos. Las notas ayudan.","Un Mini qui demande une étape au-delà des singletons. Les notes aident.","Ein Mini, das einen Schritt über Singles hinaus braucht. Notizen helfen.","Um Mini que precisa de um passo além dos únicos. As notas ajudam."],
["Scan a digit across three boxes in a band to find where it must go.","Recorre un dígito por tres bloques en franja para ver dónde debe ir.","Suivez un chiffre sur trois blocs alignés pour trouver où il doit aller.","Verfolge eine Ziffer über drei Blöcke einer Reihe, um ihren Platz zu finden.","Percorra um dígito por três blocos em faixa para achar onde ele deve ir."],
["When a cell has only one digit left, place it. Fill notes can show you.","Cuando a una casilla solo le queda un dígito, colócalo. Rellenar notas te lo muestra.","Quand une case n'a plus qu'un chiffre possible, placez-le. Remplir les notes vous le montre.","Wenn in eine Zelle nur noch eine Ziffer passt, setze sie. Notizen füllen zeigt es dir.","Quando só resta um dígito para uma casa, coloque-o. Preencher notas mostra isso."],
["Twist: a 4th mistake ends the level. Take your time.","Giro: el 4.º error termina el nivel. Tómate tu tiempo.","Variante : la 4e erreur termine le niveau. Prenez votre temps.","Twist: Der 4. Fehler beendet das Level. Lass dir Zeit.","Variação: o 4.º erro encerra o nível. Sem pressa."],
["New: both long diagonals also hold 1 to 9 once.","Nuevo: las dos diagonales largas también tienen del 1 al 9 una vez.","Nouveau : les deux grandes diagonales contiennent aussi 1 à 9 une fois.","Neu: Auch beide langen Diagonalen enthalten 1 bis 9 je einmal.","Novo: as duas diagonais longas também têm de 1 a 9 uma vez."],
["Normal puzzles need notes. Look for a digit stuck in one row of a box.","Los sudokus normales necesitan notas. Busca un dígito atrapado en una fila de un bloque.","Les grilles normales demandent des notes. Cherchez un chiffre coincé dans une ligne d'un bloc.","Normale Rätsel brauchen Notizen. Suche eine Ziffer, die in einem Block auf eine Zeile beschränkt ist.","Sudokus normais precisam de notas. Procure um dígito preso numa linha de um bloco."],
["Technique: hidden single. One digit has only one possible cell in a box, row or column.","Técnica: único oculto. Un dígito tiene una sola casilla posible en un bloque, fila o columna.","Technique : singleton caché. Un chiffre n'a qu'une case possible dans un bloc, une ligne ou une colonne.","Technik: versteckter Single. Eine Ziffer hat in einem Block, einer Zeile oder Spalte nur eine mögliche Zelle.","Técnica: único oculto. Um dígito tem só uma casa possível num bloco, linha ou coluna."],
["Two cells in a house that share the same two notes lock those digits in.","Dos casillas de una misma zona con las mismas dos notas se quedan esos dígitos.","Deux cases d'une même zone avec les deux mêmes notes bloquent ces chiffres.","Zwei Zellen einer Einheit mit denselben zwei Notizen binden diese Ziffern.","Duas casas de uma mesma área com as mesmas duas notas prendem esses dígitos."],
["A trickier Mini. Pointing works in 2×3 boxes too.","Un Mini más difícil. El apuntado también funciona en bloques de 2×3.","Un Mini plus coriace. Le pointage marche aussi dans les blocs 2×3.","Ein kniffligeres Mini. Zeigen klappt auch in 2×3-Blöcken.","Um Mini mais difícil. O apontamento também funciona em blocos 2×3."],
["Fill notes, then clear them as you place digits.","Rellena las notas y bórralas al colocar dígitos.","Remplissez les notes, puis effacez-les en plaçant les chiffres.","Fülle die Notizen und räume sie beim Setzen der Ziffern auf.","Preencha as notas e limpe-as ao colocar dígitos."],
["Twist: no notes on this level. Keep the candidates in your head.","Giro: sin notas en este nivel. Guarda los candidatos en la cabeza.","Variante : pas de notes sur ce niveau. Gardez les candidats en tête.","Twist: Keine Notizen in diesem Level. Behalte die Kandidaten im Kopf.","Variação: sem notas neste nível. Guarde os candidatos de cabeça."],
["The hardest Normal puzzle in Novice. Clear it to graduate.","El sudoku normal más difícil de Novato. Supéralo para graduarte.","La grille normale la plus dure de Novice. Réussissez-la pour être diplômé.","Das schwerste normale Rätsel bei Anfänger. Löse es zum Abschluss.","O sudoku normal mais difícil de Iniciante. Resolva para se formar."],
["Welcome to Adept: Normal and Hard puzzles, with Diagonal and Jigsaw.","Bienvenido a Adepto: sudokus normales y difíciles, con Diagonal y Jigsaw.","Bienvenue en Adepte : grilles normales et difficiles, avec Diagonale et Puzzle.","Willkommen bei Fortgeschritten: normale und schwere Rätsel, mit Diagonal und Puzzle.","Bem-vindo ao Adepto: sudokus normais e difíceis, com Diagonal e Quebra-cabeça."],
["Pointing and claiming: a digit locked into one line of a box, or one box of a line.","Apuntado y reclamo: un dígito atrapado en una línea de un bloque, o en un bloque de una línea.","Pointage et réclamation : un chiffre bloqué sur une ligne d'un bloc, ou dans un bloc d'une ligne.","Zeigen und Beanspruchen: Eine Ziffer ist auf eine Linie eines Blocks oder einen Block einer Linie beschränkt.","Apontamento e reivindicação: um dígito preso numa linha de um bloco, ou num bloco de uma linha."],
["Hidden pairs: two digits that can only go in the same two cells.","Parejas ocultas: dos dígitos que solo pueden ir en las mismas dos casillas.","Paires cachées : deux chiffres qui ne peuvent aller que dans les deux mêmes cases.","Versteckte Paare: zwei Ziffern, die nur in dieselben zwei Zellen passen.","Pares ocultos: dois dígitos que só podem ir nas mesmas duas casas."],
["Diagonals are houses too: pairs and pointing work along them.","Las diagonales también cuentan: las parejas y el apuntado funcionan en ellas.","Les diagonales comptent aussi : paires et pointage marchent le long d'elles.","Diagonalen zählen auch: Paare und Zeigen funktionieren entlang ihnen.","As diagonais também contam: pares e apontamento funcionam nelas."],
["Hard puzzles need bigger patterns: triples, X-Wings and XY-Wings.","Los sudokus difíciles necesitan patrones mayores: tríos, X-Wings y XY-Wings.","Les grilles difficiles demandent de plus grands motifs : triplets, X-Wings et XY-Wings.","Schwere Rätsel brauchen größere Muster: Tripel, X-Wings und XY-Wings.","Sudokus difíceis pedem padrões maiores: trios, X-Wings e XY-Wings."],
["XY-Wing: a cell with two notes and two cells it sees, sharing a third digit.","XY-Wing: una casilla con dos notas y dos casillas que ve, que comparten un tercer dígito.","XY-Wing : une case à deux notes et deux cases qu'elle voit, qui partagent un troisième chiffre.","XY-Wing: eine Zelle mit zwei Notizen und zwei Zellen, die sie sieht, mit einer gemeinsamen dritten Ziffer.","XY-Wing: uma casa com duas notas e duas casas que ela vê, que partilham um terceiro dígito."],
["Twist: mistake check is off. Wrong digits only show as clashes.","Giro: la revisión de errores está apagada. Los dígitos incorrectos solo se ven si chocan.","Variante : la vérification est désactivée. Les erreurs n'apparaissent qu'en cas de conflit.","Twist: Die Fehlerprüfung ist aus. Falsche Ziffern zeigen sich nur bei Konflikten.","Variação: a verificação de erros está desligada. Dígitos errados só aparecem quando se repetem."],
["New: Jigsaw. The regions are irregular, outlined in bold.","Nuevo: Jigsaw. Las regiones son irregulares, con borde grueso.","Nouveau : Puzzle. Les régions sont irrégulières, tracées en gras.","Neu: Puzzle. Die Regionen sind unregelmäßig und fett umrandet.","Novo: Quebra-cabeça. As regiões são irregulares, com contorno grosso."],
["X-Wing: in two rows, a digit sits only in the same two columns.","X-Wing: en dos filas, un dígito solo está en las mismas dos columnas.","X-Wing : dans deux lignes, un chiffre n'est que dans les deux mêmes colonnes.","X-Wing: In zwei Zeilen steht eine Ziffer nur in denselben zwei Spalten.","X-Wing: em duas linhas, um dígito só está nas mesmas duas colunas."],
["Technique: pointing. In one box, a digit sits only in one row or column, so it comes out of the rest of that line.","Técnica: apuntado. En un bloque, un dígito solo está en una fila o columna, así que sale del resto de esa línea.","Technique : pointage. Dans un bloc, un chiffre n'est que sur une ligne ou une colonne, donc il sort du reste de cette ligne.","Technik: Zeigen. In einem Block steht eine Ziffer nur in einer Zeile oder Spalte, also fällt sie im Rest dieser Linie weg.","Técnica: apontamento. Num bloco, um dígito só está numa linha ou coluna, então sai do resto dessa linha."],
["When singles run out, scan for pairs, then triples, then wings.","Cuando se acaban los únicos, busca parejas, luego tríos y luego alas.","Quand les singletons s'épuisent, cherchez des paires, puis des triplets, puis des ailes.","Wenn die Singles ausgehen, suche Paare, dann Tripel, dann Wings.","Quando os únicos acabam, procure pares, depois trios, depois asas."],
["A Hard Jigsaw. Odd regions make pointing and claiming more common.","Un Jigsaw difícil. Las regiones raras hacen más comunes el apuntado y el reclamo.","Un Puzzle difficile. Les régions bizarres rendent pointage et réclamation plus fréquents.","Ein schweres Puzzle. Ungewöhnliche Regionen machen Zeigen und Beanspruchen häufiger.","Um Quebra-cabeça difícil. Regiões estranhas tornam apontamento e reivindicação mais comuns."],
["Keep your notes tidy: one stray note can hide a pattern.","Mantén las notas ordenadas: una nota de más puede ocultar un patrón.","Gardez vos notes propres : une note de trop peut cacher un motif.","Halte deine Notizen sauber: Eine überflüssige Notiz kann ein Muster verstecken.","Mantenha as notas em ordem: uma nota a mais pode esconder um padrão."],
["Twist: a tight par time for the second star.","Giro: un tiempo par ajustado para la segunda estrella.","Variante : un temps par serré pour la deuxième étoile.","Twist: eine knappe Par-Zeit für den zweiten Stern.","Variação: um tempo par apertado para a segunda estrela."],
["The hardest Hard puzzle in Adept. Clear it to finish the campaign.","El sudoku difícil más duro de Adepto. Supéralo para terminar la campaña.","La grille difficile la plus dure d'Adepte. Réussissez-la pour finir la campagne.","Das schwerste schwere Rätsel bei Fortgeschritten. Löse es, um die Kampagne abzuschließen.","O sudoku difícil mais duro do Adepto. Resolva para terminar a campanha."],
["Master: Hard and Expert across every variant.","Maestro: difícil y experto en todas las variantes.","Maître : difficile et expert dans toutes les variantes.","Meister: Schwer und Experte in allen Varianten.","Mestre: difícil e especialista em todas as variantes."],
["Expert puzzles need Swordfish, XYZ-Wings or colouring.","Los sudokus expertos necesitan Swordfish, XYZ-Wings o coloreado.","Les grilles expertes demandent Swordfish, XYZ-Wings ou coloriage.","Expertenrätsel brauchen Swordfish, XYZ-Wings oder Färbung.","Sudokus de especialista pedem Swordfish, XYZ-Wings ou coloração."],
["Simple colouring: follow a digit through cells where it has only two spots.","Coloreado simple: sigue un dígito por casillas donde solo tiene dos sitios.","Coloriage simple : suivez un chiffre à travers les zones où il n'a que deux places.","Einfache Färbung: Verfolge eine Ziffer durch Einheiten, in denen sie nur zwei Plätze hat.","Coloração simples: siga um dígito pelas áreas onde ele só tem dois lugares."],
["A tough Jigsaw. Check every region for locked digits.","Un Jigsaw duro. Revisa cada región en busca de dígitos atrapados.","Un Puzzle coriace. Vérifiez chaque région pour les chiffres bloqués.","Ein hartes Puzzle. Prüfe jede Region auf gebundene Ziffern.","Um Quebra-cabeça duro. Verifique cada região em busca de dígitos presos."],
["A Swordfish is an X-Wing across three rows and three columns.","Un Swordfish es un X-Wing en tres filas y tres columnas.","Un Swordfish est un X-Wing sur trois lignes et trois colonnes.","Ein Swordfish ist ein X-Wing über drei Zeilen und drei Spalten.","Um Swordfish é um X-Wing em três linhas e três colunas."],
["XYZ-Wing: a three-note cell and two two-note cells it sees.","XYZ-Wing: una casilla con tres notas y dos de dos notas que ve.","XYZ-Wing : une case à trois notes et deux cases à deux notes qu'elle voit.","XYZ-Wing: eine Zelle mit drei Notizen und zwei Zellen mit zwei Notizen, die sie sieht.","XYZ-Wing: uma casa com três notas e duas casas com duas notas que ela vê."],
["Twist: a 4th mistake ends the level.","Giro: el 4.º error termina el nivel.","Variante : la 4e erreur termine le niveau.","Twist: Der 4. Fehler beendet das Level.","Variação: o 4.º erro encerra o nível."],
["An Expert Diagonal. The diagonals add colouring chains.","Un Diagonal experto. Las diagonales añaden cadenas de coloreado.","Une Diagonale experte. Les diagonales ajoutent des chaînes de coloriage.","Ein Experten-Diagonal. Die Diagonalen bringen Färbungsketten.","Um Diagonal de especialista. As diagonais trazem cadeias de coloração."],
["If you're stuck, colour a digit with only two spots in many houses.","Si te atascas, colorea un dígito que solo tenga dos sitios en muchas zonas.","Si vous bloquez, coloriez un chiffre qui n'a que deux places dans plusieurs zones.","Wenn du feststeckst, färbe eine Ziffer, die in vielen Einheiten nur zwei Plätze hat.","Se travar, pinte um dígito que só tenha dois lugares em várias áreas."],
["Technique: X-Wing. In two rows a digit sits only in the same two columns, so it comes out of the rest of those columns.","Técnica: X-Wing. En dos filas un dígito solo está en las mismas dos columnas, así que sale del resto de esas columnas.","Technique : X-Wing. Dans deux lignes, un chiffre n'est que dans les deux mêmes colonnes, donc il sort du reste de ces colonnes.","Technik: X-Wing. In zwei Zeilen steht eine Ziffer nur in denselben zwei Spalten, also fällt sie im Rest dieser Spalten weg.","Técnica: X-Wing. Em duas linhas um dígito só está nas mesmas duas colunas, então sai do resto dessas colunas."],
["Expert patterns can show up late. Keep looking.","Los patrones expertos pueden aparecer tarde. Sigue buscando.","Les motifs experts peuvent arriver tard. Continuez à chercher.","Expertenmuster können spät auftauchen. Such weiter.","Padrões de especialista podem aparecer tarde. Continue procurando."],

["Twist: mistake check is off.","Giro: la revisión de errores está apagada.","Variante : la vérification est désactivée.","Twist: Die Fehlerprüfung ist aus.","Variação: a verificação de erros está desligada."],

["This code holds your Sudoku progress: XP, stars, records, achievements, settings and games in progress. Keep it somewhere safe.","Este código guarda tu progreso de Sudoku: XP, estrellas, récords, logros, ajustes y partidas en curso. Guárdalo en un lugar seguro.","Ce code contient votre progression Sudoku : XP, étoiles, records, succès, réglages et parties en cours. Gardez-le en lieu sûr.","Dieser Code enthält deinen Sudoku-Fortschritt: XP, Sterne, Rekorde, Erfolge, Einstellungen und laufende Spiele. Bewahre ihn sicher auf.","Este código guarda seu progresso no Sudoku: XP, estrelas, recordes, conquistas, configurações e jogos em andamento. Guarde-o em lugar seguro."],

// ---- How to play ----
["Fill the grid so that every row, column and box holds each digit exactly once: 1 to 9 on Classic, 1 to 6 on Mini. The starting digits (givens) can't be changed.","Rellena la cuadrícula para que cada fila, columna y bloque tenga cada dígito exactamente una vez: del 1 al 9 en Clásico, del 1 al 6 en Mini. Los dígitos iniciales no se pueden cambiar.","Remplissez la grille pour que chaque ligne, colonne et bloc contienne chaque chiffre une seule fois : 1 à 9 en Classique, 1 à 6 en Mini. Les chiffres de départ ne peuvent pas être changés.","Fülle das Gitter so, dass jede Zeile, Spalte und jeder Block jede Ziffer genau einmal enthält: 1 bis 9 bei Klassisch, 1 bis 6 bei Mini. Die vorgegebenen Ziffern lassen sich nicht ändern.","Preencha a grade para que cada linha, coluna e bloco tenha cada dígito exatamente uma vez: de 1 a 9 no Clássico, de 1 a 6 no Mini. Os dígitos iniciais não podem ser mudados."],
["Mini: 6×6 with 2×3 boxes. Classic: 9×9 with 3×3 boxes. Diagonal: both long diagonals also hold 1 to 9. Jigsaw: the nine regions are irregular shapes, outlined in bold.","Mini: 6×6 con bloques de 2×3. Clásico: 9×9 con bloques de 3×3. Diagonal: las dos diagonales largas también tienen del 1 al 9. Jigsaw: las nueve regiones son formas irregulares con borde grueso.","Mini : 6×6 avec des blocs 2×3. Classique : 9×9 avec des blocs 3×3. Diagonale : les deux grandes diagonales contiennent aussi 1 à 9. Puzzle : les neuf régions sont irrégulières, tracées en gras.","Mini: 6×6 mit 2×3-Blöcken. Klassisch: 9×9 mit 3×3-Blöcken. Diagonal: Auch beide langen Diagonalen enthalten 1 bis 9. Puzzle: Die neun Regionen sind unregelmäßig und fett umrandet.","Mini: 6×6 com blocos 2×3. Clássico: 9×9 com blocos 3×3. Diagonal: as duas diagonais longas também têm de 1 a 9. Quebra-cabeça: as nove regiões são irregulares, com contorno grosso."],
["Placing digits","Colocar dígitos","Placer des chiffres","Ziffern setzen","Colocar dígitos"],
["Tap a cell, then a digit on the pad. Long-press a digit to lock it (digit-first), then tap cells to place it; tap the digit again to unlock. Notes turns the pad into pencil marks. Fill notes (in the pause menu) writes every legal candidate.","Toca una casilla y luego un dígito del teclado. Mantén pulsado un dígito para fijarlo y toca casillas para colocarlo; tócalo otra vez para soltarlo. Notas convierte el teclado en marcas de lápiz. Rellenar notas (en el menú de pausa) escribe todos los candidatos posibles.","Touchez une case, puis un chiffre du pavé. Appuyez longuement sur un chiffre pour le verrouiller, puis touchez des cases pour le placer ; touchez-le encore pour le libérer. Notes transforme le pavé en marques au crayon. Remplir les notes (menu pause) écrit tous les candidats possibles.","Tippe auf eine Zelle, dann auf eine Ziffer. Halte eine Ziffer gedrückt, um sie festzulegen, und tippe dann Zellen an; nochmal tippen löst sie. Notizen macht aus dem Tastenfeld Bleistiftnotizen. Notizen füllen (im Pausenmenü) schreibt alle möglichen Kandidaten.","Toque numa casa e depois num dígito do teclado. Segure um dígito para fixá-lo e toque nas casas para colocá-lo; toque de novo para soltar. Notas transforma o teclado em marcas a lápis. Preencher notas (no menu de pausa) escreve todos os candidatos possíveis."],
["Never a guess","Nunca a ciegas","Jamais de hasard","Nie raten","Nunca no chute"],
["Every puzzle has exactly one solution, and you can always find the next step by logic. Puzzles are graded by the hardest technique they need: Easy (singles), Normal (pointing, claiming, pairs), Hard (triples, X-Wing, XY-Wing) and Expert (Swordfish, XYZ-Wing, quads, simple colouring).","Cada sudoku tiene exactamente una solución y siempre puedes encontrar el siguiente paso con lógica. Se clasifican por la técnica más difícil que necesitan: Fácil (únicos), Normal (apuntado, reclamo, parejas), Difícil (tríos, X-Wing, XY-Wing) y Experto (Swordfish, XYZ-Wing, cuartetos, coloreado simple).","Chaque grille a une seule solution, et l'étape suivante se trouve toujours par la logique. Les grilles sont classées selon la technique la plus dure qu'elles demandent : Facile (singletons), Normal (pointage, réclamation, paires), Difficile (triplets, X-Wing, XY-Wing) et Expert (Swordfish, XYZ-Wing, quadruplets, coloriage simple).","Jedes Rätsel hat genau eine Lösung, und den nächsten Schritt findest du immer durch Logik. Rätsel werden nach der schwersten nötigen Technik eingestuft: Leicht (Singles), Normal (Zeigen, Beanspruchen, Paare), Schwer (Tripel, X-Wing, XY-Wing) und Experte (Swordfish, XYZ-Wing, Quartette, einfache Färbung).","Cada sudoku tem exatamente uma solução, e o próximo passo sempre se acha pela lógica. Eles são classificados pela técnica mais difícil que exigem: Fácil (únicos), Normal (apontamento, reivindicação, pares), Difícil (trios, X-Wing, XY-Wing) e Especialista (Swordfish, XYZ-Wing, quartetos, coloração simples)."],
["Hidden single: the 7s elsewhere in the rows and columns rule out every cell of this box but one, so 7 goes there.","Único oculto: los 7 de otras filas y columnas descartan todas las casillas de este bloque menos una, así que el 7 va ahí.","Singleton caché : les 7 des autres lignes et colonnes excluent toutes les cases de ce bloc sauf une, donc le 7 va là.","Versteckter Single: Die 7en in den anderen Zeilen und Spalten schließen alle Zellen dieses Blocks bis auf eine aus, also kommt die 7 dorthin.","Único oculto: os 7 de outras linhas e colunas descartam todas as casas deste bloco menos uma, então o 7 vai ali."],
["Pointing: inside the box (left), 4 can only go in its top row, so 4 can't go anywhere else in that row (right).","Apuntado: dentro del bloque (izquierda), el 4 solo puede ir en su fila de arriba, así que no puede ir en ningún otro sitio de esa fila (derecha).","Pointage : dans le bloc (à gauche), le 4 ne peut aller que sur sa ligne du haut, donc il ne peut aller nulle part ailleurs sur cette ligne (à droite).","Zeigen: Im Block (links) passt die 4 nur in seine oberste Zeile, also nirgends sonst in dieser Zeile (rechts).","Apontamento: dentro do bloco (esquerda), o 4 só pode ir na linha de cima, então não pode ir em nenhum outro lugar dessa linha (direita)."],
["X-Wing: in two rows, 4 can only go in the same two columns. One 4 goes in each of those columns, so 4 comes out of every other cell in them.","X-Wing: en dos filas, el 4 solo puede ir en las mismas dos columnas. Hay un 4 en cada una de esas columnas, así que el 4 sale de las demás casillas de ellas.","X-Wing : dans deux lignes, le 4 ne peut aller que dans les deux mêmes colonnes. Il y a un 4 dans chacune de ces colonnes, donc le 4 sort de toutes leurs autres cases.","X-Wing: In zwei Zeilen passt die 4 nur in dieselben zwei Spalten. In jede dieser Spalten kommt eine 4, also fällt die 4 in allen anderen Zellen dieser Spalten weg.","X-Wing: em duas linhas, o 4 só pode ir nas mesmas duas colunas. Há um 4 em cada uma dessas colunas, então o 4 sai de todas as outras casas delas."],
["★ Clear the puzzle. ★ Clear it under par time. ★ No assists: no hints and no red mistakes. Undo is free and never an assist.","★ Resuelve el sudoku. ★ Resuélvelo bajo el tiempo par. ★ Sin ayudas: sin pistas ni errores rojos. Deshacer es gratis y nunca cuenta como ayuda.","★ Résolvez la grille. ★ Sous le temps par. ★ Sans aide : ni indice ni erreur rouge. Annuler est gratuit et ne compte jamais comme une aide.","★ Löse das Rätsel. ★ Unter der Par-Zeit. ★ Ohne Hilfe: keine Tipps und keine roten Fehler. Rückgängig ist kostenlos und nie eine Hilfe.","★ Resolva o sudoku. ★ Abaixo do tempo par. ★ Sem ajuda: sem dicas e sem erros vermelhos. Desfazer é grátis e nunca conta como ajuda."],
["Hints and mistakes","Pistas y errores","Indices et erreurs","Tipps und Fehler","Dicas e erros"],
["A hint shows the next logical step and explains it. With mistake check on, a wrong digit turns red at once and counts as an assist. Two equal digits in one row, column or box are always outlined.","Una pista muestra el siguiente paso lógico y lo explica. Con la revisión de errores activada, un dígito incorrecto se pone rojo al instante y cuenta como ayuda. Dos dígitos iguales en una fila, columna o bloque siempre se marcan.","Un indice montre l'étape logique suivante et l'explique. Avec la vérification activée, un chiffre faux devient rouge aussitôt et compte comme une aide. Deux chiffres identiques sur une ligne, colonne ou bloc sont toujours encadrés.","Ein Tipp zeigt den nächsten logischen Schritt und erklärt ihn. Mit Fehlerprüfung wird eine falsche Ziffer sofort rot und zählt als Hilfe. Zwei gleiche Ziffern in einer Zeile, Spalte oder einem Block werden immer markiert.","Uma dica mostra o próximo passo lógico e explica. Com a verificação ligada, um dígito errado fica vermelho na hora e conta como ajuda. Dois dígitos iguais numa linha, coluna ou bloco são sempre destacados."],
["Classic: choose a variant and difficulty. Campaign: three campaigns of 15 levels, with twists and technique puzzles. Daily: the same puzzle for everyone, Easy on Monday and Expert on Sunday, with one scored attempt.","Clásico: elige variante y dificultad. Campaña: tres campañas de 15 niveles, con giros y niveles de técnica. Diario: el mismo sudoku para todos, fácil el lunes y experto el domingo, con un intento puntuado.","Classique : choisissez une variante et une difficulté. Campagne : trois campagnes de 15 niveaux, avec variantes et grilles de technique. Quotidien : la même grille pour tous, facile le lundi et expert le dimanche, avec une tentative notée.","Klassisch: Wähle Variante und Schwierigkeit. Kampagne: drei Kampagnen mit je 15 Levels, mit Twists und Technik-Rätseln. Tagesspiel: dasselbe Rätsel für alle, leicht am Montag und Experte am Sonntag, mit einem gewerteten Versuch.","Clássico: escolha variante e dificuldade. Campanha: três campanhas de 15 níveis, com variações e sudokus de técnica. Diário: o mesmo sudoku para todos, fácil na segunda e especialista no domingo, com uma tentativa valendo."],
["Arrows move, 1–9 place a digit, Shift + digit adds a note, N toggles notes, Backspace or 0 erases, U or Ctrl+Z undoes, H gives a hint, P or Esc pauses.","Las flechas mueven, 1–9 colocan un dígito, Mayús + dígito añade una nota, N activa las notas, Retroceso o 0 borra, U o Ctrl+Z deshace, H da una pista, P o Esc pausa.","Les flèches déplacent, 1–9 placent un chiffre, Maj + chiffre ajoute une note, N active les notes, Retour ou 0 efface, U ou Ctrl+Z annule, H donne un indice, P ou Échap met en pause.","Pfeiltasten bewegen, 1–9 setzen eine Ziffer, Umschalt + Ziffer setzt eine Notiz, N schaltet Notizen um, Rücktaste oder 0 löscht, U oder Strg+Z macht rückgängig, H gibt einen Tipp, P oder Esc pausiert.","As setas movem, 1–9 colocam um dígito, Shift + dígito põe uma nota, N liga as notas, Backspace ou 0 apaga, U ou Ctrl+Z desfaz, H dá uma dica, P ou Esc pausa."],

["Every puzzle has exactly one solution and can be solved by logic alone, graded by the techniques it needs.","Cada sudoku tiene exactamente una solución y se resuelve solo con lógica, clasificado por las técnicas que necesita.","Chaque grille a une seule solution et se résout par la seule logique, classée selon les techniques qu'elle demande.","Jedes Rätsel hat genau eine Lösung und ist allein mit Logik lösbar, eingestuft nach den nötigen Techniken.","Cada sudoku tem exatamente uma solução e se resolve só com lógica, classificado pelas técnicas que exige."],

<script>
