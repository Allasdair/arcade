<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3f2ef" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
<title>Tilecraft</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="../fonts.css">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arcade">

<script>window.__ARCADE__=1</script>
<style>
:root{--bg:#f3f2ef;--panel:#fff;--ink:#1c1c1e;--sub:#8a8a90;--accent:#2d3a36;--accentInk:#fff;--line:rgba(0,0,0,.08);--gold:#e8a913;--good:#2f9e6a;--bad:#d9534f;--lf:Inter}
.dark{--bg:#101114;--panel:#1b1c20;--ink:#f2f2f4;--sub:#8d8e96;--accent:#e9eaee;--accentInk:#15161a;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
input[type=text]{width:100%;font:15px Inter,sans-serif;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
textarea{width:100%;font:12px/1.4 'JetBrains Mono',monospace;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:none;-webkit-user-select:text;user-select:text}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;flex:1;padding:16px 16px 36px;max-width:560px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h2{font-size:24px;font-weight:800;letter-spacing:-.03em;flex:1;min-width:0}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 0 16px}
.brand h1{font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1}
.brand p{color:var(--sub);font-size:14px;margin-top:8px;line-height:1.35}
.acts{display:flex;gap:8px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.backbtn{height:36px;padding:0 12px 0 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-bottom:6px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:22px 4px 10px;display:flex;justify-content:space-between;gap:8px}
.label span{letter-spacing:.02em;text-transform:none;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 15px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:10px;transition:transform .12s;min-width:0}
button.card:active{transform:scale(.98)}
.card .t{font-weight:700;font-size:17px;letter-spacing:-.01em;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.row2 .card .t{font-size:15.5px}
.card .s{color:var(--sub);font-size:13px;margin-top:2px;line-height:1.3;overflow-wrap:anywhere}
.card .grow{flex:1;min-width:0}
.card .r{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex:none;max-width:42%}
.card .r b{display:block;font-size:15px}
.card .r span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.card.dim{opacity:.55}
.ico{width:42px;height:42px;border-radius:12px;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.ico svg{width:26px;height:26px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .card{margin:0}
.lvl .badge{width:50px;height:50px;border-radius:15px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.primary{background:var(--accent);color:var(--accentInk);border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;width:100%;transition:transform .12s}
.primary:active{transform:scale(.98)}
.ghost{background:var(--bg);border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;width:100%}
.danger{color:var(--bad)}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns>*{flex:1 1 0;min-width:0}
.seg{display:flex;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;padding:9px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);min-width:0}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.dark .seg button.on{background:#2a2b31}
.opt{margin:12px 0}
.opt>.h{font-size:12px;font-weight:700;color:var(--sub);margin:0 2px 6px;display:flex;justify-content:space-between;gap:8px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;width:100%;font-weight:600;font-size:15px;text-align:left}
.srow .d{font-size:12.5px;color:var(--sub);font-weight:500;margin-top:2px}
.srow>div{min-width:0}
.sw{width:46px;height:28px;border-radius:99px;background:var(--bg);position:relative;transition:background .2s;flex:none;border:1px solid var(--line)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--sub);transition:left .2s,background .2s}
.sw.on{background:var(--accent)}.sw.on::after{left:21px;background:var(--accentInk)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 14px;margin-bottom:10px}
.box .srow+.srow{border-top:1px solid var(--line)}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px;white-space:nowrap}
.stars .o{color:var(--sub);opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;max-width:100%;min-width:0;overflow-wrap:anywhere}
.chip.on{background:var(--accent);color:var(--accentInk);border-color:transparent}
.topseg{background:var(--panel);border:1px solid var(--line);margin:0 0 14px;flex-wrap:nowrap}
.topseg button{font-size:12px;padding:9px 3px;flex:1 1 auto;white-space:nowrap;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis}
.topseg button.on{background:var(--accent);color:var(--accentInk)}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px;text-align:left;position:relative;transition:transform .12s;min-width:0}
.tcard:active{transform:scale(.98)}
.tcard .pv{aspect-ratio:7/4;border-radius:12px;display:grid;place-items:center;overflow:hidden;position:relative}
.tcard .n{font-weight:700;font-size:14px;margin:9px 5px 2px}
.tcard .q{font-size:11.5px;color:var(--sub);margin:0 5px 5px;line-height:1.3;min-height:2.6em}
.tcard.sel{box-shadow:0 0 0 2.5px var(--accent)}
.tcard.locked .pv{filter:grayscale(.9);opacity:.45}
.tcard .pv svg.i{width:38px;height:38px;stroke-width:1.6;color:var(--accent)}
.tcard.playing .pv{opacity:.4}
.lock{position:absolute;top:13px;right:13px;width:28px;height:28px;border-radius:9px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.lock svg.i{width:15px;height:15px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 2px;border-radius:10px;font-weight:700;font-size:13px;color:var(--sub);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--accentInk)}
.lvcard .num{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.lvcard.fin .num{background:var(--accent);color:var(--accentInk)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
.tbl th{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700;border:0}
.tbl td:first-child,.tbl th:first-child{text-align:left;font-weight:600}
.ach{display:flex;gap:12px;align-items:center;padding:10px 2px}
.ach+.ach{border-top:1px solid var(--line)}
.ach .m{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none;font-size:15px;font-weight:800}
.ach.done .m{background:var(--gold);color:#3a2a00}
.ach .n{font-weight:700;font-size:14.5px}.ach .d{color:var(--sub);font-size:12.5px;margin-top:1px}
.ach>div:last-child{min-width:0}
/* sheets */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:0 0 env(safe-area-inset-bottom)}
#ov.on{display:flex}
#sheet{background:var(--panel);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px 20px;max-height:92vh;overflow-y:auto;overflow-x:hidden;animation:up .22s ease-out}
@media (min-height:700px) and (min-width:600px){ #ov{align-items:center} #sheet{border-radius:24px} }
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
#sheet .sub{color:var(--sub);font-size:14px;line-height:1.4;margin-bottom:12px}
.goal{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px;font-weight:600}
.goal .st{font-size:18px;color:var(--sub);opacity:.4;width:22px;text-align:center;flex:none}
.goal.got .st{color:var(--gold);opacity:1}
.goal.new .st{animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--bg);border-radius:12px;padding:9px 6px;text-align:center;min-width:0;overflow-wrap:anywhere}
.kv b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.kv span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.howto p{font-size:14px;line-height:1.5;margin:6px 0}
.howto h3{font-size:15px;margin:14px 0 4px}
#toast{position:fixed;left:50%;top:0;transform:translate(-50%,calc(-100% - env(safe-area-inset-top) - 20px));opacity:0;background:var(--accent);color:var(--accentInk);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:40;transition:transform .35s,opacity .35s;max-width:calc(100vw - 24px);text-align:center;pointer-events:none;margin-top:calc(env(safe-area-inset-top) + 10px)}
#toast.on{transform:translate(-50%,0);opacity:1}
#fxc{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
.ltbl{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.ltbl td{padding:4px 3px;border-top:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
.ltbl td:first-child{font-weight:800}
.hist{font-size:14px}
.hist .hr{display:flex;gap:8px;padding:7px 2px;border-top:1px solid var(--line);align-items:baseline}
.hist .hr b{font-variant-numeric:tabular-nums;margin-left:auto}
.hist .hr .who{color:var(--sub);font-size:12px;flex:none;width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .hr .w{min-width:0;overflow-wrap:anywhere}
.letters{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}
.letters button{aspect-ratio:1;border-radius:10px;background:var(--bg);font-weight:800;font-size:18px}
/* ===== game ===== */
#game{align-items:center}
.gcol{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;justify-content:center;padding:6px 8px 8px;gap:6px}
.sb{display:flex;align-items:stretch;gap:6px;flex:none}
.pl{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;position:relative}
.pl .nm{font-size:12px;font-weight:700;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .sc{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.pl.on{box-shadow:0 0 0 2px var(--accent)}
.pl.on .nm{color:var(--ink)}
.pl .think{position:absolute;right:8px;top:7px;font-size:11px;color:var(--sub);font-weight:700}
.mid{flex:none;min-width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 6px;font-variant-numeric:tabular-nums}
.mid b{font-size:16px}.mid span{font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.mid.warn b{color:var(--bad)}
.menubtn{width:44px;flex:none;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
#bview{position:relative;overflow:hidden;flex:none;align-self:center;border-radius:12px;touch-action:none;background:var(--bFrame)}
#board{position:absolute;left:0;top:0;display:grid;grid-template-columns:repeat(var(--n),var(--cs));grid-auto-rows:var(--cs);transform-origin:0 0}
.c{position:relative;width:var(--cs);height:var(--cs)}
.c .f{position:absolute;inset:max(.5px,calc(var(--cs)*.04));border-radius:calc(var(--cs)*.14);background:var(--cell);display:grid;place-items:center;overflow:hidden}
.c.x .f{background:transparent}
.c.p1 .f{background:var(--p1)}.c.p2 .f{background:var(--p2)}.c.p3 .f{background:var(--p3)}.c.p4 .f{background:var(--p4)}
.c .lb{font-size:calc(var(--cs)*.3);font-weight:800;line-height:1.02;text-align:center;color:var(--pInk);letter-spacing:-.02em}
.c.p2 .lb,.c.p4 .lb{color:var(--pInk2)}
.c .lb small{display:block;font-size:calc(var(--cs)*.16);font-weight:700;opacity:.85;text-transform:uppercase}
.c.st .f{color:var(--star);font-size:calc(var(--cs)*.6)}
.c.hint .f{box-shadow:inset 0 0 0 2px var(--gold)}
.c.tgt .f{box-shadow:inset 0 0 0 2px var(--accent)}
.tile{position:absolute;inset:max(.5px,calc(var(--cs)*.04));border-radius:calc(var(--cs)*.16);background:var(--tBg);color:var(--tInk);box-shadow:var(--tSh);border:var(--tBd);display:grid;place-items:center;font-family:var(--lf),Inter,sans-serif;z-index:1}
.tile b{font-size:calc(var(--cs)*.6);font-weight:var(--lfw);line-height:1}
.tile i{position:absolute;right:9%;bottom:5%;font-style:normal;font-size:calc(var(--cs)*.24);font-weight:700;opacity:.75;font-family:Inter,sans-serif}
.tile.bl b{color:var(--tBlank)}.tile.bl b::after{content:'';display:block;margin:1px auto 0;width:45%;border-bottom:2px dotted currentColor;opacity:.7}
.tile.pend{box-shadow:0 0 0 2px var(--pend),var(--tSh)}
.tile.bad{box-shadow:0 0 0 2px var(--bad),var(--tSh)}
.tile.last::before{content:'';position:absolute;inset:-1px;border-radius:inherit;box-shadow:0 0 0 2px var(--last);pointer-events:none}
.tile.ghostt{opacity:.55;box-shadow:0 0 0 2px var(--gold)}
.tile.drop{animation:drop .28s ease-out}
@keyframes drop{0%{transform:scale(1.5);opacity:0}100%{transform:none;opacity:1}}
.tile.glint::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);background-size:250% 100%;animation:glint .6s ease-out forwards;pointer-events:none}
@keyframes glint{from{background-position:120% 0}to{background-position:-40% 0}}
.wl{flex:none;min-height:30px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px;font-weight:700;padding:0 4px;justify-content:center;text-align:center}
.wl .w{padding:3px 8px;border-radius:9px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.wl .w.no{color:var(--bad)}.wl .w.yes{color:var(--good)}
.wl .tot{font-size:16px;font-variant-numeric:tabular-nums}
.wl .msg{color:var(--sub);font-weight:600}
.rack{flex:none;display:flex;justify-content:center;gap:5px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;min-height:calc(var(--rt) + 14px);touch-action:none}
.rack .rt{position:relative;width:var(--rt);height:var(--rt);flex:none;--cs:var(--rt)}
.rack .rt .tile{inset:0}
.rack .rt.sel .tile{transform:translateY(-6px);box-shadow:0 0 0 2.5px var(--accent),var(--tSh)}
.rack .rt.gone{visibility:hidden}
.rack .rt.sw .tile{opacity:.45;transform:translateY(5px)}
.acts2{flex:none;display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 1.6fr;gap:5px}
.acts2.lefty{grid-template-columns:1.6fr 1fr 1fr 1fr 1fr 1fr}
.acts2.lefty #bPlay{order:-1}
.acts2 button{height:46px;border-radius:13px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--sub);min-width:0;gap:1px;position:relative}
.acts2 button svg.i{width:19px;height:19px;color:var(--ink)}
.acts2 #bPlay{background:var(--accent);color:var(--accentInk);font-size:15px;border:0}
.acts2 #bPlay:disabled{opacity:.35}
.acts2 .cnt{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accentInk);font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.acts2 span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
#drag{position:fixed;z-index:25;pointer-events:none;width:var(--dt);height:var(--dt);--cs:var(--dt);transform:translate(-50%,-80%) scale(1.08);display:none}
#drag .tile{inset:0;box-shadow:0 8px 22px rgba(0,0,0,.3)}
#cover{position:fixed;inset:0;z-index:15;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#cover.on{display:flex}
#cover h2{font-size:26px;font-weight:800}
#cover p{color:var(--sub);font-size:14px;max-width:320px}
.banner{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner b{flex:1 1 180px;min-width:0}
.banner button{background:var(--bg);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px}
.gtag{font-size:11px;color:var(--sub);font-weight:700;text-align:center;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="toast"></div>
<canvas id="fxc"></canvas>

<!-- HOME -->

let DAWG=null;
function dawg(){ if(DAWG) return DAWG;
  const s=typeof atob==='function'?atob(DICT_B64):Buffer.from(DICT_B64,'base64').toString('binary'), n=s.length/3, L=new Uint8Array(n), F=new Uint8Array(n), C=new Uint32Array(n);
  for(let i=0;i<n;i++){ const v=(s.charCodeAt(3*i)<<16)|(s.charCodeAt(3*i+1)<<8)|s.charCodeAt(3*i+2); L[i]=v>>>19; F[i]=((v>>>18)&1)|(((v>>>17)&1)<<1); C[i]=v&0x1FFFF; }
  // F bit 0 = end of word, bit 1 = last edge of the node. Per-node 26-bit letter masks speed up cross-checks.
  return (DAWG={L,F,C,root:1}); }
// the edge for letter k (0..25) out of the node starting at edge i, or -1
function dEdge(i,k){ if(!i) return -1; const D=DAWG||dawg(); for(;;){ const l=D.L[i]; if(l===k) return i; if(l>k||(D.F[i]&2)) return -1; i++; } }
// is the word (A-Z string) in the dictionary
function isWord(w){ const D=DAWG||dawg(); let node=D.root, e=-1; if(w.length<2) return false;
  for(let j=0;j<w.length;j++){ e=dEdge(node,w.charCodeAt(j)-65); if(e<0) return false; node=D.C[e]; }
  return (D.F[e]&1)===1; }

// ===================== Tilecraft engine =====================
// Boards, letters, bag, rules, scoring, end of game, modifiers, the move generator, the computer opponent,
// the Daily and 2-Player share codes. No DOM: game state is plain JSON, so saves resume exactly and share codes
// rebuild a game by replaying its moves. All randomness comes from seeds (cyrb128 -> sfc32, as in Sweep).

// ---------- letters (our own table, kickoff section 4; tools/letters.py reproduces it from ENABLE) ----------
// letter: [value, Small count, Medium count, Large count]
const LETTERS={E:[1,9,12,19],A:[1,6,9,13],I:[1,5,8,12],R:[1,5,7,11],O:[1,4,7,10],S:[1,3,5,7],N:[1,4,5,9],T:[1,4,5,8],L:[1,4,5,8],
 D:[2,3,4,6],U:[2,2,4,6],C:[2,2,3,5],G:[3,2,3,4],P:[3,2,3,4],M:[3,2,3,4],H:[3,1,2,4],B:[3,1,2,3],Y:[4,1,2,3],F:[4,1,2,2],
 K:[4,1,1,2],W:[5,1,1,2],V:[5,1,1,1],Z:[7,1,1,1],X:[7,1,1,1],J:[8,1,1,1],Q:[10,1,1,1]};
const ALPHA='ABCDEFGHIJKLMNOPQRSTUVWXYZ', BLANK='?';
const VAL=new Int8Array(27); for(let i=0;i<26;i++) VAL[i]=LETTERS[ALPHA[i]][0];
const valOf=ch=>ch===BLANK||(ch>='a'&&ch<='z')?0:LETTERS[ch][0]; // a lowercase letter is a blank showing that letter
const RACK=7, FULL_RACK=40, SCORELESS_END=6;

// ---------- boards ----------
const SIZES={small:{n:11,tiles:70,blanks:2,col:1,name:'Small'},medium:{n:15,tiles:100,blanks:2,col:2,name:'Medium'},large:{n:19,tiles:150,blanks:3,col:3,name:'Large'}};
const SIZE_IDS=['small','medium','large'], SHAPE_IDS=['square','ring','cross','diamond'];
const SHAPE_NAMES={square:'Square',ring:'Ring',cross:'Cross',diamond:'Diamond'};
// premium squares: 0 none, 1 = 2× Letter, 2 = 3× Letter, 3 = 2× Word, 4 = 3× Word
const PREM_NAMES=['','2× Letter','3× Letter','2× Word','3× Word'], PREM_SHORT=['','2L','3L','2W','3W'];
const LM=[1,2,3,1,1], WM=[1,1,1,2,3];
const PREM_RANGE={4:[6,8],3:[14,18],2:[10,14],1:[20,26]}; // Medium square board; others scale by playable area

// ---------- seeded randomness ----------
function seedRng(str){ // cyrb128 -> sfc32
  let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;
  for(let i=0;i<str.length;i++){ const k=str.charCodeAt(i); h1=h2^Math.imul(h1^k,597399067); h2=h3^Math.imul(h2^k,2869860233); h3=h4^Math.imul(h3^k,951274213); h4=h1^Math.imul(h4^k,2716044813); }
  h1=Math.imul(h3^(h1>>>18),597399067); h2=Math.imul(h4^(h2>>>22),2869860233); h3=Math.imul(h1^(h3>>>17),951274213); h4=Math.imul(h2^(h4>>>19),2716044813);
  let a=(h1^h2^h3^h4)>>>0, b=(h2^h1)>>>0, c=(h3^h1)>>>0, d=(h4^h1)>>>0;
  const r=()=>{ a>>>=0; b>>>=0; c>>>=0; d>>>=0; let t=(a+b)|0; a=b^(b>>>9); b=(c+(c<<3))|0; c=(c<<21)|(c>>>11); d=(d+1)|0; t=(t+d)|0; c=(c+t)|0; return (t>>>0)/4294967296; };
  for(let i=0;i<15;i++) r(); return r; }
const h32=str=>Math.floor(seedRng(str)()*4294967296)>>>0;
function shuffle(a,rng){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

// Board shapes, from Sweep's masks, kept symmetric under 90° rotation with the centre (the start square) playable.
// Ring is a wheel: an outer ring, a hub round the start square and four spokes joining them.
function shapeMask(shape,n){ const m=new Uint8Array(n*n).fill(1); if(shape==='square') return m; const c=(n-1)/2, R=c+.5;
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){ const dx=x-c, dy=y-c, u=dx/R, v=dy/R; let on=1;
    if(shape==='ring'){ const r=Math.hypot(u,v); on=r<=1.04&&(r>=.56||r<=.32||Math.abs(dx)<=1||Math.abs(dy)<=1); }
    else if(shape==='diamond') on=Math.abs(u)+Math.abs(v)<=1.04;
    else if(shape==='cross') on=Math.abs(u)<=.37||Math.abs(v)<=.37;
    m[y*n+x]=on?1:0; }
  return m; }
const cheb=(n,a,b)=>Math.max(Math.abs(a%n-b%n),Math.abs(((a/n)|0)-((b/n)|0)));
function premRange(t,playable){ const f=playable/225, lo=PREM_RANGE[t][0]*f, hi=PREM_RANGE[t][1]*f; return [Math.floor(lo),Math.ceil(hi)]; }
// 90° symmetry places premiums in sets of 4: the counts allowed are the multiples of 4 in the scaled range,
// or, when a small shaped board's range holds none, the nearest multiple of 4 (at least 4)
function premAllowed(t,playable){ const [L,H]=premRange(t,playable), o=[]; for(let k=4;k<=H;k+=4) if(k>=L) o.push(k); if(!o.length) o.push(Math.max(4,Math.round((L+H)/8)*4)); return o; }
function premTargets(playable,rng){ const out={}; for(const t of [4,3,2,1]){ const o=premAllowed(t,playable); out[t]=o[Math.floor(rng()*o.length)]; } return out; }
// can a premium of type t go on cell c, given what's placed?
function premOK(B,prem,tw,c,t){ const n=B.n, s=B.start, x=c%n, y=(c/n)|0;
  if(t===4){ if(cheb(n,c,s)<=4) return false; for(const e of tw) if(cheb(n,c,e)<4) return false; }
  if(t!==1&&cheb(n,c,s)<=1) return false;
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ if(!dx&&!dy) continue; const X=x+dx, Y=y+dy; if(X<0||Y<0||X>=n||Y>=n) continue; const p=prem[Y*n+X];
    if(t>=3&&p>=3) return false;                 // no two Word squares next to each other
    if(p===t&&(t===2||!dx||!dy)) return false; } // no same letter premium side by side (3× Letter not even diagonally)
  return true; }
function placePremiums(B,rng){ const n=B.n, c=(n-1)/2, reps=[];
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){ const dx=x-c, dy=y-c; if(dx>=1&&dy>=0){ const orb=[[dx,dy],[-dy,dx],[-dx,-dy],[dy,-dx]].map(([a,b])=>(b+c)*n+(a+c)); if(orb.every(i=>B.mask[i])) reps.push(orb); } }
  const target=premTargets(B.playable,rng);
  for(let attempt=0;attempt<200;attempt++){ const prem=new Uint8Array(n*n), tw=[]; let failed=0;
    for(const t of [4,3,2,1]){ let need=target[t]/4; for(const orb of shuffle(reps.slice(),rng)){ if(!need) break;
        if(orb.some(i=>prem[i])) continue; const set=[]; let good=true;
        for(const i of orb){ if(!premOK(B,prem,tw,i,t)){ good=false; break; } prem[i]=t; set.push(i); if(t===4) tw.push(i); }
        if(good) need--; else { for(const i of set){ prem[i]=0; if(t===4) tw.pop(); } } }
      if(need){ failed=t; break; } }
    if(!failed) return {prem,target};
    if(attempt%40===39) target[failed]=Math.max(0,target[failed]-4); } // a tight shape can't take that many: one orbit fewer
  return {prem:new Uint8Array(n*n),target}; }
const BOARDS=new Map();
function makeBoard(size,shape,seed){ const key=size+'|'+shape+'|'+seed; if(BOARDS.has(key)) return BOARDS.get(key);
  const n=SIZES[size].n, mask=shapeMask(shape,n), start=((n*n)>>1);
  const B={size,shape,seed,n,N:n*n,mask,start,playable:mask.reduce((a,b)=>a+b,0)};
  const r=placePremiums(B,seedRng('TCB1|'+size+'|'+shape+'|'+seed)); B.prem=r.prem; B.target=r.target;
  if(BOARDS.size>40) BOARDS.clear(); BOARDS.set(key,B); return B; }
const boardOf=cfg=>makeBoard(cfg.size,cfg.shape,cfg.boardSeed);

// ---------- modifiers and game setup ----------
const DEF_MODS={norepeat:false,timer:0,minLen:2,maxLen:0,blanks:null,swaps:true,rare:false};
const MAXLEN_OPTS=[0,7,6,5], BLANK_OPTS=[null,0,2,4], TIMER_OPTS=[0,30,60,90,120];
function bagTiles(size,mods){ const col=SIZES[size].col, out=[];
  for(const L of ALPHA) for(let k=0;k<LETTERS[L][col];k++) out.push(L);
  if(mods.rare) for(const L of 'JQXZ') out.push(L);
  const nb=mods.blanks==null?SIZES[size].blanks:mods.blanks; for(let k=0;k<nb;k++) out.push(BLANK); return out; }
// cfg: {size, shape, boardSeed, bagSeed, mods, players:[{name, ai}], solo, turns, first, preset}
function normCfg(c){ const o=Object.assign({size:'medium',shape:'square',boardSeed:1,bagSeed:1,players:[{name:'You',ai:null},{name:'Computer',ai:'normal'}],solo:false,turns:0,first:'toss'},c);
  o.mods=Object.assign({},DEF_MODS,c&&c.mods||{}); if(o.solo) o.players=o.players.slice(0,1); return o; }
function newGame(c){ const cfg=normCfg(c), B=boardOf(cfg), np=cfg.players.length;

const HEAVY=80, HAMMER=120;
// ctx: {mode:'classic'|'campaign'|'daily'|'tp', st, p (the player's seat), hints, ai, practice, local}
function checkAch(S,ctx){ const got=[], give=id=>{ if(!S.ach[id]){ S.ach[id]=Date.now(); got.push(id); } };
  if(ctx.practice) return got;
  if(ctx.mode==='tp'){ if(!ctx.local) for(const a of ACH) if(a.n&&S.tp.wins>=a.n) give(a.id); return got; } // pass-and-play counts nothing
  const st=ctx.st, p=ctx.p||0;
  if(st){ const g=gameStats(st,p), done=st.over, won=done&&st.result&&st.result.winner===p&&st.racks.length>1, ai=ctx.ai;
    if(done) give('first');
    if(g.fullRacks) give('fullrack'); if(g.fullRacks>=2) give('dfull');
    if(g.best&&g.best.sc>=HEAVY) give('heavy'); if(g.best&&g.best.sc>=HAMMER) give('hammer');
    if(g.wordSq2) give('crossfire'); if(g.longest.length>=9) give('longword'); if(g.rare==='JQXZ') give('rare');
    if(won&&ai){ give('ws_'+ai); S.shapesWon[st.cfg.shape]=1; if(SHAPE_IDS.every(s=>S.shapesWon[s])) give('shapes');
      if(ai==='expert'&&!ctx.hints&&!g.swaps) give('purist'); if(st.cfg.mods.timer===30) give('speed'); } }
  if(ctx.mode==='campaign'){ CAMPS.forEach((c,i)=>{ if(campDone(S,i)) give('camp'+(i+1)); if(LEVELS.filter(L=>L.camp===i).every(L=>campStars(S,L.id)>=3)) give('perf'+(i+1)); });
    if(LEVELS.filter(L=>L.type==='puzzle').every(L=>campOf(S,L.id).s[2])) give('puzzle'); }
  if(ctx.mode==='daily'){ if(S.daily.stars>=3) give('dspark'); if(S.dstreak.cur>=7) give('dstreak'); if(S.daily.par&&S.daily.score>=S.daily.par*1.2) give('beyond'); }
  return got; }

// ---------- XP ----------
function addXP(S,n){ const before=levelOf(S.xp); S.xp+=Math.max(0,Math.round(n)); const after=levelOf(S.xp), rewards=[];
  for(let l=before+1;l<=after;l++) rewards.push(...rewardsAt(l));
  const ups=after-before; if(ups>0) S.hints=Math.min(HINT_MAX,(S.hints||0)+ups); // +1 hint per level-up
  return {xp:Math.round(n),before,after,rewards,hints:ups}; }
const xpNext=S=>{ const l=levelOf(S.xp); return l>=MAXL?null:LVXP[l]; };
const WIN_XP={easy:10,normal:20,hard:30,expert:45};
// Classic modifiers that make a game harder each add 10% (capped at 40%). No score multiplier: scores stay comparable.
function hardMods(cfg){ const m=cfg.mods, o=[]; if(m.minLen>=4) o.push('minLen'); if(m.maxLen) o.push('maxLen'); if(m.norepeat) o.push('norepeat'); if(m.swaps===false) o.push('swaps');
  if(m.timer&&m.timer<=60) o.push('timer'); if(cfg.shape!=='square') o.push('shape'); return o; }
const modBonus=cfg=>Math.min(.4,.1*hardMods(cfg).length);
function classicXP(st,p,ai){ const won=st.result&&st.result.winner===p; return Math.round((5+(won?WIN_XP[ai]:0))*(1+modBonus(st.cfg))); }

// ---------- records ----------
// Classic: best game score, best single move, longest word, most Full Racks in a game, wins by strength × board size.
// An assisted game (a hint was used) still gets XP and stars, but sets no best-score records.
function addRecords(S,st,p,ai,assisted,date){ const R=S.rec, g=gameStats(st,p), fin=st.result.final, fresh=[];
  R.games++; const w=st.result.winner; if(w===p) R.won++; else if(w===-1) R.drawn++; else R.lost++;
  if(w===p){ const k=ai+'|'+st.cfg.size; R.wins[k]=(R.wins[k]||0)+1; }
  if(assisted) return fresh;
  if(!R.bestGame||fin[p]>R.bestGame.sc){ R.bestGame={sc:fin[p],date,ai,size:st.cfg.size}; fresh.push('Best game'); }
  if(g.best&&(!R.bestMove||g.best.sc>R.bestMove.sc)){ R.bestMove={sc:g.best.sc,w:g.best.w,date}; fresh.push('Best move'); }
  if(g.longest&&(!R.longest||g.longest.length>R.longest.w.length)){ R.longest={w:g.longest,date}; fresh.push('Longest word'); }
  if(g.fullRacks>R.mostFull){ R.mostFull=g.fullRacks; fresh.push('Most Full Racks'); }
  return fresh; }
function addStats(S,st,p){ const g=gameStats(st,p), t=S.stats; t.games++; t.words+=g.words; t.fullRacks+=g.fullRacks;
  for(const m of st.moves) if(m.p===p&&m.t==='p') t.tiles+=m.tiles.length; }

// ---------- campaign ----------
const campOf=(S,id)=>S.camp[id]||{s:[0,0,0],best:0,tries:0};
const campStars=(S,id)=>campOf(S,id).s.reduce((a,b)=>a+b,0);
const totalStars=S=>LEVELS.reduce((a,L)=>a+campStars(S,L.id),0);
const campCleared=(S,id)=>!!campOf(S,id).s[0];
const campDone=(S,c)=>campCleared(S,LEVELS.find(L=>L.camp===c&&L.n===15).id);
const campOpen=(S,c)=>c===0||campDone(S,c-1);
// clearing a level (its goal star) unlocks the next; clearing level 15 unlocks the next campaign
const unlocked=(S,Lv)=>campOpen(S,Lv.camp)&&(Lv.n===1||campCleared(S,LEVELS.find(L=>L.camp===Lv.camp&&L.n===Lv.n-1).id));
function campaignResult(S,Lv,o,hints){ const c=campOf(S,Lv.id), earned=[o.goal,o.goal&&!hints,o.twist], fresh=[], C=CAMPS[Lv.camp]; let xp=0;
  const wasDone=campDone(S,Lv.camp);
  earned.forEach((e,i)=>{ if(e&&!c.s[i]){ c.s[i]=1; fresh.push(i); xp+=C.xp; } });
  c.tries=(c.tries||0)+1; if(o.goal) c.best=Math.max(c.best||0,o.score); S.camp[Lv.id]=c;
  const finished=!wasDone&&campDone(S,Lv.camp); if(finished) xp+=C.bonus;
  return {earned,fresh,stars:campStars(S,Lv.id),xp,finished}; }

// ---------- Daily ----------
function dailyFor(S,date){ if(S.daily.date!==date) S.daily={date,scored:false,score:0,par:S.parCache[date]||0,stars:0,run:null,practice:null}; return S.daily; }
const dayNum=date=>{ const [y,m,d]=date.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); };
function setPar(S,date,par){ S.parCache[date]=par; const keys=Object.keys(S.parCache).sort(); while(keys.length>3) delete S.parCache[keys.shift()]; if(S.daily.date===date) S.daily.par=par; }
function dailyResult(S,date,score,today){ const d=dailyFor(S,date); if(d.scored) return null;
  d.scored=true; d.score=score; d.run=null; d.stars=d.par?parStars(score,d.par):0;
  const pct=d.par?Math.round(score/d.par*100):0;
  S.dhist[date]={score,par:d.par,pct,stars:d.stars}; S.dbest=Math.max(S.dbest||0,pct);
  const keys=Object.keys(S.dhist).sort(); while(keys.length>7) delete S.dhist[keys.shift()]; // the last 7 Dailies
  const n=dayNum(date), last=S.dstreak.last?dayNum(S.dstreak.last):-99;
  if(n!==last){ S.dstreak.cur=n===last+1?S.dstreak.cur+1:1; S.dstreak.last=date; S.dstreak.best=Math.max(S.dstreak.best,S.dstreak.cur); }
  return {stars:d.stars,xp:20*(date===today?2:1),pct}; }
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// no spoilers: the share line never shows a word
function shareLine(date,score,par,stars){ const [,m,dd]=date.split('-').map(Number);
  return `Tilecraft Daily · ${dd} ${MON[m-1]} · ${score}${par?` (${Math.round(score/par*100)}% of par)`:''} · ${'★'.repeat(stars)}${'☆'.repeat(3-stars)}`; }

// ---------- 2-Player games list ----------
// Each game: {id, mode:'code'|'local', me (seat: 0 or 1), names, cfg, moves, n, last, over, code (the code to send)}
function tpFind(S,id){ return S.tp.games.find(g=>g.id===id); }
function tpSave(S,g){ const k=S.tp.games.findIndex(x=>x.id===g.id); if(k>=0) S.tp.games[k]=g; else S.tp.games.unshift(g); }
function tpDelete(S,id){ S.tp.games=S.tp.games.filter(g=>g.id!==id); if(!S.tp.deleted.includes(id)) S.tp.deleted.push(id); if(S.tp.deleted.length>200) S.tp.deleted.shift(); }
// a finished share-code game won by this device's player counts once toward Rivals
function tpCount(S,g,st){ if(g.mode!=='code'||!st.over||S.tp.counted.includes(g.id)) return false; S.tp.counted.push(g.id);
  if(st.result.winner===g.me){ S.tp.wins++; return true; } return false; }
const newGameId=()=>{ const b=new Uint8Array(6); try{ crypto.getRandomValues(b); }catch(e){ for(let i=0;i<6;i++) b[i]=Math.floor(Math.random()*256); } return [...b]; };
const idHex=b=>b.map(v=>v.toString(16).padStart(2,'0')).join('');

// ---------- backup (Tilecraft only, including the 2-Player games list) ----------
// TILECRAFT1Z.<base64 gzip> where the app can compress, TILECRAFT1.<base64> otherwise. Both decode here (the app inflates Z).
const b64e=str=>{ const u=new TextEncoder().encode(str); let b=''; for(let i=0;i<u.length;i++) b+=String.fromCharCode(u[i]); return btoa(b); };
const b64d=b=>new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)));
function backupPlain(S){ return 'TILECRAFT1.'+b64e(JSON.stringify(S)); }
function parseBackup(text){ const m=/TILECRAFT1\.([A-Za-z0-9+/=]+)/.exec(String(text||'')); if(!m) return null;
  try{ const o=JSON.parse(b64d(m[1])); if(!o||typeof o!=='object'||typeof o.xp!=='number') return null; return o; }catch(e){ return null; } }

// ---------- Arcade contract ----------
// Shared settings live in arcade.v1 (read only, never written). They're applied in memory only.
function readArcade(store){ try{ const a=JSON.parse(store.get(ARCADE_KEY)||'null'); if(!a||typeof a!=='object') return null; return a; }catch(e){ return null; } }
function applyShared(S,a){ if(!a) return S; const o=Object.assign({},S), set=a.set||{}; for(const k of SHARED) if(set[k]!==undefined) o[k]=set[k]; if(typeof a.name==='string'&&a.name) o.name=a.name; return o; }
function summary(S){ const l=levelOf(S.xp), bm=S.rec.bestMove;
  return {v:1,game:GAME_ID,ver:VERSION,level:l,maxLevel:MAXL,xp:S.xp,xpLevel:l,xpNext:xpNext(S),
    ach:ACH.map(a=>[a.name,a.desc,!!S.ach[a.id]]),
    hi:[['Best move',bm?String(bm.sc):'—'],['Campaign stars',`${totalStars(S)}/${LEVELS.length*3}`],['Daily best',S.dbest?`${S.dbest}% of par`:'—']],
    last:Date.now()}; }

// ---- how to play ----
["Make words on the board from the 7 tiles on your rack. Words read across or down, and every word you make must be in the word list.","Forma palabras en el tablero con las 7 fichas de tu atril. Las palabras se leen en horizontal o en vertical, y todas deben estar en la lista.","Formez des mots sur le plateau avec les 7 jetons de votre chevalet. Les mots se lisent à l'horizontale ou à la verticale, et chaque mot doit figurer dans la liste.","Lege Wörter aus den 7 Steinen auf deiner Ablage. Wörter laufen waagerecht oder senkrecht, und jedes Wort muss in der Wortliste stehen.","Forme palavras no tabuleiro com as 7 peças do seu suporte. As palavras são lidas na horizontal ou na vertical, e todas precisam estar na lista."],
["Your turn","Tu turno","À vous","Du bist dran","Sua vez"],
["Place one or more tiles in a single row or column, with no gaps (tiles already on the board can fill them). The first word must cover the star in the middle; every word after that must join onto the board. Then tap Play. Instead of playing you can swap tiles (while the bag holds 7 or more) or pass.","Coloca una o más fichas en una sola fila o columna, sin huecos (las fichas del tablero pueden rellenarlos). La primera palabra debe cubrir la estrella del centro; las siguientes deben unirse al tablero. Luego toca Jugar. En lugar de jugar puedes cambiar fichas (si quedan 7 o más en la bolsa) o pasar.","Posez un ou plusieurs jetons sur une seule ligne ou colonne, sans trou (les jetons déjà posés peuvent les combler). Le premier mot doit couvrir l'étoile au centre ; les suivants doivent se raccrocher au plateau. Touchez ensuite Jouer. Au lieu de jouer, vous pouvez échanger des jetons (s'il en reste 7 ou plus dans le sac) ou passer.","Lege einen oder mehrere Steine in eine Reihe oder Spalte, ohne Lücken (Steine auf dem Brett dürfen sie füllen). Das erste Wort muss den Stern in der Mitte bedecken; jedes weitere muss ans Brett anschließen. Dann tippe auf Spielen. Statt zu legen kannst du Steine tauschen (solange 7 oder mehr im Beutel sind) oder passen.","Coloque uma ou mais peças em uma única linha ou coluna, sem espaços (as peças do tabuleiro podem preenchê-los). A primeira palavra deve cobrir a estrela do centro; as seguintes devem se ligar ao tabuleiro. Depois toque em Jogar. Em vez de jogar, você pode trocar peças (enquanto houver 7 ou mais no saco) ou passar."],
["Drag tiles from the rack, or tap a tile and then a square. Tap a placed tile to take it back. Pinch or double-tap to zoom, drag to move round the board. A blank (?) can be any letter and is worth 0.","Arrastra fichas desde el atril, o toca una ficha y luego una casilla. Toca una ficha colocada para recogerla. Pellizca o toca dos veces para acercar, arrastra para moverte. Un comodín (?) puede ser cualquier letra y vale 0.","Glissez les jetons depuis le chevalet, ou touchez un jeton puis une case. Touchez un jeton posé pour le reprendre. Pincez ou touchez deux fois pour zoomer, glissez pour vous déplacer. Un joker (?) peut être n'importe quelle lettre et vaut 0.","Zieh Steine von der Ablage oder tippe einen Stein und dann ein Feld an. Tippe einen gelegten Stein an, um ihn zurückzunehmen. Zum Zoomen zwei Finger spreizen oder doppelt tippen, zum Verschieben ziehen. Ein Joker (?) kann jeder Buchstabe sein und zählt 0.","Arraste peças do suporte, ou toque numa peça e depois numa casa. Toque numa peça colocada para recolhê-la. Faça pinça ou toque duas vezes para ampliar, arraste para mover. Um curinga (?) pode ser qualquer letra e vale 0."],
["Scoring","Puntuación","Score","Punkte","Pontuação"],
["A word scores the sum of its letters. 2× Letter and 3× Letter squares multiply the letter on them; 2× Word and 3× Word squares multiply the whole word, and two of them multiply together. Premium squares only count on the turn a tile is placed on them. Every word you make in a move scores, the crossing words too.","Una palabra vale la suma de sus letras. Las casillas 2× Letra y 3× Letra multiplican la letra; las de 2× Palabra y 3× Palabra multiplican toda la palabra, y dos de ellas se multiplican entre sí. Las casillas especiales solo cuentan en el turno en que se coloca la ficha. Puntúan todas las palabras que formas, también las cruzadas.","Un mot vaut la somme de ses lettres. Les cases 2× Lettre et 3× Lettre multiplient la lettre posée ; les cases 2× Mot et 3× Mot multiplient tout le mot, et deux d'entre elles se multiplient. Les cases spéciales ne comptent qu'au tour où l'on y pose un jeton. Tous les mots formés comptent, y compris les mots croisés.","Ein Wort zählt die Summe seiner Buchstaben. Felder 2× Buchstabe und 3× Buchstabe vervielfachen den Buchstaben darauf; Felder 2× Wort und 3× Wort das ganze Wort, und zwei davon multiplizieren sich. Bonusfelder zählen nur in dem Zug, in dem ein Stein darauf gelegt wird. Jedes Wort eines Zugs zählt, auch die Querwörter.","Uma palavra vale a soma das suas letras. As casas 2× Letra e 3× Letra multiplicam a letra; as de 2× Palavra e 3× Palavra multiplicam a palavra inteira, e duas delas se multiplicam. As casas especiais só contam no turno em que a peça é colocada. Todas as palavras formadas pontuam, inclusive as cruzadas."],
["Full Rack: use all 7 tiles in one move for +40.","Atril completo: usa las 7 fichas en una jugada para +40.","Chevalet complet : posez les 7 jetons en un coup pour +40.","Volle Ablage: alle 7 Steine in einem Zug bringen +40.","Suporte cheio: use as 7 peças numa jogada para +40."],
["The end","El final","La fin","Das Ende","O fim"],
["The game ends when the bag is empty and a player has used all their tiles, or after six scoreless turns in a row. Each player loses the value of the tiles left on their rack; a player who went out gains the other player's leftover total. Highest score wins.","La partida termina cuando la bolsa está vacía y un jugador ha usado todas sus fichas, o tras seis turnos seguidos sin puntos. Cada jugador pierde el valor de las fichas que le quedan; quien se queda sin fichas gana el total del rival. Gana la puntuación más alta.","La partie se termine quand le sac est vide et qu'un joueur a posé tous ses jetons, ou après six tours de suite sans point. Chaque joueur perd la valeur des jetons qui lui restent ; celui qui a fini gagne le total de l'adversaire. Le meilleur score gagne.","Das Spiel endet, wenn der Beutel leer ist und ein Spieler alle Steine gelegt hat, oder nach sechs Zügen ohne Punkte hintereinander. Jeder verliert den Wert seiner Reststeine; wer zuerst fertig ist, bekommt die Reststeine des anderen dazu. Die höchste Punktzahl gewinnt.","A partida termina quando o saco está vazio e um jogador usou todas as peças, ou após seis turnos seguidos sem pontos. Cada jogador perde o valor das peças que sobraram; quem terminou ganha o total do adversário. Vence a maior pontuação."],
["Modes","Modos","Modes","Modi","Modos"],
["Classic: you against the computer (Easy, Normal, Hard or Expert) with your choice of board and modifiers. Campaign: 45 levels in three campaigns, 3 stars each. Daily: 10 turns on today's board, the same for everyone, scored against par. 2-Player: send share codes back and forth, or pass one device between you.","Clásico: tú contra el ordenador (Fácil, Normal, Difícil o Experto) con el tablero y los modificadores que elijas. Campaña: 45 niveles en tres campañas, 3 estrellas cada uno. Diario: 10 turnos en el tablero de hoy, el mismo para todos, contra el par. 2 jugadores: enviad códigos de ida y vuelta o pasaos un dispositivo.","Classique : vous contre l'ordinateur (Facile, Normal, Difficile ou Expert) avec le plateau et les modificateurs de votre choix. Campagne : 45 niveaux en trois campagnes, 3 étoiles chacun. Quotidien : 10 tours sur le plateau du jour, le même pour tous, comparés au par. 2 joueurs : échangez des codes, ou passez-vous un appareil.","Klassisch: du gegen den Computer (Leicht, Normal, Schwer oder Experte) mit Brett und Modifikatoren nach Wahl. Kampagne: 45 Level in drei Kampagnen, je 3 Sterne. Tagesspiel: 10 Züge auf dem heutigen Brett, für alle gleich, gewertet gegen das Par. 2 Spieler: schickt euch Codes hin und her oder reicht ein Gerät weiter.","Clássico: você contra o computador (Fácil, Normal, Difícil ou Especialista) com o tabuleiro e os modificadores que quiser. Campanha: 45 níveis em três campanhas, 3 estrelas cada. Diário: 10 turnos no tabuleiro de hoje, o mesmo para todos, contra o par. 2 jogadores: troquem códigos ou passem um aparelho entre vocês."],
["Hints show a good move as ghost tiles. You get 3 a day, plus 1 for every level-up. A game where you used a hint still earns XP and stars, but sets no best-score records.","Las pistas muestran una buena jugada con fichas fantasma. Tienes 3 al día, más 1 por cada subida de nivel. Una partida con pista sigue dando XP y estrellas, pero no récords.","Les indices montrent un bon coup en jetons fantômes. Vous en avez 3 par jour, plus 1 par niveau gagné. Une partie avec indice rapporte toujours XP et étoiles, mais pas de record.","Tipps zeigen einen guten Zug als Geistersteine. Du bekommst 3 am Tag, plus 1 pro Levelaufstieg. Ein Spiel mit Tipp bringt weiter XP und Sterne, aber keine Bestwerte.","As dicas mostram uma boa jogada com peças fantasmas. Você recebe 3 por dia, mais 1 a cada novo nível. Uma partida com dica ainda rende XP e estrelas, mas não recordes."],

["Your first word must cover the star in the middle. Every word after that joins onto the board.","Tu primera palabra debe cubrir la estrella del centro. Las siguientes se unen al tablero.","Votre premier mot doit couvrir l'étoile au centre. Les suivants se raccrochent au plateau.","Dein erstes Wort muss den Stern in der Mitte bedecken. Jedes weitere schließt ans Brett an.","Sua primeira palavra deve cobrir a estrela do centro. As seguintes se ligam ao tabuleiro."],
["Longer words reach the premium squares. Try for five letters.","Las palabras largas llegan a las casillas especiales. Intenta cinco letras.","Les mots longs atteignent les cases spéciales. Visez cinq lettres.","Längere Wörter erreichen die Bonusfelder. Versuch es mit fünf Buchstaben.","Palavras longas alcançam as casas especiais. Tente cinco letras."],
["Play through the 3× Word squares when you can: they triple the whole word.","Juega sobre las casillas 3× Palabra cuando puedas: triplican toda la palabra.","Passez par les cases 3× Mot quand vous pouvez : elles triplent tout le mot.","Leg über die Felder 3× Wort, wenn du kannst: Sie verdreifachen das ganze Wort.","Jogue nas casas 3× Palavra quando puder: elas triplicam a palavra toda."],
["A wheel: a ring round the edge, a hub in the middle and four spokes between them.","Una rueda: un anillo en el borde, un centro y cuatro radios entre ellos.","Une roue : un anneau au bord, un moyeu au centre et quatre rayons entre les deux.","Ein Rad: ein Ring am Rand, eine Nabe in der Mitte und vier Speichen dazwischen.","Uma roda: um anel na borda, um centro e quatro raios entre eles."],
["Just you and the board. Score as much as you can in 8 turns.","Solo tú y el tablero. Suma todo lo que puedas en 8 turnos.","Seul face au plateau. Marquez le plus possible en 8 tours.","Nur du und das Brett. Hol in 8 Zügen so viel wie möglich.","Só você e o tabuleiro. Faça o máximo de pontos em 8 turnos."],
["A Normal opponent this time. Keep good letters like S and E for later turns.","Esta vez un rival Normal. Guarda letras buenas como S y E para más adelante.","Un adversaire Normal cette fois. Gardez les bonnes lettres comme S et E pour plus tard.","Diesmal ein normaler Gegner. Heb gute Buchstaben wie S und E für später auf.","Desta vez um rival Normal. Guarde letras boas como S e E para depois."],
["Every word, crossing words too, can be at most 5 letters.","Cada palabra, también las cruzadas, puede tener como mucho 5 letras.","Chaque mot, y compris les mots croisés, fait au plus 5 lettres.","Jedes Wort, auch Querwörter, hat höchstens 5 Buchstaben.","Cada palavra, inclusive as cruzadas, tem no máximo 5 letras."],
["A cross: the corners are missing, so the arms get crowded.","Una cruz: faltan las esquinas, así que los brazos se llenan.","Une croix : les coins manquent, les bras se remplissent vite.","Ein Kreuz: Die Ecken fehlen, also wird es in den Armen eng.","Uma cruz: faltam os cantos, então os braços ficam cheios."],
["Ten turns on your own. Plan two moves ahead.","Diez turnos tú solo. Piensa dos jugadas por delante.","Dix tours en solo. Pensez deux coups à l'avance.","Zehn Züge allein. Plane zwei Züge voraus.","Dez turnos sozinho. Pense duas jogadas à frente."],
["One move. Score at least 60% of the best move to pass; find the best move for the third star.","Una jugada. Suma al menos el 60 % de la mejor jugada para pasar; encuentra la mejor para la tercera estrella.","Un coup. Marquez au moins 60 % du meilleur coup pour réussir ; trouvez le meilleur pour la troisième étoile.","Ein Zug. Hol mindestens 60 % des besten Zugs zum Bestehen; finde den besten für den dritten Stern.","Uma jogada. Faça pelo menos 60% da melhor jogada para passar; encontre a melhor para a terceira estrela."],

const LANGS=[['auto','Automatic'],['en','English'],['es','Español'],['fr','Français'],['de','Deutsch'],['pt','Português']];
let LANG='en', DICT=null, PATS=[];
const escRe=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function setLang(){ const pref=P.lang||'auto'; let l=pref==='auto'?String(navigator.language||'en').slice(0,2).toLowerCase():pref;
  const col=(typeof I18N_LANGS!=='undefined')?I18N_LANGS.indexOf(l):-1; if(col<1) l='en'; LANG=l; DICT=null; PATS=[]; document.documentElement.lang=l;
  if(l==='en') return; DICT=new Map();
  for(const row of I18N_ROWS){ const v=row[col]; if(!v) continue; DICT.set(row[0],v);
    if(row[0].includes('{')){ const parts=row[0].split(/(\{\d\})/), idx=[]; let re='^';
      for(const pt of parts){ const m=pt.match(/^\{(\d)\}$/); if(m){ re+='(.+?)'; idx.push(+m[1]); } else re+=escRe(pt); }
      PATS.push({re:new RegExp(re+'$','s'),idx,out:v,lit:parts[0],len:row[0].replace(/\{\d\}/g,'').length}); } }
  PATS.sort((a,b)=>b.len-a.len); if(window.__i18nMiss) DICTV=new Set(DICT.values()); }
let DICTV=null;
function tr(text){ if(!DICT||text==null) return null; const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(text), core=m[2].replace(/\s+/g,' ');
  if(!core||!/[A-Za-z]/.test(core)) return null; let o=DICT.get(core);
  if(o==null) for(const Q of PATS){ if(Q.lit&&!core.startsWith(Q.lit)) continue; const mm=Q.re.exec(core); if(!mm) continue;
    const args=[]; Q.idx.forEach((n,i)=>args[n]=mm[i+1]); o=Q.out.replace(/\{(\d)\}/g,(_,n)=>{ const a=args[n]||''; const t=tr(a); return t!=null?t.trim():a; }); break; }
  if(o==null&&core.includes(' · ')){ let any=false; const parts=core.split(' · ').map(x=>{ const t=tr(x); if(t!=null){ any=true; return t; } return x; }); if(any) o=parts.join(' · '); }
  return o==null?null:m[1]+o+m[3]; }
const T=t=>{ const o=tr(t); return o==null?t:o; };
const SKIP=new Set(['SCRIPT','STYLE','TEXTAREA','INPUT']); const done=new WeakMap();
function trNode(n){ const v=n.nodeValue; if(done.get(n)===v||!n.isConnected) return; const p=n.parentNode; if(p&&(SKIP.has(p.nodeName)||p.closest&&p.closest('[data-raw]'))){ done.set(n,v); return; }
  const t=tr(v); if(t!=null&&t!==v) n.nodeValue=t; else if(t==null&&window.__i18nMiss&&/[A-Za-z]{2}/.test(v)&&!(DICTV&&DICTV.has(v.trim().replace(/\s+/g,' ')))) window.__i18nMiss.add(v.trim()); done.set(n,n.nodeValue); }
function trAttrs(el){ for(const a of ['placeholder','aria-label','title']){ const v=el.getAttribute&&el.getAttribute(a); if(v){ const t=tr(v); if(t!=null) el.setAttribute(a,t); } } }
function trTree(root){ if(!DICT) return; if(root.nodeType===3){ trNode(root); return; } if(root.nodeType!==1) return;
  trAttrs(root); if(SKIP.has(root.nodeName)) return; root.querySelectorAll&&root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(trAttrs);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n; while((n=w.nextNode())) trNode(n); }
function startI18n(){ setLang(); if(!DICT) return; trTree(document.body);
  new MutationObserver(ms=>{ for(const m of ms){ if(m.type==='characterData') trNode(m.target); else m.addedNodes.forEach(trTree); } }).observe(document.body,{subtree:true,childList:true,characterData:true}); }

// ===================== AUDIO (Web Audio, synthesized live) =====================
const AU={};
function buildAudio(c){
  AU.ctx=c; AU.master=c.createGain(); AU.master.gain.value=.9; AU.master.connect(c.destination);
  AU.sfx=c.createGain(); AU.sfx.gain.value=1; AU.sfx.connect(AU.master);
  AU.mus=c.createGain(); AU.mus.gain.value=0;
  AU.musLP=c.createBiquadFilter(); AU.musLP.type='lowpass'; AU.musLP.frequency.value=3200;
  AU.mus.connect(AU.musLP); AU.musLP.connect(AU.master);
  AU.dly=c.createDelay(1); AU.dly.delayTime.value=.375;
  AU.fb=c.createGain(); AU.fb.gain.value=.3; const dl=c.createBiquadFilter(); dl.type='lowpass'; dl.frequency.value=2000;
  AU.dly.connect(dl); dl.connect(AU.fb); AU.fb.connect(AU.dly); dl.connect(AU.mus);
  AU.send=c.createGain(); AU.send.gain.value=.45; AU.send.connect(AU.dly);
  const len=c.sampleRate, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; AU.noise=b; }
function audio(){ if(!AU.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; try{ buildAudio(new C()); }catch(e){ return null; } }
  if(AU.ctx.state==='suspended'&&!document.hidden) AU.ctx.resume().catch(()=>{}); return AU.ctx; }
const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(o){ const c=AU.ctx, t=(o.at!=null?o.at:c.currentTime)+(o.t||0), d=o.d||.12, v=o.v||.2, a=o.a||.005, h=o.hold||0;
  const osc=c.createOscillator(), g=c.createGain(); osc.type=o.type||'sine'; osc.frequency.setValueAtTime(o.f,t);
  if(o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2,t+(o.glide||d)); if(o.det) osc.detune.value=o.det;
  g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(v,t+a); if(h) g.gain.setValueAtTime(v,t+a+h); g.gain.exponentialRampToValueAtTime(.0001,t+a+h+d);
  let n=osc; if(o.lp){ const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.lp; osc.connect(f); n=f; }
  n.connect(g); g.connect(o.dest||AU.sfx); if(o.send) g.connect(o.send); osc.start(t); osc.stop(t+a+h+d+.05); }
function noise(o){ const c=AU.ctx, t=(o.at!=null?o.at:c.currentTime)+(o.t||0), d=o.d||.1;
  const s=c.createBufferSource(); s.buffer=AU.noise; const f=c.createBiquadFilter(); f.type=o.ft||'lowpass';
  f.frequency.setValueAtTime(o.f||1000,t); if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2,t+d); f.Q.value=o.q||.7;
  const g=c.createGain(); g.gain.setValueAtTime(o.v||.2,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.loop=true; s.connect(f); f.connect(g); g.connect(o.dest||AU.sfx); s.start(t,Math.random()*.5); s.stop(t+d+.02); }
function sfx(name,arg,pack){ if(!P.sfx&&!pack) return; const c=audio(); if(!c) return; const chip=(pack||look('sound'))==='chip', sq=chip?'square':'triangle', vv=chip?.4:1;
  switch(name){
  case 'click': tone({f:chip?1760:1500,d:.025,v:.05*vv,type:chip?'square':'sine'}); return;
  case 'place': noise({d:.035,v:.16,ft:'bandpass',f:chip?2600:1800,q:1.4}); tone({f:chip?660:420,f2:chip?440:300,d:.05,v:.08*vv,type:chip?'square':'sine'}); return;
  case 'lift': tone({f:chip?880:640,d:.03,v:.04*vv,type:chip?'square':'sine'}); return;
  case 'glint': tone({f:hz(91),d:.25,v:.035,type:'sine',send:AU.send}); tone({f:hz(98),t:.05,d:.2,v:.02,type:'sine'}); return;
  case 'recall': [76,72,67].forEach((m,i)=>tone({f:hz(m),t:i*.04,d:.06,v:.04*vv,type:sq})); return;
  case 'shuffle': for(let i=0;i<5;i++) noise({t:i*.04,d:.03,v:.08,ft:'bandpass',f:1500+i*300,q:2}); return;
  case 'bad': tone({f:220,f2:180,d:.16,v:.08*vv,type:sq}); return;
  case 'count': tone({f:hz(84+(arg||0)%12),d:.04,v:.035*vv,type:chip?'square':'sine'}); return;
  case 'score': { const n=Math.min(5,1+Math.floor((arg||0)/15)); for(let i=0;i<n;i++) tone({f:hz([72,76,79,84,88][i]),t:i*.06,d:.18,v:.08*vv,type:sq}); return; }
  case 'big': [72,76,79,84,88,91].forEach((m,i)=>tone({f:hz(m),t:i*.06,d:i===5?.6:.2,v:.09*vv,type:sq,send:AU.send})); tone({f:hz(48),d:.6,v:.16}); return;
  case 'full': [72,76,79,84,79,84,88,96].forEach((m,i)=>tone({f:hz(m),t:i*.07,d:i===7?.9:.18,v:.1*vv,type:sq,send:AU.send})); tone({f:hz(48),d:.9,v:.2}); noise({t:.5,d:.8,v:.05,ft:'highpass',f:5000}); return;
  case 'ai': tone({f:chip?520:380,d:.05,v:.05*vv,type:chip?'square':'sine'}); noise({d:.03,v:.08,ft:'bandpass',f:1400,q:1.3}); return;
  case 'swap': noise({d:.25,v:.08,ft:'bandpass',f:600,f2:2000,q:.8}); return;
  case 'pass': tone({f:hz(67),d:.12,v:.05*vv,type:sq}); tone({f:hz(64),t:.1,d:.18,v:.05*vv,type:sq}); return;
  case 'hint': [84,88,91].forEach((m,i)=>tone({f:hz(m),t:i*.05,d:.3,v:.05,type:'sine',send:AU.send})); return;
  case 'tick': tone({f:880,d:.06,v:.06,type:'sine'}); return;
  case 'level': [79,84,88,91].forEach((m,i)=>tone({f:hz(m),t:i*.08,d:.3,v:.09*vv,type:sq})); return;
  case 'win': [72,76,79,84].forEach((m,i)=>tone({f:hz(m),t:i*.09,d:.3,v:.1*vv,type:sq})); return;
  case 'lose': [67,63,60].forEach((m,i)=>tone({f:hz(m),t:i*.16,d:.35,v:.08*vv,type:sq})); return;
  case 'star': tone({f:hz(84+(arg||0)*2),d:.3,v:.08,type:'sine',send:AU.send}); return; } }

const SONGS={hearth:HEARTH,inkwell:INKWELL,daylight:DAYLIGHT}; let SG=HEARTH;
const MUSVOL=.34;
function musicStep(step,t,sd){ const bar=step>>4, s=step&15, D=AU.mus;
  if(SG.style==='day'){ const BP={0:0,6:0,8:7,11:0,14:12}; if(s&1) t+=sd*.14;
    if(s===0||s===8||(s===10&&bar%2===1)) tone({at:t,f:110,f2:42,glide:.12,d:.22,v:.5,dest:D});
    if(s===4||s===12) noise({at:t,d:.07,v:.08,ft:'bandpass',f:1900,q:1.2,dest:D});
    if(s%4===2) noise({at:t,d:.035,v:.055,ft:'highpass',f:7500,dest:D});
    if(s in BP) tone({at:t,f:hz(SG.bass[bar]+BP[s]),d:.26,v:.2,type:'triangle',lp:900,dest:D});
    if(s===0) for(const m of SG.chords[bar]) for(const det of [-7,7]) tone({at:t,f:hz(m),det,a:.35,hold:sd*16-.6,d:.6,v:.02,type:'triangle',lp:1400,dest:D});
    for(const [st,m,len] of SG.mel[bar]) if(st===s){ tone({at:t,f:hz(m),d:Math.max(.18,len*sd*1.2),v:.07,dest:D,send:AU.send}); tone({at:t,f:hz(m+12),d:.06,v:.014,type:'triangle',dest:D}); }
    return; }
  if(SG.style==='ink'){ if(s&1) t+=sd*.2; // swing
    if(s===0||s===7||s===10) tone({at:t,f:hz(SG.bass[bar]+(s===10?7:0)),d:.4,v:.26,type:'sine',lp:500,dest:D});
    if(s===4||s===12) noise({at:t,d:.09,v:.06,ft:'bandpass',f:1500,q:.9,dest:D});
    if(s%2===0) noise({at:t,d:.025,v:s%4===2?.035:.018,ft:'highpass',f:8000,dest:D});
    if(s===0||s===8) for(const m of SG.chords[bar]) tone({at:t,f:hz(m),a:.02,d:sd*7,v:.02,type:'triangle',lp:1600,dest:D});
    for(const [st,m,len] of SG.mel[bar]) if(st===s){ tone({at:t,f:hz(m),a:.003,d:Math.max(.2,len*sd*.9),v:.06,type:'triangle',lp:2400,dest:D,send:AU.send}); tone({at:t,f:hz(m+19),d:.05,v:.01,dest:D}); }
    return; }
  // Hearth
  if(s===0||s===8) tone({at:t,f:hz(SG.bass[bar]),d:.7,v:.24,type:'sine',lp:400,dest:D});
  if(s===12) tone({at:t,f:hz(SG.bass[bar]+7),d:.4,v:.16,type:'sine',lp:400,dest:D});
  if(s===4||s===12) noise({at:t,d:.16,v:.03,ft:'bandpass',f:2400,q:.6,dest:D});
  if(s===0) for(const m of SG.chords[bar]) for(const det of [-5,5]){ tone({at:t,f:hz(m),det,a:.02,hold:sd*6,d:1.2,v:.018,type:'sine',dest:D}); tone({at:t,f:hz(m+12),det,a:.01,d:.5,v:.006,type:'triangle',dest:D}); }
  if(s===8) for(const m of SG.chords[bar]) tone({at:t,f:hz(m),a:.02,d:.8,v:.012,type:'sine',dest:D});
  for(const [st,m,len] of SG.mel[bar]) if(st===s) tone({at:t,f:hz(m),a:.01,d:Math.max(.35,len*sd*1.1),v:.05,type:'sine',dest:D,send:AU.send}); }
const Music={on:false,step:0,next:0,iv:0,
  start(){ const c=audio(); if(!c||this.on) return; this.on=true; this.step=0; this.next=c.currentTime+.08;
    SG=SONGS[look('track')]||HEARTH;
    AU.dly.delayTime.setValueAtTime(3*60/SG.bpm/4,c.currentTime);
    const g=AU.mus.gain; g.cancelScheduledValues(c.currentTime); g.setValueAtTime(g.value,c.currentTime); g.linearRampToValueAtTime(MUSVOL,c.currentTime+2);
    clearInterval(this.iv); this.iv=setInterval(()=>this.tick(),30); },
  stop(){ if(!this.on) return; this.on=false; clearInterval(this.iv); const c=AU.ctx, g=AU.mus.gain; g.cancelScheduledValues(c.currentTime); g.setTargetAtTime(0,c.currentTime,.25); },
  restart(){ if(!this.on) return; this.stop(); setTimeout(()=>{ if(P.music) this.start(); },450); },
  tick(){ const c=AU.ctx, sd=60/SG.bpm/4; if(c.state!=='running'){ this.next=c.currentTime+.05; return; }
    if(this.next<c.currentTime) this.next=c.currentTime+.02;
    while(this.next<c.currentTime+.2){ musicStep(this.step,this.next,sd); this.next+=sd; this.step=(this.step+1)%128; } } };
const unlockAudio=()=>{ if(!P.sfx&&!P.music) return; audio(); if(P.music) Music.start(); };
['pointerdown','keydown','click'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));

// ===================== NAVIGATION =====================
// Android back: in a game it opens the pause menu first; then it closes a sheet; then it returns home; then (home, in Arcade) goes to Arcade.
let cur='home', sheetOn=false, guarded=false;
function show(id){ $$('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); cur=id; guard(); }
const needGuard=()=>ARCADE||cur!=='home'||sheetOn;
function guard(){ if(needGuard()&&!guarded){ try{ history.pushState({tc:1},''); guarded=true; }catch(e){} } }
addEventListener('popstate',()=>{ guarded=false; back(); guard(); });
function back(){
  if(cur==='game'&&G&&!G.st.over&&!sheetOn&&!coverOn()){ openPause(); return; }
  if(sheetOn){ closeSheet(); return; }
  if(cur==='game'&&G){ leaveGame(); return; }
  if(cur==='set'&&setReturn){ backFromSettings(); return; }
  if(cur!=='home'){ goHome(); return; }
  if(ARCADE) leaveTo(ARCADE_HOME); }
function leaveTo(url){ if(G) saveGame(); persist(); writeSummary(); location.replace(url); }
let sheetClose=null;
function openSheet(html,onClose){ $('#sheet').innerHTML=html; $('#ov').classList.add('on'); $('#sheet').scrollTop=0; sheetOn=true; sheetClose=onClose||null; guard(); }
function closeSheet(){ if(!sheetOn) return; $('#ov').classList.remove('on'); sheetOn=false; const f=sheetClose; sheetClose=null; if(f) f(); }
$('#ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeSheet(); });
$('#sheet').addEventListener('click',e=>{ if(e.target.closest('[data-close]')) closeSheet(); });
function goHome(){ closeSheet(); renderHome(); show('home'); }
const backBtn=`<button class="iconbtn" data-home aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>`;
document.addEventListener('click',e=>{ if(e.target.closest('[data-home]')) goHome(); });
function segHtml(key,opts,val){ return `<div class="seg" data-seg="${key}">${opts.map(([v,n])=>`<button data-v="${v}" class="${String(v)===String(val)?'on':''}">${n}</button>`).join('')}</div>`; }
async function share(text,okMsg){ try{ if(navigator.share){ await navigator.share({text}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast(okMsg||'Copied to the clipboard'); return; }catch(e){}
  openSheet(`<h2>Share</h2><div class="sub">Copy this text:</div><textarea rows="5" readonly>${esc(text)}</textarea><div class="btns"><button class="primary" data-close>Done</button></div>`); $('#sheet textarea').select(); }

// Par comes from the solver playing the same 10 turns as the Expert; it's worked out in slices and cached.
let parJob=null;
function needPar(date,done){ if(S.parCache[date]){ done&&done(S.parCache[date]); return; }
  if(parJob&&parJob.date===date){ parJob.cbs.push(done); return; }
  parJob={date,gen:parGen(dailyCfg(date)),cbs:[done]}; const job=parJob;
  const step=()=>{ if(parJob!==job) return; const t=performance.now(); let r;
    do r=job.gen.next(); while(!r.done&&performance.now()-t<6);
    if(r.done){ setPar(S,date,r.value); persist(); parJob=null; job.cbs.forEach(f=>f&&f(r.value)); } else requestAnimationFrame(step); };
  requestAnimationFrame(step); }

     <div class="btns"><button class="ghost" id="dShare">Share</button><button class="primary" id="dPrac">Practice</button></div>`;
    else body+=`<div class="btns"><button class="ghost" data-close>Close</button><button class="primary" id="dPlay"${par?'':' disabled'}>${dd.run?'Resume':par?'Play':'Working out par…'}</button></div>`;
    body+=`<div class="sub" style="text-align:center;margin:12px 0 0;font-size:12.5px">New Daily in ${hh}h ${mm}m</div>`;

async function gz(text,inflate){ const CS=inflate?window.DecompressionStream:window.CompressionStream; if(!CS) return null;
  const s=new Blob([text]).stream().pipeThrough(new CS('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); }
async function backupCode(){ const json=JSON.stringify(S);
  try{ const z=await gz(new TextEncoder().encode(json)); if(z){ let b=''; for(let i=0;i<z.length;i++) b+=String.fromCharCode(z[i]); return 'TILECRAFT1Z.'+btoa(b); } }catch(e){}
  return backupPlain(S); }
async function readBackup(text){ const m=/TILECRAFT1Z\.([A-Za-z0-9+/=]+)/.exec(String(text||''));
  if(m){ try{ const bin=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0)); const out=await gz(bin,true); const o=JSON.parse(new TextDecoder().decode(out)); return o&&typeof o.xp==='number'?o:null; }catch(e){ return null; } }

async function openBackup(){ if(G) saveGame(); const code=await backupCode();

  $('#bkCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(code); toast('Copied'); }catch(e){ $('#bkCode').select(); } S.bk.last=Date.now(); persist(); };
  $('#bkFile').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'})); a.download=`tilecraft-backup-${todayStr()}.txt`; a.click(); S.bk.last=Date.now(); persist(); };
  let armed=null; $('#bkGo').onclick=async()=>{ const o=await readBackup($('#bkIn').value); if(!o){ toast('That code isn\'t a Tilecraft backup'); return; }
    if(armed!==o.xp){ armed=o.xp; $('#bkGo').textContent=`Replace my progress (level ${levelOf(o.xp)})`; return; }

// ===================== GAME =====================
// G: {mode, lid, date, gid, st, hints, pend: Map(cell -> {k, ch, bl}), view: rack order, sel, z, tx, ty, ai, timer…}
let G=null;
const humanSeat=g=>g.mode==='tp'?(tpGame(g).mode==='local'?g.st.turn:tpGame(g).me):0;
const tpGame=g=>tpFind(S,g.gid);
const isAiTurn=g=>!g.st.over&&!!g.st.cfg.players[g.st.turn].ai;
const myTurn=g=>!g.st.over&&!isAiTurn(g)&&(g.mode!=='tp'||tpGame(g).mode==='local'||g.st.turn===tpGame(g).me);
function startGame(meta,st,extra){ stopAi(); stopTimer();
  G=Object.assign({st,hints:0,assisted:false,pend:new Map(),view:null,sel:null,z:1,tx:0,ty:0,ghost:null,started:Date.now()},meta,extra||{});
  if(G.mode==='classic'||G.mode==='campaign'||G.mode==='practice'){ S.run=runOf(G); } if(G.mode==='daily'){ dailyFor(S,G.date).run=runOf(G); }

function runOf(g){ return {mode:g.mode,lid:g.lid,date:g.date,st:g.st,hints:g.hints,assisted:g.assisted}; }
function resumeRun(run){ startGame({mode:run.mode,lid:run.lid,date:run.date},cloneState(run.st),{hints:run.hints||0,assisted:!!run.assisted}); }
function saveGame(){ if(!G) return; recallAll(true);
  if(G.mode==='tp'){ const g=tpGame(G); if(g){ g.last=g.last||Date.now(); } }
  else if(G.mode==='daily'){ const d=dailyFor(S,G.date); if(!d.scored) d.run=G.st.over?null:runOf(G); }
  else S.run=G.st.over?null:runOf(G);
  persist(); }
function leaveGame(){ saveGame(); stopAi(); stopTimer(); const m=G.mode; G=null; closeSheet(); hideCover(); if(m==='tp') openTp(); else if(m==='campaign'){ renderCamp(); show('camp'); } else goHome(); }

// ---------- layout: the board fills the width; zoom and pan move inside it ----------
let BV=0; // board view size (px)
function layout(){ if(!G) return; const col=$('#gcol').getBoundingClientRect(), n=boardOf(G.st.cfg).n;
  const rt=Math.max(34,Math.min(52,Math.floor((col.width-16-6*5)/7))); document.documentElement.style.setProperty('--rt',rt+'px'); document.documentElement.style.setProperty('--dt',Math.max(44,rt+4)+'px');
  const used=['#sb','#gtag','#banner','#wl','#rack','#acts'].reduce((a,s)=>{ const e=$(s); return a+(e&&!e.hidden?e.getBoundingClientRect().height+6:0); },0);
  BV=Math.floor(Math.max(160,Math.min(col.width-16,col.height-used-16))); const v=$('#bview'); v.style.width=v.style.height=BV+'px';
  G.s0=BV/n; G.zmax=Math.max(1,Math.min(3.2,44/G.s0)); setZoom(G.z,null,true); }
addEventListener('resize',()=>{ if(G&&cur==='game') layout(); });
function setZoom(z,at,quiet){ const n=boardOf(G.st.cfg).n; z=Math.max(1,Math.min(G.zmax,z)); const s=G.s0*z, size=n*s;

  G.z=z; G.tx=Math.min(0,Math.max(BV-size,G.tx)); G.ty=Math.min(0,Math.max(BV-size,G.ty)); if(z===1){ G.tx=0; G.ty=0; }

function renderSb(){ const st=G.st, np=st.racks.length, cfg=st.cfg, tg=G.mode==='tp'?tpGame(G):null;

// the rack in display order; G.view holds tiles, pending ones are hidden
