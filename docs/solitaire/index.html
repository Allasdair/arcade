     <div class="opt"><div class="h">Open deck<span>Every card is dealt face up: pure planning</span></div>${segHtml('open',[['0','Off'],['1','On']],c.open?'1':'0')}</div>
     <div class="opt"><div class="h">Difficulty</div>${segHtml('grade',[['any','Any'],['easy','Easy'],['medium','Medium'],['hard','Hard'],['expert','Expert']],c.grade)}</div>
     <div class="sub" style="font-size:12.5px;margin-top:6px">${n?TF('{0} graded deals match',n.toLocaleString(LANG)):'No deals match these choices yet. Try another difficulty.'}</div>
     <div class="btns"><button class="ghost" data-close>Close</button><button class="primary" id="goDeal" ${n?'':'disabled'}>Deal</button></div>`);
    $$('#sheet [data-seg]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const k=g.dataset.seg, v=b.dataset.v;
      c[k]=k==='grade'?v:k==='open'?v==='1':+v; draw(); }));

  draw(); }
function startClassic(){ if(S.run&&S.run.mode==='classic'&&S.run.st.moves>0&&!S.run.st.won) recordLoss(S.run);
  const d=pickClassic(S,S.setup,Math.random); if(!d){ toast('No deals match these choices'); return; }
  const cfg=dealCfg(d,{passes:S.setup.passes}); d.parTime=parTimeOf(d.draw,d.grade,d.par);
  startGame({mode:'classic',deal:d,st:newGame(dealSeed(d.n),cfg),assisted:false,hints:0}); }
// a Classic game abandoned after it started counts as a loss (it ends the win streak)
function recordLoss(run){ if(run.mode!=='classic'||run.lost) return; run.lost=true; recordClassic(S,run.deal,run.st.cfg,false,run.st.moves,run.st.time,run.assisted); }

function renderStyle(){ const all=COS_KINDS.flatMap(([k])=>COS[k]); $('#sCount').textContent=`${all.filter(it=>owned(S,it)).length}/${all.length}`;

      return `<button class="tcard${sel?' sel':''}${u?'':' locked'}" data-k="${k}" data-i="${i}">${previewHtml(k,it.id)}${u?'':`<div class="lock">${SI.lock}</div>`}
        <div class="n" data-raw>${esc(it.name)}</div><div class="q">${u?(sel?'In use':esc(COS_DESC[it.id]||'')):esc(lockText(it))}</div></button>`; }).join('')}</div>`; }

    if(k==='win'&&it.id!=='none'&&fxPrevT<performance.now()){ if(!P.motion) toast('Turn on Animations to see effects'); else { playWin(it.id,true); fxPrevT=performance.now()+3000; el.classList.add('playing'); setTimeout(()=>el.classList.remove('playing'),3000); } }
    if(!u){ toast('🔒 '+lockText(it)); return; }
    if(look(k)===it.id){ if((k==='track'||k==='amb')&&!P.music) toast('Turn on Music in Settings to hear it'); return; }
    S.look[k]=it.id; persist(); applyLook();
    if(k==='track'||k==='amb'){ if(P.music&&Music.on){ if(k==='track') Music.restart(); else Amb.start(); } else if(!P.music) toast('Turn on Music in Settings to hear it'); else Music.start(); }

function rowSw(id,name,on,d){ return `<button class="srow" data-sw="${id}"><div>${name}${d?`<div class="d">${d}</div>`:''}</div>${sw(on)}</button>`; }
function renderSettings(){ const pr=S.prefs;

  $$('#setBody [data-sw]').forEach(b=>b.onclick=()=>{ const k=b.dataset.sw; if(k==='four'){ S.prefs.four=!(S.prefs.four||P.cb); } else if(k in S.prefs) S.prefs[k]=!S.prefs[k]; else S[k]=!S[k]; persist(); refreshShared();
    if(k==='music'){ if(S.music) Music.start(); else Music.stop(); } if(k==='fullscreen'){ if(S.fullscreen) goFull(); else if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }
    applyLook(); renderSettings(); });
  if($('#langBtn')) $('#langBtn').onclick=openLang;
  $('#htBtn').onclick=openHowto; $('#wnBtn').onclick=openNews; $('#bkBtn').onclick=openBackup;

function goFull(){ if(!document.fullscreenEnabled||document.fullscreenElement) return; const r=document.documentElement.requestFullscreen; if(r) r.call(document.documentElement,{navigationUI:'hide'}).catch(()=>{}); }
addEventListener('pointerup',()=>{ if(P.fullscreen) goFull(); },true);
function openLang(){ const curL=S.lang||'auto';
  openSheet(`<h2>Language</h2><div class="sub">Solitaire restarts in the chosen language. Your progress is kept.</div><div class="box">${LANGS.map(([k,n])=>`<button class="srow" data-lang="${k}"><span data-raw>${k==='auto'?T('Automatic'):n}</span><span>${k===curL?'✓':''}</span></button>`).join('')}</div>
   <div class="sub" style="font-size:12px">Translations are machine-assisted. If something reads oddly, tell the developer.</div><div class="btns"><button class="ghost" data-close>Close</button></div>`);
  $$('#sheet [data-lang]').forEach(b=>b.onclick=()=>{ const v=b.dataset.lang; if(v===curL){ closeSheet(); return; } S.lang=v; persist(); location.reload(); }); }
function openHowto(){ openSheet(`<div class="howto"><h2>How to play</h2>
  <p>Move all 52 cards up to the four foundations, one pile per suit, from Ace to King.</p>
  <h3>The table</h3><p>Seven columns, with only the top card of each face up. Build columns down in rank with alternating colours (a red 6 on a black 7). A run of face-up cards moves together. Only a King, or a run starting with a King, can go into an empty column. When a face-down card is uncovered, it turns over by itself.</p>
  <h3>The stock</h3><p>Tap the stock to turn 1 or 3 cards onto the waste (Draw 1 or Draw 3). Only the top waste card can be played. When the stock is empty, tap it to turn the waste back over for another pass, if passes remain.</p>
  <h3>Moving cards</h3><p>Tap a card to send it to its best spot (foundation first, then a column); tap again to try the next spot. Or drag it. Double-tap sends a card to its foundation. Cards on a foundation can come back down to a column.</p>
  <h3>Moves and par</h3><p>Every card or run moved counts as 1 move, and so does each stock tap, each pass reset and each undo. Automatic flips and auto-complete don't count. Each deal has a par for moves and time, set by a solver and a bot that plays like a person.</p>
  <h3>Every deal winnable</h3><p>Every deal you're given has been proven winnable by a solver. Hints show the next move on a winning path. If a move leaves no way to win, a gentle banner says so and offers Undo. Open deck deals every card face up, for pure planning.</p>
  <h3>Modes</h3><p>Classic: choose the draw, passes, Open deck and difficulty. Campaign: three campaigns of 15 levels, with 3 stars each (par moves, par time, no hints). Daily: the same winnable deal for everyone, easy on Monday and hardest on Sunday, with one scored attempt.</p>
  <h3>Keyboard</h3><p>Arrow keys move the selection, Enter or Space plays its best move, D draws, U or Ctrl+Z undoes, H gives a hint, P or Esc pauses.</p></div>
  <div class="btns"><button class="primary" data-close>Got it</button></div>`); S.howto=true; persist(); }
function openNews(){ openSheet(`<h2>What's new</h2>${CHANGES.map(c=>`<div class="label">v${c.v} · ${c.d}</div><div class="howto">${c.n.map(n=>`<p>${esc(n)}</p>`).join('')}</div>`).join('')}<div class="btns"><button class="primary" data-close>Close</button></div>`); }
async function gz(bytes,inflate){ const CS=inflate?window.DecompressionStream:window.CompressionStream; if(!CS) return null;
  const s=new Blob([bytes]).stream().pipeThrough(new CS('gzip')); return new Uint8Array(await new Response(s).arrayBuffer()); }
async function backupCode(){ const json=JSON.stringify(S);
  try{ const z=await gz(new TextEncoder().encode(json)); if(z){ let b=''; for(let i=0;i<z.length;i++) b+=String.fromCharCode(z[i]); return 'SOLITAIRE1Z.'+btoa(b); } }catch(e){}
  return backupPlain(S); }
async function readBackup(text){ const m=/SOLITAIRE1Z\.([A-Za-z0-9+/=]+)/.exec(String(text||''));
  if(m){ try{ const bin=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0)); const out=await gz(bin,true); const o=JSON.parse(new TextDecoder().decode(out)); return o&&typeof o.xp==='number'?o:null; }catch(e){ return null; } }
  return parseBackup(text); }
async function openBackup(){ if(G) saveGame(); const code=await backupCode();
  openSheet(`<h2>Backup &amp; restore</h2><div class="sub">This code holds your Solitaire progress: XP, stars, records, achievements, settings and games in progress. Keep it somewhere safe.</div>
   <textarea rows="4" readonly id="bkCode">${esc(code)}</textarea><div class="btns"><button class="ghost" id="bkCopy">Copy</button><button class="ghost" id="bkFile">${esc(TF('Save to file ({0} KB)',Math.ceil(code.length/1024)))}</button></div>
   <div class="label">Restore</div><textarea rows="3" id="bkIn" placeholder="Paste a backup code"></textarea><div class="btns"><button class="ghost" data-close>Close</button><button class="primary" id="bkGo">Restore</button></div>`);
  $('#bkCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(code); toast('Copied'); }catch(e){ $('#bkCode').select(); } S.bk.last=Date.now(); persist(); };
  $('#bkFile').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'})); a.download=`solitaire-backup-${todayStr()}.txt`; a.click(); S.bk.last=Date.now(); persist(); };
  let armed=null; $('#bkGo').onclick=async()=>{ const o=await readBackup($('#bkIn').value); if(!o){ toast('That code isn\'t a Solitaire backup'); return; }
    if(armed!==o.xp){ armed=o.xp; $('#bkGo').textContent=TF('Replace my progress (level {0})',levelOf(o.xp)); return; }
    S=loadSave(JSON.stringify(o),REDUCED); G=null; persist(); refreshShared(); applyLook(); closeSheet(); goHome(); toast('Progress restored'); }; }
</script>
<script>
// ===================== GAME =====================
// G: {mode:'classic'|'campaign'|'daily'|'practice', lid, date, deal:{draw,n,grade,par,parTime}, st (engine state),
//     assisted, hints (hints used), over, …}. The clock runs from the first move, and pauses with the game.
const EL={}; let LY=null;
function startGame(run){ G=Object.assign({over:false,clockOn:false,t0:0},run); G.st.time=G.st.time||0; G.fresh=!G.st.moves&&!G.st.hist.length;
  saveGame(); show('game'); buildTable(); layoutTable(); clearMarks(); hideBanner();
  if(G.fresh&&P.motion) dealAnim(); else render(false);
  updateBar(); if(G.st.moves>0) startClock(); afterMove(true); }
function resumeRun(run){ if(!run) return; startGame(JSON.parse(JSON.stringify(run))); }
// where the game is kept: Classic and campaign in S.run, the Daily's scored attempt in S.daily.run, practice in S.daily.practice
function saveGame(){ if(!G) return; commitClock(); const o={mode:G.mode,lid:G.lid,date:G.date,deal:G.deal,st:G.st,assisted:G.assisted,hints:G.hints,lost:G.lost};
  if(G.over){ if(G.mode==='daily'){ S.daily.run=null; } else if(G.mode==='practice') S.daily.practice=null; else if(S.run&&S.run.st.seed===G.st.seed&&S.run.mode===G.mode) S.run=null; }
  else if(G.mode==='daily'){ dailyFor(S,G.date).run=o; } else if(G.mode==='practice'){ dailyFor(S,G.date).practice=o; } else S.run=o;
  persist(); }
function leaveGame(){ saveGame(); stopJobs(); G=null; goHome(); }
// ---------- clock ----------
function startClock(){ if(!G||G.over||G.clockOn||cur!=='game'||coverOn()||sheetOn) return; G.clockOn=true; G.t0=performance.now(); }
function commitClock(){ if(G&&G.clockOn){ const n=performance.now(); G.st.time+=n-G.t0; G.t0=n; } }
function stopClock(){ if(G&&G.clockOn){ commitClock(); G.clockOn=false; } }
const elapsed=()=>G?G.st.time+(G.clockOn?performance.now()-G.t0:0):0;
setInterval(()=>{ if(G&&cur==='game') updateBar(true); },500);
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(G&&cur==='game'&&!G.over){ stopClock(); saveGame(); if(!sheetOn) openPause(); } if(AU.ctx) AU.ctx.suspend().catch(()=>{}); }
  else if(AU.ctx&&(P.sfx||P.music)) AU.ctx.resume().catch(()=>{}); });
addEventListener('pagehide',()=>{ if(G) saveGame(); persist(); writeSummary(); });

// ---------- the table: piles and their places ----------
function buildTable(){ const t=$('#table'); t.innerHTML=''; applyLook();
  EL.slots={}; const mk=(id,cls,html)=>{ const d=document.createElement('div'); d.className='slot '+cls; d.dataset.pile=id; d.innerHTML=html||''; t.appendChild(d); EL.slots[id]=d; };
  mk('stock','stock',''); mk('waste','waste','');
  for(let i=0;i<4;i++) mk('f'+i,'fnd',`<span class="sb">${look('badge')==='suits'?SUITS[i]:''}</span>`);
  for(let i=0;i<7;i++) mk('t'+i,'col',look('badge')==='suits'?'K':'');
  EL.strip=document.createElement('div'); EL.strip.className='strip'; t.appendChild(EL.strip);
  EL.cards=[]; for(let c=0;c<52;c++){ const el=cardEl(c); t.appendChild(el); EL.cards[c]=el; } }
// sizes: 7 columns across; cards about 48 px wide at 360 px. Wider screens get larger cards, limited by the height.
function layoutTable(){ const wrap=$('#tableWrap'), W=wrap.clientWidth, H=wrap.clientHeight, large=S.prefs.large;
  const gapR=large?.012:.028; let cw=Math.floor((W-12)/(7+6*gapR)); const ratio=1.4;
  // on wide screens, keep the longest column (19 cards) able to fit: about 6.2 card heights tall
  cw=Math.min(cw,Math.floor(H/(ratio*(1+6.2*0.62)+.3)),150); cw=Math.max(cw,30);
  const ch=Math.round(cw*ratio), gap=Math.max(2,Math.floor(cw*gapR)), tw=7*cw+6*gap, x0=Math.floor((W-tw)/2);
  const colX=i=>x0+i*(cw+gap), lefty=!!P.lefty;
  const top=4, colTop=top+ch+Math.max(10,Math.round(ch*.16))+(G&&G.st.cfg.open?16:0);
  LY={W,H,cw,ch,gap,x0,top,colTop,colX,
    stock:{x:colX(lefty?6:0),y:top}, waste:{x:colX(lefty?5:1),y:top,dir:lefty?-1:1},
    f:i=>({x:colX(lefty?i:3+i),y:top})};
  const t=$('#table'); t.style.setProperty('--cw',cw+'px'); t.style.setProperty('--ch',ch+'px');
  const place=(el,p)=>{ el.style.transform=`translate(${p.x}px,${p.y}px)`; };
  place(EL.slots.stock,LY.stock); place(EL.slots.waste,LY.waste); for(let i=0;i<4;i++) place(EL.slots['f'+i],LY.f(i)); for(let i=0;i<7;i++) place(EL.slots['t'+i],{x:colX(i),y:colTop});
  EL.strip.style.cssText=`left:${x0}px;top:${top+ch+4}px;width:${tw}px;max-height:${colTop-top-ch-4}px`; }
addEventListener('resize',()=>{ if(G&&cur==='game'){ layoutTable(); render(false); } });
// fan offsets for a column: face-down 0.12 of a card height, face-up 0.3, squeezed to fit the height (never below the corner)
function colOffsets(i){ const st=G.st, n=st.cols[i].length, dn=st.down[i], ch=LY.ch, avail=LY.H-LY.colTop-ch-4;
  // in Open deck the blocked cards are face up, so they get enough room to show their corners
  const open=!!st.cfg.open, minU=Math.ceil(LY.cw*(S.prefs.large?.5:.42))+3;
  let od=open?Math.round(ch*.26):Math.round(ch*.12), ou=Math.round(ch*(S.prefs.large?.34:.3)); const nd=Math.min(dn,n-1), nu=Math.max(0,n-1-nd);
  const need=nd*od+nu*ou; if(need>avail&&need>0){ const minD=open?minU:Math.max(4,Math.round(ch*.05));
    const k=avail/need; od=Math.max(minD,Math.floor(od*k)); ou=Math.max(minU,Math.floor((avail-nd*od)/Math.max(1,nu))); }
  const ys=[]; let y=LY.colTop; for(let j=0;j<n;j++){ ys.push(y); y+=j<dn?od:ou; } return ys; }
// where every card goes: {x, y, z, up}
function positions(){ const st=G.st, P2=new Array(52), open=!!st.cfg.open, L=st.deck.length;
  for(let s=0;s<4;s++) for(let r=0;r<st.f[s];r++) P2[s*13+r]={...LY.f(s),z:10+r,up:true};
  for(let k=L-1;k>=st.wp;k--) P2[st.deck[k]]={x:LY.stock.x,y:LY.stock.y,z:100+(L-k),up:open&&k===st.wp};
  const fan=st.cfg.draw===3?Math.min(3,st.wp):1, fx=Math.round(LY.cw*.26)*LY.waste.dir;
  for(let k=0;k<st.wp;k++){ const off=k>=st.wp-fan?(k-(st.wp-fan)):0; P2[st.deck[k]]={x:LY.waste.x+off*fx,y:LY.waste.y,z:200+k,up:true}; }
  for(let i=0;i<7;i++){ const ys=colOffsets(i); st.cols[i].forEach((c,j)=>{ P2[c]={x:LY.colX(i),y:ys[j],z:300+i*25+j,up:j>=st.down[i]||open,blocked:open&&j<st.down[i]}; }); }
  return P2; }
let flyT=0;
function render(anim){ if(!G) return; const st=G.st, pos=positions(), now=EL.cards;
  for(let c=0;c<52;c++){ const el=now[c], p=pos[c]; if(!p) continue; const tr=`translate(${p.x}px,${p.y}px)`, moved=el.style.transform!==tr;
    el.classList.toggle('anim',!!anim&&P.motion||!!anim&&moved);
    if(moved&&anim){ el.style.zIndex=1000+p.z; if(look('trail')==='soft'&&P.motion) el.classList.add('trail'); } else el.style.zIndex=p.z;
    el.style.transform=tr; el.classList.toggle('up',p.up); el.classList.toggle('blocked',!!p.blocked); el.dataset.z=p.z; }
  clearTimeout(flyT); flyT=setTimeout(()=>{ for(let c=0;c<52;c++){ const el=now[c]; el.style.zIndex=el.dataset.z; el.classList.remove('trail'); } },420);
  // the stock slot: a reset arrow while passes remain, a cross when none do
  const sl=EL.slots.stock; sl.innerHTML=stockLeft(st)?'':canReset(st)?'<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9.7 9.7 0 00-6.7 2.8L3 8"/><path d="M3 3v5h5"/></svg>':(st.deck.length?'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>':'');
  EL.strip.innerHTML=st.cfg.open&&stockLeft(st)?`<span data-raw>${st.deck.slice(st.wp).map(c=>`<i class="s${suitOf(c)}" style="color:inherit">${cardName(c)}</i>`).join('')}</span>`:'';
  EL.strip.hidden=!st.cfg.open;
  $('#bAuto').hidden=!canAutoComplete(st)||G.over||G.autoRun; }
// The deal animation: cards fly from the stock (Cascade, Riffle) or from the centre (Fan-out), then the top cards turn.
function dealAnim(){ const pos=positions(), id=look('deal'), st=G.st; G.dealing=true;
  const start=id==='fan'?{x:LY.W/2-LY.cw/2,y:LY.H/2-LY.ch/2}:LY.stock;
  for(let c=0;c<52;c++){ const el=EL.cards[c]; el.classList.remove('anim','up'); el.style.transition='none'; el.style.transform=`translate(${start.x}px,${start.y}px)`; el.style.zIndex=pos[c].z; }
  void $('#table').offsetWidth; let k=0; const order=[];
  const mx=Math.max(...st.cols.map(c=>c.length)); for(let row=0;row<mx;row++) for(let i=0;i<7;i++) if(st.cols[i][row]!=null) order.push(st.cols[i][row]);
  const step=S.prefs.speed==='fast'?18:32;
  order.forEach((c,n)=>{ const el=EL.cards[c], p=pos[c], d=id==='riffle'?(n%2?n*step*.7+40:n*step*.7):n*step;
    el.style.transition=`transform ${id==='fan'?.5:.32}s cubic-bezier(.25,.8,.3,1) ${d}ms`; el.style.transform=`translate(${p.x}px,${p.y}px)`+(id==='riffle'?' rotate(0deg)':''); k=Math.max(k,d); });
  for(let c=0;c<52;c++) if(!order.includes(c)){ const el=EL.cards[c]; el.style.transition=''; el.style.transform=`translate(${pos[c].x}px,${pos[c].y}px)`; }
  sfx('stock',4);
  setTimeout(()=>{ for(let c=0;c<52;c++){ EL.cards[c].style.transition=''; } G&&(G.dealing=false); render(false); sfx('flip'); },k+380); }

// ---------- reading what's under the pointer ----------
function srcOfCard(c){ const st=G.st;
  for(let i=0;i<7;i++){ const j=st.cols[i].indexOf(c); if(j>=0) return j>=st.down[i]?{k:'t',i,j}:null; }
  if(st.wp>0&&st.deck[st.wp-1]===c) return {k:'w'};
  const s=suitOf(c); if(st.f[s]>0&&s*13+st.f[s]-1===c) return {k:'f',i:s};
  if(st.deck.indexOf(c)>=st.wp) return {k:'stock'}; return null; }
// the pile under a point: columns run from their top to the bottom of the table
function pileAt(x,y){ const {cw,ch,gap}=LY;
  if(y<LY.colTop-gap){ for(let i=0;i<4;i++){ const p=LY.f(i); if(x>=p.x-gap&&x<=p.x+cw+gap&&y<=p.y+ch+gap) return {k:'f',i}; } return null; }
  for(let i=0;i<7;i++){ const x0=LY.colX(i); if(x>=x0-gap/2&&x<=x0+cw+gap/2) return {k:'t',i}; } return null; }
const pileEl=to=>{ const st=G.st; if(to.k==='f') return st.f[to.i]?EL.cards[to.i*13+st.f[to.i]-1]:EL.slots['f'+to.i];
  const col=st.cols[to.i]; return col.length?EL.cards[col[col.length-1]]:EL.slots['t'+to.i]; };
const srcCards=src=>src.k==='stock'?[]:cardsOf(G.st,src);

// ---------- input: tap, double-tap, drag ----------
let PT=null, lastTap={c:-1,t:0}, tapCycle=null, sel=null, kSel=null;
$('#table').addEventListener('pointerdown',e=>{ if(!G||G.over||G.dealing||G.autoRun) return; const r=$('#table').getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  const cardE=e.target.closest('.pc'), slotE=e.target.closest('.slot');
  let src=null, c=-1; if(cardE){ c=+cardE.dataset.c; src=srcOfCard(c); } else if(slotE&&slotE.dataset.pile==='stock') src={k:'stock'};
  PT={id:e.pointerId,x0:e.clientX,y0:e.clientY,x,y,src,c,slot:slotE&&slotE.dataset.pile,drag:false,els:[],moved:false,t:performance.now()};
  if(src&&src.k!=='stock'){ const cs=srcCards(src); if(cs.length){ PT.els=cs.map(k=>EL.cards[k]); PT.base=PT.els.map(el=>{ const m=/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/.exec(el.style.transform); return {x:+m[1],y:+m[2]}; }); } }
  try{ $('#table').setPointerCapture(e.pointerId); }catch(err){} });
$('#table').addEventListener('pointermove',e=>{ if(!PT||e.pointerId!==PT.id||!PT.els.length) return; const dx=e.clientX-PT.x0, dy=e.clientY-PT.y0;
  if(!PT.drag){ if(Math.hypot(dx,dy)<7) return; PT.drag=true; startDrag(); }
  PT.els.forEach((el,i)=>{ el.style.transform=`translate(${PT.base[i].x+dx}px,${PT.base[i].y+dy}px)`; }); });
$('#table').addEventListener('pointerup',e=>{ if(!PT||e.pointerId!==PT.id) return; const p=PT; PT=null;
  if(p.drag){ endDrag(p,e); return; }
  if(performance.now()-p.t>650) return; // a long press does nothing
  onTap(p); });
$('#table').addEventListener('pointercancel',()=>{ if(PT&&PT.drag){ clearTargets(); render(true); } PT=null; });
function startDrag(){ clearMarks(); sfx('pick'); buzz(8); PT.els.forEach((el,i)=>{ el.classList.remove('anim'); el.classList.add('lift'); el.style.zIndex=2000+i; });
  // highlight every valid drop target
  for(const to of targetsFor(PT.src)) pileEl(to).classList.add('tgt'); }
function targetsFor(src){ const st=G.st, out=[], cs=srcCards(src); if(!cs.length) return out;
  for(let i=0;i<4;i++) if(legal(st,src,{k:'f',i})) out.push({k:'f',i}); for(let i=0;i<7;i++) if(legal(st,src,{k:'t',i})) out.push({k:'t',i}); return out; }
function clearTargets(){ $$('#table .tgt').forEach(e=>e.classList.remove('tgt')); }
function endDrag(p,e){ clearTargets(); p.els.forEach(el=>el.classList.remove('lift')); const r=$('#table').getBoundingClientRect();
  // the drop point: the centre of the dragged card's top edge
  const tx=e.clientX-r.left-(p.x-p.base[0].x)+LY.cw/2, ty=e.clientY-r.top-(p.y-p.base[0].y)+LY.ch*.3;
  let to=pileAt(tx,ty)||pileAt(e.clientX-r.left,e.clientY-r.top);
  if(to&&legal(G.st,p.src,to)){ doMove(p.src,to,{drag:true}); return; }
  sfx('bad'); render(true); }
function onTap(p){ const st=G.st, now=performance.now();
  if(p.src&&p.src.k==='stock'||p.slot==='stock'){ doDraw(); return; }
  if(S.prefs.tap==='select'){ selectTap(p); return; }
  if(!p.src){ return; }
  // double-tap: send to the foundation (the first tap already tried it), so the second tap is ignored
  if(p.c===lastTap.c&&now-lastTap.t<320){ lastTap={c:-1,t:0}; return; }
  lastTap={c:p.c,t:now};

  let list=tapTargets(st,p.src);
  if(tapCycle&&tapCycle.c===p.c&&now-tapCycle.t<4000){ const tried=tapCycle.tried; const nx=list.find(t=>!tried.some(q=>q.k===t.k&&q.i===t.i));
    if(nx){ tried.push(nx); tapCycle.t=now; doMove(p.src,nx,{tap:true}); return; } }
  if(!list.length){ sfx('bad'); shake(p.c); return; }
  const here=p.src.k==='t'?{k:'t',i:p.src.i}:p.src.k==='f'?{k:'f',i:p.src.i}:null;
  tapCycle={c:p.c,t:now,tried:[list[0]].concat(here?[here]:[])}; doMove(p.src,list[0],{tap:true}); }
// "select, then tap a target": first tap picks the card (or run), the next tap on a pile moves it there
function selectTap(p){ const st=G.st, now=performance.now();
  if(p.src&&p.c===lastTap.c&&now-lastTap.t<320){ lastTap={c:-1,t:0}; const cs=srcCards(p.src); if(cs.length===1&&legal(st,p.src,{k:'f',i:suitOf(cs[0])})){ setSel(null); doMove(p.src,{k:'f',i:suitOf(cs[0])}); } return; }
  lastTap={c:p.c,t:now};
  if(sel){ const r=$('#table').getBoundingClientRect(); const to=pileAt(p.x,p.y); if(to&&legal(st,sel,to)){ const s=sel; setSel(null); doMove(s,to); return; }
    if(p.src&&!(sel.k===p.src.k&&sel.i===p.src.i&&sel.j===p.src.j)){ setSel(p.src); return; } setSel(null); return; }
  if(p.src) setSel(p.src); }
function setSel(src){ $$('#table .pc.lift').forEach(e=>e.classList.remove('lift')); clearTargets(); sel=src; if(!src) return; const cs=srcCards(src); cs.forEach(c=>EL.cards[c].classList.add('lift')); for(const to of targetsFor(src)) pileEl(to).classList.add('tgt'); sfx('pick'); }
function shake(c){ if(!P.motion||c<0) return; const el=EL.cards[c], b=el.style.transform; el.animate([{transform:b},{transform:b+' translateX(-4px)'},{transform:b+' translateX(4px)'},{transform:b}],{duration:200}); }

// ---------- making moves ----------
function doMove(from,to,o){ if(!G||G.over) return false; o=o||{}; const st=G.st, r=move(st,from,to); if(!r){ sfx('bad'); return false; }
  if(o.tap!==true) tapCycle=null; afterAction(); sfx(to.k==='f'?'chime':'place',to.k==='f'?rankOf(r.cards[0]):0);
  if(to.k==='f'){ landGlow(to.i); buzz(10); } if(r.flipped.length) setTimeout(()=>sfx('flip'),120);
  render(true); afterMove(); return true; }
function doDraw(){ if(!G||G.over) return; const r=draw(G.st); if(!r){ if(stockLeft(G.st)===0&&G.st.deck.length) toast('No passes left'); return; }
  tapCycle=null; afterAction(); sfx(r.k==='reset'?'reset':'stock',r.cards?r.cards.length:1); render(true); afterMove(); }
function doUndo(){ if(!G||G.over) return; if(!canUndo(G.st)){ if(undoLeft(G.st)<=0) toast(G.st.cfg.undo===0?'Undo is off on this level':'No undos left'); return; }
  undo(G.st); tapCycle=null; afterAction(); sfx('undo'); render(true); afterMove(); }
function afterAction(){ clearMarks(); setSel(null); startClock(); if(!G.st.moves) return; }
function landGlow(i){ if(look('glow')!=='glow'||!P.motion) return; const el=EL.slots['f'+i]; el.classList.remove('glow'); void el.offsetWidth; el.classList.add('glow'); }
// after every action: safe auto-move, save, the "still winnable?" check, stuck, move limit, win
let safeT=0;
function afterMove(initial){ if(!G) return; const st=G.st; updateBar(); hideBanner();
  if(S.prefs.safe&&!initial){ clearTimeout(safeT); safeT=setTimeout(()=>{ if(!G||G.over) return; const m=nextSafe(G.st); if(m){ const r=move(G.st,m.from,m.to,{free:true}); if(r){ sfx('chime',rankOf(r.cards[0])); landGlow(m.to.i); render(true); afterMove(); } } },P.motion?260:30); }
  saveGame();
  if(st.won){ finish(true); return; }
  if(st.cfg.moveLimit&&st.moves>=st.cfg.moveLimit&&!canAutoComplete(st)){ finish(false,'limit'); return; }
  $('#bAuto').hidden=!canAutoComplete(st)||G.autoRun;
  if(!initial) checkPosition(); }
// ---------- solver jobs, run in ~8 ms slices per frame ----------
let job=null;
function runJob(j,done){ stopJobs(); job=j; const tick=()=>{ if(job!==j) return; const t=performance.now(); let r;
    do{ r=j.step(200); }while(!r&&performance.now()-t<8||(r==='run'&&performance.now()-t<8));
    if((r===null||r==='run')&&job===j){ requestAnimationFrame(tick); return; } if(job===j) job=null; done(r); };
  requestAnimationFrame(tick); }
function stopJobs(){ job=null; }
// "Still winnable?": after a move that leaves no way to win, a gentle banner with Undo. A timeout stays quiet.
function checkPosition(){ const st=G.st; if(canAutoComplete(st)||st.won) return;
  const stuck=isStuck(st);
  if(!S.prefs.warn){ if(stuck) showStuck(); return; }
  const snapAt=st.moves, J=makeWinCheck(st,120000); J.step0=J.step; J.step=n=>J.step0(n);
  runJob({step:n=>J.step(n)},r=>{ if(!G||G.st.moves!==snapAt) return; if(r==='no'){ sfx('alert'); showBanner(`<b>This deal can't be won from here.</b><button id="bnUndo">Undo</button>`); $('#bnUndo').onclick=doUndo; G.warned=true; }
    if(stuck) showStuck(); }); }
// stuck: no move helps any more (only pointless stock cycling is left)
function isStuck(st){ const s=solverState(st); return sMoves(s,'fast').length===0&&!sCanAuto(s); }
function showStuck(){ if(!G||G.over||sheetOn) return; sfx('stuck');
  openSheet(`<h2>No more useful moves</h2><div class="sub">Only stock cycling is left. Undo, restart this deal${G.mode==='classic'?' or take a new one':''}.</div>
   <div class="btns"><button class="ghost" id="skUndo" ${canUndo(G.st)?'':'disabled'}>Undo</button>${G.mode!=='daily'?'<button class="ghost" id="skRestart">Restart</button>':''}${G.mode==='classic'?'<button class="primary" id="skNew">New deal</button>':G.mode==='daily'?'<button class="primary" id="skGive">End attempt</button>':''}</div>`);
  if($('#skUndo')) $('#skUndo').onclick=()=>{ closeSheet(); doUndo(); };
  if($('#skRestart')) $('#skRestart').onclick=()=>{ closeSheet(); restartDeal(); };
  if($('#skNew')) $('#skNew').onclick=()=>{ closeSheet(); newDeal(true); };
  if($('#skGive')) $('#skGive').onclick=()=>{ closeSheet(); finish(false,'gave'); }; }
function showBanner(h){ const b=$('#banner'); b.innerHTML=h; b.hidden=false; }
function hideBanner(){ $('#banner').hidden=true; }
// ---------- hints: the next move on a winning path ----------
function doHint(){ if(!G||G.over) return; const st=G.st; if(canAutoComplete(st)){ toast('Tap Finish to complete the game'); return; }
  if(S.hints<=0){ toast('No hints left today. You get +1 for every level-up.'); return; }
  const snapAt=st.moves, sv=makeSolver(st,{mode:'fast',limit:150000}); setTimeout(()=>{ if(job&&G&&G.st.moves===snapAt) toast('Looking for a winning move…'); },400);
  runJob(sv,r=>{ if(!G||G.st.moves!==snapAt) return;
    if(r==='win'){ // skip the starting safe moves the solver made for free: the hint is the first real action
      const a=sv.solution[0]; if(!useHint(S)) return; G.hints++; G.assisted=true; persist(); updateBar(); sfx('hint'); showHint(a); }
    else if(r==='fail'){ sfx('alert'); showBanner(`<b>This deal can't be won from here.</b><button id="bnUndo">Undo</button>`); $('#bnUndo').onclick=doUndo; }
    else toast('No hint found this time. Try another move first.'); }); }
function showHint(a){ clearMarks(); const st=G.st;
  if(a==='d'){ const top=stockLeft(st)?EL.cards[st.deck[st.wp]]:EL.slots.stock; top.classList.add('hint'); return; }
  const m=decMove(a); const cs=cardsOf(st,m.from); if(m.to.i===-1&&cs.length) m.to.i=suitOf(cs[0]);
  cs.forEach(c=>EL.cards[c].classList.add('hint')); pileEl(m.to).classList.add('hint'); }
function clearMarks(){ $$('#table .hint').forEach(e=>e.classList.remove('hint')); $$('#table .ksel').forEach(e=>e.classList.remove('ksel')); }
// ---------- auto-complete ----------
function autoComplete(){ if(!G||!canAutoComplete(G.st)) return; G.autoRun=true; $('#bAuto').hidden=true; stopJobs(); const step=()=>{ if(!G) return; const r=autoStep(G.st);
    if(!r){ G.autoRun=false; afterMove(); return; } sfx('chime',rankOf(r.cards[0])); landGlow(r.to.i); render(true); setTimeout(step,P.motion?(S.prefs.speed==='fast'?45:80):5); };
  step(); }
$('#bAuto').onclick=autoComplete;

// ---------- the top bar ----------
function updateBar(tick){ if(!G) return; const st=G.st, d=G.deal, t=elapsed();

// ---------- buttons ----------
$('#bPause').onclick=()=>openPause(); $('#bUndo').onclick=doUndo; $('#bHint').onclick=doHint;
$('#bRestart').onclick=()=>{ if(!G) return; if(G.st.moves&&!G.restartArm){ G.restartArm=true; $('#bRestart span').textContent=T('Tap again'); $('#bRestart').classList.add('armed'); setTimeout(()=>{ if(G){ G.restartArm=false; $('#bRestart span').textContent=T('Restart'); $('#bRestart').classList.remove('armed'); } },2500); return; }
  $('#bRestart span').textContent=T('Restart'); $('#bRestart').classList.remove('armed'); restartDeal(); };
$('#bNew').onclick=()=>newDeal(false);
// New deal needs two taps while a game is in progress (and counts it as a loss)
function newDeal(force){ if(!G||G.mode!=='classic') return; if(!force&&G.st.moves&&!G.st.won&&!G.newArm){ G.newArm=true; $('#bNew').classList.add('armed'); $('#bNew span').textContent=T('Tap again');
    setTimeout(()=>{ if(G){ G.newArm=false; $('#bNew').classList.remove('armed'); $('#bNew span').textContent=T('New deal'); } },2500); return; }
  $('#bNew span').textContent=T('New deal'); if(G.st.moves&&!G.st.won&&!G.over) recordLoss(G); G=null; S.run=null; startClassic(); }
// Restart this deal: same deal from the start; hints already used still mark the game assisted
function restartDeal(){ if(!G) return; const run=Object.assign({},G); const L=G.lid?levelById(G.lid):null;
  run.st=L?levelGame(L):newGame(G.st.seed,G.st.cfg); run.over=false; delete run.clockOn; stopJobs(); startGame(run); }
// ---------- pause ----------
function openPause(){ if(!G||G.over) return; stopClock(); saveGame(); const m=G.mode;
  const cv=$('#cover'); cv.innerHTML=`<h2>Paused</h2><button id="pRes">Resume</button>${m!=='daily'?'<button id="pRestart">Restart this deal</button>':''}${m==='classic'?'<button id="pNew">New deal</button>':''}
   <button id="pSet">Settings</button><button id="pHow">How to play</button>${m==='daily'?'<button id="pGive">End attempt</button>':''}<button id="pQuit">Save and quit</button>`;
  cv.classList.add('on'); guard();

  $('#pSet').onclick=()=>{ cv.classList.remove('on'); openSettingsFromGame(); }; $('#pHow').onclick=openHowto;

function resume(){ $('#cover').classList.remove('on'); if(G&&G.st.moves) startClock(); }
// ---------- keyboard ----------
const KSRC=()=>['stock','waste','f0','f1','f2','f3','t0','t1','t2','t3','t4','t5','t6'];
document.addEventListener('keydown',e=>{ if(cur!=='game'||!G||sheetOn) return; if(coverOn()){ if(e.key==='Escape'||e.key==='p'||e.key==='P') resume(); return; }
  const k=e.key.toLowerCase();
  if(k==='escape'||k==='p'){ openPause(); e.preventDefault(); return; }
  if(G.over) return;
  if((e.ctrlKey||e.metaKey)&&k==='z'||k==='u'){ doUndo(); e.preventDefault(); return; }
  if(k==='d'){ doDraw(); return; } if(k==='h'){ doHint(); return; }
  const list=KSRC(); if(['arrowleft','arrowright','arrowup','arrowdown'].includes(k)){ e.preventDefault(); let i=kSel==null?6:list.indexOf(kSel);
    if(k==='arrowright') i=Math.min(list.length-1,i+1); else if(k==='arrowleft') i=Math.max(0,i-1); else if(k==='arrowdown'&&i<6) i=6+Math.min(6,Math.max(0,i)); else if(k==='arrowup'&&i>=6) i=Math.max(0,Math.min(5,i-6));

    if(kSel==='stock'){ doDraw(); return; } let src=null;
    if(kSel==='waste') src={k:'w'}; else if(kSel[0]==='f') src={k:'f',i:+kSel[1]}; else { const i=+kSel[1], col=st.cols[i]; if(col.length) src={k:'t',i,j:col.length-1};
      // the longest movable run first, if it has a destination
      for(let j=st.down[i];j<col.length;j++) if(isRun(col,j)&&tapTargets(st,{k:'t',i,j}).length){ src={k:'t',i,j}; break; } }
    if(!src||!srcCards(src).length){ sfx('bad'); return; } const t=tapTargets(st,src); if(!t.length){ sfx('bad'); return; } doMove(src,t[0]); markK(); } });
function markK(){ $$('#table .ksel').forEach(e=>e.classList.remove('ksel')); if(!kSel||!G) return; const st=G.st; let el;
  if(kSel==='stock') el=stockLeft(st)?EL.cards[st.deck[st.wp]]:EL.slots.stock; else if(kSel==='waste') el=st.wp?EL.cards[st.deck[st.wp-1]]:EL.slots.waste;

// ---------- the end of a game ----------
function finish(won,why){ if(!G||G.over) return; stopClock(); stopJobs(); G.over=true; const st=G.st, d=G.deal, t=st.time, mv=st.moves, today=todayStr();
  let res={won,why,xp:null,stars:null,fresh:[],ach:[],recs:[]};
  if(G.mode==='classic'){ res.recs=recordClassic(S,d,st.cfg,won,mv,t,G.assisted); res.stars=winStars(won,mv,t,d.par,d.parTime);
    if(won) res.xp=addXP(S,classicXP(d,st.cfg,G.assisted)); res.ach=checkAch(S,{mode:'classic',won,cfg:st.cfg,deal:d,moves:mv,time:t,hints:G.hints,undos:st.undos}); }
  else if(G.mode==='campaign'){ const L=levelById(G.lid), cr=campaignResult(S,L,won,mv,t,G.hints); res.stars=cr.earned; res.fresh=cr.fresh; res.camp=cr; if(cr.xp) res.xp=addXP(S,cr.xp);
    res.ach=checkAch(S,{mode:'campaign'}); }
  else if(G.mode==='daily'){ const dr=dailyResult(S,G.date,won,mv,t,G.assisted,today); if(dr){ res.stars=dr.stars; if(dr.xp) res.xp=addXP(S,dr.xp); } res.ach=checkAch(S,{mode:'daily'}); }
  else { res.stars=winStars(won,mv,t,d.par,d.parTime); }
  saveGame(); persist(); writeSummary();
  if(won){ sfx('win'); buzz([20,40,20]); if(P.motion&&look('win')!=='none') playWin(look('win')); setTimeout(()=>showResults(res),P.motion&&look('win')!=='none'?1800:500); }
  else { sfx('stuck'); showResults(res); } }
function showResults(res){ if(!G) return; const st=G.st, d=G.deal, m=G.mode, L=G.lid?levelById(G.lid):null, won=res.won;
  const labels=m==='campaign'?[TF('{0} moves or fewer',d.par),TF('{0} or less',fmtTime(d.parTime*1000)),'No hints']:['Cleared',TF('Par: {0} moves',d.par),TF('Par time: {0}',fmtTime(d.parTime*1000))];
  const title=won?(m==='practice'?'Practice cleared':'You win!'):res.why==='limit'?'Out of moves':'Not this time';
  let h=`<h2>${title}</h2><div class="sub">${m==='campaign'?`<span data-raw>${esc(lvName(L))}</span>`:esc(m==='classic'?'Classic · '+dealLabel(d,st.cfg):m==='daily'?TF('Daily · {0}',G.date):TF('Daily practice · {0}',G.date))}${G.assisted?' · '+esc(T('assisted')):''}</div>
   <div class="kv"><div><b>${st.moves}</b><span>Moves</span></div><div><b>${fmtTime(st.time)}</b><span>Time</span></div><div><b>${st.undos}</b><span>Undos</span></div></div>`;
  if(res.stars) h+=labels.map((lb,i)=>`<div class="goal${res.stars[i]?' got':''}${res.fresh.includes(i)?' new':''}"><span class="st">★</span><span>${esc(lb)}${m==='campaign'&&res.fresh.includes(i)?' · <b>'+esc(T('New!'))+'</b>':''}</span></div>`).join('');
  if(m==='campaign'&&!won) h+=`<div class="sub" style="margin-top:6px">Clear the level to earn its stars.</div>`;
  if(m==='practice') h+=`<div class="sub" style="margin-top:6px">Practice doesn't score.</div>`;
  if(res.xp) h+=`<div class="sub" style="margin-top:10px"><b>+${res.xp.xp} XP</b>${res.xp.after>res.xp.before?` · <span>${esc(TF('Level {0}!',res.xp.after))}</span> · <span>${esc(TF('+{0} hint',res.xp.hints))}</span>`:''}</div>${res.xp.rewards.length?`<div class="sub">${esc(TF('Unlocked: {0}',res.xp.rewards.join(', ')))}</div>`:''}`;
  if(res.camp&&res.camp.finished) h+=`<div class="sub"><b>${esc(TF('{0} complete!',T(CAMPS[L.camp].name)))}</b></div>`;
  if(res.recs&&res.recs.length) h+=`<div class="sub">${esc(TF('New record: {0}',res.recs.map(T).join(', ')))}</div>`;
  if(res.ach.length) h+=`<div class="label">Achievements</div><div class="box">${res.ach.map(id=>{ const a=ACH.find(x=>x.id===id); return `<div class="ach done"><div class="m">★</div><div><div class="n" data-raw>${esc(a.name)}</div><div class="d">${esc(a.desc)}${a.reward?' · '+esc(TF('Unlocks {0}',T(a.reward))):''}</div></div></div>`; }).join('')}</div>`;
  const next=m==='campaign'?LEVELS[LEVELS.indexOf(L)+1]:null;
  h+=`<div class="btns"><button class="ghost" id="rHome">Home</button>${m==='classic'?'<button class="ghost" id="rSame">Replay deal</button><button class="primary" id="rNew">New deal</button>':''}
   ${m==='campaign'?`<button class="ghost" id="rRetry">${won?'Retry for stars':'Retry'}</button>${won&&next&&unlocked(S,next)?'<button class="primary" id="rNext">Next level</button>':'<button class="primary" id="rMap">Campaign</button>'}`:''}
   ${m==='daily'?'<button class="ghost" id="rShare">Share</button><button class="primary" id="rPrac">Practise</button>':''}${m==='practice'?'<button class="primary" id="rPrac">Practise again</button>':''}</div>`;
  if(res.xp&&res.xp.after>res.xp.before) sfx('level');
  res.stars&&res.stars.forEach((s,i)=>{ if(s) setTimeout(()=>sfx('star',i),300+i*220); });
  openSheet(h,()=>{});
  const end=()=>{ const g=G; G=null; return g; };
  $('#rHome').onclick=()=>{ end(); goHome(); };
  if($('#rNew')) $('#rNew').onclick=()=>{ closeSheet(); end(); startClassic(); };
  if($('#rSame')) $('#rSame').onclick=()=>{ closeSheet(); const g=end(); startGame({mode:'classic',deal:g.deal,st:newGame(g.st.seed,g.st.cfg),assisted:false,hints:0}); };
  if($('#rRetry')) $('#rRetry').onclick=()=>{ closeSheet(); end(); startLevel(L); };
  if($('#rNext')) $('#rNext').onclick=()=>{ closeSheet(); end(); openCamp(next.camp); openLevel(next); };
  if($('#rMap')) $('#rMap').onclick=()=>{ closeSheet(); end(); openCamp(L.camp); };
  if($('#rShare')) $('#rShare').onclick=()=>{ const dd=S.daily; share(shareLine(G?G.date:dd.date,dd.moves,dd.time,dd.stars,dd.assisted,dd.cleared)); };
  if($('#rPrac')) $('#rPrac').onclick=()=>{ closeSheet(); const g=end(); const dl=dailyDeal(g.date); dailyFor(S,g.date).practice=null; startGame({mode:'practice',date:g.date,deal:dl,st:newGame(dealSeed(dl.n),{draw:dl.draw}),assisted:false,hints:0}); }; }

// ===================== WIN EFFECTS (full-screen canvas) =====================
// None, Bouncing Cascade (our own take: cards spring off the foundations and bounce away, no trails), Card Fountain,
// Fireworks and Foundation Burst. Skipped when Animations are off.
function playWin(id,preview){ const cv=$('#fxc'), dpr=Math.min(2,devicePixelRatio||1); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const W=innerWidth, H=innerHeight, cw=LY&&!preview?LY.cw:44, ch=Math.round(cw*1.4), cols=suitCols(), sc=[cols.sk,cols.sr,cols.sd,cols.sc], tb=$('#table').getBoundingClientRect();
  const fpos=i=>LY&&!preview?{x:tb.left+LY.f(i).x+cw/2,y:tb.top+LY.f(i).y+ch/2}:{x:W*(.35+i*.1),y:H*.3};
  const ps=[]; let t0=performance.now(), dur=id==='bounce'?3200:2600;
  const drawCard=(p)=>{ g.save(); g.translate(p.x,p.y); g.rotate(p.r||0); g.globalAlpha=Math.max(0,p.a==null?1:p.a); g.fillStyle='#fff'; g.strokeStyle='rgba(0,0,0,.25)'; g.lineWidth=1;
    const w=cw*.8,h=ch*.8; g.beginPath(); g.roundRect?g.roundRect(-w/2,-h/2,w,h,w*.1):g.rect(-w/2,-h/2,w,h); g.fill(); g.stroke();
    g.fillStyle=sc[suitOf(p.c)]; g.font=`800 ${Math.round(w*.42)}px Inter,sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(RANKS[rankOf(p.c)],0,-h*.12); g.font=`${Math.round(w*.4)}px sans-serif`; g.fillText(SUITS[suitOf(p.c)],0,h*.22); g.restore(); };
  if(id==='bounce'){ for(let k=0;k<52;k++){ const c=51-k, s=suitOf(c), o=fpos(s); ps.push({c,x:o.x,y:o.y,vx:(Math.random()<.5?-1:1)*(1.5+Math.random()*3),vy:-(2+Math.random()*4),r:0,vr:(Math.random()-.5)*.08,born:k*55,a:1}); } }
  else if(id==='fountain'){ for(let k=0;k<70;k++) ps.push({c:Math.floor(Math.random()*52),x:W/2,y:H+20,vx:(Math.random()-.5)*7,vy:-(9+Math.random()*7),r:0,vr:(Math.random()-.5)*.2,born:k*30,a:1}); }
  else if(id==='fireworks'){ for(let b=0;b<7;b++){ const cx=W*(.15+Math.random()*.7), cy=H*(.15+Math.random()*.4), col=['#ffd54f','#ff7a7a','#7fd3ff','#b388ff','#7dffb0'][b%5]; for(let k=0;k<46;k++){ const a=k/46*Math.PI*2, v=1.5+Math.random()*3.5; ps.push({dot:1,x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,born:b*320,col,a:1}); } } }
  else if(id==='burst'){ for(let s=0;s<4;s++){ const o=fpos(s); for(let ring=0;ring<3;ring++) for(let k=0;k<14;k++){ const a=k/14*Math.PI*2+ring*.2, v=2.2+ring*1.4; ps.push({sym:SUITS[s],col:sc[s],x:o.x,y:o.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,born:s*180+ring*160,a:1,g:0}); } } }
  const frame=()=>{ const t=performance.now()-t0; g.clearRect(0,0,W,H);
    for(const p of ps){ if(t<p.born) continue;
      if(p.dot){ p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.vx*=.985; p.a-=.012; g.globalAlpha=Math.max(0,p.a); g.fillStyle=p.col; g.beginPath(); g.arc(p.x,p.y,2.2,0,7); g.fill(); g.globalAlpha=1; continue; }
      if(p.sym){ p.x+=p.vx; p.y+=p.vy; p.vx*=.97; p.vy*=.97; p.a-=.011; g.globalAlpha=Math.max(0,p.a); g.fillStyle=p.col; g.font='bold 18px sans-serif'; g.fillText(p.sym,p.x,p.y); g.globalAlpha=1; continue; }
      p.x+=p.vx; p.y+=p.vy; p.vy+=id==='bounce'?.32:.25; p.r+=p.vr;
      if(id==='bounce'&&p.y>H-ch*.4){ p.y=H-ch*.4; p.vy*=-.72; p.vx*=.98; }
      if(id==='bounce'&&t-p.born>1800) p.a-=.03; if(id==='fountain'&&p.vy>0) p.a-=.008;
      drawCard(p); }
    if(t<dur+52*55&&ps.some(p=>(p.a>0)&&p.x>-100&&p.x<W+100)) requestAnimationFrame(frame); else g.clearRect(0,0,W,H); };
  requestAnimationFrame(frame); }

  if(location.hash==='#game-settings'){ openSettings(); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }

if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyLook);
boot();
