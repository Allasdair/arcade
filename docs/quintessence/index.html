  AU.fb=c.createGain(); AU.fb.gain.value=.3; const dl=c.createBiquadFilter(); dl.type='lowpass'; dl.frequency.value=2200;
  AU.dly.connect(dl); dl.connect(AU.fb); AU.fb.connect(AU.dly); dl.connect(AU.mus); dl.connect(AU.sfx);
  AU.send=c.createGain(); AU.send.gain.value=.4; AU.send.connect(AU.dly);
  const len=c.sampleRate*2, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; AU.noise=b; }
function audio(){ if(!AU.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; try{ buildAudio(new C()); }catch(e){ return null; } }
  if(AU.ctx.state==='suspended'&&!document.hidden) AU.ctx.resume().catch(()=>{}); return AU.ctx; }
const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(o){ const c=AU.ctx, t=(o.at!=null?o.at:c.currentTime)+(o.t||0), d=o.d||.12, v=o.v||.2, a=o.a||.005, h=o.hold||0;
  const osc=c.createOscillator(), g=c.createGain(); osc.type=o.type||'sine'; osc.frequency.setValueAtTime(o.f,t);

  n.connect(g); g.connect(o.dest||AU.sfx); if(o.send) g.connect(o.send); osc.start(t); osc.stop(t+a+h+d+.05); }

  const s=c.createBufferSource(); s.buffer=AU.noise; const f=c.createBiquadFilter(); f.type=o.ft||'lowpass';
  f.frequency.setValueAtTime(o.f||1000,t); if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2,t+d); f.Q.value=o.q||.7;

  s.loop=true; s.connect(f); f.connect(g); g.connect(o.dest||AU.sfx); s.start(t,Math.random()*1.5); s.stop(t+d+.05); }
// Sound packs: Soft (default; round sine pops), Crystal (glassy bells), Chiptune (square waves).
// A match chimes on a scale that climbs with each cascade step.
const SCALE=[0,2,4,7,9,12,14,16,19,21,24,26,28,31];
let sfxBudget=0;
function sfx(name,arg,pack){ if(!P.sfx&&!pack) return; const c=audio(); if(!c) return; const pk=pack||look('sound'), chip=pk==='chip', cry=pk==='crystal', sq=chip?'square':'triangle', vv=chip?.38:1;
  const now=c.currentTime; if(name==='match'||name==='hit'){ if(sfxBudget>now+.05) return; sfxBudget=now+.03; }
  switch(name){
  case 'click': tone({f:chip?1760:1500,d:.025,v:.045*vv,type:chip?'square':'sine'}); return;
  case 'select': tone({f:chip?1320:cry?2100:1100,d:.03,v:.04*vv,type:chip?'square':'sine'}); return;
  case 'swap': if(cry){ tone({f:1760,d:.06,v:.03,type:'sine'}); return; } noise({d:.07,v:.05,ft:'bandpass',f:chip?3000:1600,f2:chip?1200:900,q:1.2}); return;

  case 'burst': tone({f:120,f2:40,glide:.25,d:.35,v:.25}); noise({d:.3,v:.16,ft:'lowpass',f:1600,f2:200}); return;

  case 'relic': [67,71,74,79].forEach((m,i)=>tone({f:hz(m),t:i*.06,d:.3,v:.07*vv,type:chip?'square':'sine',send:AU.send})); return;

  case 'lavaspread': noise({d:.4,v:.07,ft:'lowpass',f:500,f2:150}); return;

  case 'win': [72,76,79,84,88,91].forEach((m,i)=>tone({f:hz(m),t:i*.08,d:i===5?.8:.25,v:.09*vv,type:sq,send:AU.send})); tone({f:hz(48),d:.9,v:.15}); return;

// the render loop runs while the game screen is showing

</script>
<script>

// ===================== GAME =====================

//     clock), bonus (Timed: +2 s per big cascade), hintsUsed, carried, zenMs, started, over}
const assisted=()=>!!(G&&(G.hintsUsed>0||G.carried));
const timedLimit=()=>G?(G.setup&&G.setup.mode==='timed'?TIMED_MS:G.lid&&levelById(G.lid).twist==='timed'?levelById(G.lid).time*1000:0):0;
const timeLeft=()=>Math.max(0,timedLimit()+(G.bonus||0)-G.t);
function startGame(run){ G=Object.assign({over:false,t:0,bonus:0,hintsUsed:0,carried:false,zenMs:0,started:false,sel:-1,cursor:-1,pick:-1,kb:false,hint:null,lastIn:now(),stats0:null},run);
  G.stats0=JSON.parse(JSON.stringify(G.st.stats)); G.zen0=G.st.stats.matches.reduce((a,b)=>a+b,0);
  $('#announce').classList.remove('on'); AN.parts=[]; AN.beams=[]; AN.labels=[]; AN.q=[]; AN.cur=null; AN.onDone=null;

  if(G.st.over&&!G.done) setTimeout(endGame,300); }
function resumeRun(run){ if(!run) return; startGame(JSON.parse(JSON.stringify(run))); }
function runOf(){ return {mode:G.mode,setup:G.setup,lid:G.lid,date:G.date,cfg:G.cfg,st:G.st,t:G.t,bonus:G.bonus,hintsUsed:G.hintsUsed,carried:G.carried,zenMs:G.zenMs,started:G.started}; }
function saveGame(){ if(!G||G.done) return; const o=runOf();
  if(G.mode==='daily') dailyFor(S,G.date).run=o; else if(G.mode==='practice') dailyFor(S,G.date).practice=o; else S.run=o; persist(); }
function leaveGame(){ if(G&&!G.done) saveGame(); G=null; goHome(); }
// ---------- the clock: it runs from the first swap, and stops while cascades play, when paused, hidden or on another screen ----------
let lastClock=0, lastTickSec=-1;
const clockRunning=()=>G&&G.started&&!G.over&&!AN.cur&&!AN.q.length&&cur==='game'&&!sheetOn&&!coverOn()&&!document.hidden;
function clockTick(t){ const dt=Math.min(200,t-(lastClock||t)); lastClock=t; if(!clockRunning()) return; G.t+=dt; if(G.setup&&G.setup.mode==='zen') G.zenMs+=dt;
  const lim=timedLimit(); if(lim){ const left=timeLeft(), sec=Math.ceil(left/1000); if(sec!==lastTickSec){ lastTickSec=sec; updateHud(); if(sec<=10&&sec>0) sfx('tick'); }
    if(left<=0){ G.st.over=true; G.st.ended='time'; G.st.won=!G.st.goals.length; endGame(); return; } }
  else if(Math.floor(G.t/1000)!==Math.floor((G.t-dt)/1000)) updateHud(true);
  if(S.prefs.idle&&!G.hint&&t-G.lastIn>8000&&canInput()) idleHint(); }
// ---------- the HUD ----------
function buildHud(){ const st=G.st, gl=$('#gGoals'); gl.innerHTML=''; const goals=G.mode==='classic'&&G.setup.mode!=='zen'?classicThresholds(G.setup).map((n,i)=>({t:'tier',n,i})):st.goals;
  if(G.mode==='classic'&&G.setup.mode==='zen'){ gl.innerHTML=`<div class="gl"><div class="sc"><b id="zenM">0</b><span>Matches</span></div></div><div class="gl"><div class="sc"><b id="zenC">0</b><span>Best cascade</span></div></div>`; }
  else for(const [k,g] of goals.entries()){ const d=document.createElement('div'); d.className='gl'; d.dataset.k=k;
    if(g.t==='tier'){ d.innerHTML=`<div class="sc"><b data-raw>${'★'.repeat(g.i+1)}</b><span data-raw>${fmtNum(g.n)}</span></div>`; }
    else { d.appendChild(elemCanvas(goalIcon(g),26)); const b=document.createElement('b'); d.appendChild(b); }
    gl.appendChild(d); }
  const L=G.lid?levelById(G.lid):null;
  $('#gtag').innerHTML=G.mode==='campaign'?`<span data-raw>${esc(T(CAMPS[L.camp].name)+' '+L.n+' · '+L.name)}</span>`:esc(G.mode==='daily'?TF('Daily · {0}',T(DAILY_RECIPES[weekdayOf(G.date)].label)):G.mode==='practice'?TF('Daily practice · {0}',T(DAILY_RECIPES[weekdayOf(G.date)].label)):`${T(MODES[G.setup.mode])} · ${T(boardName(G.setup.board))} · ${T(NE_NAMES[G.setup.ne])}`); }
const short=n=>n>=100000?Math.round(n/1000)+'k':n>=10000?(n/1000).toFixed(1).replace(/\.0$/,'')+'k':fmtNum(n);
function updateHud(){ if(!G) return; const st=G.st, mv=$('#gMoves'), lim=timedLimit();
  if(lim){ const l=timeLeft(); mv.innerHTML=`<b>${fmtTime(l)}</b><span>${esc(T('Time'))}</span>`; mv.classList.toggle('warn',l<10500&&G.started); }
  else if(st.limit){ const l=movesLeft(st); mv.innerHTML=`<b>${l}</b><span>${esc(T('Moves'))}</span>`; mv.classList.toggle('warn',l<=3); }
  else { mv.innerHTML=`<b>${st.moves}</b><span>${esc(T('Moves'))}</span>`; mv.classList.remove('warn'); }
  $('#gScore').innerHTML=`<b>${short(st.score)}</b><span>${esc(T('Score'))}</span>`;
  if(G.mode==='classic'&&G.setup.mode==='zen'){ const m=st.stats.matches.reduce((a,b)=>a+b,0); if($('#zenM')) $('#zenM').textContent=fmtNum(m); if($('#zenC')) $('#zenC').textContent=st.stats.best; }
  else if(G.mode==='classic'){ const th=classicThresholds(G.setup); $$('#gGoals .gl').forEach((d,i)=>d.classList.toggle('done',st.score>=th[i])); }
  else $$('#gGoals .gl').forEach((d,i)=>{ const g=st.goals[i]; if(!g) return; const [a,b]=goalProgress(st,g), done=a>=b; d.classList.toggle('done',done);
    const el=d.querySelector('b'); if(el) el.textContent=g.t==='score'?`${short(Math.min(a,b))}/${short(b)}`:done?'✓':`${b-a}`; });
  $('#hintCnt').textContent=`${S.hints}/${HINT_CAP}`; }
// ---------- input: swipe a piece toward a neighbour, or tap one then the other ----------
const canInput=()=>G&&!G.over&&!AN.cur&&!AN.q.length&&cur==='game'&&!sheetOn&&!coverOn();
function cellAt(ev){ const r=BC.getBoundingClientRect(), x=Math.floor((ev.clientX-r.left-LY.pad)/LY.ts), y=Math.floor((ev.clientY-r.top-LY.pad)/LY.ts); if(x<0||y<0||x>=LY.W||y>=LY.H) return -1; const i=y*LY.W+x; return G.st.mask[i]?i:-1; }
let drag=null;
BC.addEventListener('pointerdown',e=>{ if(!G) return; if(AN.cur||AN.q.length){ if(G.overflowing) skipAnim(); return; } if(!canInput()) return; G.lastIn=now(); G.kb=false; const c=cellAt(e); if(c<0) return;
  drag={id:e.pointerId,c,x:e.clientX,y:e.clientY,done:false}; try{ BC.setPointerCapture(e.pointerId); }catch(er){} });
BC.addEventListener('pointermove',e=>{ if(!drag||drag.id!==e.pointerId||drag.done||S.prefs.input==='tap') return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y, thr=LY.ts*({low:.5,normal:.32,high:.2}[S.prefs.sens]||.32);
  if(Math.abs(dx)<thr&&Math.abs(dy)<thr) return; drag.done=true; const W=G.st.W, x=drag.c%W; let nb;
  if(Math.abs(dx)>Math.abs(dy)) nb=dx>0?(x<W-1?drag.c+1:-1):(x>0?drag.c-1:-1); else nb=dy>0?drag.c+W:drag.c-W;
  if(nb<0||nb>=G.st.N||!G.st.mask[nb]) return; G.sel=-1; trySwap(drag.c,nb); });
BC.addEventListener('pointerup',e=>{ if(!drag||drag.id!==e.pointerId) return; const d=drag; drag=null; if(d.done||S.prefs.input==='swipe'||!canInput()) return; tapCell(d.c); });
BC.addEventListener('pointercancel',()=>{ drag=null; });
function tapCell(c){ const st=G.st; if(G.sel<0){ if(movable(st,c)){ G.sel=c; sfx('select'); } else lockedFeedback(c); return; }
  if(c===G.sel){ G.sel=-1; return; } if(adjacent(st,G.sel,c)){ const a=G.sel; G.sel=-1; trySwap(a,c); return; } if(movable(st,c)){ G.sel=c; sfx('select'); } else lockedFeedback(c); }
function lockedFeedback(c){ const st=G.st; sfx('bad'); buzz(15); if(st.fr[c]) toast('Frozen: match next to it, or a Fire match, to free it'); else if(st.ch[c]) toast('Chained: match this piece, or a Lightning match in its row or column'); else if(st.fg[c]) toast('Fog hides this piece: match next to it, or an Earth match nearby');
  else if(st.stn[c]) toast('Stone: match next to it to break it (Air breaks two layers)'); else if(st.lv[c]) toast('Lava: match next to it (Water quenches, Ice freezes it)'); }
function trySwap(a,b){ const st=G.st; if(!canInput()) return;
  if(!movable(st,a)){ lockedFeedback(a); return; } if(!movable(st,b)){ lockedFeedback(b); return; }
  if(!validSwap(st,a,b)){ // slides back; no move is used
    sfx('swap'); setTimeout(()=>sfx('bad'),110); const c=cloneSt(st); swapCells(c,a,b); play([{kind:'swapped',b:snap(c)},{kind:'back',b:snap(st)}],()=>{}); return; }
  clearHint(); G.started=true; const before=JSON.parse(JSON.stringify(st.stats)); sfx('swap');
  const r=doSwap(st,a,b,true); play(r.frames,()=>afterMoveUI(r,before)); }
function afterMoveUI(r,before){ const st=G.st; addStats(S,before,st.stats); S.rec.best=Math.max(S.rec.best||0,r.cascade); S.rec.mostSp=Math.max(S.rec.mostSp||0,r.specials);
  if(timedLimit()&&r.cascade>=5){ G.bonus+=2000; toast(T('+2 seconds')); }
  if(G.setup&&G.setup.mode==='zen'){ const z=S.rec.zen, m=st.stats.matches.reduce((a,b)=>a+b,0), dm=m-(before.matches.reduce((a,b)=>a+b,0)); z.matches+=dm; z.best=Math.max(z.best,r.cascade); z.mostSp=Math.max(z.mostSp,r.specials); z.longest=Math.max(z.longest,G.zenMs);
    const xp=zenXP(S,todayStr(),dm); if(xp){ const x=addXP(S,xp); if(x.after>x.before){ sfx('level'); toast(TF('Level {0}!',x.after)); } } }
  const big=r.cascade>=5||r.combo||r.specials>=3; if(big){ shake(r.combo==='prism+prism'?9:r.cascade>=9?7:4); buzz(big?[10,30,10]:12); }
  if(r.label&&S.prefs.announcer) announce(r.label);
  const got=checkAch(S,{mode:G.mode}); for(const id of got){ const a=ACH.find(x=>x.id===id); toast(TF('Achievement: {0}',a.name)); }
  saveGame(); updateHud(); G.lastIn=now();
  if(st.over) endGame(); }
const ANN_COL={'Flow!':'#7fb6ff','Surge!':'#ffd23a','Storm!':'#c9b8ff','Elemental!':'#ff8a3a','Quintessence!':'#ff5af0'};
function announce(w){ const el=$('#announce'); el.textContent=T(w); el.style.setProperty('--annc',ANN_COL[w]||'#fff'); el.classList.remove('on'); void el.offsetWidth; if(fxOn()) el.classList.add('on'); else { el.style.opacity=1; setTimeout(()=>el.style.opacity='',700); }
  sfx('announce',{'Flow!':60,'Surge!':64,'Storm!':67,'Elemental!':70,'Quintessence!':74}[w]); }
// ---------- hints: the strong bot's best swap, glowing ----------
$('#bHint').onclick=()=>doHint();
function doHint(){ if(!canInput()) return; if(G.hint){ return; } if(S.hints<=0){ toast(T('No hints left today. You get +1 for every level-up.')); return; }
  const m=hintMove(G.st); if(!m){ toast('No swap found'); return; } useHint(S); G.hintsUsed++; G.hint={a:m[0],b:m[1]}; sfx('hint'); saveGame(); updateHud(); buildTag(); }
function idleHint(){ const m=hintMove(G.st); if(!m) return; G.hint={a:m[0],b:m[1],idle:true}; if(G.mode==='campaign'||G.mode==='daily'){ G.hintsUsed++; buildTag(); } }
function clearHint(){ if(G) G.hint=null; }
function buildTag(){ if(!G) return; const tg=$('#gtag'); if(assisted()&&!tg.dataset.as){ tg.dataset.as=1; tg.insertAdjacentHTML('beforeend',' · '+esc(T('assisted'))); } }
// ---------- keyboard: arrows move a cursor; Space picks a piece, then an arrow swaps; H hints; P or Esc pauses ----------
document.addEventListener('keydown',e=>{ if(cur!=='game'||!G||sheetOn) return; if(coverOn()){ if(e.key==='Escape'||e.key==='p'||e.key==='P') resume(); return; }
  const k=e.key.toLowerCase(), st=G.st, W=st.W, H=st.H;
  if(k==='escape'||k==='p'){ openPause(); e.preventDefault(); return; }
  if(AN.cur&&G.overflowing&&(k===' '||k==='enter')){ skipAnim(); return; }
  if(G.over) return; if(k==='h'){ doHint(); return; }
  const dirs={arrowleft:[-1,0],arrowright:[1,0],arrowup:[0,-1],arrowdown:[0,1]};
  if(dirs[k]){ e.preventDefault(); G.kb=true; G.lastIn=now(); if(G.cursor<0){ G.cursor=st.N>>1; return; } const [dx,dy]=dirs[k], x=G.cursor%W, y=(G.cursor/W)|0, nx=x+dx, ny=y+dy;
    if(nx<0||ny<0||nx>=W||ny>=H) return; const nb=ny*W+nx;
    if(G.pick>=0){ const a=G.pick; G.pick=-1; if(st.mask[nb]) trySwap(a,nb); return; } G.cursor=nb; return; }
  if(k===' '||k==='enter'){ e.preventDefault(); G.kb=true; if(G.cursor<0){ G.cursor=st.N>>1; return; } if(G.pick>=0) G.pick=-1; else if(movable(st,G.cursor)){ G.pick=G.cursor; sfx('select'); } else lockedFeedback(G.cursor); } });

// ---------- pause (the game menu) ----------
$('#bPause').onclick=()=>openPause(); $('#bHow').onclick=()=>openHowto();
function openPause(){ if(!G||G.over) return; saveGame(); const m=G.mode, zen=G.setup&&G.setup.mode==='zen';
  const cv=$('#cover'); cv.innerHTML=`<h2>Paused</h2>${G.st.goals.length?`<div class="sub">${esc(G.st.goals.map(goalText).join(' · '))}</div>`:''}<button id="pRes">Resume</button>${m!=='daily'&&!zen?'<button id="pRestart">Restart</button>':''}${m==='classic'?`<button id="pNew">${zen?'End run':'New game'}</button>`:''}
   <button id="pSet">Settings</button><button id="pHow">How to play</button>${m==='daily'?'<button id="pGive">End attempt</button>':''}<button id="pQuit">Save and quit</button>`;
  cv.classList.add('on'); guard();
  $('#pRes').onclick=resume; if($('#pRestart')) $('#pRestart').onclick=()=>{ cv.classList.remove('on'); restartGame(); };
  if($('#pNew')) $('#pNew').onclick=()=>{ cv.classList.remove('on'); if(zen){ G.st.over=true; G.st.ended='zen'; endGame(); } else newClassic(); };
  $('#pSet').onclick=()=>{ cv.classList.remove('on'); openSettingsFromGame(); }; $('#pHow').onclick=openHowto;
  if($('#pGive')) $('#pGive').onclick=()=>{ if(!G.giveArm){ G.giveArm=true; $('#pGive').textContent=T('Tap again to end'); return; } cv.classList.remove('on'); G.st.over=true; G.st.won=false; G.st.ended='gave'; endGame(); };
  $('#pQuit').onclick=()=>{ cv.classList.remove('on'); leaveGame(); }; }
function resume(){ $('#cover').classList.remove('on'); if(G) G.giveArm=false; }
// Restart replays the same board with the clock at 0; assists already used keep it assisted.
function restartGame(){ if(!G) return; const run={mode:G.mode,setup:G.setup,lid:G.lid,date:G.date,cfg:G.cfg,st:newGame(G.cfg),carried:assisted()}; startGame(run); }
function newClassic(){ if(G&&G.mode==='classic'&&G.started&&!G.st.over&&G.setup.mode!=='zen'){ S.rec.cur=0; } G=null; S.run=null; startClassic(); }

// ---------- the end of a game ----------
function endGame(){ if(!G||G.done||G.ending) return; G.ending=true; G.over=true; const st=G.st;
  const go=()=>{ G.overflowing=false; $('#skipTip')&&$('#skipTip').remove(); finish(); };
  if(st.won&&st.goals.length&&(G.mode==='campaign'||G.mode==='daily'||G.mode==='practice')){ const left=movesLeft(st); const of=overflow(st,true);
    if(!of.frames.length){ go(); return; }
    if(left) toast(TF('Overflow! {0} moves left become Surges',left)); else toast(T('Overflow!'));
    if(S.prefs.autoSkip||!P.motion){ syncSprites(snap(st)); updateHud(); setTimeout(go,300); return; }
    G.overflowing=true; $('#boardWrap').insertAdjacentHTML('beforeend',`<div id="skipTip">${esc(T('Tap to skip'))}</div>`);
    play(of.frames,()=>{ updateHud(); setTimeout(go,350); }); const iv=setInterval(()=>{ if(!G||!G.overflowing){ clearInterval(iv); return; } updateHud(); },200); return; }
  setTimeout(finish,st.won?250:450); }
function finish(){ if(!G||G.done) return; const st=G.st, today=todayStr(), as=assisted(), m=G.mode, won=st.won&&st.ended!=='gave';
  const res={won,xp:null,stars:null,fresh:[],ach:[],rec:false};
  if(m==='classic'){ if(G.setup.mode==='zen'){ res.zen=true; }
    else { const cr=classicResult(S,G.setup,st.score,as,st.stats); res.stars=cr.stars; res.fresh=cr.fresh; res.rec=cr.record; res.won=cr.won; if(cr.xp) res.xp=addXP(S,cr.xp); } S.run=null; }
  else if(m==='campaign'){ const L=levelById(G.lid), spare=L.twist==='timed'?Math.floor(timeLeft()/1000):movesLeft(st); const cr=campaignResult(S,L,won,spare,as,st.score);
    res.stars=cr.earned; res.fresh=cr.fresh; res.camp=cr; if(cr.xp) res.xp=addXP(S,cr.xp); S.run=null; }
  else if(m==='daily'){ const left=movesLeft(st); const dr=dailyResult(S,G.date,won,left,st.score,as,today); if(dr){ res.stars=dr.stars; if(dr.xp) res.xp=addXP(S,dr.xp); } }
  else { const cfg=dailyCfg(G.date); res.stars=dailyStars(won,movesLeft(st),cfg.par,as); dailyFor(S,G.date).practice=null; }
  res.ach=checkAch(S,{mode:m,setup:G.setup,score:st.score,zenMs:G.zenMs});
  G.done=true; persist(); writeSummary(); updateHud();
  if(res.won||res.zen){ sfx('win'); buzz([20,40,20]); const fx=P.motion&&look('win')!=='none'&&res.won; if(fx) playWin(look('win')); setTimeout(()=>showResults(res),fx?2000:600); }
  else { sfx('lose'); showResults(res); } }
function showResults(res){ if(!G) return; const st=G.st, m=G.mode, L=G.lid?levelById(G.lid):null, won=res.won, zen=res.zen;
  let labels; if(m==='classic'&&!zen){ const th=classicThresholds(G.setup); labels=[TF('Bronze: {0}',fmtNum(th[0])),TF('Silver: {0}',fmtNum(th[1])),T('Bronze with no assists')]; }
  else if(m!=='classic'){ const par=L?L.par:dailyCfg(G.date).par, timed=L&&L.twist==='timed'; labels=[T('Goal met'),timed?TF('{0} seconds to spare',par):TF('{0} moves to spare',par),T('No assists (no hints)')]; }
  const title=zen?'Zen run ended':m==='classic'?(won?'Well played!':'Game over'):won?(m==='practice'?'Practice cleared':'Level complete!'):st.ended==='stuck'?'No moves left':st.ended==='time'?'Out of time':st.ended==='gave'?'Attempt ended':'Out of moves';
  const sub=m==='campaign'?`<span data-raw>${esc(T(CAMPS[L.camp].name)+' '+L.n+' · '+L.name)}</span>`:esc(m==='classic'?`${T(MODES[G.setup.mode])} · ${T(boardName(G.setup.board))} · ${T(NE_NAMES[G.setup.ne])}`:m==='daily'?TF('Daily · {0}',G.date):TF('Daily practice · {0}',G.date));
  const kv2=zen?[[fmtNum(st.stats.matches.reduce((a,b)=>a+b,0)),'Matches'],[st.stats.best,'Best cascade'],[fmtTime(G.zenMs),'Time']]:[[fmtNum(st.score),'Score'],[m==='classic'?(G.setup.mode==='timed'?fmtTime(timeLeft()):st.moves):timedLimit()?fmtTime(timeLeft()):movesLeft(st),m==='classic'?(G.setup.mode==='timed'?'Time left':'Moves'):timedLimit()?'Time left':'Moves left'],[st.stats.best,'Best cascade']];
  let h=`<h2>${esc(T(title))}</h2><div class="sub">${sub}${assisted()?' · '+esc(T('assisted')):''}</div><div class="kv">${kv2.map(([v,k])=>`<div><b>${esc(String(v))}</b><span>${esc(T(k))}</span></div>`).join('')}</div>`;
  if(res.stars) h+=labels.map((lb,i)=>`<div class="goal${res.stars[i]?' got':''}${res.fresh.includes(i)?' new':''}"><span class="st">★</span><span>${esc(lb)}</span>${res.fresh.includes(i)?'<b style="margin-left:6px;color:var(--gold)">'+esc(T('New!'))+'</b>':''}</div>`).join('');
  if(m!=='classic'&&!won) h+=`<div class="sub" style="margin-top:6px">${esc(st.goals.map(g=>{ const [a,b]=goalProgress(st,g); return TF('{0}: {1}',goalText(g),(g.t==='score'?fmtNum(a):a)+'/'+(g.t==='score'?fmtNum(b):b)); }).join(' · '))}</div>`;
  if(res.rec) h+=`<div class="sub"><b>${esc(T('New best score!'))}</b></div>`;
  if(m==='practice') h+=`<div class="sub" style="margin-top:6px">Practice doesn't score.</div>`;
  if(res.xp) h+=`<div class="sub" style="margin-top:10px"><b>+${res.xp.xp} XP</b>${res.xp.after>res.xp.before?` · <span>${esc(TF('Level {0}!',res.xp.after))}</span> · <span>${esc(TF('+{0} hint',res.xp.hints))}</span>`:''}</div>${res.xp.rewards.length?`<div class="sub">${esc(TF('Unlocked: {0}',res.xp.rewards.join(' · ')))}</div>`:''}`;
  if(res.camp&&res.camp.finished) h+=`<div class="sub"><b>${esc(TF('{0} complete!',T(CAMPS[L.camp].name)))}</b></div>`;
  if(res.ach.length) h+=`<div class="label">Achievements</div><div class="box">${res.ach.map(id=>{ const a=ACH.find(x=>x.id===id); return `<div class="ach done"><div class="m">★</div><div><div class="n" data-raw>${esc(a.name)}</div><div class="d">${esc(a.desc)}${a.reward?' · '+esc(TF('Unlocks {0}',T(a.reward))):''}</div></div></div>`; }).join('')}</div>`;
  const next=m==='campaign'?LEVELS[LEVELS.indexOf(L)+1]:null;
  h+=`<div class="btns"><button class="ghost" id="rHome">Home</button>${m==='classic'?`<button class="primary" id="rNew">${zen?'New run':'Play again'}</button>`:''}
   ${m==='campaign'?`<button class="ghost" id="rRetry">${won?'Retry for stars':'Retry'}</button>${won&&next&&unlocked(S,next)?'<button class="primary" id="rNext">Next level</button>':'<button class="primary" id="rMap">Campaign</button>'}`:''}
   ${m==='daily'?'<button class="ghost" id="rShare">Share</button><button class="primary" id="rPrac">Practise</button>':''}${m==='practice'?'<button class="primary" id="rPrac">Practise again</button>':''}</div>`;
  if(res.xp&&res.xp.after>res.xp.before) sfx('level');
  res.stars&&res.stars.forEach((s,i)=>{ if(s) setTimeout(()=>sfx('star',i),300+i*220); });
  openSheet(h,()=>{});
  const end=()=>{ const g=G; G=null; return g; };
  $('#rHome').onclick=()=>{ end(); goHome(); };
  if($('#rNew')) $('#rNew').onclick=()=>{ closeSheet(); end(); startClassic(); };
  if($('#rRetry')) $('#rRetry').onclick=()=>{ closeSheet(); end(); startLevel(L); };
  if($('#rNext')) $('#rNext').onclick=()=>{ closeSheet(); end(); openCamp(next.camp); openLevel(next); };
  if($('#rMap')) $('#rMap').onclick=()=>{ closeSheet(); end(); openCamp(L.camp); };
  if($('#rShare')) $('#rShare').onclick=()=>{ const dd=S.daily; share(shareLine(dd.date,dd.stars,dd.left,dd.score,dd.cleared,dd.assisted)); };
  if($('#rPrac')) $('#rPrac').onclick=()=>{ closeSheet(); const g=end(); startPractice(g.date); }; }
// win effects on the overlay canvas: Overflow Fireworks, Aurora, Elemental Storm
function playWin(id,preview){ const cv=$('#fxc'), dpr=Math.min(2,devicePixelRatio||1); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const W=innerWidth, H=innerHeight, t0=now(), dur=1900, parts=[], R=Math.random;
  if(id==='fireworks') for(let k=0;k<6;k++){ const cx=W*(.2+R()*.6), cy=H*(.18+R()*.35), col=EC[k%6].c, dl=k*180; for(let j=0;j<26;j++){ const a=j/26*Math.PI*2, v=1.6+R()*1.6; parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,col,dl}); } }
  if(id==='storm') for(let k=0;k<70;k++) parts.push({a:R()*Math.PI*2,r:Math.max(W,H)*(.25+R()*.5),e:k%6,sp:.002+R()*.002,dl:0});
  const tick=()=>{ const t=now()-t0; g.clearRect(0,0,W,H); if(t>dur){ g.clearRect(0,0,W,H); return; } const a=t<1500?1:1-(t-1500)/400;
    if(id==='aurora'){ for(let k=0;k<4;k++){ const lg=g.createLinearGradient(0,0,W,0); lg.addColorStop(0,'rgba(0,0,0,0)'); lg.addColorStop(.5,`hsla(${(140+k*40+t/12)%360},90%,60%,${.28*a})`); lg.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=lg;
        g.beginPath(); g.moveTo(0,H*.1+k*40); for(let x=0;x<=W;x+=20) g.lineTo(x,H*(.12+.05*k)+Math.sin(x/90+t/400+k)*30); g.lineTo(W,0); g.lineTo(0,0); g.closePath(); g.fill(); } }
    else if(id==='storm'){ for(const p of parts){ p.a+=p.sp*16; p.r*=.992; const x=W/2+Math.cos(p.a)*p.r, y=H/2+Math.sin(p.a)*p.r*.7; g.globalAlpha=a; g.drawImage(sprite(p.e,22,look('skin'),false),x-11,y-11,22,22); } g.globalAlpha=1; }
    else for(const p of parts){ if(t<p.dl) continue; const tt=(t-p.dl)/16; g.globalAlpha=Math.max(0,a*(1-tt/80)); g.fillStyle=p.col; g.beginPath(); g.arc(p.x+p.vx*tt,p.y+p.vy*tt+.02*tt*tt,2.6,0,7); g.fill(); }
    g.globalAlpha=1; requestAnimationFrame(tick); };
  requestAnimationFrame(tick); }
</script>
<script>
// ===================== HOME =====================
const ICONS={classic:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="2"/><circle cx="15.5" cy="8.5" r="2"/><circle cx="8.5" cy="15.5" r="2"/><circle cx="15.5" cy="15.5" r="2"/></svg>',
 camp:'<svg class="i" viewBox="0 0 24 24"><path d="M4 21V4l8 3 8-3v17l-8 3z"/><path d="M12 7v17"/></svg>',
 daily:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 prog:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/></svg>',

 play:'<svg class="i" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>'};
const setupLabel=c=>`${T(MODES[c.mode])} · ${T(boardName(c.board))} · ${T(NE_NAMES[c.ne])}`;
function nextLevel(){ for(const L of LEVELS) if(unlocked(S,L)&&!campCleared(S,L.id)) return L; return null; }
const lvName=L=>`${T(CAMPS[L.camp].name)} ${L.n} · ${L.name}`;
const WDN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function renderHome(){ const today=todayStr(); refreshHints(S,today); streakNow(S,today); const l=levelOf(S.xp), nx=xpNext(S), base=LVXP[l-1], pct=nx?Math.round((S.xp-base)/(nx-base)*100):100;
  const dd=dailyFor(S,today), nl=nextLevel(), run=S.run, dr=DAILY_RECIPES[weekdayOf(today)];
  let h=`<button class="card lvl" id="hLevel"><div class="badge">${l}</div><div class="grow"><div class="t">Level ${l}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="s">${nx?`${S.xp} / ${nx} XP`:`${S.xp} XP · max level`}</div></div><div class="r"><b>${S.hints}/${HINT_CAP}</b><span>Hints</span></div></button>`;
  if(run&&run.st&&!run.st.over){ const L=run.mode==='campaign'?levelById(run.lid):null;
    h+=`<button class="card" id="hCont"><div class="ico">${ICONS.play}</div><div class="grow"><div class="t">Continue</div><div class="s">${L?`<span data-raw>${esc(lvName(L))}</span>`:esc(setupLabel(run.setup))}</div></div><div class="r"><b>${short(run.st.score)}</b><span>${run.st.limit?esc(TF('{0} moves left',movesLeft(run.st))):esc(T('Score'))}</span></div></button>`; }
  h+=`<div class="label">Play</div>
   <button class="card" id="hClassic"><div class="ico">${ICONS.classic}</div><div class="grow"><div class="t">Classic</div><div class="s">${esc(setupLabel(S.setup))}</div></div><div class="r"><b>${S.rec.clears}</b><span>Cleared</span></div></button>
   <button class="card" id="hCamp"><div class="ico">${ICONS.camp}</div><div class="grow"><div class="t">Campaign</div><div class="s">${nl?`<span data-raw>${esc(TF('Next: {0}',lvName(nl)))}</span>`:'Every level cleared'}</div></div><div class="r"><b>${totalStars(S)}/${LEVELS.length*3}</b><span>Stars</span></div></button>
   <button class="card" id="hDaily"><div class="ico">${ICONS.daily}</div><div class="grow"><div class="t">Daily</div><div class="s">${esc(T(WDN[weekdayOf(today)]))} · ${esc(T(dr.label))}</div></div><div class="r">${dd.scored?`<b>${dd.cleared?short(dd.score):'—'}</b>${starsHtml(dd.stars)}`:dd.run?`<b>Resume</b><span>${esc(TF('{0} moves left',movesLeft(dd.run.st)))}</span>`:`<b>Play</b><span>Today</span>`}</div></button>
   <div class="row2"><button class="card" id="hProg"><div class="ico">${ICONS.prog}</div><div class="grow"><div class="t">Progress</div><div class="s">${Object.keys(S.ach).length}/${ACH.length} achievements</div></div></button>
   <button class="card" id="hHelp"><div class="ico">${ICONS.help}</div><div class="grow"><div class="t">How to play</div></div></button></div>`;
  $('#homeBody').innerHTML=h; $('#arcadeBtn').hidden=!ARCADE;
  $('#hLevel').onclick=()=>openProgress('levels'); $('#hClassic').onclick=openSetup; $('#hCamp').onclick=()=>openCamp(); $('#hDaily').onclick=openDaily;
  $('#hProg').onclick=()=>openProgress('levels'); $('#hHelp').onclick=openHowto;
  if($('#hCont')) $('#hCont').onclick=()=>resumeRun(S.run); }
$('#arcadeBtn').onclick=()=>leaveTo(ARCADE_HOME);
$('#styleBtn').onclick=()=>openStyle(); $('#settingsBtn').onclick=openSettings;

// ===================== CLASSIC SETUP =====================
const MDESC={moves:'Best score in 30 moves.',timed:'Best score in 2:00. The clock stops while cascades play out; a cascade of 5 or more adds 2 seconds.',zen:'Endless and relaxed: no moves, no clock, no stars. Your run saves and resumes.'};
function openSetup(){ const c=Object.assign({},S.setup);
  const draw=()=>{ const th=c.mode!=='zen'?classicThresholds(c):null, r=S.rec.cl[clKey(c)];
    openSheet(`<h2>Classic</h2><div class="sub">Your choices are remembered.</div>
     <div class="opt"><div class="h">Mode</div>${segHtml('mode',[['moves','Moves'],['timed','Timed'],['zen','Zen']],c.mode)}</div>
     <div class="sub" style="font-size:12.5px;margin:-4px 2px 4px">${esc(T(MDESC[c.mode]))}</div>
     <div class="opt"><div class="h">Board</div>${segHtml('board',BOARDS.slice(0,3),c.board)}<div style="height:4px"></div>${segHtml('board',BOARDS.slice(3),c.board)}</div>
     <div class="opt"><div class="h">Elements</div>${segHtml('ne',[[4,'4 · Easy'],[5,'5 · Normal'],[6,'6 · Hard']],c.ne)}</div>
     <div class="opt"><div class="h">Obstacles</div>${segHtml('obst',[['off','Off'],['light',`<span data-raw>${esc(LANG==='en'?'Light':T('Light (obstacles)'))}</span>`]],c.obst)}</div>
     ${th?`<div class="kv"><div><b>${fmtNum(th[0])}</b><span>★ Bronze</span></div><div><b>${fmtNum(th[1])}</b><span>★★ Silver</span></div><div><b>${r?fmtNum(r.best):'—'}</b><span>Best</span></div></div>`:''}
     <div class="btns"><button class="ghost" data-close>Close</button><button class="primary" id="goPlay">Play</button></div>`);
    $$('#sheet [data-seg]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const k=g.dataset.seg; c[k]=k==='ne'?+b.dataset.v:b.dataset.v; draw(); }));
    $('#goPlay').onclick=()=>{ S.setup=c; persist(); closeSheet(); startClassic(); }; };
  draw(); }
function startClassic(){ if(S.run&&S.run.mode==='classic'&&S.run.started&&!S.run.st.over&&S.run.setup.mode!=='zen') S.rec.cur=0; // an abandoned Classic game counts as a loss for the streak
  const setup=Object.assign({},S.setup), seed=Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36), cfg=classicCfg(setup,seed);
  startGame({mode:'classic',setup,cfg,st:newGame(cfg)}); }

// ===================== CAMPAIGN =====================
function openCamp(tab){ if(tab!=null) S.campTab=tab; else { const nl=nextLevel(); if(nl) S.campTab=nl.camp; } renderCamp(); show('camp'); }
const TWISTS={timed:'Against the clock',tight:'Tight moves',lava:'Lava every move',combos:'Combos only'};
function levelTag(L){ const x=[T(NE_NAMES[L.ne])]; if(L.shape) x.push(T(SHAPE_NAMES[L.shape])); if(L.type==='puzzle') x.push(T('Puzzle')); if(L.twist) x.push(T(TWISTS[L.twist])); if(L.n===15) x.push(T('Finale')); return x.join(' · '); }
function renderCamp(){ const t=S.campTab, open=campOpen(S,t), ts=totalStars(S);
  let h=`<div class="top">${backBtn}<h2>Campaign</h2><span class="stars" style="font-weight:700">★ ${ts}/${LEVELS.length*3}</span></div>
   <div class="tabs">${CAMPS.map((c,i)=>`<button data-ct="${i}" class="${i===t?'on':''}" data-raw>${esc(T(c.name))}</button>`).join('')}</div>
   <div class="sub" style="color:var(--sub);font-size:12.5px;margin:0 4px 10px">${esc(TF('{0} elements',CAMPS[t].ne))}</div>
   <div class="chips" style="margin-bottom:12px">${starUnlocks().map(u=>`<div class="chip${ts>=u.stars?' on':''}">★ ${u.stars} · ${esc(u.text)}</div>`).join('')}</div>`;
  if(!open) h+=`<div class="box" style="padding:14px"><div class="srow"><div>Locked<div class="d" data-raw>${esc(TF('Clear level 15 of {0} to open this campaign.',T(CAMPS[t-1].name)))}</div></div></div></div>`;
  h+='<div class="lvpath">';
  for(const L of LEVELS.filter(L=>L.camp===t)){ const u=unlocked(S,L), c=campOf(S,L.id);
    h+=`<button class="card lvcard${c.c?' fin':''}${u?'':' dim'}" data-lv="${L.id}"><div class="num">${L.n}</div><div class="grow"><div class="t" data-raw>${esc(L.name)}</div><div class="s">${esc(levelTag(L))}</div></div><div class="r">${starsHtml(campStars(S,L.id))}</div></button>`; }
  h+='</div>'; $('#campBody').innerHTML=h;
  $$('#campBody [data-ct]').forEach(b=>b.onclick=()=>{ S.campTab=+b.dataset.ct; persist(); renderCamp(); });
  $$('#campBody [data-lv]').forEach(b=>b.onclick=()=>{ const L=levelById(b.dataset.lv); if(!unlocked(S,L)){ toast('Clear the level before to unlock this one'); return; } openLevel(L); }); }
function goalRows(goals){ return goals.map(g=>`<div class="goalrow" data-g="${esc(String(goalIcon(g)))}"><span class="gi"></span><span>${esc(goalText(g))}</span></div>`).join(''); }
function fillGoalIcons(root){ $$(root+' .goalrow').forEach(r=>{ const k=r.dataset.g, e=/^\d$/.test(k)?+k:k; r.querySelector('.gi').replaceWith(elemCanvas(e,28)); }); }
function openLevel(L){ const c=campOf(S,L.id), timed=L.twist==='timed', inRun=S.run&&S.run.lid===L.id&&!S.run.st.over;
  openSheet(`<h2 data-raw>${esc(L.name)}</h2><div class="sub"><span data-raw>${esc(T(CAMPS[L.camp].name)+' · '+TF('Level {0}',L.n))}</span> · ${esc(levelTag(L))}</div>
   ${goalRows(L.goals)}<div class="sub" style="margin-top:6px">${esc(timed?TF('Time: {0}',fmtTime(L.time*1000)):TF('{0} moves',L.limit))}</div>
   <div class="sub">${esc(L.tip)}</div>
   <div class="goal${c.s[0]?' got':''}"><span class="st">★</span><span>${esc(T('Meet the goal'))}</span></div>
   <div class="goal${c.s[1]?' got':''}"><span class="st">★</span><span>${esc(timed?TF('Finish with {0} seconds to spare',L.par):TF('Finish with {0} moves to spare',L.par))}</span></div>
   <div class="goal${c.s[2]?' got':''}"><span class="st">★</span><span>${esc(T('No assists (no hints)'))}</span></div>
   ${c.c?`<div class="sub" style="margin-top:8px">${esc(TF('Best score: {0}',fmtNum(c.best||0)))}</div>`:''}
   <div class="btns"><button class="ghost" data-close>Close</button><button class="primary" id="lvGo">${inRun?'Continue':'Play'}</button></div>`);
  fillGoalIcons('#sheet');
  $('#lvGo').onclick=()=>{ closeSheet(); if(inRun){ resumeRun(S.run); return; } startLevel(L); }; }
function startLevel(L){ if(S.run&&S.run.mode==='classic'&&S.run.started&&!S.run.st.over&&S.run.setup.mode!=='zen') S.rec.cur=0;
  const cfg=levelCfg(L); startGame({mode:'campaign',lid:L.id,cfg,st:newGame(cfg)}); }

// ===================== DAILY =====================
function openDaily(){ const date=todayStr(), d=dailyFor(S,date), cfg=dailyCfg(date), wd=weekdayOf(date);
  const order=[1,2,3,4,5,6,0], last=Object.keys(S.dhist).sort().reverse();
  openSheet(`<h2>Daily</h2><div class="sub"><b>${esc(TF('{0} · {1}',T(WDN[wd]),T(cfg.label)))}</b><br>${esc(T('The same level for everyone today, with the same new pieces falling. Easier early in the week, harder at the weekend.'))}</div>
   ${goalRows(cfg.goals)}
   <div class="kv"><div><b>${cfg.limit}</b><span>Moves</span></div><div><b>${S.dstreak.cur}</b><span>Streak</span></div><div><b>${S.dclears||0}</b><span>Cleared</span></div></div>
   ${d.scored?`<div class="box" style="padding:10px 14px"><div class="srow"><div>${d.cleared?'Cleared':'Not cleared'}<div class="d">${d.cleared?esc(fmtNum(d.score)+' · '+TF('{0} moves left',d.left)+(d.assisted?' · '+T('assisted'):'')):'Your scored attempt is used'}</div></div>${starsHtml(d.stars)}</div></div>`:
    `<div class="sub" style="font-size:13px">${esc(TF('One scored attempt, saved and resumable. After it, practise as often as you like (practice doesn\'t score). Stars: goal met, {0} moves to spare, no assists.',cfg.par))}</div>`}
   <div class="label">Full Week<span>3 stars on each weekday</span></div><div class="week">${order.map(i=>`<div class="${S.dweek[i]?'on':''}">${esc(T(WD[i]))}</div>`).join('')}</div>
   ${last.length?`<div class="label">Last 7 Dailies</div><div class="box" style="padding:6px 12px"><table class="tbl">${last.map(k=>{ const r=S.dhist[k]; return `<tr><td>${k}</td><td>${r.won?fmtNum(r.score):'—'}</td><td>${starsHtml(r.stars)}</td></tr>`; }).join('')}</table></div>`:''}
   <div class="btns">${d.scored?`<button class="ghost" id="dShare">Share</button><button class="primary" id="dPrac">${d.practice?'Resume practice':'Practise'}</button>`:`<button class="ghost" data-close>Close</button><button class="primary" id="dGo">${d.run?'Resume':'Play'}</button>`}</div>`);
  fillGoalIcons('#sheet');
  if($('#dGo')) $('#dGo').onclick=()=>{ closeSheet(); if(d.run) resumeRun(d.run); else startGame({mode:'daily',date,cfg,st:newGame(cfg)}); };

async function openBackup(){ if(G) saveGame(); const code=await backupCode();
  openSheet(`<h2>Backup &amp; restore</h2><div class="sub">This code holds your Quintessence progress: XP, stars, records, achievements, settings and games in progress. Keep it somewhere safe.</div>
   <textarea rows="4" readonly id="bkCode">${esc(code)}</textarea><div class="btns"><button class="ghost" id="bkCopy">Copy</button><button class="ghost" id="bkFile">${esc(TF('Save to file ({0} KB)',Math.ceil(code.length/1024)))}</button></div>
   <div class="label">Restore</div><textarea rows="3" id="bkIn" placeholder="Paste a backup code"></textarea><div class="btns"><button class="ghost" data-close>Close</button><button class="primary" id="bkGo">Restore</button></div>`);
  $('#bkCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(code); toast('Copied'); }catch(e){ $('#bkCode').select(); } S.bk.last=Date.now(); persist(); };
  $('#bkFile').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'})); a.download=`quintessence-backup-${todayStr()}.txt`; a.click(); S.bk.last=Date.now(); persist(); };
  let armed=null; $('#bkGo').onclick=async()=>{ const o=await readBackup($('#bkIn').value); if(!o){ toast('That code isn\'t a Quintessence backup'); return; }
    if(armed!==o.xp){ armed=o.xp; $('#bkGo').textContent=TF('Replace my progress (level {0})',levelOf(o.xp)); return; }
    S=loadSave(JSON.stringify(o),REDUCED); G=null; persist(); refreshShared(); applyLook(); closeSheet(); goHome(); toast('Progress restored'); }; }

// ===================== START =====================
function boot(){ applyLook(); startI18n(); renderHome();
  if(location.hash==='#game-settings'){ openSettings(); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
  if(ARCADE) writeSummary();
  if(S.seenVer&&S.seenVer!==VERSION){ S.seenVer=VERSION; persist(); setTimeout(openNews,400); } else if(!S.seenVer){ S.seenVer=VERSION; persist(); } }
addEventListener('pageshow',()=>{ refreshShared(); applyLook(); });
addEventListener('pagehide',()=>{ if(G&&!G.done) saveGame(); persist(); writeSummary(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(G&&!G.done) saveGame(); writeSummary(); } });
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyLook);
boot();
</script>
<script>
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('../sw.js',{scope:'../'}).then(reg=>{
  const c=navigator.serviceWorker.controller; if(c&&navigator.onLine) c.postMessage('arcade-repair');
  // Installed apps can stay open for days: re-check for updates when brought back, at most every 30 min.
  let last=Date.now(); document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&Date.now()-last>18e5){ last=Date.now(); reg.update().catch(()=>{}); } });
}).catch(()=>{}));
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
</script>
</body></html>
