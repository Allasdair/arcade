<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f2f0f5" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#100f14" media="(prefers-color-scheme: dark)">
<title>Quintessence</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="../fonts.css">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arcade">
<script src="../avatars.js"></script>

<script>window.__ARCADE__=1</script>
<style>
:root{--bg:#f2f0f5;--panel:#fff;--ink:#1c1b20;--sub:#8a8792;--accent:#5b3fb8;--accentInk:#fff;--line:rgba(0,0,0,.08);--gold:#e8a913;--good:#2f9e6a;--bad:#d9534f}
.dark{--bg:#100f14;--panel:#1c1a22;--ink:#f3f1f6;--sub:#8f8b98;--accent:#c9b8ff;--accentInk:#17141f;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
textarea{width:100%;font:12px/1.4 'JetBrains Mono',monospace;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:none;-webkit-user-select:text;user-select:text}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;flex:1;padding:16px 16px 36px;max-width:560px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h2{font-size:24px;font-weight:800;letter-spacing:-.03em;flex:1;min-width:0}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 0 16px}
.brand h1{font-size:34px;font-weight:800;letter-spacing:-.045em;line-height:1}
.brand p{color:var(--sub);font-size:14px;margin-top:8px;line-height:1.35}
.acts{display:flex;gap:8px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.backbtn{height:36px;padding:0 12px 0 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-bottom:6px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:22px 4px 10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.label span{letter-spacing:.02em;text-transform:none;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 15px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:10px;transition:transform .12s;min-width:0}
button.card:active{transform:scale(.98)}
.card .t{font-weight:700;font-size:17px;letter-spacing:-.01em;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.row2 .card .t{font-size:15.5px}
.card .s{color:var(--sub);font-size:13px;margin-top:2px;line-height:1.3;overflow-wrap:anywhere}
.card .grow{flex:1;min-width:0}
.card .r{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex:none;max-width:42%}
.card .r b{display:block;font-size:15px}
.card .r span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.card.dim{opacity:.55}
.ico{width:42px;height:42px;border-radius:12px;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--accent)}
.ico svg{width:26px;height:26px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .card{margin:0;padding:12px;gap:10px}
.row2 .ico{width:36px;height:36px}.row2 .card .s{overflow-wrap:normal}
.lvl .badge{width:50px;height:50px;border-radius:15px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.primary{background:var(--accent);color:var(--accentInk);border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;width:100%;transition:transform .12s}
.primary:active{transform:scale(.98)}
.ghost{background:var(--bg);border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;width:100%}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns>*{flex:1 1 0;min-width:0}
.seg{display:flex;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;padding:9px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);min-width:0}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.dark .seg button.on{background:#2a2b31}
.opt{margin:12px 0}
.opt>.h{font-size:12px;font-weight:700;color:var(--sub);margin:0 2px 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;width:100%;font-weight:600;font-size:15px;text-align:left}
.srow .d{font-size:12.5px;color:var(--sub);font-weight:500;margin-top:2px}
.srow>div{min-width:0}
.sw{width:46px;height:28px;border-radius:99px;background:var(--bg);position:relative;transition:background .2s;flex:none;border:1px solid var(--line)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--sub);transition:left .2s,background .2s}
.sw.on{background:var(--accent)}.sw.on::after{left:21px;background:var(--accentInk)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 14px;margin-bottom:10px}
.box .srow+.srow{border-top:1px solid var(--line)}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px;white-space:nowrap}
.stars .o{color:var(--sub);opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;max-width:100%;min-width:0;overflow-wrap:anywhere}
.chip.on{background:var(--accent);color:var(--accentInk);border-color:transparent}
.topseg{background:var(--panel);border:1px solid var(--line);margin:0 0 14px}
.topseg button{font-size:12px;padding:9px 3px;white-space:nowrap;letter-spacing:-.01em}
.topseg button.on{background:var(--accent);color:var(--accentInk)}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px;text-align:left;position:relative;transition:transform .12s;min-width:0}
.tcard:active{transform:scale(.98)}
.tcard .pv{aspect-ratio:7/4;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden;position:relative}
.tcard .n{font-weight:700;font-size:14px;margin:9px 5px 2px;overflow-wrap:anywhere}
.tcard .q{font-size:11.5px;color:var(--sub);margin:0 5px 5px;line-height:1.3;min-height:2.6em;overflow-wrap:anywhere}
.tcard.sel{box-shadow:0 0 0 2.5px var(--accent)}
.tcard.locked .pv{filter:grayscale(.9);opacity:.45}
.tcard .pv svg.i{width:38px;height:38px;stroke-width:1.6;color:var(--accent)}
.tcard.playing .pv{opacity:.4}
.lock{position:absolute;top:13px;right:13px;width:28px;height:28px;border-radius:9px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.lock svg.i{width:15px;height:15px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 2px;border-radius:10px;font-weight:700;font-size:13px;color:var(--sub);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--accentInk)}
.lvcard .num{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.lvcard.fin .num{background:var(--accent);color:var(--accentInk)}
.lvpath .lvcard:nth-child(4n+2),.lvpath .lvcard:nth-child(4n+3){margin-left:18px;width:calc(100% - 18px)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:8px 4px;text-align:right;border-top:1px solid var(--line)}
.tbl th{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700;border:0}
.tbl td:first-child,.tbl th:first-child{text-align:left;font-weight:600}
.ach{display:flex;gap:12px;align-items:center;padding:10px 2px}
.ach+.ach{border-top:1px solid var(--line)}
.ach .m{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none;font-size:15px;font-weight:800}
.ach.done .m{background:var(--gold);color:#3a2a00}
.ach .n{font-weight:700;font-size:14.5px}.ach .d{color:var(--sub);font-size:12.5px;margin-top:1px;overflow-wrap:anywhere}
.ach>div:last-child{min-width:0}
.week{display:flex;gap:6px;justify-content:space-between;margin:6px 0}
.week div{flex:1;min-width:0;text-align:center;font-size:11px;font-weight:700;color:var(--sub);background:var(--bg);border-radius:10px;padding:7px 0}
.week div.on{background:var(--gold);color:#3a2a00}
/* sheets */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:2000;padding:0 0 env(safe-area-inset-bottom)}
#ov.on{display:flex}
#sheet{background:var(--panel);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px 20px;max-height:92vh;overflow-y:auto;overflow-x:hidden;animation:up .22s ease-out}
@media (min-height:700px) and (min-width:600px){ #ov{align-items:center} #sheet{border-radius:24px} }
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;overflow-wrap:anywhere}
#sheet .sub{color:var(--sub);font-size:14px;line-height:1.4;margin-bottom:12px}
.goal{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px;font-weight:600}
.goal .st{font-size:18px;color:var(--sub);opacity:.4;width:22px;text-align:center;flex:none}
.goal.got .st{color:var(--gold);opacity:1}
.goal.new .st{animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--bg);border-radius:12px;padding:9px 6px;text-align:center;min-width:0;overflow-wrap:anywhere}
.kv b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.kv span{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.howto p{font-size:14px;line-height:1.5;margin:6px 0}
.howto h3{font-size:15px;margin:14px 0 4px}
.howto .dia{display:flex;justify-content:center;margin:8px 0 4px}
#toast{position:fixed;left:50%;top:0;transform:translate(-50%,calc(-100% - env(safe-area-inset-top) - 20px));opacity:0;background:var(--accent);color:var(--accentInk);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:3000;transition:transform .35s,opacity .35s;max-width:calc(100vw - 24px);text-align:center;pointer-events:none;margin-top:calc(env(safe-area-inset-top) + 10px)}
#toast.on{transform:translate(-50%,0);opacity:1}
#fxc{position:fixed;inset:0;pointer-events:none;z-index:1500;width:100%;height:100%}

/* ===== the game screen ===== */
#game{background:var(--gbg);color:var(--gInk)}
.gcol{width:100%;height:100%;display:flex;flex-direction:column;padding:6px 8px 8px;gap:6px;margin:0 auto;max-width:640px}
.gbar{display:flex;gap:6px;align-items:stretch;flex:none;width:100%}
.gbar .box2{min-width:0;background:var(--chip);border-radius:12px;padding:5px 8px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-variant-numeric:tabular-nums;line-height:1.15;text-align:center}
.gbar .box2 b{font-size:19px;white-space:nowrap}
.gbar .box2 span{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gbar .box2.warn b{color:var(--bad)}
.gbar #gMoves{flex:0 0 64px}.gbar #gScore{flex:0 0 86px}
#gGoals{flex:1;min-width:0;display:flex;gap:4px;justify-content:center;align-items:stretch}
.gl{flex:1 1 0;min-width:0;max-width:110px;background:var(--chip);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:5px;padding:4px 5px;font-variant-numeric:tabular-nums}
.gl canvas{width:26px;height:26px;flex:none}
.gl b{font-size:14.5px;white-space:nowrap}
.gl.done{box-shadow:inset 0 0 0 2px var(--gold)}
.gl.done b{color:var(--gold)}
.gl .sc{display:flex;flex-direction:column;align-items:flex-start;min-width:0;line-height:1.1}.gl .sc span{font-size:9.5px;font-weight:700;opacity:.7;text-transform:uppercase}
.gtag{font-size:11px;font-weight:700;text-align:center;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.75}
#bArea{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
#boardWrap{position:relative;flex:none;touch-action:none}
#bc{display:block;touch-action:none}
#announce{position:absolute;left:0;right:0;top:40%;text-align:center;pointer-events:none;font-weight:900;font-size:44px;letter-spacing:-.02em;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25),0 0 24px var(--annc,#c9b8ff);opacity:0;z-index:5}
#announce.on{animation:ann 1s ease-out}
@keyframes ann{0%{opacity:0;transform:scale(.5)}18%{opacity:1;transform:scale(1.12)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05) translateY(-14px)}}
#tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;flex:none;width:100%}
#tools button{height:48px;border-radius:13px;background:var(--chip);display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:700;min-width:0;position:relative;color:var(--gInk)}
#tools button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tools button svg.i{width:20px;height:20px}
#tools .cnt{min-width:30px;height:20px;padding:0 6px;border-radius:99px;background:var(--gold);color:#3a2a00;font-size:11px;font-weight:800;display:grid;place-items:center;font-style:normal}
#cover{position:fixed;inset:0;z-index:1000;background:var(--gbg);color:var(--gInk);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#cover.on{display:flex}
#cover h2{font-size:28px;font-weight:800}
#cover .sub{opacity:.75;font-size:13.5px;max-width:320px}
#cover button{background:var(--chip);color:var(--gInk);border-radius:14px;padding:12px 22px;font-weight:700;font-size:15px;min-width:220px}
#skipTip{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;pointer-events:none;z-index:6;white-space:nowrap}
.sp{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin:8px 0}
.sp canvas{width:36px;height:36px}
.sp p{margin:0}
.rx{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
.rx td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:middle}
.rx td:first-child{font-weight:700;white-space:nowrap}
.goalrow{display:flex;gap:10px;align-items:center;margin:4px 0;font-size:14px;font-weight:600}
.goalrow canvas{width:28px;height:28px;flex:none}
.pvc{width:100%;height:100%;display:block}
</style>
</head>
<body>
<div id="toast"></div>
<canvas id="fxc"></canvas>

<!-- HOME -->
<section class="screen on" id="home"><div class="scroll">
  <button class="backbtn" id="arcadeBtn" hidden><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Arcade</button>
  <div class="brand"><div><h1 data-raw>Quintessence</h1><p>Match the elements, master the storm.</p></div>
    <div class="acts"><button class="iconbtn" id="styleBtn" aria-label="Style"><svg class="i" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 000 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A5.6 5.6 0 0022 9.8C22 5.5 17.5 2 12 2z"/></svg></button>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button></div></div>
  <div id="homeBody"></div>
</div></section>

<section class="screen" id="camp"><div class="scroll" id="campBody"></div></section>
<section class="screen" id="progress"><div class="scroll" id="progBody"></div></section>
<section class="screen" id="style"><div class="scroll"><div class="top"><button class="iconbtn" data-home aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><h2>Style</h2><span class="stars" style="color:var(--sub);font-weight:700" id="sCount"></span></div><div class="seg topseg" id="styleTabs"></div><div id="styleBody"></div></div></section>
<section class="screen" id="set"><div class="scroll" id="setBody"></div></section>

<!-- GAME -->
<section class="screen" id="game"><div class="gcol">
  <div class="gbar"><div class="box2" id="gMoves"><b>30</b><span>Moves</span></div><div id="gGoals"></div><div class="box2" id="gScore"><b>0</b><span>Score</span></div></div>
  <div class="gtag" id="gtag"></div>
  <div id="bArea"><div id="boardWrap"><canvas id="bc"></canvas><div id="announce"></div></div></div>
  <div id="tools">

<script>// ===================== Quintessence engine =====================
// Pure: no DOM. The whole game state is plain JSON (arrays of small numbers), so it saves after every move and
// resumes exactly. The same seed + the same moves always give the same board: every column has its own seeded
// stream of new pieces, and reshuffles, lava, Wisp targets, relics and Overflow draw from their own streams.

// ---------- seeded RNG (as in Sweep): cyrb128 → sfc32 ----------
function cyrb128(str){ let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;
  for(let i=0,k;i<str.length;i++){ k=str.charCodeAt(i); h1=h2^Math.imul(h1^k,597399067); h2=h3^Math.imul(h2^k,2869860233); h3=h4^Math.imul(h3^k,951274213); h4=h1^Math.imul(h4^k,2716044179); }
  h1=Math.imul(h3^(h1>>>18),597399067); h2=Math.imul(h4^(h2>>>22),2869860233); h3=Math.imul(h1^(h3>>>17),951274213); h4=Math.imul(h2^(h4>>>19),2716044179);
  return [(h1^h2^h3^h4)>>>0,(h2^h1)>>>0,(h3^h1)>>>0,(h4^h1)>>>0]; }
function sfc32(a,b,c,d){ return function(){ a>>>=0;b>>>=0;c>>>=0;d>>>=0; let t=(a+b)|0; a=b^(b>>>9); b=(c+(c<<3))|0; c=(c<<21)|(c>>>11); d=(d+1)|0; t=(t+d)|0; c=(c+t)|0; return (t>>>0)/4294967296; }; }
const rngFor=str=>{ const s=cyrb128(String(str)); return sfc32(s[0],s[1],s[2],s[3]); };
// a counter-based stream: the n-th draw of stream k depends only on (seed, k, n)
function mix3(a,b,c){ let h=(a^0x9e3779b9)>>>0; h=Math.imul(h^(b+0x7f4a7c15|0),0x85ebca6b); h^=h>>>13; h=Math.imul(h^(c+0x165667b1|0),0xc2b2ae35); h^=h>>>16; h=Math.imul(h,0x27d4eb2f); h^=h>>>15; return h>>>0; }
const ST_SHUF=1, ST_LAVA=2, ST_WISP=3, ST_OVER=4, ST_RELIC=5, ST_SURGE=6;
const draw=(st,k)=>mix3(st.si,k*7919+31,st.ctr[k]++)/4294967296;

// ---------- elements and specials ----------
const FIRE=0, WATER=1, EARTH=2, AIR=3, LIGHT=4, ICE=5, PRISM=6, RELIC=7;
const ELEMENTS=[{id:'fire',name:'Fire'},{id:'water',name:'Water'},{id:'earth',name:'Earth'},{id:'air',name:'Air'},{id:'lightning',name:'Lightning'},{id:'ice',name:'Ice'}];
const SURGE_H=1, SURGE_V=2, BURST=3, WISP=4, SPRISM=5, PRIMED=6;
const SPECIAL_NAMES=['','Surge','Surge','Burst','Wisp','Prism'];
const REACT={thaw:'Thaw!',quench:'Quench!',erode:'Erode!',clear:'Clear!',shatter:'Shatter!',freeze:'Freeze!'};
const SCORE_MATCH=[0,0,0,60,120,200], SCORE_HIT=20, SCORE_OB=30;
const isSpecial=s=>s>=1&&s<=5;

// ---------- board shapes: Sweep's masks ----------
const SHAPES=['heart','diamond','ring','cross','hourglass','islands'];
const SHAPE_NAMES={square:'Square',heart:'Heart',diamond:'Diamond',ring:'Ring',cross:'Cross',hourglass:'Hourglass',islands:'Twin Islands'};
function shapeMask(name,W,H){ const m=new Array(W*H).fill(1); if(!name||name==='square') return m;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const u=(x+.5)/W*2-1, v=(y+.5)/H*2-1; let on=1;
    if(name==='ring'){ const r=Math.hypot(u,v); on=r<=1.08&&r>=.42; }
    else if(name==='heart'){ const X=u*1.12, Y=-v*1.18+.2, a=X*X+Y*Y-1; on=a*a*a-X*X*Y*Y*Y<=0; }
    else if(name==='diamond') on=Math.abs(u)+Math.abs(v)<=1.2;
    else if(name==='cross') on=Math.abs(u)<=.46||Math.abs(v)<=.46;
    else if(name==='hourglass') on=Math.abs(u)<=Math.abs(v)*.95+.3;
    else if(name==='islands'){ const r1=Math.hypot((u+.5)*1.05,v*.9), r2=Math.hypot((u-.5)*1.05,v*.9); on=r1<=.58||r2<=.58||(Math.abs(v)<=.2&&Math.abs(u)<=.6); }
    m[y*W+x]=on?1:0; }
  // keep only the largest 4-connected region
  const seen=new Array(W*H).fill(-1); let best=-1, bestN=0, id=0;
  for(let i=0;i<W*H;i++){ if(!m[i]||seen[i]>=0) continue; let n=0; const q=[i]; seen[i]=id;
    while(q.length){ const c=q.pop(); n++; const cx=c%W, cy=(c/W)|0;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=cx+dx, ny=cy+dy; if(nx<0||ny<0||nx>=W||ny>=H) continue; const j=ny*W+nx; if(m[j]&&seen[j]<0){ seen[j]=id; q.push(j); } } }
    if(n>bestN){ bestN=n; best=id; } id++; }
  for(let i=0;i<W*H;i++) if(m[i]&&seen[i]!==best) m[i]=0;
  return m; }

// ---------- a new game ----------
// cfg: {W,H,ne,seed,shape,map (rows: '#' no cell, '.' piece, f/F frost 1/2, c chain, g fog, s/S/T stone 1-3, l lava, r relic),
//       pieces (rows of element digits, puzzle levels), goals:[{t,n,e}], limit (moves, 0 = none), relics:{total,max},
//       twist ('lava' | 'combos' | 'timed' | 'tight'), refill (default true)}
// Goal types: score · collect (e) · frost · stone · lava · fog · relic
function newGame(cfg){ const W=cfg.W||8, H=cfg.H||8, N=W*H, seed=String(cfg.seed||'x');
  const st={v:1,W,H,N,ne:cfg.ne||5,seed,si:cyrb128('QN|'+seed)[0],
    mask:shapeMask(cfg.shape,W,H),pe:new Array(N).fill(-1),ps:new Array(N).fill(0),pid:new Array(N).fill(0),
    fr:new Array(N).fill(0),ch:new Array(N).fill(0),fg:new Array(N).fill(0),stn:new Array(N).fill(0),lv:new Array(N).fill(0),
    colN:new Array(W).fill(0),colE:new Array(W).fill(0),ctr:[0,0,0,0,0,0,0,0],nid:1,
    score:0,gscore:0,moves:0,limit:cfg.limit||0,goals:(cfg.goals||[]).map(g=>Object.assign({},g)),got:[0,0,0,0,0,0],relicsOut:0,
    relic:{total:(cfg.relics&&cfg.relics.total)||0,max:(cfg.relics&&cfg.relics.max)||2,spawned:0},
    twist:cfg.twist||'',refill:cfg.refill!==false,over:false,won:false,stuck:false,ended:'',overflowed:false,
    shuffles:0,last:{cascade:0,specials:0,score:0,label:''},
    stats:{made:[0,0,0,0,0,0],combos:{},react:{},best:0,mostSp:0,matches:[0,0,0,0,0,0]}};
  const mapRow=(y,x)=>cfg.map&&cfg.map[y]?cfg.map[y][x]||'.':'.';
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=y*W+x, c=mapRow(y,x); if(c==='#') st.mask[i]=0; if(!st.mask[i]) continue;
    if(c==='f') st.fr[i]=1; else if(c==='F') st.fr[i]=2; else if(c==='c') st.ch[i]=1; else if(c==='g') st.fg[i]=1;
    else if(c==='s') st.stn[i]=1; else if(c==='S') st.stn[i]=2; else if(c==='T') st.stn[i]=3; else if(c==='l') st.lv[i]=1;
    else if(c==='r'){ st.pe[i]=RELIC; st.pid[i]=st.nid++; st.relic.spawned++; } }
  if(cfg.pieces){ // a fixed board (puzzle levels)
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=y*W+x, c=cfg.pieces[y]&&cfg.pieces[y][x]; if(!st.mask[i]||st.stn[i]||st.lv[i]||st.pe[i]===RELIC) continue;
      if(c>='0'&&c<='5'){ st.pe[i]=+c; st.pid[i]=st.nid++; } } }
  else fillFresh(st,'fill');
  st.init={frost:countOb(st,'fr'),stone:countOb(st,'stn'),lava:countOb(st,'lv'),fog:countOb(st,'fg'),chain:countOb(st,'ch')};
  return st; }
const countOb=(st,k)=>{ let n=0; for(let i=0;i<st.N;i++) if(st.mask[i]) n+=st[k][i]; return n; };
const pieceCell=(st,i)=>st.mask[i]&&!st.stn[i]&&!st.lv[i];
// Fill every piece cell so the board starts with no match and at least one swap (seeded; tries again if needed)
function fillFresh(st,tag){ for(let att=0;att<400;att++){ const r=rngFor(st.seed+'|'+tag+'|'+att);
    for(let i=0;i<st.N;i++) if(pieceCell(st,i)&&st.pe[i]!==RELIC){ st.pe[i]=-1; st.ps[i]=0; }
    for(let i=0;i<st.N;i++){ if(!pieceCell(st,i)||st.pe[i]===RELIC) continue; const ban=banned(st,i), ok=[];
      for(let e=0;e<st.ne;e++) if(!ban.includes(e)) ok.push(e);
      st.pe[i]=ok[Math.floor(r()*ok.length)]; }
    if(!findGroups(st).length&&hasSwap(st)){ for(let i=0;i<st.N;i++) if(st.pe[i]>=0&&st.pe[i]<6&&!st.pid[i]) st.pid[i]=st.nid++; return true; } }
  return false; }
// elements that would make a match (3 in a row or a 2×2 square) with the cells already filled above and to the left
function banned(st,i){ const W=st.W, x=i%W, y=(i/W)|0, pe=st.pe, b=[], m=j=>j>=0&&st.mask[j]&&pe[j]>=0&&pe[j]<6;
  if(x>=2&&m(i-1)&&m(i-2)&&pe[i-1]===pe[i-2]) b.push(pe[i-1]);
  if(y>=2&&m(i-W)&&m(i-2*W)&&pe[i-W]===pe[i-2*W]) b.push(pe[i-W]);
  if(x>=1&&y>=1&&m(i-1)&&m(i-W)&&m(i-W-1)&&pe[i-1]===pe[i-W]&&pe[i-1]===pe[i-W-1]) b.push(pe[i-1]);
  // pieces already placed to the right/below (relics only) can't clash
  return b; }

// ---------- building maps from recipes (campaign tools and the Daily) ----------
// Obstacle patterns are placed mirrored left/right. box x y w h · rows y0 y1 · bottom n · top n (relics) · scatter n ·
// *frost / *lava / *fog (seeded Daily patterns). Later entries overwrite earlier ones.
function buildMap(W,H,mask,ob,rnd){ const m=[]; for(let y=0;y<H;y++){ const row=[]; for(let x=0;x<W;x++) row.push(mask[y*W+x]?'.':'#'); m.push(row); }
  const put=(x,y,c)=>{ if(x<0||y<0||x>=W||y>=H||m[y][x]==='#') return; m[y][x]=c; const mx=W-1-x; if(m[y][mx]!=='#') m[y][mx]=c; };
  const colTop=x=>{ for(let y=0;y<H;y++) if(m[y][x]!=='#') return y; return -1; };
  const colBot=x=>{ for(let y=H-1;y>=0;y--) if(m[y][x]!=='#') return y; return -1; };
  for(const [c,p,...a] of ob||[]){
    if(p==='box'){ const [x0,y0,w,h]=a; for(let y=y0;y<y0+h;y++) for(let x=x0;x<x0+w;x++) put(x,y,c); }
    else if(p==='rows'){ for(let y=a[0];y<=a[1];y++) for(let x=0;x<W;x++) put(x,y,c); }
    else if(p==='bottom'){ for(let x=0;x<W;x++){ const b=colBot(x); for(let k=0;k<a[0];k++) if(b-k>=0) put(x,b-k,c); } }
    else if(p==='top'){ // relics: n on the top row, spread out
      const xs=[]; for(let x=0;x<W;x++) if(colTop(x)>=0) xs.push(x); const n=a[0]; for(let k=0;k<n;k++){ const x=xs[Math.floor((k+1)*xs.length/(n+1))]; m[colTop(x)][x]=c; } }
    else if(p==='scatter'){ for(let k=0;k<a[0];k++){ const x=Math.floor(rnd()*Math.ceil(W/2)), y=Math.floor(rnd()*H); put(x,y,c); } }
    else if(p==='*frost'){ const y0=3+Math.floor(rnd()*3); for(let y=y0;y<Math.min(H,y0+3);y++) for(let x=0;x<W;x++) if(rnd()<.6) put(x,y,rnd()<.25?'F':'f'); }
    else if(p==='*lava'){ const x=Math.floor(rnd()*3), y=H-2-Math.floor(rnd()*2); for(const [dx,dy] of [[0,0],[1,0],[0,1],[1,1]]) put(x+dx,y+dy,c); }
    else if(p==='*fog'){ const y0=2+Math.floor(rnd()*3), x0=Math.floor(rnd()*2); for(let y=y0;y<y0+3;y++) for(let x=x0;x<W-x0;x++) put(x,y,c); } }
  return m.map(r=>r.join('')); }

// ---------- cell rules ----------
// fixed: doesn't fall and can't be swapped (stone, lava, frost, chains, fog, or no cell)
const fixedCell=(st,i)=>!st.mask[i]||st.stn[i]>0||st.lv[i]>0||st.fr[i]>0||st.ch[i]>0||st.fg[i]>0;
const movable=(st,i)=>st.mask[i]&&st.pe[i]>=0&&!fixedCell(st,i);
// frost and chains can still be matched; fog hides its piece, so it can't
const matchable=(st,i)=>st.mask[i]&&st.pe[i]>=0&&st.pe[i]<6&&!st.fg[i]&&st.ps[i]!==PRIMED&&!st.stn[i]&&!st.lv[i];
const locked=(st,i)=>st.fr[i]>0||st.ch[i]>0||st.fg[i]>0;
const neighbours=(st,i)=>{ const W=st.W, x=i%W, o=[]; if(x>0) o.push(i-1); if(x<W-1) o.push(i+1); if(i>=W) o.push(i-W); if(i+W<st.N) o.push(i+W); return o; };
const adjacent=(st,a,b)=>neighbours(st,a).includes(b);

// ---------- matching ----------
// Groups of 3+ in a row or column, or 2×2 squares, joined when they touch and share an element.
// The special a group makes: 5 in a line (Prism) > L or T (Burst) > 4 in a line (Surge) > 2×2 (Wisp) > 3 (none).
function findGroups(st){ const W=st.W, H=st.H, N=st.N, pe=st.pe, inM=new Uint8Array(N), hL=new Uint8Array(N), vL=new Uint8Array(N), hS=new Int16Array(N), vS=new Int16Array(N), sq=new Int16Array(N).fill(-1);
  const m=new Uint8Array(N); let any=0; for(let i=0;i<N;i++) m[i]=matchable(st,i)?1:0;
  for(let y=0;y<H;y++){ let x=0; while(x<W){ const i=y*W+x; if(!m[i]){ x++; continue; } let x2=x; while(x2+1<W&&m[i+x2+1-x]&&pe[i+x2+1-x]===pe[i]) x2++; const len=x2-x+1;
      if(len>=3){ any=1; for(let k=x;k<=x2;k++){ const j=y*W+k; inM[j]=1; hL[j]=len; hS[j]=i; } } x=x2+1; } }
  for(let x=0;x<W;x++){ let y=0; while(y<H){ const i=y*W+x; if(!m[i]){ y++; continue; } let y2=y; while(y2+1<H&&m[(y2+1)*W+x]&&pe[(y2+1)*W+x]===pe[i]) y2++; const len=y2-y+1;
      if(len>=3){ any=1; for(let k=y;k<=y2;k++){ const j=k*W+x; inM[j]=1; vL[j]=len; vS[j]=i; } } y=y2+1; } }
  for(let y=0;y<H-1;y++) for(let x=0;x<W-1;x++){ const i=y*W+x, e=pe[i]; if(m[i]&&m[i+1]&&m[i+W]&&m[i+W+1]&&pe[i+1]===e&&pe[i+W]===e&&pe[i+W+1]===e){ any=1; for(const j of [i,i+1,i+W,i+W+1]){ inM[j]=1; if(sq[j]<0) sq[j]=i; } } }
  if(!any) return [];
  const seen=new Uint8Array(N), groups=[];
  for(let i=0;i<N;i++){ if(!inM[i]||seen[i]) continue; const e=pe[i], cells=[], q=[i]; seen[i]=1;
    while(q.length){ const c=q.pop(); cells.push(c); for(const j of neighbours(st,c)) if(inM[j]&&!seen[j]&&pe[j]===e){ seen[j]=1; q.push(j); } }
    cells.sort((a,b)=>a-b);
    let maxRun=0, runCell=-1, runH=1, cross=-1, sqc=-1;
    for(const c of cells){ if(hL[c]>maxRun){ maxRun=hL[c]; runCell=c; runH=1; } if(vL[c]>maxRun){ maxRun=vL[c]; runCell=c; runH=0; }
      if(hL[c]>=3&&vL[c]>=3&&cross<0) cross=c; if(sq[c]>=0&&sqc<0) sqc=sq[c]; }
    let sp=0, anchor=cells[0];
    const mid=(start,len,h)=>start+(h?1:W)*Math.floor((len-1)/2);
    if(maxRun>=5){ sp=SPRISM; anchor=mid(runH?hS[runCell]:vS[runCell],maxRun,runH); }
    else if(cross>=0){ sp=BURST; anchor=cross; }
    else if(maxRun===4){ sp=runH?SURGE_H:SURGE_V; anchor=mid(runH?hS[runCell]:vS[runCell],4,runH); }
    else if(sqc>=0){ sp=WISP; anchor=sqc; }
    else if(maxRun>=3) anchor=mid(runH?hS[runCell]:vS[runCell],maxRun,runH);
    groups.push({e,cells,sp,anchor,size:cells.length}); }
  return groups; }
// does the piece at i make a match where it stands?
function matchAt(st,i){ if(!matchable(st,i)) return false; const W=st.W, H=st.H, x=i%W, y=(i/W)|0, e=st.pe[i], same=j=>matchable(st,j)&&st.pe[j]===e;
  let h=1; for(let k=x-1;k>=0&&same(y*W+k);k--) h++; for(let k=x+1;k<W&&same(y*W+k);k++) h++; if(h>=3) return true;
  let v=1; for(let k=y-1;k>=0&&same(k*W+x);k--) v++; for(let k=y+1;k<H&&same(k*W+x);k++) v++; if(v>=3) return true;
  for(const [dx,dy] of [[-1,-1],[0,-1],[-1,0],[0,0]]){ const x0=x+dx, y0=y+dy; if(x0<0||y0<0||x0>=W-1||y0>=H-1) continue; const j=y0*W+x0;
    if(same(j)&&same(j+1)&&same(j+W)&&same(j+W+1)) return true; }
  return false; }
function swapCells(st,a,b){ for(const k of ['pe','ps','pid']){ const t=st[k][a]; st[k][a]=st[k][b]; st[k][b]=t; } }
// a swap is valid if it makes a match, or involves a Prism (with any element piece or special), or joins two specials
function validSwap(st,a,b){ if(!adjacent(st,a,b)||!movable(st,a)||!movable(st,b)) return false;
  const ea=st.pe[a], eb=st.pe[b], sa=st.ps[a], sb=st.ps[b];
  if(ea===RELIC&&eb===RELIC) return false;
  if(sa===SPRISM||sb===SPRISM) return !(ea===RELIC||eb===RELIC);
  if(isSpecial(sa)&&isSpecial(sb)) return true;
  swapCells(st,a,b); const ok=matchAt(st,a)||matchAt(st,b); swapCells(st,a,b); return ok; }
function listSwaps(st){ const o=[]; for(let i=0;i<st.N;i++){ if(!movable(st,i)) continue; const x=i%st.W;
    if(x<st.W-1&&validSwap(st,i,i+1)) o.push([i,i+1]); if(i+st.W<st.N&&validSwap(st,i,i+st.W)) o.push([i,i+st.W]); } return o; }
function hasSwap(st){ for(let i=0;i<st.N;i++){ if(!movable(st,i)) continue; if(i%st.W<st.W-1&&validSwap(st,i,i+1)) return true; if(i+st.W<st.N&&validSwap(st,i,i+st.W)) return true; } return false; }

// ---------- the recorder (animation frames for the app; off for bots) ----------
let REC=null, CUR=null;
const snap=st=>({pe:st.pe.slice(),ps:st.ps.slice(),pid:st.pid.slice(),fr:st.fr.slice(),ch:st.ch.slice(),fg:st.fg.slice(),stn:st.stn.slice(),lv:st.lv.slice()});
function frame(st,kind,extra){ if(REC) REC.push(Object.assign({kind,b:snap(st),score:st.score},extra||{})); }

// ---------- clearing ----------
// A step: everything that clears at once (match groups, the specials they set off, a combo, primed Bursts).
function newStep(st,k){ return {k,hit:new Uint8Array(st.N),q:[],rm:[],fx:[],react:[],ob:[],groups:[],newSp:[],lavaCleared:false,specials:0}; }
function addReact(st,i,kind){ CUR.react.push({c:i,kind}); st.stats.react[kind]=(st.stats.react[kind]||0)+1; }
// hit a cell once: obstacles lose a layer; a free piece is removed (setting off its special); a Burst primes instead
function hitCell(st,i,byMatch){ const C=CUR; if(i<0||i>=st.N||!st.mask[i]||C.hit[i]) return; C.hit[i]=1;
  if(st.stn[i]>0){ st.stn[i]--; C.ob.push({c:i,t:'stone'}); obScore(st); return; }
  if(st.lv[i]){ st.lv[i]=0; C.lavaCleared=true; C.ob.push({c:i,t:'lava'}); obScore(st); return; }
  if(st.fg[i]){ st.fg[i]=0; C.ob.push({c:i,t:'fog'}); obScore(st); return; }
  if(st.pe[i]<0) return;
  // frost and chains: a match takes a layer and clears the piece once it's free; a blast only takes the layer

function classicThresholds(setup){ const t=(typeof CLASSIC_SCORES!=='undefined'&&CLASSIC_SCORES[`${setup.mode}|${setup.board}|${setup.ne}`])||[8000,12000];
  const f=setup.obst==='light'?(typeof CLASSIC_OB_FACTOR!=='undefined'?CLASSIC_OB_FACTOR:1):1; return [Math.round(t[0]*f/100)*100,Math.round(t[1]*f/100)*100]; }
function classicStars(setup,score,assisted){ const [b,s]=classicThresholds(setup); return [score>=b?1:0,score>=s?1:0,score>=b&&!assisted?1:0]; }
// Moves and Timed pay 5/10/15 XP for the bronze/silver/no-assist stars the first time per mode × board × elements,
// then 3 XP for each game with any star. Zen pays 1 XP per 100 matches, at most 20 a day.
function classicResult(S,setup,score,assisted,stats){ const k=clKey(setup), r=clRec(S,k), st=classicStars(setup,score,assisted), fresh=[]; let xp=0;
  r.games++; S.rec.games++; const rec=score>r.best; if(rec) r.best=score;
  st.forEach((s,i)=>{ if(s&&!r.stars[i]){ r.stars[i]=1; fresh.push(i); xp+=[5,10,15][i]; } });
  if(!fresh.length&&st[0]) xp+=3;
  const won=!!st[0]; if(won){ r.wins++; S.rec.clears++; S.rec.cur++; S.rec.bestStreak=Math.max(S.rec.bestStreak,S.rec.cur); } else S.rec.cur=0;
  return {stars:st,fresh,xp,record:rec&&r.games>1,won}; }
function zenXP(S,today,matches){ const z=S.zenXP; if(z.date!==today){ z.date=today; z.n=0; } z.carry=(z.carry||0)+matches; let xp=0;
  while(z.carry>=100&&z.n<20){ z.carry-=100; z.n++; xp++; } if(z.n>=20) z.carry=0; return xp; }

function addXP(S,n){ const before=levelOf(S.xp); S.xp+=Math.max(0,Math.round(n)); const after=levelOf(S.xp), rewards=[];
  for(let l=before+1;l<=after;l++) rewards.push(...rewardsAt(l));
  const ups=after-before; if(ups>0) S.hints=Math.min(HINT_MAX,(S.hints||0)+ups);
  return {xp:Math.round(n),before,after,rewards,hints:ups}; }

function campaignResult(S,Lv,won,spare,assisted,score){ const c=campOf(S,Lv.id), C=CAMPS[Lv.camp], wasDone=campDone(S,Lv.camp), fresh=[]; let xp=0;

  S.camp[Lv.id]=c; const finished=!wasDone&&campDone(S,Lv.camp); if(finished) xp+=C.bonus;
  return {earned,fresh,stars:campStars(S,Lv.id),xp,finished}; }

// fold a finished move's stats into the totals (matches per element, specials, combos, reactions)
function addStats(S,before,after){ const T=S.tot;
  for(let e=0;e<6;e++) T.m[e]+=after.matches[e]-before.matches[e];
  for(let s=1;s<=5;s++) T.made[s]=(T.made[s]||0)+after.made[s]-before.made[s];
  for(const k in after.combos){ const d=after.combos[k]-(before.combos[k]||0); if(d>0){ const ck=comboKey(k); T.combos[ck]=(T.combos[ck]||0)+d; } }
  for(const k in after.react){ const d=after.react[k]-(before.react[k]||0); if(d>0) T.react[k]=(T.react[k]||0)+d; } }
// ctx: {mode, won, cascade (best this game), specials (most in one move), score, setup (Classic), zenMs}
function checkAch(S,ctx){ const got=[], give=id=>{ if(!S.ach[id]){ S.ach[id]=Date.now(); got.push(id); } };
  if(ctx.practice) return got; const T=S.tot;
  for(const a of ACH){ if(a.el!=null&&T.m[a.el]>=a.n) give(a.id); if(a.react&&(T.react[a.react]||0)>=a.n) give(a.id); if(a.combo&&T.combos[a.combo]) give(a.id); }
  for(const s of [1,3,4,5]) if(T.made[s]||(s===1&&T.made[2])) give('sp'+s);
  if(S.rec.best>=5) give('casc5'); if(S.rec.best>=10) give('casc10'); if(S.rec.mostSp>=5) give('five');
  if(ctx.mode==='classic'&&ctx.setup){ if(ctx.setup.mode==='moves'&&ctx.score>=100000) give('s100k'); if(ctx.setup.mode==='timed'&&ctx.score>=60000) give('t60k'); }
  for(const n of [10,50,100,250,500]) if(S.rec.clears>=n) give('g'+n);
  if((ctx.zenMs||0)>=30*60000) give('zen30');
  if(typeof LEVELS!=='undefined'){ CAMPS.forEach((cp,i)=>{ if(campDone(S,i)) give('camp'+(i+1)); if(LEVELS.filter(L=>L.camp===i).every(L=>campStars(S,L.id)>=3)) give('perf'+(i+1)); });
    if(LEVELS.filter(L=>L.type==='puzzle').every(L=>campStars(S,L.id)>=3)) give('puzzle'); }
  const n=S.dclears||0, s3=S.d3||0; if(n>=7) give('d7'); if(n>=30) give('d30'); if(n>=100) give('d100');
  if(s3>=1) give('dstar1'); if(s3>=10) give('dstar10'); if(s3>=30) give('dstar30'); if(S.dstreak.cur>=7) give('dstreak'); if(S.dweek.every(Boolean)) give('dweek');
  return got; }
function achProgress(S,a){ const T=S.tot; if(a.el!=null) return [Math.min(T.m[a.el],a.n),a.n]; if(a.react) return [Math.min(T.react[a.react]||0,a.n),a.n];
  if(/^g\d/.test(a.id)) return [Math.min(S.rec.clears,a.n),a.n]; if(/^d\d/.test(a.id)) return [Math.min(S.dclears||0,a.n),a.n]; if(/^dstar/.test(a.id)) return [Math.min(S.d3||0,a.n),a.n];
  if(a.id==='dweek') return [S.dweek.filter(Boolean).length,7]; return null; }

const b64e=str=>{ const u=new TextEncoder().encode(str); let b=''; for(let i=0;i<u.length;i++) b+=String.fromCharCode(u[i]); return btoa(b); };
const b64d=b=>new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)));
function backupPlain(S){ return 'QUINTESSENCE1.'+b64e(JSON.stringify(S)); }
function parseBackup(text){ const m=/QUINTESSENCE1\.([A-Za-z0-9+/=]+)/.exec(String(text||'')); if(!m) return null;
  try{ const o=JSON.parse(b64d(m[1])); if(!o||typeof o!=='object'||typeof o.xp!=='number') return null; return o; }catch(e){ return null; } }

// ---------- Arcade contract ----------
function readArcade(store){ try{ const a=JSON.parse(store.get(ARCADE_KEY)||'null'); if(!a||typeof a!=='object') return null; return a; }catch(e){ return null; } }
function applyShared(S,a){ if(!a) return S; const o=Object.assign({},S), set=a.set||{}; for(const k of SHARED) if(set[k]!==undefined) o[k]=set[k]; if(typeof a.name==='string'&&a.name) o.name=a.name; return o; }
function summary(S){ const l=levelOf(S.xp), nL=typeof LEVELS==='undefined'?45:LEVELS.length;
  return {v:1,game:GAME_ID,ver:VERSION,level:l,maxLevel:MAXL,xp:S.xp,xpLevel:l,xpNext:xpNext(S),
    ach:ACH.map(a=>[a.name,a.desc,!!S.ach[a.id]]),
    hi:[['Campaign stars',`${totalStars(S)}/${nL*3}`],['Best cascade',String(S.rec.best||0)],['Daily streak',String(S.dstreak.cur)]],
    last:Date.now()}; }

["Swipe a piece toward a neighbour to swap them, or tap one and then the other. Line up 3 or more of the same element in a row or column, or make a 2×2 square, to clear them. Pieces above fall, new ones drop in, and any new matches clear too: cascades score more at every step.","Desliza una pieza hacia su vecina para intercambiarlas, o toca una y luego la otra. Alinea 3 o más del mismo elemento en fila o columna, o forma un cuadrado de 2×2, para eliminarlas. Las piezas de arriba caen, entran otras nuevas y las nuevas combinaciones también se eliminan: las cascadas puntúan más en cada paso.","Glissez une pièce vers sa voisine pour les échanger, ou touchez l'une puis l'autre. Alignez 3 éléments identiques ou plus en ligne ou en colonne, ou formez un carré 2×2, pour les éliminer. Les pièces au-dessus tombent, de nouvelles arrivent, et les nouvelles associations s'éliminent aussi : les cascades rapportent plus à chaque étape.","Wische einen Stein zu seinem Nachbarn, um sie zu tauschen, oder tippe erst den einen, dann den anderen an. Bringe 3 oder mehr gleiche Elemente in eine Reihe oder Spalte oder bilde ein 2×2-Quadrat, um sie abzuräumen. Steine darüber fallen nach, neue kommen hinzu, und neue Treffer räumen sich ebenfalls ab: Kaskaden bringen mit jedem Schritt mehr Punkte.","Deslize uma peça na direção da vizinha para trocá-las, ou toque numa e depois na outra. Alinhe 3 ou mais do mesmo elemento em linha ou coluna, ou forme um quadrado 2×2, para removê-las. As peças de cima caem, novas entram e novas combinações também somem: as cascatas valem mais a cada passo."],
["A swap that makes no match slides back and uses no move.","Un intercambio sin combinación vuelve atrás y no gasta movimiento.","Un échange sans association revient en place et ne coûte aucun coup.","Ein Tausch ohne Treffer gleitet zurück und kostet keinen Zug.","Uma troca sem combinação volta atrás e não gasta jogada."],
["The elements","Los elementos","Les éléments","Die Elemente","Os elementos"],
["Fewer elements mean more matches: 4 is Easy, 5 Normal, 6 Hard. Every element has its own shape, so colour is never needed.","Menos elementos significan más combinaciones: 4 es Fácil, 5 Normal, 6 Difícil. Cada elemento tiene su propia forma, así que el color nunca es necesario.","Moins d'éléments, plus d'associations : 4 c'est Facile, 5 Normal, 6 Difficile. Chaque élément a sa propre forme : la couleur n'est jamais nécessaire.","Weniger Elemente bedeuten mehr Treffer: 4 ist Leicht, 5 Normal, 6 Schwer. Jedes Element hat seine eigene Form, Farbe ist also nie nötig.","Menos elementos significam mais combinações: 4 é Fácil, 5 Normal, 6 Difícil. Cada elemento tem sua própria forma, então a cor nunca é necessária."],
["Specials","Especiales","Spéciales","Spezialsteine","Especiais"],
["4 in a line. Clears its whole row (made across) or column (made down).","4 en línea. Elimina toda su fila (si se hizo en horizontal) o columna (en vertical).","4 alignés. Élimine toute sa ligne (fait en horizontal) ou sa colonne (fait en vertical).","4 in einer Reihe. Räumt die ganze Zeile (waagrecht gebildet) oder Spalte (senkrecht gebildet) ab.","4 em linha. Remove a linha inteira (feito na horizontal) ou a coluna (na vertical)."],
["An L or T of 5. Clears the 3×3 around it, then once more after the board settles.","Una L o T de 5. Elimina el 3×3 a su alrededor y otra vez cuando el tablero se asienta.","Un L ou un T de 5. Élimine le 3×3 autour, puis encore une fois quand le plateau se stabilise.","Ein L oder T aus 5. Räumt das 3×3-Feld darum ab und noch einmal, wenn das Brett zur Ruhe kommt.","Um L ou T de 5. Remove o 3×3 ao redor e mais uma vez quando o tabuleiro se acomoda."],
["A 2×2 square. Clears a cross around itself, then flies to the most useful cell for your goal.","Un cuadrado de 2×2. Elimina una cruz a su alrededor y vuela a la casilla más útil para tu objetivo.","Un carré 2×2. Élimine une croix autour de lui, puis s'envole vers la case la plus utile pour votre objectif.","Ein 2×2-Quadrat. Räumt ein Kreuz um sich ab und fliegt dann zum nützlichsten Feld für dein Ziel.","Um quadrado 2×2. Remove uma cruz ao redor e voa para a casa mais útil para o seu objetivo."],
["5 in a line. Swap it with a piece to clear every piece of that element. It belongs to no element: it's the fifth.","5 en línea. Intercámbialo con una pieza para eliminar todas las de ese elemento. No pertenece a ningún elemento: es el quinto.","5 alignés. Échangez-le avec une pièce pour éliminer toutes celles de cet élément. Il n'appartient à aucun élément : c'est le cinquième.","5 in einer Reihe. Tausche es mit einem Stein, um alle Steine dieses Elements abzuräumen. Es gehört zu keinem Element: Es ist das fünfte.","5 em linha. Troque-o com uma peça para remover todas daquele elemento. Ele não pertence a nenhum elemento: é o quinto."],
["Combos: swap two specials","Combos: intercambia dos especiales","Combos : échangez deux spéciales","Kombos: tausche zwei Spezialsteine","Combos: troque dois especiais"],
["Clears a cross: its row and its column","Elimina una cruz: su fila y su columna","Élimine une croix : sa ligne et sa colonne","Räumt ein Kreuz ab: Zeile und Spalte","Remove uma cruz: a linha e a coluna"],["Clears 3 rows and 3 columns","Elimina 3 filas y 3 columnas","Élimine 3 lignes et 3 colonnes","Räumt 3 Zeilen und 3 Spalten ab","Remove 3 linhas e 3 colunas"],["Clears a 5×5 area, twice","Elimina un área de 5×5, dos veces","Élimine une zone 5×5, deux fois","Räumt ein 5×5-Feld ab, zweimal","Remove uma área 5×5, duas vezes"],
["The Wisp carries the special away and sets it off where it lands","El Wisp se lleva el especial y lo activa donde aterriza","Le Wisp emporte la spéciale et la déclenche là où il se pose","Der Wisp trägt den Spezialstein davon und zündet ihn, wo er landet","O Wisp leva o especial e o ativa onde pousa"],["Three Wisps fly out","Salen volando tres Wisps","Trois Wisps s'envolent","Drei Wisps fliegen los","Três Wisps saem voando"],
["Every piece of the most common element becomes that special, then they all go off","Todas las piezas del elemento más común se convierten en ese especial y luego se activan todas","Toutes les pièces de l'élément le plus fréquent deviennent cette spéciale, puis se déclenchent toutes","Jeder Stein des häufigsten Elements wird zu diesem Spezialstein, dann zünden alle","Todas as peças do elemento mais comum viram esse especial e depois todas são ativadas"],["Clears the whole board","Elimina todo el tablero","Élimine tout le plateau","Räumt das ganze Brett ab","Remove o tabuleiro inteiro"],
["Obstacles and reactions","Obstáculos y reacciones","Obstacles et réactions","Hindernisse und Reaktionen","Obstáculos e reações"],
["Any match next to an obstacle damages it by one layer. A match of the reacting element does more.","Cualquier combinación junto a un obstáculo le quita una capa. Una combinación del elemento que reacciona hace más.","Toute association à côté d'un obstacle lui retire une couche. Une association de l'élément qui réagit fait plus.","Jeder Treffer neben einem Hindernis nimmt ihm eine Schicht. Ein Treffer des reagierenden Elements bewirkt mehr.","Qualquer combinação ao lado de um obstáculo tira uma camada. Uma combinação do elemento que reage faz mais."],
["Frost holds a piece in place; it can still be matched. Fire thaws every layer at once: Thaw!","La escarcha sujeta una pieza; aún puede combinarse. El Fuego derrite todas las capas a la vez: ¡Deshielo!","Le givre bloque une pièce ; elle peut encore être associée. Le Feu fait fondre toutes les couches d'un coup : Dégel !","Frost hält einen Stein fest; er kann trotzdem kombiniert werden. Feuer taut alle Schichten auf einmal: Taut!","A geada prende uma peça; ela ainda pode ser combinada. O Fogo derrete todas as camadas de uma vez: Degelo!"],
["Lava spreads into a neighbouring piece after any move that clears no lava. Water quenches it and the lava touching it: Quench! Ice freezes it into stone: Freeze!","La lava se extiende a una pieza vecina tras cualquier movimiento que no elimine lava. El Agua la apaga junto con la lava que la toca: ¡Apagado! El Hielo la convierte en piedra: ¡Congelado!","La lave s'étend à une pièce voisine après tout coup qui n'en élimine pas. L'Eau l'éteint, ainsi que la lave qui la touche : Éteinte ! La Glace la fige en pierre : Figée !","Lava breitet sich nach jedem Zug, der keine Lava entfernt, in einen Nachbarstein aus. Wasser löscht sie und die angrenzende Lava: Gelöscht! Eis lässt sie zu Stein erstarren: Erstarrt!","A lava se espalha para uma peça vizinha após qualquer jogada que não remova lava. A Água a apaga junto com a lava encostada: Apagada! O Gelo a transforma em pedra: Congelado!"],
["Stone (1 to 3 layers) blocks its cell. Air takes two layers: Erode!","La piedra (1 a 3 capas) bloquea su casilla. El Aire quita dos capas: ¡Erosión!","La pierre (1 à 3 couches) bloque sa case. L'Air retire deux couches : Érosion !","Stein (1 bis 3 Schichten) blockiert sein Feld. Luft nimmt zwei Schichten: Erodiert!","A pedra (1 a 3 camadas) bloqueia a casa. O Ar tira duas camadas: Erosão!"],
["Fog hides the piece underneath, which can't be matched. Earth clears the fog all around: Clear!","La niebla oculta la pieza de debajo, que no puede combinarse. La Tierra disipa la niebla alrededor: ¡Despejado!","Le brouillard cache la pièce dessous, qui ne peut pas être associée. La Terre dissipe le brouillard tout autour : Dissipé !","Nebel verdeckt den Stein darunter, der nicht kombiniert werden kann. Erde vertreibt den Nebel ringsum: Klar!","A névoa esconde a peça embaixo, que não pode ser combinada. A Terra dissipa a névoa ao redor: Limpo!"],
["Chains hold a piece; matching it breaks the chain. Lightning breaks every chain in its row and column: Shatter!","Las cadenas sujetan una pieza; combinarla rompe la cadena. El Rayo rompe todas las cadenas de su fila y columna: ¡Roto!","Les chaînes bloquent une pièce ; l'associer brise la chaîne. La Foudre brise toutes les chaînes de sa ligne et de sa colonne : Brisé !","Ketten halten einen Stein fest; ihn zu kombinieren sprengt die Kette. Blitz sprengt alle Ketten in seiner Zeile und Spalte: Zersprengt!","Correntes prendem uma peça; combiná-la quebra a corrente. O Raio quebra todas as correntes da linha e da coluna: Quebrado!"],
["Relics fall like pieces. Bring them down and out through the glowing exits at the bottom.","Las reliquias caen como piezas. Bájalas y sácalas por las salidas brillantes de abajo.","Les reliques tombent comme des pièces. Faites-les descendre et sortir par les sorties lumineuses en bas.","Relikte fallen wie Steine. Bring sie nach unten und durch die leuchtenden Ausgänge hinaus.","As relíquias caem como peças. Traga-as para baixo e para fora pelas saídas brilhantes."],
["Specials damage every obstacle in their area by one layer.","Los especiales quitan una capa a cada obstáculo de su área.","Les spéciales retirent une couche à chaque obstacle de leur zone.","Spezialsteine nehmen jedem Hindernis in ihrem Bereich eine Schicht.","Os especiais tiram uma camada de cada obstáculo na sua área."],
["Fair boards","Tableros justos","Plateaux équitables","Faire Bretter","Tabuleiros justos"],
["No lives, no paywalls, no boosters. A board never starts with a match and always has a swap. If no swap is left, it reshuffles for free (not an assist, no move used). New pieces come from a seeded stream for each column, so the same moves always give the same result: levels can be learned.","Sin vidas, sin muros de pago, sin potenciadores. Un tablero nunca empieza con una combinación y siempre tiene un intercambio. Si no queda ninguno, se baraja gratis (no es una ayuda y no gasta movimiento). Las piezas nuevas salen de una secuencia fija por columna, así que los mismos movimientos dan siempre el mismo resultado: los niveles se pueden aprender.","Pas de vies, pas de paiement, pas de bonus. Un plateau ne commence jamais par une association et a toujours un échange possible. Sinon, il est mélangé gratuitement (pas une aide, aucun coup utilisé). Les nouvelles pièces viennent d'une suite fixe pour chaque colonne : les mêmes coups donnent toujours le même résultat, les niveaux s'apprennent.","Keine Leben, keine Bezahlschranken, keine Booster. Ein Brett beginnt nie mit einem Treffer und hat immer einen Tauschzug. Gibt es keinen mehr, wird kostenlos neu gemischt (keine Hilfe, kein Zug). Neue Steine kommen aus einer festen Folge pro Spalte, also ergeben dieselben Züge immer dasselbe: Levels lassen sich lernen.","Sem vidas, sem paywall, sem boosters. Um tabuleiro nunca começa com combinação e sempre tem uma troca. Se não houver troca, ele é embaralhado de graça (não é ajuda, não gasta jogada). As peças novas vêm de uma sequência fixa por coluna, então as mesmas jogadas sempre dão o mesmo resultado: os níveis podem ser aprendidos."],
["Campaign and Daily: ★ meet the goal ★ with moves to spare ★ no assists (no hints). Classic: ★ bronze ★ silver ★ bronze with no hints. When you meet a goal, every move left becomes a Surge in the Overflow, for bonus score.","Campaña y Diario: ★ cumple el objetivo ★ con movimientos de sobra ★ sin ayudas (sin pistas). Clásico: ★ bronce ★ plata ★ bronce sin pistas. Al cumplir un objetivo, cada movimiento restante se vuelve un Surge en el Desborde, con puntos extra.","Campagne et Quotidien : ★ atteindre l'objectif ★ avec des coups d'avance ★ sans aide (sans indice). Classique : ★ bronze ★ argent ★ bronze sans indice. Quand l'objectif est atteint, chaque coup restant devient un Surge dans le Débordement, pour des points en plus.","Kampagne und Tagesspiel: ★ Ziel erfüllen ★ mit übrigen Zügen ★ ohne Hilfen (keine Tipps). Klassisch: ★ Bronze ★ Silber ★ Bronze ohne Tipps. Ist das Ziel erfüllt, wird jeder übrige Zug im Überfluss zu einem Surge, für Bonuspunkte.","Campanha e Diário: ★ cumprir o objetivo ★ com jogadas de sobra ★ sem ajudas (sem dicas). Clássico: ★ bronze ★ prata ★ bronze sem dicas. Ao cumprir um objetivo, cada jogada restante vira um Surge no Transbordo, com pontos extras."],
["Classic: Moves (30 moves), Timed (2:00) or Zen (endless). Campaign: Origins, Stormfront and Frostfall, 15 levels each. Daily: the same level for everyone, one scored attempt.","Clásico: Movimientos (30), Contrarreloj (2:00) o Zen (sin fin). Campaña: Origins, Stormfront y Frostfall, 15 niveles cada una. Diario: el mismo nivel para todos, un intento puntuado.","Classique : Coups (30), Chrono (2:00) ou Zen (sans fin). Campagne : Origins, Stormfront et Frostfall, 15 niveaux chacune. Quotidien : le même niveau pour tous, une tentative notée.","Klassisch: Züge (30), Auf Zeit (2:00) oder Zen (endlos). Kampagne: Origins, Stormfront und Frostfall mit je 15 Levels. Tagesspiel: dasselbe Level für alle, ein gewerteter Versuch.","Clássico: Jogadas (30), Cronometrado (2:00) ou Zen (sem fim). Campanha: Origins, Stormfront e Frostfall, 15 níveis cada. Diário: o mesmo nível para todos, uma tentativa valendo."],
["Arrows move a cursor; Space picks a piece, then an arrow swaps it. H shows a hint, P or Esc pauses.","Las flechas mueven un cursor; Espacio elige una pieza y una flecha la intercambia. H muestra una pista, P o Esc pausa.","Les flèches déplacent un curseur ; Espace choisit une pièce, puis une flèche l'échange. H affiche un indice, P ou Échap met en pause.","Pfeiltasten bewegen einen Cursor; Leertaste wählt einen Stein, dann tauscht ihn eine Pfeiltaste. H zeigt einen Tipp, P oder Esc pausiert.","As setas movem um cursor; Espaço escolhe uma peça e uma seta a troca. H mostra uma dica, P ou Esc pausa."],
// what's new
["First playable demo: an elemental match-3 with no lives, no paywalls and no boosters.","Primera demo jugable: un match-3 elemental sin vidas, sin muros de pago y sin potenciadores.","Première démo jouable : un match-3 élémentaire sans vies, sans paiement et sans bonus.","Erste spielbare Demo: ein elementares Match-3 ohne Leben, Bezahlschranken und Booster.","Primeira demo jogável: um match-3 elemental sem vidas, sem paywall e sem boosters."],
["Fire, Water, Earth and Air, plus Lightning and Ice: the number of elements is the difficulty.","Fuego, Agua, Tierra y Aire, más Rayo y Hielo: el número de elementos es la dificultad.","Feu, Eau, Terre et Air, plus Foudre et Glace : le nombre d'éléments fait la difficulté.","Feuer, Wasser, Erde und Luft, dazu Blitz und Eis: Die Zahl der Elemente ist die Schwierigkeit.","Fogo, Água, Terra e Ar, mais Raio e Gelo: o número de elementos é a dificuldade."],
["Surge, Burst, Wisp and Prism specials, seven combos, and elemental reactions with Frost, Lava, Stone, Fog and Chains.","Especiales Surge, Burst, Wisp y Prism, siete combos y reacciones elementales con escarcha, lava, piedra, niebla y cadenas.","Spéciales Surge, Burst, Wisp et Prism, sept combos et réactions élémentaires avec givre, lave, pierre, brouillard et chaînes.","Spezialsteine Surge, Burst, Wisp und Prism, sieben Kombos und Element-Reaktionen mit Frost, Lava, Stein, Nebel und Ketten.","Especiais Surge, Burst, Wisp e Prism, sete combos e reações elementais com geada, lava, pedra, névoa e correntes."],
["Classic (Moves, Timed and Zen), three campaigns of 15 levels graded by a bot, and a Daily with difficulty by weekday.","Clásico (Movimientos, Contrarreloj y Zen), tres campañas de 15 niveles calibrados por un bot y un Diario con dificultad según el día.","Classique (Coups, Chrono et Zen), trois campagnes de 15 niveaux calibrés par un bot, et un Quotidien dont la difficulté dépend du jour.","Klassisch (Züge, Auf Zeit und Zen), drei Kampagnen mit je 15 von einem Bot bewerteten Levels und ein Tagesspiel mit Schwierigkeit nach Wochentag.","Clássico (Jogadas, Cronometrado e Zen), três campanhas de 15 níveis calibrados por um bot e um Diário com dificuldade pelo dia da semana."],
["Fair boards: no dead boards, free automatic reshuffles, and seeded refills, so the same moves always give the same result.","Tableros justos: sin tableros bloqueados, barajados automáticos gratis y reposición fija, así que los mismos movimientos dan siempre el mismo resultado.","Plateaux équitables : jamais bloqués, mélanges automatiques gratuits et remplissage fixe, donc les mêmes coups donnent toujours le même résultat.","Faire Bretter: nie festgefahren, kostenloses automatisches Mischen und feste Nachfüllung, also ergeben dieselben Züge immer dasselbe.","Tabuleiros justos: nunca travados, embaralhamento automático grátis e reposição fixa, então as mesmas jogadas sempre dão o mesmo resultado."],
["Original music: Kindling, Stillwater and Highwind, plus Sweep's Daylight.","Música original: Kindling, Stillwater y Highwind, más Daylight de Sweep.","Musique originale : Kindling, Stillwater et Highwind, plus Daylight de Sweep.","Originalmusik: Kindling, Stillwater und Highwind, dazu Daylight aus Sweep.","Música original: Kindling, Stillwater e Highwind, mais Daylight do Sweep."]);

// Quintessence: the campaign level tips. Rows: [English, Español, Français, Deutsch, Português (Brasil)]. Machine-assisted.
I18N_ROWS.push(
["Swap two neighbouring pieces to line up 3 or more. Line up 4 to make a Surge: it clears its whole row or column.","Intercambia dos piezas vecinas para alinear 3 o más. Alinea 4 para crear un Surge: elimina toda su fila o columna.","Échangez deux pièces voisines pour en aligner 3 ou plus. Alignez-en 4 pour créer un Surge : il élimine toute sa ligne ou colonne.","Tausche zwei benachbarte Steine, um 3 oder mehr in eine Reihe zu bringen. Mit 4 entsteht ein Surge: Er räumt seine ganze Zeile oder Spalte ab.","Troque duas peças vizinhas para alinhar 3 ou mais. Alinhe 4 para criar um Surge: ele remove a linha ou coluna inteira."],
["Match in an L or T shape to make a Burst. It clears the pieces around it, then goes off once more.","Combina en forma de L o T para crear un Burst. Elimina las piezas a su alrededor y luego se activa otra vez.","Associez en L ou en T pour créer un Burst. Il élimine les pièces autour, puis se déclenche encore une fois.","Kombiniere in L- oder T-Form für einen Burst. Er räumt die Steine um sich ab und zündet dann noch einmal.","Combine em L ou T para criar um Burst. Ele remove as peças ao redor e depois explode mais uma vez."],
["A 2×2 square makes a Wisp, which flies to a useful spot. Five in a line makes a Prism: swap it with a piece to clear that whole element.","Un cuadrado de 2×2 crea un Wisp, que vuela a un sitio útil. Cinco en línea crean un Prism: intercámbialo con una pieza para eliminar todo ese elemento.","Un carré 2×2 crée un Wisp, qui s'envole vers un endroit utile. Cinq alignés créent un Prism : échangez-le avec une pièce pour éliminer tout cet élément.","Ein 2×2-Quadrat erzeugt einen Wisp, der an eine nützliche Stelle fliegt. Fünf in einer Reihe ergeben ein Prism: Tausche es mit einem Stein, um dieses ganze Element abzuräumen.","Um quadrado 2×2 cria um Wisp, que voa para um lugar útil. Cinco em linha criam um Prism: troque-o com uma peça para remover todo aquele elemento."],
["A shaped board. Pieces fall within their own column, and new ones enter at the top of each column.","Un tablero con forma. Las piezas caen dentro de su columna y las nuevas entran por arriba de cada columna.","Un plateau en forme. Les pièces tombent dans leur colonne, et les nouvelles arrivent en haut de chaque colonne.","Ein geformtes Brett. Steine fallen in ihrer eigenen Spalte, neue kommen oben in jede Spalte.","Um tabuleiro com forma. As peças caem na própria coluna e as novas entram pelo topo de cada coluna."],
["Frost holds a piece in place. Match next to it, or match the frozen piece itself. A Fire match thaws every layer at once.","La escarcha sujeta una pieza. Combina a su lado o combina la propia pieza congelada. Una combinación de Fuego derrite todas las capas a la vez.","Le givre bloque une pièce. Associez à côté, ou associez la pièce gelée elle-même. Une association de Feu fait fondre toutes les couches d'un coup.","Frost hält einen Stein fest. Kombiniere daneben oder den gefrorenen Stein selbst. Ein Feuer-Treffer taut alle Schichten auf einmal.","A geada prende uma peça. Combine ao lado ou combine a própria peça congelada. Uma combinação de Fogo derrete todas as camadas de uma vez."],
["Stone blocks a cell. Matches next to it chip a layer off; an Air match erodes two.","La piedra bloquea una casilla. Las combinaciones a su lado le quitan una capa; una de Aire quita dos.","La pierre bloque une case. Les associations à côté lui retirent une couche ; une association d'Air en retire deux.","Stein blockiert ein Feld. Treffer daneben schlagen eine Schicht ab; ein Luft-Treffer zwei.","A pedra bloqueia uma casa. Combinações ao lado tiram uma camada; uma de Ar tira duas."],
["Against the clock. The clock stops while cascades play out, and a cascade of 5 or more adds 2 seconds.","Contrarreloj. El reloj se detiene durante las cascadas, y una cascada de 5 o más suma 2 segundos.","Contre la montre. Le chrono s'arrête pendant les cascades, et une cascade de 5 ou plus ajoute 2 secondes.","Gegen die Uhr. Die Uhr steht, während Kaskaden ablaufen, und eine Kaskade von 5 oder mehr bringt 2 Sekunden.","Contra o relógio. O relógio para durante as cascatas, e uma cascata de 5 ou mais soma 2 segundos."],
["Frost on a diamond. Surges reach right across the board.","Escarcha en un diamante. Los Surges cruzan todo el tablero.","Du givre sur un losange. Les Surges traversent tout le plateau.","Frost auf einer Raute. Surges reichen quer über das ganze Brett.","Geada num diamante. Os Surges atravessam o tabuleiro inteiro."],
["Relics fall like pieces. Clear the pieces under them to bring them down and out through the bottom.","Las reliquias caen como piezas. Elimina las piezas de debajo para bajarlas y sacarlas por abajo.","Les reliques tombent comme des pièces. Éliminez les pièces dessous pour les faire descendre et sortir par le bas.","Relikte fallen wie Steine. Räume die Steine darunter ab, um sie nach unten und hinaus zu bringen.","As relíquias caem como peças. Remova as peças embaixo para trazê-las para baixo e para fora."],
["A puzzle: no new pieces fall. Clear all the Frost. It can be done in 3 moves; do it in 3 for the second star.","Un puzle: no caen piezas nuevas. Elimina toda la escarcha. Se puede hacer en 3 movimientos; hazlo en 3 para la segunda estrella.","Une énigme : aucune nouvelle pièce ne tombe. Faites fondre tout le givre. C'est faisable en 3 coups ; faites-le en 3 pour la deuxième étoile.","Ein Rätsel: Es fallen keine neuen Steine. Entferne den ganzen Frost. Es geht in 3 Zügen; schaffe es in 3 für den zweiten Stern.","Um quebra-cabeça: não caem peças novas. Remova toda a geada. Dá para fazer em 3 jogadas; faça em 3 para a segunda estrela."],
["Two goals. Fire for the frost, Air for the stone.","Dos objetivos. Fuego para la escarcha, Aire para la piedra.","Deux objectifs. Le Feu pour le givre, l'Air pour la pierre.","Zwei Ziele. Feuer für den Frost, Luft für den Stein.","Dois objetivos. Fogo para a geada, Ar para a pedra."],
["Relics leave wherever a column ends at the edge of the board: look for the glowing exits.","Las reliquias salen donde una columna termina en el borde del tablero: busca las salidas brillantes.","Les reliques sortent là où une colonne s'arrête au bord du plateau : cherchez les sorties lumineuses.","Relikte verlassen das Brett, wo eine Spalte am Rand endet: Achte auf die leuchtenden Ausgänge.","As relíquias saem onde uma coluna termina na borda do tabuleiro: procure as saídas brilhantes."],
["Double frost needs two hits, or one Fire match.","La escarcha doble necesita dos golpes, o una combinación de Fuego.","Le givre double demande deux coups, ou une association de Feu.","Doppelter Frost braucht zwei Treffer oder einen Feuer-Treffer.","A geada dupla precisa de dois golpes, ou uma combinação de Fogo."],
["Fewer moves than usual. Make every swap count.","Menos movimientos de lo normal. Que cada intercambio cuente.","Moins de coups que d'habitude. Chaque échange compte.","Weniger Züge als sonst. Jeder Tausch zählt.","Menos jogadas do que o normal. Faça cada troca valer."],
["The Origins finale: frost, stone and relics on a large board.","El final de Origins: escarcha, piedra y reliquias en un tablero grande.","La finale d'Origins : givre, pierre et reliques sur un grand plateau.","Das Origins-Finale: Frost, Stein und Relikte auf einem großen Brett.","O final de Origins: geada, pedra e relíquias num tabuleiro grande."],
["Lightning joins the board. Five elements mean fewer free matches: look for specials.","El Rayo llega al tablero. Cinco elementos significan menos combinaciones gratis: busca especiales.","La Foudre rejoint le plateau. Cinq éléments, moins d'associations faciles : cherchez les spéciales.","Blitz kommt aufs Brett. Fünf Elemente bedeuten weniger freie Treffer: Achte auf Spezialsteine.","O Raio entra no tabuleiro. Cinco elementos significam menos combinações fáceis: procure especiais."],
["Collect Lightning. Specials count every piece they clear.","Recoge Rayos. Los especiales cuentan cada pieza que eliminan.","Collectez la Foudre. Les spéciales comptent chaque pièce qu'elles éliminent.","Sammle Blitze. Spezialsteine zählen jeden Stein, den sie abräumen.","Colete Raios. Os especiais contam cada peça que removem."],
["Swap two specials together for a combo: two Surges clear a cross, a Surge and a Burst clear three rows and three columns.","Intercambia dos especiales para un combo: dos Surges eliminan una cruz; un Surge y un Burst, tres filas y tres columnas.","Échangez deux spéciales pour un combo : deux Surges éliminent une croix, un Surge et un Burst trois lignes et trois colonnes.","Tausche zwei Spezialsteine für eine Kombo: Zwei Surges räumen ein Kreuz ab, ein Surge und ein Burst drei Zeilen und drei Spalten.","Troque dois especiais para um combo: dois Surges removem uma cruz; um Surge e um Burst, três linhas e três colunas."],
["A cross-shaped board. Surges along the arms reach a long way.","Un tablero en forma de cruz. Los Surges a lo largo de los brazos llegan muy lejos.","Un plateau en croix. Les Surges le long des bras portent loin.","Ein kreuzförmiges Brett. Surges entlang der Arme reichen weit.","Um tabuleiro em cruz. Os Surges ao longo dos braços vão longe."],
["Lava spreads into a neighbouring piece after any move that clears no lava. A Water match quenches lava and all the lava touching it.","La lava se extiende a una pieza vecina tras cualquier movimiento que no elimine lava. Una combinación de Agua apaga la lava y toda la que la toca.","La lave s'étend à une pièce voisine après tout coup qui n'en élimine pas. Une association d'Eau éteint la lave et toute celle qui la touche.","Lava breitet sich nach jedem Zug ohne Lava-Treffer in einen Nachbarstein aus. Ein Wasser-Treffer löscht Lava und alle angrenzende Lava.","A lava se espalha para uma peça vizinha após qualquer jogada que não remova lava. Uma combinação de Água apaga a lava e toda a que encosta nela."],
["Chains hold pieces in place. Matching a chained piece breaks its chain; a Lightning match breaks every chain in its row and column.","Las cadenas sujetan piezas. Combinar una pieza encadenada rompe su cadena; una combinación de Rayo rompe todas las de su fila y columna.","Les chaînes bloquent des pièces. Associer une pièce enchaînée brise sa chaîne ; une association de Foudre brise toutes celles de sa ligne et de sa colonne.","Ketten halten Steine fest. Einen angeketteten Stein zu kombinieren sprengt seine Kette; ein Blitz-Treffer sprengt alle Ketten in Zeile und Spalte.","Correntes prendem peças. Combinar uma peça acorrentada quebra a corrente; uma combinação de Raio quebra todas da linha e da coluna."],
["This lava spreads after every move, even when you clear some. Stay ahead of it.","Esta lava se extiende tras cada movimiento, aunque elimines parte. Adelántate a ella.","Cette lave s'étend après chaque coup, même si vous en éliminez. Gardez une longueur d'avance.","Diese Lava breitet sich nach jedem Zug aus, auch wenn du welche entfernst. Bleib ihr voraus.","Esta lava se espalha após toda jogada, mesmo quando você remove um pouco. Fique à frente dela."],
["The board narrows in the middle. Wisps can fly to frost you can't reach.","El tablero se estrecha en el centro. Los Wisps pueden volar hasta la escarcha que no alcanzas.","Le plateau se resserre au milieu. Les Wisps peuvent atteindre le givre hors de portée.","Das Brett wird in der Mitte schmal. Wisps fliegen zu Frost, den du nicht erreichst.","O tabuleiro afunila no meio. Os Wisps voam até a geada que você não alcança."],
["Keep the lava in check while you build your score.","Mantén la lava a raya mientras sumas puntos.","Contenez la lave tout en faisant monter votre score.","Halte die Lava in Schach, während du Punkte sammelst.","Mantenha a lava sob controle enquanto soma pontos."],
["Chains guard the way to the frost. Lightning clears a path.","Las cadenas protegen el camino a la escarcha. El Rayo abre paso.","Des chaînes gardent l'accès au givre. La Foudre ouvre la voie.","Ketten versperren den Weg zum Frost. Blitz räumt einen Pfad frei.","Correntes guardam o caminho até a geada. O Raio abre passagem."],
["Two islands joined by a bridge. Each has its own exits.","Dos islas unidas por un puente. Cada una tiene sus salidas.","Deux îles reliées par un pont. Chacune a ses sorties.","Zwei Inseln, verbunden durch eine Brücke. Jede hat ihre eigenen Ausgänge.","Duas ilhas ligadas por uma ponte. Cada uma tem suas saídas."],
["Bring the relics down before the lava closes their path.","Baja las reliquias antes de que la lava cierre su camino.","Faites descendre les reliques avant que la lave ne leur barre la route.","Bring die Relikte nach unten, bevor die Lava ihnen den Weg versperrt.","Traga as relíquias para baixo antes que a lava feche o caminho."],
["Only specials and combos score toward the goal here: normal matches count for nothing.","Aquí solo los especiales y combos puntúan para el objetivo: las combinaciones normales no cuentan.","Ici, seules les spéciales et les combos comptent pour l'objectif : les associations normales ne valent rien.","Hier zählen nur Spezialsteine und Kombos für das Ziel: Normale Treffer zählen nichts.","Aqui só especiais e combos contam para o objetivo: combinações normais não valem nada."],
["The Stormfront finale: every obstacle so far, two goals.","El final de Stormfront: todos los obstáculos hasta ahora, dos objetivos.","La finale de Stormfront : tous les obstacles vus jusqu'ici, deux objectifs.","Das Stormfront-Finale: alle bisherigen Hindernisse, zwei Ziele.","O final de Stormfront: todos os obstáculos até aqui, dois objetivos."],
["Ice joins the board: six elements. Free matches are rarer, so specials matter more.","El Hielo llega al tablero: seis elementos. Las combinaciones gratis son más raras, así que los especiales importan más.","La Glace rejoint le plateau : six éléments. Les associations faciles sont plus rares, les spéciales comptent davantage.","Eis kommt aufs Brett: sechs Elemente. Freie Treffer sind seltener, Spezialsteine zählen mehr.","O Gelo entra no tabuleiro: seis elementos. Combinações fáceis são mais raras, então os especiais importam mais."],
["Collect Ice. A Prism swapped with an Ice piece clears every one on the board.","Recoge Hielo. Un Prism intercambiado con una pieza de Hielo las elimina todas del tablero.","Collectez la Glace. Un Prism échangé avec une pièce de Glace les élimine toutes.","Sammle Eis. Ein Prism, getauscht mit einem Eis-Stein, räumt alle vom Brett.","Colete Gelo. Um Prism trocado com uma peça de Gelo remove todas do tabuleiro."],
["A lot of frost. Fire thaws it in one go.","Mucha escarcha. El Fuego la derrite de una vez.","Beaucoup de givre. Le Feu le fait fondre d'un coup.","Viel Frost. Feuer taut ihn auf einen Schlag.","Muita geada. O Fogo derrete de uma vez."],
["A large heart. Watch where each column ends.","Un corazón grande. Fíjate dónde termina cada columna.","Un grand cœur. Regardez où s'arrête chaque colonne.","Ein großes Herz. Achte darauf, wo jede Spalte endet.","Um coração grande. Repare onde cada coluna termina."],
["Fog hides the piece underneath, and fogged pieces can't match. Match next to fog to clear it; an Earth match clears the fog all around.","La niebla oculta la pieza de debajo, y las piezas con niebla no pueden combinarse. Combina junto a la niebla para disiparla; una de Tierra la disipa alrededor.","Le brouillard cache la pièce dessous, et les pièces dans le brouillard ne s'associent pas. Associez à côté pour le dissiper ; une association de Terre le dissipe tout autour.","Nebel verdeckt den Stein darunter, und vernebelte Steine können nicht kombinieren. Kombiniere daneben, um ihn zu vertreiben; ein Erde-Treffer vertreibt den Nebel ringsum.","A névoa esconde a peça embaixo, e peças com névoa não combinam. Combine ao lado para dissipá-la; uma combinação de Terra dissipa a névoa ao redor."],
["An Ice match next to lava freezes it into stone, which stops it spreading. Water still quenches it.","Una combinación de Hielo junto a la lava la convierte en piedra, que deja de extenderse. El Agua aún la apaga.","Une association de Glace à côté de la lave la fige en pierre, qui ne s'étend plus. L'Eau l'éteint toujours.","Ein Eis-Treffer neben Lava lässt sie zu Stein erstarren, der sich nicht mehr ausbreitet. Wasser löscht sie weiterhin.","Uma combinação de Gelo ao lado da lava a transforma em pedra, que para de se espalhar. A Água ainda a apaga."],
["Against the clock again, now with six elements.","Contrarreloj otra vez, ahora con seis elementos.","Contre la montre à nouveau, avec six éléments.","Wieder gegen die Uhr, jetzt mit sechs Elementen.","Contra o relógio de novo, agora com seis elementos."],
["Frost around a ring. Bursts and Wisps reach where lines can't.","Escarcha alrededor de un anillo. Los Bursts y Wisps llegan donde las líneas no.","Du givre autour d'un anneau. Bursts et Wisps atteignent ce que les lignes ne peuvent pas.","Frost rund um einen Ring. Bursts und Wisps erreichen, was Reihen nicht schaffen.","Geada ao redor de um anel. Bursts e Wisps chegam onde as linhas não chegam."],
["Fog over chains. Earth for the fog, Lightning for the chains.","Niebla sobre cadenas. Tierra para la niebla, Rayo para las cadenas.","Du brouillard sur des chaînes. La Terre pour le brouillard, la Foudre pour les chaînes.","Nebel über Ketten. Erde für den Nebel, Blitz für die Ketten.","Névoa sobre correntes. Terra para a névoa, Raio para as correntes."],
["Thick frost and thick stone. Fire and Air are your friends.","Escarcha gruesa y piedra gruesa. El Fuego y el Aire son tus aliados.","Givre épais et pierre épaisse. Le Feu et l'Air sont vos alliés.","Dicker Frost und dicker Stein. Feuer und Luft sind deine Freunde.","Geada grossa e pedra grossa. Fogo e Ar são seus aliados."],
["Two large islands and their relics.","Dos islas grandes y sus reliquias.","Deux grandes îles et leurs reliques.","Zwei große Inseln und ihre Relikte.","Duas ilhas grandes e suas relíquias."],
["Fog, lava and chains together. Use each reaction where it counts.","Niebla, lava y cadenas juntas. Usa cada reacción donde cuente.","Brouillard, lave et chaînes ensemble. Utilisez chaque réaction là où elle compte.","Nebel, Lava und Ketten zusammen. Setze jede Reaktion gezielt ein.","Névoa, lava e correntes juntas. Use cada reação onde ela conta."],
["Fewer moves than usual, and fog in the way.","Menos movimientos de lo normal, y niebla en medio.","Moins de coups que d'habitude, et du brouillard en travers.","Weniger Züge als sonst, und Nebel im Weg.","Menos jogadas do que o normal, e névoa no caminho."],
["The finale. Every element, every obstacle, two goals.","El final. Todos los elementos, todos los obstáculos, dos objetivos.","La finale. Tous les éléments, tous les obstacles, deux objectifs.","Das Finale. Alle Elemente, alle Hindernisse, zwei Ziele.","O final. Todos os elementos, todos os obstáculos, dois objetivos."]);

const CHANGES=[{v:'0.1.0',d:'2026-11-26',n:['First playable demo: an elemental match-3 with no lives, no paywalls and no boosters.','Fire, Water, Earth and Air, plus Lightning and Ice: the number of elements is the difficulty.','Surge, Burst, Wisp and Prism specials, seven combos, and elemental reactions with Frost, Lava, Stone, Fog and Chains.','Classic (Moves, Timed and Zen), three campaigns of 15 levels graded by a bot, and a Daily with difficulty by weekday.','Fair boards: no dead boards, free automatic reshuffles, and seeded refills, so the same moves always give the same result.','Original music: Kindling, Stillwater and Highwind, plus Sweep\'s Daylight.']}];

  tTimer=setTimeout(()=>{ el.classList.remove('on'); tTimer=setTimeout(nextToast,420); },2400); }

const AU={};

  AU.mus=c.createGain(); AU.mus.gain.value=0;

  AU.mus.connect(AU.musLP); AU.musLP.connect(AU.master);
