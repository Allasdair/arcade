<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f1">
<title>Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arcade"><meta name="apple-mobile-web-app-status-bar-style" content="default">

<script src="avatars.js"></script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
:root{--bg:#f4f4f1;--panel:#fff;--ink:#1c1c1e;--sub:#8e8e93;--accent:#1c1c1e;--accentInk:#fff;--line:rgba(0,0,0,.08);--good:#2f9e6b}
.dark{--bg:#111214;--panel:#1c1d22;--ink:#f2f2f4;--sub:#8d9099;--accent:#f2f2f4;--accentInk:#111214;--line:rgba(255,255,255,.09);--good:#4cc38a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:var(--ink);-webkit-user-select:text;user-select:text}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.scroll{overflow-y:auto;flex:1;padding:18px 18px 40px;max-width:560px;width:100%;margin:0 auto}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:10px 0 18px}
.brand h1{font-size:42px;font-weight:800;letter-spacing:-.045em;line-height:1}
.brand p{color:var(--sub);font-size:14px;margin-top:8px;line-height:1.35}
.acts{display:flex;gap:8px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px 0;max-width:560px;width:100%;margin:0 auto}
.topbar h2{font-size:24px;font-weight:800;letter-spacing:-.03em}
.topbar .c{margin-left:auto;color:var(--sub);font-weight:700;font-variant-numeric:tabular-nums}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:24px 4px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px 16px;display:flex;align-items:center;gap:14px;width:100%;margin-bottom:10px;transition:transform .12s}
button.card:active{transform:scale(.98)}
.card .t{font-weight:700;font-size:17px;letter-spacing:-.01em}
.card .s{color:var(--sub);font-size:13px;margin-top:2px;line-height:1.3}
.grow{flex:1;min-width:0}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
/* identity card */
.idc .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idc .chev{color:var(--sub)}
.av{flex:none;border-radius:16px;overflow:hidden;display:block}
.av svg{display:block;width:100%;height:100%}
/* games */
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:172px;transition:transform .12s;position:relative;cursor:pointer}
.game:active{transform:scale(.97)}
.game .art{height:64px;border-radius:14px;background:var(--bg);display:grid;place-items:center;overflow:hidden}
.game .nm{font-weight:800;font-size:18px;letter-spacing:-.02em;padding-right:26px}
.game .ds{color:var(--sub);font-size:12.5px;line-height:1.3;margin-top:-6px}
.game .ft{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.game .ft .lv{background:var(--accent);color:var(--accentInk);border-radius:8px;padding:3px 7px}
.game .ft .bar{flex:1;margin:0;height:6px}
.game .fav{position:absolute;right:8px;top:8px;width:34px;height:34px;display:grid;place-items:center;color:var(--sub);border-radius:10px}
.game .fav.on{color:var(--accent)}
.game .fav svg{width:19px;height:19px}
.game .fav.on svg{fill:currentColor}
.tag{position:absolute;left:10px;top:10px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:7px;background:var(--accent);color:var(--accentInk)}
.soon{display:flex;gap:10px;align-items:center;margin-top:16px;color:var(--sub);font-size:13px;font-weight:600}
.soon .chip{opacity:.8}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--ink)}
/* profile */
.phead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin:6px 0 18px}
.phead .nmr{display:flex;align-items:center;gap:6px;font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.phead .s{color:var(--sub);font-size:13px}
.linkbtn{color:var(--sub);font-weight:700;font-size:13px;padding:6px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.tile b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile span{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.prow{display:flex;align-items:center;gap:12px;padding:11px 0;width:100%}
.prow+.prow{border-top:1px solid var(--line)}
.prow .mini{width:44px;height:36px;border-radius:10px;background:var(--bg);display:grid;place-items:center;overflow:hidden;flex:none}
.prow .mini svg{transform:scale(.55)}
.prow .n{font-weight:700;font-size:15px}
.prow .d{color:var(--sub);font-size:12.5px;line-height:1.3}
.prow .bar{height:5px;margin:5px 0 0}
.ms{display:flex;align-items:center;gap:12px;padding:10px 0}
.ms+.ms{border-top:1px solid var(--line)}
.ms .sw2{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff}
.ms .sw2 svg{width:16px;height:16px}
.ms.off .sw2{opacity:.35}
/* pickers */
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avgrid button{border:2px solid transparent;border-radius:18px;padding:4px;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--sub)}
.avgrid button.on{border-color:var(--accent)}
.avgrid button.lock .av{opacity:.3;filter:grayscale(1)}
.avgrid .lk{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:7px;background:var(--panel);display:grid;place-items:center;color:var(--sub)}
.avgrid .lk svg{width:13px;height:13px}
.thgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.thgrid button{border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.thgrid button.on{border-color:var(--accent)}
.thgrid button.lock{opacity:.5}
.thgrid .dot{width:22px;height:22px;border-radius:50%;flex:none}
.thgrid small{display:block;font-weight:600;font-size:11.5px;color:var(--sub)}
/* settings etc. */
.sw{width:46px;height:28px;border-radius:99px;background:var(--bg);position:relative;transition:background .2s;flex:none}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--sub);transition:left .2s,background .2s}
.sw.on{background:var(--accent)}.sw.on::after{left:22px;background:var(--accentInk)}
.set{flex-direction:column;align-items:stretch;gap:0;padding:8px 16px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;width:100%;font-weight:600;font-size:15px}
.srow .v{color:var(--sub);font-weight:600;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.slabel{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:14px 2px 2px}
.slabel:first-child{margin-top:6px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;flex:none}
.seg button{padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);text-align:center}
.label .seg{letter-spacing:0;text-transform:none}
.label .seg button{padding:5px 10px;font-size:12px}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.note{color:var(--sub);font-size:12.5px;line-height:1.4;margin:6px 4px 0}
.ach{flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden}
.ach .hd{display:flex;align-items:center;gap:14px;padding:15px 16px;width:100%}
.ach .hd .chev{transition:transform .2s;color:var(--sub)}
.ach.open .hd .chev{transform:rotate(90deg)}
.ach .list{display:none;border-top:1px solid var(--line);padding:4px 16px 8px}
.ach.open .list{display:block}
.arow{display:flex;gap:12px;align-items:center;padding:9px 0}
.arow+.arow{border-top:1px solid var(--line)}
.arow .dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--bg);color:var(--sub)}
.arow.got .dot{background:var(--accent);color:var(--accentInk)}
.arow .dot svg{width:16px;height:16px}
.arow .n{font-weight:700;font-size:14.5px}
.arow:not(.got) .n{color:var(--sub)}
.arow .d{color:var(--sub);font-size:12.5px;line-height:1.3}
.primary{background:var(--accent);color:var(--accentInk);border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;width:100%;text-align:center;transition:transform .12s}
.primary:active{transform:scale(.98)}
.ghost{border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;width:100%;text-align:center;color:var(--sub)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 20px calc(18px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .25s;max-height:88vh;overflow-y:auto}
.ov.on .sheet{transform:none}
.sheet h2{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
.sheet .sub{color:var(--sub);font-size:14px;line-height:1.4;margin-bottom:14px}
.sheet .btns{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.sheet ul{margin:0 0 12px 18px;font-size:14px;line-height:1.45}
.sheet h3{font-size:14px;font-weight:800;margin:10px 0 6px}
.field{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 14px;font-size:17px;font-weight:600;outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;height:96px;resize:none;word-break:break-all}
.pick{display:flex;flex-direction:column;gap:6px}
.pick button{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.pick button.on{border-color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;font-size:14px;font-weight:600}
.kv+.kv{border-top:1px solid var(--line)}
.kv span{color:var(--sub);text-align:right}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,calc(-100% - env(safe-area-inset-top) - 24px));opacity:0;background:var(--accent);color:var(--accentInk);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:40;transition:transform .3s,opacity .3s;max-width:calc(100% - 32px);text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.nomotion *{transition:none!important}
</style>
</head><body>

<section id="home" class="screen on"><div class="scroll">
  <div class="brand"><div><h1>Arcade</h1><p data-t>Ad-free games. Nothing to buy, nothing tracked.</p></div>
    <div class="acts"><button class="iconbtn" data-go="ach" aria-label="Achievements" id="icoA"></button><button class="iconbtn" data-go="set" aria-label="Settings" id="icoS"></button></div></div>
  <button class="card idc" id="idCard"></button>
  <div id="nudge"></div>
  <div class="label"><span data-t>Games</span><div class="seg" id="sortSeg"></div></div>
  <div class="games" id="games"></div>
  <div class="soon" id="soon"></div>
</div></section>

<section id="prof" class="screen">
  <div class="topbar"><button class="iconbtn" data-go="home" aria-label="Back"></button><h2 data-t>Profile</h2></div>
  <div class="scroll" id="profBody"></div>
</section>

<section id="ach" class="screen">
  <div class="topbar"><button class="iconbtn" data-go="home" aria-label="Back"></button><h2 data-t>Achievements</h2><span class="c" id="achCount"></span></div>
  <div class="scroll" id="achBody"></div>
</section>

<section id="set" class="screen">
  <div class="topbar"><button class="iconbtn" data-go="home" aria-label="Back"></button><h2 data-t>Settings</h2></div>
  <div class="scroll"><div class="card set" id="settings" style="margin-top:8px"></div>
    <p class="note" data-t>These settings apply to every game. Each game's own options are under Game settings.</p></div>
</section>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

nlock it.":"Juega a {0} para desbloquearlo.","Play it once to see its achievements here.":"Juégalo una vez para ver aquí sus logros.","{0} of {1}":"{0} de {1}","Highlights":"Destacados","Open {0}":"Abrir {0}","Profile":"Perfil","Username":"Nombre de usuario","Not set":"Sin definir","Look & sound":"Aspecto y sonido","Appearance":"Apariencia","Arcade theme":"Tema del Arcade","Accessibility":"Accesibilidad","Language":"Idioma","Automatic":"Automático","Game settings":"Ajustes de los juegos","Gameplay, tutorial":"Juego, tutorial","Your data":"Tus datos","Backup & restore":"Copia y restauración","All games":"Todos los juegos","Privacy":"Privacidad","Arcade":"Arcade","Install Arcade":"Instalar Arcade","Play like an app":"Juega como una app","What's new":"Novedades","About Arcade":"Acerca de Arcade","Colours for the Arcade's own screens. Arcade milestones unlock more.":"Colores para las pantallas del Arcade. Los hitos del Arcade desbloquean más.","Unlock it with the {0} milestone.":"Desbloquéalo con el hito {0}.","Change username":"Cambiar nombre de usuario","One name for every game: on challenges you send and when you join a League. It stays on this device unless you share a code.":"Un nombre para todos los juegos: en los retos que envíes y al unirte a una Liga. Se queda en este dispositivo salvo que compartas un código.","Your name":"Tu nombre","Up to 16 letters, numbers, spaces, dots, dashes or underscores. A League name already locked for this season doesn't change until the season ends.":"Hasta 16 letras, números, espacios, puntos, guiones o guiones bajos. Un nombre de Liga ya fijado para esta temporada no cambia hasta que termine.","Save":"Guardar","Continue":"Continuar","Cancel":"Cancelar","Pick a name first.":"Elige primero un nombre.","Welcome, {0}!":"¡Bienvenido, {0}!","Used by the Arcade and every game.":"Lo usan el Arcade y todos los juegos.","The Arcade and its games collect nothing. There are no ads, analytics, trackers or accounts, and the only network reque // The Arcade owns: the player's identity (username, avatar), settings shared by every game, the combined backup,
// play-time stats, Arcade milestones and themes, and the overview. Each game owns its own save, XP, levels and unlocks.
// The Arcade only ever reads a game's summary record, `arcade.summary.<id>`, which the game writes.
// Storage keys are prefixed with the game's id so nothing collides.

const $=q=>document.querySelector(q), $$=q=>[...document.querySelectorAll(q)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const REDUCED=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const defSet=()=>({appearance:'system',motion:!REDUCED,sfx:true,music:true,haptics:true,fullscreen:false,cb:false,lefty:false,lang:'auto'});
const defA=()=>({v:1,name:'',askedName:false,set:defSet(),created:Date.now(),bk:{last:0,later:0},
  avatar:'pad',theme:'classic',fav:[],sort:'recent',known:null,seenBuild:{},seenVer:null,stats:{},days:0,lastDay:'',ms:[],open:null});
const read=k=>{ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } };

// ---------- load, or migrate from an existing Sweep save ----------
let A=read(AKEY), migrated=false, fresh=!A;
if(!A){ A=defA(); const old=read('sweep.v1');
  if(old){ migrated=true; for(const k in A.set) if(k in old) A.set[k]=old[k]; if(old.name) A.name=old.name; } }
A=Object.assign(defA(),A); A.set=Object.assign(defSet(),A.set);
// Games that exist when a player first sees this version aren't "New" to them.
if(!A.known) A.known=LIVE.map(g=>g.id);
if(fresh) A.seenVer=VERSION;
const persist=()=>{ try{ localStorage.setItem(AKEY,JSON.stringify(A)); }catch(e){} };

// t(english, ...args): the English text is the key; {0}, {1} are filled in. Missing rows fall back to English.
function t(s,...a){ const d=TR[lang()]; let r=(d&&d[s])||s; a.forEach((v,i)=>{ r=r.split('{'+i+'}').join(v); }); return r; }
const plural=(n,one,many)=>t(n===1?one:many,n.toLocaleString(lang()));

function art(kind){ const a='var(--accent)', s='var(--sub)';
  if(kind==='sweep'){ const n=[['','1','',''],['1','2','⚑',''],['','2','3','1'],['','1','⚑','1']]; let c='';
    n.forEach((r,y)=>r.forEach((v,x)=>{ const X=4+x*15,Y=4+y*14, open=v!=='⚑'&&!(x===3&&y<2);
      c+=`<rect x="${X}" y="${Y}" width="13" height="12" rx="2.5" fill="${open?'var(--panel)':a}" opacity="${open?1:.85}"/>`;
      if(v&&v!=='⚑') c+=`<text x="${X+6.5}" y="${Y+9.3}" font-size="8.5" font-weight="800" text-anchor="middle" fill="${a}" font-family="Inter,sans-serif">${v}</text>`;
      if(v==='⚑') c+=`<path d="M${X+5} ${Y+9.5}V${Y+2.5}l4.5 2-4.5 2" fill="var(--accentInk)" stroke="var(--accentInk)" stroke-width="1"/>`; }));
    return `<svg viewBox="0 0 66 62" width="70" height="60">${c}</svg>`; }
  if(kind==='snake') return `<svg viewBox="0 0 70 50" width="74" height="54"><path d="M8 38h18V14h18v22h14" fill="none" stroke="${s}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="58" cy="36" r="2" fill="var(--bg)"/><circle cx="60" cy="14" r="4" fill="${s}"/></svg>`;
  if(kind==='tiles'){ const v=[['2','4','8'],['','16','32'],['','','64']]; let c='';
    v.forEach((r,y)=>r.forEach((n,x)=>{ const X=6+x*20,Y=2+y*18, on=n!=='', big=n.length>1;
      c+=`<rect x="${X}" y="${Y}" width="18" height="16" rx="3" fill="${on?a:'var(--panel)'}" opacity="${on?(0.45+n.length*.2):1}"/>`;
      if(on) c+=`<text x="${X+9}" y="${Y+11.3}" font-size="${big?7.5:9}" font-weight="800" text-anchor="middle" fill="var(--accentInk)" font-family="Inter,sans-serif">${n}</text>`; }));
    return `<svg viewBox="0 0 72 56" width="76" height="58">${c}</svg>`; }
  if(kind==='linefall'){ // a narrow well: a settled stack with one row about to clear, and a piece falling in
    const C=7, cell=7.2, X0=36-C*cell/2, Y0=4, rows=['.......','...##..','.......','.......','#..#...','##.####','#######'], on=new Set(['1,3','1,4','2,4']);
    let c=`<rect x="${X0-2}" y="${Y0-2}" width="${C*cell+4}" height="${rows.length*cell+4}" rx="3" fill="var(--panel)"/>`;
    rows.forEach((r,y)=>[...r].forEach((v,x)=>{ const fall=y<3; if(v!=='#'&&!(fall&&on.has(y+','+x))) return;
      c+=`<rect x="${X0+x*cell+.6}" y="${Y0+y*cell+.6}" width="${cell-1.2}" height="${cell-1.2}" rx="1.4" fill="${a}" opacity="${fall?1:y===6?.95:.55}"/>`; }));
    return `<svg viewBox="0 0 72 60" width="76" height="62">${c}</svg>`; }
  if(kind==='drift'){ // a ship with a thruster trail, firing at a cracked rock, with two small rocks drifting
    const rock=(cx,cy,r,o)=>{ let d=''; for(let i=0;i<9;i++){ const ang=i/9*6.283, k=r*(.78+.22*((i*7+3)%5)/4); d+=(i?'L':'M')+(cx+Math.cos(ang)*k).toFixed(1)+' '+(cy+Math.sin(ang)*k).toFixed(1); }
      return `<path d="${d}Z" fill="none" stroke="${s}" stroke-width="2" stroke-linejoin="round" opacity="${o}"/>`; };
    return `<svg viewBox="0 0 72 56" width="76" height="58">${rock(52,18,12,1)}<path d="M48 14l4 5-2 4" fill="none" stroke="${s}" stroke-width="1.3"/>${rock(60,42,5,.8)}${rock(36,8,4,.7)}
      <path d="M8 46l10-3" stroke="${s}" stroke-width="2" stroke-linecap="round" opacity=".35"/><path d="M12 49l7-2.5" stroke="${s}" stroke-width="1.5" stroke-linecap="round" opacity=".25"/>

    const T=(x,y,ch,v)=>`<rect x="${x}" y="${y}" width="13" height="13" rx="2.5" fill="${a}"/><text x="${x+6.2}" y="${y+10}" font-size="9" font-weight="800" text-anchor="middle" fill="var(--accentInk)" font-family="Inter,sans-serif">${ch}</text><text x="${x+11.2}" y="${y+11.6}" font-size="3.6" font-weight="700" text-anchor="end" fill="var(--accentInk)" font-family="Inter,sans-serif">${v}</text>`;

  if(kind==='solitaire'){ // a fanned column of cards
    const card=(x,y,r,lbl,red)=>`<g transform="rotate(${r} ${x+11} ${y+30})"><rect x="${x}" y="${y}" width="22" height="30" rx="3" fill="var(--panel)" stroke="${s}" stroke-width="1.2"/><text x="${x+4}" y="${y+10}" font-size="8" font-weight="800" fill="${red?'#c8463d':a}" font-family="Inter,sans-serif">${lbl}</text></g>`;
    return `<svg viewBox="0 0 74 58" width="76" height="60">${card(14,16,-14,'K',0)}${card(26,12,0,'Q',1)}${card(38,16,14,'A',0)}</svg>`; }
  if(kind==='mahjong'){ // stacked tiles with offset shadows
    const tile=(x,y,o,m)=>`<rect x="${x+2}" y="${y+2}" width="14" height="18" rx="2.5" fill="${s}" opacity=".35"/><rect x="${x}" y="${y}" width="14" height="18" rx="2.5" fill="var(--panel)" stroke="${s}" stroke-width="1"/>${m}`;
    const dots=(x,y,n)=>[...Array(n)].map((_,i)=>`<circle cx="${x+4+(i%2)*6}" cy="${y+5+Math.floor(i/2)*4.5}" r="1.6" fill="${a}"/>`).join('');
    const bars=(x,y)=>`<rect x="${x+4}" y="${y+4}" width="2" height="10" rx="1" fill="${a}"/><rect x="${x+8}" y="${y+4}" width="2" height="10" rx="1" fill="${a}"/>`;
    return `<svg viewBox="0 0 74 58" width="76" height="60">${tile(8,30,1,dots(8,30,4))}${tile(23,30,1,bars(23,30))}${tile(38,30,1,dots(38,30,2))}${tile(53,30,1,bars(53,30))}${tile(16,10,1,dots(16,10,6))}${tile(31,10,1,bars(31,10))}${tile(46,10,1,dots(46,10,3))}</svg>`; }
  if(kind==='sudoku'){ // a 3x3 box of a grid, part filled, with heavier box lines
    const v=['5','','8','','3','','1','','9']; let c='';
    v.forEach((n,i)=>{ const x=17+(i%3)*13, y=6+Math.floor(i/3)*15; c+=`<rect x="${x}" y="${y}" width="12" height="14" rx="1.5" fill="var(--panel)"/>`;
      if(n) c+=`<text x="${x+6}" y="${y+10.5}" font-size="9" font-weight="800" text-anchor="middle" fill="${i===4?a:s}" font-family="Inter,sans-serif">${n}</text>`; });
    return `<svg viewBox="0 0 74 58" width="76" height="60"><rect x="15" y="4" width="43" height="50" rx="3" fill="none" stroke="${a}" stroke-width="1.6"/>${c}</svg>`; }
  if(kind==='chess'){ // a corner of the board with a knight standing on it
    let c=''; for(let y=0;y<4;y++) for(let x=0;x<5;x++) c+=`<rect x="${4+x*13}" y="${4+y*12.5}" width="13" height="12.5" fill="${(x+y)%2?s:'var(--panel)'}" opacity="${(x+y)%2?.35:1}"/>`;
    return `<svg viewBox="0 0 74 58" width="76" height="60"><g>${c}</g><path d="M30 50h22l-1.5-5h-2.5c-1-6 1-10 4-15l-1-9c-1-3-4-6-9-7l-1.5-3-2 3.5-1.5-2-1 3.5c-4 3-6 7-7 12l3 2.5 3-2.5 4-1c-2 4-6 7-8 11v3h-2z" fill="${a}" stroke="var(--bg)" stroke-width="1.4" stroke-linejoin="round"/><circle cx="37" cy="21" r="1.3" fill="var(--accentInk)"/></svg>`; }
  if(kind==='quintessence'){ // a small board of element gems with a Prism star in the middle
    const g=(x,y,k)=>{ const o=[1,.55,.3][k]; return k===0?`<path d="M${x} ${y-6}l6 6-6 6-6-6z" fill="${a}" opacity="${o}"/>`:k===1?`<circle cx="${x}" cy="${y}" r="5.5" fill="${a}" opacity="${o}"/>`:`<rect x="${x-5}" y="${y-5}" width="10" height="10" rx="2.5" fill="${a}" opacity="${o+.15}"/>`; };

  if(kind==='nono'){ let c=''; const g=['01110','11011','11111','01010','01110']; g.forEach((r,y)=>[...r].forEach((v,x)=>{ c+=`<rect x="${10+x*10}" y="${3+y*10}" width="9" height="9" rx="1.5" fill="${v==='1'?s:'var(--panel)'}"/>`; })); return `<svg viewBox="0 0 70 56" width="74" height="58">${c}</svg>`; }

// ---------- stats: play time, days played ----------
// Launching a game records {id, t}. Back on the Arcade, the session ends at the game's last summary write
// (games write it when leaving and when hidden), or now; capped at 3 hours so an abandoned app can't inflate it.
const todayStr=()=>{ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
function settleSession(){ const o=A.open; if(!o) return; A.open=null;
  const s=summary(o.id), now=Date.now(); let end=s&&s.last>o.t?Math.min(s.last,now):now;
  const ms=Math.max(0,Math.min(end-o.t,3*36e5)); const st=A.stats[o.id]||(A.stats[o.id]={time:0,sessions:0,last:0});
  st.time+=ms; st.sessions++; st.last=Math.max(st.last,end); persist(); }
function countDay(){ const d=todayStr(); if(A.lastDay!==d){ A.lastDay=d; A.days=(A.days||0)+1; } }
const fmtTime=ms=>{ const m=Math.round(ms/6e4); if(!ms) return t('{0} min',0); if(m<1) return t('{0} min','<1'); if(m<60) return t('{0} min',m); const h=Math.floor(m/60), r=m%60; return r?t('{0} h {1} min',h,r):t('{0} h',h); };
const lastPlayed=id=>Math.max((A.stats[id]||{}).last||0,(summary(id)||{}).last||0);

// ---------- totals ----------
function totals(){ let got=0,all=0,played=0,time=0;
  LIVE.forEach(g=>{ const s=summary(g.id); time+=(A.stats[g.id]||{}).time||0; if(!s) return; played++;
    got+=s.ach.filter(a=>a[2]).length; all+=s.ach.length; });
  return {got,all,played,time}; }
const ago=ts=>{ const m=(Date.now()-ts)/6e4; if(m<2) return t('just now'); if(m<60) return t('{0} min ago',Math.round(m)); const h=m/60; if(h<24) return t('{0} h ago',Math.round(h)); const d=Math.round(h/24); return d===1?t('yesterday'):t('{0} days ago',d); };

// ---------- themes and milestones ----------
const THEMES=[
  {id:'classic',name:'Classic',light:['#1c1c1e','#fff'],dark:['#f2f2f4','#111214']},
  {id:'mint',name:'Mint',light:['#1f8a6d','#fff'],dark:['#4cc9a0','#0c1f19'],ms:'explorer'},
  {id:'ocean',name:'Ocean',light:['#2563eb','#fff'],dark:['#60a5fa','#0b1324'],ms:'collector'},
  {id:'sunset',name:'Sunset',light:['#e8590c','#fff'],dark:['#ff8c42','#1f0f05'],ms:'regular'},
  {id:'grape',name:'Grape',light:['#7c3aed','#fff'],dark:['#a78bfa','#140b26'],ms:'allrounder'},
  {id:'gold',name:'Gold',light:['#a87a06','#fff'],dark:['#f0c24b','#1d1505'],ms:'globetrotter'},
  {id:'rose',name:'Rose',light:['#db2777','#fff'],dark:['#f472b6','#25091a'],ms:'completionist'},
];
const MILESTONES=[
  {id:'explorer',name:'Explorer',desc:'Play 3 different games',goal:3,val:T=>T.played},
  {id:'collector',name:'Collector',desc:'Earn 25 achievements',goal:25,val:T=>T.got},
  {id:'regular',name:'Regular',desc:'Play on 7 different days',goal:7,val:()=>A.days||0},
  {id:'allrounder',name:'All-rounder',desc:'Reach level 5 in 3 games',goal:3,val:()=>LIVE.filter(g=>{ const s=summary(g.id); return s&&s.level>=5; }).length},
  {id:'globetrotter',name:'Globetrotter',desc:'Play every game',goal:LIVE.length,val:T=>T.played},
  {id:'completionist',name:'Completionist',desc:'Earn 100 achievements',goal:100,val:T=>T.got},
];
const themeOpen=th=>!th.ms||A.ms.includes(th.ms);
// Newly reached milestones are recorded (they stay unlocked) and announced once.
function checkMilestones(){ const T=totals(), fresh=MILESTONES.filter(m=>!A.ms.includes(m.id)&&m.val(T)>=m.goal);
  if(!fresh.length) return; fresh.forEach(m=>A.ms.push(m.id)); persist();
  const m=fresh[0], th=THEMES.find(x=>x.ms===m.id);
  setTimeout(()=>toast(t('Milestone: {0}',t(m.name))+(th?' · '+t('{0} theme unlocked',t(th.name)):'')),700); }

// ---------- appearance ----------
const darkMQ=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
const isDark=()=>A.set.appearance==='dark'||(A.set.appearance==='system'&&darkMQ&&darkMQ.matches);
function applyTheme(){ const d=isDark(), th=THEMES.find(x=>x.id===A.theme&&themeOpen(x))||THEMES[0], [ac,ink]=d?th.dark:th.light, R=document.documentElement;
  R.classList.toggle('dark',d); R.style.colorScheme=d?'dark':'light';
  R.style.setProperty('--accent',ac); R.style.setProperty('--accentInk',ink);
  document.body.classList.toggle('nomotion',!A.set.motion);
  $('meta[name=theme-color]').content=d?'#111214':'#f4f4f1'; }
if(darkMQ){ const f=()=>{ if(A.set.appearance==='system') applyTheme(); }; darkMQ.addEventListener?darkMQ.addEventListener('change',f):darkMQ.addListener(f); }
const buzz=ms=>{ if(A.set.haptics&&navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} };
let toastT=0; function toast(m,act,fn){ const el=$('#toast'); el.textContent=m;
  if(act){ const b=document.createElement('button'); b.textContent=act; b.style.cssText='margin-left:12px;font-weight:800;text-decoration:underline;color:inherit'; b.onclick=fn; el.appendChild(b); }
  el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),act?9000:2600); }
// A new version finished downloading in the background. It's already saved for offline use; reloading shows it.
if(navigator.serviceWorker) navigator.serviceWorker.addEventListener('message',e=>{ if(e.data&&e.data.type==='arcade-updated') toast(t('Arcade updated'),t('Reload'),()=>location.reload()); });
// Install: the browser offers it once the app qualifies; Settings shows the row only then.
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; if(cur==='set') renderSettings(); });
addEventListener('appinstalled',()=>{ installEvt=null; toast(t('Arcade installed')); if(cur==='set') renderSettings(); });

// ---------- navigation ----------
let cur='home';
function show(id){ cur=id; $$('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  if(id==='home') renderHome(); if(id==='prof') renderProfile(); if(id==='ach') renderAch(); if(id==='set') renderSettings(); }
document.addEventListener('click',e=>{ const g=e.target.closest('[data-go]'); if(g) show(g.dataset.go); });
function launch(g,hash){ buzz(12);
  if(!A.known.includes(g.id)) A.known.push(g.id);
  if(GAME_BUILDS[g.id]) A.seenBuild[g.id]=GAME_BUILDS[g.id];
  countDay(); A.open={id:g.id,t:Date.now()}; persist();
  if(A.set.fullscreen&&document.fullscreenEnabled&&!document.fullscreenElement) document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
  try{ sessionStorage.setItem('arcade.nav',g.id); }catch(e){}
  location.href=g.path+(hash||''); }
// Coming back from a game with the Back button restores this page from memory, so refresh what it shows.
addEventListener('pageshow',e=>{ if(e.persisted){ settleSession(); checkMilestones(); show(cur); } });

// ---------- home ----------
function badge(g){ if(!A.known.includes(g.id)) return 'New';
  const b=GAME_BUILDS[g.id], seen=A.seenBuild[g.id];
  if(b&&seen&&seen!==b) return 'Updated';
  if(b&&!seen&&summary(g.id)) A.seenBuild[g.id]=b; // played before badges existed: start tracking from here
  return ''; }
function sortedGames(){ const fav=g=>A.fav.includes(g.id)?0:1;
  return [...LIVE].sort((a,b)=>fav(a)-fav(b)||(A.sort==='az'?a.name.localeCompare(b.name,lang()):(lastPlayed(b.id)-lastPlayed(a.id))||LIVE.indexOf(a)-LIVE.indexOf(b))); }
function renderIdCard(){ const T=totals(), av=avatarById(A.avatar), pct=T.all?Math.round(T.got/T.all*100):0;
  $('#idCard').innerHTML=`${avatarSvg(av,58)}<div class="grow"><div class="t">${A.name?esc(A.name):t('Pick a username')}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="s">${T.all?t('{0} of {1} achievements',T.got,T.all):t('Your achievements from every game add up here.')}</div></div><span class="chev">${icon('chev')}</span>`; }
function renderHome(){ const T=totals(); translateStatic(); renderIdCard();
  const due=T.got>0||T.played>=2, last=A.bk.last||0, later=A.bk.later||0;
  $('#nudge').innerHTML=due&&Date.now()-last>30*864e5&&Date.now()-later>7*864e5?`<div class="card" style="flex-direction:column;align-items:stretch;gap:10px"><div><div class="t">${t('Back up your progress')}</div><div class="s">${last?t('Your last backup was {0}.',ago(last)):t('You haven\'t made a backup yet.')} ${t('Everything lives only on this device. One file covers every game.')}</div></div>
    <div style="display:flex;gap:8px"><button class="primary" style="width:auto;padding:10px 16px" id="nbGo">${t('Back up')}</button><button class="ghost" style="width:auto" id="nbLater">${t('Later')}</button></div></div>`:'';
  if($('#nbGo')){ $('#nbGo').onclick=openBackup; $('#nbLater').onclick=()=>{ A.bk.later=Date.now(); persist(); renderHome(); }; }
  $('#sortSeg').innerHTML=[['recent','Recent'],['az','A–Z']].map(([k,n])=>`<button data-sort="${k}" class="${A.sort===k?'on':''}">${t(n)}</button>`).join('');
  $$('[data-sort]').forEach(b=>b.onclick=()=>{ A.sort=b.dataset.sort; persist(); renderHome(); });
  $('#games').innerHTML=sortedGames().map(g=>{ const s=summary(g.id), tag=badge(g), fv=A.fav.includes(g.id);
    let ft;
    if(s){ const span=s.xpNext?s.xpNext-s.xpLevel:1, p=s.xpNext?Math.round((s.xp-s.xpLevel)/span*100):100;
      ft=`<span class="lv">${t('Lv {0}',s.level)}</span><div class="bar"><i style="width:${p}%"></i></div>`; }
    else ft=hasSave(g)?t('Open once to sync'):t('Not played yet');
    const lp=lastPlayed(g.id), sub=lp?t('Played {0}',ago(lp)):t(g.desc);
    return `<div class="game" role="button" tabindex="0" data-g="${g.id}">${tag?`<span class="tag">${t(tag)}</span>`:''}<button class="fav ${fv?'on':''}" data-fav="${g.id}" aria-label="${t('Favourite')}">${icon('star')}</button>
      <div class="art">${art(g.art)}</div><div class="nm">${g.name}</div><div class="ds">${sub}</div><div class="ft">${ft}</div></div>`; }).join('');
  persist();
  $$('.game[data-g]').forEach(b=>b.onclick=e=>{ if(e.target.closest('[data-fav]')) return; launch(gameById(b.dataset.g)); });
  $$('[data-fav]').forEach(b=>b.onclick=()=>{ const id=b.dataset.fav, i=A.fav.indexOf(id); i<0?A.fav.push(id):A.fav.splice(i,1); buzz(8); persist(); renderHome(); });
  const soon=GAMES.filter(g=>g.soon);
  $('#soon').innerHTML=soon.length?`<span>${t('Coming soon')}</span>`+soon.map(g=>`<span class="chip">${g.name}</span>`).join(''):'';
}

// ---------- combined backup ----------
// One code holds the Arcade's save plus every key each game owns. Format: ARCADE1Z.<base64url of gzipped JSON>,
// or ARCADE1.<base64url JSON> where the browser can't compress. Restore can bring back everything or one game.
const b64u=b=>{ let s=''; const a=new Uint8Array(b); for(let i=0;i<a.length;i+=0x8000) s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const unb64u=s=>{ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return Uint8Array.from(atob(s),c=>c.charCodeAt(0)); };
const pipe=async(bytes,T)=>new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(T)).arrayBuffer());
function ownedKeys(){ const out={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
  if(k&&(k.startsWith('arcade.')||LIVE.some(g=>k.startsWith(g.prefix)))) out[k]=localStorage.getItem(k); } return out; }
async function makeCode(){ const body=JSON.stringify({v:1,app:'arcade',t:Date.now(),keys:ownedKeys()}), raw=new TextEncoder().encode(body);
  if(window.CompressionStream) try{ return 'ARCADE1Z.'+b64u(await pipe(raw,new CompressionStream('gzip'))); }catch(e){}
  return 'ARCADE1.'+b64u(raw); }
async function readCode(txt){ const m=String(txt).match(/ARCADE1Z?\.[A-Za-z0-9_-]+/); if(!m) return null;
  let bytes=unb64u(m[0].slice(m[0].indexOf('.')+1)); if(m[0].startsWith('ARCADE1Z.')) bytes=await pipe(bytes,new DecompressionStream('gzip'));
  const o=JSON.parse(new TextDecoder().decode(bytes)); return o&&o.app==='arcade'&&o.keys?o:null; }
const fmtSize=n=>n<1024?t('{0} bytes',n):t('{0} KB',(n/1024).toFixed(1));
const stamp=()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

async function openBackup(){ const code=await makeCode(), T=totals();
  sheet(`<h2>${t('Backup & restore')}</h2><div class="sub">${t('One file with your profile, settings and every game\'s progress. Keep it somewhere safe, or use it to move to another device.')}</div>
    <div class="kv">${t('Achievements')}<span>${T.got}/${T.all||'–'}</span></div>${LIVE.map(g=>{ const s=summary(g.id); return `<div class="kv">${g.name}<span>${s?t('Level {0}',s.level):t('No progress yet')}</span></div>`; }).join('')}
    <div class="btns"><button class="primary" id="bkFile">${t('Save to file · {0}',fmtSize(code.length))}</button><button class="ghost" id="bkCopy" style="color:var(--ink)">${t('Copy backup code')}</button></div>
    <div class="slabel" style="margin-top:18px">${t('Restore')}</div>
    <textarea class="field" id="rsCode" placeholder="${t('Paste a backup code, or load a file')}" spellcheck="false"></textarea>
    <div class="btns"><button class="ghost" id="rsFile" style="color:var(--ink)">${t('Load from file…')}</button><button class="primary" id="rsGo">${t('Check backup')}</button><button class="ghost" data-close>${t('Close')}</button></div>
    <input type="file" id="rsPick" accept=".txt,text/plain" hidden>`);
  $('#bkFile').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'})); a.download=`arcade-backup-${stamp()}.txt`; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); A.bk.last=Date.now(); persist(); toast(t('Backup saved')); };
  $('#bkCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(code); A.bk.last=Date.now(); persist(); toast(t('Backup code copied')); }catch(e){ $('#rsCode').value=code; $('#rsCode').select(); toast(t('Select and copy the code below')); } };
  $('#rsFile').onclick=()=>$('#rsPick').click();
  $('#rsPick').onchange=async e=>{ const f=e.target.files[0]; if(f){ $('#rsCode').value=(await f.text()).trim(); $('#rsGo').click(); } };
  $('#rsGo').onclick=async()=>{ const v=$('#rsCode').value.trim();
    if(/SWEEP1Z?\./.test(v)){ toast(t('That\'s a Sweep-only backup. Restore it in Sweep → Settings.')); return; }
    let o=null; try{ o=await readCode(v); }catch(e){} if(!o){ toast(t('That doesn\'t look like an Arcade backup.')); return; }
    confirmRestore(o); };
}
function confirmRestore(o){ const K=o.keys, sum=id=>{ try{ return JSON.parse(K['arcade.summary.'+id]); }catch(e){ return null; } };
  const inBk=LIVE.filter(g=>Object.keys(K).some(k=>k.startsWith(g.prefix)));
  let pick='all', armed=false;
  const draw=()=>{ sheet(`<h2>${t('Restore backup')}</h2><div class="sub">${t('From {0}. This replaces what\'s on this device for what you pick.',new Date(o.t).toLocaleString(lang(),{dateStyle:'medium',timeStyle:'short'}))}</div>
    <div class="pick"><button data-p="all" class="${pick==='all'?'on':''}"><span>${t('Everything')}<br><small style="color:var(--sub)">${t('Profile, settings and all games')}</small></span>${pick==='all'?icon('check'):''}</button>
    ${inBk.map(g=>{ const s=sum(g.id); return `<button data-p="${g.id}" class="${pick===g.id?'on':''}"><span>${t('Only {0}',g.name)}<br><small style="color:var(--sub)">${s?t('Level {0}',s.level)+' · '+t('{0} achievements',s.ach.filter(a=>a[2]).length):t('Progress inside')}</small></span>${pick===g.id?icon('check'):''}</button>`; }).join('')}</div>
    <div class="btns"><button class="primary" id="rsYes">${armed?t('Tap again to replace'):t('Restore')}</button><button class="ghost" data-close>${t('Cancel')}</button></div>`);
    $$('[data-p]').forEach(b=>b.onclick=()=>{ pick=b.dataset.p; armed=false; draw(); });
    $('#rsYes').onclick=()=>{ if(!armed){ armed=true; draw(); return; } doRestore(K,pick); }; };
  draw(); }
function doRestore(K,pick){ const own=k=>pick==='all'?(k.startsWith('arcade.')||LIVE.some(g=>k.startsWith(g.prefix))):(k.startsWith(gameById(pick).prefix)||k==='arcade.summary.'+pick);
  Object.keys(ownedKeys()).filter(own).forEach(k=>localStorage.removeItem(k));
  Object.entries(K).filter(([k])=>own(k)).forEach(([k,v])=>{ try{ localStorage.setItem(k,v); }catch(e){} });
  if(pick==='all'){ A=Object.assign(defA(),read(AKEY)||{}); A.set=Object.assign(defSet(),A.set); if(!A.known) A.known=LIVE.map(g=>g.id); }
  persist(); hide(); applyTheme(); show('home'); toast(pick==='all'?t('Everything restored'):t('{0} restored',gameById(pick).name)); }

// ---------- start ----------
$('#icoA').innerHTML=icon('trophy'); $('#icoS').innerHTML=icon('gear'); $$('.topbar .iconbtn').forEach(b=>b.innerHTML=icon('back'));
$('#idCard').onclick=()=>show('prof');
settleSession(); applyTheme();
if(location.hash==='#prefs'){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} show('set'); } else show('home');
checkMilestones();
if(!A.name&&!A.askedName) setTimeout(()=>askName(false),migrated?600:350);
else if(migrated) toast(t('Your Sweep progress is here'));
else if(A.seenVer!==VERSION){ const since=A.seenVer; A.seenVer=VERSION; persist(); setTimeout(()=>openNews(since||'0.10'),500); }
</script>
<script>
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{scope:''}).then(reg=>{
  const c=navigator.serviceWorker.controller; if(c&&navigator.onLine) c.postMessage('arcade-repair');
  // Installed apps can stay open for days: re-check for updates when brought back, at most every 30 min.
  let last=Date.now(); document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&Date.now()-last>18e5){ last=Date.now(); reg.update().catch(()=>{}); } });
}).catch(()=>{}));
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
</script>
